 debug_hatch_egg:0 "#bold #color_red Отладка:#!#! Вывести дракона из яйца"
 debug_hatch_egg_bond_desc:0 "[recipient.GetName] установит связь с драконом, появившимся из этого яйца"
 debug_hatch_egg_own_desc:0 "[recipient.GetName] станет владельцем дракона, появившегося из этого яйца"
 debug_hatch_egg_own_pit_desc:0 "[recipient.GetEmployer.GetName] станет владельцем дракона, появившегося из этого яйца"

 demanded_egg_opinion:0 "Незаконно владеет драконьим яйцом"

 mde_grant_egg_permission:0 "Разрешить владение драконьим яйцом"
 mde_grant_egg_permission_desc:0 "Это лицо получит законное право владеть драконьими яйцами."
 mde_remove_egg_permission:0 "Запретить владение драконьим яйцом"
 mde_remove_egg_permission_desc:0 "Владение драконьими яйцами для этого лица будет считаться незаконным."
 mde_egg_access_gained_interface_tt:0 "[recipient.GetFullName] будет защищён от наших претензий на драконьи яйца."
 mde_egg_access_removed_interface_tt:0 "Мы сможем законно требовать любые драконьи яйца во владении [recipient.GetFullName]."

 take_prisoner_egg:0 "Изъять яйцо"
 take_prisoner_egg_desc:0 "[recipient.GetFullName] находится у нас в плену и незаконно владеет драконьим яйцом. Мы можем законно изъять его."
 mde_transfer_prison_egg_tt:0 "[actor.GetFullName] законно изымает [target.GetName]!"

 demanded_egg_interaction.t:0 "Требование драконьего яйца!"

 agot_dragon_hatching.0401.opt.b:0 "Мои дети!"


 mde_decisions_events.1000.t:0 "$dragon_egg_blue$"
 mde_decisions_events.1000.desc:0 "Многие строили догадки о диковинах, будто бы скрытых в Хайтауэре. Слухи подпитывали древность и таинственность самой башни, возведённой из чёрного маслянистого камня. После Танца Хайтауэры утратили былое положение и стали куда замкнутее, лишь усилив разговоры — в том числе о том, что в их руках может быть драконье яйцо.\n\nСлух оказался правдой: передо мной великолепное кобальтово-синее драконье яйцо. О комнате, где оно хранилось, я знал давно. Последние дни [tessarion.GetFirstName] почти неизвестны летописям, но Хайтауэры знали: она отложила яйцо, и дом веками держал эту тайну при себе.\n\nТеперь настал миг открыть её миру."
 mde_decisions_events.1000.desc_targs:0 "\n\nЕсли я раскрою тайну, Таргариены почти наверняка придут в ярость. Возможно, мудрее будет тихо передать яйцо им — как жест доброй воли, пока они не узнали о нём иначе."
 mde_decisions_events.1000.a:0 "Оно принадлежит дому [current_hightower.GetHouse.GetName]. Мы — достойнейшие хранители."
 mde_decisions_events.1000.b:0 "Оно должно быть у крови Старой Валирии."

 mde_decisions_events.1001.t:0 "$dragon_egg_blue$"
 mde_decisions_events.1001.desc:0 "Из Староместа до нас дошли вести о деле первостепенной важности. Хайтауэры со времён Танца скрывали в своей древней твердыне синее драконье яйцо, отложенное Тессарион. Последние дни этой драконицы доныне оставались для нас тайной.\n\nСкрывать от нас такое сокровище — измена высшего порядка. Возможно, окажись яйцо в правильных руках, из него появился бы дракон, и исчезновения драконов удалось бы избежать. Теперь его необходимо вернуть под надёжную охрану."
 mde_decisions_events.1001.a:0 "Яйцо нужно обезопасить!"
 mde_decisions_events.1001.b:0 "Теперь это всё равно не более чем камень."

 mde_decisions_events.1002.t:0 "$dragon_egg_blue$"
 mde_decisions_events.1002.desc:0 "Из Староместа прибыла большая, хорошо охраняемая свита с грузом несметной ценности. Согласно запечатанному письму от [current_hightower.GetName], Хайтауэры владели драконьим яйцом со времён Танца! Последние дни [tessarion.GetFirstName] долго оставались загадкой, но теперь стало известно: драконица отложила яйцо. Оно сияет кобальтово-синим оттенком. [current_hightower.GetName] предлагает вернуть его нам, надеясь искупить столь долгое сокрытие."
 mde_decisions_events.1002.a:0 "Наконец оно вернулось к нам."

 mde_decisions_events.3000.t:0 "Моя тайна раскрыта!"
 mde_decisions_events.3000.desc.intro:0 "Танец Драконов был хаотичным временем, и множество подробностей войны так и осталось вне летописей — в том числе последние дни драконицы Тессарион. Для нашего дома это не было тайной: мы знали, что одним из последних деяний драконицы стала кладка великолепного кобальтово-синего яйца.\n\n"
 mde_decisions_events.3000.desc.self:0 "Я раскрыл миру, что владею [ROOT.Char.Custom('HiddenArtifact')]."
 mde_decisions_events.3000.desc.other:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] открыл миру, что я владею [ROOT.Char.Custom('HiddenArtifact')]."
 mde_decisions_events.3000.desc.shared:0 "\n\nДом Хайтауэров владел этим яйцом со времён окончания Танца Драконов..."
 mde_decisions_events.3000.desc.targs:0 "\n\nТаргариены едва ли спокойно воспримут это откровение. Возможно, мудрее будет тихо вернуть яйцо — как жест доброй воли, пока они не узнали о нём иначе."
 mde_decisions_events.3000.a:0 "Оно принадлежит дому Хайтауэров."
 mde_decisions_events.3000.b:0 "Я верну его."
