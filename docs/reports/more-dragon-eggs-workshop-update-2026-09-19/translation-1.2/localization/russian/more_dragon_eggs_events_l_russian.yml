 agot_filler_crownlands.0004.t:0 "День на Драконьем Камне: Дары прошлого"
 agot_filler_crownlands.0004.desc:0 "Я поднимаюсь высоко по скалам Драконьего Камня; грохот волн внизу смешивается с глухим рокотом вулкана. Вскоре я замечаю узкий проход — идеальное начало для исследования пещер.\n\nПеребравшись через каменный гребень, я следую за светом, льющимся по скалам. От главного зала уходит несколько ходов, но луч пробивается только через единственную жилу обсидиана, словно указывая путь. Я иду за ним — и не верю глазам.\n\nВ центре зала лежит яйцо; свет обрывается прямо над ним! Но стоит мне прикоснуться к нему, как время напоминает о себе: луч начинает меркнуть. Я едва успеваю схватить яйцо и броситься прочь, прежде чем тьма запечатывает выход.\n\nТяжело дыша, я выбираюсь наружу с яйцом в руках!"
 agot_filler_crownlands.0004.a:0 "Было близко, но оно того стоило!"
 agot_filler_crownlands.0004.tt:0 "Вы получили драконье яйцо ([artifact|E])"


 agot_ninepenny.0034.c:0 "Для него будет вырезано новое королевство."
 agot_ninepenny.0035.b:0 "$agot_ninepenny.0031.a$ Оно получит более подходящее имя."
 agot_ninepenny.0035.b.tt:0 "#italic Королевство Тарт будет переименовано в Сапфировые острова!#!"

 a_crown_for_a_king_decision:0 "Корона для короля"
 a_crown_for_a_king_decision_desc:0 "Визерис недостоин быть королём Семи Королевств, но есть тот, кто достоин..."
 a_crown_for_a_king_decision_confirm:0 "Короновать его!"
 a_crown_for_a_king_decision_tooltip:0 "@warning_icon!#X Это сместит Визериса с места главы Таргариенов в изгнании!#!"

 agot_targaryen_exile_invasion.9999.t:0 "Корона для короля"
 agot_targaryen_exile_invasion.9999.desc:0 "Теперь, когда я возглавляю Изгнанников и несу на своих плечах всю династию Таргариенов, я должен решить, что делать с моим высокомерным и жестоким братом."
 agot_targaryen_exile_invasion.9999.b:0 "Помиловать его!"
 agot_targaryen_exile_invasion.9999.a:0 "Вручить ему корону, которую он заслужил!"

 agot_ruins.2001.t:0 "Сокровища из трагедии"
 agot_ruins.2001.d:0 "Руины Спайстауна давно окутаны зловещей мрачностью. Простолюдины рассказывают, что он заброшен так давно, что стал пристанищем проклятых духов. Из-за суеверий восстановление идёт с трудом. Но надежда вернуть городу былую славу центра торговли и золота придаёт сил.\n\nСегодня труды окупились! При раскопках последних руин, считавшихся проклятыми и нетронутыми со времён Битвы при Глотке, в обгоревшем здании нашли драконье яйцо!"
 agot_ruins.2001.a:0 "Счастливое предзнаменование!"
 agot_ruins.2001.b:0 "Лучше отдать нашему сюзерену."

 agot_ruins.2002.t:0 "Драконье яйцо предложено"
 agot_ruins.2002.d:0 "Мой вассал [egg_giver.GetName] находит яйцо при восстановлении руин Спайстауна! Более того, он предлагает его нам как законным хранителям."
 agot_ruins.2002.a:0 "Принимаем!"
 agot_ruins.2002.b:0 "Пусть оставит себе."

 mde_canon_dragon_clutch_events.0001.t:0 "Новая кладка от [dragon_parent.GetNameNoTooltip]!@historical_character_icon_small!"

 agot_ninepenny.1014.c:0 "Ночь ожила музыкой драконов! Это дитя — «Драконорождённый»!"
 agot_ninepenny.1014.d:0 "Несмотря на трагедию, с этим ребёнком остаётся надежда — это «Драконорождённый»."

 agot_dragon_hatching.0403.t:0 "Стая драконов"
 agot_dragon_hatching.0403.desc:0 "Драконы — своенравные создания, и обращаться с ними нужно вдумчиво и осторожно. Их сила и опасность превосходят всё, что известно миру, а об их беспокойной натуре нельзя забывать ни на миг. В древности для присмотра за этими чудесами создавались целые ордена."
 agot_dragon_hatching.0403.opt.a:0 "Поместить их в загон для драконов."
 agot_dragon_hatching.0403.opt.b:0 "Восстановить драконоблюстителей на Драконьей горе и держать драконов там."
 agot_dragon_hatching.0403.opt.c:0 "Восстановить драконоблюстителей на Драконьей горе, но оставить драконов здесь, со мной."
 agot_dragon_hatching.0403.opt.d:0 "Драконы останутся здесь, в моей драконьей яме."
 agot_dragon_hatching.0403.opt.e:0 "Драконы — не рабы. Пусть бродят где пожелают."
 agot_dragon_hatching.0403.opt.a.tt:0 "Все драконы без всадников будут перемещены в ваш загон для драконов."
 agot_dragon_hatching.0403.opt.b.tt:0 "Драконья гора снова станет действующей драконьей ямой, и туда будут помещены все драконы без всадников."
 agot_dragon_hatching.0403.opt.c.tt:0 "Драконья гора снова станет действующей драконьей ямой, но все драконы без всадников будут помещены в драконью яму вашей столицы."
 agot_dragon_hatching.0403.opt.d.tt:0 "Все драконы без всадников будут помещены в драконью яму вашей столицы."
 agot_dragon_hatching.0403.opt.e.tt:0 "Все драконы без всадников останутся вне драконьих ям.\n#X После вашей смерти они могут одичать!#"


 

 mde_egg_msg_found_intro:0 "Слухи о поразительной находке стремительно расходятся по гаваням и рыночным площадям:\n\n"
 mde_egg_msg_found_outro:0 "\n\nМногие гадают, вылупится ли оно когда-нибудь и что [mde_egg_owner.GetSheHe] станет с ним делать, если это случится."
 mde_egg_toast_clutch_t:0 "[dragon_parent.GetNameNoTooltip] откладывает кладку"
 mde_egg_toast_clutch:0 "С вестями воронов и рассказами моряков слух расходится от замка к гавани: драконица отложила яйца!\n\n[dragon_parent.GetName], [dragon_parent.Custom('GetDragonColorFull')] драконица, отложила для [mde_egg_owner.GetTitledFirstName] целую кладку, в том числе [mde_toast_egg.GetName].\n\nЕсли яйца вылупятся, миру придётся бояться ещё большего числа драконов."
 mde_egg_toast_pickup_t:0 "[mde_egg_owner.GetFirstNameNoTooltip] находит драконье яйцо!"
 mde_egg_toast_pickup_skagos:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в логове Каннибала на Скагосе.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_vale:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в пещере Огненной ведьмы, высоко в Лунных горах.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_isle_of_faces:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] на Острове Ликов.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_dragonstone:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в пещерах Драконьего Камня.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_spicetown:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] глубоко среди руин Спайстауна.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_old_wyk:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] у холма Нагги на Старом Вике.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_hellholt:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] среди останков Мераксес в Пекле.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_volantis:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в заброшенном валирийском лагере неподалёку от Волантиса.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_qohor_road:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] на старой дороге из Квохора в Валирию.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_red_lake:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в логове Среброкрылой у Красного озера.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_winterfell:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в криптах Винтерфелла.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_summerhall:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] среди руин Летнего замка.$mde_egg_msg_found_outro$"
 mde_egg_toast_restoration_t:0 "Драконье яйцо под обломками"
 mde_egg_toast_restoration_summerhall:0 "Каменщики и рабочие разносят весть из руин Летнего замка по всем трактирам Королевского тракта:\n\nРазбирая завалы, рабочие, восстанавливающие дворец, откопали [mde_toast_egg.GetName], и теперь яйцо находится в руках [mde_egg_owner.GetTitledFirstName].\n\nОдни называют находку благословением. Другие напоминают: из Летнего замка ещё никогда не выходило ничего доброго."
 mde_egg_toast_restoration_spicetown:0 "Каменщики и рабочие разносят весть из руин Спайстауна по всем портам Черноводного залива:\n\nРазбирая обгоревшие залы, рабочие, восстанавливающие город, откопали [mde_toast_egg.GetName], и теперь яйцо находится в руках [mde_egg_owner.GetTitledFirstName].\n\nПростолюдины шепчутся, что призраки Глотки наконец вернули хоть что-то."
 mde_egg_toast_expedition_t:0 "[mde_egg_owner.GetFirstNameNoTooltip] возвращается с драконьим яйцом"
 mde_egg_toast_expedition_valyria:0 "Моряки, клянущиеся, что собственными глазами видели Дымное море, повторяют в каждой гавани одну и ту же поразительную историю:\n\n[mde_egg_owner.GetTitledFirstName] возвращается из руин Валирии с [mde_toast_egg.GetName].\n\nМало кто отправляется к Четырнадцати Огням и возвращается, а с сокровищами — и того меньше."
 mde_egg_toast_expedition_adventure:0 "Путники и наёмники разносят весть о дерзкой экспедиции, вернувшейся домой:\n\nЭкспедиция, снаряжённая [mde_egg_owner.GetTitledFirstName], вернулась с [mde_toast_egg.GetName].\n\nГде именно его нашли, авантюристы предпочитают не рассказывать."
 mde_egg_toast_expedition_trade:0 "Купцы и капитаны кораблей говорят лишь об одном:\n\nТорговая экспедиция, снаряжённая [mde_egg_owner.GetTitledFirstName], вернулась из дальних земель, а среди её груза оказалось [mde_toast_egg.GetName].\n\nГоворят, никакая цена не сравнится с его истинной ценностью."
 mde_egg_toast_secret_t:0 "Скрытое яйцо Хайтауэров"
 mde_egg_toast_secret_hightower:0 "Сплетни расходятся из залов Староместа по всем уголкам державы:\n\nДом Хайтауэров долго скрывал драконье яйцо, но теперь [mde_egg_owner.GetTitledFirstName] являет миру [mde_toast_egg.GetName].\n\nПоговаривают, что мейстеры Цитадели крайне недовольны."
 mde_egg_toast_market_t:0 "Драконье яйцо на продажу"
 mde_egg_toast_market:0 "Великие рынки востока гудят от разговоров:\n\n[mde_toast_egg.GetName] появилось среди товаров на рынке артефактов и ждёт покупателя, достаточно богатого, чтобы его приобрести."
 mde_egg_toast_other_t:0 "Обнаружено драконье яйцо"
 mde_egg_toast_other:0 "По гаваням и купеческим залам расходятся слухи:\n\n[mde_toast_egg.GetName] оказалось в руках [mde_egg_owner.GetTitledFirstName]."
