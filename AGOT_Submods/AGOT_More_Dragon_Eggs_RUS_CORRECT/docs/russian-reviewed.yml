 setting_absolute_spawn_ai_desc:0 "Первый персонаж ИИ, посетивший соответствующее место или принявший соответствующее решение, гарантированно получит драконьи яйца."
 setting_no_spawns_ai:0 "Без находок — ИИ"
 setting_no_spawns_ai_desc:0 "Персонажи ИИ не смогут находить драконьи яйца на карте: ни в местах изучения драконов, ни в Винтерфелле, ни с помощью решений вроде «День на Драконьем Камне», «Уединиться в Летнем замке» или «Восстановить Летний замок»."
 setting_spawn_dragonstone_eggs_disabled_ai_blocked:0 "Отключено для ИИ"
 setting_spawn_dragonstone_eggs_disabled_ai_blocked_desc:0 "Событие изучения драконов на Драконьем Камне недоступно ИИ, чтобы избежать переизбытка яиц. Событие «День на Драконьем Камне» и вдохновения авантюристов, связанные с Драконьим Камнем, остаются без изменений."
