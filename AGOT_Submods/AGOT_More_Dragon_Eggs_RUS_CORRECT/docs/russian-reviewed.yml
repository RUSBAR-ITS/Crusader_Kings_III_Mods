 mde_dragon_contains_embryo:0 "Внутри — дракон по имени #italic [ROOT.Artifact.Custom('mde_dragon_embryo_name')]#!."
 mde_dragon_contains_embryo_hatching:0 "Внутри — дракон по имени #italic [Artifact.Custom('mde_dragon_embryo_name')]#!."
 agot_dragon_hatching.0403.t:0 "Стая драконов"
 agot_dragon_hatching.0403.desc:0 "Драконы — существа своенравные, и обращаться с ними нужно осмотрительно и терпеливо. Их могущество и опасность, которую они несут, превосходят всё в известном мире. Особенно важно помнить об их неукротимом нраве. В былые времена для заботы об этих чудесных созданиях учреждали целые ордены."
 agot_dragon_hatching.0403.opt.a:0 "Поместить их в загон для драконов."
 agot_dragon_hatching.0403.opt.a.tt:0 "Всех драконов, не связанных с наездниками, переместят в ваш загон для драконов."
 agot_dragon_hatching.0403.opt.b:0 "Восстановить орден драконоблюстителей на Драконьей горе и содержать драконов там."
 agot_dragon_hatching.0403.opt.b.tt:0 "Драконья гора вновь начнёт действовать как логово, и туда поместят всех драконов, не связанных с наездниками."
 agot_dragon_hatching.0403.opt.c:0 "Восстановить орден драконоблюстителей на Драконьей горе, но оставить драконов здесь, при мне."
 agot_dragon_hatching.0403.opt.c.tt:0 "Драконья гора вновь начнёт действовать как логово, но всех драконов, не связанных с наездниками, поместят в логово вашей столицы."
 agot_dragon_hatching.0403.opt.d:0 "Драконы останутся здесь, в моём логове."
 agot_dragon_hatching.0403.opt.d.tt:0 "Всех драконов, не связанных с наездниками, поместят в логово вашей столицы."
 agot_dragon_hatching.0403.opt.e:0 "Дракон — не раб. Пусть летает где пожелает."
 agot_dragon_hatching.0403.opt.e.tt:0 "Все драконы, не связанные с наездниками, останутся вне логов.\n#X После вашей смерти эти драконы могут одичать!#!"
 mde_egg_msg_found_intro:0 "Слухи об удивительной находке разносятся по гаваням и рыночным площадям:\n\n"
 mde_egg_msg_found_outro:0 "\n\nМногие гадают, вылупится ли из яйца дракон и как [mde_egg_owner.GetSheHe] тогда распорядится этой силой."
 mde_egg_toast_clutch_t:0 "Новая кладка — [dragon_parent.GetNameNoTooltip]"
 mde_egg_toast_clutch:0 "На крыльях воронов и в рассказах моряков от замка к гавани летит весть: дракон отложил яйца!\n\n[dragon_parent.GetName], [dragon_parent.Custom('GetDragonColorFull')] зверь, приносит кладку своему хозяину — [mde_egg_owner.GetTitledFirstName]. Среди яиц — [mde_toast_egg.GetName].\n\nЕсли они вылупятся, в мире станет больше драконов, которых следует бояться."
 mde_egg_toast_expedition_t:0 "Возвращение с драконьим яйцом — [mde_egg_owner.GetFirstNameNoTooltip]"
 mde_egg_toast_expedition_adventure:0 "Путники и наёмники разносят весть о возвращении смелых искателей приключений:\n\nЭкспедиция, средства на которую выделяет [mde_egg_owner.GetTitledFirstName], вернулась с находкой — [mde_toast_egg.GetName].\n\nО том, где удалось отыскать яйцо, участники похода предпочитают молчать."
 mde_egg_toast_expedition_trade:0 "Купцы и капитаны кораблей говорят лишь об одном:\n\nТорговая экспедиция, средства на которую выделяет [mde_egg_owner.GetTitledFirstName], вернулась из далёких земель. Среди её грузов — [mde_toast_egg.GetName].\n\nГоворят, никакое золото не сравнится с ценностью этой находки."
 mde_egg_toast_expedition_valyria:0 "Моряки, клянущиеся, что своими глазами видели Дымное море, рассказывают в каждой гавани одну и ту же удивительную историю:\n\n[mde_egg_owner.GetTitledFirstName] возвращается из руин Валирии с находкой — [mde_toast_egg.GetName].\n\nМало кто возвращается из плавания к Четырнадцати Огням, а с сокровищами — и того меньше."
 mde_egg_toast_market_t:0 "Драконье яйцо на продажу"
 mde_egg_toast_market:0 "Купцы на великих рынках востока оживлённо обсуждают новость:\n\nСреди товаров на рынке артефактов появилось [mde_toast_egg.GetName]. Оно ждёт покупателя, достаточно богатого, чтобы заполучить его."
 mde_egg_toast_other_t:0 "Обнаружено драконье яйцо"
 mde_egg_toast_other:0 "По гаваням и купеческим палатам расходится слух:\n\nУ драконьего яйца [mde_toast_egg.GetName] появился новый владелец — [mde_egg_owner.GetTitledFirstName]."
 mde_egg_toast_pickup_t:0 "Находка драконьего яйца — [mde_egg_owner.GetFirstNameNoTooltip]!"
 mde_egg_toast_pickup_dragonstone:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в пещерах Драконьего Камня.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_hellholt:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] среди останков Мераксес в Пекле.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_isle_of_faces:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] на Острове Ликов.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_old_wyk:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] на Холме Нагги, на Старом Вике.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_qohor_road:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] у старой дороги из Квохора в Валирию.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_red_lake:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в логове Среброкрылой у Алого озера.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_skagos:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в логове Каннибала на Скагосе.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_spicetown:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в глубине руин Спайстауна.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_summerhall:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в руинах Летнего замка.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_vale:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в пещере Огненной Ведьмы, высоко в Лунных горах.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_volantis:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в заброшенном валирийском лагере близ Волантиса.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_winterfell:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в крипте Винтерфелла.$mde_egg_msg_found_outro$"
 mde_egg_toast_restoration_t:0 "Драконье яйцо под обломками"
 mde_egg_toast_restoration_spicetown:0 "Каменщики и рабочие разносят весть из руин Спайстауна по всем портам Черноводного залива:\n\nРасчищая выгоревшие залы, строители, восстанавливающие город, обнаружили [mde_toast_egg.GetName]. Теперь им владеет [mde_egg_owner.GetTitledFirstName].\n\nПростой люд шепчется, что призраки Глотки наконец отдали хоть что-то взамен."
 mde_egg_toast_restoration_summerhall:0 "Каменщики и рабочие разносят весть из руин Летнего замка по всем трактирам вдоль Королевского тракта:\n\nРазбирая завалы, строители, восстанавливающие дворец, обнаружили [mde_toast_egg.GetName]. Теперь им владеет [mde_egg_owner.GetTitledFirstName].\n\nОдни называют находку благословением. Другие говорят, что из Летнего замка никогда не приходило ничего доброго."
 mde_egg_toast_secret_t:0 "Тайное яйцо Хайтауэров"
 mde_egg_toast_secret_hightower:0 "Из чертогов Староместа слухи расходятся по всему королевству:\n\nДом Хайтауэров долго скрывал драконье яйцо. Теперь [mde_egg_owner.GetTitledFirstName] являет миру семейную тайну — [mde_toast_egg.GetName].\n\nГоворят, мейстеры Цитадели крайне недовольны."
