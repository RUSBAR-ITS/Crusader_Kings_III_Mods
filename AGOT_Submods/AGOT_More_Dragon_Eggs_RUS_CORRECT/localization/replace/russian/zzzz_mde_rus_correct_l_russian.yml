 mde_canon_dragon_clutch_events.0001.t:0 "Новая кладка от [dragon_parent.GetNameNoTooltip]!@historical_character_icon_small!"
 mde_decisions_events.1000.desc:0 "Многие строили догадки о диковинах, будто бы скрытых в Хайтауэре. Слухи подпитывали древность и таинственность самой башни, возведённой из чёрного маслянистого камня. После Танца Хайтауэры утратили былое положение и стали куда замкнутее, лишь усилив разговоры — в том числе о том, что в их руках может быть драконье яйцо.\n\nСлух оказался правдой: передо мной великолепное кобальтово-синее драконье яйцо. О комнате, где оно хранилось, мне давно было известно. Последние дни [tessarion.GetFirstName] почти неизвестны летописям, но Хайтауэры знали: она отложила яйцо, и дом веками держал эту тайну при себе.\n\nТеперь настал миг открыть её миру."
 mde_decisions_events.3000.desc.other:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] объявляет миру, что я владею [ROOT.Char.Custom('HiddenArtifact')]."
 mde_decisions_events.3000.desc.self:0 "Я объявляю миру, что владею [ROOT.Char.Custom('HiddenArtifact')]."
 mde_dragon_animation_idle_tt:0 "#T Покой#!\nВключить анимацию спокойного дракона."
 mde_dragon_animation_roar_fire_tt:0 "#T Пламя#!\nВключить анимацию дракона, изрыгающего пламя."
 mde_dragon_animation_roar_tt:0 "#T Рёв#!\nВключить анимацию драконьего рёва. Недоступно для драконят."
 mde_dragon_contains_embryo:0 "Внутри — дракон по имени #italic [ROOT.Artifact.Custom('mde_dragon_embryo_name')]#!."
 mde_dragon_contains_embryo_hatching:0 "Внутри — дракон по имени #italic [Artifact.Custom('mde_dragon_embryo_name')]#!."
 mde_dragon_eggs_events.0001.desc:0 "Грозный и жестокий дракон [cannibal.GetName] был печально известен мерзкими деяниями, за которые и получил своё имя. Ни Таргариены, ни драконоблюстители не смогли усмирить чудовище — тем более помешать ему пожирать собственных сородичей.\n\nВ летописях появление [cannibal.GetNamePossessive] столь же загадочно, как и исчезновение. Многие считают, что он родился ещё до драконов Завоевателя.\n\nДостоверно известно лишь одно: [cannibal.GetName] исчез вскоре после Танца Драконов. Ходили слухи, будто он улетел вглубь Скагоса, привлечённый родственными душами. Судя по обсидиановым шрамам на лесной почве вокруг, эти слухи могли быть правдой."
 mde_dragon_eggs_events.0001.t:0 "Драконьи знания: Каннибалы Скагоса"
 mde_dragon_eggs_events.0002.desc:0 "Во времена Танца Драконов в Долине обитал дикий дракон [sheepstealer.GetName], получивший имя за любовь к баранине.\n\nЕго смогла приручить [nettles.GetName] — единственная предполагаемая всадница дракона в Вестеросе, не происходившая от Таргариенов. Она завоевывала его доверие, день за днём приманивая овцами. Ходили слухи, что [nettles.GetName] была дочерью или возлюбленной [daemon.GetName].\n\nВо время Танца [nettles.GetName] и [sheepstealer.GetName] исчезли и больше не появлялись.\n\nВ Лунных горах живёт клан Обгорелых. Их обряд взросления требует, чтобы юноши принесли дары огненной ведьме и прошли сквозь пламя, доказывая свою мужественность. Многие считают, что огненная ведьма — именно она."
 mde_dragon_eggs_events.0002.t:0 "Драконьи знания: Огненная ведьма Долины"
 mde_dragon_eggs_events.0004.a:0 "Страшитесь моей мощи!"
 mde_dragon_eggs_events.0004.desc:0 "Следуя по обсидиановым шрамам леса, вы замечаете, что их становится всё больше в одном направлении. Вы идёте по этому следу, пока он не выводит к устью огромной пещеры.\n\nЗатаив дыхание, вы входите внутрь. Стены испещрены красной краской и обсидианом, пол усеян костями.\n\nВ центре пещеры — ритуальная яма с курганом из черепов: кроликов, медведей, оленей, великанов, единорогов и людей. На вершине высится огромный череп, чьи глазницы горят злым зелёным светом.\n\nВзобравшись на курган, вы находите невероятное сокровище — драконье яйцо!"
 mde_dragon_eggs_events.0004.t:0 "Драконьи знания: Курган Каннибала"
 mde_dragon_eggs_events.0005.desc:0 "После многих дней расспросов местные наконец указывают путь к Обгорелым.\n\nПоднимаясь в горы, вы избегаете встреч с ними. Тропа ритуала отмечена скелетами юношей; на некоторых костях видны следы ожогов.\n\nТо ли благодаря удаче, то ли благодаря умению, вы находите пещеру огненной ведьмы, не столкнувшись с Обгорелыми. Внутри стены покрыты тысячами знаков, словно обезумевший серый крысомейстер остался без бумаги. В углу, под слоем пыли, лежит коричневое драконье яйцо!"
 mde_dragon_eggs_events.0005.t:0 "Драконьи знания: Пещера огненной ведьмы"
 mde_dragon_eggs_events.0006.a:0 "Судьба ждёт."
 mde_dragon_eggs_events.0006.desc:0 "Жуткий шёпот в голове заставляет меня замереть, оставляя лишь ледяной страх.\n\nПротив воли я поворачиваюсь к Острову Ликов, иду к нему, а затем плыву.\n\nВыбравшись на берег, я вижу, как деревья истекают кровью. Из чащи чардрев выглядывает укрытая тенью фигура с сияющими зелёными глазами, и ужас поглощает меня.\n\nОчнувшись на берегу Божьего Ока, в растерянности и тревоге, я обнаруживаю в руках драконье яйцо."
 mde_dragon_eggs_events.0006.t:0 "Драконьи знания: Остров Ликов"
 mde_dragon_eggs_events.0007.desc:0 "Я поднимаюсь высоко по скалам Драконьего Камня; грохот волн внизу смешивается с глухим рокотом вулкана. Вскоре я замечаю узкий проход — идеальное начало для исследования пещер.\n\nПеребравшись через каменный гребень, я следую за светом, льющимся по скалам. От главного зала уходит несколько ходов, но луч пробивается только через единственную жилу обсидиана, словно указывая путь. Я иду за ним — и не верю глазам.\n\nВ центре зала лежит яйцо; свет обрывается прямо над ним! Но стоит мне прикоснуться к нему, как время напоминает о себе: луч начинает меркнуть. Я едва успеваю схватить яйцо и броситься прочь, прежде чем тьма запечатывает выход.\n\nТяжело дыша, я выбираюсь наружу с яйцом в руках!"
 mde_dragon_eggs_events.0007.desc_missing:0 "Я поднимаюсь высоко по скалам Драконьего Камня; грохот волн внизу смешивается с глухим рокотом вулкана. Вскоре я замечаю узкий проход — идеальное начало для исследования пещер.\n\nПеребравшись через каменный гребень, я следую за светом, льющимся по скалам. От главного зала уходит несколько ходов, но луч пробивается только через единственную жилу обсидиана, словно указывая путь. Я иду за ним — и не верю глазам.\n\nВ центре зала лежит кладка яиц; свет обрывается прямо над ней! Но стоит мне прикоснуться к яйцам, как время напоминает о себе: луч начинает меркнуть. Я едва успеваю схватить их и броситься прочь, прежде чем тьма запечатывает выход.\n\nТяжело дыша, я выбираюсь наружу с яйцами в руках! Мне удалось найти пропавшие драконьи яйца [aegon_ii.GetNamePossessive] — те самые, что в последний раз видели у [valarr.GetName]!"
 mde_dragon_eggs_events.0007.t:0 "Драконьи знания: Дары прошлого"
 mde_dragon_eggs_events.0007.tt:0 "Вы получили драконье яйцо!"
 mde_dragon_eggs_events.0008.a:0 "Трагедия, от которой веет холодом."
 mde_dragon_eggs_events.0008.desc:0 "Битва при Глотке стала одним из самых печально известных сражений Танца Драконов — гражданской войны Таргариенов, ослабившей их могущество. Союз зелёных с Триархией завершился ударом огромной армады по веларионской блокаде Глотки — стратегической узости, перекрывавшей снабжение Королевской Гавани.\n\nБитва обернулась пирровой победой чёрных: им удалось удержать блокаду и разгромить армаду Триархии, но цена оказалась страшной. Принц [jaecaerys.GetName] и его дракон [vermax.GetName] погибли, а Спайстаун был сожжён дотла. Легенды гласят, что невеста [jaecaerys.GetNamePossessive], [baela.GetName], и её дракон [moondancer.GetName] вместе скорбели среди руин."
 mde_dragon_eggs_events.0008.t:0 "Драконьи знания: Руины Спайстауна"
 mde_dragon_eggs_events.0009.a:0 "Проблеск света среди трагедии."
 mde_dragon_eggs_events.0009.desc:0 "Мрачные руины Спайстауна тяготят меня, и я решаю задержаться здесь, чтобы осмотреть их внимательнее.\n\nБродя среди полуразрушенных строений, я нахожу большой обгоревший участок, нетронутый со времён разрушения. Перебирая камни на полу, я краем глаза замечаю цветное мерцание — резкий контраст с чёрно-серой разрухой вокруг.\n\nЯ выкапываю цветные камни из земли и с изумлением смотрю на то, что держу в руках. Драконье яйцо! Слухи о скорбящей [moondancer.GetName] оказались правдой — мне удалось найти её яйцо."
 mde_dragon_eggs_events.0009.t:0 "Драконьи знания: В глубине руин Спайстауна"
 mde_dragon_eggs_events.0010.desc:0 "Тысячи лет назад, в Век Героев, многие легенды родились из чудес и ужасов той древней поры. Величайшая из них — легенда о [nagga.GetName], чьи огромные кости стали священным местом для железнорождённых. Здесь стоял трон [grey_king.GetName], и здесь веками проводились королевские веча.\n\nСказания железнорождённых гласят, что [nagga.GetName] была первым морским драконом, питалась левиафанами и кракенами, а её ярость была так велика, что она могла топить целые острова. Эти подвиги лишь возвеличили славу [grey_king.GetName]: он убил чудовище, воздвиг чертог из её костей, обогрел его её живым огнём, сделал трон из её челюсти, а корону — из зубов.\n\nТеперь здесь зловеще тихо, но исполинские кости всё ещё внушают первобытный ужас."
 mde_dragon_eggs_events.0010.t:0 "Драконьи знания: Кости Нагги"
 mde_dragon_eggs_events.0011.b:0 "Утонувший бог дарует! @drownedgod_icon!"
 mde_dragon_eggs_events.0011.desc:0 "Кажется, сама судьба привела меня к жутким останкам великого чудовища [nagga.GetName] именно в день небывало низкого отлива — такого, что случается раз в жизни.\n\nЖелезнорождённые называют подобные отливы дурным знаком, но из глубины меня зовёт нечто тёмное и неодолимое. Я подчиняюсь этому зову и почти инстинктивно иду к обнажившемуся берегу, ступая по следам древнего королевского веча. У воды лежит древнее оружие, покрытое ржавчиной, кораллами и ракушками. Я погружаюсь в глубину, крестя себя солью и позволяя морю наполнить лёгкие.\n\nЯ теряю сознание. Последнее, что помню, — нечто могущественное, быть может, существо... и что-то в моих руках. Очнувшись, я лежу на песчаном берегу, а рядом сияет кобальтово-синее драконье яйцо."
 mde_dragon_eggs_events.0011.t:0 "Драконьи знания: Древнее королевское вече"
 mde_dragon_eggs_events.0012.desc:0 "Долго я странствовал по знойным пустыням Дорна, и путь вдали от Дюнных дорог стал мучительным. Ближайшая крепость, Пекло, сулит лишь призрачную передышку, но выбора нет. По мере приближения серные испарения из соседних источников и гейзеров застилают солнце, лишь усиливая жар. Я замечаю, что главная башня так и не была восстановлена со времён Завоевания.\n\nРазрушение стало следствием гибели всадницы дракона [rhaenys.GetName] и её дракона [meraxes.GetName]. Во время кампании по усмирению дорнийцев [rhaenys.GetName] сжигала замки драконьим пламенем. Уллеры из Пекла сделали невозможное: выстрелом скорпиона пробили глаз [meraxes.GetName], отправив всадницу и дракона в смертельное падение. Кости [meraxes.GetNamePossessive] до сих пор торчат из остекленевшего песка."
 mde_dragon_eggs_events.0012.t:0 "Драконьи знания: Болт в Пекле"
 mde_dragon_eggs_events.0013.desc:0 "При ближайшем осмотре скелета [meraxes.GetNamePossessive] я поражаюсь силе драконьего пламени. Окружающая земля — сплошное стекло из расплавленного песка, по большей части тёмное и непрозрачное.\n\nНо под свежими слоями грязи стекло становится чище. Поддавшись одержимости, я ищу самый прозрачный участок.\n\nПосле часов поисков я нахожу стекло, сквозь которое пробивается золотисто-серебристое мерцание. Прикрыв находку, я возвращаюсь под покровом темноты с киркой и раскапываю сокровище: драконье яйцо!"
 mde_dragon_eggs_events.0013.t:0 "Драконьи знания: Сквозь драконье стекло"
 mde_dragon_eggs_events.0014.desc:0 "После Рока осталось мало драконовладык. Лишь благодаря магическому предвидению Дейнис Сновидицы дом Таргариенов сумел удержать свою плоть из огня. Но сразу после Рока были и другие.\n\nДжейхелор Матэрион был землевладельцем и драконоводцем Валирийского Фригольда. Он летал на драконе [pythax.GetName] и, судя по его трудам о стеклянных оранжереях-сферах самой Валирии, был учёным с особым даром к ботанике.\n\nКогда Рок потряс небо и землю, Джейхелор Матэрион собирал образцы в лесах Квохора. По пути из Квохора в Старый Волантис он пролетел над этим самым местом, а остаток жизни посвятил тому, чтобы восстановить по памяти свои сады. Его дракон [pythax.GetName] вскоре погиб, отказавшись от еды. Сам Джейхелор Матэрион умер вскоре после этого, вмешавшись в порку раба на Длинном мосту."
 mde_dragon_eggs_events.0014.t:0 "Драконьи знания: Садовник стеклянной сферы"
 mde_dragon_eggs_events.0015.a:0 "Последний дар Стеклянного Садовника!"
 mde_dragon_eggs_events.0015.desc:0 "Известно, что он разбивал лагерь именно здесь, но следов почти не осталось. Продираясь сквозь густые заросли в поисках места для собственного лагеря, я нахожу предметы, явно принадлежавшие знатному выходцу из Фригольда.\n\nЯ иду по хаотичному следу разбросанных валирийских артефактов — каждый из них, несомненно, стоит целое состояние. Но в грязи, почти полностью зарытый и замаскированный землёй, лежит нетронутый сундук, явно оставленный в спешке.\n\nС огромным трудом я выкапываю сундук и срываю его с окаменевших петель. Внутри обнаруживается сокровище ценнее всех окружающих трофеев: драконье яйцо!"
 mde_dragon_eggs_events.0015.t:0 "Драконьи знания: Оставлено в спешке"
 mde_dragon_eggs_events.0016.desc:0 "После Рока осталось мало драконовладык. Лишь благодаря магическому предвидению Дейнис Сновидицы дом Таргариенов сумел удержать свою плоть из огня. Но сразу после Рока были и другие.\n\nАурион Варезис был, пожалуй, самым известным из них: могущественный драконовладыка Валирийского Фригольда, оказавшийся в Квохоре, когда Рок потряс небо и землю. Поняв, что теперь никто не способен сравниться с его силой, Аурион Варезис собрал войско в 30 000 человек и провозгласил себя первым императором Валирии. Аурион Варезис, его грозный дракон [vassarion.GetName] и великое войско двинулись на юг из Квохора, чтобы отвоевать Валирию, не встретив сопротивления. Но едва они вошли в земли Рока, их больше никто не видел."
 mde_dragon_eggs_events.0016.t:0 "Драконьи знания: Император, которого не было"
 mde_dragon_eggs_events.0017.a:0 "Вырвано из мёртвых рук!"
 mde_dragon_eggs_events.0017.desc:0 "Известно, что его войско разбивало лагерь здесь по пути из Квохора в Валирию. По прошествии стольких лет следов почти не осталось. Однако сохранилась валирийская статуя, созданная воинами Императорской армии в память о погибших в катастрофе — вероятно, об их далёких и ныне утраченных семьях.\n\nВалирийские письмена здесь высечены не огнём, а грубо, металлом, и я едва различаю фразу о чём-то внизу. Доверившись инстинкту, я копаю под статуей и нахожу тайник с оружием — и нечто куда более ценное: золотое драконье яйцо!"
 mde_dragon_eggs_events.0017.t:0 "Драконьи знания: Золотое яйцо"
 mde_dragon_no_parent_line:0 "Происхождение этого яйца неизвестно."
 mde_dragon_parent_line:0 "Это яйцо отложено драконом по имени [Artifact.MakeScope.Var('dragon_parent').GetCharacter.GetName]."
 mde_dragon_parents_line:0 "Родители этого яйца — [Artifact.MakeScope.Var('dragon_parent').GetCharacter.GetName] и [Artifact.MakeScope.Var('dragon_parent_other').GetCharacter.GetName]."
 mde_dragon_portrait_toggle_tt:0 "#T Портрет дракона#!\nПоказать или скрыть портрет дракона."
 mde_dragonkeeper_liege:0 "#V [AGOTGetName(Artifact.GetOwner)], $head_dragonkeeper_court_position$ при дворе правителя [AGOTGetName(Artifact.GetOwner.GetLiege)].#!"
 mde_egg_msg_found_intro:0 "Слухи об удивительной находке разносятся по гаваням и рыночным площадям:\n\n"
 mde_egg_msg_found_outro:0 "\n\nМногие гадают, вылупится ли из яйца дракон и как [mde_egg_owner.GetSheHe] тогда распорядится этой силой."
 mde_egg_toast_clutch:0 "На крыльях воронов и в рассказах моряков от замка к гавани летит весть: дракон отложил яйца!\n\n[dragon_parent.GetName], [dragon_parent.Custom('GetDragonColorFull')] зверь, приносит кладку своему хозяину — [mde_egg_owner.GetTitledFirstName]. Среди яиц — [mde_toast_egg.GetName].\n\nЕсли они вылупятся, в мире станет больше драконов, которых следует бояться."
 mde_egg_toast_clutch_t:0 "Новая кладка — [dragon_parent.GetNameNoTooltip]"
 mde_egg_toast_expedition_adventure:0 "Путники и наёмники разносят весть о возвращении смелых искателей приключений:\n\nЭкспедиция, средства на которую выделяет [mde_egg_owner.GetTitledFirstName], вернулась с находкой — [mde_toast_egg.GetName].\n\nО том, где удалось отыскать яйцо, участники похода предпочитают молчать."
 mde_egg_toast_expedition_t:0 "Возвращение с драконьим яйцом — [mde_egg_owner.GetFirstNameNoTooltip]"
 mde_egg_toast_expedition_trade:0 "Купцы и капитаны кораблей говорят лишь об одном:\n\nТорговая экспедиция, средства на которую выделяет [mde_egg_owner.GetTitledFirstName], вернулась из далёких земель. Среди её грузов — [mde_toast_egg.GetName].\n\nГоворят, никакое золото не сравнится с ценностью этой находки."
 mde_egg_toast_expedition_valyria:0 "Моряки, клянущиеся, что своими глазами видели Дымное море, рассказывают в каждой гавани одну и ту же удивительную историю:\n\n[mde_egg_owner.GetTitledFirstName] возвращается из руин Валирии с находкой — [mde_toast_egg.GetName].\n\nМало кто возвращается из плавания к Четырнадцати Огням, а с сокровищами — и того меньше."
 mde_egg_toast_market:0 "Купцы на великих рынках востока оживлённо обсуждают новость:\n\nСреди товаров на рынке артефактов появилось [mde_toast_egg.GetName]. Оно ждёт покупателя, достаточно богатого, чтобы заполучить его."
 mde_egg_toast_market_t:0 "Драконье яйцо на продажу"
 mde_egg_toast_other:0 "По гаваням и купеческим палатам расходится слух:\n\nУ драконьего яйца [mde_toast_egg.GetName] появился новый владелец — [mde_egg_owner.GetTitledFirstName]."
 mde_egg_toast_other_t:0 "Обнаружено драконье яйцо"
 mde_egg_toast_pickup_dragonstone:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в пещерах Драконьего Камня.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_hellholt:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] среди останков Мераксес в Пекле.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_isle_of_faces:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] на Острове Ликов.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_old_wyk:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] на Холме Нагги, на Старом Вике.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_qohor_road:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] у старой дороги из Квохора в Валирию.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_red_lake:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в логове Среброкрылой у Алого озера.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_skagos:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в логове Каннибала на Скагосе.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_spicetown:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в глубине руин Спайстауна.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_summerhall:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в руинах Летнего замка.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_t:0 "Находка драконьего яйца — [mde_egg_owner.GetFirstNameNoTooltip]!"
 mde_egg_toast_pickup_vale:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в пещере Огненной Ведьмы, высоко в Лунных горах.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_volantis:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в заброшенном валирийском лагере близ Волантиса.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_winterfell:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] находит [mde_toast_egg.GetName] в крипте Винтерфелла.$mde_egg_msg_found_outro$"
 mde_egg_toast_restoration_spicetown:0 "Каменщики и рабочие разносят весть из руин Спайстауна по всем портам Черноводного залива:\n\nРасчищая выгоревшие залы, строители, восстанавливающие город, обнаружили [mde_toast_egg.GetName]. Теперь им владеет [mde_egg_owner.GetTitledFirstName].\n\nПростой люд шепчется, что призраки Глотки наконец отдали хоть что-то взамен."
 mde_egg_toast_restoration_summerhall:0 "Каменщики и рабочие разносят весть из руин Летнего замка по всем трактирам вдоль Королевского тракта:\n\nРазбирая завалы, строители, восстанавливающие дворец, обнаружили [mde_toast_egg.GetName]. Теперь им владеет [mde_egg_owner.GetTitledFirstName].\n\nОдни называют находку благословением. Другие говорят, что из Летнего замка никогда не приходило ничего доброго."
 mde_egg_toast_restoration_t:0 "Драконье яйцо под обломками"
 mde_egg_toast_secret_hightower:0 "Из чертогов Староместа слухи расходятся по всему королевству:\n\nДом Хайтауэров долго скрывал драконье яйцо. Теперь [mde_egg_owner.GetTitledFirstName] являет миру семейную тайну — [mde_toast_egg.GetName].\n\nГоворят, мейстеры Цитадели крайне недовольны."
 mde_egg_toast_secret_t:0 "Тайное яйцо Хайтауэров"
