 agot_dragon_maintenance.0800.dragonpits:0 "Показать действующие драконьи ямы"
 agot_filler_crownlands.0004.desc:0 "Я поднимаюсь высоко по скалам Драконьего Камня; грохот волн внизу смешивается с глухим рокотом вулкана. Вскоре я замечаю узкий проход — идеальное начало для исследования пещер.\n\nПеребравшись через каменный гребень, я следую за светом, льющимся по скалам. От главного зала уходит несколько ходов, но луч пробивается только через единственную жилу обсидиана, словно указывая путь. Я иду за ним — и не верю глазам.\n\nВ центре зала лежит яйцо; свет обрывается прямо над ним! Но стоит мне прикоснуться к нему, как время напоминает о себе: луч начинает меркнуть. Я едва успеваю схватить яйцо и броситься прочь, прежде чем тьма запечатывает выход.\n\nТяжело дыша, я выбираюсь наружу с яйцом в руках!"
 agot_filler_crownlands.0004.t:0 "День на Драконьем Камне: Дары прошлого"
 agot_filler_crownlands.0004.tt:0 "Вы получили драконье яйцо ([artifact|E])"
