l_russian:
  #Major 
 rule_use_dragon_pit_mover:0 "@mde_icon!@dragon_majestic_icon!More Dragon Eggs — перемещение в драконью яму"
 setting_use_dragon_pit_mover_no:0 "Базовые настройки AGOT"
 setting_use_dragon_pit_mover_yes:0 "@mde_icon!More Dragon Eggs"
  
 setting_use_dragon_pit_mover_no_desc:0 "Отключает добавленную More Dragon Eggs функцию. В базовом AGOT её аналога нет."
 setting_use_dragon_pit_mover_yes_desc:0 "Включает меню перемещения драконов между драконьими ямами из More Dragon Eggs."
  
 rule_mde_buttons:0 "@mde_icon!@dragon_majestic_icon!Дополнительный интерфейс More Dragon Eggs"
 setting_mde_buttons_off:0 "Выключено"
 setting_mde_buttons_standard:0 "Стандарт"
 setting_mde_buttons_all:0 "Все"

 setting_mde_buttons_off_desc:0 "Все кнопки MDE изначально скрыты. Их можно включить в меню MDE, которое открывается из меню паузы."
 setting_mde_buttons_standard_desc:0 "Кнопки драконьих ям, драконов, яиц и меню MDE изначально показаны. Королевскую гвардию и валирийскую сталь можно включить в меню MDE."
 setting_mde_buttons_all_desc:0 "Изначально показаны все кнопки MDE: драконьи ямы, драконы, яйца, Королевская гвардия, валирийская сталь и меню MDE."
  #Hatching 
 rule_can_hatch_multiple_dragons:0 "@mde_icon!@hatching_icon!Выведение нескольких драконов за церемонию"
 setting_can_hatch_multiple_dragons_no:0 "Невозможно"
 setting_can_hatch_multiple_dragons_yes_5_percent:0 "Да — 5% для каждого яйца"
 setting_can_hatch_multiple_dragons_yes_25_percent:0 "Да — 25% для каждого яйца"
 setting_can_hatch_multiple_dragons_yes_50_percent:0 "Да — 50% для каждого яйца"
 setting_can_hatch_multiple_dragons_yes_75_percent:0 "Да — 75% для каждого яйца"
 setting_can_hatch_multiple_dragons_yes_95_percent:0 "Да — 95% для каждого яйца"
 setting_can_hatch_multiple_dragons_yes_all:0 "Все яйца дадут драконов"
  
 setting_can_hatch_multiple_dragons_no_desc:0 "При успешной церемонии дракон появится только из выбранного яйца. Остальные яйца не получат шанса."
 setting_can_hatch_multiple_dragons_yes_5_percent_desc:0 "При успешной церемонии каждое яйцо, кроме выбранного, получит 5% шанс дать дракона."
 setting_can_hatch_multiple_dragons_yes_25_percent_desc:0 "При успешной церемонии каждое яйцо, кроме выбранного, получит 25% шанс дать дракона."
 setting_can_hatch_multiple_dragons_yes_50_percent_desc:0 "При успешной церемонии каждое яйцо, кроме выбранного, получит 50% шанс дать дракона."
 setting_can_hatch_multiple_dragons_yes_75_percent_desc:0 "При успешной церемонии каждое яйцо, кроме выбранного, получит 75% шанс дать дракона."
 setting_can_hatch_multiple_dragons_yes_95_percent_desc:0 "При успешной церемонии каждое яйцо, кроме выбранного, получит 95% шанс дать дракона."
 setting_can_hatch_multiple_dragons_yes_all_desc:0 "При успешной церемонии из каждого драконьего яйца в инвентаре персонажа появится принадлежащий ему дракон."
  
 rule_dragon_hatching_success_chance:0 "@mde_icon!@hatching_icon!Шанс успешного выведения дракона"
 setting_dragon_hatching_guaranteed:0 "Гарантировано"
 setting_dragon_hatching_normal:0 "По умолчанию"
 setting_dragon_hatching_not:0 "Неудача"
  
 setting_dragon_hatching_guaranteed_desc:0 "Церемония выведения дракона всегда завершится успехом."
 setting_dragon_hatching_normal_desc:0 "Церемония выведения дракона использует стандартные шансы успеха и провала."
 setting_dragon_hatching_not_desc:0 "Церемония выведения дракона всегда завершится неудачей."
  
 rule_extant_hatching_ceremonies:0 "@mde_icon!@hatching_icon!Церемонии выведения всегда доступны"
 setting_extant_hatching_ceremonies_yes:0 "Да"
 setting_extant_hatching_ceremonies_no:0 "Нет"
  
 setting_extant_hatching_ceremonies_yes_desc:0 "Церемонии доступны, если в мире существуют драконы."
 setting_extant_hatching_ceremonies_no_desc:0 "Церемонии недоступны, если в мире существуют драконы."
  #Egg + Dragonlore 
 rule_dragon_egg_spawn_likelihood_player:0 "@mde_icon!@iceFire_dragon_egg_icon!Находки драконьих яиц на карте — игрок"
 setting_no_spawns:0 "Без появления для игроков"
 setting_1_in_1200:0 "1/1200"
 setting_absolute_spawn:0 "Гарантировано для игроков"
  
 setting_no_spawns_desc:0 "Игроки не смогут получить драконьи яйца на карте: ни в местах, связанных с драконьими знаниями, ни в Винтерфелле, ни через решения вроде «Дня на Драконьем Камне», бегства в Летний замок или восстановления Летнего замка."
 setting_1_in_1200_desc:0 "Вероятность получить драконьи яйца при посещении соответствующего места или принятии решения для игрока — около 1/1200 (0,083%)."
 setting_absolute_spawn_desc:0 "Первый игрок, посетивший соответствующую локацию или принявший нужное решение, гарантированно получит драконье яйцо."
  
 rule_spawn_cannibal_egg:0 "@mde_icon!@wildfire_dragon_egg_icon!Яйцо Каннибала"
