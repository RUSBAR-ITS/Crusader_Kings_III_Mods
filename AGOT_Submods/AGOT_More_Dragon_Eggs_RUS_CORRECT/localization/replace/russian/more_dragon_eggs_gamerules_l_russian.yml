 setting_spawn_dragonstone_eggs_enabled_desc:0 "Яйца Нессариона, Мераксес, Вхагар, Ртути, Пламенной Мечты, Мелеис, Среброкрылой, Вермитора, Сиракс и Караксеса можно найти на Драконьем Камне."
 setting_spawn_dragonstone_eggs_disabled_desc:0 "Событие о драконьих знаниях на Драконьем Камне останется, но при обычном посещении драконье яйцо больше не появится. Событие «День на Драконьем Камне» и вдохновения авантюристов, направленные на Драконий Камень, останутся без изменений."
  
  
  
  
