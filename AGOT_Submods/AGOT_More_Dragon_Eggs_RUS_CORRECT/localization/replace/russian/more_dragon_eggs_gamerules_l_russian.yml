 setting_canon_dragon_egg_hatch_likelihood_never_desc:0 "Канонические драконьи яйца никогда не вылупятся в колыбели, в драконьей яме или как дополнительные яйца на церемонии выведения, если соответствующая настройка не установлена на «Всегда». Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_less_likely_desc:0 "Канонические драконьи яйца реже вылупляются в колыбели, в драконьей яме или как дополнительные яйца на церемонии выведения. Эффект складывается с соответствующими настройками. Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_default_desc:0 "Канонические драконьи яйца используют те же шансы, что и остальные яйца, в колыбели, в драконьей яме и как дополнительные яйца на церемонии выведения. Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_more_likely_desc:0 "Канонические драконьи яйца чаще вылупляются в колыбели, в драконьей яме или как дополнительные яйца на церемонии выведения. Эффект складывается с соответствующими настройками. Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_common_desc:0 "Канонические драконьи яйца имеют высокий шанс вылупиться в колыбели, в драконьей яме или как дополнительные яйца на церемонии выведения. Эффект складывается с соответствующими настройками. Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_guaranteed_desc:0 "Канонические драконьи яйца не станут бесплодными в колыбели или драконьей яме, если соответствующая настройка не установлена на «Никогда», и всегда вылупятся как дополнительные яйца на церемонии выведения. Действует только при включённых канонических драконах."
  
