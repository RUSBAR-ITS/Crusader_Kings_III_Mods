 mde_dragon_eggs_events.0016.desc:0 "Few were the dragonlords following the Doom. It was only with the magical foresight of Daenys the Dreamer that the Targaryens were able to hold on to their fire made flesh. Although, in the time immediately after the Doom, there were others.\n\n Aurion was perhaps the most well known of them. Aurion Varezys was a powerful dragonlord in the Valyrian Freehold. When the Doom shook the heavens and earth, Aurion Varezys was visiting Qohor. Upon his realization that there was no other who could rival his power, Aurion Varezys raised a host 30,000 strong and proclaimed himself the first Emperor of Valyria. Aurion Varezys, his fearsome dragon [vassarion.GetName], and his great host all marched south from Qohor with the goal of retaking Valyria, unopposed. However, the moment they crossed into the doom was the last that any had ever seen of them."
