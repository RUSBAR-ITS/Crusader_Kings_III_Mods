 agot_dragon_hatching.0403.desc:0 "Dragons are tenuous beasts, and must be handled thoughtfully and diligently, for the power they possess and the danger they pose are greater than anything in the known world, especially lest one forget their restless nature. In times of old orders of men were built to maintain these wonders."
