 ### Character Editor Skills ###
 ### Character Editor Titles and Crown Authority ###
 DI_ce_tab_titles: "Титулы"
 DI_ce_tab_crown_authority: "Авторитет Короны"
 DI_ce_take_realm_titles_button: "Держава"
 DI_ce_take_realm_titles_button_tt: "Объединить все титулы уровня графства и выше верховной суверенной державы каждого редактируемого персонажа с титулами этого персонажа. При отсутсвии закрепленных персонажей редактируемым персонажем является игрок. Исключаются титулы дворянских семей и титулы безземельных авантюристов."
 DI_ce_take_sub_realm_titles_button: "Владение"
 DI_ce_take_sub_realm_titles_button_tt: "Объедините все титулы уровня графства и выше, которыми обладает каждый редактируемый персонаж или любой другой персонаж ниже его по статусу, с титулами редактируемого персонажа. При отсутсвии закрепленных персонажей редактируемым персонажем является игрок."
 DI_ce_take_vassal_titles_button: "Вассалы"
 DI_ce_take_vassal_titles_button_tt: "Объединить все титулы уровня графства и выше, которыми обладают вассалы каждого редактируемого персонажа, с титулами самого редактируемого персонажа. Личные титулы редактируемого персонажа не учитываются."
 DI_ce_take_personal_titles_button: "Домен"
 DI_ce_take_personal_titles_button_tt: "Передать игроку все титулы уровня графства и выше, которыми лично обладают закрепленные персонажи. При этом всегда используются закрепленные персонажи, независимо от того, установлен ли флажок «Закрепленные персонажи»."
 DI_ce_take_primary_title_button: "Главный"
 DI_ce_take_primary_title_button_tt: "Передать игроку главный титул каждого закрепленного персонажа. При этом всегда используются закрепленные персонажи, независимо от того, установлен ли флажок «Закрепленные персонажи»."
 DI_ce_crown_authority_1_button: "1 - Автономные Вассалы"
 DI_ce_crown_authority_1_button_tt: "Установить для каждого редактируемого правителя уровень авторитета короны 1 (автономные вассалы)."
