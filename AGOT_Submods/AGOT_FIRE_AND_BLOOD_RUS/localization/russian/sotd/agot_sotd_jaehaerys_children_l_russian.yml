l_russian:
 fab_children.0900.t:0 "Дракон в Штормовом Пределе"
 fab_children.0900.desc:0 "Едва я начал оплакивать свою мать, как Рейна спустилась в Штормовой Предел. Она берет [storm_lord.GetTitledFirstName] за бороду на глазах у всего его двора и кладет смерть Матери к его ногам. Он должен беречь детей, которых оставила Мать. Если он возьмет еще одну жену или будет плохо с ней обращаться, говорит она ему, Штормовой Предел будет гореть, как горел Харренхол. Лорд отвечает достаточно смело. Руки его выдают."
 fab_children.0900.a:0 "Моя сестра сказала то, что сказал бы я."
 fab_children.1000.t:0 "Мирийская кровавая баня"
 fab_children.1000.desc.holder_dragon:0 "[lord_tarth.GetTitledFirstName] посылает воронов на каждый корабль, покидающий Сапфировый остров. Мирийские изгнанники пересекли воду, захватили восточный берег Тарта и предали деревни мечу и огню. [aemon.GetFirstName] просит разрешения сесть на [aemon_dragon.GetFirstName] и идти впереди королевского флота. Он присоединится к лорду Тарта, познает силу врага и будет удерживать высоты, пока не появятся наши паруса. Его рассуждения здравы. Я слышал и худшее от командиров, вдвое старше его, и многое бы отдал за повод отказать ему."
 fab_children.1000.desc.holder:0 "[lord_tarth.GetTitledFirstName] посылает воронов на каждый корабль, покидающий Сапфировый остров. Мирийские изгнанники пересекли воду, захватили восточный берег Тарта и предали деревни мечу и огню. [aemon.GetFirstName] просит разрешения идти впереди королевского флота. Он присоединится к лорду Тарта, познает силу врага и будет удерживать высоты, пока не появятся наши паруса. Его рассуждения здравы. Я слышал и худшее от командиров, вдвое старше его, и многое бы отдал за повод отказать ему."
 fab_children.1000.desc.dragon:0 "Вороны прибывают на каждом корабле, покидающем Сапфировый остров. Мирийские изгнанники пересекли воду, захватили восточный берег Тарта и предали деревни мечу и огню. [aemon.GetFirstName] просит разрешения сесть на [aemon_dragon.GetFirstName] и идти впереди королевского флота. Он присоединится к защитникам Тарта, познает силу врага и будет удерживать высоты, пока не появятся наши паруса. Его рассуждения здравы. Я слышал и худшее от командиров, вдвое старше его, и многое бы отдал за повод отказать ему."
 fab_children.1000.desc.fallback:0 "Вороны прибывают на каждом корабле, покидающем Сапфировый остров. Мирийские изгнанники пересекли воду, захватили восточный берег Тарта и предали деревни мечу и огню. [aemon.GetFirstName] просит разрешения идти впереди королевского флота. Он присоединится к защитникам Тарта, познает силу врага и будет удерживать высоты, пока не появятся наши паруса. Его рассуждения здравы. Я слышал и худшее от командиров, вдвое старше его, и многое бы отдал за повод отказать ему."
 fab_children.1000.a:0 "Тогда он идет впереди флота."
 fab_children.1000.b:0 "Нет. Я пошлю корабли и солдат, но не моего сына."
 fab_children.1006.t:0 "Девятый день Третьей луны"
 fab_children.1006.desc.rhaenys_dragon:0 "На девятый день третьей луны я выхожу с [aemon.GetFirstName] к [aemon_dragon.GetFirstName]. Он только что узнал, что [rhaenys.GetFirstName] носит ребенка, и эта новость сделала его прощание мягче, но не облегчила его. Он обещает ей короткую войну. Мне он говорит о ветрах, разведчиках и медленном сборе флота, пока [aemon_dragon.GetFirstName] царапает камни. Я сам застегиваю плащ моего сына, как делал это, когда он был мальчиком, и ничего не говорю ему о том, чего боюсь."
 fab_children.1006.desc.rhaenys:0 "На девятый день третьей луны я иду по [aemon.GetFirstName] к ожидающим кораблям. Он только что узнал, что [rhaenys.GetFirstName] носит ребенка, и эта новость сделала его прощание мягче, но не облегчила его. Он обещает ей короткую войну. Мне он говорит о ветрах, разведчиках и медленном сборе флота, как будто тщательные планы могут заменить то, о чем никто из нас не скажет. Я сам застегиваю его плащ, как делал это, когда он был мальчиком, и ничего не говорю ему о том, чего боюсь."
 fab_children.1006.desc.dragon:0 "На девятый день третьей луны я выхожу с [aemon.GetFirstName] к [aemon_dragon.GetFirstName]. Он говорит о ветрах, разведчиках и медленном сборе флота, как будто тщательные планы могут заменить то, о чем никто из нас не скажет. [aemon_dragon.GetFirstName] беспокоится за небо. Я сам застегиваю плащ моего сына, как делал это, когда он был мальчиком, и ничего не говорю ему о том, чего боюсь."
 fab_children.1006.desc.fallback:0 "На девятый день третьей луны я иду по [aemon.GetFirstName] к ожидающим кораблям. Он говорит о ветрах, разведчиках и медленном сборе флота, как будто тщательные планы могут заменить то, о чем никто из нас не скажет. Я сам застегиваю его плащ, как делал это, когда он был мальчиком, и ничего не говорю ему о том, чего боюсь."
 fab_children.1006.a:0 "Отправляйся. Ветер попутный."
 fab_children.1007.t:0 "Перед флотом"
 fab_children.1007.desc.holder_dragon:0 "Тень [aemon_dragon.GetFirstName] пересекает Тарт, прежде чем на горизонте [lord_tarth.GetTitledFirstName] появляется единственный королевский парус. Мирийцы удерживают восточное побережье, но правитель Тарта отступил в горы, а люди все еще верны острову. Мой сын спускается к кострам и начинает работу, которую я ему поручил: считать корабли, отмечать пути, подготавливать высоты для армии позади него. Его ворон спокоен. Я прочитал это три раза, пытаясь найти то, что он упустил."
 fab_children.1007.desc.holder:0 "[aemon.GetFirstName] достигает Тарта до того, как на горизонте [lord_tarth.GetTitledFirstName] появляется единственный королевский парус. Мирийцы удерживают восточное побережье, но правитель Тарта отступил в горы, а люди все еще верны острову. Мой сын присоединяется к их лагерю и начинает работу, которую я ему поручил: считать корабли, отмечать пути, подготавливать высоты для армии позади него. Его ворон спокоен. Я прочитал это три раза, пытаясь найти то, что он упустил."
 fab_children.1007.desc.dragon:0 "Тень [aemon_dragon.GetFirstName] пересекает Тарт, прежде чем на горизонте появляется единственный королевский парус. Мирийцы удерживают восточное побережье, но защитники острова отступили в горы. Мой сын спускается к кострам и начинает работу, которую я ему поручил: считать корабли, отмечать пути, подготавливать высоты для армии позади него. Его ворон спокоен. Я прочитал это три раза, пытаясь найти то, что он упустил."
 fab_children.1007.desc.fallback:0 "[aemon.GetFirstName] достигает Тарта прежде, чем на горизонте появляется единственный королевский парус. Мирийцы удерживают восточное побережье, но защитники острова отступили в горы. Мой сын присоединяется к их лагерю и начинает работу, которую я ему поручил: считать корабли, отмечать пути, подготавливать высоты для армии позади него. Его ворон спокоен. Я прочитал это три раза, пытаясь найти то, что он упустил."
 fab_children.1007.a:0 "Флот должен поторопиться."
 fab_children.1008.t:0 "Двое мужчин в горах"
 fab_children.1008.desc.holder_dragon:0 "Следующий отчет начинается с того, что два мирийских разведчика поднимаются слишком близко к лагерю, а [aemon_dragon.GetFirstName] ждет под хребтом. Они находят [aemon.GetFirstName] советующимся с [lord_tarth.GetTitledFirstName] возле командной палатки. Один разведчик взят живым. Другой направляет арбалет на лорда Тарта, а мой сын стоит у него на плече."
 fab_children.1008.desc.holder:0 "Следующий отчет начинается с того, что два мирийских разведчика забираются слишком близко к лагерю. Они находят [aemon.GetFirstName] советующимся с [lord_tarth.GetTitledFirstName] возле командной палатки. Один разведчик взят живым. Другой направляет арбалет на лорда Тарта, а мой сын стоит у него на плече."
 fab_children.1008.desc.dragon:0 "Следующий отчет начинается с того, что два мирийских разведчика поднимаются слишком близко к лагерю, а [aemon_dragon.GetFirstName] ждет под хребтом. Они находят [aemon.GetFirstName] на совете с защитниками Тарта возле командной палатки. Один разведчик взят живым. Другой направляет арбалет на командира острова, а мой сын стоит у него на плече."
 fab_children.1008.desc.fallback:0 "Следующий отчет начинается с того, что два мирийских разведчика забираются слишком близко к лагерю. Они находят [aemon.GetFirstName] на совете с защитниками Тарта возле командной палатки. Один разведчик взят живым. Другой направляет арбалет на командира острова, а мой сын стоит у него на плече."
 fab_children.1008.a:0 "Прочитай мне остальное."
 fab_children.1002.t:0 "Арбалетная стрела в горле"
 fab_children.1002.desc:0 "Стрела, предназначенная для лорда Тарта, не попадает в цель и попадает [aemon.GetFirstName] в горло. Нет ни последней команды, ни прощания. Ни один мейстер в этом лагере не настолько быстр, чтобы что-то изменить, и люди вокруг моего сына ничего не могут сделать, кроме как удерживать его, пока его топит собственная кровь. Я прочитал ворона один раз, затем еще раз, пока чернила вообще ничего не значили. Он вернется домой в костер, как всегда делает наша кровь, и от него не останется ничего, что можно было бы хоронить по-вестерозийски."
 fab_children.1002.a:0 "Мой сын мертв."
 fab_children.1003.t:0 "Стрела пролетает мимо"
 fab_children.1003.desc:0 "Арбалетчик проигрывает, но [aemon.GetFirstName] оборачивается на крик. Железо разрывает ему шею, вместо того, чтобы вонзиться в горло. За раной следует лихорадка, и три ночи лагерь готовится к победе и костру принца. На четвертое утро он пьет, разговаривает и хочет знать, прибыл ли наконец флот."
 fab_children.1003.a:0 "Привези его ко мне домой. Медленно и на корабле."
 fab_children.1004.t:0 "Ответ брата"
 fab_children.1004.desc:0 "[baelon.GetFirstName] не просит моего отпуска. Он садится на [baelon_dragon.GetFirstName], пересекает воду и нападает на мирийские корабли, пока люди все еще несут его брата вниз с горы. Мачты становятся факелами. Палубы раскалываются от жары, и те, кто достигает берега, обнаруживают, что их ждут мечи Тарта. Певцы назовут это победой. Это был брат, которому некуда было девать свое горе. Когда он возвращается, от него все еще пахнет дымом, и я обнимаю его, не говоря ни слова об отпуске, о котором он так и не просил."
 fab_children.1004.a:0 "Я понимаю, сын мой."
 fab_children.1005.t:0 "Пустой стул"
 fab_children.1005.desc:0 "Я распускаю суд и сажусь с [alysanne.GetFirstName], где ни один член совета не может увидеть, как мы терпим неудачу. Мы говорим о драконьем яйце, которое я положила в его колыбель в ночь после его рождения, о Дейнерис, приказывающей своему младшему брату ходить по двору, о принце, которым мы просили его стать, ни разу не спросив, сколько оно весит. Алисанна произносит его имя, пока ее голос не прерывается. Потом мы сидим, и никто из нас не встает, чтобы зажечь свечи."
 fab_children.1005.a:0 "Произноси его имя так часто, как тебе нужно, Алисанна."
 fab_children.1010.t:0 "Вопрос престолонаследия"
 fab_children.1010.desc.baelon:0 "Кресло Эймона пустует, но его место в преемственности не уходит вместе с ним в землю. [senior_claimant.GetTitledFirstName], его живой ребенок, стоит первым в старшей линии. У [baelon.GetTitledFirstName] есть возраст, служба и предпочтения каждого лорда, который настаивает на том, чтобы корона проходила через мужчину. Законы, над созданием которых я работал всю жизнь, не дают мне однозначного ответа. Трон следует за старшей ветвью, или за ближайшим человеком, или за каким-то другим живым наследником моей крови, и я должен сказать, за кем."
 fab_children.1010.desc.rhaenys:0 "Кресло Эймона пустует, но его место в преемственности не уходит вместе с ним в землю. [senior_claimant.GetTitledFirstName], его живой ребенок, стоит первым в старшей очереди, а другие моей крови будут настаивать на своих требованиях по возрасту, полу, службе и близости. Законы, над созданием которых я работал всю жизнь, не дают мне однозначного ответа. Какое бы имя я ни произнес, сегодня кто-то из моей семьи узнает, что оно принадлежало не ему."
 fab_children.1010.a:0 "Род Эймона не заканчивается на Эймоне. Я называю [senior_claimant.GetFirstName]."
 fab_children.1010.b:0 "Королевству нужен взрослый мужчина. Мой выбор — [baelon.GetFirstName]."
 fab_children.1010.c:0 "Представьте мне всех живых претендентов моей крови."
 fab_children.1010.desc.baelon_multi:0 "Кресло Эймона пустует, но его место в преемственности не уходит вместе с ним в землю. Он оставил после себя не один живой претендент, и [senior_claimant.GetTitledFirstName] стоит среди них в старшей линейке. У [baelon.GetTitledFirstName] есть возраст, служба и предпочтения каждого лорда, который настаивает на том, чтобы корона проходила через мужчину. Законы, над созданием которых я работал всю жизнь, не дают мне однозначного ответа. Трон следует за старшей ветвью, или за ближайшим человеком, или за каким-то другим живым наследником моей крови, и я должен сказать, за кем."
 fab_children.1010.desc.senior_multi:0 "Кресло Эймона пустует, но его место в преемственности не уходит вместе с ним в землю. Он оставил после себя не один живой претендент, и [senior_claimant.GetTitledFirstName] стоит среди них в старшей линейке. Другие моей крови будут настаивать на своих правах на возраст, пол, службу и близость. Законы, над созданием которых я работал всю жизнь, не дают мне однозначного ответа. Какое бы имя я ни произнес, сегодня кто-то из моей семьи узнает, что оно принадлежало не ему."
 fab_children.1010.desc.none:0 "Кресло Эймона пустует, и на этот раз от него не осталось ничего, чтобы заполнить его. Ни один ребенок в его жизни, ни один брат не стоит наготове, и петиции на моем столе доказывают интересы мужчин и женщин, которые я едва могу изобразить на диаграмме. Законы, которые я готовил всю жизнь, не дали мне здесь однозначного ответа, и сегодня они также не дают мне никакого кандидата."
 fab_children.1010.d:0 "Нет никого. Дело подождет, и оно будет стоить мне сна."
 fab_children.1014.t:0 "Вторая ссора"
 fab_children.1014.desc.baelon:0 "Алисанна получила мою прокламацию без присутствия придворного, который мог бы смягчить ее. Она спрашивает, почему [rhaenys.GetFirstName] должна потерять наследство, которое без споров принадлежало бы ей, если бы у нее родился сын. Я отвечаю миром, прецедентом и опасностями, которые собираются вокруг женской короны. Любая причина звучит холоднее, если говорить вслух женщине, которая помогла мне построить это царство. Если женщина для меня менее полезна, чем мужчина, говорит она, то я не могу больше нуждаться в ней. Прежде чем я успеваю перезвонить, ее домочадцы готовятся к Драконьему Камню."
 fab_children.1014.desc.other:0 "Алисанна получила мою прокламацию без присутствия придворного, который мог бы смягчить ее. Она спрашивает, почему [rhaenys.GetFirstName] должен потерять наследство Эймона в пользу [chosen_heir.GetTitledFirstName]. Я отвечаю миром, прецедентом и бременем правления. Любая причина звучит холоднее, если говорить вслух женщине, которая помогла мне построить это царство. Если ее совет и требование женщины так мало значат, говорит она, то она мне больше не нужна. Прежде чем я успеваю перезвонить, ее домочадцы готовятся к Драконьему Камню."
 fab_children.1014.desc.fallback:0 "Алисанна получила мою прокламацию без присутствия придворного, который мог бы смягчить ее. Она спрашивает, как я могу ответить на одну смерть, отведя старшую линию для [chosen_heir.GetTitledFirstName]. Я отвечаю миром, прецедентом и бременем правления. Любая причина звучит холоднее, если говорить вслух женщине, которая помогла мне построить это царство. Если ее совет так мало значит, говорит она, то она мне больше не нужна. Прежде чем я успеваю перезвонить, ее домочадцы готовятся к Драконьему Камню."
 fab_children.1014.a:0 "Если тебе нужно идти, то иди."
 fab_children.1015.t:0 "Старшая линия сохраняется"
 fab_children.1015.desc:0 "Алисанна дважды читает воззвание, прежде чем поднять глаза. Я назвал [chosen_heir.GetTitledFirstName], сохраняя дом Эймона живым благодаря его дочери, а не рассматривая его смерть как смерть всей его линии. Моя королева не делает вид, что лорды спокойно проглотят это. Она только берет меня за руку и говорит, что сегодня я вспомнил о законе крови, а также о привычках мужчин."
 fab_children.1015.a:0 "Какое бы сопротивление ни возникло, мы встретим его вместе."
 fab_children.1011.t:0 "Дочь между нами"
 fab_children.1011.desc:0 "Я позволил, чтобы [maegelle.GetFirstName] высказалась там, где гордость заставляла меня молчать. Она просит помнить: мы с [alysanne.GetFirstName] пережили вместе слишком многое, чтобы теперь между нами встал трон. Решение моё останется в силе. Но хранить молчание я не обязан."
 fab_children.1011.a:0 "Прости меня, Алисанна."
 fab_children.1100.t:0 "Последние роды Алиссы"
 fab_children.1100.desc:0 "Рядом с кроватью [alyssa_daughter.GetFirstName] радость новорожденного сына превращается в ужас. Кровотечение замедлилось, но ее охватила жгучая болезнь, и мейстеры опускают глаза, когда я требую уверенности. Септа стоит на коленях у изножья кровати и молит Мать о милосердии, и мне никогда в жизни так сильно не хотелось верить, что ее услышали. Моя смеющаяся, бесстрашная дочь тянется ко мне за руку и дважды спрашивает, здоров ли мальчик."
 fab_children.1100.a:0 "Я не покину эту комнату."
 fab_children.1100.a.tt:0 "Бейлон потрясён смертью Алиссы. Он станет #V вдовцом#! и в память о ней никогда больше не женится."
 fab_children.1101.t:0 "Сын Алиссы"
 fab_children.1101.desc:0 "Маленький [infant_aegon.GetFirstName] борется за каждый неглубокий вздох. Кормилица сказала мне, что у него руки отца. Мейстер мне вообще ничего не говорит. В час волка, когда самые старые умирают и рождается младший, крошечные пальчики сжимаются вокруг моих, а затем замирают."
 fab_children.1101.a:0 "Неведомый милостив к самым маленьким. Сегодня я буду держаться за эту мысль."
 fab_children.1150.t:0 "Предстоящий брак"
 fab_children.1150.desc.alysanne:0 "[alyssa_daughter.GetFirstName] следовала за [baelon.GetFirstName] с того дня, как она научилась ходить. В течение многих лет он жаловался, что его сестра таскалась за ним, как за щенком, и что у него была ошибка родиться девочкой. Ей было шесть лет, когда на тренировочном дворе пролетел деревянный меч и сломал ей нос; оно зажило криво, и она ни разу не просила мейстера побеспокоиться об этом.\n\nГде-то между тем и сейчас жалобы прекратились.\n\n[alysanne.GetFirstName] давно уладил этот вопрос и никогда не утверждал обратного. Когда рядом с именем нашей дочери были названы другие имена, моя королева ответила, что девочка предназначена для [baelon.GetFirstName], и больше ничего об этом не услышит."
 fab_children.1150.desc.fallback:0 "[alyssa_daughter.GetFirstName] следовала за [baelon.GetFirstName] с того дня, как она научилась ходить. В течение многих лет он жаловался, что его сестра таскалась за ним, как за щенком, и что у него была ошибка родиться девочкой. Ей было шесть лет, когда на тренировочном дворе пролетел деревянный меч и сломал ей нос; оно зажило криво, и она ни разу не просила мейстера побеспокоиться об этом.\n\nГде-то между тем и сейчас жалобы прекратились. Ее мать увидела это раньше меня и говорила так часто, что суд до сих пор повторяет мне это: эта девушка предназначалась для [baelon.GetFirstName], и никакого другого имени никогда не будет услышано."
 fab_children.1150.a:0 "Обручить Алиссу с Бейлоном."
 fab_children.1150.b:0 "Их браки я должен устроить, и не сейчас."
 fab_children.1150.b.tt:0 "Алисса и Бейлон остаются необручёнными и могут получить другие предложения. Последние роды не грозят Алиссе, пока она не выйдет за Бейлона и не родит ему сына."
 fab_children.1200.t:0 "Боль в боку Бейлона"
 fab_children.1200.desc:0 "[baelon.GetFirstName] возвращается с охоты с жалобами на боль в боку. К часу летучей мыши он не может стоять. Боль оседает глубоко в животе, за ней следует лихорадка, и с каждым часом он высасывает все больше и больше. Я вызываю Великого Мейстера и приказываю ему попробовать все, чему его научила Цитадель, а затем и то, чего она не делала."
 fab_children.1200.a:0 "Ничего не жалейте. Ни одного глотка, ни одного часа."
 fab_children.1202.t:0 "Лопнувший живот"
 fab_children.1202.desc:0 "Пять рассветов пришли и ушли возле кровати [baelon.GetFirstName]. Сквозняки мейстеров притупляют боль, но не могут затронуть то, что убивает его под ней. Мой сын просыпается достаточно долго, чтобы узнать меня, сжимает мою руку и говорит, что устал. Тогда я говорю ему спать. Я сижу шестой рассвет один."
 fab_children.1202.a:0 "Неведомый забрал моего сына."
 fab_children.1203.t:0 "Лихорадка прекращается"
 fab_children.1203.desc:0 "Я почти не доверяю Великому Мейстеру, когда он говорит мне, что отек уменьшился. Затем [baelon.GetFirstName] пьет без рвоты, спит без температуры и просыпается, требуя знать, как долго я собираюсь держать его в постели. Восстановление идет медленно. Каждый шаг возвращает мне сына, которого я уже начал хоронить."
 fab_children.1203.a:0 "Наградить всех, кто за ним ухаживал."
 fab_children.1250.t:0 "Призвание Мейгель"
 fab_children.1250.desc:0 "Каждую ночь [maegelle.GetFirstName] читает #italic Семиконечную звезду#! перед сном. Она нежна там, где некоторые из ее сестер жестоки, тиха там, где суд требует демонстрации, и счастливее всего, когда септа позволяет ей ухаживать за больным ребенком или переписывать страницу учения. Алисанна напоминает мне об обещании, которое она дала Матери при рождении дочери: одну девочку отдали Вере в знак благодарности. Я ожидал слез, когда мы ей это предложили. Мейгель спрашивает, когда она сможет начать."
 fab_children.1250.a:0 "Пусть Старомест примет её, а Семеро обретут служительницу лучшую, чем я заслуживаю."
 fab_children.1250.b:0 "Моя дочь остается при дворе."
 fab_children.1260.t:0 "Принц, который предпочитал книги"
 fab_children.1260.desc:0 "Ни мечи, ни кони, ни драконы никогда надолго не увлекали моего сына — [vaegon.GetFirstName] живёт книгами. Великий мейстер прямо говорит мне: сыну не хватает ни терпения для воронов, ни душевного тепла для службы в замке. Но Цитадель ещё может сделать из него архимейстера, если позволить ему посвятить жизнь числам и высшим тайнам. Я сообщаю Вейгону, что через две недели корабль отправится в Старомест. Впервые я почти вижу его улыбку. «Да, отец, — говорит он. — Хорошо»."
 fab_children.1260.a:0 "Отправьте Вейгона в Цитадель."
 fab_children.1260.b:0 "Принц Крови не будет слугой."
 fab_children.1300.t:0 "Муж для Дейллы"
 fab_children.1300.desc.rodrik_holder:0 "Когда я спрашиваю [daella.GetFirstName], что она помнит о Долине и дворе [eyrie_lord.GetTitledFirstName], она тепло отзывается о ее вежливости и, что самое теплое, о доброте [rodrik.GetTitledFirstName] к ней. Кротость будет иметь для этой дочери большее значение, чем великолепие. Я также мог бы оставить ее руку без обещания на какое-то время и поискать другого мужчину, достойного ее доверия."
 fab_children.1300.desc.rodrik:0 "Когда я спрашиваю [daella.GetFirstName], что она помнит о Гнезде, она тепло отзывается о его любезности и особенно тепло о доброте [rodrik.GetTitledFirstName] к ней. Кротость будет иметь для этой дочери большее значение, чем великолепие. Я также мог бы оставить ее руку без обещания на какое-то время и поискать другого мужчину, достойного ее доверия."
 fab_children.1300.desc.fallback:0 "Когда я спрашиваю [daella.GetFirstName], что она помнит о Гнезде, ее ответ — сплошная вежливость и никакой надежды. Мальчик Аррен, о котором когда-то говорили для нее, теперь недосягаем ни из-за смерти, ни из-за контракта с другим мужчиной. Кротость будет иметь большее значение для этой дочери, чем великолепие, и я скорее заставлю ее ждать, чем отдам ее не в тот дом."
 fab_children.1300.a:0 "Пусть это будет [rodrik.GetTitledFirstName]. По крайней мере, он будет к ней добр."
 fab_children.1300.b:0 "Никаких обещаний пока нет. Возможно, для нее найдется мужчина получше."
 fab_children.1300.b.tt:0 "Дейлла остается необрученной и может получить еще одно предложение руки и сердца."
 fab_children.1301.t:0 "Пустое место в Гнезде"
 fab_children.1301.desc:0 "Тяжёлые новости приходят из Орлиного Гнезда. [eyrie_lady.GetTitledFirstName] внезапно заболела, и мейстеры Долины мало на нее надеются. Я не могу приветствовать смерть, которая освобождает дорогу Дейлле. Могу только заметить, что дорога открылась."
 fab_children.1301.a:0 "Пусть Долина сначала похоронит её. Разговор о моей дочери подождёт, пока стихнет горе."
 fab_children.1310.t:0 "Полет в Орлиное гнездо"
 fab_children.1310.desc:0 "[alysanne.GetFirstName] уже взбирается на Среброкрылую, а я всё ещё держу письмо: [daella.GetFirstName] ждёт ребёнка и боится. Моя королева не позволит, чтобы в такую минуту их разделяло целое королевство. Я убеждаю себя, что мейстеры Орлиного Гнезда искусны. Алисанна не спорит. Только смотрит на меня так же, как тогда, когда я отмахнулся от первого предостережения об этом браке."
 fab_children.1310.a:0 "Лети быстро. Я заранее сообщу в Орлиное гнездо."
 fab_children.1311.t:0 "Дочь для дочери"
 fab_children.1311.desc:0 "Одно милосердие и одна жестокость приходят в одном и том же вороне. [daella.GetFirstName] родила здоровую девочку, и во время родов ее охватила лихорадка, до которой мейстеры не могли добраться. Она не одна. Я на расстоянии ширины королевства, а ворон должен был появиться через несколько дней. В сентябре внизу уже зажигают свечи Матери, что и делают мужчины, когда мейстеры перестают обещать."
 fab_children.1311.a:0 "Я заставил слишком многое и слишком рано. Прости меня, милая девочка."
 fab_children.1400.t:0 "Невеста для Белой Гавани"
 fab_children.1400.desc.holder:0 "Алисанна предлагает [white_harbor_lord.GetTitledFirstName] вместо [viserra.GetFirstName]. Лорд Белой Гавани старше нашей дочери и уже был женат, но он хитрый, вежливый и хозяин величайшего порта на Севере. Визерра слышит только возраст и расстояние. Если ее мать так восхищается этим человеком, говорит она, то ее мать может сама выйти за него замуж. За оскорблением скрывается другое честолюбие. Визерра уже много лет наблюдает за Железным Троном, и незамужний брат будет держать ее рядом с ним."
 fab_children.1400.desc.fallback:0 "Брак с Белой Гаванью, который Алисанна задумала для нашей дочери, не состоится: [viserra.GetFirstName] осталась без жениха. Выбранный лорд умер или уже связан другим обещанием. Визерра считает неудачу победой и вновь обращает взгляд к Железному трону. Если кто-то из её братьев ещё не женат, древний обычай нашего рода оставляет такой путь. Иначе её рука останется свободной, пока я не найду партию получше."
 fab_children.1400.a:0 "Одобрить брак с Белой Гаванью."
 fab_children.1400.aegon:0 "Я обручаю Визерру с Эйгоном."
 fab_children.1400.aemon:0 "Я обручаю Визерру с Эймоном."
 fab_children.1400.baelon:0 "Я обручаю Визерру с Бейлоном."
 fab_children.1400.vaegon:0 "Я обручаю Визерру с Вейгоном."
 fab_children.1400.gaemon:0 "Я обручаю Визерру с Геймоном."
 fab_children.1400.valerion:0 "Я обручаю Визерру с Валерионом."
 fab_children.1400.b:0 "Найдите Визерру более подходящую пару, чем Белую Гавань."
 fab_children.1400.b.tt:0 "Никакой королевской помолвки не происходит. Визерра по-прежнему может получить еще одно предложение."
 fab_children.1401.t:0 "Последняя ночь"
 fab_children.1401.desc:0 "Накануне своего отъезда [viserra.GetFirstName] просит провести последнюю ночь среди друзей своего детства, и я разрешаю это. Остальное я получаю от золотых плащей и от компаньонов, слишком напуганных, чтобы хорошо лгать: гостиница за гостиницей, вино и смех и вся свобода, которую, как она была уверена, Белая Гавань отнимет у нее, а затем мчится домой сквозь тьму в час совы. На Мучной улице упала кобыла. Ее несут ко мне перед рассветом со сломанной шеей, и она не слышит ни слова, которое я говорю."
 fab_children.1401.a:0 "Моя дочь... нет."
 fab_children.1403.t:0 "Несут домой"
 fab_children.1403.desc.kingsguard:0 "В час волка в дверь стучат, и ее приводит [bedchamber_witness.GetFirstName] из Королевской гвардии, в испорченном по локоть белом плаще и с моей дочерью, потерявшей сознание в его руках. [alysanne.GetFirstName] встает с кровати раньше меня.\n\n[bedchamber_witness.GetFirstName] рассказывает мне это так, как рассказывали ему его спутники, и никто из них не рассказывал одинаково: гостиница за гостиницей, гонка домой в темноте, кобыла на Мучной улице. По всем расчетам [viserra.GetFirstName] должен был врезаться в камни головой вперед. Она этого не сделала. Помнят ли ее руки, что было затоплено вином, или Мать присматривала за девушкой, которая не додумалась ее спросить, мне никогда прямо не скажут. Два ребра сломаны, а вино на ней все еще кислое.\n\nКогда мейстер уходит, она открывает глаза, видит нас двоих, стоящих над ней, и имеет наглость улыбнуться."
 fab_children.1403.desc.kingsguard_alone:0 "В час волка в дверь стучат, и ее приводит [bedchamber_witness.GetFirstName] из Королевской гвардии, в испорченном по локоть белом плаще и с моей дочерью, потерявшей сознание в его руках.\n\n[bedchamber_witness.GetFirstName] рассказывает мне это так, как рассказывали ему его товарищи, и никто из них не рассказывал одинаково: гостиница за гостиницей, гонка домой в темноте, кобыла на Мучной улице. По всем расчетам [viserra.GetFirstName] должен был врезаться в камни головой вперед. Она этого не сделала. Помнят ли ее руки, что было затоплено вином, или Мать присматривала за девушкой, которая не додумалась ее спросить, мне никогда прямо не скажут. Два ребра сломаны, а на ней все еще кислое вино.\n\nКогда мейстер уходит, она открывает глаза, видит, что я стою над ней один, и имеет наглость улыбнуться."
 fab_children.1403.desc.captain:0 "В час волка раздается стук в дверь, и ее приводит [bedchamber_witness.GetFirstName], с почтой, все еще на нем, и с моей дочерью, потерявшей сознание в его руках. [alysanne.GetFirstName] встает с кровати раньше меня.\n\n[bedchamber_witness.GetFirstName] рассказывает мне это так, как рассказывали ему его спутники, и никто из них не рассказывал одинаково: гостиница за гостиницей, гонка домой в темноте, кобыла на Мучной улице. По всем расчетам [viserra.GetFirstName] должен был врезаться в камни головой вперед. Она этого не сделала. Помнят ли ее руки, что было затоплено вином, или Мать присматривала за девушкой, которая не додумалась ее спросить, мне никогда прямо не скажут. Два ребра сломаны, а вино на ней все еще кислое.\n\nКогда мейстер уходит, она открывает глаза, видит нас двоих, стоящих над ней, и имеет наглость улыбнуться."
 fab_children.1403.desc.captain_alone:0 "В час волка раздается стук в дверь, и ее приводит [bedchamber_witness.GetFirstName], с почтой, все еще на нем, и с моей дочерью, потерявшей сознание в его руках.\n\n[bedchamber_witness.GetFirstName] рассказывает мне это так, как рассказывали ему его товарищи, и никто из них не рассказывал одинаково: гостиница за гостиницей, гонка домой в темноте, кобыла на Мучной улице. По всем расчетам [viserra.GetFirstName] должен был врезаться в камни головой вперед. Она этого не сделала. Помнят ли ее руки, что было затоплено вином, или Мать присматривала за девушкой, которая не додумалась ее спросить, мне никогда прямо не скажут. Два ребра сломаны, а вино на ней все еще кислое.\n\nКогда мейстер уходит, она открывает глаза, видит, что я стою над ней один, и имеет наглость улыбнуться."
 fab_children.1403.desc.fallback:0 "Они несут [viserra.GetFirstName] в нашу комнату в час волка, потерявшего сознание, с еще кислым вином и сломанными двумя ребрами.\n\nТо, что у меня есть, — это подержанное и пьяное: гостиница за гостиницей, гонка домой в темноте, кобыла на Мучной улице. По всем расчетам она должна была врезаться в камни головой вперед. Она этого не сделала. Помнят ли ее руки, что утопило вино, или Мать присматривала за девочкой, которая не додумалась ее спросить, мне никто сказать не может.\n\nКогда мейстер ушел, она открывает глаза, видит, что я стою над ней, и имеет наглость улыбнуться."
 fab_children.1403.a:0 "Ты услышишь меня перед сном. Белая Гавань сейчас ждет мейстера."
 fab_children.1403.b:0 "Семеро уберегли тебя, когда я не смог. Я не стану омрачать этот дар криками."
 fab_children.1490.t:0 "Спутники принцессы"
 fab_children.1490.desc:0 "[saera.GetFirstName] собрала вокруг себя пятерых молодых придворных. [braxton.GetFirstName] Бисбери, которого суд уже называет Стингером за язык, красив, горд и опасно доволен собой. [jonah.GetFirstName] Мутон и рыжеволосый [roy.GetFirstName] Коннингтон — наследники скорее отважные, чем осторожные. [alys_turnberry.GetFirstName] Тернберри и [perianne.GetFirstName] Мур соответствуют моей дочери по возрасту, красоте и склонности к озорству. Они пируют, ястребят, охотятся и плавают как одна компания. В их смехе я вижу безобидную молодежь, а также начало суда внутри моего двора."
 fab_children.1490.a:0 "Под моей крышей, где я могу их видеть. Это лучше, чем Блошиный Конец."
 fab_children.1490.b:0 "Это неподходящая компания для принцессы."
 fab_children.1500.t:0 "Том Репа в «Голубой жемчужине»"
 fab_children.1500.desc:0 "Дурак Том Репка найден в доме развлечений под названием «Голубая жемчужина», настолько пьяный, что едва может стоять. [braxton.GetFirstName], [jonah.GetFirstName] и [roy.GetFirstName] стоят рядом с ним и смеются над тем, какое унижение привело королевского дурака в такое место. Слуги говорят, что это не выходка одной ночи. Уже больше года спутники Саеры обмениваются комнатами, подарками и секретами под моей собственной крышей. Я позволил слухам пройти мимо, потому что хотел, чтобы они были ничем. Они не ничто."
 fab_children.1500.a:0 "Взять мужчин под стражу. Мы с Алисанной узнаем правду."
 fab_children.1501.t:0 "Допрошены три девушки"
 fab_children.1501.desc:0 "Алисанна расспрашивает девочек по отдельности. Перианн Мур плачет. Элис Тернберри признается, что беременна и не может с уверенностью сказать, кто из молодых людей стал его отцом. Истории различаются в мелких деталях и совпадают во всем важном. Сейру не сбил с пути один соблазнитель. Она выбрала игру, продолжала ее развивать и привлекла в нее своих друзей. Моя королева приносит мне ответы, сдерживая свой гнев так сильно, что у нее трясутся руки."
 fab_children.1501.a:0 "Приведите Сейру к Железному Трону."
 fab_children.1502.t:0 "Как Эйгон и Мейгор"
 fab_children.1502.desc:0 "[saera.GetFirstName] ничего не отрицает. Брэкстон Бисбери, Джона Мутон и Рой Коннингтон были ее любовниками. Когда я требую знать, за какого мужчину она собирается выйти замуж, она улыбается и предлагает взять всех троих, как Эйгон Завоеватель взял двух жен. Затем она также призывает Мейгора, и это имя опустошает зал звуков. Я слышу, как моя дочь сравнивает свои аппетиты с аппетитами завоевателя, и что-то во мне замирает. Глаза Алисанны на другом конце коридора находят мои. Она просит меня не говорить того, что я собираюсь сказать."
 fab_children.1502.a:0 "Запереть её. Я вынесу приговор каждому виновному."
 fab_children.1502.b:0 "В ней кровь дракона. Больше я ничего не желаю об этом слышать."
 fab_children.1503.t:0 "Дверь Драконьего Логова"
 fab_children.1503.desc:0 "Заключение держит [saera.GetFirstName] меньше ночи. Она ускользает от охраны, пересекает город и попадает к дверям Драконьего Логова. Я не могу знать, хотела ли она заявить права на дракона или просто напугать меня. Я знаю, как дракон в ее нынешнем характере отнесется к семейному позору. Я запер ее высоко в башне под постоянной охраной. Мужчины, которые разделяли ее вид спорта, предстанут перед судом ниже."
 fab_children.1503.a:0 "Больше никаких уклонений. Я вынесу приговор."
 fab_children.1507.t:0 "Суд над пятью"
 fab_children.1507.desc:0 "Джона Мутон соглашается жениться на Перианне Мур и попытаться сделать что-то благородное из их глупости. Рою Коннингтону предлагают Стену или десять лет за Узким морем, и он выбирает изгнание. Элис Тернберри будет жить в родительском доме, пока не родится ее ребенок. Только Брэкстон Бисбери отказывается от всякой милости. Стингер требует испытания боем, будучи уверенным, что молодость, сила и моргенстар опозорят любого серого чемпиона, которого я поставлю перед ним."
 fab_children.1507.a:0 "У остальных свои приговоры. Приведите ко мне Бисбери."
 fab_children.1508.t:0 "Этот старик"
 fab_children.1508.desc:0 "Брэкстон стоит перед троном в начищенных доспехах: цепи нисколько не умерили его высокомерие. «Тогда я выбираю суд поединком. С кем из этих стариков вы прикажете мне сразиться?» Я уже спускаюсь по ступеням, прежде чем кто-либо из Королевской гвардии успевает ответить. За его спиной [saera.GetFirstName] смотрит на меня так, словно видит своего отца впервые."
 fab_children.1508.a:0 "Этот старик. Тот самый, чью дочь ты соблазнил и обесчестил."
 fab_children.1509.t:0 "Чёрное Пламя и моргенштерн"
 fab_children.1509.desc:0 "Мы встречаемся в полном вооружении с поднятыми щитами. Он несет в себе утреннюю звезду и всю силу девятнадцати лет. Я несу в себе Чёрного Пламени и терпение человека, пережившего войну, восстание и большинство людей, с которыми он начинал. Он приближается ко мне в тот момент, когда глашатай отступает, стучит железом по моему щиту, уверенный, что возраст должен уступить место, если его ударять достаточно часто. Я уступаю место. Я позволил ему расходовать гордость, как будто это была сила. Затем я начинаю двигаться вперед."
 fab_children.1509.a:0 "Тогда Воин рассудит нас."
 fab_children.1511.t:0 "Последний вздох Жала"
 fab_children.1511.desc:0 "Его удары медленные. Щит провисает, Морнингстар тянет его за руку, и когда он спотыкается, острие Чёрного Пламени находит узкое отверстие в его забрале. Во дворе наступает тишина еще до того, как тело успело успокоиться. Моя дочь не отводит взгляда, и я тоже. После этого я отдаю приказ отправить [saera.GetFirstName] в Старомест, где молитва и дисциплина смогут сделать то, чего не может мой гнев."
 fab_children.1511.a:0 "Безмолвные сестры примут ее."
 fab_children.1513.t:0 "Старик уступает"
 fab_children.1513.desc:0 "Утренняя звезда «Стингера» пробивает мою защиту и швыряет меня в грязь. Двор вспыхивает прежде, чем Королевская гвардия успевает сомкнуться вокруг нас. По закону, который я сам призвал, Брэкстон Бисбери доказал свою невиновность перед богами и людьми. Каждым лицом в том дворе он ранил и корону. Я не допущу, чтобы его убили за победу в суде, которого я требовал. Сейре еще придется покинуть этот двор, прежде чем ее неповиновение покончит с тем, что осталось от моей семьи."
 fab_children.1513.a:0 "Соблюсти исход поединка. Затем отправить Сейру в Старомест."
 fab_children.1514.t:0 "Обитель в Староместе"
 fab_children.1514.desc.maegelle:0 "[maegelle.GetFirstName] пишет из Староместа. У [saera.GetFirstName] отобрали шелка, остригли волосы, дни делили на молитвы, тишину, грубую одежду и скромный труд. Мейгель не делает вид, что ее сестра приняла что-либо из этого. Она просит меня проявить терпение и обещает сама проинструктировать Сейру. Моя нежная дочь уже помирила меня и Алисанну."
 fab_children.1514.desc.fallback:0 "Материнский дом пишет из Староместа. У [saera.GetFirstName] отобрали шелка, остригли волосы, дни делили на молитвы, тишину, грубую одежду и скромный труд. Септы не делают вид, что она приняла что-либо из этого. Они просят меня о терпении, и я даю его, хотя во всех отчетах говорится, что моя дочь изучает двери и стены более усердно, чем Священные Писания."
 fab_children.1514.a:0 "Строгость — да. Жестокость — никогда. Я видел, во что она превращает мою кровь."
 fab_children.1515.t:0 "Корабль, направляющийся в Лис"
 fab_children.1515.desc.holder:0 "Через полтора года в материнском доме обнаруживается пустая кровать и сложенная на ней одежда послушника. [saera.GetFirstName] покинула Старомест, села на корабль и пересекла Узкое море в Лис, где теперь живет под контролем [lys_ruler.GetTitledFirstName]. Она променяла молитву на сад для удовольствий, а мое суждение на свое собственное содержание. Я посылаю людей обыскивать доки, которые она покинула несколько недель назад. Это что-то связанное с моими руками."
 fab_children.1515.desc.fallback:0 "Через полтора года в материнском доме обнаруживается пустая кровать и сложенная на ней одежда послушника. [saera.GetFirstName] отправился из Староместа, сел на корабль и пересек Узкое море до Лиса. Она променяла молитву на сад для удовольствий, а мое суждение на свое собственное содержание. Я посылаю людей обыскивать доки, которые она покинула несколько недель назад. Это что-то связанное с моими руками."
 fab_children.1515.a:0 "Пока что нас разделяет Узкое море."
 fab_children.1504.t:0 "Дочь, которую я не назову"
 fab_children.1504.desc:0 "Проходят годы. [saera.GetFirstName] уезжает из Лиса в Волантис, богатеет и приезжает, чтобы сохранить дом, более величественный, чем есть у многих лордов. Когда кто-то спрашивает, позвоню ли я ей домой, я отвечаю, что у меня нет дочери в Волантисе. Суд этим удовлетворен. А я нет, и я до сих пор помню, как застегивал ей плащ, когда она была слишком мала, чтобы справиться с застежкой."
 fab_children.1504.a:0 "Я не пошлю за ней."
 fab_children.1505.t:0 "Письмо из Волантиса"
 fab_children.1505.desc:0 "Я узнаю руку [saera.GetFirstName] еще до того, как сломаю печать. Письмо пришло от Волантиса, оно написано женщиной, у которой есть собственный дом и которая не просит у меня ни денег, ни помощи. Она не извиняет того, что произошло между нами, и я тоже. Она спрашивает только об одном: может ли дочь пересечь море и поговорить со своим отцом без цепей, клятв или старых обвинений, ожидающих ее на пристани."
 fab_children.1505.a:0 "Скажи ей, что на пристани не будет цепей."
 fab_children.1505.b:0 "Я не могу снова открыть эту рану."
 fab_children.1600.t:0 "Тайна Гейль"
 fab_children.1600.desc:0 "[gael.GetFirstName] держится вне моего поля зрения и вдали от дома и закончился на повороте луны. Путешествующий певец покинул двор, ни с кем не попрощавшись, а слуги принялись считать месяцы на пальцах. Я узнал, чего молчание может стоить этой семье."
 fab_children.1600.a:0 "Осторожно. Не пугайте её."
 fab_children.1601.t:0 "Ребенок, который никогда не плакал"
 fab_children.1601.desc:0 "Горе опустошило [gael.GetFirstName]. Певец оставил ее с ребенком. Ребенок пришел слишком рано и ни разу не плакал. Не было названо ни имени, ни септона не позвали, потому что позвонить значило бы сообщить о королевстве. Она перенесла все это в одиночку, уверенная, что стыд — единственный ответ, который она получит, если попросит о помощи. Я говорю ей, что она не одна. Я не могу сказать, доходят ли до нее эти слова."
 fab_children.1601.a:0 "Её нельзя оставлять одну. Ни на час."
 fab_children.1602.t:0 "Черноводный залив"
 fab_children.1602.desc:0 "[gael.GetFirstName] стоит там, где черная вода скатывается у ее ног, когда я достигаю берега. Она оглядывается назад, не испуганная, а просто уставшая, и идет дальше. Я называю ее имя. Я все еще звоню ему, когда прилив уносит ее из поля зрения. У Веры нет ласкового слова в отношении того, что она сделала. Это не будет сказано о ней, пока я дышу."
 fab_children.1602.a:0 "Я опоздал."
 fab_children.1603.t:0 "Успели до воды"
 fab_children.1603.desc.alysanne:0 "Я следую за [alysanne.GetFirstName] до берега, и мы достигаем [gael.GetFirstName] прежде, чем ее сможет захватить прилив. Наша дочь ломается в объятиях матери и наконец говорит о певице, о потерянном ребенке, о позоре, который привел ее к воде. Мы забираем ее домой между нами."
 fab_children.1603.desc.jaehaerys:0 "[gael.GetFirstName] стоит по колено в нем, когда я добираюсь до берега, и прилив ее не достает. Моя дочь рвется в мои объятия и наконец говорит о певице, о потерянном ребенке, о позоре, который привел ее к воде. Я сам несу ее обратно по берегу."
 fab_children.1603.a:0 "Отойди от воды, милая."
 fab_children.2000.t:0 "Корона без наследника"
 fab_children.2000.desc:0 "Едва Бейлона похоронили, как петиции достигли Красного замка. Одно письмо указывает на старшую ветвь, другое — на ближайшего из ныне живущих мужчин, третье — на возраст и проверенную службу. Лорды, которые ни в чем не согласны, соглашаются, что промедление превратит любое предпочтение в фракцию. Я провел целое царствование, закрывая раны, оставленные спорными коронами. Я не оставлю свежего под своим саваном."
 fab_children.2000.a.vaegon:0 "Призовите Вейгона и выслушайте его совет."
 fab_children.2000.a.citadel:0 "Послать в Цитадель и выслушать сенешаля."
 fab_children.2000.a.maester:0 "Вызовите [council_maester.GetFirstName] и выслушайте совет [council_maester.GetHerHis]."
 fab_children.2000.a.council:0 "Послушайте совет самых образованных людей Вестероса."
 fab_children.2000.b:0 "Выбор за мной. Сейчас я назову наследника."
 fab_children.2002.t:0 "Более сложный ответ"
 fab_children.2002.t.vaegon:0 "Ответ архимейстера"
 fab_children.2002.t.citadel:0 "Ответ Сенешаля"
 fab_children.2002.t.grand_maester:0 "Ответ Великого Мейстера"
 fab_children.2002.t.maester:0 "Ответ мейстера"
 fab_children.2002.desc.vaegon:0 "[vaegon.GetFirstName] возвращается из Цитадели в мантии мейстера, более стройной и серой, и не более свободной в вежливости, чем в тот день, когда он ушел. Я излагаю ему претензии соперников и спрашиваю, какое имя сохранит мир. Мой сын отказывается мне его давать. «Пусть решают лорды», — говорит он. Не совет льстецов в моей палате, а каждый лорд, имеющий претензии, и каждый лорд, поклявшийся судить его. Королевство может принять от своего собственного собранного голоса то, чему оно сопротивлялось бы из-за горя старого короля."
 fab_children.2002.desc.citadel:0 "Цитадель посылает своего Сенешаля. [council_maester.GetFirstName] приезжает из Староместа по дороге, все еще в мантии [council_maester.GetHerHis], и уделяет королю не больше вежливости, чем того требует цепь. Я выдвигаю претензии соперника перед [council_maester.GetHerHim] и спрашиваю, какое имя сохранит мир. Ответ в том, что нет имени, которое можно было бы назвать. «Пусть решают лорды», — говорит [council_maester.GetSheHe]. Не совет льстецов в моей палате, а каждый лорд, имеющий претензии, и каждый лорд, поклявшийся судить его. Королевство может принять от своего собственного собранного голоса то, чему оно сопротивлялось бы из-за горя старого короля."
 fab_children.2002.desc.grand_maester:0 "Я задал вопрос великому мейстеру, который вел воронов и бухгалтерские книги этого правления. [council_maester.GetFirstName] долго обдумывает претензии соперника, а затем вообще отказывается назвать мне имя. «Пусть решают лорды», — говорит [council_maester.GetSheHe]. Не совет льстецов в моей палате, а каждый лорд, имеющий претензии, и каждый лорд, поклявшийся судить его. Королевство может принять от своего собственного собранного голоса то, чему оно сопротивлялось бы из-за горя старого короля."
 fab_children.2002.desc.maester:0 "Я задал вопрос мейстеру моего двора. [council_maester.GetFirstName] выслушивает заявления соперника до конца, а затем вообще отказывается назвать мне имя. «Пусть решают лорды», — говорит [council_maester.GetSheHe]. Не совет льстецов в моей палате, а каждый лорд, имеющий претензии, и каждый лорд, поклявшийся судить его. Королевство может принять от своего собственного собранного голоса то, чему оно сопротивлялось бы из-за горя старого короля."
 fab_children.2002.desc.fallback:0 "Мои советники выкладывают на стол конкурирующие претензии до тех пор, пока перед нами не останется больше чернил, чем дерева, и ни одно имя среди них не обещает мира. Наконец один из них предлагает более жесткий ответ: пусть каждый лорд, предъявивший претензии, будет услышан, и пусть собравшееся королевство рассудит их. Лорды могут принять из своего собравшегося голоса то, чему они сопротивлялись бы из-за горя старого короля."
 fab_children.2002.a:0 "Тогда я созову Великий Совет."
 fab_children.2002.b:0 "Нет. Я не отдам судьбу своего дома на суд меньшим лордам."
 fab_children.2003.t:0 "Дорога в Харренхол"
 fab_children.2003.desc.holder:0 "Я выбираю Харренхол, где [harrenhal_lord.GetTitledFirstName] может разместить больше претендентов, чем любой ныне живущий лорд пожелал бы встретиться одновременно. Вороны вылетают из Красного замка во все стороны. В течение полугода дороги заполняются знаменами, повозками, присяжными мечами, просителями, хедж-лордами и княжеской свитой. В стенах могут спать более пятисот человек; вдвое больше людей поставят палатки под черными башнями. Я остаюсь в Королевской Гавани. Если совет хочет говорить свободно, он не должен принимать мое присутствие за ответ."
 fab_children.2003.desc.fallback:0 "Я выбираю Харренхол, чьи разрушенные залы могут вместить больше претендентов, чем любой живой лорд мог бы пожелать встретиться одновременно. Вороны вылетают из Красного замка во все стороны. В течение полугода дороги заполняются знаменами, повозками, присяжными мечами, просителями, хедж-лордами и княжеской свитой. В стенах могут спать более пятисот человек; вдвое больше людей поставят палатки под черными башнями. Я остаюсь в Королевской Гавани. Если совет хочет говорить свободно, он не должен принимать мое присутствие за ответ."
 fab_children.2003.a:0 "Созвать их в Харренхол. Всех претендентов и всех лордов, присягнувших рассудить их права."
 fab_children.2004.t:0 "Притязания в Харренхоле"
 fab_children.2004.desc.three:0 "Депеши из Харренхола прибывают пачками, достаточно толстыми, чтобы мейстеру согнуть спину. Претензии [heir_candidate_1.GetTitledFirstName], [heir_candidate_2.GetTitledFirstName] и [heir_candidate_3.GetTitledFirstName] входят в число тех, которые получили серьезное внимание, но ни в одном из двух писем нет согласия относительно того, что должно иметь наибольшее значение. Лорд Баратеон пишет, что нельзя пройти мимо старшей ветви, не потеряв при этом все наследство в Штормовых землях. Лорд Хайтауэр отвечает, что ни одна женщина никогда не занимала Железный Трон и никогда не должна занимать его. Блэквуд и Бракен нашли одну и ту же сторону вопроса, что тревожит меня больше, чем ссора. Я остаюсь в Королевской Гавани и читаю каждое имя, которое сохранилось до них."
 fab_children.2004.desc.two:0 "Депеши из Харренхола прибывают пачками, достаточно толстыми, чтобы мейстеру согнуть спину. Претензии [heir_candidate_1.GetTitledFirstName] и [heir_candidate_2.GetTitledFirstName] вызывают серьезное внимание, но ни в одном письме нет согласия относительно того, что должно иметь наибольшее значение. Лорд Баратеон пишет, что нельзя пройти мимо старшей ветви, не потеряв при этом все наследство в Штормовых землях. Лорд Хайтауэр отвечает, что ни одна женщина никогда не занимала Железный Трон и никогда не должна занимать его. Блэквуд и Бракен нашли одну и ту же сторону вопроса, что тревожит меня больше, чем ссора. Я остаюсь в Королевской Гавани и читаю каждое имя, которое сохранилось до них."
 fab_children.2004.desc.one:0 "Депеши из Харренхола прибывают пачками, достаточно толстыми, чтобы мейстеру согнуть спину. [heir_candidate_1.GetTitledFirstName] стоит на первом месте среди живых претензий, и даже одно имя противопоставляет Штормовой Предел Старому Городу, а Блэквуд соглашается с Бракеном впервые за триста лет. Я остаюсь в Королевской Гавани и читаю все аргументы, которые мне присылает совет."
 fab_children.2004.a:0 "Пришлите мне список оставшихся претендентов."
 fab_children.2005.t:0 "Претенденты передо мной"
 fab_children.2005.desc.council:0 "Запечатанные приговоры открываются передо мной. Аргументы, подсчеты, предупреждения, имена и письмо одного септона, умоляющего меня помнить, что Отец судит королей последним и самым суровым. Все, кроме закона, который мог бы избавить меня от самого поступка. Смерти, браки, клятвы и выборы, сделанные за все время моего правления, сформировали семью, которую ни одна мейстерская диаграмма не сводит к правилу. Совет высказался. Я должен выразить живое лицо под словами #italic наследник Железного Трона#!."
 fab_children.2005.desc.fallback:0 "Я отказался прятаться за решением совета. Передо мной живые претенденты со своими правами, и после выбора не будет подсчёта голосов, который позволил бы разделить ответственность. За словами #italic наследник Железного трона#! я должен поставить живого человека. Выбор будет моим — как и вся порождённая им вражда."
 fab_children.2007.t:0 "Живые претенденты"
 fab_children.2007.desc.aemon:0 "Смерть Эймона оставила больше, чем просто пустой стул. Ко мне по одному приводят живых членов Дома Таргариенов. Родословная может проследить путь сквозь мертвых. Наследовать могут только живые. Я хочу рассмотреть каждого из них, прежде чем сделать выбор."
 fab_children.2007.desc.council:0 "Реестр совета продолжается уже на первой странице. На каждом листе указано имя живого Таргариена и аргументы за и против этого утверждения. Никакой счетчик не сможет выбрать вместо меня. Я собираюсь просмотреть каждого подходящего члена моего Дома, прежде чем привязать королевство к одному из них."
 fab_children.2006.t:0 "Запечатанный приговор"
 fab_children.2006.desc.council:0 "В мою руку попал последний ворон из Харренхола. Рядом с аргументами совета я пишу имя, которое будет управлять царством после меня: [gc_winner.GetTitledFirstName]. Следовал ли я за лордами или бросил им вызов, неопределенность позади. Я приказываю собрать суд и объявить о преемственности прежде, чем слухи перерастут в восстание."
 fab_children.2006.desc.direct:0 "Я пишу имя, которое будет управлять царством после меня: [gc_winner.GetTitledFirstName]. Ни один совет не защищает этот выбор, и никакие подсчеты не умаляют его. Это решение Джейхейриса, первого по имени, вынесенное, пока у меня еще есть силы его исполнить. Я приказываю собрать суд и объявить о преемственности прежде, чем слухи перерастут в восстание."
 fab_children.2006.a:0 "Откройте тронный зал. Царство выслушает мое решение."
 fab_children.2001.t:0 "Наследник провозглашен"
 fab_children.2001.desc:0 "Я встаю перед Железным Троном и называю [gc_winner.GetTitledFirstName] своим законным наследником. Сначала следуют аплодисменты, затем бормотание, затем осторожное молчание людей, уже подсчитывающих, чего им стоило мое решение. Ни один совет не смог бы уравнять каждую линию моей крови, и ни один король не смог бы удовлетворить каждого претендента. Королевство пролило бы гораздо больше крови из-за вопроса, оставшегося открытым, чем из-за ответа, который ему не понравился."
 fab_children.2001.a:0 "Запишите это в протокол. Ни один лорд не покинет этот зал, чтобы сказать, что он не услышал."
 fab_children.heir_candidate_1:0 "[heir_candidate_1.GetTitledFirstName] станет моим наследником."
 fab_children.heir_candidate_2:0 "[heir_candidate_2.GetTitledFirstName] станет моим наследником."
 fab_children.heir_candidate_3:0 "[heir_candidate_3.GetTitledFirstName] станет моим наследником."
 fab_children.heir_candidates.more:0 "Покажите остальных претендентов."
 fab_children.heir_candidates.review:0 "Покажите первые имена ещё раз."
 fab_children_shared_joy_opinion:0 "Разделённая радость за наших детей"
 fab_children_shared_grief_opinion:0 "Общая скорбь о наших детях"
 fab_children_heeded_queen_opinion:0 "Прислушался к моему совету"
 fab_children_ignored_queen_opinion:0 "Проигнорировал мой совет"
 fab_children_childbed_blame_opinion:0 "Вина за смерть нашей дочери"
 fab_children_succession_quarrel_opinion:0 "Ссора о престолонаследии"
 fab_children_reconciled_opinion:0 "Семья примирилась"
 fab_aemon_tarth_survivor_modifier:0 "Шрам Тарта"
 fab_aemon_tarth_survivor_modifier_desc:0 "На Тарте арбалетная стрела мирийца прошла в толщине пальца от горла. Шрам остался до сих пор."
 fab_alyssa_childbed_survivor_modifier:0 "Пережила последние роды"
 fab_alyssa_childbed_survivor_modifier_desc:0 "Пережила роды, которые мейстеры уже сочли смертельными."
 fab_alyssa_late_fertility_modifier:0 "Всё ещё плодовита"
 fab_alyssa_late_fertility_modifier_desc:0 "Мейстеры считали, что она больше не сможет рожать. Они ошибались."
 fab_baelon_recovered_modifier:0 "Выздоровел от пятидневной болезни"
 fab_baelon_recovered_modifier_desc:0 "Болезнь живота должна была свести его в могилу, но он выжил."
 fab_viserra_broken_ribs_modifier:0 "Падение с лошади на Мучной улице"
 fab_viserra_broken_ribs_modifier_desc:0 "Два ребра хрустнули о булыжник, крепко связанные мейстером, который не потрудился скрыть, что он думал о том часе, когда она вернулась домой. Они будут вязать. Пока они этого не сделают, она не сможет вздохнуть полной грудью, не вспомнив о падении."
 fab_infant_vigour_modifier:0 "Выходили вопреки всему"
 fab_infant_vigour_modifier_desc:0 "Этот ребёнок родился болезненным, и никто не ждал, что он выживет. Но кто-то отказался сдаваться."
