l_russian:
 fab_children.0900.t:0 "Дракон в Штормовом Пределе"
 fab_children.0900.desc:0 "Едва я начинаю оплакивать мать, как Рейна является в Штормовой Предел. Перед ней [storm_lord.GetTitledFirstName]; на глазах у всего двора она хватает его за бороду и обвиняет в смерти нашей матери. Он обязан заботиться о детях, которых та оставила. Если он возьмёт другую жену или обидит детей, предупреждает Рейна, Штормовой Предел сгорит, как сгорел Харренхол. Лорд отвечает довольно храбро. Но руки выдают его страх."
 fab_children.0900.a:0 "Моя сестра сказала то, что сказал бы я."
 fab_children.1000.t:0 "Мирийская резня"
 fab_children.1000.desc.holder_dragon:0 "[lord_tarth.GetTitledFirstName] отправляет воронов с каждым кораблём, сумевшим покинуть Сапфировый остров. Мирийские изгнанники переправились через море, захватили восточный берег Тарта и разоряют деревни огнём и мечом. [aemon.GetFirstName] просит позволения опередить королевский флот: его понесёт [aemon_dragon.GetFirstName]. Он хочет присоединиться к лорду Тарта, разведать силы врага и удерживать высоты до появления наших парусов. Он рассуждает здраво. Мне доводилось слышать худшие планы от полководцев вдвое старше него. И всё же я многое отдал бы за повод ему отказать."
 fab_children.1000.desc.holder:0 "[lord_tarth.GetTitledFirstName] отправляет воронов с каждым кораблём, сумевшим покинуть Сапфировый остров. Мирийские изгнанники переправились через море, захватили восточный берег Тарта и разоряют деревни огнём и мечом. [aemon.GetFirstName] просит позволения отправиться вперёд, не дожидаясь королевского флота. Он хочет присоединиться к лорду Тарта, разведать силы врага и удерживать высоты до появления наших парусов. Он рассуждает здраво. Мне доводилось слышать худшие планы от полководцев вдвое старше него. И всё же я многое отдал бы за повод ему отказать."
 fab_children.1000.desc.dragon:0 "С каждым кораблём, сумевшим покинуть Сапфировый остров, прибывают вороны. Мирийские изгнанники переправились через море, захватили восточный берег Тарта и разоряют деревни огнём и мечом. [aemon.GetFirstName] просит позволения опередить королевский флот: его понесёт [aemon_dragon.GetFirstName]. Он хочет присоединиться к защитникам Тарта, разведать силы врага и удерживать высоты до появления наших парусов. Он рассуждает здраво. Мне доводилось слышать худшие планы от полководцев вдвое старше него. И всё же я многое отдал бы за повод ему отказать."
 fab_children.1000.desc.fallback:0 "С каждым кораблём, сумевшим покинуть Сапфировый остров, прибывают вороны. Мирийские изгнанники переправились через море, захватили восточный берег Тарта и разоряют деревни огнём и мечом. [aemon.GetFirstName] просит позволения отправиться вперёд, не дожидаясь королевского флота. Он хочет присоединиться к защитникам Тарта, разведать силы врага и удерживать высоты до появления наших парусов. Он рассуждает здраво. Мне доводилось слышать худшие планы от полководцев вдвое старше него. И всё же я многое отдал бы за повод ему отказать."
 fab_children.1000.a:0 "Пусть отправляется вперёд, не дожидаясь флота."
 fab_children.1000.b:0 "Нет. Я пошлю корабли и воинов, но не сына."
 fab_children.1006.t:0 "Девятый день третьей луны"
 fab_children.1006.desc.rhaenys_dragon:0 "На девятый день третьей луны [aemon.GetFirstName] отправляется в путь. Я провожаю его туда, где ждёт [aemon_dragon.GetFirstName]. Он только что узнал, что [rhaenys.GetFirstName] ждёт ребёнка, и эта весть придала прощанию больше нежности, но не сделала его легче. Дочери он обещает короткую войну. Мне рассказывает о ветрах, разведчиках и медленном сборе флота, пока [aemon_dragon.GetFirstName] скребёт когтями камни. Я сам застёгиваю сыну плащ, как в детстве, и ничего не говорю о своих страхах."
 fab_children.1006.desc.rhaenys:0 "На девятый день третьей луны [aemon.GetFirstName] отправляется к ожидающим кораблям, и я иду проводить его. Он только что узнал, что [rhaenys.GetFirstName] ждёт ребёнка, и эта весть придала прощанию больше нежности, но не сделала его легче. Дочери он обещает короткую войну. Мне рассказывает о ветрах, разведчиках и медленном сборе флота, словно тщательный разбор планов может заменить слова, которых мы оба не произносим. Я сам застёгиваю ему плащ, как в детстве, и ничего не говорю о своих страхах."
 fab_children.1006.desc.dragon:0 "На девятый день третьей луны [aemon.GetFirstName] отправляется в путь. Я провожаю его туда, где ждёт [aemon_dragon.GetFirstName]. Он говорит о ветрах, разведчиках и медленном сборе флота, словно тщательный разбор планов может заменить слова, которых мы оба не произносим. [aemon_dragon.GetFirstName] нетерпеливо рвётся в небо. Я сам застёгиваю сыну плащ, как в детстве, и ничего не говорю о своих страхах."
 fab_children.1006.desc.fallback:0 "На девятый день третьей луны [aemon.GetFirstName] отправляется к ожидающим кораблям, и я иду проводить его. Он говорит о ветрах, разведчиках и медленном сборе флота, словно тщательный разбор планов может заменить слова, которых мы оба не произносим. Я сам застёгиваю ему плащ, как в детстве, и ничего не говорю о своих страхах."
 fab_children.1006.a:0 "Отправляйся. Ветер попутный."
 fab_children.1007.t:0 "Раньше флота"
 fab_children.1007.desc.holder_dragon:0 "[aemon_dragon.GetFirstName] уже пролетает над Тартом, отбрасывая на землю тень, а [lord_tarth.GetTitledFirstName] всё ещё ждёт появления хотя бы одного королевского паруса. Мирийцы удерживают восточное побережье, но правитель Тарта с сохранившими верность воинами отступает в горы. Мой сын приземляется среди лагерных костров и берётся за порученное дело: считает корабли, отмечает тропы, готовит позиции на высотах к прибытию нашего войска. Его письмо спокойно. Я перечитываю его трижды, пытаясь понять, о чём он умолчал."
 fab_children.1007.desc.holder:0 "[aemon.GetFirstName] уже прибывает на Тарт, а [lord_tarth.GetTitledFirstName] всё ещё ждёт появления хотя бы одного королевского паруса. Мирийцы удерживают восточное побережье, но правитель Тарта с сохранившими верность воинами отступает в горы. Мой сын присоединяется к их лагерю и берётся за порученное дело: считает корабли, отмечает тропы, готовит позиции на высотах к прибытию нашего войска. Его письмо спокойно. Я перечитываю его трижды, пытаясь понять, о чём он умолчал."
 fab_children.1007.desc.dragon:0 "[aemon_dragon.GetFirstName] уже пролетает над Тартом, отбрасывая на землю тень, а на горизонте ещё не видно ни одного королевского паруса. Мирийцы удерживают восточное побережье, но защитники острова отступают в горы. Мой сын приземляется среди лагерных костров и берётся за порученное дело: считает корабли, отмечает тропы, готовит позиции на высотах к прибытию нашего войска. Его письмо спокойно. Я перечитываю его трижды, пытаясь понять, о чём он умолчал."
 fab_children.1007.desc.fallback:0 "[aemon.GetFirstName] уже прибывает на Тарт, а на горизонте ещё не видно ни одного королевского паруса. Мирийцы удерживают восточное побережье, но защитники острова отступают в горы. Мой сын присоединяется к их лагерю и берётся за порученное дело: считает корабли, отмечает тропы, готовит позиции на высотах к прибытию нашего войска. Его письмо спокойно. Я перечитываю его трижды, пытаясь понять, о чём он умолчал."
 fab_children.1007.a:0 "Флот должен поторопиться."
 fab_children.1008.t:0 "Двое в горах"
 fab_children.1008.desc.holder_dragon:0 "Следующее донесение начинается с двух мирийских разведчиков, подобравшихся слишком близко к лагерю. Ниже гребня ждёт [aemon_dragon.GetFirstName]. У командного шатра [aemon.GetFirstName] держит совет; рядом с ним [lord_tarth.GetTitledFirstName]. Одного разведчика берут живым. Второй поднимает арбалет, целясь в лорда Тарта. Мой сын стоит рядом с ним."
 fab_children.1008.desc.holder:0 "Следующее донесение начинается с двух мирийских разведчиков, подобравшихся слишком близко к лагерю. У командного шатра [aemon.GetFirstName] держит совет; рядом с ним [lord_tarth.GetTitledFirstName]. Одного разведчика берут живым. Второй поднимает арбалет, целясь в лорда Тарта. Мой сын стоит рядом с ним."
 fab_children.1008.desc.dragon:0 "Следующее донесение начинается с двух мирийских разведчиков, подобравшихся слишком близко к лагерю. Ниже гребня ждёт [aemon_dragon.GetFirstName]. У командного шатра [aemon.GetFirstName] совещается с защитниками Тарта. Одного разведчика берут живым. Второй поднимает арбалет, целясь в предводителя защитников острова. Мой сын стоит рядом с ним."
 fab_children.1008.desc.fallback:0 "Следующее донесение начинается с двух мирийских разведчиков, подобравшихся слишком близко к лагерю. У командного шатра [aemon.GetFirstName] совещается с защитниками Тарта. Одного разведчика берут живым. Второй поднимает арбалет, целясь в предводителя защитников острова. Мой сын стоит рядом с ним."
 fab_children.1008.a:0 "Прочитай мне остальное."
 fab_children.1002.t:0 "Арбалетная стрела в горле"
 fab_children.1002.desc:0 "Арбалетная стрела, предназначенная лорду Тарта, не находит цели: рядом стоит [aemon.GetFirstName], и она пробивает ему горло. Ни последнего приказа, ни прощальных слов. Ни один мейстер в лагере не успевает помочь, и люди могут лишь поддерживать моего сына, пока тот захлёбывается собственной кровью. Я читаю письмо раз за разом, пока написанное не теряет всякий смысл. Он вернётся домой, на погребальный костёр, как и положено людям нашей крови. От него не останется ничего, что можно было бы предать земле по вестеросскому обычаю."
 fab_children.1002.a:0 "Мой сын мёртв."
 fab_children.1003.t:0 "Стрела пролетает мимо"
 fab_children.1003.desc:0 "Арбалетчик стреляет, но [aemon.GetFirstName] оборачивается на крик. Железо разрывает кожу сбоку на шее, вместо того чтобы вонзиться в горло. Рана вызывает лихорадку, и три ночи лагерь готовится одновременно к победе и к погребальному костру принца. На четвёртое утро он пьёт, говорит и спрашивает, прибыл ли наконец флот."
 fab_children.1003.a:0 "Привезите его ко мне. Не спеша, на корабле."
 fab_children.1004.t:0 "Ответ брата"
 fab_children.1004.desc:0 "[baelon.GetFirstName] не спрашивает моего дозволения. Он поднимается в небо; его несёт [baelon_dragon.GetFirstName]. Перелетев пролив, он обрушивается на мирийские корабли, пока люди ещё спускают с горы его брата. Мачты превращаются в факелы. Палубы раскалываются от жара, а тех, кто добирается до берега, встречают мечи воинов Тарта. Певцы назовут это победой. А это был лишь брат, которому некуда девать своё горе. Когда он возвращается, от него всё ещё пахнет дымом. Я обнимаю его, ни словом не обмолвившись о разрешении, которого он так и не попросил."
 fab_children.1004.a:0 "Я понимаю, сын мой."
 fab_children.1005.t:0 "Пустой стул"
 fab_children.1005.desc:0 "Я распускаю двор. Рядом со мной садится [alysanne.GetFirstName]; здесь никто из советников не увидит, что нам больше не хватает сил держаться. Мы вспоминаем драконье яйцо, которое я положил ему в колыбель в ночь после рождения, Дейнерис, помыкавшую младшим братом во дворе, и принца, которым мы хотели его видеть, ни разу не спросив, тяжело ли ему нести это бремя. Алисанна повторяет его имя, пока не срывается голос. Потом мы просто сидим, и никто не встаёт зажечь свечи."
 fab_children.1005.a:0 "Произноси его имя так часто, как тебе нужно, Алисанна."
 fab_children.1010.t:0 "Вопрос престолонаследия"
 fab_children.1010.desc.baelon:0 "Кресло Эймона пустует, но его право на наследство не умерло вместе с ним. [senior_claimant.GetTitledFirstName] — его дитя и первый представитель старшей ветви в порядке наследования. [baelon.GetTitledFirstName] может противопоставить этому возраст, заслуги и поддержку каждого лорда, который настаивает, что корона должна переходить через мужчин. Законы, которые я упорядочивал всю жизнь, не дают однозначного ответа. Старшая ветвь, ближайший родственник-мужчина или кто-то ещё из живых претендентов моей крови — кому достанется трон, должен решить я."
 fab_children.1010.desc.rhaenys:0 "Кресло Эймона пустует, но его право на наследство не умерло вместе с ним. [senior_claimant.GetTitledFirstName] — его дитя и первый представитель старшей ветви в порядке наследования. Другие мои родичи будут обосновывать свои притязания возрастом, полом, заслугами и степенью родства. Законы, которые я упорядочивал всю жизнь, не дают однозначного ответа. Чьё бы имя я ни назвал, кто-то из моей семьи сегодня поймёт, что выбрали не его."
 fab_children.1010.a:0 "Род Эймона не кончается на Эймоне. Мой выбор — [senior_claimant.GetFirstName]."
 fab_children.1010.b:0 "Королевству нужен взрослый мужчина. Мой выбор — [baelon.GetFirstName]."
 fab_children.1010.c:0 "Представьте мне всех живых претендентов моей крови."
 fab_children.1010.desc.baelon_multi:0 "Кресло Эймона пустует, но его право на наследство не умерло вместе с ним. После него осталось несколько живых претендентов; первым в порядке наследования старшей ветви стоит [senior_claimant.GetTitledFirstName]. [baelon.GetTitledFirstName] может противопоставить этому возраст, заслуги и поддержку каждого лорда, который настаивает, что корона должна переходить через мужчин. Законы, которые я упорядочивал всю жизнь, не дают однозначного ответа. Старшая ветвь, ближайший родственник-мужчина или кто-то ещё из живых претендентов моей крови — кому достанется трон, должен решить я."
 fab_children.1010.desc.senior_multi:0 "Кресло Эймона пустует, но его право на наследство не умерло вместе с ним. После него осталось несколько живых претендентов; первым в порядке наследования старшей ветви стоит [senior_claimant.GetTitledFirstName]. Другие мои родичи будут обосновывать свои притязания возрастом, полом, заслугами и степенью родства. Законы, которые я упорядочивал всю жизнь, не дают однозначного ответа. Чьё бы имя я ни назвал, кто-то из моей семьи сегодня поймёт, что выбрали не его."
 fab_children.1010.desc.none:0 "Кресло Эймона пустует, и на этот раз занять его некому. Ни одного его ребёнка не осталось в живых, ни один брат не готов стать преемником. В прошениях на моём столе отстаивают права мужчин и женщин, чьё место в родословной я едва могу припомнить. Законы, которые я упорядочивал всю жизнь, не дают однозначного ответа. Сегодня они не дают даже кандидата."
 fab_children.1010.d:0 "Никого. Решение придётся отложить, а мне — лишиться сна."
 fab_children.1014.t:0 "Вторая ссора"
 fab_children.1014.desc.baelon:0 "Алисанна узнаёт о моём решении без посредничества придворных, которые могли бы смягчить весть. Она спрашивает, почему [rhaenys.GetFirstName] должна лишиться наследства, которое бесспорно принадлежало бы ей, родись она сыном. Я говорю о мире, прецедентах и опасностях, подстерегающих женщину на троне. Каждый довод звучит ещё холоднее, когда произносишь его перед женщиной, которая помогла тебе построить это королевство. Если женщина для меня менее полезна, чем мужчина, отвечает она, значит, и сама она мне больше не нужна. Прежде чем я успеваю взять слова обратно, она уже приказывает домочадцам собираться на Драконий Камень."
 fab_children.1014.desc.other:0 "Алисанна узнаёт о моём решении без посредничества придворных, которые могли бы смягчить весть. Она спрашивает, почему [rhaenys.GetFirstName] должна лишиться наследства Эймона и почему вместо неё его получит [chosen_heir.GetTitledFirstName]. Я говорю о мире, прецедентах и бремени власти. Каждый довод звучит ещё холоднее, когда произносишь его перед женщиной, которая помогла тебе построить это королевство. Если её советы и права женщины значат так мало, отвечает она, значит, и сама она мне больше не нужна. Прежде чем я успеваю взять слова обратно, она уже приказывает домочадцам собираться на Драконий Камень."
 fab_children.1014.desc.fallback:0 "Алисанна узнаёт о моём решении без посредничества придворных, которые могли бы смягчить весть. Она спрашивает, как я могу после одной смерти обойти старшую ветвь и объявить, что трон унаследует [chosen_heir.GetTitledFirstName]. Я говорю о мире, прецедентах и бремени власти. Каждый довод звучит ещё холоднее, когда произносишь его перед женщиной, которая помогла тебе построить это королевство. Если её советы значат так мало, отвечает она, значит, и сама она мне больше не нужна. Прежде чем я успеваю взять слова обратно, она уже приказывает домочадцам собираться на Драконий Камень."
 fab_children.1014.a:0 "Если должна уехать — уезжай."
 fab_children.1015.t:0 "Права старшей ветви"
 fab_children.1015.desc:0 "Алисанна дважды читает указ, прежде чем поднять глаза. Мой выбор — [chosen_heir.GetTitledFirstName]. Я сохранил право Эймона на престол за его дочерью, а не объявил со смертью сына пресекшейся и всю его ветвь. Моя королева не притворяется, будто лорды спокойно это примут. Она лишь берёт меня за руку и говорит, что сегодня я вспомнил о праве крови, а не только о порядках, заведённых мужчинами."
 fab_children.1015.a:0 "Какое бы сопротивление ни возникло, мы встретим его вместе."
 fab_children.1011.t:0 "Дочь между нами"
 fab_children.1011.desc:0 "[maegelle.GetFirstName] говорит за меня там, где гордость заставляла меня молчать. Она напоминает: [alysanne.GetFirstName] и я слишком многое пережили вместе, чтобы теперь позволить трону встать между нами. Моё решение останется в силе. Но молчать я больше не обязан."
 fab_children.1011.a:0 "Прости меня, Алисанна."
 fab_children.1100.t:0 "Последние роды Алиссы"
 fab_children.1100.desc:0 "[alyssa_daughter.GetFirstName] лежит в постели, и у её ложа радость от рождения сына сменяется страхом. Кровотечение ослабло, но её охватил жар, а мейстеры отводят глаза, когда я требую определённости. Септа, опустившись на колени у изножья, молит Мать о милосердии. Никогда ещё я так не хотел верить, что её услышат. Моя бесстрашная дочь, всегда любившая смеяться, тянется к моей руке и дважды спрашивает, здоров ли мальчик."
 fab_children.1100.a:0 "Я не покину эту комнату."
 fab_children.1100.a.tt:0 "Бейлон потрясён смертью Алиссы. Он станет #V вдовцом#! и в память о ней никогда больше не женится."
 fab_children.1101.t:0 "Сын Алиссы"
 fab_children.1101.desc:0 "Маленький [infant_aegon.GetFirstName] с трудом делает каждый слабый вдох. Кормилица говорит, что руки у него отцовские. Мейстер не говорит ничего. В час волка, когда старики умирают, а младенцы появляются на свет, крошечные пальцы в последний раз сжимаются вокруг моего пальца — и замирают."
 fab_children.1101.a:0 "Неведомый милостив к самым маленьким. Сегодня я буду держаться за эту мысль."
 fab_children.1150.t:0 "Предстоящий брак"
 fab_children.1150.desc.alysanne:0 "[alyssa_daughter.GetFirstName] едва научилась ходить, когда её постоянным спутником стал [baelon.GetFirstName]. Годами он жаловался: сестра ходит за ним по пятам, словно щенок, да ещё и угораздило её родиться девочкой. В шесть лет ей сломали нос деревянным мечом на тренировочном дворе. Он сросся криво, но она ни разу не попросила мейстера это исправить.\n\nВ какой-то момент жалобы прекратились.\n\n[alysanne.GetFirstName] давно всё решила и никогда этого не скрывала. Стоило предложить нашей дочери другого жениха, как моя королева отвечала: ей предназначен [baelon.GetFirstName]. И больше ничего слышать не желала."
 fab_children.1150.desc.fallback:0 "[alyssa_daughter.GetFirstName] едва научилась ходить, когда её постоянным спутником стал [baelon.GetFirstName]. Годами он жаловался: сестра ходит за ним по пятам, словно щенок, да ещё и угораздило её родиться девочкой. В шесть лет ей сломали нос деревянным мечом на тренировочном дворе. Он сросся криво, но она ни разу не попросила мейстера это исправить.\n\nВ какой-то момент жалобы прекратились. Её мать заметила это раньше меня и повторяла так часто, что при дворе до сих пор вспоминают её слова: нашей девочке предназначен [baelon.GetFirstName], и о других женихах речи быть не может."
 fab_children.1150.a:0 "Обручить Алиссу с Бейлоном."
 fab_children.1150.b:0 "Их браки буду устраивать я. И пока рано."
 fab_children.1150.b.tt:0 "Алисса и Бейлон останутся необручёнными и смогут получить другие предложения. Событие последних родов Алиссы не произойдёт, если она не выйдет замуж за Бейлона и не родит ему сына."
 fab_children.1200.t:0 "Боль в боку Бейлона"
 fab_children.1200.desc:0 "[baelon.GetFirstName] возвращается с охоты и жалуется на колющую боль в боку. К часу летучей мыши он уже не может стоять. Боль уходит вглубь живота, за ней приходит лихорадка, и с каждым часом сил у него всё меньше. Я вызываю великого мейстера и приказываю испробовать всё, чему его учили в Цитадели, а затем и то, чему не учили."
 fab_children.1200.a:0 "Не жалейте ни капли лекарства. Не теряйте ни часа."
 fab_children.1202.t:0 "Лопнувший живот"
 fab_children.1202.desc:0 "Пять рассветов сменили друг друга, пока [baelon.GetFirstName] лежал в постели, а я сидел рядом. Снадобья мейстеров притупляют боль, но бессильны против того, что скрывается за ней и убивает его. Мой сын ненадолго приходит в себя, узнаёт меня, сжимает мою руку и говорит, что устал. Я отвечаю: тогда спи. Шестой рассвет я встречаю один."
 fab_children.1202.a:0 "Неведомый забрал моего сына."
 fab_children.1203.t:0 "Лихорадка отступает"
 fab_children.1203.desc:0 "Я едва верю великому мейстеру, когда он говорит, что вздутие спало. Но вот [baelon.GetFirstName] пьёт без рвотных позывов, спит без жара, а проснувшись, требует объяснить, долго ли я собираюсь держать его в постели. Выздоровление идёт медленно. Каждый шаг на этом пути возвращает мне сына, которого я уже начал мысленно хоронить."
 fab_children.1203.a:0 "Наградить всех, кто за ним ухаживал."
 fab_children.1250.t:0 "Призвание Мейгель"
 fab_children.1250.desc:0 "Каждый вечер перед сном [maegelle.GetFirstName] читает #italic «Семиконечную звезду»#!. Она кротка там, где сёстры проявляют своенравие, тиха там, где двор требует блеска, и счастливее всего, когда септа позволяет ей ухаживать за больным ребёнком или переписывать страницу священного учения. Алисанна напоминает мне о своём обещании Матери, данном при рождении этой дочери: в благодарность посвятить одну из девочек служению Вере. Я ждал слёз, когда мы заговорили об этом. Мейгель спрашивает, когда можно начинать."
 fab_children.1250.a:0 "Пусть Старомест примет её, а Семеро обретут служительницу лучшую, чем я заслуживаю."
 fab_children.1250.b:0 "Моя дочь остается при дворе."
 fab_children.1260.t:0 "Принц, который предпочитал книги"
 fab_children.1260.desc:0 "Ни мечи, ни кони, ни драконы никогда надолго не увлекали моего сына — [vaegon.GetFirstName] живёт книгами. Великий мейстер прямо говорит мне: сыну не хватает ни терпения для воронов, ни душевного тепла для службы в замке. Но Цитадель ещё может сделать из него архимейстера, если позволить ему посвятить жизнь числам и высшим тайнам. Я сообщаю Вейгону, что через две недели корабль отправится в Старомест. Впервые я почти вижу его улыбку. «Да, отец, — говорит он. — Хорошо»."
 fab_children.1260.a:0 "Отправить Вейгона в Цитадель."
 fab_children.1260.b:0 "Принц крови не станет слугой."
 fab_children.1300.t:0 "Муж для Дейллы"
 fab_children.1300.desc.rodrik_holder:0 "Я спрашиваю дочь о Долине. [daella.GetFirstName] с теплом вспоминает, как учтиво принимали её при дворе, которым правит [eyrie_lord.GetTitledFirstName]. Но особенно тепло она говорит о том, как добр к ней был [rodrik.GetTitledFirstName]. Для этой моей дочери мягкость мужа важнее его блеска. Я могу и повременить с помолвкой, поискать другого человека, достойного её доверия."
 fab_children.1300.desc.rodrik:0 "Я спрашиваю дочь об Орлином Гнезде. [daella.GetFirstName] с теплом вспоминает радушный приём, но особенно тепло говорит о том, как добр к ней был [rodrik.GetTitledFirstName]. Для этой моей дочери мягкость мужа важнее его блеска. Я могу и повременить с помолвкой, поискать другого человека, достойного её доверия."
 fab_children.1300.desc.fallback:0 "Я спрашиваю дочь об Орлином Гнезде. [daella.GetFirstName] отвечает учтиво, но без надежды. Аррен, которого ей прочили, теперь недоступен: либо умер, либо связан другим брачным договором. Для этой моей дочери мягкость мужа важнее его блеска. Пусть лучше она подождёт, чем окажется в неподходящей семье."
 fab_children.1300.a:0 "Пусть это будет [rodrik.GetTitledFirstName]. По крайней мере, он будет к ней добр."
 fab_children.1300.b:0 "Пока никаких обещаний. Возможно, найдётся более достойный жених."
 fab_children.1300.b.tt:0 "Дейлла останется необручённой и сможет получить другое брачное предложение."
 fab_children.1301.t:0 "Опустевшие покои Орлиного Гнезда"
 fab_children.1301.desc:0 "Из Орлиного Гнезда приходят тяжёлые вести. [eyrie_lady.GetTitledFirstName] внезапно слегла, и мейстеры Долины почти не надеются на её выздоровление. Я не могу радоваться смерти, которая открывает путь Дейлле. Могу лишь заметить, что путь теперь свободен."
 fab_children.1301.a:0 "Пусть Долина сначала похоронит её. Разговор о моей дочери подождёт, пока стихнет горе."
 fab_children.1310.t:0 "Полёт в Орлиное Гнездо"
 fab_children.1310.desc:0 "[alysanne.GetFirstName] уже взбирается на Среброкрылую, а я всё ещё держу письмо: [daella.GetFirstName] ждёт ребёнка и боится. Моя королева не позволит, чтобы в такую минуту их разделяло целое королевство. Я убеждаю себя, что мейстеры Орлиного Гнезда искусны. Алисанна не спорит. Только смотрит на меня так же, как тогда, когда я отмахнулся от первого предостережения об этом браке."
 fab_children.1310.a:0 "Лети скорее. Я пошлю весть в Орлиное Гнездо."
 fab_children.1311.t:0 "Дочь за дочь"
 fab_children.1311.desc:0 "Один ворон приносит и милость, и жестокость. [daella.GetFirstName] родила здоровую девочку, но после родов её мучает жар, перед которым бессильны мейстеры. Она не одна. А меня от неё отделяет целое королевство, и ворон летел несколько дней. В септе внизу уже зажигают свечи Матери: так поступают люди, когда мейстеры перестают что-либо обещать."
 fab_children.1311.a:0 "Я слишком многого требовал и слишком торопился. Прости, милая девочка."
 fab_children.1400.t:0 "Невеста для Белой Гавани"
 fab_children.1400.desc.holder:0 "Алисанна предлагает дочери жениха: [white_harbor_lord.GetTitledFirstName]. Но [viserra.GetFirstName] недовольна. Лорд Белой Гавани старше нашей дочери и уже бывал женат, зато он рассудителен, учтив и владеет крупнейшим портом Севера. Визерра слышит только о возрасте и расстоянии. Если матери так нравится этот человек, говорит она, пусть сама выходит за него замуж. За дерзостью скрывается другое честолюбивое желание. Визерра давно посматривает на Железный трон, а брак с неженатым братом позволил бы ей остаться возле него."
 fab_children.1400.desc.fallback:0 "Брак с Белой Гаванью, который Алисанна задумала для нашей дочери, не состоится: [viserra.GetFirstName] осталась без жениха. Выбранный лорд умер или уже связан другим обещанием. Визерра считает неудачу победой и вновь обращает взгляд к Железному трону. Если кто-то из её братьев ещё не женат, древний обычай нашего рода оставляет такой путь. Иначе её рука останется свободной, пока я не найду партию получше."
 fab_children.1400.a:0 "Одобрить брак с Белой Гаванью."
 fab_children.1400.aegon:0 "Я обручаю Визерру с Эйгоном."
 fab_children.1400.aemon:0 "Я обручаю Визерру с Эймоном."
 fab_children.1400.baelon:0 "Я обручаю Визерру с Бейлоном."
 fab_children.1400.vaegon:0 "Я обручаю Визерру с Вейгоном."
 fab_children.1400.gaemon:0 "Я обручаю Визерру с Геймоном."
 fab_children.1400.valerion:0 "Я обручаю Визерру с Валерионом."
 fab_children.1400.b:0 "Найти Визерре лучшую партию, чем лорд Белой Гавани."
 fab_children.1400.b.tt:0 "Королевская помолвка не состоится. Визерра останется свободна и сможет получить другое предложение."
 fab_children.1401.t:0 "Последняя ночь"
 fab_children.1401.desc:0 "Накануне отъезда [viserra.GetFirstName] просит позволить ей провести последнюю ночь с друзьями детства. Я соглашаюсь. Остальное я узнаю от золотых плащей и её спутников, слишком напуганных, чтобы складно лгать: таверна за таверной, вино, смех и свобода, которую, по её убеждению, отнимет Белая Гавань. Затем — скачка домой сквозь темноту в час совы. На Мучной улице упала кобыла. До рассвета мне приносят дочь со сломанной шеей, и она не слышит ни слова из того, что я говорю."
 fab_children.1401.a:0 "Моя дочь... нет."
 fab_children.1403.t:0 "Возвращение домой"
 fab_children.1403.desc.kingsguard:0 "В час волка раздаётся стук в дверь. На пороге [bedchamber_witness.GetFirstName], королевский гвардеец в испачканном белом плаще; на руках — моя дочь без сознания. [alysanne.GetFirstName] вскакивает с постели раньше меня.\n\n[bedchamber_witness.GetFirstName] пересказывает мне слова её спутников, и каждый рассказывал по-своему: таверна за таверной, скачка домой в темноте, упавшая на Мучной улице кобыла. По всему выходило, что [viserra.GetFirstName] должна была удариться головой о камни. Но не ударилась. То ли руки вспомнили то, что вино стёрло из памяти, то ли Мать позаботилась о девушке, не подумавшей обратиться к ней с молитвой, — правды я так и не узнаю. Два ребра сломаны, и от дочери всё ещё кисло пахнет вином.\n\nКогда мейстер уходит, она открывает глаза, видит нас обоих над собой и ещё смеет улыбаться."
 fab_children.1403.desc.kingsguard_alone:0 "В час волка раздаётся стук в дверь. На пороге [bedchamber_witness.GetFirstName], королевский гвардеец в испачканном белом плаще; на руках — моя дочь без сознания.\n\n[bedchamber_witness.GetFirstName] пересказывает мне слова её спутников, и каждый рассказывал по-своему: таверна за таверной, скачка домой в темноте, упавшая на Мучной улице кобыла. По всему выходило, что [viserra.GetFirstName] должна была удариться головой о камни. Но не ударилась. То ли руки вспомнили то, что вино стёрло из памяти, то ли Мать позаботилась о девушке, не подумавшей обратиться к ней с молитвой, — правды я так и не узнаю. Два ребра сломаны, и от дочери всё ещё кисло пахнет вином.\n\nКогда мейстер уходит, она открывает глаза, видит меня одного над собой и ещё смеет улыбаться."
 fab_children.1403.desc.captain:0 "В час волка раздаётся стук в дверь. На пороге [bedchamber_witness.GetFirstName], ещё в кольчуге; на руках — моя дочь без сознания. [alysanne.GetFirstName] вскакивает с постели раньше меня.\n\n[bedchamber_witness.GetFirstName] пересказывает мне слова её спутников, и каждый рассказывал по-своему: таверна за таверной, скачка домой в темноте, упавшая на Мучной улице кобыла. По всему выходило, что [viserra.GetFirstName] должна была удариться головой о камни. Но не ударилась. То ли руки вспомнили то, что вино стёрло из памяти, то ли Мать позаботилась о девушке, не подумавшей обратиться к ней с молитвой, — правды я так и не узнаю. Два ребра сломаны, и от дочери всё ещё кисло пахнет вином.\n\nКогда мейстер уходит, она открывает глаза, видит нас обоих над собой и ещё смеет улыбаться."
 fab_children.1403.desc.captain_alone:0 "В час волка раздаётся стук в дверь. На пороге [bedchamber_witness.GetFirstName], ещё в кольчуге; на руках — моя дочь без сознания.\n\n[bedchamber_witness.GetFirstName] пересказывает мне слова её спутников, и каждый рассказывал по-своему: таверна за таверной, скачка домой в темноте, упавшая на Мучной улице кобыла. По всему выходило, что [viserra.GetFirstName] должна была удариться головой о камни. Но не ударилась. То ли руки вспомнили то, что вино стёрло из памяти, то ли Мать позаботилась о девушке, не подумавшей обратиться к ней с молитвой, — правды я так и не узнаю. Два ребра сломаны, и от дочери всё ещё кисло пахнет вином.\n\nКогда мейстер уходит, она открывает глаза, видит меня одного над собой и ещё смеет улыбаться."
 fab_children.1403.desc.fallback:0 "В час волка в наши покои приносят дочь. [viserra.GetFirstName] без сознания, от неё кисло пахнет вином, два ребра сломаны.\n\nЯ собираю случившееся по обрывкам пьяных рассказов: таверна за таверной, скачка домой в темноте, упавшая на Мучной улице кобыла. По всему выходило, что дочь должна была удариться головой о камни. Но не ударилась. То ли руки вспомнили то, что вино стёрло из памяти, то ли Мать позаботилась о девушке, не подумавшей обратиться к ней с молитвой, — никто не может мне объяснить.\n\nКогда мейстер уходит, она открывает глаза, видит меня над собой и ещё смеет улыбаться."
 fab_children.1403.a:0 "Прежде чем заснуть, выслушаешь меня. В Белую Гавань — лишь с дозволения мейстера."
 fab_children.1403.b:0 "Семеро уберегли тебя, когда я не смог. Я не стану омрачать этот дар криками."
 fab_children.1490.t:0 "Спутники принцессы"
 fab_children.1490.desc:0 "[saera.GetFirstName] окружила себя пятерыми молодыми придворными. [braxton.GetFirstName] Бисбери, уже прозванный при дворе Жалом за острый язык, красив, горд и опасно самодоволен. [jonah.GetFirstName] Мутон и рыжеволосый [roy.GetFirstName] Коннингтон — наследники, у которых смелости больше, чем осторожности. [alys_turnberry.GetFirstName] Тернберри и [perianne.GetFirstName] Мур не уступают моей дочери ни возрастом, ни красотой, ни тягой к проделкам. Они вместе пируют, выезжают на соколиную и обычную охоту, ходят под парусом. В их смехе я слышу безобидное веселье юности — и зарождение отдельного двора внутри моего."
 fab_children.1490.a:0 "Под моей крышей, у меня на глазах. Это лучше, чем Пекло."
 fab_children.1490.b:0 "Это неподходящая компания для принцессы."
 fab_children.1500.t:0 "Том Репа в «Голубой жемчужине»"
 fab_children.1500.desc:0 "Шута Тома Репу находят в увеселительном доме под названием «Голубая жемчужина». Он так пьян, что едва стоит. Рядом [braxton.GetFirstName], [jonah.GetFirstName] и [roy.GetFirstName] смеются над унизительной проделкой, которая привела королевского шута в такое место. Слуги говорят: дело не в одной безумной ночи. Уже больше года друзья Сейры меняются комнатами, подарками и секретами под моей собственной крышей. Я пропускал слухи мимо ушей, желая считать их пустыми. Но они оказались не пустыми."
 fab_children.1500.a:0 "Взять мужчин под стражу. Мы с Алисанной узнаем правду."
 fab_children.1501.t:0 "Допрос трёх девушек"
 fab_children.1501.desc:0 "Алисанна расспрашивает девушек по отдельности. Перианна Мур плачет. Элис Тернберри признаётся, что ждёт ребёнка, и не может с уверенностью сказать, кто из молодых людей его отец. Рассказы расходятся в мелочах, но сходятся во всём главном. Сейра не пала жертвой одного соблазнителя. Она сама затеяла игру, поддерживала её и вовлекла друзей. Моя королева передаёт мне их ответы, так отчаянно сдерживая гнев, что у неё дрожат руки."
 fab_children.1501.a:0 "Привести Сейру к Железному трону."
 fab_children.1502.t:0 "Как Эйгон и Мейгор"
 fab_children.1502.desc:0 "[saera.GetFirstName] ничего не отрицает. Бракстон Бисбери, Джонах Мутон и Рой Коннингтон — все были её любовниками. Когда я требую назвать того, за кого она собирается замуж, она улыбается и предлагает взять всех троих, как Эйгон Завоеватель взял двух жён. Затем вспоминает ещё и Мейгора. При звуке этого имени зал затихает. Я слышу, как дочь ставит свои желания вровень с волей завоевателя, и что-то во мне замирает. На другом конце зала Алисанна встречается со мной взглядом. Она просит не произносить слов, которые я уже готов сказать."
 fab_children.1502.a:0 "Запереть её. Я вынесу приговор каждому виновному."
 fab_children.1502.b:0 "В ней кровь дракона. Больше я ничего не желаю об этом слышать."
 fab_children.1503.t:0 "У дверей Драконьего Логова"
 fab_children.1503.desc:0 "[saera.GetFirstName] не проводит взаперти и одной ночи. Ускользнув от стражи, она пересекает город; её хватают у дверей Драконьего Логова. Хотела ли она оседлать дракона или лишь напугать меня, я не знаю. Но знаю, во что может превратиться семейный позор, если она в таком состоянии получит дракона. Я приказываю запереть её высоко в башне под непрерывной охраной. А внизу будут судить мужчин, разделявших её забавы."
 fab_children.1503.a:0 "Больше никаких уловок. Пора вынести приговор."
 fab_children.1507.t:0 "Суд над пятью"
 fab_children.1507.desc:0 "Джонах Мутон соглашается жениться на Перианне Мур и попытаться придать благопристойный вид их безрассудству. Рою Коннингтону предлагают Стену или десять лет за Узким морем; он выбирает изгнание. Элис Тернберри отправится в обитель до рождения ребёнка. Лишь Бракстон Бисбери отвергает любую милость. Жало требует суда поединком, уверенный, что юность, сила и моргенштерн посрамят любого седого бойца, которого я выставлю против него."
 fab_children.1507.a:0 "Остальным приговор вынесен. Привести ко мне Бисбери."
 fab_children.1508.t:0 "Этот старик"
 fab_children.1508.desc:0 "Бракстон стоит перед троном в начищенных доспехах: цепи нисколько не умерили его высокомерие. «Тогда я выбираю суд поединком. С кем из этих стариков вы прикажете мне сразиться?» Я уже спускаюсь по ступеням, прежде чем кто-либо из Королевской гвардии успевает ответить. За его спиной [saera.GetFirstName] смотрит на меня так, словно видит своего отца впервые."
 fab_children.1508.a:0 "Этот старик. Тот самый, чью дочь ты соблазнил и обесчестил."
 fab_children.1509.t:0 "Чёрное Пламя и моргенштерн"
 fab_children.1509.desc:0 "Мы сходимся в полных доспехах, подняв щиты. У него моргенштерн и вся сила девятнадцатилетнего юноши. У меня — Чёрное Пламя и терпение человека, пережившего войну, мятеж и большинство тех, с кем он начинал свой путь. Едва глашатай отступает, противник бросается на меня, обрушивая железо на мой щит. Он уверен: старость уступит, если бить достаточно часто. Я отступаю. Позволяю ему растрачивать гордыню, принимая её за силу. Затем начинаю теснить его сам."
 fab_children.1509.a:0 "Тогда Воин рассудит нас."
 fab_children.1511.t:0 "Последний вздох Жала"
 fab_children.1511.desc:0 "Его удары замедляются. Щит опускается, моргенштерн оттягивает руку. Когда он спотыкается, остриё Чёрного Пламени находит узкую щель в забрале. Ещё не успевает осесть тело, как двор замирает. Моя дочь не отводит взгляда. Я тоже. После поединка я отдаю приказ: [saera.GetFirstName] отправится в Старомест. Возможно, молитва и строгая дисциплина сделают то, чего не смог мой гнев."
 fab_children.1511.a:0 "Её примут Безмолвные сёстры."
 fab_children.1513.t:0 "Старик уступает"
 fab_children.1513.desc:0 "Моргенштерн Жала пробивает мою защиту и валит меня в грязь. Двор взрывается криками, прежде чем королевские гвардейцы успевают окружить нас. По закону, к которому я сам прибег, Бракстон Бисбери доказал свою невиновность перед богами и людьми. По лицам собравшихся видно: он нанёс удар и короне. Я не допущу его убийства за победу в поединке, которого потребовал сам. Но Сейра всё равно должна покинуть двор, пока её непокорность не уничтожила остатки моей семьи."
 fab_children.1513.a:0 "Признать исход поединка. Затем отправить Сейру в Старомест."
 fab_children.1514.t:0 "Обитель в Староместе"
 fab_children.1514.desc.maegelle:0 "[maegelle.GetFirstName] пишет из Староместа. Теперь [saera.GetFirstName] лишена шелков, волосы её острижены, а дни проходят в молитвах, молчании, грубой одежде и смиренном труде. Мейгель не притворяется, будто сестра это приняла. Она просит меня запастись терпением и обещает сама наставлять Сейру. Моей кроткой дочери уже доводилось мирить нас с Алисанной."
 fab_children.1514.desc.fallback:0 "Из обители в Староместе приходит письмо. Теперь [saera.GetFirstName] лишена шелков, волосы её острижены, а дни проходят в молитвах, молчании, грубой одежде и смиренном труде. Септы не притворяются, будто она это приняла. Они просят меня запастись терпением, и я соглашаюсь, хотя каждое донесение твердит: моя дочь изучает двери и стены усерднее, чем священные писания."
 fab_children.1514.a:0 "Строгость — да. Жестокость — никогда. Я видел, что она делает с моим родом."
 fab_children.1515.t:0 "Корабль до Лиса"
 fab_children.1515.desc.holder:0 "Через полтора года в обители находят пустую постель и аккуратно сложенное одеяние послушницы. [saera.GetFirstName] бежала из Староместа, села на корабль и пересекла Узкое море. Теперь она живёт в Лисе, где мир охраняет [lys_ruler.GetTitledFirstName]. Она променяла молитвы на сад наслаждений, а мой суд — на право самой распоряжаться собой. Я посылаю людей обыскивать причалы, которые она покинула несколько недель назад. Надо хоть что-то делать."
 fab_children.1515.desc.fallback:0 "Через полтора года в обители находят пустую постель и аккуратно сложенное одеяние послушницы. [saera.GetFirstName] бежала из Староместа, села на корабль и пересекла Узкое море, добравшись до Лиса. Она променяла молитвы на сад наслаждений, а мой суд — на право самой распоряжаться собой. Я посылаю людей обыскивать причалы, которые она покинула несколько недель назад. Надо хоть что-то делать."
 fab_children.1515.a:0 "Пока что нас разделяет Узкое море."
 fab_children.1504.t:0 "Дочь, которую я не назову"
 fab_children.1504.desc:0 "Проходят годы. [saera.GetFirstName] перебирается из Лиса в Волантис, богатеет и становится хозяйкой дома роскошнее, чем у многих лордов. Когда меня спрашивают, не позову ли я её домой, я отвечаю: у меня нет дочери в Волантисе. Двор удовлетворён этим ответом. Я — нет. И до сих пор помню, как застёгивал ей плащ, когда она была слишком мала, чтобы справиться с застёжкой."
 fab_children.1504.a:0 "Я не пошлю за ней."
 fab_children.1505.t:0 "Письмо из Волантиса"
 fab_children.1505.desc:0 "Ещё до того, как я ломаю печать, знакомый почерк подсказывает: мне пишет [saera.GetFirstName]. Письмо пришло из Волантиса от женщины, владеющей собственным домом. Она не просит ни денег, ни спасения. Не пытается оправдать то, что произошло между нами, — как не пытаюсь и я. Она спрашивает лишь об одном: может ли дочь пересечь море и поговорить с отцом, если на пристани её не будут ждать цепи, клятвы и прежние обвинения."
 fab_children.1505.a:0 "Передайте ей: на пристани цепей не будет."
 fab_children.1505.b:0 "Я не могу вновь бередить эту рану."
 fab_children.1600.t:0 "Тайна Гейль"
 fab_children.1600.desc:0 "[gael.GetFirstName] уже целую луну избегает меня и остальных домочадцев. Странствующий певец покинул двор, ни с кем не попрощавшись, и слуги принялись считать месяцы на пальцах. Я уже знаю, чего может стоить нашей семье молчание."
 fab_children.1600.a:0 "Осторожно. Не пугайте её."
 fab_children.1601.t:0 "Ребёнок, который не заплакал"
 fab_children.1601.desc:0 "[gael.GetFirstName] опустошена горем. Певец бросил её беременной. Ребёнок родился раньше срока и так и не заплакал. Ему не дали имени и не позвали септона: позвать его значило бы рассказать всему королевству. Она пережила всё в одиночестве, уверенная, что в ответ на просьбу о помощи услышит лишь упрёки в позоре. Я говорю, что она не одна. Не знаю, доходят ли до неё мои слова."
 fab_children.1601.a:0 "Её нельзя оставлять одну. Ни на час."
 fab_children.1602.t:0 "Черноводный залив"
 fab_children.1602.desc:0 "Когда я добегаю до берега, [gael.GetFirstName] стоит в тёмной воде, омывающей её ноги. Она раз оглядывается — не испуганно, лишь устало — и идёт дальше. Я зову её по имени. Всё ещё зову, когда волны скрывают её от глаз. У Веры нет милосердного слова для того, что она совершила. Пока я дышу, никто не произнесёт над ней жестоких слов."
 fab_children.1602.a:0 "Я опоздал."
 fab_children.1603.t:0 "Успеть до прилива"
 fab_children.1603.desc.alysanne:0 "[alysanne.GetFirstName] бежит к берегу, я — следом. Мы успеваем: [gael.GetFirstName] ещё не скрылась в волнах. В объятиях матери дочь даёт волю слезам и наконец рассказывает о певце, погибшем младенце и стыде, который привёл её к воде. Поддерживая с обеих сторон, мы уводим её домой."
 fab_children.1603.desc.jaehaerys:0 "Когда я добегаю до берега, [gael.GetFirstName] уже по колено в воде. Но прилив её не заберёт. Дочь рыдает в моих объятиях и наконец рассказывает о певце, погибшем младенце и стыде, который привёл её к воде. Я сам несу её обратно по берегу."
 fab_children.1603.a:0 "Отойди от воды, милая."
 fab_children.2000.t:0 "Корона без наследника"
 fab_children.2000.desc:0 "Едва успели похоронить Бейлона, как в Красный замок посыпались прошения. В одном письме отстаивают права старшей ветви, в другом — ближайшего живого родственника-мужчины, в третьем ссылаются на возраст и доказанные заслуги. Лорды, не согласные ни в чём другом, сходятся в одном: промедление превратит каждое предпочтение в отдельную партию. Всё своё правление я залечивал раны, оставленные спорами о престоле. Под своим саваном я не оставлю новую."
 fab_children.2000.a.vaegon:0 "Призвать Вейгона и выслушать его совет."
 fab_children.2000.a.citadel:0 "Послать в Цитадель и выслушать сенешаля."
 fab_children.2000.a.maester:0 "Пусть придёт [council_maester.GetFirstName]. Я выслушаю [council_maester.GetHerHis] совет."
 fab_children.2000.a.council:0 "Выслушать совет самых учёных мужей Вестероса."
 fab_children.2000.b:0 "Выбор за мной. Сейчас я назову наследника."
 fab_children.2002.t:0 "Непростой ответ"
 fab_children.2002.t.vaegon:0 "Ответ архимейстера"
 fab_children.2002.t.citadel:0 "Ответ сенешаля"
 fab_children.2002.t.grand_maester:0 "Ответ великого мейстера"
 fab_children.2002.t.maester:0 "Ответ мейстера"
 fab_children.2002.desc.vaegon:0 "[vaegon.GetFirstName] возвращается из Цитадели в мейстерском одеянии: исхудавший, поседевший и столь же скупой на любезности, как в день отъезда. Я излагаю ему притязания соперников и спрашиваю, чьё имя сохранит мир. Сын отказывается его назвать. «Пусть решат лорды», — говорит он. Не совет льстецов в моих покоях, а все лорды, претендующие на трон, и все, кто присягнёт рассудить их права. Королевство, возможно, примет общее решение своих представителей, даже если отвергло бы волю скорбящего старого короля."
 fab_children.2002.desc.citadel:0 "Цитадель присылает сенешаля. [council_maester.GetFirstName] прибывает из Староместа, и на [council_maester.GetHerHis] одеянии ещё видна дорожная пыль. Королю достаётся ровно столько учтивости, сколько обязывает выказать мейстерская цепь. Я знакомлю [council_maester.GetHerHim] с притязаниями соперников и спрашиваю, чьё имя сохранит мир. Ответ: такого имени нет. «Пусть решат лорды», — говорит [council_maester.GetSheHe]. Не совет льстецов в моих покоях, а все лорды, претендующие на трон, и все, кто присягнёт рассудить их права. Королевство, возможно, примет общее решение своих представителей, даже если отвергло бы волю скорбящего старого короля."
 fab_children.2002.desc.grand_maester:0 "Я обращаюсь к великому мейстеру, ведавшему воронами и записями все годы моего правления. [council_maester.GetFirstName] долго взвешивает притязания соперников и в конце концов отказывается назвать хоть одно имя. «Пусть решат лорды», — говорит [council_maester.GetSheHe]. Не совет льстецов в моих покоях, а все лорды, претендующие на трон, и все, кто присягнёт рассудить их права. Королевство, возможно, примет общее решение своих представителей, даже если отвергло бы волю скорбящего старого короля."
 fab_children.2002.desc.maester:0 "Я обращаюсь за советом к придворному мейстеру. [council_maester.GetFirstName] до конца выслушивает доводы соперников и отказывается назвать хоть одно имя. «Пусть решат лорды», — говорит [council_maester.GetSheHe]. Не совет льстецов в моих покоях, а все лорды, претендующие на трон, и все, кто присягнёт рассудить их права. Королевство, возможно, примет общее решение своих представителей, даже если отвергло бы волю скорбящего старого короля."
 fab_children.2002.desc.fallback:0 "Советники раскладывают передо мной притязания соперников, пока весь стол не скрывается под исписанными листами. Ни одно имя не обещает мира. Наконец один из них предлагает более трудный путь: выслушать каждого лорда с правом на трон и позволить собравшимся представителям королевства рассудить их. Лорды, возможно, примут собственное общее решение, даже если отвергли бы волю скорбящего старого короля."
 fab_children.2002.a:0 "Тогда я созову Великий совет."
 fab_children.2002.b:0 "Нет. Судьбу своего дома я не отдам на суд низшим лордам."
 fab_children.2003.t:0 "Дорога в Харренхол"
 fab_children.2003.desc.holder:0 "Я выбираю Харренхол. Там [harrenhal_lord.GetTitledFirstName] сможет разместить больше претендентов, чем любой лорд пожелал бы встретить за раз. Из Красного замка во все стороны разлетаются вороны. Полгода дороги заполняются знамёнами, повозками, присяжными мечами, просителями, бедными лордами и княжескими свитами. Более пятисот человек разместятся внутри стен, вдвое больше поставят шатры под чёрными башнями. Я остаюсь в Королевской Гавани. Чтобы совет мог высказаться свободно, моё присутствие не должно подсказывать ему ответ."
 fab_children.2003.desc.fallback:0 "Я выбираю Харренхол. В его полуразрушенных залах поместится больше претендентов, чем любой лорд пожелал бы встретить за раз. Из Красного замка во все стороны разлетаются вороны. Полгода дороги заполняются знамёнами, повозками, присяжными мечами, просителями, бедными лордами и княжескими свитами. Более пятисот человек разместятся внутри стен, вдвое больше поставят шатры под чёрными башнями. Я остаюсь в Королевской Гавани. Чтобы совет мог высказаться свободно, моё присутствие не должно подсказывать ему ответ."
 fab_children.2003.a:0 "Созвать их в Харренхол. Всех претендентов и всех лордов, присягнувших рассудить их права."
 fab_children.2004.t:0 "Притязания в Харренхоле"
 fab_children.2004.desc.three:0 "Донесения из Харренхола приходят такими тяжёлыми связками, что под ними согнётся и мейстер. Среди претендентов, чьи права рассматривают всерьёз, — [heir_candidate_1.GetTitledFirstName], [heir_candidate_2.GetTitledFirstName] и [heir_candidate_3.GetTitledFirstName]. Но в каждом письме по-своему решают, что важнее всего. Лорд Баратеон пишет, что обойти старшую ветвь — значит поставить под сомнение всякое наследование в Штормовых землях. Лорд Хайтауэр возражает: ни одна женщина не сидела на Железном троне и никогда не должна на него сесть. Блэквуд с Бракеном оказались на одной стороне, что тревожит меня сильнее самих споров. Я остаюсь в Королевской Гавани и читаю имена тех, чьи притязания ещё не отвергнуты."
 fab_children.2004.desc.two:0 "Донесения из Харренхола приходят такими тяжёлыми связками, что под ними согнётся и мейстер. Среди претендентов, чьи права рассматривают всерьёз, — [heir_candidate_1.GetTitledFirstName] и [heir_candidate_2.GetTitledFirstName]. Но в каждом письме по-своему решают, что важнее всего. Лорд Баратеон пишет, что обойти старшую ветвь — значит поставить под сомнение всякое наследование в Штормовых землях. Лорд Хайтауэр возражает: ни одна женщина не сидела на Железном троне и никогда не должна на него сесть. Блэквуд с Бракеном оказались на одной стороне, что тревожит меня сильнее самих споров. Я остаюсь в Королевской Гавани и читаю имена тех, чьи притязания ещё не отвергнуты."
 fab_children.2004.desc.one:0 "Донесения из Харренхола приходят такими тяжёлыми связками, что под ними согнётся и мейстер. [heir_candidate_1.GetTitledFirstName] стоит первым в числе живых претендентов, но даже одно имя заставляет Штормовой Предел спорить со Староместом, а Блэквуда — впервые за триста лет соглашаться с Бракеном. Я остаюсь в Королевской Гавани и читаю каждый довод, присланный советом."
 fab_children.2004.a:0 "Пришлите мне список оставшихся претендентов."
 fab_children.2005.t:0 "Претенденты передо мной"
 fab_children.2005.desc.council:0 "Передо мной вскрывают скреплённые печатями заключения. Доводы, подсчёты голосов, предостережения, имена и письмо септона, умоляющего помнить, что Отец судит королей последними и суровее всех. Всё что угодно, кроме закона, который избавил бы меня от необходимости решать самому. Смерти, браки, клятвы и решения всего моего правления сплели такую родословную, что ни одна мейстерская схема не сведёт её к простому правилу. Совет высказался. Мне предстоит поставить живого человека за словами #italic наследник Железного трона#!."
 fab_children.2005.desc.fallback:0 "Я отказался прятаться за решением совета. Передо мной живые претенденты со своими правами, и после выбора не будет подсчёта голосов, который позволил бы разделить ответственность. За словами #italic наследник Железного трона#! я должен поставить живого человека. Выбор будет моим — как и вся порождённая им вражда."
 fab_children.2007.t:0 "Живые претенденты"
 fab_children.2007.desc.aemon:0 "Смерть Эймона оставила после себя не только пустое кресло. Я велю по одному представить мне живых членов дома Таргариенов. Родословная позволяет проследить право на престол через умерших, но наследовать могут лишь живые. Прежде чем выбрать, я намерен увидеть каждого."
 fab_children.2007.desc.council:0 "Реестр совета не уместился на одной странице. На каждом листе — имя живого Таргариена и доводы за и против его притязаний. Ни один подсчёт голосов не сделает выбор за меня. Я хочу увидеть каждого члена своего дома, имеющего право на наследство, прежде чем вверить одному из них королевство."
 fab_children.2006.t:0 "Решение под печатью"
 fab_children.2006.desc.council:0 "Мне передают последнее письмо из Харренхола. Рядом с доводами совета я пишу имя того, кто будет править после меня: [gc_winner.GetTitledFirstName]. Последовал ли я воле лордов или пошёл ей наперекор — неопределённости положен конец. Я приказываю собрать двор и объявить имя преемника прежде, чем слухи превратятся в мятеж."
 fab_children.2006.desc.direct:0 "Я пишу имя того, кто будет править после меня: [gc_winner.GetTitledFirstName]. Этот выбор не прикрыт советом, ответственность за него не размыта подсчётом голосов. Таково решение Джейхейриса, Первого этого имени, принятое, пока у меня ещё есть силы добиться его исполнения. Я приказываю собрать двор и объявить имя преемника прежде, чем слухи превратятся в мятеж."
 fab_children.2006.a:0 "Откройте тронный зал. Королевство услышит моё решение."
 fab_children.2001.t:0 "Наследник провозглашён"
 fab_children.2001.desc:0 "Я встаю перед Железным троном и объявляю: престол по праву унаследует [gc_winner.GetTitledFirstName]. Сначала — приветственные возгласы, затем ропот, затем осторожное молчание тех, кто уже подсчитывает, чего стоило им моё решение. Ни один совет не мог бы уравнять все ветви моего рода, ни один король — удовлетворить всех претендентов. Королевство пролило бы куда больше крови из-за вопроса, оставленного без ответа, чем из-за ответа, который ему не нравится."
 fab_children.2001.a:0 "Занесите это в летопись. Пусть ни один лорд не сможет сказать, что не слышал."
 fab_children.heir_candidate_1:0 "Мой престол унаследует [heir_candidate_1.GetTitledFirstName]."
 fab_children.heir_candidate_2:0 "Мой престол унаследует [heir_candidate_2.GetTitledFirstName]."
 fab_children.heir_candidate_3:0 "Мой престол унаследует [heir_candidate_3.GetTitledFirstName]."
 fab_children.heir_candidates.more:0 "Покажите остальных претендентов."
 fab_children.heir_candidates.review:0 "Вернуться к первым претендентам."
 fab_children_shared_joy_opinion:0 "Общая радость за наших детей"
 fab_children_shared_grief_opinion:0 "Общая скорбь о наших детях"
 fab_children_heeded_queen_opinion:0 "Прислушался к моему совету"
 fab_children_ignored_queen_opinion:0 "Проигнорировал мой совет"
 fab_children_childbed_blame_opinion:0 "Вина за смерть нашей дочери"
 fab_children_succession_quarrel_opinion:0 "Ссора из-за престолонаследия"
 fab_children_reconciled_opinion:0 "Семья примирилась"
 fab_aemon_tarth_survivor_modifier:0 "Шрам Тарта"
 fab_aemon_tarth_survivor_modifier_desc:0 "На Тарте арбалетная стрела мирийца прошла на толщину пальца в стороне от горла. Шрам так и не исчез."
 fab_alyssa_childbed_survivor_modifier:0 "Пережила последние роды"
 fab_alyssa_childbed_survivor_modifier_desc:0 "Пережила роды, которые мейстеры уже сочли смертельными."
 fab_alyssa_late_fertility_modifier:0 "Всё ещё плодовита"
 fab_alyssa_late_fertility_modifier_desc:0 "Мейстеры считали, что она больше не сможет рожать. Они ошибались."
 fab_baelon_recovered_modifier:0 "Выздоровел от пятидневной болезни"
 fab_baelon_recovered_modifier_desc:0 "Болезнь живота должна была свести его в могилу, но он выжил."
 fab_viserra_broken_ribs_modifier:0 "Падение с лошади на Мучной улице"
 fab_viserra_broken_ribs_modifier_desc:0 "Два ребра сломаны при падении на булыжную мостовую. Мейстер туго перевязал их, не скрывая своего мнения о том, в котором часу она вернулась домой. Рёбра срастутся. Но до тех пор каждый глубокий вдох будет напоминать о падении."
 fab_infant_vigour_modifier:0 "Выходили вопреки всему"
 fab_infant_vigour_modifier_desc:0 "Этот ребёнок родился болезненным, и никто не ждал, что он выживет. Но кто-то отказался сдаваться."
