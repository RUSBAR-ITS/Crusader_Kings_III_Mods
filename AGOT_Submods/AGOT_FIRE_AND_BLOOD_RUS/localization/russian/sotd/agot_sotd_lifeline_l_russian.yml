l_russian:
 sotd_lifeline.0002.t:0 "Беременность в сорок шесть лет"
 sotd_lifeline.0002.desc:0 "Из Штормового Предела пришла весть, от которой весь двор замер: вдовствующая королева, моя мать Алисса, вновь беременна — в сорок шесть лет. [storm_lord.GetTitledFirstName] хвастается будущим ребёнком, но мейстеры пишут куда осторожнее. Предыдущие роды едва не убили её, и с тех пор здоровье так и не восстановилось.\n\nМать пишет, что довольна и что боги распорядятся по своей воле. Именно это пугает меня больше всего.\n\n#bold Когда придёт её срок, я отправлюсь в Штормовой Предел.#!"
 sotd_lifeline.0002.desc.no_holder:0 "Я получаю известие из Штормового Предела, которое успокаивает двор: вдовствующая королева, моя мать Алисса, снова беременна в сорок шесть лет. Замок радуется, а мейстеры пишут гораздо тщательнее. Последнее заключение чуть не убило ее, и с тех пор она никогда не была сильной.\n\nМоя мать пишет, что она довольна и что боги сделают то, что хотят. Это то, что пугает меня больше всего.\n\n#bold Когда придет ее время, я поеду в Штормовой Предел.#!"
 sotd_lifeline.0002.a:0 "Когда придёт её час, мы поскачем в Штормовой Предел."
 sotd_lifeline.0003.t:0 "Скорбь Штормового Предела"
 sotd_lifeline.0003.desc:0 "Я прибыл слишком поздно — осталось лишь горевать. Когда мы с Алисанной добрались до Штормового Предела, оказалось, что [storm_lord.GetTitledFirstName] напился в зале и не решается войти в спальню моей матери. Мейстер прямо сказал: она умирает, но ребёнка ещё можно спасти, если извлечь его, разрезав материнское чрево.\n\nЯ силой привёл лорда в комнату и заставил вслух сделать выбор, который принадлежал ему. Алисанна не отходила от матери. Одни клянутся, что та проснулась и дала согласие; другие — что она так и не пришла в себя. Я знаю лишь, что мать умерла, родив дочь, Джоселин.\n\n#bold Буря забрала самую кроткую душу из всех, что когда-либо знала.#!"
 sotd_lifeline.0003.desc.no_alysanne:0 "Я прибыл слишком поздно — осталось лишь горевать. В Штормовом Пределе оказалось, что [storm_lord.GetTitledFirstName] напился в зале и не решается войти в спальню моей матери. Мейстер прямо сказал: она умирает, но ребёнка ещё можно спасти, если извлечь его, разрезав материнское чрево.\n\nЯ силой привёл лорда в комнату и заставил вслух сделать выбор, который принадлежал ему. Одни клянутся, что мать проснулась и дала согласие; другие — что она так и не пришла в себя. Я знаю лишь, что она умерла, родив дочь, Джоселин.\n\n#bold Буря забрала самую кроткую душу из всех, что когда-либо знала.#!"
 sotd_lifeline.0003.desc.no_holder:0 "Я пришел слишком поздно для чего-либо, кроме горя. Когда мы с Алисанной прибыли в Штормовой Предел, мейстер прямо сказал нам, что Мать умирает, хотя ребенка можно спасти, если он отрежет от нее ребенка. Алисанна никогда не покидала мать. Некоторые клянутся, что моя мать проснулась и согласилась; другие клянутся, что она вообще не проснулась. Я знаю только, что она умерла, родив дочь Джоселин.\n\n#bold Буря забрала самую нежную душу, которую она когда-либо имела. #!"
 sotd_lifeline.0003.desc.no_holder_no_alysanne:0 "Я пришел слишком поздно для чего-либо, кроме горя. В Штормовом Пределе мейстер прямо сказал мне, что Мать умирает, хотя ребенка можно спасти, если он отрежет от нее ребенка. Некоторые клянутся, что моя мать проснулась и согласилась; другие клянутся, что она вообще не проснулась. Я знаю только, что она умерла, родив дочь Джоселин.\n\n#bold Буря забрала самую нежную душу, которую она когда-либо имела. #!"
 sotd_lifeline.0003.a:0 "Она проснулась и дала согласие. Я должен верить в это."
 sotd_lifeline.0003.b:0 "Она так и не проснулась. Возможно, это была единственная милость богов."
