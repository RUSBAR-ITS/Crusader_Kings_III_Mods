l_russian:
 jaehaerys.0001:0 "Дракон возвращается"
 jaehaerys.0001.desc:0 "Пока я укрываюсь вдали от суда, до меня доходит: Мейгор мертв. Они нашли моего дядю лежащим на Железном Троне, бледным и холодным, его собственная кровь текла под ним, а шипы этого жестокого сиденья глубоко впились в его плоть. Ни один человек не может сказать, претендует ли на него трон или невидимая рука, и немногие будут скорбеть.\n\nЯ не буду ждать отпуска. Я сажусь на Вермитора, Бронзовую Ярость, и направляю его крылья в сторону Королевской Гавани. Лорды и простой народ поднимут глаза и увидят возвращающегося дракона — не для того, чтобы сжечь их, как это сделал Мейгор, а для того, чтобы наконец положить конец ужасу.\n\nЯ Джейхерис из дома Таргариенов. Я собираюсь занять трон моего отца и руины моего дяди и сделать из них что-то достойное. Моя мать будет вести мою руку, а Лорд Рогар — свой меч. Работа по исцелению разрушенного мира начинается сейчас."
 jaehaerys.0001.option1:0 "Железный Трон мой."
 jaehaerys.0002:0 "Регентство"
 jaehaerys.0002.desc:0 "Война за трон выиграна еще до того, как она действительно началась. Большинство сторонников моего дяди покинули город; тех немногих, кто остался, я взял в цепи.\n\nИ все же я мальчик четырех и десяти лет, а мальчик не может править Семью Королевствами в одиночку. Итак, решено. Моя мать, вдовствующая королева Алисса Веларион, будет править как королева-регент, пока я не достигну совершеннолетия. А лорда Рогара Баратеона из Штормового Предела — сильного меча, который прошел, чтобы возвести меня на трон, — я называю Лордом-Защитником Королевства и Десницей Короля, чтобы он направлял мою руку в грядущие годы.\n\n#bold Вместе мы начнем перевязывать раны, оставленные моим дядей. #!"
 jaehaerys.0002.option1:0 "Пусть исцеление начнётся."
 jaehaerys.0003:0 "Правосудие короля"
 jaehaerys.0003.desc:0 "В королевстве полно людей, служивших Жестоким: лордов, преклонивших колени перед моим дядей, тюремщиков и исповедников, замучивших моего брата Визериса до смерти в черных камерах, и королевской гвардии Мейгора, белых плащей, присягнувших монстру.\n\nНекоторые становятся на колени и умоляют чернокожих. Сир Харролд Лэнгвард, бывший лорд-командующий Мейгора, ни перед кем не преклоняет колени — он отрицает мое право судить его и требует суда в бою. Моя мать и лорд Рогар советуют проявлять сдержанность, но выбор остается только за мной. Как начнется правление Джейхейриса?"
 jaehaerys.0003.option1:0 "Правосудие, смягчённое милосердием."
 jaehaerys.0003.trial_tt:0 "Сир Маладон Мур казнен за участие в убийстве королевы Тианны. Сир Харролд Лэнгвард требует суда поединком; Я бы сам взял меч, но королева-регент запрещает это, и наш чемпион сир Джайлс Морриген сбивает его с ног. Сир Джон Толлетт, сир Саймонд Крейн, сир Оливер Брэкен и сир Раймунд Мэллери берут черное."
 jaehaerys.0003.option2:0 "Пусть все умрут."
 jaehaerys.0003.option3:0 "Помиловать всех. Королевство достаточно истекло кровью."
 jaehaerys.0003.exile_tt:0 "Шестеро Мейгора избавлены и от меча, и от Стены, но милосердие — это не восстановление. У них отбирают белые плащи, и их ссылают за Узкое море, чтобы они доживали свои дни в качестве странствующих рыцарей при дворе Морского Лорда в Браавосе. Они никогда больше не будут охранять короля Вестероса."
 jaehaerys.0004:0 "Королевский мир с Верой"
 jaehaerys.0004.desc:0 "С юга приходит весть: септон Мун мертв, а Бедняги, осаждавшие Старомест, растаяли, как снег. Долгая война между драконом и Семерыми может наконец закончиться — если я позволю этому.\n\nЯ буду. Я клянусь, что Железный Трон будет защищать Веру Семи во все времена, но я больше не буду воскрешать Сынов Воина и Бедняков, и Воинствующая Вера сложит свои мечи навсегда. Я снимаю щедроты моего дяди Мейгора с голов верующих и прощаю всех, кто раскаивается; взамен Самый Благочестивый признает справедливость Короля, а Верховный Септон соглашается возложить на мою голову корону в Звездной Сентябрь. Дорога в Старомест открыта.\n\n#bold Люди скажут, что я король, который примиряет, а не сжигает. #!"
 jaehaerys.0004.option1:0 "Тогда отправимся в Старомест за короной."
 jaehaerys.0005:0 "Белый плащ для сына воина"
 jaehaerys.0005.desc:0 "Нужно принести еще одну клятву. Передо мной преклоняет колени сир Джоффри Доггетт — некогда Великий капитан Сынов Воина, Красный Пес, который нес меч и звезду против моего дома во имя Семи. Это лучший клинок, который когда-либо поднимали воины Веры, и я бы предпочел, чтобы такой человек охранял мою спину, чем видел, как за ним охотятся по холмам, как за зверем.\n\nЯ предлагаю ему белый плащ и место в моей Королевской гвардии. Он склоняет голову, откладывает звезду Сынов Воина и берет плащ, клянясь ценой своей жизни защитить короля и королевскую семью.\n\n#bold Бывший враг короны становится одним из ее самых верных мечей. #!"
 jaehaerys.0005.option1:0 "Встань, сир Королевской гвардии."
 jaehaerys.0006:0 "Золотая Свадьба"
 jaehaerys.0006.desc:0 "В этот, сорок девятый год после Завоевания, моя мать, вдовствующая королева, выходит замуж за лорда Рогара Баратеона на свадьбе, настолько роскошной, что простой народ уже называет ее Золотой свадьбой. Штормовой Предел опустошает свою казну; пир продлится две недели.\n\nЛорд Рогар мне очень нравится, и я уважаю его силу. И все же он не подумал попросить моего отпуска, прежде чем женить мою мать, а я король. Он называет это браком по любви; Я не так уверен. Мужчина, который уже был моей Десницей и Лордом-Защитником, теперь женится и на Королеве. Интересно, какая часть сердца Рогара действительно принадлежит моей матери, а какая — короне, которая находится так близко к его руке.\n\n#bold Я ничего не говорю. Мальчик-король учится держать язык за зубами и запоминать. #!"
 jaehaerys.0006.option1:0 "Он мог бы хотя бы спросить моего позволения."
 jaehaerys.0007:0 "Война за Белые Плащи"
 jaehaerys.0007.desc:0 "Пять белых плащей висят пустыми с тех пор, как я изгнал Королевскую гвардию моего дяди, и у моей матери есть идея заполнить их: пусть лучшие рыцари королевства займут свои места в большом турнире, который состоится после ее свадьбы. Я согласен, но я постановляю, что соперники будут сражаться пешими, а не верхом на лошадях. Враг редко сбивает короля с седла.\n\nОни сражаются семь дней, и вскоре рыцарские поединки забываются среди диких рукопашных схваток и кровавых поединков; сотни рыцарей сражаются с топорами, копьями и мечами за честь белых. Простонародье до хрипоты ревёт из-за своих любимцев — сира Уильяма Стаффорда, сира Тома Страммера, таинственного рыцаря, который оказывается женщиной Джонкил Дарк — но когда пыль оседает, пятеро стоят выше остальных.\n\nСир Лоренс Рокстон, сир Виктор Отважный, сир Уильям Оса, сир Пейт Вальдшнеп и старый одноглазый сир Сэмгуд из Кислого Холма преклоняют колени передо мной. Я приказываю им подняться, заклятые братья моей Королевской Гвардии.\n\n#bold Моих белых плащей снова семь. #!"
 jaehaerys.0007.option1:0 "Встаньте, братья Королевской гвардии."
 jaehaerys.0008:0 "Партия для короля"
 jaehaerys.0008.desc:0 "Золотая свадьба завершена, и лорд Рогар обращает свои амбиции ко мне. Он говорит, что у короля должна быть королева, и моя рука — самый ценный приз в королевстве — невеста из Утёса Кастерли, возможно, или Хайгардена, чтобы привязать великий дом к трону. У него уже есть кандидаты; моя мать кивает. И для моей сестры Алисанны, наследницы какого-то далекого лорда.\n\nОни говорят о союзах и армиях. Они не говорят о том, что мы с Алисанной знали с детства: мы любим друг друга и не собираемся выходить замуж ни за кого другого. Я кровь дракона, а дракон не подчиняется планам Лорда-Защитника.\n\n#bold Если нам не дадут отпуска, мы не будем его просить. #!"
 jaehaerys.0008.option1:0 "Мы не будем разлучены."
 jaehaerys.0009:0 "Полёт драконов"
 jaehaerys.0009.desc:0 "Мы никому не говорим. В предрассветной темноте мы с Алисанной прокрадываемся из Красного замка в драконью яму, где ждут Вермитор и Среброкрылая. Бронзовая Ярость расправляет крылья, драконица моей сестры отвечает криком, и мы улетаем в ночное небо прежде, чем регенты успевают пошевелиться.\n\nПод нами Королевская Гавань сжимается до россыпи факелов, затем черной воды залива, а потом только ветер, крылья и смех Алисанны рядом со мной. Мы летим на восток, к древнему месту нашего дома, где ни Десница, ни Септон не смогут нас разлучить.\n\n#bold Драконьему Камню — и друг другу. #!"
 jaehaerys.0009.option1:0 "На Драконий Камень, к свободе."
 jaehaerys.0010:0 "Свадьба на Драконьем Камне"
 jaehaerys.0010.desc:0 "В древней септе Драконьего Камня, под нарисованными богами и дымом сотен свечей, нас женит септон Освик. Нет ни двора, ни лордов, ни пира — только рука сестры в моей, несколько верных свидетелей и сами клятвы.\n\nТеперь мы муж и жена, Алисанна и я, настоящий король и королева. Верховный септон и Самый Благочестивый могут скрежетать зубами; Лорд Рогар может бушевать, пока Штормовой Предел не содрогнется. Брак, заключённый перед Семи и заключённый, не может быть расторгнут.\n\n#bold Я беру тебя, Алисанну, и никого другого, на все дни моей жизни. #!"
 jaehaerys.0010.option1:0 "Пусть никто не разлучит нас."
 jaehaerys.0011:0 "Гнев регентства"
 jaehaerys.0011.desc:0 "Весть достигает Королевской Гавани за несколько дней, и начинается буря. Лорд Рогар вне себя: обманутый в своих планах, одураченный перед всем королевством, кричащий, что брак должен быть аннулирован, а мальчик-король должен быть поставлен под контроль. Моя мать плачет, разрываясь между сыном и новым мужем.\n\nНо как бы они ни злились, дело сделано. Я женат и скоро стану взрослым мужчиной, свободным от регентского поводка. Но я не слеп: Вера не позволит брату спокойно спать со своей сестрой. Когда я по-настоящему войду в свою корону, Семь потребуют расплаты — и я должен быть готов на нее ответить.\n\n#bold Дело сделано. Теперь позвольте Вере сказать свое слово. #!"
 jaehaerys.0011.option1:0 "Я готов ко всему, что придёт."
 jaehaerys.0012:0 "Великий совет"
 jaehaerys.0012.desc:0 "Не желая жениться, лорд Рогар разыгрывает свою последнюю и самую смелую карту. Перед малым советом он заявляет, что король, который бросает вызов своему Защитнику и спит с собственной сестрой, вообще не является подходящим королем — и что трон должен перейти к моей племяннице Эйрее, дочери Эйгона Некоронованного, чья линия старше моей. Шестилетняя девочка, которой Рогар будет править, пока она не вырастет и не выйдет замуж за кандидата по его выбору.\n\nНа мгновение в зале воцарилась тишина. Тогда восстает моя мать, королева-регентша, и говорит за меня против собственного мужа. Совет один за другим следует за ней: замысел лорда Рогара отвергается, и его стремление создать королеву-марионетку умирает на столе совета.\n\n#bold Он перегнул палку, и королевство это увидело. #!"
 jaehaerys.0012.option1:0 "Пусть совет ответит ему."
 jaehaerys.0012.option2:0 "Вермитор ответит ему."
 jaehaerys.0013:0 "Шестнадцатый день рождения"
 jaehaerys.0013.desc:0 "В двадцатый день девятой луны, на пятидесятом году со дня завоевания моего деда, мне исполнилось шесть и десять лет на продуваемой всеми ветрами скале Драконьего Камня. Теперь я взрослый человек в глазах как богов, так и людей, и регентство заканчивается, как и должно быть со всеми регентствами. Никакой Защитник не правит от моего имени; никаких замыслов Руки разрушить мой брак. Алисанна стоит рядом со мной, истинная моя королева.\n\nПрежде чем я всерьез претендую на свой трон, я отправляю пять рыцарей моей Королевской гвардии вперед в Королевскую Гавань, чтобы проследить, чтобы все было готово к возвращению короля. Красный замок должен быть очищен, а его ворота распахнуты. Дракон возвращается домой.\n\n#bold Готовый город. Через три дня я улетаю в столицу. #!"
 jaehaerys.0013.option1:0 "Пусть они подготовят город."
 jaehaerys.0014:0 "Король возвращается в Красный замок"
 jaehaerys.0014.desc:0 "Через три дня после моего именина я взбираюсь на Вермитора и взлетаю с Драконьего Камня, и «Бронзовая Ярость» переносит меня через залив в Королевскую Гавань. Народ толпится на улицах, чтобы аплодировать, когда мой дракон облетает холм Эйгона и поселяется во дворе Красного замка.\n\nМоя мама ждет меня. Между нами была холодность — ее брак с Рогаром, его планы, кризис вокруг моей свадьбы — но она по-прежнему моя мать, а я ее сын, и мы оба слишком много горевали и потеряли, чтобы оставаться разлученными. Мы говорим долго и конфиденциально, и когда мы заканчиваем, разрыв между нами затягивается. Что бы ни произошло между мной и ее мужем, вдовствующая королева Алисса Веларион и ее король помирились.\n\n#bold Она моя мать. Между нами будет мир. #!"
 jaehaerys.0014.option1:0 "Обнять её."
 jaehaerys.0015:0 "Обновлённый Малый совет"
 jaehaerys.0015.desc:0 "Королю должны служить способные люди, и мой дядя и регентство оставили мне совет праздных, робких и просто удачливых. Итак, я приступил к работе. Некоторые я категорически отвергаю; некоторых я утверждаю в своих кабинетах, доказав свою ценность; и на пустые места я поднимаю людей по своему выбору.\n\nТруднее всего заменить моего мастера над монетой, лорда Эдвелла Селтигара — человека столь же жадного, сколь и бесполезного, который разбирается в подсчете собственных медяков гораздо лучше, чем в сокровищнице королевства. Какое-то время я отчаялся найти себе равного в противоположности некомпетентности. В конце концов я смотрю за пределы Вестероса и назначаю проницательного пентоши по имени Рего Драз, который сохранит золото Короны. Я наполняю меньшие помещения своими людьми и открываю черные камеры и темницы Королевской Гавани, чтобы пленники моего дяди могли снова увидеть солнце.\n\n#bold Новый совет для нового правления. #!"
 jaehaerys.0015.option1:0 "Долой старых, приветствуйте способных."
 jaehaerys.0016:0 "Лорд-протектор держит ответ"
 jaehaerys.0016.desc:0 "Остается одно: Лорд Рогар Баратеон. Я вызываю его в тронный зал и провожу на Железный трон, мой совет собрался вокруг меня, чтобы все могли видеть, что теперь его судит король, а не мальчик. Рогар приходит, ожидая резких слов, а может быть, и худших — и он не прав, потому что он потянулся к моей короне и поставил бы на мое место ребенка.\n\nИ все же я не забыл другую истину: когда тень Мейгора легла на всех нас, именно сильный меч Рогара защитил меня и меня и посадил меня на этот трон. Поэтому я умеряю справедливость памятью. Я прощу его под клятвой, что он никогда больше не скажет ни слова против меня или моей королевы и что он будет честным мужем моей матери. А его брата Оррина, который по слову Рогара пытался украсть послушницу Рейллу из ее материнского дома, чтобы настроить против меня соперника, я приговариваю к десяти годам изгнания за Узкое море.\n\nКогда смиренный Рогар спрашивает, потребует ли Корона заложников Дома Баратеонов, я ничего не отвечаю. Я только встаю и веду его туда, где ждет Вермитор, и позволяю Бронзовой Ярости ответить за меня.\n\n#bold Преклоните колени, милорд, и пусть это будет конец. #!"
 jaehaerys.0016.pardon_tt:0 "Лорд Рогар Баратеон помилован по его клятве и отправлен домой в Штормовой Предел. Его брат Оррин изгнан на десять лет."
 jaehaerys.0016.dragon_tt:0 "Королю не нужны заложники из дома Баратеонов — пока жив Вермитор. Лорд Рогар прекрасно понимает этот намёк."
 jaehaerys.0016.option1:0 "Я не забыл, что ты сделал для нас. Будь в мире."
 jaehaerys.0016.option2:0 "Заложники? Пойдём, мой лорд — позволь мне показать тебе Вермитора."
 jaehaerys.0016.option3:0 "#bold (Альтернативная история)#! Я НЕ стану преклонять колено перед этим мальчишкой и его сестрой-женой."
 jaehaerys.0016.warpath_tt:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ: Откажись от приговора короля-дракона. Ты принимаешь дело лорда Рогара Баратеона, коронуешь девочку Эйрею Таргариен и идёшь войной за Железный Трон. #bold Ты будешь играть за лорда Рогара.#!"
 jaehaerys.0017:0 "Перед Верховным Септоном"
 jaehaerys.0017.desc:0 "Звёздная септа Староместа — старейшая и святейшая обитель Веры во всем Вестеросе, и под ее огромным куполом из черного мрамора и хрусталя тысячецветный свет падает на собравшихся Праведных. Здесь, где древние короли Андалов были благословлены, я преклоняю колени перед Верховным септоном Семи.\n\nОн помазывает меня семью святыми маслами — на моем челе для справедливости Отца, моих глазах для мудрости Старицы, моих руках для силы Воина, и так через всех Семи, которые являются Одним. Я склоняю голову и клянусь перед богами и людьми защищать Веру и справедливо править миром людей. Руки старого септона дрожат, когда он поднимает их надо мной в благословении.\n\n#bold В глазах Семи помазание совершается. #!"
 jaehaerys.0017.option1:0 "Я клянусь, перед Семерыми, которые Едины."
 jaehaerys.0018:0 "Первый своего имени"
 jaehaerys.0018.desc:0 "Верховный септон поднимает корону и возлагает ее мне на лоб. Это сделано. Я поднимаюсь уже не мальчиком-королем, удерживающим трон с милости регентов, а помазанником, коронованным и благословленным перед глазами Семи и всех великих лордов королевства.\n\nГолос септона раздается под куполом, и глашатай подхватывает крик, и он эхом раздается в кристалле наверху:\n\n#bold «Слава Джейхерису из дома Таргариенов, первому своего имени, королю андалов, ройнаров и первых людей, повелителю семи королевств и защитнику королевства!» #!\n\nЗал гремит мне в ответ. Дракон и Семеро примирились, и мое правление начинается не в огне, а в благословении. Они назовут меня Примирителем."
 jaehaerys.0018.option1:0 "Да буду я царствовать долго."
 jaehaerys.0019:0 "Послушница для Веры"
 jaehaerys.0019.desc:0 "Теперь, когда войны завершились, Вера заслуживает доброго отношения, и я намерен его проявить. Моя племянница Рейлла — дочь покойного брата Эйгона и сестры Рейны, близнец маленькой Эйреи — серьёзный и набожный ребёнок. Молитва радует её больше любых танцев и пиров.\n\nЕё отдают Вере и отправляют в обитель в Староместе, чтобы она росла среди септ, надела белые одежды послушницы и однажды принесла обеты. Принцесса дома Таргариенов служит Семерым: лучшего знака мира между драконом и Верой не найти. Она едет охотно, и Праведные весьма довольны.\n\n#bold Пусть Матерь хранит её, а Старица освещает путь. #!"
 jaehaerys.0019.option1:0 "Пусть септы воспитывают её с добротой."
 jaehaerys.0020:0 "Буря отказывается преклоняться"
 jaehaerys.0020.desc:0 "Вот как дракон вознаграждает меч, который его спас. Меня лишили звания протектора, отослали домой, словно нашкодившего мальчишку, и заставили преклонить колено перед юнцом, который делит ложе с собственной сестрой наперекор богам и людям. Я повёл войско, чтобы посадить этого неблагодарного щенка на Железный трон, — и вот моя награда.\n\nНо меч ещё не убран в ножны. Сама Вера называет их брак мерзостью, а есть и другой претендент с бо́льшими правами: Эйрея, дочь Эйгона Некоронованного, наследница старшей ветви. Девочка, да, — но девочку можно наставлять, а от её имени — мудро править королевством. И я выступлю не один: благочестивый Простор, где стоят Старомест и Звёздная септа, где пребывает сам Верховный септон, не питает любви к королю, женившемуся на сестре. Лорд Хайгардена созовёт знамёна ради Эйреи. Штормовому Пределу и Простору незачем склоняться перед Джейхейрисом и Алисанной.\n\nИ всё же мальчик летает на Вермиторе, а его сестра — на Среброкрылой. Мой брат Оррин изгнан, за моим замком следят, а моя жена — родная мать короля. Мудрый человек знает, какие бури лучше переждать.\n\n#bold В груди моей собирается буря. Выпустить её на волю — или унять? #!"
 jaehaerys.0020.option1:0 "За королеву Эйрею! На войну!"
 jaehaerys.0020.option2:0 "Нет. Я проглочу гордость и сохраню королевский мир."
 jaehaerys.0021:0 "Девочка на Железном Троне"
 jaehaerys.0021.desc:0 "Это сделано. Король-дракон пал, его сестра-королева развеялась по ветру, а в большом зале Красного замка раздается новый крик: Эйрея, первая от ее имени, королева семи королевств. Она всего лишь ребенок, маленький и торжественный, сидящий на этом чудовищном кресле из расплавленных мечей, но корона у нее на лбу, и это мой меч положил ее туда.\n\nТеперь мне предстоит формировать это царство через нее. Или — эта мысль приходит непрошено при взгляде на этот огромный черный трон — сильная рука может сделать больше, чем просто направить королеву. Но нет. Она моя королева, и я создал ее. На данный момент.\n\n#bold Железный Трон наконец подчиняется Дому Баратеонов. #!"
 jaehaerys.0021.option1:0 "Править через неё. Я — сила за троном."
 jaehaerys.0021.option2:0 "#bold (Продолжить игру за Эйрею)#! Взять на себя роль юной королевы."
 jaehaerys.0022:0 "Цена мятежа"
 jaehaerys.0022.desc:0 "Лорда Рогара в цепях отвели к подножию Железного трона, и там, на глазах у всего двора, королю Джейхейрису снесли голову с плеч. Восстание подавлено. Причина Эйреи — пепел, ее знамена сожжены, а буря, поднятая Рогаром, обрушилась на стены дракона.\n\nТеперь власть над Штормовым Пределом перешла ко мне, а вместе с этим и крушение его амбиций. Дому Баратеонов осталось только наше место, наша гордость и долгая память о том, как близко мы подошли. Дракон правит, а мы терпим — как и всегда. Мечта о троне, сделанном Баратеоном, умирает на плахе.\n\n#bold Буря утихла. Но Дом Баратеонов выстоит. #!"
 jaehaerys.0022.option1:0 "Мы выстоим. Будут и другие дни."
 jaehaerys.0023:0 "Свадьба на Светлом Острове"
 jaehaerys.0023.desc:0 "Слухи приходят с далекого запада, с Фэр-Айла в Закатном море. Моя старшая сестра Рейна знала мало радости в своей жизни: сначала она вышла замуж за нашего брата Эйгона, которого Мейгор убил, а затем загнал в постель нашего чудовищного дяди как одну из его Черных невест. Трижды королева и трижды опечаленная. Неудивительно, что она сбежала от двора и его драконов.\n\nТеперь она взяла нового мужа, на этот раз на своих условиях: Эндроу Фармана, второго сына лорда Прекрасного острова — нежного, мягкого юношу, не воина и не интригана. Все говорят, что это не лучший брак по любви, и Рейна выходит за него замуж больше из-за тишины Прекрасного острова, чем из-за самого этого человека. Но это ее выбор, сделанный добровольно, и после всего того, что она пережила, она столько заработала.\n\n#bold Пусть моя сестра наконец обретет хоть немного покоя. #!"
 jaehaerys.0023.option1:0 "Я желаю ей добра и с радостью."
 jaehaerys.0024:0 "Десница для короля"
 jaehaerys.0024.desc:0 "Протекторство закончилось, и кабинет Десницы пустует. Рогар Баратеон научил меня опасности Десницы, которая также является самым могущественным лордом в королевстве, со своими армиями и амбициями. На этот раз у меня будет Десница, которая будет служить Короне, а не себе, — стойкий человек, разбирающийся в деньгах, законах и делах королевства, которому я могу доверять, как немногим другим.\n\nЯ нахожу его недалеко от дома. Лорд Деймон Веларион из Дрифтмарка, повелитель приливов и родственник моей матери, умело служил мне хозяином кораблей. Он не военачальник и не интриган, а всего лишь способный и преданный человек — и это именно то, что мне нужно. Я называю его Десницей Короля, и так начинается партнерство, которое я намерен продлить до конца моего правления.\n\n#bold Восстань, Лорд Демон, Десница Короля. #!"
 jaehaerys.0024.hand_tt:0 "Лорд Деймон Веларион, Владыка Приливов, оставляет должность мастера над кораблями и становится десницей короля."
 jaehaerys.0024.option1:0 "Это пойдёт королевству на пользу. Встаньте, мой лорд-десница."
 jaehaerys.0025.t:0 "Реформы Рего Драза"
 jaehaerys.0025.desc:0 "Мой новый мастер над монетой сразу доказывает свою ценность. Лорд Рего — ибо я возвысил пентоши до уровня светлости, так что Железному Трону не нужно стыдиться, что он служит ему — останавливает кровотечение из долгов Короны, достаточное для того, чтобы великие работы на холме Рейнис могли возобновиться. Но недостаточно просто увидеть завершение Драконьего Логова, поэтому вместе мы придумываем более хитрый способ пополнить казну.\n\nМы облагаем налогом предметы роскоши и экзотические товары — мирийские кружева и волантенский шелк, квартинские специи и лисенские духи. Это не затронет простых людей, и ни один честный лорд не почувствует этого; только те, кто будет выставлять напоказ свое богатство и великолепие перед миром. И они будут выставлять это напоказ, уверяет меня Рего, смеясь, — тщеславный человек заплатит любую цену, чтобы ему завидовали. Он прав. Меди становятся драконами, а драконы — рекой золота.\n\nК этому я добавляю второй налог, преследующий цель, выходящую за рамки простой монеты: отныне любой лорд, который пожелает построить новый замок, отремонтировать или расширить старый, должен будет платить высокую пошлину, рассчитываемую по подсчету его зубцов. Великие лорды дважды подумают, прежде чем поднимать свои стены выше, и щедро заплатят Короне, если они это сделают.\n\n#bold Сокровищница разрастается, и Драконье Логово в конце концов будет закончена. #!"
 jaehaerys.0025.a:0 "Хитрый замысел, мой лорд. Пусть это будет провозглашено."
 jaehaerys.0026.t:0 "Вторая свадьба"
 jaehaerys.0026.desc:0 "Через полгода после того, как я наконец прибыл в Королевскую Гавань, Алисанна покидает Драконий Камень, чтобы присоединиться ко мне, а через месяц мы поженимся во второй раз — не тайно, как раньше, а открыто, перед Железным Троном и взором всего королевства. Теперь не может быть никаких слухов о том, что король и королева не женаты по-настоящему.\n\nОбряды проводит септон, только что пришедший ко мне на службу: Барт, сын кузнеца скромного происхождения и безграничного ума, самый образованный человек, которого я когда-либо встречал. Я хорошо его отмечаю; Я думаю, он поднимется далеко. Сама церемония весьма скромна: сокровищница пуста, и на ней присутствует едва ли тысяча гостей, жалкое зрелище по сравнению с великолепием Рогара и Золотой свадьбы моей матери. Но я бы не променял это на тысячу золотых свадеб.\n\nАлисанна — моя сестра, моя королева и мой самый верный друг на свете; никто из живущих не знает моего сердца так, как она, и я — ее. В ту ночь, как муж и жена наконец перед богами и людьми, мы лежим вместе.\n\n#bold Какие бы бури ни пришли, мы встретим их как один. #!"
 jaehaerys.0026.a:0 "Моя королева. Моя сестра. Моя родственная душа."
 jaehaerys.0027:0 "Септон в Десницы"
 jaehaerys.0027.desc:0 "Лорд Деймон Веларион долго и верно служил короне, но Повелитель приливов стареет, и приливы зовут его домой. Королевство ожидает, что я найду великого лорда, который возьмет на себя цепь — Талли, Тирелла, Аррена, какого-нибудь гордого имени с гордыми знаменами.\n\nЦарство будет разочаровано. При этом дворе есть один человек, который прочитал все книги в библиотеке Красного замка и написал еще лучшие; который спорил о Доктрине с септонами и о гавани с Рего Дразом и победил обоих; который не боится ни богов, ни лордов и не говорит своему королю, что его король не прав. Он сын кузнеца. Он носит одежду септона. И у него лучший ум, который я когда-либо встречал.\n\nВеликие лорды могут скрежетать зубами. Мудрость не носит цвета дома.\n\n#bold Септон Барт будет моей рукой. Царство посмеется — и потом сорок лет будет дивиться. #!"
 jaehaerys.0027.desc.daemon_dead:0 "Рукоделие пустует, и королевство ожидает, что я найду великого лорда, чтобы заполнить его — Талли, Тирелла, Аррена, какого-нибудь гордого имени с гордыми знаменами.\n\nЦарство будет разочаровано. При этом дворе есть один человек, который прочитал все книги в библиотеке Красного замка и написал еще лучшие; который спорил о Доктрине с септонами и о гавани с Рего Дразом и превзошел обоих; который не боится ни богов, ни лордов и не говорит своему королю, что его король неправ. Он сын кузнеца. Он носит одежду септона. И у него лучший ум, который я когда-либо встречал.\n\nВеликие лорды могут скрежетать зубами. Мудрость не носит цвета дома.\n\n#bold Септон Барт будет моей рукой. Царство посмеется — и потом сорок лет будет дивиться. #!"
 jaehaerys.0027.option1:0 "Цепь достаётся самому блестящему уму королевства."
 jaehaerys.0027.hand_tt:0 "Лорд Деймон Веларион уходит с честью, и #bold септон Барт#! — сын кузнеца, хранитель библиотеки Красного Замка — становится Десницей Короля."
 jaehaerys.0028:0 "Дитя дракона"
 jaehaerys.0028.desc:0 "Бейлон начал преследовать каждую тень, имеющую форму крыльев. Он еще маленький, но у него кровь дракона, и слишком поздно наученный страх может перерасти во что-то худшее.\n\nДраконье Логово готова. Балерион спит в темноте. Я должен показать сыну, что сохранил наш дом и к чему нельзя относиться легкомысленно.\n\n#bold Принц крови должен соответствовать тому, что делает его Дом великим. #!"
 jaehaerys.0028.a:0 "Привести его в Драконье Логово."
 jaehaerys.0029:0 "Бейлон Храбрый"
 jaehaerys.0029.desc:0 "Я хотел только позволить Бейлону посмотреть.\n\nБалерион лежит перед нами, как холм из черного железа, дым просачивается между зубами длиной больше, чем рука моего сына. Прежде чем я успеваю его поймать, Бейлон со смехом бросается вперед и бьет Черного Ужаса по морде.\n\nНа одно мгновение мир замер. Затем Балерион открывает расплавленный глаз, и Бейлон смеется еще громче.\n\nБелый плащ выдыхает воздух, который остальные из нас забыли сделать. «Этот мальчик храбрый, — говорит он, — или сумасшедший».\n\n#bold К ночи весь Красный Замок выбрал более доброе слово. #!"
 jaehaerys.0029.a:0 "Семеро, спасите нас от бесстрашных сыновей."
 sotd_soulmate_reason:0 "[Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'Вы принадлежите', 'Они принадлежат')] друг другу с тех пор, как [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'вы были', 'они были')] двумя сереброволосыми детьми, делившимися секретами в тёмных покоях замка [GetTitleByKey('b_the_red_keep').GetNameNoTier]. Один брак заключён после тайного полуночного полёта во владение [GetTitleByKey('c_dragonstone').GetNameNoTier], другой — на глазах всего королевства. [CHARACTER.GetShortUIName] и [TARGET_CHARACTER.GetShortUIName] — гораздо больше, чем муж и жена: [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'вы —', 'они —')] самые близкие друзья и две половины одного бьющегося сердца. О чём мечтает один, о том мечтает и другой; ни боги, ни Семеро, ни весь огромный мир не разлучат их."
