l_russian:
 jaehaerys.0001:0 "Дракон возвращается"
 jaehaerys.0001.desc:0 "Я укрываюсь вдали от двора, когда приходит весть: Мейгор мёртв. Дядю нашли обмякшим на Железном троне, бледным и холодным. Под ним скопилась кровь, шипы жестокого сиденья глубоко вошли в плоть. Убил ли его сам трон или незримая рука — никто не знает. Скорбеть будут немногие.\n\nЯ не стану ждать дозволения. Сажусь на Вермитора, Бронзовый Гнев, и направляю его к Королевской Гавани. Лорды и простой люд поднимут головы и увидят вернувшегося дракона. Он прилетит не жечь их, как Мейгор, а наконец положить конец ужасу.\n\nЯ — Джейхейрис из дома Таргариенов. Я намерен принять отцовский трон и оставленные дядей руины и создать из них нечто достойное. Мать направит мою руку, а лорд Рогар поддержит меня мечом. Исцеление истерзанного королевства начинается сейчас."
 jaehaerys.0001.option1:0 "Железный трон принадлежит мне."
 jaehaerys.0002:0 "Регентство"
 jaehaerys.0002.desc:0 "Война за трон выиграна, толком не начавшись. Большинство сторонников дяди бежали из города. Немногих оставшихся я заковал в цепи.\n\nНо мне четырнадцать лет, а мальчик не может один править Семью Королевствами. Решено: до моего совершеннолетия править будет мать, вдовствующая королева Алисса Веларион, в качестве королевы-регента. Лорда Рогара Баратеона из Штормового Предела, выступившего с мечом, чтобы возвести меня на престол, я назначаю лордом-протектором и десницей короля. Он поможет мне в грядущие годы.\n\n#bold Вместе мы начнём залечивать раны, оставленные дядей.#!"
 jaehaerys.0002.option1:0 "Пусть исцеление начнётся."
 jaehaerys.0003:0 "Правосудие короля"
 jaehaerys.0003.desc:0 "Королевство полно слуг Жестокого: лордов, преклонивших колени перед дядей; тюремщиков и палачей, замучивших моего брата Визериса в чёрных камерах; королевских гвардейцев Мейгора — белых плащей, присягнувших чудовищу.\n\nОдни падают на колени и просят позволения надеть чёрное. Сир Харролд Лангуорд, бывший лорд-командующий Мейгора, не склоняется ни перед кем: отвергает моё право судить его и требует суда поединком. Мать и лорд Рогар советуют сдержанность, но выбор за мной. С чего начнётся правление Джейхейриса?"
 jaehaerys.0003.option1:0 "Правосудие, смягчённое милосердием."
 jaehaerys.0003.trial_tt:0 "Сира Маладона Мура казнят за участие в убийстве королевы Тианны. Сир Харролд Лангуорд требует суда поединком. Я хочу сам взяться за меч, но королева-регент запрещает. Наш защитник, сир Джайлс Морриген, убивает его. Сир Джон Толлетт, сир Саймонд Крайни, сир Оливер Бракен и сир Раймунд Маллери отправляются в Ночной Дозор."
 jaehaerys.0003.option2:0 "Пусть все умрут."
 jaehaerys.0003.option3:0 "Помиловать всех. Королевство пролило достаточно крови."
 jaehaerys.0003.exile_tt:0 "Шестерых гвардейцев Мейгора пощадят и не отправят на Стену. Но милость не вернёт им прежнего положения: белые плащи отберут, а самих изгонят за Узкое море. Пусть доживают век межевыми рыцарями при дворе Морского владыки в Браавосе. Больше они не будут охранять короля Вестероса."
 jaehaerys.0004:0 "Королевский мир с Верой"
 jaehaerys.0004.desc:0 "С юга пришла весть: септон Луна мёртв. Осаждавшие Старомест Честные Бедняки растаяли, словно снег. Долгая война дракона с Семерыми наконец может закончиться — если я позволю.\n\nИ я позволю. Клянусь, что Железный трон отныне и навеки будет защищать Веру в Семерых. Но возрождать ордены Сынов Воина и Честных Бедняков я не стану: Святое Воинство должно навсегда сложить мечи. Я отменяю назначенные дядей награды за головы верующих и прощаю всех раскаявшихся. Взамен Праведные признают королевское правосудие, а сам верховный септон соглашается короновать меня в Звёздной септе. Путь в Старомест открыт.\n\n#bold Пусть люди говорят: этот король примиряет, а не сжигает.#!"
 jaehaerys.0004.option1:0 "Тогда отправимся в Старомест за короной."
 jaehaerys.0005:0 "Белый плащ для Сына Воина"
 jaehaerys.0005.desc:0 "Осталась ещё одна клятва. Передо мной преклоняет колени сир Джоффри Доггетт — некогда великий капитан Сынов Воина, Рыжий Пёс Холмов, выступивший с мечом и звездой против моего дома во имя Семерых. Лучшего бойца Святое Воинство не знало. Я предпочту видеть такого человека у себя за спиной, а не травить его по холмам, словно зверя.\n\nЯ предлагаю ему белый плащ и место в Королевской гвардии. Он склоняет голову, снимает звезду Сынов Воина и принимает плащ, клянясь ценой собственной жизни защищать короля и его семью.\n\n#bold Бывший враг Короны становится одним из её вернейших защитников.#!"
 jaehaerys.0005.option1:0 "Встаньте, сир, рыцарь Королевской гвардии."
 jaehaerys.0006:0 "Золотая свадьба"
 jaehaerys.0006.desc:0 "В сорок девятом году после Завоевания моя мать, вдовствующая королева, выходит за лорда Рогара Баратеона. Свадьба так роскошна, что народ уже прозвал её Золотой. Штормовой Предел опустошает казну; пиры продлятся две недели.\n\nРогар мне по душе, и я уважаю его силу. Но прежде чем жениться на моей матери, он даже не подумал спросить моего позволения. А я — король. Он говорит, что женится по любви. Я не уверен. Мало ему быть моей десницей и лордом-протектором: теперь он ещё и супруг королевы. Сколько в его сердце места для матери, а сколько — для короны, до которой будто бы рукой подать?\n\n#bold Я молчу. Мальчик-король учится держать язык за зубами — и помнить.#!"
 jaehaerys.0006.option1:0 "Он мог бы хотя бы спросить моего позволения."
 jaehaerys.0007:0 "Война за белые плащи"
 jaehaerys.0007.desc:0 "С тех пор как я изгнал дядиных гвардейцев, пять белых плащей ждут новых владельцев. Мать предлагает устроить после её свадьбы большой турнир: пусть лучшие рыцари завоюют право носить их. Я согласен, но велю сражаться пешими. На короля редко нападают из седла.\n\nБои идут семь дней. Конные сшибки вскоре забыты среди яростных общих схваток и кровавых поединков. Сотни рыцарей с топорами, копьями и мечами борются за честь белого плаща. Люди до хрипоты кричат за любимцев: сира Виллама Стаффорда, сира Тома Бренчальщика, таинственного рыцаря, оказавшегося женщиной — Джонквиль Дарк. Но когда пыль оседает, над остальными возвышаются пятеро.\n\nСир Лоренс Рокстон, сир Виктор Доблестный, сир Виллам Оса, сир Пейт Вальдшнеп и старый одноглазый сир Сэмгуд с Кислого Холма преклоняют передо мной колени. Я велю им встать — уже братьями Королевской гвардии.\n\n#bold Моих белых плащей снова семь.#!"
 jaehaerys.0007.option1:0 "Встаньте, братья Королевской гвардии."
 jaehaerys.0008:0 "Партия для короля"
 jaehaerys.0008.desc:0 "Золотая свадьба позади, и теперь честолюбие лорда Рогара обращается ко мне. Королю нужна королева, говорит он. Моя рука — величайшая награда в королевстве: невеста из Утёса Кастерли или Хайгардена свяжет великий дом с троном. Кандидатки у него уже есть; мать согласно кивает. Алисанне же прочат в мужья наследника какого-нибудь далёкого лорда.\n\nОни говорят о союзах и войсках. Не говорят о том, что мы с Алисанной знаем с детства: мы любим друг друга и не свяжем жизнь ни с кем иным. Во мне кровь дракона. Дракон не склоняется перед замыслами лорда-протектора.\n\n#bold Если нам не дадут дозволения, мы не станем его просить.#!"
 jaehaerys.0008.option1:0 "Нас не разлучить."
 jaehaerys.0009:0 "Полёт драконов"
 jaehaerys.0009.desc:0 "Мы никому не говорим. В предрассветной тьме мы с Алисанной тайком выходим из Красного замка к драконьему логову, где ждут Вермитор и Среброкрылая. Бронзовый Гнев расправляет крылья; драконица сестры отвечает криком. Мы исчезаем в ночном небе прежде, чем регенты успевают пошевелиться.\n\nПод нами Королевская Гавань уменьшается до россыпи факелов, затем остаётся чёрная вода залива, а потом — лишь ветер, крылья и смех Алисанны рядом. Мы летим на восток, к древнему замку нашего дома, где ни десница, ни септон нас не разлучат.\n\n#bold К Драконьему Камню — и друг к другу.#!"
 jaehaerys.0009.option1:0 "На Драконий Камень, к свободе."
 jaehaerys.0010:0 "Свадьба на Драконьем Камне"
 jaehaerys.0010.desc:0 "В древней септе Драконьего Камня, под расписными ликами богов и дымом сотни свечей, септон Освик венчает нас. Ни двора, ни лордов, ни пира. Лишь рука сестры в моей руке, несколько верных свидетелей и наши клятвы.\n\nТеперь мы с Алисанной муж и жена, истинные король и королева. Пусть верховный септон и Праведные скрежещут зубами; пусть Рогар бушует так, что содрогнётся Штормовой Предел. Брак, освящённый перед Семерыми и скреплённый на ложе, уже не расторгнуть.\n\n#bold Я беру в жёны тебя, Алисанна, и никого другого — до конца моих дней.#!"
 jaehaerys.0010.option1:0 "Пусть никто не разлучит нас."
 jaehaerys.0011:0 "Гнев регентов"
 jaehaerys.0011.desc:0 "Через несколько дней весть достигает Королевской Гавани, и разражается буря. Лорд Рогар вне себя: его замыслы разрушены, сам он осмеян перед всем королевством. Он требует расторгнуть брак и поставить мальчишку-короля на место. Мать плачет, разрываясь между сыном и новым мужем.\n\nНо сколько бы они ни яроствовали, дело сделано. Я женат. Скоро я стану совершеннолетним и избавлюсь от регентского поводка. И всё же я не слеп: Вера не смирится с тем, что брат делит ложе с сестрой. Когда я обрету королевскую власть во всей полноте, Семеро потребуют ответа. Я должен быть готов.\n\n#bold Дело сделано. Пусть теперь Вера скажет своё слово.#!"
 jaehaerys.0011.option1:0 "Я готов ко всему."
 jaehaerys.0012:0 "Великий совет"
 jaehaerys.0012.desc:0 "Потерпев неудачу с моим браком, лорд Рогар разыгрывает последнюю и самую дерзкую карту. Перед малым советом он объявляет: король, ослушавшийся протектора и разделивший ложе с сестрой, недостоин престола. Корону следует передать моей племяннице Эйрее, дочери Эйгона Некоронованного, представительнице старшей ветви. Шестилетней девочке, от чьего имени Рогар будет править, пока она не вырастет и не выйдет за выбранного им мужа.\n\nНа мгновение в зале воцаряется тишина. Затем мать, королева-регент, встаёт и выступает за меня — против собственного мужа. Один за другим советники поддерживают её. Предложение Рогара отвергнуто. Его замысел посадить на трон королеву-марионетку погибает за столом совета.\n\n#bold Он зашёл слишком далеко, и королевство это увидело.#!"
 jaehaerys.0012.option1:0 "Пусть совет ответит ему."
 jaehaerys.0012.option2:0 "Вермитор ответит ему."
 jaehaerys.0013:0 "Шестнадцатый день рождения"
 jaehaerys.0013.desc:0 "В двадцатый день девятой луны, на пятидесятом году после дедова Завоевания, мне исполняется шестнадцать лет. Я встречаю этот день на продуваемой ветрами скале Драконьего Камня. Перед богами и людьми я взрослый мужчина. Регентству приходит конец, как и должно. Больше ни один протектор не правит от моего имени, ни один десница не замышляет расторгнуть мой брак. Рядом стоит Алисанна — моя истинная королева.\n\nПрежде чем принять власть, я отправляю в Королевскую Гавань пятерых гвардейцев: пусть всё подготовят к моему возвращению. Красный замок нужно привести в порядок, ворота — распахнуть. Дракон возвращается домой.\n\n#bold Подготовьте город. Через три дня я лечу в столицу.#!"
 jaehaerys.0013.option1:0 "Пусть они подготовят город."
 jaehaerys.0014:0 "Король возвращается в Красный замок"
 jaehaerys.0014.desc:0 "Через три дня после своего дня рождения я поднимаюсь с Драконьего Камня на Вермиторе. Бронзовый Гнев несёт меня через залив к Королевской Гавани. На улицах толпятся люди, приветствуя короля, пока дракон кружит над холмом Эйгона и садится во дворе Красного замка.\n\nМать ждёт меня. Между нами пролегла холодность: её брак с Рогаром, его замыслы, ссора из-за моей свадьбы. Но она по-прежнему моя мать, а я её сын. Мы оба слишком много скорбели и потеряли, чтобы оставаться чужими. Мы долго говорим наедине, и к концу разговора разрыв между нами исцелён. Что бы ни случилось между мной и её мужем, вдовствующая королева Алисса Веларион и её король примирились.\n\n#bold Она моя мать. Между нами будет мир.#!"
 jaehaerys.0014.option1:0 "Обнять её."
 jaehaerys.0015:0 "Обновлённый малый совет"
 jaehaerys.0015.desc:0 "Королю нужны способные слуги. Дядя и регенты оставили мне совет бездельников, робких людей и тех, кому просто повезло. Я берусь за дело. Одних увольняю сразу, других, доказавших свою ценность, оставляю на постах. На освободившиеся места назначаю собственных избранников.\n\nТруднее всего заменить мастера над монетой, лорда Эдвелла Селтигара — столь же алчного, сколь бесполезного. В своих медяках он разбирается куда лучше, чем в финансах королевства. Некоторое время я уже отчаиваюсь найти человека столь же умелого, сколь Эдвелл бездарен. Наконец обращаю взгляд за пределы Вестероса и доверяю золото Короны проницательному пентосийцу Рего Дразу. Младшие должности тоже занимают мои люди. Я открываю чёрные камеры и темницы столицы, чтобы пленники дяди снова увидели солнце.\n\n#bold Новому правлению — новый совет.#!"
 jaehaerys.0015.option1:0 "Прочь негодных. Дорогу способным."
 jaehaerys.0016:0 "Лорд-протектор держит ответ"
 jaehaerys.0016.desc:0 "Осталось одно дело: лорд Рогар Баратеон. Я вызываю его в тронный зал и принимаю сидя на Железном троне, в окружении совета. Пусть все видят: теперь его судит король, не мальчик. Рогар ждёт суровых слов, а может, и худшего. Боится он не напрасно: он покусился на мою корону и хотел посадить на моё место ребёнка.\n\nНо я помню и другое. Когда тень Мейгора лежала над всеми нами, именно меч Рогара защитил меня и моих близких и возвёл меня на престол. Память смягчает правосудие. Я прощу его, если он поклянётся никогда не выступать против меня и моей королевы и быть достойным мужем моей матери. Его брата Оррина, который по приказу Рогара пытался выкрасть послушницу Рейллу из обители и сделать её моей соперницей, я приговариваю к десяти годам изгнания за Узкое море.\n\nУниженный Рогар спрашивает, потребует ли Корона заложников от дома Баратеонов. Я молчу. Встаю и веду его туда, где ждёт Вермитор. Пусть Бронзовый Гнев ответит за меня.\n\n#bold Преклоните колени, милорд. Покончим с этим.#!"
 jaehaerys.0016.pardon_tt:0 "Принеся клятву, лорд Рогар Баратеон получит прощение и вернётся в Штормовой Предел. Его брата Оррина изгонят на десять лет."
 jaehaerys.0016.dragon_tt:0 "Королю не нужны заложники из дома Баратеонов — пока жив Вермитор. Лорд Рогар прекрасно понимает этот намёк."
 jaehaerys.0016.option1:0 "Я не забыл, что вы сделали для нас. Пусть между нами будет мир."
 jaehaerys.0016.option2:0 "Заложники? Пойдёмте, милорд. Я покажу вам Вермитора."
 jaehaerys.0016.option3:0 "#bold (Альтернативная история)#! Я НЕ стану преклонять колено перед этим мальчишкой и его сестрой-женой."
 jaehaerys.0016.warpath_tt:0 "АЛЬТЕРНАТИВНАЯ ИСТОРИЯ: отвергнуть приговор короля-дракона. Вы выступите на стороне лорда Рогара Баратеона, коронуете юную Эйрею Таргариен и начнёте войну за Железный трон. #bold Вы будете играть за лорда Рогара.#!"
 jaehaerys.0017:0 "Перед верховным септоном"
 jaehaerys.0017.desc:0 "Звёздная септа Староместа — древнейшая и святейшая обитель Веры во всём Вестеросе. Под огромным куполом из чёрного мрамора и хрусталя свет тысячью красок падает на собравшихся Праведных. Здесь, где некогда благословляли андальских королей, я преклоняю колени перед верховным септоном.\n\nОн помазывает меня семью священными маслами: лоб — ради справедливости Отца, глаза — ради мудрости Старицы, руки — ради силы Воина, и так в честь каждого из Семерых, которые едины. Я склоняю голову и клянусь перед богами и людьми защищать Веру и справедливо править людскими королевствами. Старые руки септона дрожат, когда он воздевает их надо мной с благословением.\n\n#bold Перед ликом Семерых помазание свершилось.#!"
 jaehaerys.0017.option1:0 "Клянусь перед Семерыми, которые едины."
 jaehaerys.0018:0 "Первый этого имени"
 jaehaerys.0018.desc:0 "Верховный септон поднимает корону и возлагает мне на голову. Свершилось. Я встаю уже не мальчиком-королём, удерживающим трон по милости регентов, а помазанным государем, коронованным и благословлённым перед Семерыми и всеми великими лордами королевства.\n\nПод куполом звучит голос септона. Глашатай подхватывает его, и хрусталь отвечает эхом:\n\n#bold «Да здравствует Джейхейрис из дома Таргариенов, Первый этого имени, король андалов, ройнаров и Первых людей, владыка Семи Королевств и защитник государства!»#!\n\nЗал громогласно повторяет эти слова. Дракон и Семеро примирились. Моё правление начинается с благословения, а не с огня. Меня назовут Миротворцем."
 jaehaerys.0018.option1:0 "Да буду я царствовать долго."
 jaehaerys.0019:0 "Послушница для Веры"
 jaehaerys.0019.desc:0 "Теперь, когда войны завершились, Вера заслуживает доброго отношения, и я намерен его проявить. Моя племянница Рейлла — дочь покойного брата Эйгона и сестры Рейны, близнец маленькой Эйреи — серьёзный и набожный ребёнок. Молитва радует её больше любых танцев и пиров.\n\nЕё отдают Вере и отправляют в обитель в Староместе, чтобы она росла среди септ, надела белые одежды послушницы и однажды принесла обеты. Принцесса дома Таргариенов служит Семерым: лучшего знака мира между драконом и Верой не найти. Она едет охотно, и Праведные весьма довольны.\n\n#bold Пусть Матерь хранит её, а Старица освещает путь. #!"
 jaehaerys.0019.option1:0 "Пусть септы воспитывают её с добротой."
 jaehaerys.0020:0 "Буря отказывается преклоняться"
 jaehaerys.0020.desc:0 "Вот как дракон вознаграждает меч, который его спас. Меня лишили звания протектора, отослали домой, словно нашкодившего мальчишку, и заставили преклонить колено перед юнцом, который делит ложе с собственной сестрой наперекор богам и людям. Я повёл войско, чтобы посадить этого неблагодарного щенка на Железный трон, — и вот моя награда.\n\nНо меч ещё не убран в ножны. Сама Вера называет их брак мерзостью, а есть и другой претендент с бо́льшими правами: Эйрея, дочь Эйгона Некоронованного, наследница старшей ветви. Девочка, да, — но девочку можно наставлять, а от её имени — мудро править королевством. И я выступлю не один: благочестивый Простор, где стоят Старомест и Звёздная септа, где пребывает сам Верховный септон, не питает любви к королю, женившемуся на сестре. Лорд Хайгардена созовёт знамёна ради Эйреи. Штормовому Пределу и Простору незачем склоняться перед Джейхейрисом и Алисанной.\n\nИ всё же мальчик летает на Вермиторе, а его сестра — на Среброкрылой. Мой брат Оррин изгнан, за моим замком следят, а моя жена — родная мать короля. Мудрый человек знает, какие бури лучше переждать.\n\n#bold В груди моей собирается буря. Выпустить её на волю — или унять? #!"
 jaehaerys.0020.option1:0 "За королеву Эйрею! На войну!"
 jaehaerys.0020.option2:0 "Нет. Я усмирю гордость и сохраню королевский мир."
 jaehaerys.0021:0 "Девочка на Железном Троне"
 jaehaerys.0021.desc:0 "Свершилось. Король-дракон повержен, его сестра-королева обращена в бегство. В большом зале Красного замка звучит новое имя: Эйрея, Первая этого имени, королева Семи Королевств. Она всего лишь ребёнок — маленькая, серьёзная девочка на чудовищном сиденье из сплавленных мечей. Но на её голове корона. Её возложил туда мой меч.\n\nТеперь я могу править королевством через неё. Или... Глядя на огромный чёрный трон, я невольно думаю: сильная рука могла бы не только направлять королеву. Но нет. Она моя королева, и я возвёл её на престол. Пока.\n\n#bold Наконец Железный трон подчиняется дому Баратеонов.#!"
 jaehaerys.0021.option1:0 "Править через неё. Я — сила за троном."
 jaehaerys.0021.option2:0 "#bold (Продолжить игру за Эйрею)#! Взять на себя роль юной королевы."
 jaehaerys.0022:0 "Цена мятежа"
 jaehaerys.0022.desc:0 "Лорда Рогара в цепях привели к подножию Железного трона. Там, перед всем двором, король Джейхейрис велел отсечь ему голову. Мятеж подавлен. Надежды Эйреи обращены в пепел, её знамёна сожжены. Буря, поднятая Рогаром, разбилась о стены дракона.\n\nШтормовой Предел теперь достаётся мне, а вместе с ним — обломки его честолюбия. У дома Баратеонов остались замок, гордость и долгая память о том, как близки мы были к цели. Дракон правит, а мы держимся — как держались всегда. Мечта о троне, обязанном Баратеону, умирает на плахе.\n\n#bold Буря иссякла. Но дом Баратеонов выстоит.#!"
 jaehaerys.0022.option1:0 "Мы выстоим. Будут и другие дни."
 jaehaerys.0023:0 "Свадьба на Светлом острове"
 jaehaerys.0023.desc:0 "С далёкого запада, со Светлого острова в Закатном море, приходят вести. Старшая сестра Рейна знала мало счастья. Сначала была женой нашего брата Эйгона, убитого Мейгором. Потом чудовищный дядя силой взял её в свои Чёрные Невесты. Трижды королева, трижды познавшая горе. Неудивительно, что она бежала от двора и его драконов.\n\nТеперь у неё новый муж, на этот раз выбранный по собственной воле: Эндроу Фарман, второй сын лорда Светлого острова. Добрый, кроткий юноша, не воин и не интриган. Говорят, великой любви здесь нет: Рейна выходит скорее за тишину Светлого острова, чем за самого Эндроу. Но это её свободный выбор. После всего пережитого она заслужила хотя бы это.\n\n#bold Пусть сестра наконец найдёт хоть немного покоя.#!"
 jaehaerys.0023.option1:0 "От всей души желаю ей счастья."
 jaehaerys.0024:0 "Десница для короля"
 jaehaerys.0024.desc:0 "Власть протектора окончилась, и должность десницы свободна. Рогар Баратеон научил меня, как опасно отдавать её могущественнейшему лорду королевства, у которого есть собственные войска и честолюбивые замыслы. На этот раз десница будет служить Короне, а не себе: надёжный человек, сведущий в деньгах, законах и управлении, которому я смогу доверять, как немногим другим.\n\nИскать далеко не пришлось. Лорд Деймон Веларион с Дрифтмарка, Владыка Приливов и родич моей матери, прекрасно служил мастером над кораблями. Он не воинственный полководец и не интриган, а просто способный, верный человек. Именно такой мне и нужен. Я назначаю его десницей и надеюсь, что мы будем работать вместе до конца моего правления.\n\n#bold Встаньте, лорд Деймон, десница короля.#!"
 jaehaerys.0024.hand_tt:0 "Лорд Деймон Веларион, Владыка Приливов, оставляет должность мастера над кораблями и становится десницей короля."
 jaehaerys.0024.option1:0 "Это пойдёт королевству на пользу. Встаньте, мой лорд-десница."
 jaehaerys.0025.t:0 "Реформы Рего Драза"
 jaehaerys.0025.desc:0 "Новый мастер над монетой сразу доказывает, чего стоит. Лорд Рего — я пожаловал пентосийцу титул, чтобы Железному трону не пришлось стыдиться такого слуги, — останавливает отток денег на долги. Средств хватает, чтобы возобновить работы на холме Рейнис. Но на завершение Драконьего Логова их всё ещё недостаточно. Вместе мы придумываем более искусный способ наполнить казну.\n\nМы вводим налог на роскошь и заморские диковины: мирийские кружева, волантийский шёлк, квартийские пряности, лиснийские духи. Простой люд его не почувствует, как и любой скромный лорд. Платить будут те, кто желает щеголять богатством перед всем миром. И щеголять они не перестанут, смеясь уверяет Рего: тщеславный человек заплатит сколько угодно за чужую зависть. Он прав. Медяки превращаются в драконы, а драконы — в золотую реку.\n\nЯ добавляю второй налог, преследующий не только денежную выгоду. Отныне лорд, решивший возвести новый замок, починить или расширить старый, должен уплатить большую пошлину — по числу зубцов на стенах. Великие лорды дважды подумают, прежде чем наращивать укрепления. А если всё же нарастят, щедро заплатят Короне.\n\n#bold Казна полнится. Драконье Логово всё-таки будет достроено.#!"
 jaehaerys.0025.a:0 "Разумный замысел, милорд. Объявите об этом."
 jaehaerys.0026.t:0 "Вторая свадьба"
 jaehaerys.0026.desc:0 "Через полгода после моего возвращения в столицу Алисанна покидает Драконий Камень и приезжает ко мне. Ещё через луну мы венчаемся во второй раз. Теперь не тайно, а открыто, перед Железным троном и всем королевством. Больше никто не посмеет шептаться, будто король и королева не состоят в настоящем браке.\n\nОбряд совершает недавно поступивший ко мне на службу септон Барт — сын кузнеца, человек низкого рождения и безграничного ума, самый учёный из всех, кого я встречал. Я запоминаю его. Думаю, он далеко пойдёт. Сама церемония скромна: казна пуста, гостей едва тысяча. Жалкое подобие пышной Золотой свадьбы Рогара и матери. Но я не променял бы её на тысячу золотых свадеб.\n\nАлисанна — моя сестра, моя королева, мой ближайший друг на свете. Никто не знает моего сердца так, как она, а я — её. Этой ночью мы наконец разделяем ложе как муж и жена перед богами и людьми.\n\n#bold Какие бы бури ни пришли, мы встретим их вместе.#!"
 jaehaerys.0026.a:0 "Моя королева. Моя сестра. Моя родственная душа."
 jaehaerys.0027:0 "Септон-десница"
 jaehaerys.0027.desc:0 "Лорд Деймон Веларион долго и верно служил Короне. Но Владыка Приливов стареет, и приливы зовут его домой. Королевство ждёт, что цепь десницы достанется великому лорду: Талли, Тиреллу, Аррену — гордому имени с гордыми знамёнами.\n\nКоролевство будет разочаровано. При дворе есть человек, прочитавший все книги библиотеки Красного замка и написавший ещё лучшие. Он спорил с септонами о Доктрине, с Рего Дразом — о портовых счетах, и одолел всех. Он не боится ни богов, ни лордов, ни сказать королю, что тот неправ. Он сын кузнеца. Носит одежды септона. И более блестящего ума я не встречал.\n\nПусть великие лорды скрежещут зубами. У мудрости нет родовых цветов.\n\n#bold Септон Барт станет моей десницей. Королевство посмеётся — а затем сорок лет будет дивиться.#!"
 jaehaerys.0027.desc.daemon_dead:0 "Должность десницы свободна. Королевство ждёт, что я выберу великого лорда: Талли, Тирелла, Аррена — гордое имя с гордыми знамёнами.\n\nКоролевство будет разочаровано. При дворе есть человек, прочитавший все книги библиотеки Красного замка и написавший ещё лучшие. Он спорил с септонами о Доктрине, с Рего Дразом — о портовых счетах, и одолел всех. Он не боится ни богов, ни лордов, ни сказать королю, что тот неправ. Он сын кузнеца. Носит одежды септона. И более блестящего ума я не встречал.\n\nПусть великие лорды скрежещут зубами. У мудрости нет родовых цветов.\n\n#bold Септон Барт станет моей десницей. Королевство посмеётся — а затем сорок лет будет дивиться.#!"
 jaehaerys.0027.option1:0 "Цепь достаётся самому блестящему уму королевства."
 jaehaerys.0027.hand_tt:0 "Лорд Деймон Веларион с почётом оставит свой пост. #bold Септон Барт#!, сын кузнеца и хранитель библиотеки Красного замка, станет десницей короля."
 jaehaerys.0028:0 "Дитя дракона"
 jaehaerys.0028.desc:0 "Бейлон начал гоняться за каждой тенью, похожей на крылья. Он ещё мал, но в нём драконья кровь. Если слишком поздно научить его страху, тот может обернуться чем-то худшим.\n\nДраконье Логово готово. В его темноте спит Балерион. Мне следует показать сыну то, что сохранил наш дом и к чему никогда нельзя относиться легкомысленно.\n\n#bold Принц должен увидеть то, что делает его дом великим.#!"
 jaehaerys.0028.a:0 "Привести его в Драконье Логово."
 jaehaerys.0029:0 "Бейлон Храбрый"
 jaehaerys.0029.desc:0 "Я хотел лишь показать Бейлону дракона.\n\nБалерион лежит перед нами, словно гора чёрного железа. Между зубами, каждый длиннее руки моего сына, сочится дым. Не успеваю я его поймать, как Бейлон со смехом бросается вперёд и хлопает Чёрного Ужаса по морде.\n\nНа миг мир замирает. Балерион открывает глаз, пылающий, словно расплавленный металл. Бейлон смеётся ещё громче.\n\nОдин из белых плащей выдыхает — мы остальные словно забыли, как это делается. «Этот мальчик храбр, — говорит он, — или безумен».\n\n#bold К вечеру весь Красный замок выбирает более доброе слово.#!"
 jaehaerys.0029.a:0 "Семеро, спасите нас от бесстрашных сыновей."
 sotd_soulmate_reason:0 "[Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'Вы принадлежите', 'Они принадлежат')] друг другу с тех пор, как [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'вы были', 'они были')] двумя сереброволосыми детьми, делившимися секретами в тёмных покоях замка [GetTitleByKey('b_the_red_keep').GetNameNoTier]. Один брак заключён после тайного полуночного полёта во владение [GetTitleByKey('c_dragonstone').GetNameNoTier], другой — на глазах всего королевства. [CHARACTER.GetShortUIName] и [TARGET_CHARACTER.GetShortUIName] — гораздо больше, чем муж и жена: [Select_CString(Or(CHARACTER.IsLocalPlayer, TARGET_CHARACTER.IsLocalPlayer), 'вы —', 'они —')] самые близкие друзья и две половины одного бьющегося сердца. О чём мечтает один, о том мечтает и другой; ни боги, ни Семеро, ни весь огромный мир не разлучат их."
