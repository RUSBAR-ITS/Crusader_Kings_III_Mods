l_russian:
 sotd_doctrine.0001.t:0 "Вера и брак"
 sotd_doctrine.0001.desc:0 "Мы сыграли свадьбу — и даже дважды, — но дело ещё не улажено. Вера в Семерых по-прежнему считает брак брата с сестрой мерзостью. Семиконечная звезда, священное писание древнего Андалоса, прямо осуждает кровосмешение. Септоны шепчутся об этом в септах, благочестивые лорды ропщут. Я не забыл, что именно такой ропот поднял Святое Воинство против моего отца и дяди и утопил королевство в крови.\n\nЯ не позволю этой ране гноиться. Нужно добиться, чтобы Семеро признали мой брак. Но как? Терпением и ласковыми речами, как подобает Миротворцу? Или огнём, как подобает дракону?\n\n#bold Дракон и Семеро не могут быть правы одновременно. Кто-то должен уступить.#!"
 sotd_doctrine.0001.a:0 "Словом, а не мечом. Я пошлю семерых глашатаев."
 sotd_doctrine.0001.b:0 "Дракон не просит. Пламя и кровь."
 sotd_doctrine.0002.t:0 "Семеро глашатаев"
 sotd_doctrine.0002.desc:0 "Я выбираю путь своего деда, а не дяди. Семеро самых мудрых и красноречивых служителей Веры — септоны и септы, среди них суровый старый септон Альфин и находчивая Элинор Костейн — отправляются проповедовать #bold Доктрину исключительности#! по всему королевству. Босиком и в одиночку они идут от деревни к деревне, от города к городу, рассказывая простому люду о моей мудрости и доброте Алисанны.\n\nИх учение просто: Таргариены, единственные в мире всадники драконов после Рока Валирии, ведут свой род не из Андалоса, а из Валирийского Фригольда. Там действовали иные законы: брат женился на сестре, ибо такими их создали боги. Людей такой крови нельзя судить по законам обычных смертных.\n\nКогда насмешливый межевой рыцарь кричит септону Балдрику: #italic «А если я тоже захочу лечь со своей сестрой, ты позволишь?»#! — септон отвечает без промедления: #italic «Отправляйтесь на Драконий Камень и оседлайте дракона, сир. Если сумеете, я сам обвенчаю вас с сестрой».#! Простой люд покатывается со смеху, и мало-помалу королевство склоняется на нашу сторону.\n\n#bold Глашатаи отправятся в путь, и королевство будет завоёвано словом.#!"
 sotd_doctrine.0002.a:0 "Идите и проповедуйте истину дракона."
 sotd_doctrine.0003.t:0 "Хрустальная корона без владельца"
 sotd_doctrine.0003.desc:0 "Прошло несколько лет с тех пор, как я начал распространять своё учение. Старый верховный септон умирает, и хрустальная корона остаётся без владельца. Праведным предстоит выбрать преемника. Один из вероятных избранников готов осудить мой брак с кафедры самой Звёздной септы и вновь разжечь пламя мятежа, бушевавшее всего несколько лет назад.\n\nЯ этого не допущу. Мы с Алисанной летим в Старомест на Вермиторе и Среброкрылой. Там я тайно договариваюсь с лордом Хайтауэром, к чьему голосу прислушиваются Праведные: он поддержит кандидата, благосклонного к моему учению, а я дам королевское слово, что однажды хрустальная корона достанется сыну его дома. Старый лорд пожимает мне руку. Уговор заключён.\n\n#bold Корона за корону. Служители Веры сами увенчают моё учение.#!"
 sotd_doctrine.0003.a:0 "Хайтауэр станет верховным септоном. По рукам."
 sotd_doctrine.0004.t:0 "Доктрина стала законом"
 sotd_doctrine.0004.desc:0 "Свершилось. Под хрустальным куполом Звёздной септы новый верховный септон провозглашает перед собравшимися Праведными: Доктрина исключительности отныне — официальный догмат Веры в Семерых. Таргариены исключительны. Их нельзя судить по законам обычных людей. Они вправе вступать в брак по обычаю древних драконьих владык.\n\nТеперь ни один септон не сможет назвать мой брак грехом, а моих детей — мерзостью, не выступив против самой Веры. Я положил конец долгой войне между драконом и Семерыми, начатой при моём отце и ставшей чудовищной при моём дяде. Добился этого мудростью и терпением, а не огнём. Это запишут в священных книгах на все грядущие века.\n\n#bold Дракон и Семеро примирились, отныне и навсегда.#!"
 sotd_doctrine.0004.a:0 "Так написано. Так и будет."
 sotd_doctrine.0004.doctrine_tt:0 "#bold Доктрина исключительности#! становится догматом #bold Веры в Семерых#!. Отныне запрет Веры на кровосмешение не распространяется на Таргариенов: братья и сёстры их дома могут вступать в брак, как драконьи владыки древней Валирии."
 sotd_doctrine.0005.t:0 "Весть с дороги"
 sotd_doctrine.0005.desc:0 "С Королевского тракта в Красный замок приходят вести: труды семерых глашатаев приносят плоды. В торговом городке Речных земель септон Балдрик взобрался на повозку и стал проповедовать Доктрину исключительности толпе, собравшейся его освистать. К концу проповеди люди уже приветствовали его криками. Лучше всех, говорят, высказалась жена мельника: #italic «Андалы-то на драконах отродясь не летали. Думается мне, боги не просто так дали Таргариенам драконов: хотели, чтоб те свою кровь ни с чьей не мешали».#!\n\nКаждую неделю приходят новые такие рассказы: здесь убедили деревню, там — целую рыночную площадь; раздают милостыню, проповеди встречают одобрением. Миля за милей, слово за словом простой люд Вестероса учится видеть в моём браке не грех, а обычай драконов.\n\n#bold Терпение. Слову нужно больше времени, чем огню, зато оно не оставляет пепелищ.#!"
 sotd_doctrine.0005.a:0 "Хорошо. Пусть проповедуют дальше."
 sotd_doctrine.0006.t:0 "Лорд склоняется"
 sotd_doctrine.0006.desc:0 "Новая победа — ещё важнее и труднее прежних. [sotd_convinced_lord.GetTitledFirstName], один из благочестивейших лордов королевства, выслушал в собственном зале проповедь септы Элинор Костейн о Доктрине исключительности и встал, чтобы объявить: он убеждён. Кровь дракона, сказал он собравшимся домочадцам, не чета крови обычных людей, а Семиконечная звезда написана для андалов, не для наследников погибшей Валирии.\n\nЗа одним великим лордом последуют другие. Его вассалы прислушиваются, септоны в его владениях умолкают. Ропот против моего брака стихает в каждом замке, где побывали глашатаи.\n\n#bold Лорды Вестероса начинают уступать — не страху, а разуму.#!"
 sotd_doctrine.0006.desc.generic:0 "Новая победа — ещё важнее и труднее прежних. Пришла весть, что один из благочестивейших лордов королевства выслушал в собственном зале проповедь септы Элинор Костейн о Доктрине исключительности и встал, чтобы объявить: он убеждён. Кровь дракона, сказал он собравшимся домочадцам, не чета крови обычных людей, а Семиконечная звезда написана для андалов, не для наследников погибшей Валирии.\n\nЗа одним великим лордом последуют другие. Его вассалы прислушиваются, септоны в его владениях умолкают. Ропот против моего брака стихает в каждом замке, где побывали глашатаи.\n\n#bold Лорды Вестероса начинают уступать — не страху, а разуму.#!"
 sotd_doctrine.0006.a:0 "За одним лордом последуют другие."
 sotd_doctrine.0007.t:0 "Перелом"
 sotd_doctrine.0007.desc:0 "Старый септон Альфин, неутомимый вопреки возрасту, прислал из Простора весть, немыслимую ещё два года назад. Септон, осмелившийся осудить мой брак перед собственным алтарём, был заглушён криками #bold своей же паствы#!. Люди забросали его репой и слово в слово повторили ему учение глашатаев: дракона нельзя судить по законам обычных людей.\n\nОт Долины до Штормовых земель происходит одно и то же. Королевство, прежде роптавшее о мерзости на Железном троне, теперь защищает мою правоту в каждой таверне и каждой септе. Доктрина исключительности перестаёт быть просьбой Короны и становится верой самого народа.\n\nЛишь Звёздная септа пока не сдаётся. Но верховный септон весьма стар, и скоро боги призовут его к себе.\n\n#bold Королевство на моей стороне. Осталось завоевать хрустальную корону.#!"
 sotd_doctrine.0007.a:0 "Теперь народ говорит за дракона."
 sotd_doctrine.0010.t:0 "Пламя и кровь"
 sotd_doctrine.0010.desc:0 "Почему я, потомок дракона, должен униженно просить у седых стариков в серых ветхих одеждах разрешения любить собственную жену? Мой дядя Мейгор ответил Вере пламенем и кровью. Он был чудовищем, но в одном, пожалуй, оказался прав: дракон правит, а овцы повинуются.\n\nИ всё же война с Верой в Семерых — это война с половиной королевства. Ещё живы те, кто помнит, как Святое Воинство едва не погубило мой дом. Я чувствую на себе тревожный взгляд Алисанны. Здесь дорога расходится надвое; выбрав неверный путь, повернуть назад будет нелегко.\n\n#bold Что делать дракону, когда овцы не желают повиноваться?#!"
 sotd_doctrine.0010.a:0 "Лететь в Старомест. Верховный септон покорится или сгорит."
 sotd_doctrine.0010.b:0 "Нет. Я не стану подобием своего дяди. Пусть глашатаи делают своё дело."
 sotd_doctrine.0010.c:0 "Зачем кланяться андальским богам вообще? Мы кровь Валирии."
 sotd_doctrine.0011.t:0 "Дракон над Староместом"
 sotd_doctrine.0011.desc:0 "Огромная бронзовая тень Вермитора накрывает священный город. Я кружу над Звёздной септой, и весь Старомест дрожит под ударами его крыльев. Приземлившись перед верховным септоном и Праведными, я прямо излагаю своё требование: провозгласите Доктрину исключительности, благословите мой брак, признайте моих детей законнорождёнными — или отвечайте перед Бронзовым Гневом.\n\nНо старик оказался крепче, чем я рассчитывал. Он и не думает отступать. Прямо в лицо он называет меня грешником и порождением мерзости, хотя мой дракон может проглотить его целиком. Семеро не торгуются с чудовищами, говорит он.\n\n#bold Он не покорится. Теперь мне предстоит решить, каким королём я стану.#!"
 sotd_doctrine.0011.a:0 "Тогда гори. Гори, как мой дядя должен был сжечь вас всех!"
 sotd_doctrine.0011.b:0 "Суд Семерых! Пусть сами боги объявят, кто праведен."
 sotd_doctrine.0012.t:0 "Звёздная септа горит"
 sotd_doctrine.0012.desc:0 "Я спускаю Бронзовый Гнев с цепи. Вермитор обрушивается на Старомест, и Звёздная септа — древнейший и святейший оплот Веры во всём Вестеросе, где андальских королей благословляли за тысячу лет до появления моего дома, — тонет в драконьем пламени. Хрустальный купол лопается, словно яичная скорлупа. Верховный септон и Праведные сгорают внутри дотла.\n\nКоролевство содрогается от ужаса. От Простора до каменистой Долины Арренов благочестивые лорды подхватывают старый клич Святого Воинства: король-дракон — чудовище, его нужно свергнуть, как едва не свергли его дядю. Я объявил войну Семерым, и Семеро ответили мне гневом половины королевства.\n\n#bold Пламя и кровь. Пусть всё королевство идёт на меня, если посмеет.#!"
 sotd_doctrine.0012.a:0 "Да будет так. Дракон не боится армии овец."
 sotd_doctrine.0013.t:0 "Суд Семерых"
 sotd_doctrine.0013.desc:0 "Я не стану сжигать их, как поступил бы мой дядя. Вместо этого я требую древнейшего и священнейшего суда самой Веры: #bold Суда Семерых#!. Семеро защитников будут сражаться за Корону, семеро — за Веру. Кровью и сталью сами боги укажут, на чьей стороне правда.\n\nВерховный септон слишком слаб, чтобы поднять меч, и Вера обращается к своему могущественнейшему сыну: #bold лорд Староместа#! сам выступит за Семерых, а его семёрку дополнят рыцари Хайтауэра. Я тоже буду сражаться за себя — король не вправе поручить другому предстать перед судом богов вместо него. Каждому из нас нужно собрать защитников: лучших воинов, готовых встать рядом во дворе перед Звёздной септой.\n\nЕсли мои семеро победят, тем самым боги подтвердят истинность Доктрины исключительности. Вере придётся склониться перед приговором собственного священного суда. Но если мы падём, меня признают грешником перед богами и людьми. Такой приговор нельзя оспорить, да я его и не переживу. Септоны молятся. Боги наблюдают.\n\n#bold За дракона и за истину. Пора собрать защитников.#!"
 sotd_doctrine.0013.a:0 "Семеро за дракона. Пусть боги решают."
 sotd_doctrine.0014.t:0 "Боги вынесли приговор"
 sotd_doctrine.0014.desc:0 "Последний из моих защитников падает в кровавую грязь перед септой. Септоны торжествующе возносят голоса к небесам. Боги сказали своё слово, и их приговор — против меня. Перед десятью тысячами свидетелей я поставил судьбу своего брака на их решение. Приговор Суда Семерых не подлежит обжалованию: отвергнуть его сейчас — значит отдать Святому Воинству половину королевства.\n\nМне приходится платить, и эта плата страшнее удара любого меча. Верховный септон объявляет мой брак с Алисанной расторгнутым перед богами и людьми, греховным и недействительным с самого начала. Всех рождённых в нём детей признают порождениями мерзости, недостойными Железного трона. Самой Алисанне Вера уготавливает своё самое жестокое милосердие: серые одежды #bold Безмолвных Сестёр#!. Она должна искупить наш грех служением Неведомому и молчанием до конца своих дней.\n\nСёстры приходят за ней в сумерках. При них она не плачет — увидеть её слёзы дано лишь мне. У двери она оборачивается и ничего не говорит: её молчание уже началось. Но глаза произносят то, чего уста больше не смогут сказать: #italic это никогда не было грехом.#!\n\n#bold Я потерял её. Её отняли боги, осудившие нас и обрёкшие её на молчание.#!"
 sotd_doctrine.0014.a:0 "Боги вынесли приговор. (Она больше никогда не заговорит.)"
 sotd_doctrine.0017.t:0 "Боги заговорили"
 sotd_doctrine.0017.desc:0 "Всё кончено. Последний из защитников Веры лежит поверженный в кровавой грязи перед Звёздной септой. Над Староместом нависает страшная тишина. Семеро сражались за Семерых, семеро — за дракона. Боги вынесли свой приговор кровью и сталью, как того требует священнейший закон Веры.\n\nСептоны смотрят на побоище с пепельно-серыми лицами. Приговор Суда Семерых нельзя оспорить. Он священен, окончателен — и вынесен #bold в мою пользу#!. Доктрина исключительности больше не просьба короля. Теперь это доказанная воля богов, явленная десяти тысячам свидетелей в тени величайшей септы самой Веры.\n\nПраведным остаётся вписать её в священные книги: сами боги уже начертали её кровью.\n\n#bold Боги на стороне дракона. Вера покорится.#!"
 sotd_doctrine.0017.a:0 "Вердикт свят и окончателен. Провозгласить доктрину."
 sotd_doctrine.0018.t:0 "Доктрина, написанная кровью"
 sotd_doctrine.0018.desc:0 "Под хрустальным куполом Звёздной септы верховный септон провозглашает перед собравшимися Праведными Доктрину исключительности официальным догматом Веры в Семерых. Его голос не дрожит, хотя каждый под этим куполом знает, почему он произносит эти слова: Вера призвала богов судить дракона, и те вынесли приговор в его пользу.\n\nЯ не сжёг их, как поступил бы мой дядя. Не стал умолять, как они ожидали. Я потребовал священнейшего суда Семерых и позволил их богам высказаться. Теперь ни один септон не сможет назвать мой брак грехом, а моих детей — порождениями мерзости, не объявив самих богов лжецами. Приговор, начертанный кровью перед десятью тысячами свидетелей, внесут в священные книги на все грядущие века.\n\n#bold Боги вынесли приговор, и Вера должна покориться. Дракон и Семеро примирились — на условиях дракона.#!"
 sotd_doctrine.0018.desc.forfeit:0 "Всё заканчивается не кровью, а молчанием. В назначенный день семеро защитников Короны стоят во дворе перед Звёздной септой, вооружённые и готовые к бою. Напротив — никого. Несмотря на все грозные речи, Вера не смогла найти семерых защитников, готовых жизнью отстоять её обвинение. По священнейшему закону самой Веры обвинение, за которое некому вступиться, теряет силу: боги оправдывают обвиняемого.\n\nУ верховного септона нет выбора. Под хрустальным куполом, перед собравшимися Праведными, он провозглашает Доктрину исключительности догматом Веры в Семерых. Теперь ни один септон не вправе назвать мой брак грехом, а моих детей — порождениями мерзости: когда богов призвали судить дракона, ни один воин Веры не осмелился поднять за них меч.\n\n#bold Семерых призвали на бой, но никто не явился. Доктрина утверждена — отныне и навсегда.#!"
 sotd_doctrine.0018.a:0 "Так записано — кровью и на все времена."
 sotd_doctrine.0020.t:0 "Вера Старой Валирии"
 sotd_doctrine.0020.desc:0 "Довольно. Почему потомки древней Валирии, повелевающие драконами и величайшим королевством в истории мира, должны раболепствовать перед бледными богами андалов? Андалы приползли в Вестерос, когда мои предки уже давно владели небесами.\n\nДраконьи владыки Фригольда поклонялись Четырнадцати Огням и пламени, обретшему плоть. Им не нужно было разрешение септона, чтобы жениться по своей воле. Не нужно оно и нам. Я объявляю перед всем двором: дом Таргариенов отрекается от Веры в Семерых и возвращается к древним богам Валирии. Пусть септоны вопят, а простой люд смотрит разинув рот. Мы — драконы. Как и прежде, мы сами создадим себе богов.\n\n#bold В нас кровь дракона. Мы будем верить, как верила Валирия.#!"
 sotd_doctrine.0020.a:0 "Отречься от Семерых. Мы возвращаемся к огням Валирии."
 sotd_doctrine.0030.t:0 "Королевство восстаёт"
 sotd_doctrine.0030.desc:0 "Летят вороны, и каждый несёт одну и ту же весть: война. Лорд Простора, в чьих землях Звёздная септа лежит в пепле и чей народ выискивал в развалинах кости верховного септона, выступил за Веру. Вместе с ним поднимается королевство. Речные земли. Долина. Западные земли. И Север: Старки чтут старых богов и равнодушны к Семерым, но сжечь священнослужителей заживо в их собственном храме — преступление, которого не стерпит ни один честный северянин. Они выступают не за Веру, а против меня.\n\nТолько железнорождённые держатся в стороне. Они молятся своему Утонувшему богу, и сожжённые септы их не волнуют. Королевские земли остаются верны королю, как и Штормовые, помнящие, чей меч возвёл меня на престол. Два королевства против пяти. В каждой септе Вестероса проповедуют священную войну против дракона, сжёгшего обитель богов. Мой дядя сражался со Святым Воинством; я превратил в Святое Воинство всё королевство.\n\nЧто ж, пусть будет так. Они хотели увидеть чудовище на Железном троне. Пусть приходят — увидят.\n\n#bold Два королевства, два дракона, пламя и кровь. Пусть идут на нас.#!"
 sotd_doctrine.0030.a:0 "Пусть приходят. Пламя и кровь."
 sotd_doctrine.0031.t:0 "Пепел преклоняет колено"
 sotd_doctrine.0031.desc:0 "Всё кончено. Дракон победил пять королевств и все септы Вестероса. Войска Веры разбиты от Мандера до Трезубца. Восставшие против меня лорды один за другим преклоняют колени на пепелищах собственных полей и целуют моё кольцо, хотя в их глазах пылает ненависть.\n\nОднажды дядя сказал мне в своей манере: дракон правит, а овцы повинуются. Я не хотел стать таким, как он, но мне не позволили быть другим. Королевство запомнит, чего стоило восстание против Вермитора. Эта память сохранит мир надёжнее любой любви.\n\nМне осталось отнять у них лишь одно: слова, в которых они мне отказали. Пусть произнесут их на руинах своей главной святыни.\n\n#bold Королевство объезжено и покорно седлу. Теперь Вера скажет нужные слова.#!"
 sotd_doctrine.0031.a:0 "Теперь приведите ко мне уцелевших Праведных."
 sotd_doctrine.0032.t:0 "Доктрина, написанная огнём"
 sotd_doctrine.0032.desc:0 "Нового верховного септона коронуют в чужой септе: прежняя обращена в пепел. Первым делом он провозглашает Доктрину исключительности священным догматом Веры в Семерых. Окружающие септоны держат хрустальную корону дрожащими руками. Его голос срывается. Никто под этой крышей не верит произносимым словам. Все они будут повторять их до самой смерти.\n\nТаргариены исключительны. Их нельзя судить по законам обычных людей. Они вправе вступать в брак по обычаю древних драконьих владык. Так говорит Вера, ибо иначе заговорит огонь.\n\nМой дед завоевал корону с помощью драконов и удержал её милосердием. У дяди были драконы, но не было милосердия. А я? Я предложил королевству мудрость, но оно предпочло научить меня тому, что по-настоящему слышит лишь огонь.\n\n#bold Доктрина утверждена. Её начертали не чернилами, не кровью, а огнём.#!"
 sotd_doctrine.0032.a:0 "Так говорит Вера. Так говорит пламя."
 sotd_doctrine.0033.t:0 "Дракон унижен"
 sotd_doctrine.0033.desc:0 "Королевство победило. Пять королевств разбили мои войска; мои знамёна горели от Мандера до Королевского тракта. Люди, шедшие под семиконечной звездой, диктуют условия мира под моей крышей. Они оставляют мне трон: укрощённый король, которого можно выставить всем на обозрение, для них полезнее мученика. Но всё остальное они отнимают.\n\nМой брак объявляют мерзостью и расторгают перед богами и людьми. Моих детей лишают права наследовать: их кровь запятнана грехом. А Алисанну... Алисанну отдают Безмолвным Сёстрам, чтобы в серых одеждах и молчании она искупала преступление — любовь ко мне. Сёстры приходят за ней на глазах у септонов: никто не должен сказать, будто дракон утаил свой грех.\n\nПри них она не плачет. У двери она оборачивается и ничего не говорит: её молчание уже началось. Но глаза произносят то, чего уста больше не смогут сказать: #italic это никогда не было грехом.#!\n\nЯ сжёг Звёздную септу, и в ответ королевство сожгло весь мой мир.\n\n#bold Дракон всё ещё правит — пеплом всего, что любил.#!"
 sotd_doctrine.0033.a:0 "Королевство вынесло приговор. (Я потерял её.)"
