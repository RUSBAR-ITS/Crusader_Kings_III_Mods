l_russian:
 sotd_doctrine.0001.t:0 "Вера и брак"
 sotd_doctrine.0001.desc:0 "Свадьба состоялась дважды, но вопрос еще не решен. Вера Семи до сих пор называет брак брата с сестрой мерзостью; Семиконечная звезда, священное писание, родившееся в Андалосе в древности, самым простыми словами осуждает инцест. Септоны бормочут это в своих септах; благочестивые лорды ропщут; и я не забыл, что именно такое бормотание подняло «Воинствующую Веру» против моего отца и моего дяди и затопило королевство кровью.\n\nЯ не оставлю эту рану гноиться. Семерых нужно заставить принять мой брак — но как? С терпением и сладкими словами, как подобает Примирителю? Или огнем, как и подобает дракону?\n\n#bold Дракон и Семеро не могут быть правы одновременно. Один из нас должен согнуться. #!"
 sotd_doctrine.0001.a:0 "Словами, не мечами. Я пошлю Семь Глашатаев."
 sotd_doctrine.0001.b:0 "Дракон не просит. Пламя и кровь."
 sotd_doctrine.0002.t:0 "Семь Глашатаев"
 sotd_doctrine.0002.desc:0 "Я выбираю путь своего деда, а не дяди. Семеро самых мудрых и красноречивых служителей Веры — септоны и септы, среди них суровый старый септон Альфин и находчивая Элинор Костейн — отправляются проповедовать #bold Доктрину исключительности#! по всему королевству. Босиком и в одиночку они идут от деревни к деревне, от города к городу, рассказывая простому люду о моей мудрости и доброте Алисанны.\n\nИх учение просто: Таргариены, единственные в мире всадники драконов после Рока Валирии, ведут свой род не из Андалоса, а из Фригольда. Там действовали иные законы, а брат женился на сестре, какими создали их боги. Людей такой крови нельзя судить по законам обычных смертных.\n\nКогда насмешливый межевой рыцарь крикнул септону Бальдрику: #italic «А если я тоже захочу лечь со своей сестрой, ты позволишь?»#! — септон ответил без промедления: #italic «Отправляйтесь на Драконий Камень и оседлайте дракона, сир. Если сумеете, я сам обвенчаю вас с сестрой».#! Простой люд покатывался со смеху, и мало-помалу королевство склоняется на нашу сторону.\n\n#bold Проповедники отправятся в путь, и королевство будет завоёвано словом.#!"
 sotd_doctrine.0002.a:0 "Идите и проповедуйте истину дракона."
 sotd_doctrine.0003.t:0 "Хрустальная корона без владельца"
 sotd_doctrine.0003.desc:0 "Спустя несколько лет после начала моей доктрины старый Верховный септон умирает, и хрустальная корона остается пустой. Теперь Самый Благочестивый должен выбрать своего преемника — и одним из вероятных кандидатов является септон, который осудит мой брак из самой Звездной Септы и заново зажжет пламя восстания, как оно горело всего несколько лет назад.\n\nЯ не позволю этого. На Вермиторе и Среброкрылой мы с Алисанной летим в Старомест, и там я заключаю тихую сделку с Лордом Хайтауэра, чей голос влияет на Самого Благочестивого: его поддержка Верховного септона, дружественного моей доктрине, и взамен мое королевское обещание, что сын его собственного дома однажды будет носить хрустальную корону. Старый лорд берет меня за руку. Сделка заключена.\n\n#bold Коронка за корону. Вера увенчает мое учение. #!"
 sotd_doctrine.0003.a:0 "Хайтауэр станет Верховным септоном. Согласен."
 sotd_doctrine.0004.t:0 "Доктрина стала законом"
 sotd_doctrine.0004.desc:0 "Это сделано. Под хрустальным куполом Звездной септы новый Верховный септон возвышает свой голос перед собравшимися Благочестивейшими и провозглашает Доктрину Исключительности официальным принципом Веры Семи. Таргариены исключительны; Таргариенов нельзя считать обычными людьми; Таргариены могут жениться, как древние повелители драконов.\n\nНикогда больше септон не назовет мой брак грехом и моих детей мерзостью, не проповедуя против самой Веры. Долгая война между драконом и Семерыми, начатая моим отцом и превратившаяся в чудовищную войну с моим дядей, закончена мной не огнем, а мудростью и терпением. Это будет записано в священных книгах на все века.\n\n#bold Дракон и Семеро примирились, отныне и навсегда. #!"
 sotd_doctrine.0004.a:0 "Так написано. Так и будет."
 sotd_doctrine.0004.doctrine_tt:0 "#bold Доктрина исключительности#! становится догматом #bold Веры в Семерых#!. Отныне запрет Веры на кровосмешение не распространяется на Таргариенов: братья и сёстры их дома могут вступать в брак, как драконьи владыки древней Валирии."
 sotd_doctrine.0005.t:0 "Весть с дороги"
 sotd_doctrine.0005.desc:0 "С Королевской дороги в Красный Замок доходят слухи: Семь Говорящих работают. В торговом городке в речных землях септон Болдрик проповедовал Доктрину исключительности, стоя на повозке, перед толпой, пришедшей посмеяться, и оставил их ликующими. Жена мельника, говорят, выразилась лучше всего: #italic «Андалы никогда не ездили на драконах. Мне кажется, боги, даровавшие Таргариенам драконов, имели в виду, что они должны хранить свою кровь при себе.'#!\n\nКаждую неделю приносится еще одна подобная история: здесь победа в деревне, там рыночная площадь, раздача милостыни и радостные проповеди. Медленно, миля за милей, слово за словом, жители Вестероса учатся воспринимать мой брак не как грех, а как путь дракона.\n\n#bold Терпение. Слова требуют больше времени, чем огонь, но они ничего не сжигают. #!"
 sotd_doctrine.0005.a:0 "Хорошо. Пусть проповедуют дальше."
 sotd_doctrine.0006.t:0 "Лорд склоняется"
 sotd_doctrine.0006.desc:0 "Теперь более великая и более трудная победа: [sotd_convinced_lord.GetTitledFirstName], самый благочестивый лорд из всех в королевстве, услышал, как септа Элинор Костейн проповедовала Доктрину исключительности в своем собственном зале — и поднялся, чтобы заявить, что он убежден. Кровь дракона, сказал он собравшимся домашним, не является кровью простых людей, а Семиконечная звезда была написана для Андалов, а не для наследников потерянной Валирии.\n\nКуда ведет один великий лорд, за ним следуют другие. Знаменосцы лордов принимают это к сведению; септоны его земель замолкают; и ропот против моего брака становится тише в каждом зале, где проходили Ораторы.\n\n#bold Лорды Вестероса начинают подчиняться. Не бояться — рассуждать. #!"
 sotd_doctrine.0006.desc.generic:0 "Теперь еще более великая и более трудная победа: пришло известие, что один из самых благочестивых лордов королевства услышал, как септа Элинор Костейн проповедовала Доктрину исключительности в своем собственном зале — и поднялся, чтобы заявить, что его убедили. Кровь дракона, сказал он собравшимся домашним, не является кровью простых людей, а Семиконечная звезда была написана для Андалов, а не для наследников потерянной Валирии.\n\nКуда ведет один великий лорд, за ним следуют другие. Знаменосцы лордов принимают это к сведению; септоны его земель замолкают; и ропот против моего брака становится тише в каждом зале, где проходили Ораторы.\n\n#bold Лорды Вестероса начинают подчиняться. Не бояться — рассуждать. #!"
 sotd_doctrine.0006.a:0 "Где один лорд ведёт, другие последуют."
 sotd_doctrine.0007.t:0 "Перелом"
 sotd_doctrine.0007.desc:0 "Старый септон Альфин, все еще неутомимый в его возрасте, посылает из Простора весть, которая была бы немыслима два года назад: септон, осмелившийся проповедовать против моего брака на своем собственном алтаре, был выкрикиван — #bold его собственной паствой#!. Местные жители забросали его репой и цитировали ему в ответ учение Говорящих, слово в слово: дракона не судят так, как судят обычных людей.\n\nОт Долины до Штормовых земель история одна и та же. Царство, которое когда-то бормотало против мерзости на Железном Троне, теперь доказывает мою правоту в каждой таверне и каждом септе. Доктрина исключительности больше не является призывом Короны — она становится кредо народа.\n\nТолько сама Звездная сентябрь все еще держится. Но старый Верховный септон очень стар, и боги скоро призовут его.\n\n#bold Царство завоевано. Теперь осталась только хрустальная корона. #!"
 sotd_doctrine.0007.a:0 "Теперь народ говорит за дракона."
 sotd_doctrine.0010.t:0 "Пламя и кровь"
 sotd_doctrine.0010.desc:0 "Зачем мне, крови дракона, приходить с шапкой в руке к серым старикам в серых старых одеждах, умоляя их позволить полюбить собственную жену? Мой дядя Мейгор ответил Вере огнем и кровью, и хотя он был чудовищем, в одном он, возможно, не был полностью не прав: дракон правит, а овцы подчиняются.\n\nИ все же — вести войну с Верой Семи — значит вести войну с половиной королевства; На памяти живущих людей «Воинствующая Вера» чуть не снесла мой дом. Я чувствую на себе неуверенный взгляд Алисанны. Дорога здесь раздваивается, и с неверного поворота вернуться будет нелегко.\n\n#bold Что делать дракону, если овцы не подчиняются? #!"
 sotd_doctrine.0010.a:0 "Лететь в Старомест. Верховный Септон согнётся или сгорит."
 sotd_doctrine.0010.b:0 "Нет. Я не стану подобием своего дяди. Пусть глашатаи делают своё дело."
 sotd_doctrine.0010.c:0 "Зачем кланяться андальским богам вообще? Мы кровь Валирии."
 sotd_doctrine.0011.t:0 "Дракон над Староместом"
 sotd_doctrine.0011.desc:0 "Огромная бронзовая тень Вермитора падает на священный город, пока я облетаю Звездную сентябрь, и весь Старомест съеживается под взмахами его крыльев. Я приземляюсь перед Верховным септоном и его Благочестивейшим и прямо требую этого: провозгласите Доктрину Исключительности, благословите мой брак и назовите моих детей законнорожденными — или ответьте Бронзовой Ярости.\n\nНо старик сделан из более прочного материала, чем я надеялся. Он не вздрагивает. Он прямо в лицо называет меня грешником и мерзостью, хотя мой дракон мог бы проглотить его одним укусом, и говорит мне, что Семеро не торгуются с монстрами.\n\n#bold Он не прогнется. Теперь я должен выбрать, каким королем мне быть. #!"
 sotd_doctrine.0011.a:0 "Тогда гори. Гори, как мой дядя должен был сжечь вас всех!"
 sotd_doctrine.0011.b:0 "Суд Семерых! Пусть сами боги объявят, кто праведен."
 sotd_doctrine.0012.t:0 "Звёздная Септа горит"
 sotd_doctrine.0012.desc:0 "Я теряю Бронзовую Ярость. Вермитор обрушивается на Старомест, и Звёздная септа — старейшая и святейшая обитель Веры во всем Вестеросе, где короли Андалов были благословлены за тысячу лет до рождения моего дома — тонет в драконьем огне. Его хрустальный купол разбивается, как яичная скорлупа; Верховный септон и Самый Благочестивый сгорают внутри дотла.\n\nЦарство в ужасе отшатывается. От Простора до Долины и до каменистой Долины Аррена благочестивые лорды подхватывают старый клич Воинствующей Веры: король драконов — чудовище, и его необходимо свергнуть, как чуть было не случилось с его дядей. Я объявил войну Семерым, и Семеро ответили гневом половины моего королевства.\n\n#bold Огонь и кровь. Все королевство может прийти, если осмелится. #!"
 sotd_doctrine.0012.a:0 "Да будет так. Дракон не боится армии овец."
 sotd_doctrine.0013.t:0 "Суд Семерых"
 sotd_doctrine.0013.desc:0 "Я не сожгу их, как сделал бы мой дядя. Вместо этого я требую самого старого и самого священного из судов Веры: Испытания #bold над Семи#!. Семь чемпионов будут сражаться за Корону, семеро — за Веру, и сами боги посредством крови и стали объявят, кто праведник.\n\nВерховный септон слишком слаб, чтобы поднять меч, поэтому Вера обращается к своему могущественному сыну: #bold Лорд Староместа#! сам будет защищать Семь, а рыцари Хайтауэра пополнят его семерку. И я буду сражаться от своего имени, ибо король не может делегировать решение богов. Каждый из нас должен теперь собрать своих чемпионов, лучшие мечи, которые будут стоять с нами во дворе перед Звездным Сентябрем.\n\nЕсли мои семеро одержат победу, тогда боги сказали: Доктрина Исключительности доказана истина, и Вера должна склониться перед вердиктом своего собственного священного испытания. Но если мы падем, то я буду судим грешником перед богами и людьми — и апелляции от такого суда нет, и я его не переживу. Септоны молятся. Боги наблюдают.\n\n#bold За дракона и за правду. Чемпионы соберутся. #!"
 sotd_doctrine.0013.a:0 "Семеро за дракона. Пусть боги решают."
 sotd_doctrine.0014.t:0 "Боги вынесли приговор"
 sotd_doctrine.0014.desc:0 "Последний из моих защитников падает в окровавленную грязь перед сентябрём, и септоны торжествующе возносят свои голоса к небесам. Боги сказали свое слово — и их приговор против меня. Я поставил свой брак на их решение перед десятью тысячами свидетелей, и апелляция на Суде Семи невозможна: бросить вызов этому решению сейчас означало бы отдать Воинствующей Вере половину моего королевства.\n\nИтак, цена уплачена, и она жестокее любого меча. Верховный септон объявляет, что мой брак с Алисанной расторгнут в глазах богов и людей, грешен и недействителен с первого часа, а любые дети, рожденные от него, названы мерзостью, непригодной для того, чтобы когда-либо занять Железный Трон. А самой Алисанне Вера претендует на самое ужасное милосердие: серые одежды #bold Безмолвных Сестер#!, чтобы она могла искупить наш грех в служении Неведомому, оставаясь безмолвной до своего смертного дня.\n\nСестры приходят за ней в сумерках. Она не плачет там, где ее видят; ту милость, которую она оставляет мне одному. У двери она оборачивается — и ничего не говорит, ибо уже начала молчать. Но ее глаза говорят то, что ее язык, возможно, никогда больше не произнесет: #italic это никогда не было грехом.#!\n\n#bold Я потерял ее — из-за богов, которые нас судили, и молчания, которого они требуют. #!"
 sotd_doctrine.0014.a:0 "Боги вынесли приговор. (Она больше никогда не заговорит.)"
 sotd_doctrine.0017.t:0 "Боги заговорили"
 sotd_doctrine.0017.desc:0 "Все кончено. Последний из защитников Веры лежит разбитый в красной грязи перед Звездной сентябрью, и ужасная тишина царит в Староместе. Семь сражались за Семерых, а семеро сражались за дракона — и боги вынесли свой приговор кровью и сталью, как того требует святейший закон Веры.\n\nСептоны смотрят на кровавую бойню с пепельными лицами. Апелляция на «Испытание семи» невозможна; Суд свят и окончателен, и он #bold мой#!. Доктрина исключительности больше не является призывом короля — это доказанная воля богов, провозглашенная перед десятью тысячами свидетелей в тени великой септы Веры.\n\nПраведные могут записать это в свои священные книги, ибо сами боги первыми написали это кровью.\n\n#bold Боги с драконом. Вера склонится. #!"
 sotd_doctrine.0017.a:0 "Вердикт свят и окончателен. Провозгласить доктрину."
 sotd_doctrine.0018.t:0 "Доктрина, написанная кровью"
 sotd_doctrine.0018.desc:0 "Под хрустальным куполом Звездной септы Верховный септон возвышает свой голос перед собравшимися Благочестивейшими и провозглашает Доктрину Исключительности официальным принципом Веры Семи. Голос его не дрожит, хотя каждая душа под куполом знает, почему он говорит: Вера призвала богов судить дракона, и боги ответили — за дракона.\n\nЯ не сжег их, как сделал бы мой дядя. Я не умолял их, как они ожидали. Я дал Семерым их самое святое испытание и позволил их собственным богам говорить — и теперь ни один септон не может назвать мой брачный грех, а моих детей мерзостью, не назвав самих богов лжецами. Приговор был написан кровью перед десятью тысячами свидетелей, и он будет записан в священных книгах на все века вперед.\n\n#bold Боги судили, и Вера должна склониться. Дракон и Семеро примиряются — на драконьих условиях. #!"
 sotd_doctrine.0018.desc.forfeit:0 "Это заканчивается не кровью, а молчанием. Наступает назначенный день, и семеро Короны стоят вооруженные и готовые во дворе перед Звездной сентябрью — и напротив них никого. Вера, несмотря на всю свою громогласность, не смогла найти семерых защитников, готовых поставить на кон свою жизнь ради ее обвинений. По святейшему закону Веры обвинение, которое невозможно защитить, вообще не является обвинением: боги находят обвиняемого.\n\nУ Верховного септона нет выбора. Под хрустальным куполом, перед собравшимися Благочестивейшими, он провозглашает Доктрину Исключительности как принцип Веры Семи. Ни один септон теперь не может называть мой брак грехом, а моих детей — мерзостью, ибо, когда богам было предложено судить дракона, ни один человек Веры не осмелился нести свой меч.\n\n#bold Семерых призвали на битву, но никто не пришел. Доктрина остается в силе, ныне и навсегда. #!"
 sotd_doctrine.0018.a:0 "Так записано — кровью и на все времена."
 sotd_doctrine.0020.t:0 "Вера Старой Валирии"
 sotd_doctrine.0020.desc:0 "Хватит этого. Почему кровь Старой Валирии, которая ездит на драконах и правит величайшим царством, которое знал мир, должна склоняться и царапаться перед бледными богами Андалов, которые приползли в Вестерос спустя долгое время после того, как мои предки правили небесами?\n\nПовелители драконов Фригольда поклонялись четырнадцати огням и огню, ставшему плотью, и не просили у септона разрешения жениться, как им заблагорассудится. И мы тоже. Я заявляю перед судом, что Дом Таргариенов отказывается от Веры Семи и возвращается к старым богам Валирии. Септоны могут вопить, а простой народ таращиться. Мы драконы; мы создадим своих собственных богов, как всегда.\n\n#bold Мы — кровь дракона. Мы будем поклоняться, как это делала Валирия. #!"
 sotd_doctrine.0020.a:0 "Отречься от Семерых. Мы возвращаемся к огням Валирии."
 sotd_doctrine.0030.t:0 "Королевство восстаёт"
 sotd_doctrine.0030.desc:0 "Вороны летают, и все несут одно и то же слово: война. Владыка Простора, на чьих землях лежит в пепле Звёздная септа и чьи люди извлекли из руин кости Верховного септона, высказался за Веру, и королевство возрождается вместе с ним. Речные земли. Долина. Вестерленды. А Север — Старки хранят старых богов и не заботятся о Семерых, но сожжение святых заживо в их собственном храме — это преступление, которого не потерпит ни один благородный северянин: они выступают не за Веру, а против меня.\n\nЛишь железнорожденные сидят в стороне, молясь своему утонувшему богу и не обращая внимания на сожженные септы. Коронные земли поддерживают своего короля, а Штормовые земли помнят, чей меч посадил меня на этот трон. Два королевства против пяти, и каждый септ в Вестеросе проповедует священную войну против дракона, который сжег собственный дом богов. Мой дядя столкнулся с «Воинствующей Верой»; Я сделал все королевство своим воинствующим верою.\n\nПусть будет так. Они хотели монстра на Железном Троне. Они придут и найдут его.\n\n#bold Два королевства, два дракона, огонь и кровь. Царство может прийти. #!"
 sotd_doctrine.0030.a:0 "Пусть приходят. Пламя и кровь."
 sotd_doctrine.0031.t:0 "Пепел преклоняет колено"
 sotd_doctrine.0031.desc:0 "Это закончено. Против пяти королевств и каждого септа Вестероса дракон победил. Армии Веры разбиты от Мандера до Трезубца; Лорды, восставшие против меня, один за другим преклоняют колени среди пепла своих полей и прижимаются губами к моему кольцу, а их глаза горят ненавистью.\n\nМой дядя однажды сказал мне по-своему: дракон правит, а овцы подчиняются. Я не хотел быть своим дядей, но они не позволили мне быть никем другим. Царство будет помнить, чего стоило восстание против Вермитора, и эта память сохранит мир лучше, чем когда-либо любовь.\n\nОстается взять с них только одно: слово, которое они мне отвергли, произнесенное на руинах их святейшего места.\n\n#bold Царство сломано до седла. Теперь Вера скажет слова. #!"
 sotd_doctrine.0031.a:0 "Теперь приведите ко мне уцелевших Праведных."
 sotd_doctrine.0032.t:0 "Доктрина, написанная огнём"
 sotd_doctrine.0032.desc:0 "Они коронуют нового Верховного септона в заимствованной септоне, поскольку старый превратился в пепел, и его первым действием перед септонами, чьи руки трясутся, когда они держат кристалл, является провозглашение Доктрины исключительности священным принципом Веры Семи. Его голос ломается, когда он произносит эти слова. Никто под этой крышей им не верит. Каждый из них будет повторять их до самой смерти.\n\nТаргариены исключительны. Таргариенов нельзя считать обычными людьми. Таргариены могут жениться, как древние повелители драконов. Так говорит Вера — потому что альтернативой является огонь.\n\nМой дед завоевал свою корону с помощью драконов и бережно хранил ее. У моего дяди были драконы, а не милосердие. А я? Я предложил мудрость мира, и он решил научить меня, что только огонь можно услышать по-настоящему.\n\n#bold Учение стоит — написано не чернилами и не кровью, а огнём. #!"
 sotd_doctrine.0032.a:0 "Так говорит Вера. Так говорит пламя."
 sotd_doctrine.0033.t:0 "Дракон унижен"
 sotd_doctrine.0033.desc:0 "Царство победило. Пять королевств разбили мои армии, мои знамена горели от Мандера до Королевской дороги, а люди, маршировавшие под семиконечной звездой, теперь диктуют свой мир под моей собственной крышей. Они оставляют мне мой трон — наказанный король, на которого они могут указать, ценнее для них, чем мученик — но они забирают все остальное.\n\nБрак объявлен мерзостью, растворенной в глазах богов и людей. Мои дети названы непригодными для наследования, их кровь запятнана грехом. А Алисанна — Алисанна отдана Безмолвным Сестрам, чтобы искупить в сером бессловесии преступление любви ко мне. Сестры приходят за ней, пока септоны наблюдают, чтобы никто не мог сказать, что дракон скрыл свой грех.\n\nОна не плачет там, где ее видят. У двери она поворачивается и ничего не говорит, потому что ее молчание уже началось — но ее глаза говорят то, что ее язык, возможно, никогда больше не скажет: #italic это никогда не было грехом.#!\n\nЯ сжег Звездную сентябрь, и в ответ королевство сожгло весь мой мир.\n\n#bold Дракон по-прежнему правит — над пеплом всего, что он любил. #!"
 sotd_doctrine.0033.a:0 "Королевство судило. (Я потерял её.)"
