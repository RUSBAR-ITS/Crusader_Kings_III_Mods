l_russian:
 sotd_bloodfyre.0001.t:0 "Среброкрылая снесла яйцо"
 sotd_bloodfyre.0001.desc:0 "Алисанна возвращается от драконов: её юбки перепачканы сажей, а глаза сияют изумлением. Среброкрылая снесла единственное яйцо, ещё хранящее тепло её крыла.\n\nОно красное, но такого красного не встретишь ни в рубине, ни в гранате, ни на закате. Тёмная, словно влажная скорлупа почти чернеет на рёбрах чешуек и блестит при свете факелов, как свежепролитая жидкость. Даже смотрители драконов берут его в руки с опаской. Один бормочет, что оно цвета крови.\n\nИ всё же оно тёплое. Под моей ладонью что-то отзывается едва заметным биением."
 sotd_bloodfyre.0001.a:0 "Поместить его к другим яйцам королевских драконов."
 sotd_bloodfyre_egg_desc:0 "Тёмно-красное яйцо, отложенное Среброкрылой. Из него вылупится #bold Кровавое Пламя#!. Отдайте его ребёнку, которого хотите сделать всадником этого дракона."
