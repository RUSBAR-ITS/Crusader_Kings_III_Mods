l_russian:
 agot_bm_sotd:0 "Сыновья Дракона"
 agot_bm_sotd_desc:0 "48 год от З.Э. Мейгор Жестокий лежит мёртвым на Железном троне: его убило само сиденье, захваченное огнём и убийствами. Разорённое королевство переходит к четырнадцатилетнему мальчику — Джейхейрису Таргариену, который вернулся из укрытия на крыльях огромного бронзового дракона Вермитора, чтобы взять корону дяди.\n\nОн будет править не один. Его мать, вдовствующая королева Алисса Веларион, становится королевой-регентшей, а могучий Рогар Баратеон, лорд Штормового Предела, — Защитником королевства и Десницей короля. Вера открыто восстала, казна пуста, а великие лорды ждут, не сожжёт ли их ещё один дракон.\n\n#bold Сумеет ли юный дракон исцелить раны, оставленные Мейгором, примириться с Семерыми и начать долгое золотое правление Миротворца?#!"
 bookmark_sotd_jaehaerys:0 "Король Джейхейрис"
 bookmark_sotd_jaehaerys_desc:0 "[Concept( 'story_content_fab_jaehaerys', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_fab_jaehaerys', '$bm_story_content_available_copy|q$' )|E]\nДжейхейрису Таргариену всего четырнадцать, но Железный трон уже принадлежит ему. Жестокость его дяди Мейгора оставила королевство истекать кровью: Святое Воинство взялось за оружие, лорды колеблются, простой люд голодает. Мальчику-королю под сенью регентства предстоит найти способ исцелить раны разорённой страны.\n\n#bold Сумеет ли Джейхейрис стать величайшим королём в истории Семи Королевств?#!"
 bookmark_sotd_jaehaerys_subheading:0 "Юный король"
 bookmark_sotd_alysanne:0 "Алисанна Таргариен"
 bookmark_sotd_alysanne_subheading:0 "Сестра короля"
 bookmark_sotd_alyssa_velaryon:0 "Королева Алисса"
 bookmark_sotd_alyssa_velaryon_subheading:0 "Королева-регентша"
 bookmark_sotd_rogar_baratheon:0 "Лорд Рогар Баратеон"
 bookmark_sotd_rogar_baratheon_desc:0 "[Concept( 'story_content_fab_rogar', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_fab_rogar', '$bm_story_content_available_copy|q$' )|E]\nРогар Баратеон, лорд Штормового Предела, — крепкая опора регентства юного короля: Защитник королевства, Десница короля и вскоре супруг самой вдовствующей королевы. Честолюбец оказался ближе к трону, чем любой Баратеон со времён Ориса.\n\n#bold Будет ли лорд Рогар верно наставлять мальчика-короля или потянется за собственной короной?#!"
 bookmark_sotd_rogar_baratheon_subheading:0 "Защитник королевства"
 game_concept_story_content_fab_jaehaerys:0 "$game_concept_story_generic_prefix$ $bookmark_sotd_jaehaerys$"
 game_concept_story_content_fab_jaehaerys_desc:0 "#tooltip_heading Объём сюжета: большой#!\n\nИграя за Джейхейриса Таргариена, вы унаследуете королевство, разрушенное Мейгором. Сценарные события охватывают регентство и последовавшее за ним долгое правление: мир с Верой, Доктрину исключительности, брак с Алисанной, Дрожь, королевские поездки и судьбы детей, которые определят ваше наследие."
 game_concept_story_content_fab_rogar:0 "$game_concept_story_generic_prefix$ $bookmark_sotd_rogar_baratheon$"
 game_concept_story_content_fab_rogar_desc:0 "#tooltip_heading Объём сюжета: небольшой#!\n\nИграя за Рогара Баратеона, вы будете управлять королевством от имени мальчика-короля в должности Защитника и Десницы. Несколько сценарных событий посвящены регентству, вашему браку с вдовствующей королевой Алиссой и тому, как далеко заведут вас амбиции до совершеннолетия Джейхейриса."
