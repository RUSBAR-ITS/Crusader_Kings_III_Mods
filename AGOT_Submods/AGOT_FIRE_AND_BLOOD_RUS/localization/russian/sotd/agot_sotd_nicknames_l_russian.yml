l_russian:
 nick_sotd_the_boy_king:0 "Король-мальчик"
 nick_sotd_the_boy_king_desc:0 "[CHARACTER.GetFirstNameNoTooltip] получил корону в Звёздной септе в четырнадцать лет, когда его мать правила как королева-регентша, а лорд Рогар Баратеон был защитником государства. Во всех Семи Королевствах его знают как Короля-мальчика, но он намерен перерасти это прозвище."
 nick_sotd_the_justified:0 "Оправданный"
 nick_sotd_the_justified_desc:0 "После победы в Суде Семерых короля прозвали Джейхейрисом Оправданным: и боги, и люди признали его правоту."
 nick_sotd_the_forsaken:0 "Отверженный"
 nick_sotd_the_forsaken_desc:0 "[CHARACTER.GetFirstNameNoTooltip] предстал перед самими богами на Суде Семерых, и их приговор оказался не в его пользу. Семеро отвернулись от него; он лишился всего, что любил. Теперь его знают как Отверженного."
 nick_sotd_the_cruel:0 "Жестокий"
 nick_sotd_the_cruel_desc:0 "[CHARACTER.GetFirstNameNoTooltip] обрушил драконье пламя на Звёздную септу, величайшую святыню Семерых, и заживо сжёг в ней верховного септона. Как прежде его дядю Мейгора, королевство запомнит его Жестоким."
 nick_sotd_the_brave:0 "Храбрый"
 nick_sotd_the_brave_desc:0 "Ещё маленьким ребёнком [CHARACTER.GetFirstNameNoTooltip] ударил Балериона Чёрного Ужаса по морде и рассмеялся. Один из белых плащей сказал: это либо храбрец, либо безумец. Двор выбрал более доброе слово."
