l_russian:
 nick_sotd_the_boy_king:0 "Король-мальчик"
 nick_sotd_the_boy_king_desc:0 "Коронованный в Звездной сентябре в четыре и десять лет, когда его мать правила королевой-регентом, а лордом Рогаром Баратеоном — защитником королевства, [CHARACTER.GetShortUINameNoTooltipNoFormat] известен во всех Семи Королевствах как «Король-мальчик» — имя [CharYouSheHe(CHARACTER)] означает перерастание."
 nick_sotd_the_justified:0 "Оправданный"
 nick_sotd_the_justified_desc:0 "После победы в Суде Семерых короля прозвали Джейхейрисом Оправданным: и боги, и люди признали его правоту."
 nick_sotd_the_forsaken:0 "Отверженный"
 nick_sotd_the_forsaken_desc:0 "Самих богов попросили судить [CHARACTER.GetShortUINameNoTooltipNoFormat] в Испытании Семи, и боги судили [CharYouHerHim(CHARACTER)]. Покинутый Семерыми и лишенный всего, что любил [CharYouSheHe(CHARACTER)], [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)], известный как «Отрекшиеся»."
 nick_sotd_the_cruel:0 "Жестокий"
 nick_sotd_the_cruel_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] обрушил драконий огонь на Звездную септу, самый священный дом Семи, и заживо сжег Верховного септона внутри нее. Подобно дяде [CharYourHerHis(CHARACTER)] Мейгору до [CharYouHerHim(CHARACTER)], королевство запомнит [CharYouHerHim(CHARACTER)] как «Жестокого»."
 nick_sotd_the_brave:0 "Храбрый"
 nick_sotd_the_brave_desc:0 "В раннем детстве [CHARACTER.GetShortUINameNoTooltipNoFormat] ударил Балериона Чёрного Ужаса по морде и рассмеялся. Белый плащ назвал [CharYouHerHim(CHARACTER)] храбрецом или безумцем, и двор выбрал более доброе слово."
