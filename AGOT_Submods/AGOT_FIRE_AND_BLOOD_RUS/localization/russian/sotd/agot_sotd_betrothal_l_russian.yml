l_russian:
 fab_betrothal.0001.t:0 "Невеста для принца"
 fab_betrothal.0001.desc:0 "Мой сын растёт быстрее, чем я успеваю осознать. Кажется, ещё вчера [aemon.GetFirstName] цеплялся за материнские юбки в детской, а теперь держится в седле, как взрослый мужчина, и мастер над оружием уверяет, что запястья мальчика уже крепче его собственных. Скоро королевство посмотрит на моего наследника и задаст вечный вопрос о любом принце: кто станет его невестой?\n\nЛеди Джоселин Баратеон — последняя дочь моей матери, родившаяся в Штормовом Пределе в тот самый час, когда Алисса умерла при родах. Моя единоутробная сестра, если мейстерам нужны точные слова, и, стало быть, тётка мальчика. Септоны подожмут губы, как поджимали их при моём собственном бракосочетании. Но Джоселин с колыбели росла рядом с моими детьми, и во всех Семи Королевствах я не знаю более отважного и верного сердца. Черноволосая, высокая не по годам, она могла бы наконец соединить бурю и дракона.\n\nИли я могу поискать в другом месте. У великих домов достаточно дочерей, и каждый из их лордов отдал бы правую руку, лишь бы увидеть свою кровь рядом с Железным троном."
 fab_betrothal.0001.desc.spare:0 "Мой сын растёт быстрее, чем я успеваю осознать. Кажется, ещё вчера [aemon.GetFirstName] цеплялся за материнские юбки в детской, а теперь держится в седле, как взрослый мужчина, и мастер над оружием уверяет, что запястья мальчика уже крепче его собственных. Возможно, престол достанется не Эймону, но принцу крови всё равно нужна невеста.\n\nЛеди Джоселин Баратеон — последняя дочь моей матери, родившаяся в Штормовом Пределе в тот самый час, когда Алисса умерла при родах. Моя единоутробная сестра, если мейстерам нужны точные слова, и, стало быть, тётка мальчика. Септоны подожмут губы, как поджимали их при моём собственном бракосочетании. Но Джоселин с колыбели росла рядом с моими детьми, и во всех Семи Королевствах я не знаю более отважного и верного сердца. Черноволосая, высокая не по годам, она могла бы наконец соединить бурю и дракона.\n\nИли я могу поискать в другом месте. У великих домов достаточно дочерей, а брак принца — монета, которую стоит потратить на верность одного из лордов."
 fab_betrothal.0001.a:0 "Леди Джоселин будет его невестой."
 fab_betrothal.0001.a.tt:0 "Принц [aemon.GetFirstName] будет обручён с леди [fab_jocelyn.GetFirstName] Баратеон. Запреты Веры не властны над кровью дракона."
 fab_betrothal.0001.b:0 "Мы найдём союзы с другими домами."
 fab_betrothal.0001.b.tt:0 "Принц остаётся свободен заключить брак, который принесёт королевству наибольшую пользу. Помолвки не будет."
 fab_betrothal.0002.t:0 "Буря и дракон"
 fab_betrothal.0002.desc:0 "Это сделано и объявлено перед судом. Мой сын и леди Джоселин стоят вместе под Железным Троном, пока глашатай зачитывает помолвку, и если кто-то из них чувствует какие-то опасения, ни один из них не показывает этого. Девушка одета в черное и красное — буря, задрапированная цветами дракона, — и половина зала тут же влюбляется в нее.\n\nСептоны могут бормотать о степени родства; мой Дом никогда не просил у них разрешения по таким вопросам, и королевство становится сильнее с каждой связью, связывающей Штормовой Предел с Железным Троном.\n\nОни поженятся, когда вырастут. А до тех пор они, возможно, еще какое-то время будут детьми."
 fab_betrothal.0002.a:0 "Пусть их дни вместе будут долгими."
 fab_betrothal.0003.t:0 "Пора исполнить обещание"
 fab_betrothal.0003.desc.heir:0 "У моего сына наступили шестнадцатые именины. Мальчик, который когда-то гонялся за тенями драконов по этим коридорам, теперь стоит передо мной, взрослый мужчина с широкими плечами и твердым взглядом. Поскольку его детство закончилось, обещание, которое я дал ему, должно быть выполнено.\n\nДжоселин стала не менее достойна его. Черноволосая девушка из Штормового Предела жестока в своей преданности и не подчиняется слухам, которые следуют за их родством. Она годами выполняла обещание Эймона; ни одного из них нельзя заставлять ждать дольше.\n\nЖенитьба человека, который должен следовать за мной на Железном Троне, не является частным делом. Царство станет свидетелем того, как шторм объединится с драконом, и будет знать, что будущее моего Дома в безопасности."
 fab_betrothal.0003.desc.prince:0 "У моего сына наступили шестнадцатые именины. Мальчик, который когда-то гонялся за тенями драконов по этим коридорам, теперь стоит передо мной, взрослый мужчина с широкими плечами и твердым взглядом. Поскольку его детство закончилось, обещание, которое я дал ему, должно быть выполнено.\n\nДжоселин стала не менее достойна его. Черноволосая девушка из Штормового Предела жестока в своей преданности и не подчиняется слухам, которые следуют за их родством. Она годами выполняла обещание Эймона; ни одного из них нельзя заставлять ждать дольше.\n\nНаследство может привести к чему-то другому, но Эймон останется моим сыном и принцем крови. Его свадьба будет почтита перед всем королевством со всем достоинством, причитающимся дому Таргариенов."
 fab_betrothal.0003.a:0 "Пусть свадьба будет объявлена."
 fab_betrothal.0003.a.tt:0 "Принц [aemon.GetFirstName] и леди [fab_jocelyn.GetFirstName] будут обвенчаны перед двором."
 fab_betrothal.0004.t:0 "Буря и дракон, соединённые"
 fab_betrothal.0004.desc.heir:0 "Колокола начинаются на рассвете и не умолкают, пока Эймон и Джоселин не предстанут вместе перед Семерыми. Каждая скамейка заполнена, каждая галерея переполнена, а суд наблюдает, как мой сын берет мою сестру за руку и произносит клятвы, впервые обещанные им в детстве.\n\nЭймон накидывает на плечи Джоселин черно-красный плащ. На мгновение я вижу их не как фигуры на игровом поле, а просто как двух детей моего Дома, за которыми я наблюдаю.\n\nОднако королевство видит больше. В Эймоне он видит человека, который последует за мной; в Джоселин, женщине, которая будет стоять рядом с ним. Шторм и дракон соединяются, и линия Железного Трона для них становится сильнее."
 fab_betrothal.0004.desc.prince:0 "Колокола начинаются на рассвете и не умолкают, пока Эймон и Джоселин не предстанут вместе перед Семерыми. Каждая скамейка заполнена, каждая галерея переполнена, а суд наблюдает, как мой сын берет мою сестру за руку и произносит клятвы, впервые обещанные им в детстве.\n\nЭймон накидывает на плечи Джоселин черно-красный плащ. На мгновение я вижу их не как фигуры на игровом поле, а просто как двух детей моего Дома, за которыми я наблюдаю.\n\nКакое бы место наследие ни предоставило Эймону, сегодня он мой сын, принц Дома Таргариенов и муж. Шторм и дракон наконец-то объединились, и наш Дом стал сильнее связи."
 fab_betrothal.0004.a:0 "Пусть буря и дракон процветают вместе."
