l_russian:
 fab_betrothal.0001.t:0 "Невеста для принца"
 fab_betrothal.0001.desc:0 "Мой сын растёт быстрее, чем я успеваю осознать. Кажется, ещё вчера [aemon.GetFirstName] цеплялся за материнские юбки в детской, а теперь держится в седле, как взрослый мужчина, и мастер над оружием уверяет, что запястья мальчика уже крепче его собственных. Скоро королевство посмотрит на моего наследника и задаст вечный вопрос о любом принце: кто станет его невестой?\n\nЛеди Джоселин Баратеон — последняя дочь моей матери, родившаяся в Штормовом Пределе в тот самый час, когда Алисса умерла при родах. Моя единоутробная сестра, если мейстерам нужны точные слова, и, стало быть, тётка мальчика. Септоны подожмут губы, как поджимали их при моём собственном бракосочетании. Но Джоселин с колыбели росла рядом с моими детьми, и во всех Семи Королевствах я не знаю более отважного и верного сердца. Черноволосая, высокая не по годам, она могла бы наконец соединить бурю и дракона.\n\nИли я могу поискать в другом месте. У великих домов достаточно дочерей, и каждый из их лордов отдал бы правую руку, лишь бы увидеть свою кровь рядом с Железным троном."
 fab_betrothal.0001.desc.spare:0 "Мой сын растёт быстрее, чем я успеваю осознать. Кажется, ещё вчера [aemon.GetFirstName] цеплялся за материнские юбки в детской, а теперь держится в седле, как взрослый мужчина, и мастер над оружием уверяет, что запястья мальчика уже крепче его собственных. Возможно, престол достанется не Эймону, но принцу крови всё равно нужна невеста.\n\nЛеди Джоселин Баратеон — последняя дочь моей матери, родившаяся в Штормовом Пределе в тот самый час, когда Алисса умерла при родах. Моя единоутробная сестра, если мейстерам нужны точные слова, и, стало быть, тётка мальчика. Септоны подожмут губы, как поджимали их при моём собственном бракосочетании. Но Джоселин с колыбели росла рядом с моими детьми, и во всех Семи Королевствах я не знаю более отважного и верного сердца. Черноволосая, высокая не по годам, она могла бы наконец соединить бурю и дракона.\n\nИли я могу поискать в другом месте. У великих домов достаточно дочерей, а брак принца — монета, которую стоит потратить на верность одного из лордов."
 fab_betrothal.0001.a:0 "Леди Джоселин будет его невестой."
 fab_betrothal.0001.a.tt:0 "Будут обручены принц [aemon.GetFirstName] и леди [fab_jocelyn.GetFirstName] Баратеон. Запреты Веры не властны над кровью дракона."
 fab_betrothal.0001.b:0 "Мы найдём союзы с другими домами."
 fab_betrothal.0001.b.tt:0 "Принц остаётся свободен заключить брак, который принесёт королевству наибольшую пользу. Помолвки не будет."
 fab_betrothal.0002.t:0 "Буря и дракон"
 fab_betrothal.0002.desc:0 "Решено и объявлено при дворе. Мой сын и леди Джоселин стоят вместе у Железного трона, пока глашатай провозглашает помолвку. Если кто-то из них и тревожится, виду не подаёт. Девушка в чёрном и красном — буря в цветах дракона — сразу покоряет половину зала.\n\nПусть септоны шепчутся о степенях родства. Мой дом никогда не спрашивал их дозволения в таких делах. Каждая связь Штормового Предела с Железным троном укрепляет королевство.\n\nОни поженятся, когда вырастут. А пока пусть ещё немного побудут детьми."
 fab_betrothal.0002.a:0 "Пусть их совместная жизнь будет долгой."
 fab_betrothal.0003.t:0 "Пора исполнить обещание"
 fab_betrothal.0003.desc.heir:0 "Наступили шестнадцатые именины моего сына. Мальчик, некогда гонявшийся за тенями драконов по этим залам, стоит передо мной взрослым мужчиной — широкоплечим, с твёрдым взглядом. Детство кончилось, и пора исполнить обещание, данное за него.\n\nДжоселин выросла достойной ему парой. Черноволосая девушка из Штормового Предела преданна до конца, и шепотки об их родстве её не смущают. Она уже много лет наречённая Эймона. Ни одному из них не стоит ждать дольше.\n\nБрак того, кто сменит меня на Железном троне, — дело всей державы. Пусть королевство увидит союз бури с драконом и убедится: будущее моего дома надёжно."
 fab_betrothal.0003.desc.prince:0 "Наступили шестнадцатые именины моего сына. Мальчик, некогда гонявшийся за тенями драконов по этим залам, стоит передо мной взрослым мужчиной — широкоплечим, с твёрдым взглядом. Детство кончилось, и пора исполнить обещание, данное за него.\n\nДжоселин выросла достойной ему парой. Черноволосая девушка из Штормового Предела преданна до конца, и шепотки об их родстве её не смущают. Она уже много лет наречённая Эймона. Ни одному из них не стоит ждать дольше.\n\nПрестол может достаться другому, но Эймон остаётся моим сыном и принцем крови. Королевство отпразднует его свадьбу со всеми почестями, подобающими дому Таргариенов."
 fab_betrothal.0003.a:0 "Пусть свадьба будет объявлена."
 fab_betrothal.0003.a.tt:0 "Принц [aemon.GetFirstName] и леди [fab_jocelyn.GetFirstName] будут обвенчаны перед двором."
 fab_betrothal.0004.t:0 "Союз бури и дракона"
 fab_betrothal.0004.desc.heir:0 "Колокола звонят с рассвета и умолкают лишь тогда, когда Эймон и Джоселин вместе предстают перед Семерыми. Все скамьи заняты, галереи переполнены. Двор смотрит, как мой сын берёт мою сестру за руку и произносит клятвы, обещанные за них ещё в детстве.\n\nЭймон набрасывает на плечи Джоселин чёрно-красный плащ. На миг я вижу в них не фигуры на доске королевства, а двух детей своего дома, выросших у меня на глазах.\n\nНо королевство видит больше. В Эймоне — моего преемника, в Джоселин — женщину, которая встанет рядом с ним. Буря и дракон соединились, укрепив род Железного трона."
 fab_betrothal.0004.desc.prince:0 "Колокола звонят с рассвета и умолкают лишь тогда, когда Эймон и Джоселин вместе предстают перед Семерыми. Все скамьи заняты, галереи переполнены. Двор смотрит, как мой сын берёт мою сестру за руку и произносит клятвы, обещанные за них ещё в детстве.\n\nЭймон набрасывает на плечи Джоселин чёрно-красный плащ. На миг я вижу в них не фигуры на доске королевства, а двух детей своего дома, выросших у меня на глазах.\n\nКакое бы место ни занимал Эймон в порядке наследования, сегодня он мой сын, принц дома Таргариенов и муж. Буря и дракон наконец соединились, и этот союз сделал наш дом сильнее."
 fab_betrothal.0004.a:0 "Пусть буря и дракон процветают вместе."
