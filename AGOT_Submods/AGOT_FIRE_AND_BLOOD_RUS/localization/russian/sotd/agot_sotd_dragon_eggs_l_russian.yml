l_russian:
 sotd_egg_caraxes_desc:0 "Красное яйцо. Из него вылупится #bold Караксес#!, известный как Кровавый Змей. Отдайте его ребёнку, которого хотите сделать его всадником."
 sotd_egg_sheepstealer_desc:0 "Коричневое яйцо. Из него вылупится #bold Овцекрад#!, дикий дракон Драконьего Камня. Отдайте его ребёнку, которого хотите сделать его всадником."
 sotd_egg_laengar_desc:0 "Оранжевое яйцо. Из него вылупится #bold Лейнгар#!, дракон из кладок Драконьего Камня. Отдайте его ребёнку, которого хотите сделать его всадником."
 sotd_egg_moonfyre_desc:0 "Тёмно-фиолетовое яйцо. Из него вылупится #bold Лунный Огонь#!, дракон из кладок Драконьего Камня. Отдайте его ребёнку, которого хотите сделать его всадником."
 sotd_egg_adereon_desc:0 "Зелёное яйцо. Из него вылупится #bold Адереон#!, дракон из кладок Драконьего Камня. Отдайте его ребёнку, которого хотите сделать его всадником."
 sotd_egg_stolen_black_desc:0 "Чёрное яйцо — одно из трёх, похищенных Элиссой Фарман с Драконьего Камня в 54 году от З.Э. Отдайте его ребёнку, которого хотите сделать всадником будущего дракона."
 sotd_egg_stolen_green_desc:0 "Зелёное яйцо — одно из трёх, похищенных Элиссой Фарман с Драконьего Камня в 54 году от З.Э. Отдайте его ребёнку, которого хотите сделать всадником будущего дракона."
 sotd_egg_stolen_white_desc:0 "Кремово-золотистое яйцо — одно из трёх, похищенных Элиссой Фарман с Драконьего Камня в 54 году от З.Э. Отдайте его ребёнку, которого хотите сделать всадником будущего дракона."
