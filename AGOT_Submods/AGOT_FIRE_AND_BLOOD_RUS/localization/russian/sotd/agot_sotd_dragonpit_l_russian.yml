 sotd_dragonpit.0001.t:0 "Драконье Логово возведено"
 sotd_dragonpit.0001.desc:0 "Это закончено. Там, где когда-то стояла в пепле сентябрь Воспоминаний на холме Рейнис, теперь возвышается самое могущественное сооружение во всей Королевской Гавани — Драконье Логово, огромный купол из камня и железа шириной в семь акров, его бронзовые двери достаточно высоки, чтобы впустить дракона в полете. На его создание ушли годы труда и королевское состояние в золоте, и теперь у великих зверей моего дома есть зал, достойный их.\n\nСо стен Красного замка я вижу, как он венчает город, и тысячи простых людей собираются, чтобы подивиться. Весь мир увидит силу и славу Дома Таргариенов, воплощенные в камне. Столь грандиозное событие не должно пройти незамеченным — в честь этого королевства будет организован грандиозный турнир, подобного которому не было со времен моего деда.\n\n#bold У драконов есть яма. Теперь пусть лорды придут и сломают свои копья в его тени. #!"
 sotd_dragonpit.0001.a:0 "Объявить грандиозный турнир!"
 sotd_dragonpit.0001.b:0 "Славный день — пусть его отметят скромно."
 sotd_dragonpit.0002.t:0 "Ристалище под куполом"
 sotd_dragonpit.0002.desc:0 "Лорд Манфрид Редвин, мой капитан кораблей, оказался столь же искусным в организации праздников, как и в управлении флотом. По его настоянию завершение строительства Драконьего Логова должно быть ознаменовано турниром, достойным чуда, которое оно чтит.\n\nСписки возвышаются под огромным куполом. Ни один дракон еще не поселился в яме, и поэтому обширная полость из камня и бронзы становится полем знамен, галерей, песка, барьеров и кричащих людей. Лорды прибывают со своей свитой, фрирайдеры с полными надеждами и странствующие рыцари в сверкающих доспехах, чтобы получить еще один шанс на славу.\n\nЯ занимаю свое место над полем, Алисанна рядом со мной. Другие могут сломать копья и кости. Королю нужно только наблюдать, судить и помнить, кто сияет, когда на него смотрит все королевство.\n\n#bold Драконье Логово открыта. Турнир начинается. #!"
 sotd_dragonpit.0002.a:0 "Пусть начнутся первые состязания."
 sotd_dragonpit.0003.t:0 "Лавры оруженосца"
 sotd_dragonpit.0003.desc:0 "Оруженосцы едут первыми, все с длинными конечностями, позаимствованными доспехами и свирепой молодой гордостью. Не один мальчик забывает свои поводья, когда толпа ревет; многие узнают, лежа на спине в песке, что у славы есть твердая грань.\n\nРикард Редвин не забывает. Он едет так, как будто шум Драконьего Логова — это всего лишь ветер, аккуратно преодолевая каждый наклон, опуская копье на ровном вдохе и отправляя кувыркающихся перед собой мальчиков из более благородного происхождения. На последнем пасе даже закаленные рыцари кивают друг другу.\n\nКогда он становится передо мной на колени, запыленный, покрасневший и стараясь не ухмыляться, я вытаскиваю сталь и прикасаюсь ею к его плечам. Купол несет мои слова, пока их не услышит каждая галерея.\n\n#bold Восстание, сир Рикард Редвин. Вы заслужили свои стимулы. #!"
 sotd_dragonpit.0003.a:0 "Хорошее начало."
 sotd_dragonpit.0004.t:0 "Королева, которую он выбрал"
 sotd_dragonpit.0004.desc:0 "Турнир принадлежит сиру Саймону Дондарриону из Блэкхейвена.\n\nСир Роберт Редвин устраивает ему великолепное состязание, а другие заставляют его работать еще усерднее, но Саймон становится только умнее с каждым сломанным копьем. Он улыбается простым людям, кланяется дамам и скачет верхом, как песня, воплощенная в жизнь. На последнем наклоне люди скандируют его имя, а сама Алисанна смеется, спрятав руку.\n\nЗатем наступает выбор, который должны сделать все чемпионы. Симон берет венок из цветов, поворачивается под грохот купола и возлагает его перед юной княгиней в царской галерее.\n\n#bold Драконье Логово сотрясается от аплодисментов. Даже Алисанна победила. #!"
 sotd_dragonpit.0004.a:0 "Победитель, умеющий быть великодушным."
 sotd_dragonpit.0005.t:0 "Семьдесят семь рыцарей"
 sotd_dragonpit.0005.desc:0 "Великая схватка слишком велика для любого поля в городе, поэтому ее принимает пустая Драконье Логово.\n\nСемьдесят семь рыцарей разделены на одиннадцать команд. Сначала они садятся верхом, кружатся под куполом в цветах, ярких, как драконье пламя, а затем сталкиваются со звуком, похожим на звук падения сторожки. Мужчины падают. Лошади кричат. Затупленное оружие поднимается и опускается, а пешие сражаются пешком, пока не останется одна команда.\n\nАлисанна запрещает Джонкил Дарк и Тому Страммеру присоединяться к ним, но ни один из них не принимает команду доброжелательно. Я не могу винить ее. Это спорт только из вежливости. Из королевской галереи это очень похоже на войну.\n\n#bold Последняя выжившая команда все равно должна обратиться против себя. Только один рыцарь может покинуть чемпиона. #!"
 sotd_dragonpit.0005.a:0 "Остановите состязание, пока Логово не впитало слишком много крови."
 sotd_dragonpit.0006.t:0 "Похотливый остаётся один"
 sotd_dragonpit.0006.desc:0 "В конце концов, песок под Драконьей Ямой превращается в красную грязь.\n\nБоррис, Гарон и Роннал Баратеон жестоко отчитываются о себе. Харис Хогг, Алин Баллок, Уиллам Стаффорд, Гайл Хитрый и Аластор Рейн также оставляют свой след. Двое мужчин мертвы еще до того, как прозвучат рожки, и более двух десятков человек уносят или помогают с поля боя.\n\nИ все же, когда последний щит расколот и последний рыцарь сдается, сир Лукамор Стронг остается стоять. Его шлем помят, пальто порвано, а ухмылка совершенно нераскаянная, когда толпа называет его чемпионом ближнего боя.\n\n#bold Драконье Логово увидела свою первую кровь, и королевство будет говорить об этом дне еще долгие годы. #!"
 sotd_dragonpit.0006.a:0 "Короновать чемпиона. Затем послать за мейстерами."
 sotd_dragonpit.0010.t:0 "Монета для каменщиков"
 sotd_dragonpit.0010.desc:0 "Прошло восемь месяцев великих работ на холме Рейнис, и первая истина строительства объявила себя: камень дешев, а люди, которые его лепят, — нет. Магистр гильдии каменщиков предстает перед троном с кепкой буквально в руке, чтобы сообщить, что монета, отложенная на фундамент, иссякла раньше, чем сам фундамент, и что половина его лучших людей уходит, чтобы облегчить работу в купеческих особняках.\n\nРабота не остановится, спешит добавить он. Это будет просто... медленно. Если, конечно, корона не пожелает открыть свой кошелек немного шире, и в этом случае он мог бы разместить еще триста человек на холме к новолунию, работая в две смены при свете факелов.\n\n#bold Каждое великое дело съедает золото. Вопрос только в том, как быстро я хочу, чтобы оно съелось. #!"
 sotd_dragonpit.0010.a:0 "Открыть кошелёк. Ещё триста человек к новолунию."
 sotd_dragonpit.0010.b:0 "Корона — не бездонный кошелёк. Потребуется столько времени, сколько потребуется."
 sotd_dragonpit.0011.t:0 "Лисенийский мастер-строитель"
 sotd_dragonpit.0011.desc:0 "Корабль из Лиса привёз ко двору любопытного гостя: мастера-строителя, называющего себя потомком каменщиков древней Валирии. Он слышал — кажется, об этом слышал уже весь мир, — что король-дракон возводит на холме огромный купол. По его словам, он без приглашения изучил чертежи в конторе начальника порта и нашёл их «восхитительными для андальской работы».\n\nЗатем он разворачивает собственные чертежи: подъёмные краны невиданного нашими каменщиками устройства, леса, растущие вместе со стенами, и способ возвести рёбра купола вдвое быстрее. Септоны бормочут о валирийском колдовстве; мой собственный строитель куда громче ворчит о заморских стервятниках. Но я посмотрел чертежи, и они #italic лучше#!.\n\n#bold Гений дорого просит. Всё же он обходится дешевле бездарности.#!"
 sotd_dragonpit.0011.a:0 "Нанять его. Пусть септоны бормочут."
 sotd_dragonpit.0011.b:0 "Вестеросский камень будет возведён вестеросскими руками."
 sotd_dragonpit.0012.t:0 "Камень из более глубоких каменоломен"
 sotd_dragonpit.0012.desc:0 "Огромные ребра купола теперь возвышаются над небом, и весь город вытягивает к ним шею — но стены под ним поедают камень быстрее, чем каменоломни Коронленда могут его разрезать. Мастер работ предлагает мне арифметику: при нынешних темпах поставок работа будет тянуться еще долгие годы, а лучшие каменщики королевства будут простаивать между загрузками барж.\n\nИли: корона арендует флот каменных барж, которые день и ночь курсируют из глубоких карьеров вдоль побережья, и поток камня увеличивается вдвое. Корабли есть у начальников портов. Камень у карьеристов. Единственное, чего не хватает, как всегда, — это золота.\n\n#bold Я могу увидеть его законченным со стен моей крепости — если я готов заплатить, чтобы увидеть его раньше. #!"
 sotd_dragonpit.0012.a:0 "Купить баржи. Я хочу видеть купол завершённым в моём расцвете."
 sotd_dragonpit.0012.b:0 "Камень будет приходить так, как приходит."
 sotd_dragonpit.0013.t:0 "С опережением графика"
 sotd_dragonpit.0013.desc:0 "Мастер работ предстает перед троном с выражением человека, который едва верит своим бухгалтерским книгам: великая работа на Холме Рейнис почти завершена — на #bold лет раньше всех прогнозов#!.\n\nЦарское золото принесло свои плоды. Дополнительные бригады, иностранные краны, каменный флот барж — каждая покупка питала следующую, пока холм не кишел, как пнутый муравейник, от первого рассвета до последнего факела. Пока он говорит, устанавливается последняя пластина купола; большие бронзовые двери подвешены; кузнецы полируют петли.\n\n#bold Они сказали, что это займет большую часть десятилетия. Золото, потраченное с пользой, — это время. #!"
 sotd_dragonpit.0013.a:0 "Тогда откроем двери."
 great_project_type_sotd_great_dragonpit:0 "Драконье Логово"
 great_project_type_sotd_great_dragonpit_desc:0 "Величайшее сооружение, когда-либо возведенное в Королевской Гавани: колоссальный купол из камня и железа на холме Рейнис, под которым можно разместить, укрыть и приручить драконов Дома Таргариенов. Его строительство — дело многих лет и королевское состояние в золоте."
 sotd_great_dragonpit_location_tt:0 "Можно возвести только на холме Рейнис в Королевской Гавани."
 sotd_great_dragonpit_not_already_built_tt:0 "Великое Драконье Логово здесь ещё не построено."
 great_project_type_sotd_great_dragonpit_contribution_foundations:0 "Основание"
 great_project_type_sotd_great_dragonpit_contribution_the_walls:0 "Стены"
 great_project_type_sotd_great_dragonpit_contribution_the_great_dome:0 "Великий купол"
