 sotd_dragonpit.0001.t:0 "Драконье Логово возведено"
 sotd_dragonpit.0001.desc:0 "Строительство закончено. Там, где на холме Рейнис лежал пепел септы Поминовения, поднялось величайшее сооружение Королевской Гавани — Драконье Логово. Огромный каменно-железный купол накрывает семь акров; бронзовые двери так высоки, что дракон может влететь в них на расправленных крыльях. На него ушли годы труда и королевское состояние. Теперь у великих чудовищ моего дома есть достойные их чертоги.\n\nСо стен Красного замка я вижу, как оно венчает город. Тысячи простолюдинов собираются полюбоваться. Весь мир увидит могущество и славу Таргариенов, воплощённые в камне. Такое нельзя оставить без праздника: королевство получит большой турнир, подобного которому не было со времён моего деда.\n\n#bold Драконы получили своё логово. Пусть теперь лорды съедутся ломать копья в его тени.#!"
 sotd_dragonpit.0001.a:0 "Объявить грандиозный турнир!"
 sotd_dragonpit.0001.b:0 "Славный день — пусть его отметят скромно."
 sotd_dragonpit.0002.t:0 "Ристалище под куполом"
 sotd_dragonpit.0002.desc:0 "Лорд Манфрид Редвин, мой мастер над кораблями, оказался столь же искусен в празднествах, как и во флотских делах. По его совету завершение Драконьего Логова отметят турниром, достойным этого чуда.\n\nРисталище устроено под самим огромным куполом. Драконы ещё не поселились в Логове, и пустые каменно-бронзовые чертоги заполняют знамёна, трибуны, песок, барьеры и людской гомон. Лорды приезжают со свитами, вольные всадники — с сияющими надеждами, межевые рыцари — в начищенных доспехах, ради ещё одного шанса на славу.\n\nЯ занимаю место над ристалищем, рядом с Алисанной. Пусть другие ломают копья и кости. Королю довольно наблюдать, судить и запоминать, кто блистает перед взорами всего королевства.\n\n#bold Драконье Логово открыто. Турнир начинается.#!"
 sotd_dragonpit.0002.a:0 "Пусть начнутся первые состязания."
 sotd_dragonpit.0003.t:0 "Лавры оруженосца"
 sotd_dragonpit.0003.desc:0 "Первыми выезжают оруженосцы — долговязые, в чужих доспехах, с горячей юношеской гордостью. Не один мальчишка забывает о поводьях под рёв толпы. Не один, растянувшись спиной на песке, узнаёт, как больно ранит слава.\n\nРикард Редвин ничего не забывает. Он скачет, словно гул Драконьего Логова — лишь шум ветра: уверенно проводит каждый заезд, вовремя опускает копьё и выбивает из седла юношей знатнее себя. К последнему заезду даже закалённые рыцари одобрительно переглядываются.\n\nОн преклоняет передо мной колени — пыльный, раскрасневшийся, едва сдерживающий улыбку. Я обнажаю меч и касаюсь его плеч. Купол разносит мои слова по всем трибунам.\n\n#bold Встаньте, сир Рикард Редвин. Вы заслужили рыцарские шпоры.#!"
 sotd_dragonpit.0003.a:0 "Хорошее начало."
 sotd_dragonpit.0004.t:0 "Королева, которую он выбрал"
 sotd_dragonpit.0004.desc:0 "В поединках на копьях побеждает сир Саймон Дондаррион из Чёрного Приюта.\n\nСир Роберт Редвин оказывает достойное сопротивление, другие заставляют потрудиться ещё сильнее. Но с каждым сломанным копьём Саймон лишь ярче блистает. Он улыбается простому народу, кланяется дамам и скачет, словно герой ожившей песни. К последнему заезду толпа скандирует его имя, а сама Алисанна смеётся, прикрыв рот ладонью.\n\nЗатем настает выбор, который должен сделать каждый победитель. Саймон берёт цветочный венок, разворачивается под грохочущим куполом и кладёт его перед юной принцессой в королевской галерее.\n\n#bold Драконье Логово сотрясается от приветственных криков. Даже Алисанна очарована.#!"
 sotd_dragonpit.0004.a:0 "Какой учтивый победитель."
 sotd_dragonpit.0005.t:0 "Семьдесят семь рыцарей"
 sotd_dragonpit.0005.desc:0 "Для общей схватки не хватает места ни на одном городском ристалище. Её принимает пустое Драконье Логово.\n\nСемьдесят семь рыцарей делятся на одиннадцать команд. Вначале они верхом кружат под куполом в цветах, ярких, как драконье пламя, а затем сталкиваются с грохотом рушащейся надвратной башни. Люди падают. Лошади визжат. Тупое оружие взлетает и опускается; выбитые из седла продолжают бой пешими, пока не остаётся одна команда.\n\nАлисанна запрещает участвовать Джонквиль Дарк и Тому Бренчальщику. Оба недовольны, но я не могу винить королеву. Состязанием это можно назвать разве что из учтивости. Из королевской галереи оно очень похоже на войну.\n\n#bold Последней команде ещё предстоит сразиться между собой. Победителем выйдет лишь один рыцарь.#!"
 sotd_dragonpit.0005.a:0 "Остановите состязание, пока Логово не впитало слишком много крови."
 sotd_dragonpit.0006.t:0 "Любострастник остаётся последним"
 sotd_dragonpit.0006.desc:0 "Под конец песок Драконьего Логова взбит в красную грязь.\n\nБоррис, Гарон и Роннал Баратеоны жестоко показывают, на что способны. Харис Хогг, Алин Баллок, Уиллам Стаффорд, Гайл Хитрый и Аластор Рейн тоже оставляют свой след. Ещё до финального сигнала двое убиты. Больше сорока человек выносят с поля или помогают им уйти.\n\nНо когда расколот последний щит и последний рыцарь сдаётся, на ногах остаётся сир Лукамор Стронг. Шлем помят, сюрко разорвано; в широкой улыбке нет ни тени раскаяния, пока толпа славит победителя общей схватки.\n\n#bold Драконье Логово увидело первую кровь. Королевство ещё долго будет говорить об этом дне.#!"
 sotd_dragonpit.0006.a:0 "Увенчайте победителя. Потом позовите мейстеров."
 sotd_dragonpit.0010.t:0 "Монета для каменщиков"
 sotd_dragonpit.0010.desc:0 "Восемь месяцев идёт великая стройка на холме Рейнис. Уже открылась первая строительная истина: камень дёшев, а труд каменотёсов — нет. Глава гильдии каменщиков явился к трону, с шапкой в руках. Деньги на фундамент иссякли, пока сам фундамент ещё не успел высохнуть. Половина лучших мастеров уходит на более лёгкую работу — строить купеческие особняки.\n\nРабота не остановится, спешит добавить он. Просто... замедлится. Если, конечно, корона не раскроет кошель пошире. Тогда к новолунию он приведёт на холм ещё триста работников, и те будут трудиться в две смены, при свете факелов.\n\n#bold Любая великая стройка пожирает золото. Вопрос лишь в том, как быстро я готов его скармливать.#!"
 sotd_dragonpit.0010.a:0 "Открыть кошелёк. Ещё триста человек к новолунию."
 sotd_dragonpit.0010.b:0 "Корона — не бездонный кошелёк. Потребуется столько времени, сколько потребуется."
 sotd_dragonpit.0011.t:0 "Лисенийский мастер-строитель"
 sotd_dragonpit.0011.desc:0 "Корабль из Лиса привёз ко двору любопытного гостя: мастера-строителя, называющего себя потомком каменщиков древней Валирии. Он слышал — кажется, об этом слышал уже весь мир, — что король-дракон возводит на холме огромный купол. По его словам, он без приглашения изучил чертежи в конторе начальника порта и нашёл их «восхитительными для андальской работы».\n\nЗатем он разворачивает собственные чертежи: подъёмные краны невиданного нашими каменщиками устройства, леса, растущие вместе со стенами, и способ возвести рёбра купола вдвое быстрее. Септоны бормочут о валирийском колдовстве; мой собственный строитель куда громче ворчит о заморских стервятниках. Но я посмотрел чертежи, и они #italic лучше#!.\n\n#bold Гений дорого просит. Всё же он обходится дешевле бездарности.#!"
 sotd_dragonpit.0011.a:0 "Нанять его. Пусть септоны бормочут."
 sotd_dragonpit.0011.b:0 "Вестеросский камень будет возведён вестеросскими руками."
 sotd_dragonpit.0012.t:0 "Камень из более глубоких каменоломен"
 sotd_dragonpit.0012.desc:0 "Огромные рёбра купола уже чертят небо, и весь город задирает головы, глядя на них. Но стены под ними поглощают камень быстрее, чем его успевают добывать каменоломни Королевских земель. Главный строитель предъявляет расчёты: при нынешних поставках работы растянутся ещё на годы, а лучшие каменщики державы будут простаивать между прибытием барж.\n\nЕсть другой путь: корона наймёт целый флот барж, чтобы день и ночь возить камень из глубоких прибрежных каменоломен. Поставки удвоятся. У начальников портов есть суда, у каменотёсов — камень. Как всегда, недостаёт лишь золота.\n\n#bold Я смогу увидеть готовый купол со стен своего замка — если заплачу за то, чтобы увидеть его раньше.#!"
 sotd_dragonpit.0012.a:0 "Купить баржи. Я хочу увидеть готовый купол ещё в расцвете сил."
 sotd_dragonpit.0012.b:0 "Пусть камень поступает своим чередом."
 sotd_dragonpit.0013.t:0 "С опережением графика"
 sotd_dragonpit.0013.desc:0 "Главный строитель предстаёт перед троном с видом человека, не верящего собственным записям: великая стройка на холме Рейнис почти окончена — #bold на годы раньше всех расчётов#!.\n\nКоролевское золото принесло плоды. Новые рабочие, заморские краны, флот барж с камнем — каждое вложение усиливало следующее. От первого луча до последнего факела холм кишел, как разворошённый муравейник. Пока мастер говорит, укладывают последние плиты купола. Огромные бронзовые двери уже навешены; кузнецы полируют петли.\n\n#bold Нам обещали почти десятилетие работы. Золото, потраченное с умом, покупает время.#!"
 sotd_dragonpit.0013.a:0 "Тогда откроем двери."
 great_project_type_sotd_great_dragonpit:0 "Драконье Логово"
 great_project_type_sotd_great_dragonpit_desc:0 "Величайшее сооружение Королевской Гавани — огромный купол из камня и железа на холме Рейнис. Под ним драконы дома Таргариенов найдут приют, защиту и место для приручения. Строительство требует многих лет и королевского состояния в золоте."
 sotd_great_dragonpit_location_tt:0 "Можно возвести только на холме Рейнис в Королевской Гавани."
 sotd_great_dragonpit_not_already_built_tt:0 "Великое Драконье Логово здесь ещё не построено."
 great_project_type_sotd_great_dragonpit_contribution_foundations:0 "Основание"
 great_project_type_sotd_great_dragonpit_contribution_the_walls:0 "Стены"
 great_project_type_sotd_great_dragonpit_contribution_the_great_dome:0 "Великий купол"
