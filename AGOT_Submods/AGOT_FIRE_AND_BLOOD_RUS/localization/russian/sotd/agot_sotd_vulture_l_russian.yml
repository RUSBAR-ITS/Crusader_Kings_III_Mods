l_russian:
 fab_vulture.0002.t:0 "Король в Красных горах"
 fab_vulture.0002.desc:0 "Королевство едва успело похоронить мёртвых — и вот новая беда.\n\nИз Штормовых земель, из Дорнийских марок, из Чёрного Приюта, Каменного Шлема и десятков крепостей между ними летят вороны: в высоких перевалах Красных гор некий разбойник объявил себя королём. Его люди рисуют стервятника на щитах и зовут его Королём-Стервятником. Другого имени нет. Ни один мейстер не знает ни его дома, ни происхождения, ни даже цвета глаз. Говорят, это дорниец из гор, подчинивший себе каждую козью тропу и каждый тайный родник от Виля до Королевской Гробницы.\n\nБеглецы и отщепенцы стекаются к нему сотнями, а с недавних пор — тысячами. В сумерках они спускаются с гор, сжигают деревню, грабят септу и скрываются среди скал прежде, чем лорд успеет поднять рыцарей в седло.\n\nТрясучка забрала моего брата и сестёр, моих друзей, почти пятую часть королевства. Я надеялся, боги хотя бы на год-другой перестанут нас испытывать. Видимо, напрасно."
 fab_vulture.0002.a:0 "Одного разрисованного щита мало, чтобы стать королём."
 fab_vulture.0003.t:0 "Озлобленный брат"
 fab_vulture.0003.desc:0 "Есть весть хуже. Налётчики бьют слишком точно: находят каждый слабый гарнизон, обходят цепи сигнальных огней, заранее знают, где собираются войска пограничных лордов. Уцелевшие в сожжённой крепости на мысе Гнева клянутся, что среди разбойников был рыцарь, говоривший с выговором Штормовых земель и знавший названия всех перевалов.\n\nТеперь я знаю почему. С Королём-Стервятником сражается сир Боррис Баратеон.\n\nРодной брат лорда Рогара. Дюжину лет он был наследником Штормового Предела, пока Боремунд не явился на свет с младенческим криком и не занял место, которое Боррис привык считать своим. Вскоре Боррис отплыл в Мир, затем в Волантис, волоча обиду за собой через Узкое море, словно рваный плащ. Теперь он привёз её домой и положил к ногам разбойника, воюющего с его собственным домом.\n\nБаратеон ведёт стервятников к падали Штормовых земель. Мой дядя Орис нёс знамя этого дома в Последней Буре. Какую мерзость зависть делает из человека."
 fab_vulture.0003.a:0 "Измена никому не к лицу. На Баратеоне она отвратительна."
 fab_vulture.0004.t:0 "Огонь в Дорнийских марках"
 fab_vulture.0004.desc:0 "С Баратеоном в проводниках стервятник осмелел.\n\nОн больше не ограничивается отдельными деревнями и септами. Горят крепости, считавшие себя в безопасности. Их лорды слишком поздно узнают: цели для стервятника выбирает человек, который некогда охотился в их землях с соколами и псарями. Разбойники идут перевалами, которых нет на картах, бьют там, где меньше всего воинов, и уходят с добычей прежде, чем на дым придёт помощь. Лорды марок выступают в поход, но находят лишь пепел и стрелы. В народе уже шепчутся: Короля-Стервятника не поймать, его прячут сами горы.\n\nПринцесса Дорна в Солнечном Копье от него отрекается — чего бы ни стоили эти слова. Он не её король, как и не мой; он владыка одной лишь падали. Но его знамя брошено вызовом моему королевству, а пограничье истекает кровью.\n\nДо зимы с этим нужно покончить."
 fab_vulture.0004.a:0 "Горы укрывают его. От дракона не укрыться ничем."
 fab_vulture.0005.t:0 "Королевский меч"
 fab_vulture.0005.desc:0 "Сегодня перед Железным троном стоит лорд Рогар Баратеон. Я никогда не видел его таким мрачным — ни на Золотой свадьбе, ни на заседаниях совета за все годы его службы десницей, ни даже во время нашей ссоры, когда половина королевства затаила дыхание.\n\nЕго брат жжёт Штормовые земли. Родная кровь указывает стервятнику, куда бить. Каждый набег ранит его владения и позорит его имя. Это знает каждый лорд в зале.\n\nОн не бушует. Просто просит, соблюдая все приличия верного вассала: королевского дозволения взяться за оружие, уйти в горы и покончить с Королём-Стервятником и всеми его сообщниками.\n\nОн получит больше. Трясучка показала мне, сколько весит моя корона. Я ношу её не для того, чтобы из мягкого кресла смотреть, как лорды ведут мои войны. Вермитор осёдлан. Стервятник узнает, что такое настоящие крылья."
 fab_vulture.0005.desc.norogar:0 "Сегодня перед Железным троном стоит лорд Штормового Предела, представляющий истерзанный дом. Разбойники стервятника жгут Штормовые земли. Сир Боррис Баратеон, потомок самого Штормового Предела, указывает им, куда бить. Каждый набег ранит земли его дома и позорит его имя.\n\nЛорды Штормовых земель просят, соблюдая все приличия верных вассалов: королевского дозволения взяться за оружие, уйти в горы и покончить с Королём-Стервятником и всеми его сообщниками.\n\nОни получат больше. Трясучка показала мне, сколько весит моя корона. Я ношу её не для того, чтобы из мягкого кресла смотреть, как лорды ведут мои войны. Вермитор осёдлан. Стервятник узнает, что такое настоящие крылья."
 fab_vulture.0005.a:0 "Вы получите не только моё дозволение, милорд. Вы получите мой меч."
 fab_vulture.0006.t:0 "На бронзовых крыльях"
 fab_vulture.0006.desc:0 "На рассвете Красные горы оправдывают своё название. Со спины Вермитора они кажутся застывшим морем ржавчины и крови — хребет за хребтом до самого горизонта. Я начинаю понимать, как здесь можно всю жизнь прятать целое войско.\n\nНо каждому лагерю нужен огонь. От огня идёт дым. А дым поднимается вверх.\n\nМы с Бронзовым Гневом обшариваем перевалы, делая широкие круги от истоков Виля до вершин над Королевской Гробницей. Внизу, с востока, движется отряд лорда Рогара: верхом, где позволяют тропы, и пешком, где иначе не пройти. Лорд Саймон Дондаррион ведёт рыцарей из Чёрного Приюта, чтобы запереть западные перевалы. На земле сжимается кулак.\n\nА с неба я нахожу лагеря."
 fab_vulture.0006.a:0 "Вон там. Дым."
 fab_vulture.0007.t:0 "Сожжение горных лагерей"
 fab_vulture.0007.desc:0 "Первый лагерь был похож на неряшливое воронье гнездо: палатки и краденые повозки, разбросанные в высокой долине. Вермитору хватило одного захода.\n\nС тех пор мы сожгли ещё дюжину. Частоколы из горной сосны, пещеры с заграждениями из камней у входа, пастушью деревню, захваченную разбойниками, — драконьему пламени всё равно, как высоко человек забрался и как глубоко зарылся. Каждый раз уцелевшие бегут выше, туда, где холоднее и голоднее. И через несколько дней дым снова их выдаёт.\n\nЛюди называли его королём, которого прячут горы. Теперь они могут поднять глаза, увидеть, как одно за другим горят его логова, и рассудить, кто здесь настоящий хозяин.\n\nСтервятник больше не грабит. Он спасается бегством."
 fab_vulture.0007.a:0 "Крылья, разбойник. Ты выбрал не тот герб."
 fab_vulture.0008.t:0 "Козьи тропы и сталь пограничья"
 fab_vulture.0008.desc:0 "Кольцо на земле сжимается, словно кулак.\n\nВоины лорда Рогара вошли в горы с востока. Сначала верхом, потом пешком, когда дороги сузились до козьих троп. Они тащат копья по склонам, где нагруженному человеку приходится цепляться обеими руками. Ворчат, что темпа лорда Штормового Предела не выдержала бы и коза. Но идут за ним — с каждым днём всё выше.\n\nНа западе лорд Саймон Дондаррион из Чёрного Приюта действует тише и расчётливее. Его небольшое войско рыцарей марок перекрыло все сколько-нибудь пригодные западные перевалы. Поколениями эти люди гонялись здесь за дорнийскими налётчиками. Они знают все лазейки — и теперь держат их. Ускользнуть к пескам не удастся.\n\nНа востоке — сталь. На западе — сталь. Сверху — огонь. Небо стервятника сужается."
 fab_vulture.0008.a:0 "Некуда больше лететь."
 fab_vulture.0009.t:0 "Брат против брата"
 fab_vulture.0009.desc:0 "Первым загнали сира Борриса.\n\nЗажатый в высоком ущелье с остатками верных воинов, он принял бой. Люди Рогара быстро с ними расправились. Затем толпа расступилась, и братья наконец оказались друг напротив друга — между ними лишь десять футов окровавленной каменной осыпи. Я видел руку Рогара на рукояти меча. Видел, чего ему это стоило. Кем бы ни стал Боррис, когда-то их держала на коленях одна мать.\n\nНет. Только не это. Семеро проклинают родичеубийцу сильнее любого другого человека. Рогар Баратеон слишком верно служил Железному трону, чтобы ради него навлечь проклятие.\n\nЯ встал между ними и обнажил Чёрное Пламя. Меч Эйгона свершит суд над изменником. Боррис усмехнулся, поднял клинок и сказал, что умереть от валирийской стали — честь.\n\nЕдинственная честь, которая у него осталась."
 fab_vulture.0009.a:0 "Вы бросили вызов короне, сир. Подойдите и возьмите её."
 fab_vulture.0009.b:0 "Пусть всё будет быстро."
 fab_vulture.0009.b.tt:0 "Сир Боррис Баратеон не выйдет из ущелья живым: его убьёт король, а если изменник сумеет победить — окружающие воины Штормовых земель. Исход боя станет известен завтра."
 fab_vulture.0011.t:0 "Плата за измену"
 fab_vulture.0011.desc:0 "Бой был недолгим.\n\nОн бросился на меня, вложив в удар всю свою злобу и силу Баратеонов. Первые три обмена ударами были хороши. Но гнев — плохой наставник в фехтовании, а Чёрное Пламя — куда лучший. На четвёртом я нашёл щель между горжетом и наплечником. Сир Боррис Баратеон упал на колени на камни тех самых гор, куда ушёл разбойничать, предав свой дом.\n\nРогар не отвёл взгляда. Когда всё закончилось, он опустился рядом с братом и закрыл ему глаза. Не проронил ни слова. Ни один человек в ущелье не оказался настолько глуп, чтобы с ним заговорить.\n\nТакова плата за измену. Мне нет в этом радости. Но каждый лорд теперь знает, как выглядит королевское правосудие, когда король вершит его сам. И руки Баратеона чисты от братской крови."
 fab_vulture.0011.a:0 "Покойтесь с миром, сир. Ваша война окончена."
 fab_vulture.0012.t:0 "Смерти не избежать"
 fab_vulture.0012.desc:0 "Хроники будут ко мне благосклонны: я сам распоряжаюсь тем, что в них пишут. Правда в том, что сир Боррис оказался искуснее, чем я ожидал, и силён, как бык. Вмятина на нагруднике и звон в голове тому доказательство. Он сбил меня на одно колено среди осыпи, и на миг его клинок занёсся надо мной.\n\nЛишь на миг. Он победил своего короля и выиграл себе три шага по горному воздуху. Затем на него навалились воины Штормовых земель — его земляки, чьи деревни он выбрал для факелов стервятника. Ни один королевский приказ не смог бы их остановить. Он умер на дюжине копий, всё ещё огрызаясь.\n\nРогар сам поднял меня на ноги. Мы не стали говорить об увиденном. Король может оступиться; корона падать не должна.\n\nИзменник мёртв. Эту весть и разнесут вороны."
 fab_vulture.0012.a:0 "Похороните его. Он когда-то был рыцарем."
 fab_vulture.0013.t:0 "Сожжённое логово"
 fab_vulture.0013.desc:0 "В конце концов горы его выдали.\n\nЛагеря сожжены, банды рассеяны. Король-Стервятник бежал туда, где, по его расчёту, мы не станем искать: в логово, уже спалённое Вермитором, высоко на голой скале. Его люди ютились среди обугленных останков, надеясь, что молния не бьёт дважды. Умная мысль. Она подарила ему полмесяца свободы.\n\nНо следопыты лорда Дондарриона заметили кружащих падальщиков — какая уместная насмешка! Ночью люди Рогара поднялись по козьим тропам. Среди сгоревших палаток случилась короткая кровавая схватка, и всё закончилось.\n\nУтром его привели к нам в цепях. Признаюсь, я ожидал большего: великана, чудовища, мрачную легенду гор. Перед нами лишь человек — худой, с ястребиным лицом, твёрдый, как породившие его скалы, и с терпением стервятника в глазах. Имени нет и теперь. Сам он его не называет, а его люди не знают.\n\nЧеловек возложил на него корону. Посмотрим, что её снимет."
 fab_vulture.0013.a:0 "Так вот он, король, которого прятали горы."
 fab_vulture.0014.t:0 "Копьё и щит"
 fab_vulture.0014.desc:0 "Я собирался его повесить. Но у Рогара Баратеона другой замысел. После всего, что эта война стоила его дому, я не могу отказать.\n\n«Снимите цепи, — приказывает он перед собравшимся войском. — Дайте ему копьё и щит». Затем обращается к стервятнику: «Ты назвал себя королём. Так умри по-королевски. Убей меня — и эти люди отпустят тебя в горы. Даю слово. А я своё слово держу».\n\nПо рядам бежит ропот. Разбойник разминает освобождённые кисти, берёт копьё, пробует его вес. Взглядывает на горы — свои сожжённые горы, — затем на лорда Штормового Предела. Улыбается, словно уже однажды умер и не нашёл в этом ничего особенного.\n\nРогар хочет закончить войну так же, как вёл её: лично, впереди всех, ударом копья. Боги больше всего любят, когда лорд ставит своё слово на исход одного боя."
 fab_vulture.0014.desc.norogar:0 "Лорды Штормовых земель собирались его повесить. Но у рыцарей марок другой замысел. После всего, что эта война стоила пограничью, никто им не возражает.\n\nПеред собравшимся войском с разбойника снимают цепи и дают ему копьё и щит. Назвался королём — пусть умрёт в бою, как король, от руки защитника тех, чьи земли он сжёг. Он разминает освобождённые кисти, берёт копьё, пробует его вес. Взглядывает на горы — свои сожжённые горы, — и улыбается, словно уже однажды умер и не нашёл в этом ничего особенного.\n\nБоги больше всего любят, когда правосудие ставят на исход одного боя."
 fab_vulture.0014.a:0 "Направить копьё лорда Рогара. (Играть за Рогара.)"
 fab_vulture.0014.b:0 "Наблюдать с помоста. Это бой Рогара."
 fab_vulture.0014.b.tt:0 "Король-Стервятник не останется в живых. Его убьёт копьё лорда Штормовых земель. Если разбойник победит и получит обещанную свободу, в западных перевалах его настигнут рыцари лорда Дондарриона — они ничего ему не обещали. Исход боя станет известен завтра."
 fab_vulture.0016.t:0 "Стервятник падает"
 fab_vulture.0016.desc:0 "Разбойник сражался хорошо. В этом я ему не откажу — но ни в чём другом.\n\nОн бился, как сами горы: терпеливо, зло, не уступая ни дюйма без платы. Дважды его копьё скользило по щиту Рогара с такой силой, что тот пошатнулся, а войско разом затаило дыхание. Но Рогар Баратеон сокрушал противников и покрупнее горных королей. Эта война до краёв наполнила его яростью. Он теснил стервятника шаг за шагом. Когда нога разбойника наконец скользнула на осыпи, копьё прошило его насквозь.\n\nНикаких последних слов. Он умер таким же безымянным, каким жил. Его люди смотрели и понимали — раз и навсегда: никакого короля в Красных горах не было.\n\nЛишь человек. А люди смертны."
 fab_vulture.0016.a:0 "Всё кончено. В марках тихо."
 fab_vulture.0017.t:0 "Слово лорда и стрела пограничника"
 fab_vulture.0017.desc:0 "Боги нас не слушали. Или, быть может, как раз слушали: стервятник бился, словно изголодавшийся зверь. Рогар оступился на осыпи и рухнул, окровавленный, со щитом, расколотым до самого умбона. Разбойник занёс копьё над лордом Штормового Предела. Затем, боги знают почему, опустил его, сплюнул и повернул к горам.\n\nЛежащий на земле Рогар Баратеон рявкнул своим людям, чтобы расступились. Слово дано. Слово будет сдержано. Войско разошлось, и Король-Стервятник свободно прошёл сквозь тысячу врагов, держа спину прямо, как настоящий король.\n\nОн пошёл на запад — единственным открытым путём. Открытым потому, что его держал лорд Саймон Дондаррион. Рыцари марок ничего разбойнику не обещали; это знали все в горах, кроме одного. Говорят, он улыбался, когда стрелы настигли его на западных перевалах. Он уже видел пески, до которых так и не дошёл.\n\nРогар поправится. Его слово не нарушено. А стервятник наконец стал падалью."
 fab_vulture.0017.a:0 "Его слово сдержано. А стервятник стал падалью."
 fab_vulture.0018.t:0 "Меньше полугода"
 fab_vulture.0018.desc:0 "От первого ворона до последнего удара копьём прошло меньше полугода.\n\nМейстеры уже спорят, как это назвать. Одни пишут: Третья Дорнийская война. Двор Солнечного Копья негодует: ни одно знамя Дорна не развевалось рядом со стервятником! Это правда. Но сам он был дорнийцем, горы — дорнийскими, а летописцам нужны аккуратные номера. Пусть. Те, кто сражался, зовут это Охотой на Стервятника. Так вернее.\n\nЛагеря обращены в пепел. Разбитые банды рассеяны; теперь дорнийские лорды преследуют их столь же охотно, как мои воины марок. Падаль не знает границ. Сир Боррис ответил за измену. Честь Штормового Предела чиста: родичеубийство её не запятнало. От Дорнийских марок до Стены каждый знает: когда стервятник поднялся, старый олень Штормового Предела пешком пошёл по козьим тропам, а впереди летел король Вестероса.\n\nКоролевство увидело своего короля на войне рядом с лордами, а не над ними. После трясучки, после всего пережитого это дороже самой победы.\n\nПусть горы хранят свою падаль. Мы возвращаемся домой."
 fab_vulture.0018.a:0 "Меньше полугода. Пусть хроники так и запишут."
 fab_name_vulture_king:0 "Король-Стервятник"
 fab_vulture_host:0 "Налётчики Короля-Стервятника"
 fab_vulture_duel_modifier:0 "Праведный гнев"
 fab_vulture_duel_modifier_desc:0 "Эта схватка назревала долго, но долгой не будет."
 fab_third_dornish_plot_armor_modifier:0 "Отмеченный хрониками"
 fab_third_dornish_plot_armor_modifier_desc:0 "Конец этой жизни уже записан в хрониках. И он наступит не здесь."
