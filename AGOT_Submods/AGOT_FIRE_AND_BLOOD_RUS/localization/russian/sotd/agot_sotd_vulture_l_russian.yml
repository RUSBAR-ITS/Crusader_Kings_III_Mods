l_russian:
 fab_vulture.0002.t:0 "Король в Красных горах"
 fab_vulture.0002.desc:0 "Королевство едва закончило хоронить своих мертвецов, и вот это.\n\nВороны из Штормовых земель, с границ, из Блэкхейвена, Каменного Шлема и половины крепостей между ними: разбойник короновал себя на высоких перевалах Красных гор. Его люди рисуют стервятника на своих щитах и ​​называют его королем — Королем-стервятником, не более того. Ни один мейстер не может сказать мне ни своего дома, ни рождения, ни хотя бы цвета своих глаз. Говорят, он дорнийец, уроженец гор, и он сделал себя господином каждой козьей тропы и скрытого источника от Уила до Кингсгрейва.\n\nСломленные люди стекаются к нему сотнями, а в последнее время и тысячами. Они спускаются с гор в сумерках, сжигают деревню, опустошают септу и исчезают в скалах прежде, чем какой-либо лорд успевает оседлать своих рыцарей.\n\nДрожи забрали моих брата и сестер, моих друзей, почти пятую часть моего королевства. Я надеялся, что боги перестанут нас проверять за год или два. Кажется, это не так."
 fab_vulture.0002.a:0 "Королей создаёт не только разрисованный щит."
 fab_vulture.0003.t:0 "Озлобленный брат"
 fab_vulture.0003.desc:0 "Есть хуже. Рейдеры наносят удар слишком уверенно — каждый найденный слабый гарнизон, каждая обходная линия маяка, каждый марширующий лорд ожидаемый сбор. Выжившие из сожженной крепости на мысе Гнева клянутся, что слышали, как рыцарь среди рейдеров говорил языком штормовика, называя перевалы своими именами.\n\nТеперь я знаю почему. Сир Боррис Баратеон едет с Королем Стервятников.\n\nРодной брат лорда Рогара. Наследник Штормового Предела в течение дюжины лет, пока Боремунд не пришел в этот мир и не занял место, которое он стал считать своим. Вскоре после этого Боррис отправился на корабле в Мир, затем в Волантис, волоча свою горечь через Узкое море, как разорванный плащ, — и теперь он принес ее домой и положил к ногам разбойника, который ведет войну с его собственным домом.\n\nБаратеон, ведущий стервятников к падали Штормовых земель. Мой дядя Орис нес знамя этого дома во время Последней Бури. Гнусно то, что зависть делает с людьми."
 fab_vulture.0003.a:0 "Измена никому не к лицу. На Баратеоне она отвратительна."
 fab_vulture.0004.t:0 "Пожар на Марках"
 fab_vulture.0004.desc:0 "Под руководством Баратеона стервятник становится смелым.\n\nЭто уже не деревня здесь и не септ там. Крепости теперь горят — крепости, которые считали себя в безопасности, чьи лорды слишком поздно узнали, что человек, выбиравший цели для стервятника, когда-то охотился и сокрушал их земли. Рейдеры проходят через проходы, которые не показаны на карте, наносят удары там, где ополченцев меньше всего, и исчезают со своей добычей прежде, чем дым успевает вызвать помощь. Лорды-участники марша выезжают и не находят ничего, кроме пепла и стрел; в простонародье зашептались, что Короля-стервятника не поймать, что его прячут сами горы.\n\nДорнийская принцесса в Солнечном Копье отрекается от него, чего бы ни стоили такие слова — он принадлежит ей не больше, чем мне, король падали и ничего больше. Но он развевает свое знамя в моем королевстве, несмотря на это, и марши кровоточат.\n\nЭто не выдержит зимы."
 fab_vulture.0004.a:0 "Горы укрывают его. От дракона не укрыться ничем."
 fab_vulture.0005.t:0 "Королевский меч"
 fab_vulture.0005.desc:0 "Лорд Рогар Баратеон сегодня стоит перед Железным Троном, и я никогда не видел его таким мрачным — ни на Золотой свадьбе, ни в зале совета за все годы, пока он был Десницей, даже когда мы ссорились и половина королевства затаила дыхание.\n\nЕго брат сжигает Штормовые земли. Его собственная кровь показывает стервятнику, куда следует нанести удар. Каждый набег — это рана для его земель и насмешка над его именем, и каждый лорд в зале это знает.\n\nОн не злится. Он спрашивает просто и правильно, как и должен законный знаменосец: позволить королю взять в руки оружие, перейти в горы и положить конец Королю-стервятнику и каждому человеку, который едет с ним.\n\nОн получит больше, чем это. Дрожи научили меня, сколько весит моя корона; Я носил его не для того, чтобы смотреть, как мои лорды сражаются в моих войнах, сидя на мягком сиденье. Вермитор оседлан. Стервятник узнает, что такое крылья на самом деле."
 fab_vulture.0005.desc.norogar:0 "Лорд Штормового Предела сегодня предстает перед Железным Троном, выступая от имени истекающего кровью дома. Налетчики стервятников сжигают Штормовые земли, а сир Боррис Баратеон — кровь самого Штормового Предела — показывает им, куда нанести удар. Каждый набег — это рана для их земель и насмешка над их именем.\n\nПовелители бури просят просто и корректно, как и должны делать настоящие знаменосцы: позволить королю взять в руки оружие, переправиться в горы и положить конец Королю-стервятнику и каждому человеку, который едет с ним.\n\nУ них будет больше, чем это. Дрожи научили меня, сколько весит моя корона; Я носил его не для того, чтобы смотреть, как мои лорды сражаются в моих войнах, сидя на мягком сиденье. Вермитор оседлан. Стервятник узнает, что такое крылья на самом деле."
 fab_vulture.0005.a:0 "Вы получите не только моё дозволение, милорд. Вы получите мой меч."
 fab_vulture.0006.t:0 "На бронзовых крыльях"
 fab_vulture.0006.desc:0 "Красные горы получают свое имя на рассвете. Со спины Вермитора они катятся подо мной, словно замерзшее море ржавчины и крови, гряда за грядой, и я начинаю понимать, как человек может спрятать в них армию на всю жизнь.\n\nНо каждому стану нужен огонь, а огню нужен дым, и дым поднимается.\n\nМы с «Бронзовой Яростью» пролетаем перевалы длинными взмахами от истоков Уила до вершин над Кингсгрейвом. Колонна лорда Рогара движется внизу, к востоку от гор: верхом, где позволяют дороги, и пешим там, где это невозможно. Лорд Саймон Дондаррион ведет своих марширующих рыцарей из Блэкхейвена, чтобы перекрыть западные перевалы. Кулак сжимается на земле.\n\nИ с неба я нахожу лагеря."
 fab_vulture.0006.a:0 "Вон там. Дым."
 fab_vulture.0007.t:0 "Сожжение высоких лагерей"
 fab_vulture.0007.desc:0 "Первый лагерь представлял собой разбросанные палатки и украденные повозки в нависающей долине, грубой, как воронье гнездо. Вермитор взял его за один проход.\n\nС тех пор мы сожгли еще дюжину. Частоколы горных сосен, пещеры, устья которых замурованы из щебня, пастушеская деревня, которую налетчики взяли себе в собственность — пламя дракона не заботится о том, как высоко поднимается человек или как глубоко он копает. Каждый раз выжившие разбегаются вверх, в какое-нибудь более высокое, холодное и голодное убежище, и каждый раз дым снова выдает их через несколько дней.\n\nВ простонародье его называли королем, которого скрывают горы. Теперь они могут посмотреть вверх и увидеть горящие горы, логово за логовом, и сказать, кто кого держит.\n\nСтервятник прекратил набеги. Он бежит."
 fab_vulture.0007.a:0 "Крылья, разбойник. Ты выбрал не тот герб."
 fab_vulture.0008.t:0 "Козьи тропы и сталь Марок"
 fab_vulture.0008.desc:0 "Земля сжимается, как кулак.\n\nШтормоземельцы лорда Рогара вошли в горы с востока — сначала верхом на лошадях, затем пешком, когда тропы сузились до козьих троп, и тащили свои копья вверх по склонам, куда обремененному человеку приходится карабкаться обеими руками. Его люди ворчат, что Лорд Штормового Предела задает темп, который не потерпит ни одна коза; они следуют за ним все равно, с каждым днем ​​все выше.\n\nНа западе лорд Саймон Дондаррион из Блэкхейвена проделал более тихую и холодную работу: небольшая армия марширующих рыцарей растянулась по каждому западному перевалу, достойному этого названия. В течение нескольких поколений участники марша преследовали дорнийских налетчиков в этих горах — они знают убежища и теперь удерживают их. Никакого ускользания к пескам не будет.\n\nВосток, сталь. Запад, сталь. Наверху огонь. Небо стервятника закрывается."
 fab_vulture.0008.a:0 "Некуда больше лететь."
 fab_vulture.0009.t:0 "Брат против брата"
 fab_vulture.0009.desc:0 "Сир Боррис был первым, кого бросили на землю.\n\nЗагнанный в угол в высоком ущелье с последним из своих присягнувших людей, он занял свою позицию. Штормовики Рогара быстро с ними расправились, а затем пресса разошлась, и вот они наконец стояли, брат лицом к лицу, на десяти футах кровавой осыпи. Я увидел руку Рогара на его мече. Я видел, чего ему это стоило. Что бы еще ни делал о себе Боррис, однажды они делили колени у матери.\n\nНет. Не это. Семь проклинают убийцу родственников больше всех людей, а Рогар Баратеон слишком хорошо служил Железному Трону, чтобы быть проклятым из-за него.\n\nЯ встал между ними и нарисовал Чёрного Пламени. Меч Эйгона, за правосудие предателя — Боррис усмехнулся и поднял свой клинок, назвав за честь умереть на валирийской стали.\n\nЭто единственная честь, оставшаяся ему."
 fab_vulture.0009.a:0 "Вы бросили вызов короне, сир. Подойдите и возьмите её."
 fab_vulture.0009.b:0 "Пусть всё будет быстро."
 fab_vulture.0009.b.tt:0 "Сир Боррис Баратеон не покинет это ущелье живым — от клинка короля, или, если изменник каким-то чудом одолеет, его порубят штормовые люди вокруг. Схватка разрешится на завтра."
 fab_vulture.0011.t:0 "Плата за измену"
 fab_vulture.0011.desc:0 "Это был не долгий бой.\n\nОн напал на меня жестко, со всей горечью и силой Баратеона, и за три обмена он был очень хорош. Но гнев — плохой мастер меча, а Чёрное Пламя — лучший. В четвертом разговоре я нашел щель между горжетом и наплечником, и сир Боррис Баратеон упал на колени на камнях гор, которым он предал свой дом, чтобы он стал привидением.\n\nРогар не отвел взгляда. Когда это было сделано, он опустился на колени рядом со своим братом, закрыл глаза и не произнес ни слова, и ни один человек в этом ущелье не был настолько глуп, чтобы заговорить с ним.\n\nТакова плата за предательство. Я не получаю от этого никакой радости. Но теперь каждый лорд в моем королевстве увидел, как выглядит королевское правосудие, когда королю приходится нести его самому, и что руки Баратеона чисты от братской крови."
 fab_vulture.0011.a:0 "Отдохните теперь, сер. Ваша война окончена."
 fab_vulture.0012.t:0 "Сражённый всё равно"
 fab_vulture.0012.desc:0 "Истории будут добрыми, потому что истории принадлежат мне. Правда в том, что сир Боррис оказался лучше, чем я предполагал, и к тому же силен, как бык, и вмятина на моем нагруднике и звон в черепе доказывают это. Он поставил меня на одно колено на осыпи, и на мгновение его клинок поднялся надо мной.\n\nТолько сердцебиение. Он победил своего короля, и это дало ему три ступени горного воздуха. Затем над ним сомкнулись штормовики — его соотечественники, люди, чьи деревни он отметил факелами стервятника, — и никакое королевское командование на земле не смогло бы их удержать. Он умер от дюжины копий, все еще рыча.\n\nРогар сам поднял меня на ноги. Никто из нас не говорил о том, что мы оба видели. Король может споткнуться; это корона, которая не должна упасть.\n\nПредатель мертв. Вот что унесут вороны."
 fab_vulture.0012.a:0 "Похороните его. Он когда-то был рыцарем."
 fab_vulture.0013.t:0 "Сожжённое логово"
 fab_vulture.0013.desc:0 "В конце концов горы сдали его.\n\nОставив свои лагеря в пепле и разбросав отряды, Король-стервятник бежал в единственное убежище, которое, по его мнению, мы никогда не будем искать: логово, которое Вермитор уже сжег, высоко на отроге голой скалы, где его люди могли ютиться среди гольца и быть уверенными, что молния не ударит дважды. Это была умная мысль. Это позволило ему оставаться свободным на полмесяца.\n\nНо следопыты лорда Дондарриона обнаружили кружащих птиц-падальщиков — вполне подходящее — и люди Рогара в темноте пошли по козьим тропам. Среди сгоревших палаток произошла короткая красная история, а затем все закончилось.\n\nСегодня утром его привели к нам в цепях. Признаюсь, я ожидал большего: гиганта, ужаса, какой-то черной легенды высот. Он всего лишь человек — худощавый, с ястребиным лицом, твердый, как скалы, породившие его, с терпением стервятника в глазах. Без имени, даже сейчас. Он ничего не предлагает, и его люди ничего не знают.\n\nМужчина короновал его. Еще неизвестно, что его разрушает."
 fab_vulture.0013.a:0 "Так вот он, король, которого прятали горы."
 fab_vulture.0014.t:0 "Копьё и щит"
 fab_vulture.0014.desc:0 "Я думал повесить его. У Рогара Баратеона другие идеи, и после того, как эта война стоила ему дома, я понимаю, что не могу ему отказать.\n\n«Сбросьте с него цепи», — приказывает он перед собравшейся армией. — Дайте ему копье и щит. А затем самому стервятнику: «Ты назвал себя королем. Тогда умри как один. Убейте меня, и эти люди позволят вам свободно пройти в ваши горы — даю слово. Мое слово доброе.\n\nПо рядам пробегает ропот. Разбойник сгибает освободившиеся руки, берет копье, проверяет его вес. Один раз он смотрит на горы — на свои сожженные горы — а затем на Лорда Штормового Предела и улыбается, как человек, который однажды уже умер и не нашел в этом ничего особенного.\n\nРогар намерен закончить эту войну так, как она велась: самому, впереди, ударом копья. Боги не любят ничего лучше, чем слово лорда, поставленное на один бой."
 fab_vulture.0014.desc.norogar:0 "Повелители бури думали повесить его. У марширующих рыцарей другие идеи, и после того, как эта война стоила маршам, никто их не оспаривает.\n\nЦепи срываются на глазах у собравшейся армии. В руки разбойника отдаются копье и щит: он назвал себя королем — пусть же он умрет, сражаясь, как один, против защитника людей, чьи земли он сжег. Он сгибает освободившиеся руки, берет копье, проверяет его вес. Он смотрит однажды на горы — его горы сожженные — и улыбается, как человек, который уже однажды умер и не нашел в этом ничего страшного.\n\nБоги не любят ничего лучше, чем справедливость, заключенная в единственном бою."
 fab_vulture.0014.a:0 "Направь копьё лорда Рогара."
 fab_vulture.0014.b:0 "Наблюдай с помоста. Это бой Рогара."
 fab_vulture.0014.b.tt:0 "Король-стервятник не покинет этот лагерь живым — на копье повелителя бури, или, если разбойник каким-то образом одержит победу и получит обещанную свободу, его сразят марширующие рыцари лорда Дондарриона в западных перевалах, которые ничего ему не обещали. Ссора разрешится на следующий день."
 fab_vulture.0016.t:0 "Стервятник падает"
 fab_vulture.0016.desc:0 "Разбойник хорошо дрался — я дарую ему именно это, и ничего больше.\n\nОн сражался, как сражаются горы: терпеливый, жестокий, не уступающий ни дюйма, за который не заплатили. Дважды его копье выскакивало из щита Рогара настолько сильно, что ошеломило его, и армия затаила дыхание, как один человек. Но Рогар Баратеон сломил более крупных людей, чем горные короли, и в нем живет ярость, которую эта война довела до предела. Он отгонял стервятника назад и снова, и когда нога разбойника наконец нашла свободную осыпь, копье повелителя бури прошло сквозь него и вылетело с другой стороны.\n\nНикаких последних слов. Он умер так же безымянно, как и жил, и люди, последовавшие за ним, наблюдали за этим и поняли, сразу и навсегда, что в Красных Горах вообще никогда не было никакого короля.\n\nТолько мужчина. И мужчины умирают."
 fab_vulture.0016.a:0 "Сделано. Марки спокойны."
 fab_vulture.0017.t:0 "Слово лорда и стрела воина Марок"
 fab_vulture.0017.desc:0 "Боги не слушали, а может быть, и слушали: стервятник дрался, как голодное животное, и когда нога Рогара повернулась на осыпи, именно повелитель бури упал, окровавленный, его щит раскололся на босса. Разбойник стоял над Лордом Штормового Предела с поднятым копьем, а затем, боги знают почему, опустил его, сплюнул и повернулся к горам.\n\nИ Рогар Баратеон, истекая кровью на земле, крикнул своим людям, чтобы они отошли в сторону. Его слово было дано. Его слово хорошее. Армия расступилась, и Король-стервятник свободно прошел сквозь тысячу своих врагов, прямо, как любой король на самом деле.\n\nОн пошел на запад. Это был единственный открытый путь, и он был открыт, потому что его держал лорд Саймон Дондаррион, а участники марша, как знал каждый человек в горах, кроме одного, вообще ничего ему не обещали. Говорят, он улыбался, когда стрелы нашли его высоко в западных перевалах, недалеко от песков, которых он так и не достиг.\n\nРогар поправится. Его слово стоит непоколебимо. И стервятник, наконец, падаль."
 fab_vulture.0017.a:0 "Его слово сдержано. А стервятник стал падалью."
 fab_vulture.0018.t:0 "Меньше полугода"
 fab_vulture.0018.desc:0 "От первого ворона до последнего копья все дело длилось не более полугода.\n\nМейстеры уже спорят, как это назвать. Некоторые пишут, что это Третья Дорнийская война, и двор Солнечного Копья ощетинивается от этого названия — ни одно знамя Дорна никогда не развевалось рядом со стервятником, протестуют они, и это правда. Но он был дорнийцем, и его горы были дорнийцами, и истории нужны их аккуратные цифры. Они могут это получить. Те, кто там сражался, называют это «Охотой на стервятников», и это название более верное.\n\nЛагеря превратились в пепел. Отряды разбиты и рассеяны, и теперь дорнийские лорды преследуют их так же охотно, как и мои участники марша, — падаль не знает границ. Сир Боррис ответил за свою измену, и честь Штормового Предела не запятнана: никакое убийство родственников не запятнает ее, и каждый человек от дорнийских маршей до Стены знает, что, когда поднялся стервятник, старый олень Штормового Предела пошел пешком по козьим тропам, и король Вестероса полетел перед ним.\n\nМое королевство видело, как его король вел войну рядом со своими лордами, а не над ними. После Дрожь, после всего — это стоит больше, чем победа.\n\nГоры могут хранить свою падаль. Мы едем домой."
 fab_vulture.0018.a:0 "Меньше полугода. Пусть хроники так и запишут."
 fab_name_vulture_king:0 "Король-Стервятник"
 fab_vulture_host:0 "Налётчики Короля-Стервятника"
 fab_vulture_duel_modifier:0 "Праведный гнев"
 fab_vulture_duel_modifier_desc:0 "Эта схватка назревала долго, но долгой не будет."
 fab_third_dornish_plot_armor_modifier:0 "Отмеченный хрониками"
 fab_third_dornish_plot_armor_modifier_desc:0 "Хроники уже дописали конец этого человека, и здесь он не окончится."
