 fab_aegon.0001.t:0 "Дорога к Девичьему Пруду"
 fab_aegon.0001.desc:0 "Наша первая королевская поездка наконец привела нас в Девичий Пруд. Все ворота украшены цветами, все колокола звонят в честь прибытия короля и королевы. Алисанна принимает приветствия, положив руку на чуть округлившийся под платьем живот. Если боги будут милостивы, наш первенец родится прежде, чем минует ещё год.\n\nЛорд Мутон открыл для неё купальню Джонквиль. Простой народ клянётся, что тёплые воды исцеляют бесплодие, залечивают старые раны и благословляют ещё не родившихся младенцев. Даже мудрейший мейстер не заставит Алисанну отказаться от такой ласковой надежды. Когда я называю это сказками прачек, она смеётся и отвечает: короли были бы мудрее, если бы иногда слушали прачек.\n\nВ купальню пускают только женщин. Сиру Джоффри Доггетту и сиру Джайлсу Морригену придётся остаться на страже за дверью, а Алисанна войдёт с придворными дамами и святыми сёстрами, присматривающими за водоёмом.\n\n#bold Это мирное место, любимое Девой. Что может ей здесь угрожать?#!"
 fab_aegon.0001.a:0 "Пусть королева отдохнёт. Дорога утомила её."
 fab_aegon.0002.t:0 "Кинжалы под белыми одеждами"
 fab_aegon.0002.desc:0 "Крик из купальни заставляет умолкнуть все колокола Девичьего Пруда.\n\nКогда Алисанна подошла к воде, три святые сестры достали из-под одежд длинные ножи. Розамунда Болл заслонила королеву и получила глубокую рану в живот. Пруденс Селтигар пронзили плечо. Щёку септы Эдит рассёк кровавый шрам. Они сдерживали нападавших, пока Доггетт и Морриген не выломали запертую дверь с мечами в руках.\n\nДве убийцы погибли на мокрых камнях. Третья сидит в темнице лорда Мутона; сломанных зубов у неё теперь больше, чем целых. Алисанна невредима, и мейстер клянётся, что ребёнок ещё жив. Но моя королева не может отвести глаз от крови Розамунды на своём платье.\n\nОна пришла за благословением Девы. Нашла убийство под святыми одеждами.\n\n#bold Тот, кто направил эти ножи, хотел убить мою жену, моего ещё не родившегося ребёнка и мир, который мы с таким трудом создавали.#!"
 fab_aegon.0002.a:0 "Охраняйте Алисанну. Помогите раненым дамам. Выставьте стражу у всех ворот."
 fab_aegon.0004.t:0 "Виноватые и невинные"
 fab_aegon.0004.desc:0 "Розамунда Болл прожила ещё три дня, прежде чем рана в животе свела её в могилу. Алисанна оставалась рядом до конца.\n\nВыжившая убийца назвала ещё шестерых сообщников в Девичьем Пруду. Лорд Мутон предлагает казнить всех и вдобавок изгнать из купальни Джонквиль всех святых сестёр. Он боится, что под любым белым одеянием скрывается новый нож.\n\nАлисанна не согласна. «Повесьте виновных, если их вина доказана», — говорит она, бледная после бессонных ночей. «Но я не почту мужество Розамунды местью женщинам, непричастным к её смерти. Кинжал держала не одежда. Его держала женщина».\n\nНекоторые лорды назовут её милосердие слабостью. Они не были в залитой кровью купальне и не видели, как три верные женщины закрыли королеву своими телами.\n\n#bold Правосудие должно различать лица. Иначе это лишь резня под королевским знаменем.#!"
 fab_aegon.0004.a:0 "Судить тех, кого она назвала. Невинные сёстры останутся невредимы."
 fab_aegon.0005.t:0 "Тень для королевы"
 fab_aegon.0005.desc:0 "Ни один белый плащ не мог войти с Алисанной в купальню Джонквиль. Будут и другие двери, закрытые для мужчин, другие покои, за порогом которых Королевской гвардии придётся остаться. Я больше не доверю жизнь королевы обычаю.\n\nДжонквиль Дарк преклонила колени у Железного трона в кольчуге и длинном алом плаще. Она бастард, но ни один мужчина на тренировочном дворе не превзойдёт её с мечом или копьём. Алисанна ей доверяет. При дворе уже придумали имя женщине, которая будет идти в полушаге за королевой там, куда мужчинам нельзя: Алая Тень.\n\n«Вы будете охранять её во сне и наяву, — говорю я Джонквиль. — Стоять там, где не могут мои белые плащи, и, если потребуется, отдать свою жизнь за её».\n\nПринося клятву, Джонквиль смотрит не на меня, а на Алисанну. «С радостью».\n\n#bold Отныне у королевы будет тень, вооружённая сталью.#!"
 fab_aegon.0005.a:0 "Встаньте, Джонквиль Дарк, и берегите мою королеву."
 fab_aegon.0010.t:0 "Принц, рождённый слишком рано"
 fab_aegon.0010.desc:0 "Наш сын родился раньше срока.\n\nПовитуха поднимает его в ладонях, которые кажутся слишком большими для такого крошечного ребёнка. Кожа красная и тонкая; ручки и ножки едва толще моих пальцев. На одно страшное мгновение в покоях воцаряется тишина. Затем он судорожно вдыхает и кричит так тихо, что приходится склониться, чтобы услышать.\n\nАлисанна называет его Эйгоном. Имя Завоевателя должно принадлежать сильному принцу, а мой сын едва может сжать мою руку. Мейстеры укутывают его согретой шерстью и тихо переговариваются. Ни один не обещает, что он доживёт до рассвета.\n\nАлисанна верит, что ножи в Девичьем Пруду ускорили его рождение. Хуже того: она думает, что, искупавшись в водах Джонквиль, могла бы придать ему сил. Разве мудро говорить убитой горем матери, что эти воды бессильны?\n\n#bold Он мой первенец, моя кровь и наследник всей державы. Он должен жить.#!"
 fab_aegon.0010.a:0 "Не давайте жаровням погаснуть. Пусть ему будет тепло."
 fab_aegon.0011.t:0 "Третий день"
 fab_aegon.0011.desc:0 "Уже три дня весь мир умещается в колыбели.\n\nЭйгон дышит неглубоко и неровно. Во время каждой паузы Алисанна успевает вцепиться в мою руку; с каждым слабым вздохом отпускает её. Великий мейстер Бенифер испробовал тёплое козье молоко, пар, молитвы и все снадобья, известные Цитадели. Теперь ему остаётся лишь стоять рядом и считать вдохи.\n\nЗа стенами лорды ждут вестей о наследнике. Над городом молчат колокола. Железный трон повелевает семью королевствами, но всей моей власти не хватит, чтобы купить хоть один более сильный удар крошечного сердца.\n\nЗа окнами сгущается ночь. Эйгон открывает тёмные, ещё не умеющие различать мир глаза и издаёт едва слышный звук.\n\n#bold Прощание это или вызов — знают только боги.#!"
 fab_aegon.0011.a:0 "Дыши, мой сын. Просто дыши."
 fab_aegon.0013.t:0 "Колыбель замолкает"
 fab_aegon.0013.desc:0 "Перед рассветом Эйгон забывает сделать следующий вдох.\n\nМейстер ждёт, прислушивается и склоняет голову. Алисанна берёт сына на руки прежде, чем его успевают накрыть. Он прожил три дня. Достаточно, чтобы получить имя. Чтобы его полюбили. Чтобы все наши надежды превратились в горе, обретшее вес и очертания.\n\nВ летописях его назовут принцем Эйгоном. Мой первенец. Наследник Железного трона на три коротких дня. Чернильная строка между рождением и погребением. Ни одно перо не опишет тепло его ладошки, обхватившей кончик моего пальца, и то, как исступлённо мать умоляла его остаться.\n\n#bold Королевство потеряло принца. Мы потеряли ребёнка.#!"
 fab_aegon.0013.a:0 "Пусть колокола звонят по Эйгону, нашему первенцу."
 fab_aegon.0014.t:0 "Крик крепнет"
 fab_aegon.0014.desc:0 "Тишина прерывается.\n\nЭйгон делает глубокий вдох, наполняя маленькую грудь, затем ещё один. Когда мейстер протягивает руки, наш сын кричит громче, чем когда-либо прежде. Крик тонкий и сердитый, но Алисанна смеётся, словно разом зазвонили все колокола Королевской Гавани.\n\nК рассвету он выпил молока. К полудню с кожи сошла сероватая бледность. Бенифер предупреждает, что за таким маленьким ребёнком придётся следить ещё много лун. Но даже он не может отрицать очевидного: принц миновал тень и выбрал жизнь.\n\nОдну руку я кладу на колыбель, другой беру ладонь Алисанны. Наш первенец жив. У королевства есть принц, а у меня — наследник, одержавший первую победу ещё до того, как научился держать голову.\n\n#bold Пусть певцы видят в этом какое угодно предзнаменование. Мой сын дышит.#!"
 fab_aegon.0014.a:0 "Эйгон будет известен всему королевству как мой наследник."
 fab_aegon_cradle_shield:0 "Неусыпная забота"
 fab_aegon_cradle_shield_desc:0 "Мейстеры и повитухи неусыпно следят за этим хрупким новорождённым, чей каждый вздох может быть последним."
 fab_aegon_survived_cradle_modifier:0 "Милость колыбели"
 fab_aegon_survived_cradle_modifier_desc:0 "Этот ребёнок родился раньше срока и казался обречённым, но пережил опасные первые дни жизни."
