 fab_aegon.0001.t:0 "Дорога к Девичьему Пруду"
 fab_aegon.0001.desc:0 "Наше первое продвижение привело нас наконец к Девичьему пруду, где все ворота увешаны цветами и каждый колокол звонит, ожидая прибытия короля и королевы. Алисанна встречает их приветствие, положив одну руку на небольшой выступ под платьем. Если боги добры, наш первый ребенок родится еще до того, как пройдет еще год.\n\nЛорд Мутон открыл для нее Пруд Джонквиль. Местные жители клянутся, что его теплые воды исцеляли бесплодных женщин, залечивали старые раны и благословляли младенцев, еще находящихся в утробе матери. Даже самый мудрый мейстер не сможет заставить Алисанну пренебречь столь нежной надеждой. Она смеется, когда я называю это сказкой для прачек, и говорит, что короли были бы мудрее, если бы они время от времени слушали прачек.\n\nВ баню могут войти только женщины. Сир Джоффри Доггетт и сир Джайлс Морриген должны дежурить за дверями, в то время как Алисанна входит внутрь со своими дамами и святыми сестрами, которые присматривают за бассейном.\n\n#bold Это место покоя, любимое Девой. Какой вред может найти ее здесь? #!"
 fab_aegon.0001.a:0 "Пусть королева отдохнёт. Дорога утомила её."
 fab_aegon.0002.t:0 "Кинжалы под белыми одеждами"
 fab_aegon.0002.desc:0 "Крик из бани заглушает каждый колокол в Девичьем пруду.\n\nТри святые сестры вытащили из-под одежд длинные ножи, когда Алисанна подошла к воде. Розамунда Болл бросилась перед королевой и вонзила клинок глубоко в живот. Пруденс Селтигар получила ранение в плечо. У септы Эдит на щеке красные пятна. Они сдерживали женщин, пока Доггетт и Морриген не выломали зарешеченную дверь с мечами в руках.\n\nДвое из потенциальных убийц умерли на мокрых камнях. Третья живет в темницах лорда Мутона, хотя у нее больше сломанных зубов, чем целых. Алисанна нетронута, и мейстер клянется, что ребенок внутри нее все еще жив, но моя королева не может перестать смотреть на кровь Розамунды на ее платье.\n\nОна пришла за благословением Девы. Она считала убийство священной привычкой.\n\n#bold Тот, кто послал эти ножи, намеревался убить мою жену, моего будущего ребенка и мир, который мы так старались установить. #!"
 fab_aegon.0002.a:0 "Охранять Алисанну. Заботиться о её женщинах. Поставить все ворота под наблюдение."
 fab_aegon.0004.t:0 "Виноватые и невинные"
 fab_aegon.0004.desc:0 "Розамунд Болл продержалась три дня, прежде чем рана в животе забрала ее. Алисанна сидела рядом с ней до конца.\n\nВыжившая убийца назвала имена еще шести человек в Девичьем Пруду, которые разделяли ее цели. Лорд Мутон казнит каждого из них, а кроме того, изгонит всех святых сестер из Пруда Джонквиль. Он боится, что под любой белой одеждой может скрываться еще один нож.\n\nУ Алисанны этого не будет. «Вешайте виновных, если их вина доказана», — говорит она нам, ее щека бледна под пятнами бессонных ночей. — Но я не стану отвечать на смелость Розамунды, отомстив женщинам, не причастным к ее смерти. В мантии не было кинжала. Это сделала женщина.\n\nЕсть лорды, которые назовут ее милосердие слабостью. Они не были в скользкой от крови луже и не видели, как три верные женщины положили свои тела перед своей королевой.\n\n#bold Правосудие должно отличать одно лицо от другого, иначе это всего лишь резня, одетая в королевские цвета. #!"
 fab_aegon.0004.a:0 "Судить тех, кого она назвала. Невинные сёстры останутся невредимы."
 fab_aegon.0005.t:0 "Тень для королевы"
 fab_aegon.0005.desc:0 "Никакой белый плащ не мог последовать за Алисанной в Пруд Джонквиль. Будут и другие двери, закрытые для людей, и другие помещения, за пределами которых должна оставаться Королевская гвардия. Я не оставлю жизнь моей королевы на произвол судьбы во второй раз.\n\nДжонквиль Дарк стоит на коленях перед Железным Троном в кольчуге и длинном алом плаще. Она родилась бастардом, но ни один мужчина во дворе не сможет пристыдить ее ни мечом, ни копьем, и Алисанна ей доверяет. Суд уже нашел имя для женщины, которая будет идти на полшага позади королевы там, где мужчинам это запрещено: Алая Тень.\n\n— Ты будешь охранять ее во время сна и бодрствования, — говорю я Джонквиль. «Ты будешь стоять там, где не смогут мои белые плащи, и, если понадобится, поставишь свою жизнь выше ее».\n\nКогда Джонквиль дает клятву, она смотрит не на меня, а на Алисанну. — С радостью.\n\n#bold Отныне Королева будет отбрасывать тень, вооруженную сталью. #!"
 fab_aegon.0005.a:0 "Встань, Джонквиль Дарк, и береги мою королеву."
 fab_aegon.0010.t:0 "Принц, рождённый слишком рано"
 fab_aegon.0010.desc:0 "Наш сын пришел раньше своего часа.\n\nАкушерка поднимает его на руках, которые кажутся слишком большими для такого маленького ребенка. Кожа у него красная и тонкая, а конечности едва ли толще моих пальцев. На один ужасный момент в зале воцарилась тишина. Затем он прерывисто вздыхает и вскрикивает так слабо, что мне приходится наклониться, чтобы услышать его.\n\nАлисанна называет его Эйгоном. Имя Завоевателя должно принадлежать сильному принцу, но мой сын едва может сжать мою руку. Мейстеры кутают его в теплую шерсть и тихо переговариваются между собой. Никто не обещает нам рассвета.\n\nАлисанна считает, что ножи в Девичьем Пруду ускорили его прибытие. Хуже того, она считает, что, если бы она искупалась в пруду Джонквиль, вода могла бы придать ему силы. Нет мудрости говорить скорбящей матери, что такие воды не имеют силы.\n\n#bold Он мой первенец, моя кровь и наследник всего королевства. Он должен жить. #!"
 fab_aegon.0010.a:0 "Держать все жаровни горящими. Он не должен испытывать недостатка в тепле."
 fab_aegon.0011.t:0 "Третий день"
 fab_aegon.0011.desc:0 "На три дня мир сузился до колыбели.\n\nДыхание Эйгона становится поверхностным и неровным. Каждая пауза длится достаточно долго, чтобы Алисанна могла схватить меня за руку; каждый вздох снова высвобождает его. Великий мейстер Бенифер попробовал теплое козье молоко, пар, молитвы и все настойки, известные в Цитадели. Наконец он может только стоять рядом с нами и считать вдохи.\n\nЗа этими стенами лорды ждут вестей о наследнике. Над городом молча висят колокола. Железный Трон может управлять семью королевствами, но вся моя королевская власть не может купить ни одного более сильного удара этого крошечного сердца.\n\nНочь собирается за окнами. Эйгон открывает глаза, темные и расфокусированные, и издает малейший звук.\n\n#bold Прощание это или вызов, могут знать только боги. #!"
 fab_aegon.0011.a:0 "Дыши, мой сын. Просто дыши."
 fab_aegon.0013.t:0 "Колыбель замолкает"
 fab_aegon.0013.desc:0 "На рассвете Эйгон забывает сделать еще один вдох.\n\nМейстер ждет, слушает и опускает голову. Алисанна берет нашего сына на руки прежде, чем кто-либо сможет его прикрыть. Он прожил три дня. Достаточно долго, чтобы иметь имя, достаточно долго, чтобы его любили, достаточно долго, чтобы каждая надежда, которую мы возлагали на него, превратилась в горе, имеющее вес и форму.\n\nВ анналах его назовут принцем Эйгоном. Мой первенец. Наследник Железного Трона на три коротких дня. Чернильная линия между рождением и погребением. Ни одно перо не напишет, насколько теплой была его рука, обхватившая кончик моего пальца, или как яростно его мать умоляла его остаться.\n\n#bold Королевство потеряло принца. Мы потеряли нашего ребенка. #!"
 fab_aegon.0013.a:0 "Звонить в колокола по Эйгону, первому из наших детей."
 fab_aegon.0014.t:0 "Более сильный крик"
 fab_aegon.0014.desc:0 "Тишина нарушается.\n\nЭйгон делает глубокий вдох, чтобы наполнить его маленькую грудь, затем еще один. Когда мейстер тянется к нему, наш сын отвечает криком, громче любого звука, который он когда-либо издавал. Это тонкий, гневный вопль, но Алисанна смеется так, словно все колокола в Королевской Гавани прозвенели одновременно.\n\nК восходу солнца он взял молоко. К полудню серый налет покинул его кожу. Бенифер предупреждает, что за ребенком, родившимся таким маленьким, нужно присматривать в течение многих лун, но даже он не может отрицать то, что его ждет: принц прошел через тень и выбрал жизнь.\n\nЯ кладу одну руку на колыбель, а другую на руку Алисанны. Жизнь наших первенцев. У королевства есть свой принц, а у меня есть наследник, чья первая победа была одержана еще до того, как он смог поднять голову.\n\n#bold Певцы сделают из этого какое угодно предзнаменование. Мой сын дышит. #!"
 fab_aegon.0014.a:0 "Эйгон будет известен всему королевству как мой наследник."
 fab_aegon_cradle_shield:0 "Неусыпная забота"
 fab_aegon_cradle_shield_desc:0 "Мейстеры и повитухи неусыпно следят за этим хрупким новорождённым, чей каждый вздох может быть последним."
 fab_aegon_survived_cradle_modifier:0 "Милость колыбели"
 fab_aegon_survived_cradle_modifier_desc:0 "Родившись прежде срока и считавшийся обречённым, этот ребёнок пережил опасные первые дни жизни."
