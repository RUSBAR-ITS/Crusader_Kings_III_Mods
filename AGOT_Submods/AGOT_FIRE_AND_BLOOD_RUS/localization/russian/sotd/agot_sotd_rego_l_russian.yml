 fab_rego.0001.t:0 "Лорд Воздуха"
 fab_rego.0001.desc.shivers:0 "Лорд Рего Драз лежит мёртвый в грязи Пекла. Мне говорят, его голову размозжили так, что уже нельзя закрыть глаза.\n\nЕго несли из Красного замка в особняк на Шёлковой улице, в том самом позолоченном паланкине, над которым город смеялся десять лет. В самом сердце Пекла его обступила толпа. Дюжина голодных, полупьяных мужчин, наслушавшихся разговоров, которыми полны улицы с наступления холодов: хлеб подорожал втрое, трясучку завезли на корабле, а королевские деньги считает пентосиец. Носильщики опустили паланкин и разбежались.\n\nОдин из нападавших выворотил булыжник из мостовой, которую я велел вымостить, и бил им Рего снова и снова, пока не закончил.\n\nЯ сделал Рего лордом, потому что магистры Пентоса не принимали его в свой круг: богатство не искупало низкого происхождения. У него не было ни земли, ни замка, ни верных воинов. За это мой собственный двор прозвал его Лордом Воздуха, и он смеялся над этой шуткой громче всех в зале. Одиннадцать лет он наполнял мою казну и ни разу не обманул меня в счетах. Его убили в четверти мили от моих ворот за то, что он родился по другую сторону Узкого моря.\n\n#bold Где-то в Пекле лежит камень с кровью моего друга. И где-то есть рука, которая его подняла.#!"
 fab_rego.0001.desc:0 "Лорд Рего Драз лежит мёртвый в грязи Пекла. Мне говорят, его голову размозжили так, что уже нельзя закрыть глаза.\n\nЕго несли из Красного замка в особняк на Шёлковой улице, в том самом позолоченном паланкине, над которым город смеялся десять лет. В самом сердце Пекла его обступила толпа. Дюжина голодных, полупьяных мужчин, наслушавшихся разговоров, которыми полны улицы с наступления холодов: хлеб подорожал втрое, зернохранилища пусты, а королевские деньги считает пентосиец. Носильщики опустили паланкин и разбежались.\n\nОдин из нападавших выворотил булыжник из мостовой, которую я велел вымостить, и бил им Рего снова и снова, пока не закончил.\n\nЯ сделал Рего лордом, потому что магистры Пентоса не принимали его в свой круг: богатство не искупало низкого происхождения. У него не было ни земли, ни замка, ни верных воинов. За это мой собственный двор прозвал его Лордом Воздуха, и он смеялся над этой шуткой громче всех в зале. Одиннадцать лет он наполнял мою казну и ни разу не обманул меня в счетах. Его убили в четверти мили от моих ворот за то, что он родился по другую сторону Узкого моря.\n\n#bold Где-то в Пекле лежит камень с кровью моего друга. И где-то есть рука, которая его подняла.#!"
 fab_rego.0001.a:0 "Поднимите его из грязи. Затем найдите того, кто держал камень."
 fab_rego.0001.a.tt:0 "Тело лорда Рего уносят с улицы и хоронят по обрядам его веры. Начинается охота на убийц."
 fab_rego.0001.b:0 "Окружить Пекло войсками. Никто не выйдет, пока я не узнаю имена."
 fab_rego.0001.b.tt:0 "Золотые плащи перекрывают улицу за улицей в беднейшем квартале Королевской Гавани. Город выдаст убийц — и возненавидит короля за это требование."
 fab_rego.0001.c:0 "Его убила зима, а не люди. Оставим это."
 fab_rego.0001.c.tt:0 "Розыск не начнётся. Убийцы королевского мастера над монетой останутся на свободе, и каждый лорд поймёт, чего стоит королевский мир."
 fab_rego.0010.t:0 "В Пекло"
 fab_rego.0010.desc:0 "Переулок оцепили — сколько бы пользы от этого ни было. Паланкин по-прежнему лежит на боку там, где упал. Любители поживиться чужим соскоблили позолоту до голого дерева. Камень нашли в четырёх шагах от тела, и камень немаленький.\n\nНикто ничего не видел. Так отвечают за каждой дверью этой улицы и ещё трёх соседних. Одиннадцать лет Пекло живёт под защитой королевского мира и прекрасно выучило, что может от меня утаить.\n\nДюжина людей в сорокатысячном городе. Зима. Темнота. Советники говорят, что простой люд сомкнётся над этим делом, как вода над упавшей монетой, и королю мудрее оплакать друга, чем искать убийц.\n\n#bold Мои советники забыли, кто заплатил за мощение этой улицы.#!"
 fab_rego.0010.a:0 "Тогда я сам пройду по его улицам, а Вермитор будет ждать над крышами."
 fab_rego.0010.a.tt:0 "Король лично отправится в Пекло, а над крышами за ним будет скользить тень дракона. Страх развяжет языки быстрее любых поисков. #bold Очень высокая вероятность найти убийц.#!"
 fab_rego.0010.b:0 "Золотые плащи, обыскать каждую лачугу и каждый подвал. Дом за домом."
 fab_rego.0010.b.tt:0 "Городская стража обыщет квартал дом за домом. Это медленнее и грубее; горожане запомнят топот сапог на своих лестницах. #bold Шансы найти убийц — один к одному.#!"
 fab_rego.0010.c:0 "Золотой дракон за имя. Пекло ещё никогда не отказывалось от денег."
 fab_rego.0010.c.tt:0 "Корона заплатит осведомителям в беднейшем квартале города. Пекло продаст своих. #bold Высокая вероятность найти убийц.#!"
 fab_rego.0020.t:0 "Королевское правосудие"
 fab_rego.0020.desc.king:0 "Стоило мне прийти самому — и хватило двух дней.\n\nКороль в Пекле — диковинный зверь. А король, над которым медленно кружит бронзовый дракон, развязывает языки лучше любого золота. Ко второму вечеру у меня было одиннадцать имён. К третьей ночи — одиннадцать человек.\n\nЯ, кажется, надеялся увидеть чудовищ. Но во дворе под Красным замком стоят на коленях торговец рыбой, двое подмастерьев красильщика, человек, похоронивший этой зимой троих детей, и ещё семеро таких же. Тощие. Грязные. Они боятся меня сильнее, чем Рогар Баратеон боялся за всю свою жизнь.\n\nТот, кто поднял камень, без конца повторяет, что у него есть жена. Он сказал это, наверное, уже раз сорок. Ни разу не сказал, что раскаивается. Не думаю, что даже теперь он понимает: ему есть в чём раскаяться.\n\nАлисанна спрашивает, чем их смерть поможет мёртвому человеку. Рего спросил бы меня о цене. Но я одиннадцать лет поддерживал мир в этом городе, а мир, который не отвечает на убийство, — всего лишь слово.\n\n#bold Что бы я завтра ни сделал в этом дворе, всё королевство это запомнит.#!"
 fab_rego.0020.desc.coin:0 "Это обошлось мне дешевле хорошего коня.\n\nОдиннадцать имён, купленных по одному в задней комнате винной лавки возле Мучной улицы. Каждое продал сосед, который всего неделю назад пил вместе с этими людьми. Золотым плащам оставалось лишь подойти к дверям и постучать.\n\nЯ, кажется, надеялся увидеть чудовищ. Но во дворе под Красным замком стоят на коленях торговец рыбой, двое подмастерьев красильщика, человек, похоронивший этой зимой троих детей, и ещё семеро таких же. Тощие. Грязные. Они боятся меня сильнее, чем Рогар Баратеон боялся за всю свою жизнь.\n\nТот, кто поднял камень, без конца повторяет, что у него есть жена. Он сказал это, наверное, уже раз сорок. Ни разу не сказал, что раскаивается. Не думаю, что даже теперь он понимает: ему есть в чём раскаяться.\n\nАлисанна спрашивает, чем их смерть поможет мёртвому человеку. Рего спросил бы меня о цене. Но я одиннадцать лет поддерживал мир в этом городе, а мир, который не отвечает на убийство, — всего лишь слово.\n\n#bold Что бы я завтра ни сделал в этом дворе, всё королевство это запомнит.#!"
 fab_rego.0020.desc:0 "Золотым плащам понадобилось одиннадцать дней и множество выбитых дверей.\n\nОни обыскали квартал подвал за подвалом. К концу поисков Пекло ненавидело стражу куда сильнее, чем когда-либо ненавидело Рего. Но одиннадцать человек они привели.\n\nЯ, кажется, надеялся увидеть чудовищ. Но во дворе под Красным замком стоят на коленях торговец рыбой, двое подмастерьев красильщика, человек, похоронивший этой зимой троих детей, и ещё семеро таких же. Тощие. Грязные. Они боятся меня сильнее, чем Рогар Баратеон боялся за всю свою жизнь.\n\nТот, кто поднял камень, без конца повторяет, что у него есть жена. Он сказал это, наверное, уже раз сорок. Ни разу не сказал, что раскаивается. Не думаю, что даже теперь он понимает: ему есть в чём раскаяться.\n\nАлисанна спрашивает, чем их смерть поможет мёртвому человеку. Рего спросил бы меня о цене. Но я одиннадцать лет поддерживал мир в этом городе, а мир, который не отвечает на убийство, — всего лишь слово.\n\n#bold Что бы я завтра ни сделал в этом дворе, всё королевство это запомнит.#!"
 fab_rego.0020.a:0 "Вспороть их от горла до паха, а останки вывесить на моих стенах."
 fab_rego.0020.a.tt:0 "Убийцам вспорют животы, а тела развесят на стенах Красного замка — на виду у всего города. В Королевской Гавани надолго воцарится тишина."
 fab_rego.0020.b:0 "Повесить их. Смерть есть смерть, и этого довольно."
 fab_rego.0020.b.tt:0 "Одиннадцать человек просто повесят на виселице. Город усвоит урок, хотя и не такой страшный, каким он мог бы стать."
 fab_rego.0020.c:0 "На Стену. Кто проклинал холод, пусть в нём и живёт."
 fab_rego.0020.c.tt:0 "Убийцы наденут чёрное. Ночной Дозор получит одиннадцать новобранцев, которым не придётся по нраву Север. А Вера увидит короля, не пожелавшего проливать кровь, которую можно было пощадить."
 fab_rego.0020.d:0 "Повесить того, кто держал камень. Остальные вернутся домой такими же голодными, как пришли."
 fab_rego.0020.d.tt:0 "Один человек умрёт. Десятеро выйдут со двора живыми и расскажут всему Пеклу о решении короля. Лорды сочтут его слабостью."
 fab_rego.0021.t:0 "Остывший след"
 fab_rego.0021.desc:0 "Ничего. Ни одного имени.\n\nОдиннадцать или двенадцать человек средь бела дня забили лорда насмерть на людной улице. В квартале, где четыре тысячи человек живут друг у друга на головах. И во всей Королевской Гавани не нашлось ни одного свидетеля. Открытые прежде двери заперты. Люди, выпивавшие в тот день на Мучной улице, оказывается, все до единого сидели у постелей своих матерей.\n\nКомандующий золотыми плащами стоит передо мной и объясняет: Пекло защищает своих. Это даже не неповиновение, а привычка, которая старше моего дома. Он прав, и за это мне очень хочется его ударить.\n\nРего Драз пересёк Узкое море по моей просьбе. Одиннадцать лет он служил мне и впервые со времён моего деда привёл королевские финансы в порядок. А я не могу дать ему то единственное, что король обязан дать каждому.\n\n#bold Я вымостил эти улицы, обнёс город стенами и кормил его всю зиму. А он не хочет дать мне одиннадцать имён.#!"
 fab_rego.0021.a:0 "Пекло своих не выдаёт. Что ж, прекратить поиски."
 fab_rego.0021.a.tt:0 "Розыск закончится ничем. Лорды заметят: можно убить королевского мастера над монетой в самой столице — и дожить до старости."
 fab_rego.0021.b:0 "Тогда ответит всё Пекло. Штрафы, порка и отправка в Дозор."
 fab_rego.0021.b.tt:0 "Весь квартал наказывают за деяние дюжины людей. Правосудие не восторжествовало, зато никто в Королевской Гавани не сочтёт короля мягкотелым."
 fab_rego.0030.t:0 "Сыновья Рего Драза"
 fab_rego.0030.desc:0 "В приёмном зале ждут трое юношей, и у всех троих — отцовский нос.\n\nГессио девятнадцать. Уже четыре дня он не отрывается от счётных книг; без записей назовёт мне до последнего медяка, кому и сколько должна Корона. Иллирио семнадцать, и он не может заставить себя посмотреть на меня. Мирио пятнадцать. Он плачет, изо всех сил стараясь, чтобы ни один мускул на лице не дрогнул.\n\nВсе трое — бастарды. Рего не женился на их матерях и никогда не делал вид, будто женился. Но других наследников он не признал. За ними стоят особняк на Шёлковой улице, речные склады, четыре корабля, долги половины лордов Простора и состояние, которое мой мастер над законами осторожно называет затруднением.\n\nОднако по закону им ничего не причитается. Всё имущество безземельного лорда король может просто забрать, и ни один септон в городе не потрудится назвать это кражей.\n\n#bold Рего Драз пересёк Узкое море, потому что Пентос его не принял. Сегодня я решаю, чем Вестерос ему отплатит.#!"
 fab_rego.0030.a:0 "Всё до последней монеты отправится с ними домой, в Пентос. На моих собственных кораблях."
 fab_rego.0030.a.tt:0 "Сыновья Рего увезут всё состояние Драза из Вестероса. На эти деньги они обзаведутся собственными домами в Пентосе. Все Вольные города узнают, как Дракон обходится с чужеземцем, который верно ему служил."
 fab_rego.0030.b:0 "Гессио останется. Дар его отца к счёту не погиб в том переулке."
 fab_rego.0030.b.tt:0 "Гессио Драза принимают при королевском дворе. Оставшееся отцовское состояние отплывает в Пентос вместе с его братьями."
 fab_rego.0030.c:0 "Законных наследников он не оставил. Всё до последней монеты — в казну."
 fab_rego.0030.c.tt:0 "Корона забирает всё имущество Рего Драза. Это нужное, настоящее золото — но и репутация, которой корона расплачивается за него, тоже чего-то стоит."
 fab_rego.0040.t:0 "Пустое место"
 fab_rego.0040.desc:0 "На заседании малого совета пустует место, на которое никто не решается взглянуть.\n\nКандидатуру уже предложили. Достойное имя — для того и нужен десница. Сир Мартин Тирелл из Хайгардена: не наследник чего-либо значительного, зато приятный человек, всеми любимый и уже три года женатый на Флоренс Фоссовей. Ни один лорд Простора не сочтёт такое назначение оскорбительным. А обидами лордов я этой зимой сыт по горло.\n\nЕщё он — говорю это, дважды с ним побеседовав, — человек неумный.\n\nРего мог держать в голове четыре счётные книги и ни в одной цифре меня не обмануть. Тому, кто займёт его кресло, достанется казна, уже оплатившая мор, голод и зиму. А все три бедствия ещё продолжаются.\n\n#bold Кресло — всего лишь кресло. Важно, кто ведёт счёт.#!"
 fab_rego.0040.a:0 "Значит, сир Мартин. Простор будет доволен — а с ним стоит ладить."
 fab_rego.0040.a.tt:0 "Сира Мартина Тирелла назначат мастером над монетой. Он приятен, никому не мешает — и не умеет считать."
 fab_rego.0040.b:0 "Гессио Драз. Со смерти отца он хорошо ведёт эти счета."
 fab_rego.0040.b.tt:0 "Девятнадцатилетний бастард Рего займёт отцовское место. По способностям он оставляет далеко позади всех присутствующих. Но каждый лорд королевства услышит, что Дракон отдал казну сыну заморской шлюхи."
 fab_rego.0040.c:0 "Никого. Сам займусь счетами, пока не найду умелого человека."
 fab_rego.0040.c.tt:0 "Король оставляет казну в собственных руках. Она будет в порядке, но отнимет у него всё время, которого и так не хватает."
 fab_rego.0041.t:0 "Леди, которая считает"
 fab_rego.0041.desc:0 "Мне понадобился почти год, чтобы понять, почему в счетах больше нет ошибок.\n\nВ начале каждой луны сир Мартин сам приносит их мне. Поначалу отвечает толково, но стоит мне заглянуть дальше второй страницы — теряется. На прошлой неделе я заглянул дальше второй страницы. Он покраснел, покосился на дверь и обещал представить нужную сумму к вечеру. Представил. Всё сошлось до последнего медяка.\n\nСчитает его жена. Она ведёт все счета с первого дня его службы. Флоренс Фоссовей училась грамоте и арифметике у дяди, у которого не было сыновей и твёрдых убеждений о том, чем дозволено заниматься дочерям. Уже год она управляет казной Семи Королевств из комнаты в башне Десницы, пока муж относит её расчёты вниз и ставит под ними своё имя.\n\nАлисанна знает об этом не меньше шести лун. Алисанна не сочла нужным меня беспокоить.\n\n#bold Деньги королевства в прекрасных руках. Просто не в тех, в каких королевство думает.#!"
 fab_rego.0041.a:0 "Дело идёт. Оставьте счета в покое, а сиру Мартину — его достоинство."
 fab_rego.0041.a.tt:0 "Вслух ничего не скажут. Сир Мартин останется номинальным мастером над монетой и станет гораздо лучше справляться с обязанностями — по причинам, в которые двор предпочитает не вникать."
 fab_rego.0041.b:0 "Тогда пусть она получит должность и подобающий ей титул."
 fab_rego.0041.b.tt:0 "Леди Флоренс Фоссовей открыто назначат мастером над монетой — первой женщиной на этом посту. Она прекрасно справится. Лорды Семи Королевств поднимут изрядный шум."
 fab_rego.0041.c:0 "Мастер над монетой, не умеющий считать, — не мастер над монетой. Вон обоих."
 fab_rego.0041.c.tt:0 "Сира Мартина отстранят вместе с женой. Дома Тиреллов и Фоссовеев запомнят это унижение."
 fab_flea_bottom_sealed_modifier:0 "Пекло в оцеплении"
 fab_flea_bottom_sealed_modifier_desc:0 "Золотые плащи стоят у входа в каждый переулок. Город повинуется — и запоминает."
 fab_flea_bottom_cowed_modifier:0 "Память о королевском правосудии"
 fab_flea_bottom_cowed_modifier_desc:0 "То, что сделали с убийцами лорда Рего, было сделано на виду у всего города. Королевская Гавань не забыла и не собирается забывать."
 fab_kings_mercy_modifier:0 "Милосердие голодного короля"
 fab_kings_mercy_modifier_desc:0 "У короля убили друга, а он ответил хлебом. Простолюдины Королевской Гавани будут рассказывать об этом целое поколение."
 fab_rego_fortune_seized_modifier:0 "Состояние Драза конфисковано"
 fab_rego_fortune_seized_modifier_desc:0 "Корона забрала богатство чужеземного лорда в ту же неделю, когда его похоронили. Об этом узнали все торговцы от Браавоса до Волантиса, и теперь их корабли заходят в другие порты."
 fab_rego_plot_armor_modifier:0 "Королевские врачи"
 fab_rego_plot_armor_modifier_desc:0 "Мастер над монетой — тучный человек, лучшие годы которого позади, и корона не может его потерять. Мейстеры Красного замка следят за его здоровьем, хочет он того или нет."
 fab_florence_counts_modifier:0 "Счета ведёт супруга"
 fab_florence_counts_modifier_desc:0 "Сир Мартин выносит счётные книги из кабинета и ставит под ними своё имя. Каждую цифру в них вписала его жена."
 fab_rego_justice_opinion:0 "Ответ на убийство королевского слуги"
 fab_rego_unavenged_opinion:0 "Оставил королевского слугу неотмщенным"
 fab_foreign_coin_opinion:0 "Заморский бастард в малом совете"
 fab_lady_of_coin_opinion:0 "Женщина назначена мастером над монетой"
