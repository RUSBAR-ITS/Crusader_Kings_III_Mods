l_russian:
 fab_rego.0001.t:0 "Повелитель Воздуха"
 fab_rego.0001.desc.shivers:0 "Лорд Рего Драз мертв в грязи Блошиного Конца, и мне сказали, что от его головы не осталось ничего, чтобы закрыть глаза.\n\nЕго везли из Красного замка в его особняк на Шелковой улице, в том позолоченном паланкине, над которым город смеялся уже десять лет. В самом сердце Блошиного Конца его окружила толпа. Дюжина мужчин, голодных, полупьяных и полных тех же разговоров, которые проносились по моим улицам с тех пор, как пришли холода, — что хлеб стоит в три раза дороже, что Дрожь сошла на берег с корабля и что человек, который считает королевскую монету, — пентоши. Носильщики поставили его на землю и побежали.\n\nОдин из них оторвал булыжник от улицы, которую я проложил, и обрушивал его на него снова и снова, пока работа не была закончена.\n\nЯ сделал Рего лордом, потому что магистры Пентоса не хотели, чтобы он был низкородным и богатым. У него не было ни земли, ни замка, ни заклятого меча; мой собственный двор прозвал его за это Повелителем Воздуха, и он смеялся над этой шуткой громче, чем любой мужчина в зале. Он наполнял мою сокровищницу в течение одиннадцати лет и ни разу не солгал мне о цифре. Его убили в четверти мили от моих ворот за то, что он родился за Узким морем.\n\n#bold Где-то в Блошином Конце есть камень, на котором лежит кровь моего друга, и рука, поднявшая его. #!"
 fab_rego.0001.desc:0 "Лорд Рего Драз мертв в грязи Блошиного Конца, и мне сказали, что от его головы не осталось ничего, чтобы закрыть глаза.\n\nЕго везли из Красного замка в его особняк на Шелковой улице, в том позолоченном паланкине, над которым город смеялся уже десять лет. В самом сердце Блошиного Конца его окружила толпа. Дюжина мужчин, голодных, полупьяных и полных тех же разговоров, которые проносились по моим улицам с тех пор, как пришли холода, — что хлеб стоит в три раза дороже, что зернохранилища пусты и что человек, который считает королевскую монету, — пентоши. Носильщики поставили его на землю и побежали.\n\nОдин из них оторвал булыжник от улицы, которую я проложил, и обрушивал его на него снова и снова, пока работа не была закончена.\n\nЯ сделал Рего лордом, потому что магистры Пентоса не хотели, чтобы он был низкородным и богатым. У него не было ни земли, ни замка, ни заклятого меча; мой собственный двор прозвал его за это Повелителем Воздуха, и он смеялся над этой шуткой громче, чем любой мужчина в зале. Он наполнял мою сокровищницу одиннадцать лет и ни разу не солгал мне о цифре. Его убили в четверти мили от моих ворот за то, что он родился за Узким морем.\n\n#bold Где-то во Блошином Конце есть камень, на котором лежит кровь моего друга, и рука, поднявшая его. #!"
 fab_rego.0001.a:0 "Поднимите его из грязи. Затем найдите того, кто держал камень."
 fab_rego.0001.a.tt:0 "Тело лорда Рего уносят с улицы и хоронят по обрядам его веры. Начинается охота на убийц."
 fab_rego.0001.b:0 "Окружить Блошиный Конец войсками. Никто не выйдет, пока я не узнаю имена."
 fab_rego.0001.b.tt:0 "Золотые плащи перекрывают улицу за улицей в беднейшем квартале Королевской Гавани. Город выдаст убийц — и возненавидит короля за это требование."
 fab_rego.0001.c:0 "Его убила зима, а не люди. Оставь это."
 fab_rego.0001.c.tt:0 "Никакой охоты не объявляется. Убийцы королевского мастера над монетой выходят на свободу, и каждый лорд в королевстве отметит, чего стоит королевский мир."
 fab_rego.0010.t:0 "В Блошиный Конец"
 fab_rego.0010.desc:0 "Они перегородили переулок, чего бы это ни стоило. Паланкин все еще лежит на боку, там, где он упал, позолота соскоблена до голого дерева людьми, помогающими себе. Камень был найден в четырех шагах от него, и это немаленький камень.\n\nНикто ничего не видел. Это ответ у каждой двери на этой улице и у каждой двери на трех улицах за ней. Блошиный Конец прожило под Королевским Миром одиннадцать лет и точно усвоило, сколько себя оно может скрывать от меня.\n\nДюжина мужчин в сорокатысячном городе зимой, в темноте. Мой совет говорит мне, что простой народ сомкнется из-за этого, как вода из-за упавшей монеты, и что королю разумнее скорбеть, чем охотиться.\n\n#bold Мой совет забыл, кто заплатил за асфальтирование этой улицы. #!"
 fab_rego.0010.a:0 "Тогда я сам пройду по его улицам, а Вермитор будет ждать над крышами."
 fab_rego.0010.a.tt:0 "Король лично спускается в Блошиный Конец, а тень дракона пересекает крыши позади него. Террор выведает имена быстрее, чем любой поиск. #bold Очень вероятно, что убийц найдут.#!"
 fab_rego.0010.b:0 "Золотые плащи. Каждая лачуга, каждый подвал, дверь за дверью."
 fab_rego.0010.b.tt:0 "Городская стража обыскивает квартал за домом. Медленнее, грубее, и город запомнит ботинки на лестнице. #bold Равный шанс найти убийц.#!"
 fab_rego.0010.c:0 "Золотой дракон за имя. Блошиный Конец ещё никогда не отказывался от монет."
 fab_rego.0010.c.tt:0 "Корона покупает информаторов в беднейшем квартале города. Блошиный Конец продаст свое. #bold Вероятно, убийц найдут.#!"
 fab_rego.0020.t:0 "Королевское правосудие"
 fab_rego.0020.desc.king:0 "Прошло два дня, прежде чем я вошел сам.\n\nКороль Блошиного Конца — странное животное, а король Блошиного Конца с бронзовым драконом, медленно кружащим над крышами, — вещь, от которой не развязывает языки никакая монета. Ко второму вечеру у меня было одиннадцать имен, а к третьей ночи — одиннадцать мужчин.\n\nДумаю, мне хотелось монстров. Во дворе под Красным замком стоят на коленях торговец рыбой, двое учеников красильщика, человек, похоронивший этой зимой троих детей, и еще семеро, вырезанные из той же ткани. Тонкий. Грязный. Боился меня больше, чем Рогар Баратеон за всю свою жизнь.\n\nТот, кто поднял камень, не перестанет говорить, что у него есть жена. Он сказал это, наверное, раз сорок. Он ни разу не сказал, что сожалеет, и я не думаю, что он даже сейчас понимает, что сделал что-то, о чем человек мог бы сожалеть.\n\nАлисанна спрашивает, какую пользу принесет их смерть уже мертвому человеку. Рего бы спросил у меня цену. Но я поддерживаю мир в этом городе уже одиннадцать лет, и мир, который не ответит на убийство, — это всего лишь слово.\n\n#bold Что бы я ни делал завтра во дворе, все королевство выучит это наизусть. #!"
 fab_rego.0020.desc.coin:0 "Это стоило мне меньше, чем хорошая лошадь.\n\nОдиннадцать наименований, купленных по одному в задней части винного магазина на Мучной улице, каждое продано соседом, который неделю назад выпивал с этими мужчинами. Золотым плащам оставалось только подойти к дверям и постучать.\n\nДумаю, мне хотелось монстров. Во дворе под Красным замком стоят на коленях торговец рыбой, двое учеников красильщика, человек, похоронивший этой зимой троих детей, и еще семеро, вырезанные из той же ткани. Тонкий. Грязный. Боился меня больше, чем Рогар Баратеон за всю свою жизнь.\n\nТот, кто поднял камень, не перестанет говорить, что у него есть жена. Он сказал это, наверное, раз сорок. Он ни разу не сказал, что сожалеет, и я не думаю, что он даже сейчас понимает, что сделал что-то, о чем человек мог бы сожалеть.\n\nАлисанна спрашивает, какую пользу принесет их смерть уже мертвому человеку. Рего бы спросил у меня цену. Но я поддерживаю мир в этом городе уже одиннадцать лет, и мир, который не ответит на убийство, — это всего лишь слово.\n\n#bold Что бы я ни делал завтра во дворе, все королевство выучит это наизусть. #!"
 fab_rego.0020.desc:0 "Золотым плащам потребовалось одиннадцать дней и множество сломанных дверей.\n\nОни прошли подвал за подвалом, и к концу Блошиный Конец возненавидел Дозор гораздо сильнее, чем Рего. Но они вышли с одиннадцатью мужчинами.\n\nДумаю, мне хотелось монстров. Во дворе под Красным замком стоят на коленях торговец рыбой, двое учеников красильщика, человек, похоронивший этой зимой троих детей, и еще семеро, вырезанные из той же ткани. Тонкий. Грязный. Боился меня больше, чем Рогар Баратеон за всю свою жизнь.\n\nТот, кто поднял камень, не перестанет говорить, что у него есть жена. Он сказал это, наверное, раз сорок. Он ни разу не сказал, что сожалеет, и я не думаю, что он даже сейчас понимает, что сделал что-то, о чем человек мог бы сожалеть.\n\nАлисанна спрашивает, какую пользу принесет их смерть уже мертвому человеку. Рего бы спросил у меня цену. Но я поддерживаю мир в этом городе уже одиннадцать лет, и мир, который не ответит на убийство, — это всего лишь слово.\n\n#bold Что бы я ни делал завтра во дворе, все королевство выучит это наизусть. #!"
 fab_rego.0020.a:0 "Вспороть их от горла до паха, а останки вывесить на моих стенах."
 fab_rego.0020.a.tt:0 "Убийцы выпотрошены, а их тела висят на стенах Красного замка, где город не может отвести от них взгляд. Королевская Гавань еще очень долгое время будет очень тихим городом."
 fab_rego.0020.b:0 "Повесьте их. Это смерть, и смерти достаточно."
 fab_rego.0020.b.tt:0 "Одиннадцать человек висят на виселице обычным способом. Город усвоил урок, хотя и не так глубоко, как мог бы."
 fab_rego.0020.c:0 "Стена. Люди, проклявшие холод, могут уйти и жить там."
 fab_rego.0020.c.tt:0 "Убийцы берут черное. Ночному Дозору даются одиннадцать человек, которым не понравится север, а Вере дается король, который не пролил кровь, которую мог бы пощадить."
 fab_rego.0020.d:0 "Повесить того, кто держал камень. Остальные вернутся домой такими же голодными, как пришли."
 fab_rego.0020.d.tt:0 "Один человек умирает. Десять выйдут со двора живыми и расскажут всем обитателям Блошиного Конца, что сделал король. Лорды королевства назовут это слабостью."
 fab_rego.0021.t:0 "Остывший след"
 fab_rego.0021.desc:0 "Ничего. Ни одного имени.\n\nОдиннадцать или двенадцать человек забили лорда до смерти на общественной улице посреди дня, в квартале, где четыре тысячи человек живут друг на друге, и во всей Королевской Гавани нет ни одного свидетеля. Двери, которые были открыты, закрыты. Оказывается, все мужчины, которые в тот день пили на Мучной улице, были у постели своей матери.\n\nПередо мной стоит командир моих золотых плащей и говорит, что Блошиный Конец защищает своих, и что это не столько неповиновение, сколько привычка старше моего дома. Он прав, и мне бы очень хотелось его за это ударить.\n\nРего Драз пересек Узкое море, потому что я попросил его об этом. Он прослужил одиннадцать лет и сделал эту корону платежеспособной впервые с тех пор, как ее забрал мой дед. И я не могу дать ему то единственное, что король может дать кому-либо.\n\n#bold Я вымостил эти улицы, обнес город стеной и накормил его зимой, а он не дал мне одиннадцати имен. #!"
 fab_rego.0021.a:0 "Блошиный Конец своих не выдаёт. Пусть будет так. Прекратить поиски."
 fab_rego.0021.a.tt:0 "Охота заканчивается ничем. Лорды королевства заметят, что человек может убить королевского мастера над монетой в столице короля и состариться."
 fab_rego.0021.b:0 "Тогда ответит весь Блошиный Конец. Штрафы, порка и отправка в Дозор."
 fab_rego.0021.b.tt:0 "Весь квартал наказывают за деяние дюжины людей. Правосудие не восторжествовало, зато никто в Королевской Гавани не сочтёт короля мягкотелым."
 fab_rego.0030.t:0 "Сыновья Рего Драза"
 fab_rego.0030.desc:0 "В моей приемной ждут трое молодых людей, и у каждого из них нос отца.\n\nГессио девятнадцать, и бухгалтерские книги открыты уже четыре дня; он может мне сказать медному, что и кому должна корона, без записей. Иллирио семнадцать, и он не может заставить себя взглянуть на меня. Мирио пятнадцать лет, он плачет и изо всех сил старается сделать это, не двигая лицом.\n\nВсе трое — низшего происхождения, общаются с женщинами. Рего никогда не был женат и никогда не притворялся, что женился, и все трое — единственные наследники, которых он потрудился признать. Позади них стоит особняк на Шелковой улице, склады вдоль реки, четыре корабля, долги половины лордов Простора и состояние, которое мой магистр законов осторожно описывает как смущение.\n\nНичто из этого не связано с ними. Лорд, не имеющий земель, не оставляет ничего, что его король не мог бы просто забрать, и ни один септон в этом городе не потрудился бы назвать это воровством.\n\n#bold Рего Драз пересек Узкое море, потому что Пентос его не принял. Сегодня я решу, что Вестерос ему вернет. #!"
 fab_rego.0030.a:0 "Всё до последней монеты отправится с ними домой, в Пентос. На моих собственных кораблях."
 fab_rego.0030.a.tt:0 "Состояние Драза оставляет Вестерос целиком в руках сыновей Рего. На нем в Пентосе построят свои дома — и каждый свободный город услышит, как Дракон обращается с чужеземцем, верно служившим ему."
 fab_rego.0030.b:0 "Гессио останется. Дар его отца к счёту не погиб в том переулке."
 fab_rego.0030.b.tt:0 "Гессио Драза принимают при королевском дворе. Оставшееся отцовское состояние отплывает в Пентос вместе с его братьями."
 fab_rego.0030.c:0 "Законных наследников он не оставил. Считайте каждую его монету в мою сокровищницу."
 fab_rego.0030.c.tt:0 "Корона забирает всё имущество Рего Драза. Это нужное, настоящее золото — но и репутация, которой корона расплачивается за него, тоже чего-то стоит."
 fab_rego.0040.t:0 "Пустое место"
 fab_rego.0040.desc:0 "Малый совет встречается с пробелом, на который никто не смотрит напрямую.\n\nИмя уже предложено, и это хорошее имя, для этого и нужна Рука. Сир Мартин Тирелл из Хайгардена: ничего особенного не наследник, приятный, всеми любимый, вот уже три года женился на Флоренс из дома Фоссовей. Ни один лорд в Просторе не мог на него обидеться, а обиды лордов — это то, от чего мне было сыто этой зимой.\n\nОн тоже, и я говорю это уже дважды поговорив с ним, не умный человек.\n\nРего мог держать в голове четыре книги и не лгать мне ни об одной из них. Кто сядет в это кресло, тот наследует сокровищницу, которая только что заплатила за чуму, голод и зиму, и наследует ее посреди всех трех.\n\n#bold Стул — это всего лишь стул. Важно то, кто ведет подсчет. #!"
 fab_rego.0040.a:0 "Значит, сир Мартин. Простор будет доволен — а с ним стоит ладить."
 fab_rego.0040.a.tt:0 "Сира Мартина Тирелла назначают мастером над монетой. Он приятен, безопасен — и не умеет складывать числа."
 fab_rego.0040.b:0 "Гессио Драз. Со смерти отца он хорошо ведёт эти счета."
 fab_rego.0040.b.tt:0 "Внебрачный сын Рего занимает место отца в девятнадцать лет. Он с большим отрывом самый способный человек в комнате, и каждому лорду в королевстве скажут, что Дракон отдал сокровищницу сыну иностранной шлюхи."
 fab_rego.0040.c:0 "Никто. Я сам посчитаю, пока не найду человека, который сможет."
 fab_rego.0040.c.tt:0 "Король оставляет казну в собственных руках. Она будет в порядке, но отнимет у него всё время, которого и так не хватает."
 fab_rego.0041.t:0 "Леди, которая считает"
 fab_rego.0041.desc:0 "Мне потребовалась большая часть года, чтобы понять, почему счета перестали быть неправильными.\n\nСир Мартин сам приносит их мне каждую луну и отвечает достаточно хорошо поначалу и плохо, как только я перехожу вторую страницу. На прошлой неделе я просмотрел вторую страницу. Он покраснел, взглянул на дверь и сказал, что к вечеру получит фигурку. Он получил это к вечеру. Это было правильно для меди.\n\nЕго жена-леди считает. Она делала все это с того дня, как он сел. Флоренс из дома Фоссовей, обученная письму и арифметике у дяди, у которого не было ни сыновей, ни четкого представления о том, для чего нужна дочь, уже год управляет казной Семи Королевств из солярия в Башне Десницы, в то время как ее муж несет ее арифметику вниз и ставит свое имя внизу.\n\nАлисанна знала это как минимум шесть лун. Алисанна не считала, что стоит меня беспокоить.\n\n#bold Монета королевства в надежных руках. Это просто не те руки, которым верит королевство. #!"
 fab_rego.0041.a:0 "Дело идёт. Оставьте счета в покое, а сиру Мартину — его достоинство."
 fab_rego.0041.a.tt:0 "Вслух ничего не произносят. Сир Мартин остаётся мастером над монетой по имени, а дела ведёт куда лучше — по причинам, в которые двор предпочитает не вникать."
 fab_rego.0041.b:0 "Тогда пусть она получит должность и подобающий ей титул."
 fab_rego.0041.b.tt:0 "Леди Флоренс Фоссовей открыто названа мастером монетного дела, это первая женщина, когда-либо занимавшая это место. Она будет очень хороша в этом. Лорды Семи Королевств будут очень громко об этом говорить."
 fab_rego.0041.c:0 "Мастер над монетой, не умеющий считать, — не мастер над монетой. Вон обоих."
 fab_rego.0041.c.tt:0 "Сир Мартин уволен, и его жена вместе с ним. Дом Тиреллов и дом Фоссовей будут помнить это унижение."
 fab_flea_bottom_sealed_modifier:0 "Блошиный Конец под сталью"
 fab_flea_bottom_sealed_modifier_desc:0 "Золотые плащи стоят в каждом углу каждого переулка. Город подчиняется, и город помнит."
 fab_flea_bottom_cowed_modifier:0 "Память о королевском правосудии"
 fab_flea_bottom_cowed_modifier_desc:0 "То, что сделали с убийцами лорда Рего, было сделано на виду у всего города. Королевская Гавань не забыла и не собирается забывать."
 fab_kings_mercy_modifier:0 "Милосердие голодного короля"
 fab_kings_mercy_modifier_desc:0 "У короля убили друга, а он ответил хлебом. Простолюдины Королевской Гавани будут рассказывать об этом целое поколение."
 fab_rego_fortune_seized_modifier:0 "Состояние Драза конфисковано"
 fab_rego_fortune_seized_modifier_desc:0 "Корона забрала богатство иностранного лорда на той неделе, когда он был похоронен. Об этом слышали все торговцы от Браавоса до Волантиса, и корабли заходили в другое место."
 fab_rego_plot_armor_modifier:0 "Королевские врачи"
 fab_rego_plot_armor_modifier_desc:0 "Мастер над монетой — тучный человек, лучшие годы которого позади, и корона не может его потерять. Мейстеры Красного замка следят за его здоровьем, хочет он того или нет."
 fab_florence_counts_modifier:0 "Его дама считает"
 fab_florence_counts_modifier_desc:0 "Сир Мартин выносит счётные книги из кабинета и ставит под ними своё имя. Каждую цифру в них вписала его жена."
 fab_rego_justice_opinion:0 "Ответ на убийство королевского слуги"
 fab_rego_unavenged_opinion:0 "Оставил королевского слугу неотмщенным"
 fab_foreign_coin_opinion:0 "Посадил иностранного ублюдка в малый совет"
 fab_lady_of_coin_opinion:0 "Женщина назначена мастером над монетой"
