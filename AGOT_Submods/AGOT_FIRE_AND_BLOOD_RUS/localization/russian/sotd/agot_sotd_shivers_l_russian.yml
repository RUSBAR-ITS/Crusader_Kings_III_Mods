l_russian:
 fab_shivers.0001.t:0 "Холод в разгар лета"
 fab_shivers.0001.desc:0 "Вороны прилетают с востока, и каждый несёт одно и то же слово: холод.\n\nВсё началось на островах — Драконьем Камне, Дрифтмарке, маленьких скалах у устья Черноводной. Болезни нет дела до того, что зима ещё не пришла. Человек жалуется на неотступный озноб. Наутро кожа ледяная на ощупь, губы синие, дрожь такая, что под ним ходит ходуном кровать. Ещё через день он чаще всего уже мёртв. Мейстеры дали болезни имя: трясучка.\n\nВеликий мейстер Бенифер говорит, что она распространяется быстрее любого мора, известного по летописям, и не щадит даже сильных. Пока я читаю эти строки, болезнь поднимается по Черноводной к моему городу. Под этой крышей — мой двор, мой совет, моя жена и мои дети.\n\n#bold Боги посылают холод. Скольких моих подданных он намерен забрать?#!"
 fab_shivers.0001.a:0 "Закрыть ворота. Велеть мейстерам готовиться. Молиться."
 fab_shivers.0009.t:0 "Холод уходит"
 fab_shivers.0009.desc:0 "Болезнь исчезла так же внезапно, как появилась.\n\nВесна шестидесятого года приходит поздно и неохотно, но всё же приходит. С первым настоящим теплом трясучка отступает. Больные просыпаются и понимают: лихорадка спала, холод больше не пронизывает кости. Из всех заболевших на ноги встал едва ли каждый пятый. Но тех, кого болезнь пощадила, она отпустила навсегда.\n\nУслышав счёт погибших, я почти жалею, что спросил. Половина малого совета мертва. Треть мейстеров Цитадели. Мор одинаково забирал великих лордов из чертогов и прачек из грязных переулков. Верховный септон умер в Звёздной септе; Вера проведёт долгую зиму, пытаясь понять, что это значит.\n\n#bold Королевство ещё долго будет скорбеть. Но оно выстояло.#!"
 fab_shivers.0009.a:0 "Похоронить мёртвых. Сосчитать живых. Начать сначала."
 fab_shivers.0100.t:0 "Моей дочери холодно"
 fab_shivers.0100.desc:0 "Болезнь вошла в мой дом.\n\nЗа ужином моя дочь Дейнерис — шестилетняя, смышлёная непоседа — пожаловалась на холод, хотя в очагах ревел огонь и зал был тёплым. Алисанна закутала её в меха и пораньше отправила спать. Когда привели мейстера, девочка уже тряслась под тремя одеялами. Маленькие зубы стучали, губы темнели.\n\nДоктрина, которую я создал собственными руками, гласит: такого быть не может. Таргариенам неведомы болезни простых смертных. Это записано, провозглашено; именно это делает мой брак законным в глазах королевства. А моя дочь лежит в постели и дрожит, и слова обращаются у меня во рту в пепел.\n\n#bold Говорят, полтора дня. От первой жалобы на холод до последнего вздоха.#!"
 fab_shivers.0100.a:0 "Нет. Только не она. Приведите мне мейстеров — всех."
 fab_shivers.0101.t:0 "Древнейшая магия"
 fab_shivers.0101.desc:0 "Мейстеры испробовали всё, что знают. Этого мало. Преемник Бенифера не смотрит мне в глаза. Алисанна целые сутки не отходит от постели, а Дейнерис всё сильнее холодеет в её объятиях.\n\nОсталось одно средство. О нём не пишут в книгах мейстеров. Когда мы с сестрой были младенцами, Рейна положила в наши колыбели по яйцу. С тех пор наш дом дарит детям драконьи яйца. Старые сказания, над которыми мейстеры презрительно фыркают, гласят: согретое яйцо рядом с дитём драконьей крови может пробудить огонь, которого боится сама смерть.\n\nЯ мог бы велеть привезти яйцо из гнездовий Драконьего Камня и положить ей в постель. Суеверие. Последняя надежда отчаявшегося отца. Самый призрачный шанс.\n\n#bold Или я могу встать на колени, молиться и покориться воле Семерых.#!"
 fab_shivers.0101.a:0 "Принесите яйцо. Положите рядом с ней и разожгите огонь посильнее."
 fab_shivers.0101.egg_tt:0 "Скорее всего, яйцо останется холодным и мёртвым. Но если в ней действительно сильна драконья кровь — оно, быть может, оживёт. Слабая надежда перед лицом неизбежного горя."
 fab_shivers.0101.b:0 "В яйце нет магии. Я буду молиться, как любой отец."
 fab_shivers.0102.t:0 "День с половиной"
 fab_shivers.0102.desc:0 "Она умерла перед рассветом.\n\nВсё, как предсказывали мейстеры: полтора дня от первой тихой жалобы на холод до последней судороги, после которой наступила неподвижность. Всё это время Алисанна держала её на руках. Держит до сих пор и не даёт унести.\n\nЯ — король Семи Королевств. Я создал доктрину, объявившую миру, что моя кровь не чета другой крови. Что дракон не болеет и не умирает, как простые смертные. Я верил в это. Мне нужно было верить. Но в шестидесятом году я похоронил дочь в холодной земле. Каждый септон и каждый лорд, сомневавшийся во мне, теперь получил доказательство своей правоты — в детской могиле.\n\n#bold Дейнерис из дома Таргариенов. Шесть лет. Значит, и дракон может умереть.#!"
 fab_shivers.0102.a:0 "Оставьте нас. Оставьте нас обоих с ней."
 fab_shivers.0103.hatch_tt:0 "Дейнерис переживёт трясучку. Рядом с ней вылупится дракон, и между ними возникнет связь."
 fab_shivers.0103.t:0 "Огонь пробуждается"
 fab_shivers.0103.desc:0 "В самый тёмный час ночи яйцо треснуло.\n\nМы с Алисанной были рядом и оба услышали этот звук — словно сырое полено лопнуло в жарком огне. Звук шёл от яйца, лежавшего в мехах у бока нашей дочери. Когда зажгли свечу, скорлупа уже раскрылась. Мокрый шипящий дракончик прижимался к холодной коже Дейнерис, и от его прикосновения дрожь утихала.\n\nК утру лихорадка спала. К полудню дочь уже сидела в постели — слабая, как котёнок, и вдвое свирепее, — требуя сказать, как зовут маленького дракона, который не отходит от неё. Мейстеры ничего не могут объяснить. Септоны уже называют это чудом Семерых. Пусть: нам это на руку. Но я знаю, что видел. Древнейшая магия моего дома проснулась во тьме, проникла в холод и вырвала оттуда мою дочь.\n\n#bold Доктрина верна. Моя кровь не чета другой крови. И дракон в её колыбели — тому доказательство.#!"
 fab_shivers.0103.a:0 "Пусть сама даст ему имя. Она заслужила это право."
 fab_shivers.0105.t:0 "Дрожь матери"
 fab_shivers.0105.desc:0 "Спальня опустела. Остались только мы с Алисанной.\n\nДолгое время она не издавала ни звука. Лишь смотрела на маленькое тело под простынёй, зажав рот ладонью, словно могла силой удержать горе внутри. Потом ноги подкосились, и я успел подхватить её, прежде чем она упала.\n\nПосле смерти дочери Алисанна обмякла у меня на руках. Её трясло так сильно, что некоторые испугались: неужели и она заразилась трясучкой? Я обнимал её так крепко, как смел, и каждый толчок её дрожи отдавался в моём теле. Ни корона, ни доктрина, ни молитва, ни дракон не могли ей помочь. Были лишь холодная комната, наш мёртвый ребёнок и страшная тяжесть того, что мы остались живы.\n\n#bold Прежде всего я её муж, а потом уже король. Этой ночью я могу быть только мужем.#!"
 fab_shivers.0105.a:0 "Обнимать её, пока дрожь не утихнет."
 fab_shivers.0106.t:0 "Ближе к богам"
 fab_shivers.0106.desc:0 "Вместе с дыханием Дейнерис в комнату возвращается настоящее тепло.\n\nАлисанна стоит на коленях у постели и снова плачет — светлыми слезами человека, который ещё не верит своему счастью. Наша дочь спит; её щёки румянит жизнь, а не лихорадка. Новорождённый дракон свернулся у её бока, словно тлеющий под золой уголёк. Я беру Алисанну за руку. Вместе мы благодарим Семерых за милость, дарованную нашему дому.\n\nНо боги ответили не травами, не одними молитвами и не мудростью мейстеров. Они ответили огнём. Яйцом. Древней валирийской кровью, пережившей Рок и текущей в наших жилах.\n\n#bold В нас кровь дракона. Мы ближе к богам, чем к людям. Эта ночь тому доказательство.#!"
 fab_shivers.0106.desc.dragon:0 "Вместе с дыханием Дейнерис в комнату возвращается настоящее тепло.\n\nАлисанна стоит на коленях у постели и снова плачет — светлыми слезами человека, который ещё не верит своему счастью. Наша дочь спит; её щёки румянит жизнь, а не лихорадка. Рядом сторожит [daenerys_dragon.GetName], тихо выпуская дым из ноздрей. Я беру Алисанну за руку. Вместе мы благодарим Семерых за милость, дарованную нашему дому.\n\nНо боги ответили не травами, не одними молитвами и не мудростью мейстеров. Они ответили живой связью между нашей дочерью и её драконом. Огонь избрал Дейнерис задолго до того, как за ней пришёл холод.\n\n#bold В нас кровь дракона. Мы ближе к богам, чем к людям. Эта ночь тому доказательство.#!"
 fab_shivers.0106.a:0 "Боги явили истину нашей крови."
 fab_shivers.0108.t:0 "Огонь рядом с ней"
 fab_shivers.0108.desc:0 "Знания мейстеров исчерпаны, а Дейнерис всё сильнее холодеет под их руками. Но одно существо в Красном замке не отходит от её двери.\n\n[daenerys_dragon.GetName] чувствует её боль благодаря связывающим их узам. Дракончик скребёт камни за дверью, шипит и пышет дымом на всякого, кто преграждает ему путь. Дейнерис содрогается — дракон отвечает. Её дыхание слабеет — от его криков дрожат дверные петли.\n\nВеликий мейстер предупреждает: никто не знает, что может натворить испуганный дракон в детской спальне. Алисанна отвечает: Дейнерис зовёт не человека. Этот зверь принадлежит ей; их кровь связана. Быть может, огонь, уже соединившийся с ней, сильнее холода.\n\n#bold Боги привели дракона к двери моей дочери. Осмелюсь ли я не пустить его к ней?#!"
 fab_shivers.0108.a:0 "Пусть [daenerys_dragon.GetName] войдёт к ней. Драконий огонь ответит холоду."
 fab_shivers.0108.dragon_tt:0 "К постели Дейнерис приведут её дракона. Есть лишь слабая надежда, что тепло их связи вернёт её к жизни."
 fab_shivers.0108.b:0 "Не впускать зверя. Доверимся милости Семерых."
 fab_shivers.0110.t:0 "Два белых плаща"
 fab_shivers.0110.desc:0 "Трясучка не щадила ни простолюдинов, ни верных воинов. Двое моих гвардейцев лежат в склепах под Красным замком; их белые плащи сложены и неподвижны. Из семерых стражей моей жизни осталось пятеро.\n\nКороль не может долго оставаться с такой охраной. Всё королевство ждало, кому я окажу честь. Сегодня утром перед Железным троном преклоняют колени двое рыцарей. Сир Райам Редвин с Арбора едва вышел из юношеских лет, но в Просторе уже нет лучшего турнирного бойца. Старые рыцари говорят: со временем он станет лучшим из всех нас. Рядом — сир Робин Шоу, немногословный воин, твёрдый, как камень; из тех, кто не знает усталости и не хвастается.\n\nВеликий мейстер и лорд-командующий одобряют выбор. Приносят белые плащи. Я произношу слова, связывающие обоих службой мне до самой смерти.\n\n#bold Встаньте, сиры, и займите место в Королевской гвардии. Королевство достаточно натерпелось. Пусть снова увидит все семь белых плащей.#!"
 fab_shivers.0110.a:0 "Встаньте и охраняйте своего короля."
 fab_shivers.0120.t:0 "Вопрос престолонаследия"
 fab_shivers.0120.desc:0 "Прошла луна с тех пор, как огонь пробудился у постели Дейнерис. Маленький дракон всё ещё не покидает её: катается на плече по залам, спит, свернувшись на груди, и скалит игольчатые зубы на мейстера, который слишком смело протягивает к ней руки. Двор называет это чудом. Септоны — знамением.\n\nАлисанна называет это судом богов.\n\n«Они вырвали нашу дочь из холода и вернули нам, — говорит она, когда мы остаёмся одни. — Они послали драконий огонь, чтобы спасти её, Джейхейрис. Дейнерис — старшая из наших живых детей. Она родилась раньше Эймона. Девочка она или нет, ты должен перед всем королевством назвать её своей наследницей».\n\nВ её голосе нет гнева, лишь твёрдая уверенность, перед которой склонялись лорды и умолкали септоны. Я назвал Эймона наследником, едва впервые взял на руки. Алисанне это никогда не нравилось. Теперь сами боги словно дали её доводам голос пламени.\n\n#bold Король не должен решать порядок наследования по предзнаменованиям. Но лишь глупец отвернётся от знамения, посланного пламенем и кровью.#!"
 fab_shivers.0120.a:0 "Я король Вестероса, а в Вестеросе сын идёт перед дочерью."
 fab_shivers.0120.b:0 "По такому расчёту у Рейны больше прав на мою корону."
 fab_shivers.0120.c:0 "Что насчёт Эймона? Я назвал его наследником со дня его рождения."
 fab_shivers.0121.t:0 "Закон Завоевателя"
 fab_shivers.0121.desc:0 "«Андальский обычай — не закон Завоевателя, — отвечает Алисанна. — Эйгон никогда не велел каждой дочери уступать каждому сыну. Он не записал таких слов и не произнёс их с Железного трона. Трону ещё нет шестидесяти лет, Джейхейрис. Не превращай вопрос, которого никто не задавал, в древний закон».\n\nЯ напоминаю ей: лорды Вестероса передавали мечи и престолы сыновьям за тысячи лет до появления наших драконов. Она не уступает.\n\n«Отец наследовал Эйгону, потому что был старшим. Да, Эйнис был сыном, но Мейгор — тоже. Первенство определяло рождение. Эйнис родился раньше. Если Завоеватель желал передавать корону иначе, у него было тридцать семь лет, чтобы это провозгласить».\n\nТак мог бы ответить Барт: стройно, без единой щели и достаточно остро, чтобы пустить кровь. Но лорды, преклонившие колени перед Эйгоном, сложили мечи, а не все свои старые обычаи. Король может провозгласить новый закон до заката. На искоренение обычая времён Эпохи Героев может уйти целая жизнь — или война.\n\n#bold Железный трон молод. Королевства под его властью древние.#!"
 fab_shivers.0121.a:0 "Эйгон не оставил такого повеления. Это правда."
 fab_shivers.0122.t:0 "Корона между нами"
 fab_shivers.0122.desc:0 "Мои слова попали в цель — я вижу это прежде, чем она успевает скрыть чувства. Рейна — наша сестра, старше нас обоих. Если первенец всегда должен предшествовать младшим, я не законный король. Королева — Рейна, и корона на моей голове принадлежит ей.\n\n«Возможно, её права были весомее, — наконец говорит Алисанна. — Но ведь не было мирной передачи короны, при которой Рейну обошли. Мейгор украл трон отца, убил её мужа Эйгона у Божьего Ока, силой взял её в жёны и держал дочерей в заложницах, чтобы она повиновалась. По своей прихоти он назвал наследницей Эйрею — и тут же отстранил бы её, родись у него сын. Когда узурпатор умер, Рейна пошла с нами в Королевскую Гавань. Она не подняла против тебя знамя. Она отдала тебе свои силы».\n\nЯ говорю, что суровая необходимость не делает мою корону легче.\n\n«Нет. Но выбор, сделанный, пока кровь Мейгора ещё не высохла на троне, — не священное писание. Королевство было разорвано и молило о короле, за которым пойдут все. Неужели нашу дочь нужно лишить её места лишь потому, что наша сестра не захотела развязать ещё одну войну за своё?»\n\nМы долго молчим. Между нами — корона, снятая с тела дяди и возложенная мне на голову с согласия старшей сестры.\n\n#bold Одни обычаи рождаются из мудрости. Другие — из страха.#!"
 fab_shivers.0122.a:0 "Мейгор запятнал кровью всё. Даже престолонаследие."
 fab_shivers.0123.t:0 "Сын, которого я назвал"
 fab_shivers.0123.desc:0 "Эймону всего пять. Он серьёзен там, где Дейнерис порывиста, осторожен там, где она смела. Уже ходит за мной по двору, волоча деревянный меч по пыли. Перед двором и советом я назвал его наследником. Взять эти слова назад — почти то же, что нарушить клятву.\n\nЛицо Алисанны смягчается. «Я не хочу ничего отнимать у сына. Я прошу лишь перестать отнимать у дочери».\n\n«Корона одна».\n\n«Но её тяжесть мы с тобой несём вместе». Она тянется через стол к моей руке. «Обручи их, если так тебе будет спокойнее. Дейнерис принесёт в этот союз право старшинства, а Эймон — благосклонность лордов, желающих видеть на троне мужчину. Они будут править рядом, как мы. Сильному королю незачем превращать королеву в свою тень».\n\nЯ уже давал ей такой ответ: Эймон — король, Дейнерис — его королева. Их права связаны так же тесно, как кровь. Ни один лорд не сможет противопоставить их друг другу, не поссорив брата с сестрой, мужа с женой. Но разделить корону мужа — не то же самое, что носить собственную. Алисанна это знает.\n\n#bold Брак может соединить два права на престол. Но не определить, какое из них выше.#!"
 fab_shivers.0123.a:0 "Мы вместе несли тяжесть короны. Смогут и они."
 fab_shivers.0124.t:0 "Доводы королевы"
 fab_shivers.0124.desc:0 "Свечи оплывают, пока мы спорим за расписным столом. Алисанна не торопит меня с ответом, но и отмолчаться не позволит. За дверью смеётся Дейнерис: её дракончик пытается поймать зубами тени на стене. Вскоре слышится и голос Эймона. Они ещё дети, которым нет дела до корон. Их родители должны решить, что однажды певцы и мейстеры назовут их правом по рождению.\n\nЭйгон не оставил повеления. Эйнис родился раньше Мейгора, но старшей сестры у него не было. Мейгор так запутал наследование, что моё собственное воцарение можно истолковать как угодно. Лорды держатся обычаев отцов. Боги послали знак живым пламенем. А напротив сидит моя королева и ждёт ответа своего короля и мужа.\n\n#bold Прежде чем догорят свечи, дом Таргариенов должен узнать, чьё имя последует за моим.#!"
 fab_shivers.0124.custom:0 "Эйгон мог молчать, но старые законы королевств — нет."
 fab_shivers.0124.rhaena:0 "Тогда ответь мне прямо: почему я король, а не Рейна?"
 fab_shivers.0124.aemon:0 "Довольно притязаний и обычаев. Эймон — наш сын, и я назвал его наследником."
 fab_shivers.0124.a:0 "Я буду чтить законы земель, которыми правлю. Эймон останется моим наследником."
 fab_shivers.0124.a.tt:0 "Принц Эймон останется наследником Железного трона. Королева Алисанна нескоро забудет отказ в своей просьбе."
 fab_shivers.0124.b:0 "Дейнерис выйдет замуж за Эймона. Пусть правят вместе, как мы."
 fab_shivers.0124.b.tt:0 "Принцесса Дейнерис и принц Эймон будут обручены. Эймон останется наследником Железного трона."
 fab_shivers.0124.c:0 "Боги ответили драконьим огнём. Дейнерис будет моей наследницей."
 fab_shivers.0124.c.tt:0 "Принцесса Дейнерис становится наследницей Железного трона, но помолвку для неё не заключают. Отношение каждого прямого вассала андальского наследия или наследия Первых людей к королю Джейхейрису ухудшится на #N 50#! на 20 лет."
 fab_shivers.0130.t:0 "Огонь отвечает"
 fab_shivers.0130.desc:0 "В покои приводят дракона, опутанного тяжёлыми цепями, — это [daenerys_dragon.GetName]. Дракончик смотрит лишь на Дейнерис. Увидев её, он вырывается, вскарабкивается на покрывала и прижимается к её груди.\n\nМежду зубами вьётся дым. Под чешуёй нарастает жар; меха начинают парить, мейстеры в страхе отступают. Дейнерис перестаёт дрожать. Маленькая ладонь обхватывает тёплый рог. [daenerys_dragon.GetName] укрывает её крыльями, словно хочет заслонить от самой зимы.\n\nК рассвету её губы снова красные. Ещё до полудня она просыпается и шепчет имя дракона. Яйцо не понадобилось: огонь избрал её задолго до прихода холода.\n\n#bold Связь дракона и всадницы сумела проникнуть туда, куда не достигла вся человеческая мудрость.#!"
 fab_shivers.0130.a:0 "Они были связаны до этой ночи. Теперь даже смерть знает это."
 fab_shivers.0130.saved_tt:0 "Дейнерис переживёт трясучку. Рядом останется [daenerys_dragon.GetName] — дракон, с которым она уже связана."
 epidemic_the_shivers:0 "Трясучка"
 fab_shivers_sickbed_modifier:0 "У врат смерти"
 fab_shivers_sickbed_modifier_desc:0 "Закутанная в меха и охраняемая днём и ночью, принцесса цепляется за жизнь — холод не сможет забрать её, пока её судьба всё ещё решается."
 fab_shivers.daenerys_fate_guaranteed_survival_tt:0 "Выбранное правило игры #bold Дети Джейхейриса#! гарантирует, что Дейнерис переживёт трясучку."
 fab_shivers.daenerys_fate_guaranteed_death_tt:0 "Выбранное правило игры #bold Дети Джейхейриса#! гарантирует, что Дейнерис умрёт во время эпидемии трясучки."
 fab_female_heir_outrage_opinion:0 "Отверг древние законы наследования"
