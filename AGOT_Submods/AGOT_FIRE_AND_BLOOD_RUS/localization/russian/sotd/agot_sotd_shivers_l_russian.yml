l_russian:
 fab_shivers.0001.t:0 "Холод в разгар лета"
 fab_shivers.0001.desc:0 "Вороны прилетают с востока, и каждый из них несет одно и то же слово: холод.\n\nОно началось на островах — Драконьем Камне, Дрифтмарке, маленьких скалах у устья Черноводной — и его не волнует, что еще не зима. Мужчина жалуется на озноб, который не может побороть. На следующее утро его кожа становится ледяной на ощупь, губы посинели, и он дрожит так сильно, что кровать дребезжит под ним. К утру после этого он чаще всего уже мертв. Мейстеры уже дали ему имя: Дрожи.\n\nВеликий мейстер Бенифер говорит мне, что она движется быстрее, чем любая чума в истории, и что она не щадит сильных. Он поднимается по Черноводной к моему городу, даже когда я читаю о нем. У меня под этой крышей двор, совет, жена и дети.\n\n#bold Боги посылают холод. Посмотрим, сколько моих людей нужно взять. #!"
 fab_shivers.0001.a:0 "Закрыть ворота. Приготовить мейстеров. Молиться."
 fab_shivers.0009.t:0 "Холод уходит"
 fab_shivers.0009.desc:0 "Так же внезапно, как оно появилось, оно и исчезло.\n\nВесна шестидесятого года приходит поздно и неохотно, но приходит, и с первым настоящим теплом Дрожь теряет свою хватку. Те, кто все еще трясется в своих кроватях, просыпаются и обнаруживают, что лихорадка спала и холод покинул их кости. Не более чем каждый пятый из тех, кого он коснулся, восстал снова, но тех, кого он пощадил, он пощадил навсегда.\n\nКогда я спрашиваю подсчет, мне почти жаль, что я этого не делал. Половина моего маленького совета исчезла. Треть мейстеров Цитадели. Великие лорды в своих залах и прачки в сточных канавах — все они одинаковы. И Верховный септон погиб в Звездной сентябрь, осмысливая который Вера проведет долгую зиму.\n\n#bold Царство будет долго скорбеть. Но царство выстояло. #!"
 fab_shivers.0009.a:0 "Похоронить мёртвых. Сосчитать живых. Начать сначала."
 fab_shivers.0100.t:0 "Моей дочери холодно"
 fab_shivers.0100.desc:0 "Оно пришло в мой собственный дом.\n\nЗа ужином моя дочь Дейнерис — шестилетняя, быстрая, сообразительная и никогда не останавливающаяся — жаловалась, что ей холодно, хотя горел огонь и в зале было тепло. Алисанна завернула ее в меха и пораньше отправила спать. Когда мейстера привели, она дрожала под тремя одеялами, стучала маленькими зубами, губы уже темнели.\n\nДоктрина, которую я построил собственными руками, говорит, что этого не может быть. Таргариены не страдают от болезней простых людей; это написано, это провозглашено, это именно то, что делает мой брак законным в глазах государства. А моя дочь лежит в своей постели и трясется, и слова превращаются в пепел у меня во рту.\n\n#bold Говорят полтора дня. От первого холодного слова до последнего. #!"
 fab_shivers.0100.a:0 "Нет. Только не она. Приведите мне мейстеров — всех."
 fab_shivers.0101.t:0 "Древнейшая магия"
 fab_shivers.0101.desc:0 "Мейстеры сделали все, что могли, и этого недостаточно. Преемник Бенифера не смотрит мне в глаза. Алисанна не отходила от постели уже день и ночь, а Дейнерис холодеет в ее объятиях.\n\nОсталось одно. Этого нет ни в одной книге мейстера. С тех пор, как Рейна снесла яйцо в колыбели моей сестры и меня, когда мы были младенцами, в моем Доме было принято давать драконье яйцо нашим детям — и старые сказки, те, которые обнюхивают мейстеры, говорят, что драконье яйцо, положенное теплым рядом с драконьей кровью, может разбудить огонь, которого боится даже смерть.\n\nЯ мог бы послать за яйцом из инкубаторов Драконьего Камня и положить его ей в постель. Это суеверие. Это отец, у которого ничего не осталось. Это самый слабый и самый холодный шанс.\n\n#bold Или я мог бы встать на колени и помолиться, и позволить Семерым делать то, что они хотят. #!"
 fab_shivers.0101.a:0 "Принесите мне яйцо. Положите его рядом с ней и разведите огонь повыше."
 fab_shivers.0101.egg_tt:0 "Скорее всего, яйцо останется холодным и мёртвым. Но если в ней действительно сильна драконья кровь — оно, быть может, оживёт. Слабая надежда перед лицом неизбежного горя."
 fab_shivers.0101.b:0 "В яйце нет магии. Я буду молиться, как любой отец."
 fab_shivers.0102.t:0 "День с половиной"
 fab_shivers.0102.desc:0 "Она умерла еще до рассвета.\n\nКак и предсказывали мейстеры — полтора дня от ее первой маленькой жалобы на холод до последней дрожи, прошедшей через нее и больше не пришедшей. Алисанна держала ее через все это, держит ее до сих пор и не позволит им забрать ее.\n\nЯ король семи королевств. Я разработал доктрину, которая говорила всему миру, что моя кровь не похожа на другую кровь, что дракон не болеет и не умирает, как это делают обычные люди. Я поверил этому. Мне нужно было в это поверить. И я похоронил свою дочь в холодной земле шестидесятого года, и каждый септон и каждый лорд, когда-либо сомневавшийся во мне, теперь имеют свое доказательство, лежащее в детской могиле.\n\n#bold Дейнерис из дома Таргариенов. Шесть лет. В конце концов, дракон может умереть. #!"
 fab_shivers.0102.a:0 "Оставьте нас. Оставьте нас обоих с ней."
 fab_shivers.0103.hatch_tt:0 "Дейнерис переживает Дрожь. Рядом с ней вылупился дракон, связанный с ней узами."
 fab_shivers.0103.t:0 "Огонь пробуждается"
 fab_shivers.0103.desc:0 "В самый чёрный час ночи яйцо треснуло.\n\nЯ был там, и Алисанна была там, и мы оба слышали это — звук, похожий на треск зеленого дерева в жарком огне, исходивший от яйца, спрятанного в мехах рядом с нашей дочерью. К тому времени, когда свеча зажглась, скорлупа уже раскрылась, и мокрый и шипящий змей прижался к холодной коже Дейнерис, и там, где он коснулся ее, дрожь ослабла.\n\nК утру ее лихорадка спала. К полудню она уже сидела, слабая, как котенок, и вдвое более свирепая, требуя назвать имя маленького дракончика, который не покидал ее. У мейстеров нет объяснений, а септоны уже называют это чудом Семи, и я позволю им, ибо это служит делу. Но я знаю, что я видел. Самая старая магия моего Дома проснулась в темноте, потянулась к холоду и вытащила мою дочь обратно.\n\n#bold Доктрина верна. Моя кровь не похожа на другую кровь. И у меня есть дракон в ее колыбели, чтобы доказать это. #!"
 fab_shivers.0103.a:0 "Позволь ей назвать его. Она заслужила это право."
 fab_shivers.0105.t:0 "Дрожь матери"
 fab_shivers.0105.desc:0 "Спальня опустела, за исключением меня и Алисанны.\n\nДолгое время она вообще не издавала ни звука. Она только смотрела на маленькую фигурку под бельем, прижимая одну руку ко рту, как будто могла силой удержать свое горе внутри. Затем сила покинула ее колени, и я поймал ее прежде, чем она ударилась об пол.\n\nПосле смерти дочери Алисанна рухнула у меня на руках, дрожа так сильно, что некоторые забеспокоились, что и у нее тоже есть Дрожь. Я держал ее так крепко, как только мог, чувствуя, как каждая дрожь проходит через ее тело и проникает в мое. Ни корона, ни учение, ни молитва, ни дракон не могли ответить ей. Была только холодная комната, наш мертвый ребенок и ужасная тяжесть того, что нас оставили в живых.\n\n#bold Я ее муж, прежде чем стать ее королем. Сегодня вечером это все, чем я могу быть. #!"
 fab_shivers.0105.a:0 "Держать её, пока дрожь не пройдёт."
 fab_shivers.0106.t:0 "Ближе к богам"
 fab_shivers.0106.desc:0 "Первое настоящее тепло возвращается в комнату с дыханием Дейнерис.\n\nАлисанна становится на колени возле кровати и снова плачет, но теперь слезы яркие и невероятные. Наша дочь спит, полная жизни, а не лихорадки, а новорожденный дракон сворачивается клубочком у нее на боку, как уголь, сложенный под пеплом. Я беру Алисанну за руку, и мы вместе благодарим Семерых за милость, которую они оказали нашему дому.\n\nОднако боги действовали не только с помощью трав, молитв или мейстерской мудрости. Они ответили огнем. Через яйцо. Через старую кровь, которую Валирия принесла в наши вены от гибели.\n\n#bold Наша кровь — это кровь дракона, она ближе к богам, чем к людям. Эта ночь доказала это. #!"
 fab_shivers.0106.desc.dragon:0 "Первое настоящее тепло возвращается в комнату с дыханием Дейнерис.\n\nАлисанна становится на колени возле кровати и снова плачет, но теперь слезы яркие и невероятные. Наша дочь спит, полная жизни, а не лихорадки, а [daenerys_dragon.GetName] дежурит рядом с ней, из ноздрей тихо поднимается дым. Я беру Алисанну за руку, и мы вместе благодарим Семерых за милость, которую они оказали нашему дому.\n\nОднако боги действовали не только с помощью трав, молитв или мейстерской мудрости. Они ответили через живую связь между нашей дочерью и ее драконом. Огонь выбрал Дейнерис еще до того, как к ней пришел холод.\n\n#bold Наша кровь — это кровь дракона, она ближе к богам, чем к людям. Эта ночь доказала это. #!"
 fab_shivers.0106.a:0 "Боги явили истину нашей крови."
 fab_shivers.0108.t:0 "Огонь рядом с ней"
 fab_shivers.0108.desc:0 "Мейстеры закончили обучение, и Дейнерис становится холоднее под их руками. И все же во всем Красном замке есть одно существо, которое не покидает своей двери.\n\n[daenerys_dragon.GetName] почувствовала ее боль через связь между ними. Птенец царапает камни за пределами палаты больного, шипя дымом на каждого мужчину, преграждающего ему путь. Когда Дейнерис вздрагивает, ей отвечает маленький дракон. Когда ее дыхание прерывается, ее крики сотрясают петли.\n\nВеликий мейстер предупреждает, что ни один человек не может сказать, что может сделать испуганный дракон в детской комнате. Алисанна отвечает, что это не тот мужчина, которого зовет Дейнерис. Этот зверь принадлежит ей, кровь связана с кровью, и, возможно, уже соединенный с ней огонь сильнее холода.\n\n#bold Боги поставили дракона у двери моей дочери. Осмелюсь ли я скрыть это от нее? #!"
 fab_shivers.0108.a:0 "Привести [daenerys_dragon.GetName] к ней. Пусть драконий огонь ответит холоду."
 fab_shivers.0108.dragon_tt:0 "К постели Дейнерис приведут её дракона. Есть лишь слабая надежда, что тепло их связи вернёт её к жизни."
 fab_shivers.0108.b:0 "Оставь зверя снаружи. Мы будем доверять милости Семерых."
 fab_shivers.0110.t:0 "Два белых плаща"
 fab_shivers.0110.desc:0 "Дрожи не щадили ни простых людей, ни заклятого меча. Двое из моей Королевской гвардии лежат в склепах под Красным замком, их белые плащи неподвижно свернуты, а семерых, охраняющих мою жизнь, всего пятеро.\n\nКороль не может долго оставаться так плохо защищенным, и все королевство следило за тем, кого бы я почтил. Этим утром два рыцаря преклоняют колени перед Железным Троном. Сир Риам Редвин из Арбора едва вырос, но в Просторе уже нет лучшего копья; старые рыцари говорят, что он станет лучшим из нас, прежде чем он закончит. Рядом с ним преклоняет колени сир Робин Шоу, более тихий клинок, устойчивый, как камень, из тех, кто никогда не устает и никогда не хвастается.\n\nВеликий мейстер и лорд-командующий одобряют это. Появляются белые плащи, и я говорю слова, которые обязывают этих двоих служить мне до самой смерти.\n\n#bold Поднимитесь, серы, и займите свое место среди Королевской гвардии. Царство достаточно пролило кровь; пусть он снова увидит белые плащи целиком. #!"
 fab_shivers.0110.a:0 "Встаньте и охраняйте своего короля."
 fab_shivers.0120.t:0 "Вопрос престолонаследия"
 fab_shivers.0120.desc:0 "Прошла очередь луны с тех пор, как в постели Дейнерис проснулся огонь, но маленький дракон не покидает ее. Оно ездит на ее плече по коридорам, спит, свернувшись у нее на груди, и скалит игольчатые зубы на любого мейстера, который слишком смело тянется к ней. Суд называет это чудом. Септоны называют это предзнаменованием.\n\nАлисанна называет это судом богов.\n\n«Они потянулись к холоду и вернули нам нашу дочь», — говорит она, когда мы остаемся одни. — Они послали драконий огонь, чтобы сохранить ее, Джейхейрис. Дейнерис — старшая из наших ныне живущих детей. Она пришла раньше Эймона, и девочка или нет, ты должен назвать ее своей наследницей перед всем королевством.\n\nВ ее голосе нет гнева, только та твердая уверенность, которая заставляла лордов преклоняться, а септонов придерживать языки. Я назвал Эймона своим наследником с тех пор, как впервые держал его на руках. Алисанна никогда не терпела это слово с радостью. Теперь кажется, что боги даровали ей голос пламени.\n\n#bold Король не должен устанавливать порядок наследования посредством предзнаменований. Но только глупец отвернется от знамения, посланного в огне и крови. #!"
 fab_shivers.0120.a:0 "Я король Вестероса, а в Вестеросе сын идёт перед дочерью."
 fab_shivers.0120.b:0 "По такому расчёту у Рейны больше прав на мою корону."
 fab_shivers.0120.c:0 "Что насчёт Эймона? Я назвал его наследником со дня его рождения."
 fab_shivers.0121.t:0 "Закон Завоевателя"
 fab_shivers.0121.desc:0 "«Обычаи андалов не являются законом Завоевателя», — отвечает Алисанна. «Эйгон никогда не приказывал, чтобы каждая дочь уступала место каждому сыну. Никакие подобные слова не были записаны его рукой и не произнесены с Железного Трона. Трону еще нет и шестидесяти лет, Джейхейрис. Не делайте древний закон из того, что никогда не было чем-то большим, чем незаданным вопросом».\n\nЯ напоминаю ей, что лорды Вестероса отдали свои мечи и престолы сыновьям за тысячи лет до того, как пришли наши драконы. Она не уступает.\n\n«Наш отец последовал за Эйгоном, потому что он был старшим. Да, Эйнис был сыном, но Мейгор тоже был сыном. Рождение поставило одно перед другим. Эйнис пришел первым. Если Завоеватель хотел, чтобы корона прошла по какому-то другому правилу, у него было тридцать семь лет, чтобы провозгласить это.\n\nИменно такой ответ мог бы дать Барт, сплоченный и достаточно острый, чтобы пролить кровь. Однако лорды, преклонившие колени перед Эйгоном, не отказались от всех своих старых обычаев, сложив мечи. Король может произнести новый закон до захода солнца. Чтобы искоренить обычай, существовавший со времен Эпохи Героев, может потребоваться целая жизнь или целая война.\n\n#bold Железный Трон молод. Королевства под ним древние. #!"
 fab_shivers.0121.a:0 "Эйгон не оставил такого повеления. Это правда."
 fab_shivers.0122.t:0 "Корона между нами"
 fab_shivers.0122.desc:0 "Слова поражают цель; Я вижу это прежде, чем она замолкает. Рейна — наша сестра и старше нас обоих. Если первенец всегда должен стоять перед родившимся после него, я не законный король. Рейна — королева, и корона на моей голове принадлежит ей.\n\n— Возможно, ее претензии были более убедительными, — говорит наконец Алисанна. — И все же не было никакой мирной передачи короны, которой можно было бы отказать Рейне. Мейгор украл трон нашего отца, убил ее мужа Эйгона под Оком Бога, силой взял Рейну в жены и держал ее дочерей в качестве заложников своего послушания. Он назвал Эйрею своей наследницей, когда ему это было угодно, и отказался бы от нее, как только у него родился сын. Когда узурпатор умер, Рейна пошла с нами в Королевскую Гавань. Она не поднимала против тебя знамени. Она дала тебе свою силу.\n\n«Суровая нужда не делает мою корону легче», — говорю я ей.\n\n'Нет. Но выбор, сделанный с кровью Мейгора, все еще мокрой на троне, не является священным писанием. Царство было разорвано, и оно требовало короля, за которым последуют все люди. Неужели у нашей дочери отнимут место, потому что наша сестра не хочет начать новую войну ради своей?\n\nУже долгое время никто из нас не разговаривает. Между нами стоит корона: взятая с трупа дяди и возложенная мне на лоб с разрешения старшей сестры.\n\n#bold Некоторые обычаи рождаются в мудрости. Другие рождаются в страхе. #!"
 fab_shivers.0122.a:0 "Мейгор не оставил ничего не тронутого кровью. Даже престолонаследие."
 fab_shivers.0123.t:0 "Сын, которого я назвал"
 fab_shivers.0123.desc:0 "Эймону всего пять лет. Он торжественен там, где Дейнерис быстрая, осторожен там, где она смелая, и уже следует за мной по двору с волочащимся по пыли деревянным мечом. Перед судом и советом я назвал его своим наследником. Отказаться от этих слов сейчас означало бы нарушить клятву.\n\nЛицо Алисанны смягчается. «Я бы ничего не взял у нашего сына. Я прошу только, чтобы вы прекратили отнимать у нашей дочери».\n\n«Есть одна корона».\n\n— И все же мы с тобой вместе несем его бремя. Она тянется через стол к моей руке. — Обручи их, если это успокоит твои сомнения. Дейнерис вернет старшему право, а Эймону благосклонность тех лордов, у которых будет мужчина. Они будут править бок о бок, как это делали мы. Сильному королю не обязательно делать свою королеву тенью».\n\nЭто ответ, который я дал ей раньше: Эймон как король, Дейнерис как его королева, их притязания связаны так же крепко, как их кровь. Ни один лорд не мог противопоставить одного другого, не натравив брата на сестру, мужа на жену. Однако разделить корону мужа — это не то же самое, что носить собственную, и Алисанна это знает.\n\n#bold Брак может объединить два иска. Оно не может сказать нам, кто стоит выше другого. #!"
 fab_shivers.0123.a:0 "Как мы несли корону вместе, так и они могли бы."
 fab_shivers.0124.t:0 "Доводы королевы"
 fab_shivers.0124.desc:0 "Свечи гаснут, когда наша ссора разворачивается вокруг разрисованного стола. Алисанна не заставляет меня говорить поспешно, но и не позволяет мне отвечать молчанием. За дверью Дейнерис смеется, когда ее детеныш щелкает по теням на стене. Вскоре к ее голосу присоединяется голос Эймона. Они еще дети, не обращающие внимания на короны. Их мать и отец должны выбрать, как певцы и мейстеры однажды назовут свое первородство.\n\nЭйгон не оставил команду. Эйнис предстал перед Мейгором, но перед ним не стояла ни одна старшая сестра. Мейгор настолько осквернил наследование, что моя собственная корона может послужить любой историей, которую человек захочет рассказать. Лорды придерживаются путей своих отцов; боги послали знак живым пламенем; а моя королева сидит напротив меня, ожидая ответа своего короля и мужа.\n\n#bold Прежде чем эти свечи погаснут, Дом Таргариенов должен узнать, чье имя происходит после моего. #!"
 fab_shivers.0124.custom:0 "Эйгон мог молчать, но старые законы королевств — нет."
 fab_shivers.0124.rhaena:0 "Тогда ответь мне прямо: почему я король, а не Рейна?"
 fab_shivers.0124.aemon:0 "Довольно притязаний и обычаев. Эймон — наш сын, и я назвал его наследником."
 fab_shivers.0124.a:0 "Я буду чтить законы земель, которыми правлю. Эймон останется моим наследником."
 fab_shivers.0124.a.tt:0 "Принц Эймон утверждён как наследник Железного Трона. Королева Алисанна не скоро забудет, что Король отказал ей в просьбе."
 fab_shivers.0124.b:0 "Дейнерис выйдет замуж за Эймона. Пусть правят вместе, как мы."
 fab_shivers.0124.b.tt:0 "Принцесса Дейнерис и принц Эймон обручены. Эймон остаётся наследником Железного Трона."
 fab_shivers.0124.c:0 "Боги ответили драконьим огнём. Дейнерис будет моей наследницей."
 fab_shivers.0124.c.tt:0 "Принцесса Дейнерис становится наследницей Железного трона, но помолвку для неё не заключают. Отношение каждого прямого вассала андальского наследия или наследия Первых людей к королю Джейхейрису ухудшится на #N 50#! на 20 лет."
 fab_shivers.0130.t:0 "Огонь отвечает"
 fab_shivers.0130.desc:0 "Они несут [daenerys_dragon.GetName] в камеру под плащом из тяжелых цепей, хотя глаза детеныша направлены только на Дейнерис. В тот момент, когда он видит ее, он вырывается на свободу, карабкается по одеялу и прижимается к ее груди.\n\nДым клубится между его зубами. Жар скапливается под его чешуей, пока меха не запарятся, а мейстеры в страхе не отступят. Дейнерис перестает трястись. Ее маленькая ручка сжимает теплый рог, а [daenerys_dragon.GetName] складывает вокруг нее крылья, как будто защищая ее от самой зимы.\n\nНа рассвете ее губы снова красные. Еще до полудня она просыпается и шепчет имя своего дракона. Никакого яйца не понадобилось, потому что огонь выбрал ее задолго до того, как пришли холода.\n\n#bold Связь между драконом и всадником достигла того, чего не смогла достичь вся человеческая мудрость. #!"
 fab_shivers.0130.a:0 "Они были связаны до этой ночи. Теперь даже смерть знает это."
 fab_shivers.0130.saved_tt:0 "Дейнерис выживает после Дрожи. [daenerys_dragon.GetName], её уже существующий связанный дракон, остаётся рядом с ней."
 epidemic_the_shivers:0 "Дрожь"
 fab_shivers_sickbed_modifier:0 "У врат смерти"
 fab_shivers_sickbed_modifier_desc:0 "Закутанная в меха и охраняемая днём и ночью, принцесса цепляется за жизнь — холод не сможет забрать её, пока её судьба всё ещё решается."
 fab_shivers.daenerys_fate_guaranteed_survival_tt:0 "Выбранное правило игры #bold Дети Джейхейриса#! гарантирует, что Дейнерис выживет после Дрожи."
 fab_shivers.daenerys_fate_guaranteed_death_tt:0 "Выбранное правило игры #bold Дети Джейхейриса#! гарантирует, что Дейнерис умрёт во время Дрожи."
 fab_female_heir_outrage_opinion:0 "Отверг древние законы наследования"
