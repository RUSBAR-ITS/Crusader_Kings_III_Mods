l_russian:
 sotd_rhaena.0001.t:0 "Королева на Востоке"
 sotd_rhaena.0001.desc:0 "Моя сестра Рейна приходит ко мне теперь, когда свадебные пиры закончились, — дважды королева, дважды овдовевшая, гонявшаяся от убежища к убежищу на протяжении всего правления Мейгора. Из трех глав рода моего отца на ее плечах лежит самый тяжелый венец скорбей, и теперь она просит единственное, о чем когда-либо просила меня: место, которое принадлежит ей, куда никто больше не сможет приказать ей прийти или уйти.\n\nЕсть только одно место, достойное ее: Драконий Камень, древняя цитадель нашего дома, где Эйгон мечтал о своем завоевании, а драконы гнездятся в дымящейся горе. Она будет править им самостоятельно, со своим двором вокруг нее и Пламенной Мечты во дворах. Королевство назовет ее Королевой Востока, и оно не ошибется.\n\n#bold Старшая линия занимает старшее место. Это ее долг, и она давно уже это задолжала. #!"
 sotd_rhaena.0001.a:0 "Драконий Камень твой, милая сестра. Никто больше не сдвинет тебя с места."
 sotd_rhaena.0002.t:0 "«Погоня за солнцем»"
 sotd_rhaena.0002.desc:0 "Крылья Пламенной Мечты омрачают двор Красного Замка, и моя сестра вылетает из седла в ярости, которую я не видел со времен жизни Мейгора. Леди Элисса Фарман — ее самая дорогая подруга, хозяйка кораблей Драконьего Камня, сестра ее собственного мужа — ушла. Ночью она сбежала на запад, затем на восток, а вместе с ней и три драконьих яйца из инкубаторов под Драконьей горой.\n\nРейна умоляла меня хранить это в тайне, и это необходимо хранить в тайне: если королевство узнает, что драконьи яйца можно собирать из Драконьего Камня, как яблоки в саду, каждый вор и каждый иностранный принц увидят один и тот же сон. Но тишина — это не то же самое, что праздность. Элисса продала свои драгоценности в Пентосе, и мужчины, описывающие ее, все упоминают одно и то же: она намерена построить корабль, подобного которому никто не видел, и уплыть за пределы карт.\n\nЯйца с ней не поплывут. Яйца тяжелые, а золото еще тяжелее. Она их продаст — и найдется один покупатель достаточно богатый, достаточно близкий и достаточно голодный.\n\n#bold Следуй за золотом. Все золото течет в Браавос. #!"
 sotd_rhaena.0002.a:0 "Корабли и деньги, без лишнего шума. Найдите, куда она их увезла."
 sotd_rhaena.0003.t:0 "Красивые камни"
 sotd_rhaena.0003.desc:0 "Ответ возвращается через узкое море, завернутый в шелк и дерзость. Морской лорд Браавоса сожалеет, что ему ничего не известно ни о каких украденных яйцах; и даже если бы он обладал такими диковинками, замечает он, невылупившиеся драконьи яйца — не что иное, как #italic «красивые камни» #!. На одном дыхании — то же письмо, все, кроме той же фразы — Железный Банк объявляет, что в знак своего высокого уважения к Железному Трону он готов простить большую часть долгов короны.\n\nТакова цена трех драконов: мои долги и мое молчание. Рего Драз называет это лучшей сделкой, которую когда-либо предлагала корона. Возможно, он прав. Но пусть Морской Лорд услышит это, и услышит это ясно: яйца остаются каменными, пока они не перестанут быть каменными.\n\n#bold Если когда-нибудь эти яйца вылупятся, Дворец Морского Лорда сгорит первым. #!"
 sotd_rhaena.0003.debt_tt:0 "Железный Банк прощает большую часть королевских долгов — #bold 1000 золота#! — и дело замолкает. Три яйца остаются в хранилищах Морского владыки... невылупившимися. Пока что."
 sotd_rhaena.0003.a:0 "Принять сделку. Но их предупредили."
 sotd_rhaena.0003.b:0 "#bold (Альтернативная история)#! Никакой банк не покупает кровь дракона. ВОЙНА."
 sotd_rhaena.0004.t:0 "Яйца возвращаются домой"
 sotd_rhaena.0004.desc:0 "Титан Браавоса наблюдал, как мои флоты проходили под его ногами, а лагуна горела. Морской Лорд, назвавший яйца Драконьего Камня «красивыми камнями», узнал, во что превращается камень в драконьем огне; его преемник все-таки был рад обнаружить три яйца в дворцовых хранилищах и еще более рад передать их.\n\nТри яйца — одно черное, как полночь, одно зеленое, как лето, одно кремово-золотое — едут домой в Вестерос в железном сундуке, под охраной которого не сможет пройти ни один живой вор. Что бы ни спало внутри них, оно будет спать под Драконьей горой, где ему и место, или вылупится в колыбели Таргариенов.\n\n#bold То, что было взято у дракона, было взято обратно. Каждый свод через Узкое море примет это к сведению. #!"
 sotd_rhaena.0004.a:0 "Что украдено у драконов, драконы возвращают."
 sotd_rhaena.0005.t:0 "Титан держится"
 sotd_rhaena.0005.desc:0 "Браавос не становится на колени. В городе-лагуне нет полей, которые можно сжечь, и замков, которые нужно разрушить — только вода, камень, туман и деньги, и все четверо победили меня. Мои флоты вернулись домой меньше, чем отплыли, Железный банк потребовал выплатить каждый долг с процентами, а Морской Лорд хранит свои «красивые камни» с учтивостью, более ранящей, чем любая насмешка.\n\nЦарство шепчет, что Старый король пересек море и вернулся с пустой рукой. Шепот правдив. Яйца все еще спят в Браавосе, и мне придется жить с этим знанием.\n\n#bold Некоторые войны теряются в тумане и бухгалтерских книгах. Но яйца остаются каменными до тех пор, пока они не перестанут быть каменными, и Браавос должен еще помнить об этом. #!"
 sotd_rhaena.0005.a:0 "Море побеждало и лучших людей. Но предупреждение остаётся."
 sotd_rhaena.0010.t:0 "Смерти на Драконьем Камне"
 sotd_rhaena.0010.desc:0 "Мрачное известие с острова моей сестры, и оно трижды запечатано. Смерть прокралась через Драконий Камень, словно туман: старый мейстер Кулипер, замерший в своих письмах. Затем, одна за другой, кричали дамы из собственного двора Рейны — Касселла Стонтон, септа Марьям, Алейн Ройс и последняя Саманта Стокворт, которые боролись с этим день и ночь. Рейна заперла свои ворота и просит узнать, какое проклятие пришло в ее зал.\n\nЭто не проклятие. Когда я прочитал письмо совету, лорд Рего Драз замер, а затем назвал его: слезы Лиса, яд отравителя, редкий и бесценный — прозрачная сладкая вода, которая разъедает внутренности и не оставляет следов. Кто-то в этих стенах, кто-то, кто ужинает за столом моей сестры, убивает ее придворную даму за дамой.\n\n#bold Ворон на Драконьем Камне, летящий быстрее страха: это яд. Посмотрите рядом с собой. #!"
 sotd_rhaena.0010.a:0 "Послать ворона. И да помогут боги тому, чьё имя будет в ответе."
 sotd_rhaena.0011.t:0 "Отравитель Драконьего Камня"
 sotd_rhaena.0011.desc:0 "Сказка возвращается по частям, и каждая часть становится хуже. Когда мой ворон достиг Драконьего Камня и Рейна прочитала слова #italic «слезы Лиса» #!, ей не пришлось удивляться. Она вызвала мужа в Зал Расписного стола и положила перед ним письмо — и Эндроу Фарман, этот мягкий улыбающийся ничтожный мужчина, даже не стал отрицать этого. Он #bold хвастался #!. Его сестра ушла, любовь его жены никогда не принадлежала ему, над ним издевались дамы, которые считали его мебелью — поэтому он кормил их ядом и смотрел, как они умирают, и называл это единственной силой, которую ему когда-либо давали.\n\nРейна сказала ему, что он может идти: к окну или к двери, как ему заблагорассудится. Он выбрал окно комнаты Расписного стола, где Эйгон когда-то планировал завоевание континента, и прыгнул.\n\nТо, что от него осталось, моя сестра разрубила на куски и скормила Пламенной Мечте и драконам дворов. В ней тоже есть что-то от Мейгора, что бы там ни утверждали септоны.\n\n#bold Так умрут отравители. Но пять добрых душ ушли, и Драконий Камень никогда больше не будет для нее чистым. #!"
 sotd_rhaena.0011.a:0 "Так умирают отравители. Да упокоят боги дам Драконьего Камня."
 sotd_rhaena.0020.t:0 "У Чёрного Ужаса есть всадник"
 sotd_rhaena.0020.desc:0 "Ворон с Драконьего Камня принёс слова, от которых стынет кровь: Эйрея исчезла — и забрала с собой #bold БАЛЕРИОНА#!.\n\nДочь моего брата, отосланная от моего двора к матери, которую едва знала, одинокая и разъярённая на той мрачной скале, на рассвете вошла в дымящиеся дворы и оседлала самого Чёрного Ужаса. Не дракончика, не одного из молодых драконов — зверя, который был стар уже во время пожара Валирии, дракона Эйгона и Мейгора, самое огромное живое существо в известном мире. Стражники говорят, что она смеялась, когда он взлетел.\n\nОни улетели на восток, над морем, и с тех пор их никто не видел. Тринадцатилетняя девочка верхом на чудовище, которое не удержать никакими выкованными цепями, скрылась вне моей досягаемости — а возможно, и вне чьей-либо.\n\n#bold Найдите её. Каждый корабль, каждый ворон, каждая монета. Найдите её.#!"
 sotd_rhaena.0020.a:0 "Каждый корабль, каждый ворон, каждая монета. Найдите её."
 sotd_rhaena.0021.t:0 "Поиски по всему свету"
 sotd_rhaena.0021.desc:0 "Пол года и ничего. Мои посланники стучались в двери Пентоса, Тироша, Мира и Волантиса; Сам Железный Банк, жаждущий помочь, начиная с вопроса о яйцах, заставил искать тысячи глаз. Говорят, над Спорными землями видели черного дракона. У Лиса видели черного дракона. Люди, желавшие получить мое золото, видели черного дракона там, где не было черного дракона.\n\nРейна летает над побережьем на Пламенной Мечте, пока ее руки не трескаются от ветра. Алисанна зажигает свечи. До поздней ночи я сижу с Бартом, и он говорит то, чего никто из нас не хочет говорить: никто их не видел, потому что Балерион не бывал в землях людей. Есть в этом мире одно место, которое дракон знает лучше любого живого существа, одно место, которое помнит только он один — и это место, откуда ничего не возвращается.\n\n#bold Валирия. Боги добрые, он забрал ее домой, в Валирию. #!"
 sotd_rhaena.0021.a:0 "Продолжайте поиски. Она крови дракона. Она жива."
 sotd_rhaena.0022.t:0 "То, что вернулось из Валирии"
 sotd_rhaena.0022.desc:0 "На тринадцатый день четвертой луны стражники на стенах Красного замка начали кричать — и тень огромных черных крыльев упала на Королевскую Гавань впервые после смерти Мейгора. Балерион вернулся домой.\n\nНо боги, что с ним привезли домой. По левому боку Черного Ужаса проходит рана длиной около девяти футов, наполовину зажившая и ужасная, и его полет — сломанная, трудная вещь. И вцепилась ему в спину, привязанная там лохмотьями, которые когда-то были одеждой — Эйрея. Она представляет собой скелет, обтянутый кожей, волосы спутаны, глаза горят красным. Она горит. Не с лихорадкой, как это знают мейстеры: жар исходит от ее маленького тела, пока воздух над ней не замерцает, и когда Бенифер коснулся ее лба, он отдернул руку, как от чайника. А под ее кожей — я не буду писать то, что я видел, двигаясь под ее кожей.\n\nВеликий мейстер Бенифер отвел ее в свои покои. Я послал за септоном Бартом. Больше никого не допустят.\n\n#bold Что бы она ни нашла в руинах Валирии, это вернулось внутрь нее. #!"
 sotd_rhaena.0022.a:0 "Бенифер и Барт, никого больше. И молитесь."
 sotd_rhaena.0023.t:0 "Огонь внутри"
 sotd_rhaena.0023.desc:0 "Принцесса Эйрея Таргариен умерла за час до рассвета. Только двое мужчин были свидетелями ее последних часов, и один из них никогда не скажет об этом, а другой написал отчет и запечатал его, чтобы его, — говорит он, — не читал ни один из ныне живущих королей.\n\nБарт рассказал мне только это, и его руки дрожали, когда он это рассказывал: они сделали все, что могли сделать люди, и в конце они сотворили единственное милосердие, которое осталось, и этого было недостаточно, и вещи, которые убили ее, были не от этого мира и не предназначены для него. Ей было тринадцать лет. Она хотела любви своей матери, трона своего отца и собственного дракона — и дракон, которого она выбрала, был единственным живым зверем, который помнил дорогу домой в ад.\n\nРейна пришла слишком поздно, чтобы услышать речь дочери. Она в одиночестве подняла пепел на Пламенной Мечте, выше, чем мог видеть любой человек, и развеяла его по ветру. Когда она приземлилась, у нее больше не было слез. Я не верю, что она когда-нибудь снова их получит.\n\n#bold Счет остается запечатанным. Некоторые знания — это рана в мире. #!"
 sotd_rhaena.0023.a:0 "Запечатать отчёт. Некоторые вещи никогда не должны быть прочитаны."
 sotd_rhaena.0024.t:0 "Орден Хранителей Драконов"
 sotd_rhaena.0024.desc:0 "Никогда больше. Вот и весь закон, который я извлекаю из этого горя: никогда больше дитя моего дома не войдет без присмотра во двор дракона и не улетит навстречу своей смерти.\n\nБалерион, слишком сломленный и слишком старый для дикой природы, я вернулся в дымящиеся дворы Драконьего Камня, где Драконий Монт поместит его под охрану. И о нем я учредил новый приказ: #bold Драконьи Хранители#!, семьдесят семьдесят человек в костюмах черной чешуи, поклявшихся охранять драконов Дома Таргариенов день и ночь — и охранять мир от них, а их — от глупостей детей.\n\nМоя сестра Рейна улетела из Драконьего Камня на следующий день после развеивания пепла. Она не удержит остров, говорит она: #italic «Он снова твой, брат. Я не хочу ни места, которое отравила Эндроу, ни двора, который отдал мою дочь Валирии. Драконий Камень теперь не хранит для меня ничего, кроме призраков.'#! Я забрал его обратно в корону, и теперь она бродит из замка в замок, королева скорби.\n\n#bold Вне огня, порядок. Никогда больше. #!"
 sotd_rhaena.0024.desc.no_rhaena:0 "Никогда больше. Вот весь закон, который я извлекаю из этого горя: никогда больше дитя моего дома не войдет без присмотра во двор дракона и не улетит навстречу своей смерти.\n\nБалерион, слишком сломленный и слишком старый для дикой природы, я вернулся в дымящиеся дворы Драконьего Камня, где Драконий Монт поместит его под охрану. И о нем я учредил новый приказ: #bold Драконьи Хранители#!, семьдесят семьдесят человек в костюмах черной чешуи, поклявшихся охранять драконов Дома Таргариенов день и ночь — и охранять мир от них, а их — от глупостей детей.\n\n#bold Вне огня, порядок. Никогда больше. #!"
 sotd_rhaena.0024.a:0 "Из огня — порядок. Никогда снова."
 sotd_rhaena.0025.t:0 "Последнее жало Осы"
 sotd_rhaena.0025.desc:0 "Похоже, один из слухов о черном драконе стоил внимания. Известие пришло из Бархатных холмов к северу от Пентоса: огромная крылатая тень, поселившаяся в высокогорье, и проводник, который поклялся, что сможет привести вооруженных людей к ее логову. Я послал сира Уильяма Осу с дюжиной хороших мечей, чтобы узнать правду.\n\nДракона не было. Никогда не было. Разбойники распространили эту историю, чтобы привлечь любопытных в холмы, и проводник повел сира Уильяма и его людей прямо в засаду. Их вырубили до последнего, в безымянном овраге, ценой моего золота и лжи.\n\nМне говорят, что Оса хорошо зарекомендовала себя — что он пал последним, и что земля вокруг него была густо забита людьми, которых он взял с собой. Чтобы я мог быть уверен, один из агентов лорда Рего выкупил его голову у убийц. Я уверен. Я потерял белый плащ из-за дурацкой затеи, и это я послал его за ним.\n\n#bold Сир Уильям Оса. Храбрый рыцарь, погибший из-за слухов. Из-за этого королевство становится беднее. #!"
 sotd_rhaena.0025.a:0 "Похороните то, что нам вернули, с честью."
 sotd_rhaena.0026.t:0 "Белый плащ для Осы"
 sotd_rhaena.0026.desc:0 "Прошел год с тех пор, как сир Уильям умер в этом безымянном овраге, и его место среди Семи достаточно долго оставалось пустым. О короле судят по мечам, которые он держит ближе всего, и я не торопился с выбором.\n\nРыцарь, который сегодня утром преклоняет колени перед Железным Троном, — это сир Лукамор Стронг — большой, грубый и неутомимый, копье, сбивающее с коней знатных людей на турнире за турниром, и клинок, который, кажется, никогда не устает. В простонародье стали называть его похотливым типом, и ходят слухи о женщинах Королевского леса, но ни один мужчина не подвергает сомнению его храбрость или его умение владеть оружием. Сир Джайлс ручается за него, и для меня этого достаточно.\n\nЯ сам накинул ему на плечи белый плащ, там, где когда-то висела Оса.\n\n#bold Райз, сир Лукамор из Королевской гвардии. Служите лучше, чем я служил человеку, чей плащ носите. #!"
 sotd_rhaena.0026.a:0 "Встань, сир Лукамор. Белый плащ твой."
 sotd_rhaena_barren_modifier:0 "Брак горестей"
 sotd_rhaena_barren_modifier_desc:0 "Дважды вдова и ныне замужем за человеком, которого она не может любить, Рейна Таргариен не родит больше детей."
