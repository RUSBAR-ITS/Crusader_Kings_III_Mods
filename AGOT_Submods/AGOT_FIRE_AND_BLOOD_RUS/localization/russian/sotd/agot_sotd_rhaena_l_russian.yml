l_russian:
 sotd_rhaena.0001.t:0 "Королева на Востоке"
 sotd_rhaena.0001.desc:0 "Когда свадебные пиры заканчиваются, ко мне приходит сестра Рейна — дважды королева, дважды вдова, которую всё правление Мейгора гнали из одного убежища в другое. Из трёх голов дракона, оставшихся от рода моего отца, ей достался самый тяжёлый венец скорбей. Теперь она просит единственное, о чём когда-либо просила меня: собственный дом, где никто уже не посмеет велеть ей приехать или уехать.\n\nЛишь одно владение достойно её: Драконий Камень, древняя твердыня нашего дома. Здесь Эйгон замышлял своё Завоевание; здесь, в дымящейся горе, гнездятся драконы. Рейна будет править по собственному праву, окружённая своим двором, а во дворах замка поселится Пламенная Мечта. Люди назовут её Королевой на Востоке — и будут правы.\n\n#bold Старшей ветви — древнейший замок. Это давно причиталось ей по праву.#!"
 sotd_rhaena.0001.a:0 "Драконий Камень твой, милая сестра. Никто больше тебя не прогонит."
 sotd_rhaena.0002.t:0 "«Летящий за солнцем»"
 sotd_rhaena.0002.desc:0 "Крылья Пламенной Мечты затмевают двор Красного замка. Сестра спрыгивает с седла в такой ярости, какой я не видел со времён Мейгора. Леди Элисса Фарман — её ближайшая подруга, распорядительница кораблей Драконьего Камня, сестра её мужа — исчезла. Ночью она бежала сначала на запад, затем на восток, прихватив три драконьих яйца из гнездовий под Драконьей горой.\n\nРейна умоляет меня сохранить всё в тайне. И тайну придётся сберечь: если королевство узнает, что на Драконьем Камне яйца можно собирать, словно яблоки в саду, об этом начнёт мечтать каждый вор и каждый заморский князь. Но молчать — не значит бездействовать. Элисса продала драгоценности в Пентосе. Все, кто её видел, говорят об одном: она намерена построить невиданный корабль и уплыть за пределы известных карт.\n\nЯйца не отправятся с ней. Яйца весомы, но золото весомее. Она продаст их. И есть один покупатель — достаточно богатый, достаточно близкий и достаточно жадный до такого сокровища.\n\n#bold Ищите золото. Всё золото стекается в Браавос.#!"
 sotd_rhaena.0002.a:0 "Корабли и деньги, без лишнего шума. Найдите, куда она их увезла."
 sotd_rhaena.0003.t:0 "Красивые камни"
 sotd_rhaena.0003.desc:0 "Из-за Узкого моря приходит ответ, обёрнутый в шёлк и дерзость. Морской владыка Браавоса сожалеет, но ему ничего не известно об украденных яйцах. Впрочем, замечает он, даже если бы у него и были подобные диковинки, драконьи яйца, из которых никто не вылупился, — всего лишь #italic «красивые камни»#!. Тут же, в том же письме, едва ли не той же фразой Железный банк объявляет: в знак глубокого уважения к Железному трону он готов простить большую часть долгов Короны.\n\nВот цена трёх драконов: мои долги и моё молчание. Рего Драз считает это самой выгодной сделкой, какую Короне когда-либо предложат. Возможно, он прав. Но пусть Морской владыка ясно услышит: яйца остаются камнями лишь до поры.\n\n#bold Если из этих яиц вылупятся драконы, дворец Морского владыки сгорит первым.#!"
 sotd_rhaena.0003.debt_tt:0 "Железный банк прощает большую часть долгов Короны — #bold 1000 золота#!, — и дело заминают. Три яйца остаются в хранилищах Морского владыки. Драконы в них ещё спят... Пока."
 sotd_rhaena.0003.a:0 "Принять сделку. Но их предупредили."
 sotd_rhaena.0003.b:0 "#bold (Альтернативная история)#! Ни одному банку не купить кровь дракона. ВОЙНА."
 sotd_rhaena.0004.t:0 "Яйца возвращаются домой"
 sotd_rhaena.0004.desc:0 "Браавосский Титан смотрел, как мои корабли проходят у него между ног, а лагуна пылала. Морской владыка, назвавший яйца Драконьего Камня «красивыми камнями», узнал, во что превращается камень в драконьем огне. Его преемник был рад всё-таки обнаружить три яйца в дворцовых хранилищах — и ещё больше рад их отдать.\n\nТри яйца — чёрное, как полночь, зелёное, как лето, и кремовое с золотом — возвращаются в Вестерос в железном сундуке. Такую охрану не миновать ни одному вору. Кто бы ни спал внутри, он будет спать под Драконьей горой, где ему и место, или вылупится в колыбели Таргариена.\n\n#bold Украденное у дракона возвращено. Пусть хозяева всех сокровищниц за Узким морем примут это к сведению.#!"
 sotd_rhaena.0004.a:0 "Что украдено у драконов, драконы возвращают."
 sotd_rhaena.0005.t:0 "Титан держится"
 sotd_rhaena.0005.desc:0 "Браавос не преклонил колени. В городе на лагуне нет ни полей, которые можно сжечь, ни замков, которые можно сокрушить. Только вода, камень, туман и деньги — и всё это оказалось сильнее меня. Мои флотилии вернулись поредевшими. Железный банк потребовал вернуть все долги с процентами. Морской владыка хранит свои «красивые камни» с учтивостью, которая ранит больнее любой насмешки.\n\nВ королевстве шепчутся: Старый король протянул руку за море, а вернулся ни с чем. Это правда. Яйца по-прежнему спят в Браавосе, и мне придётся с этим жить.\n\n#bold Иные войны проигрывают в тумане и счётных книгах. Но яйца остаются камнями лишь до поры — и Браавосу стоит об этом помнить.#!"
 sotd_rhaena.0005.a:0 "Море побеждало и лучших людей. Но предупреждение остаётся."
 sotd_rhaena.0010.t:0 "Смерти на Драконьем Камне"
 sotd_rhaena.0010.desc:0 "С острова моей сестры пришла мрачная весть, скреплённая тремя печатями. Смерть крадётся по Драконьему Камню, словно туман. Старый мейстер Калипер умер за письмами. Затем одна за другой скончались дамы Рейны: Касселла Стонтон, септа Марьям, Алейна Ройс и последней — Саманта Стокворт, целые сутки боровшаяся со смертью и кричавшая от боли. Рейна заперла ворота и молит узнать, что за проклятие вошло в её дом.\n\nЭто не проклятие. Когда я прочитал письмо совету, лорд Рего Драз застыл, а затем назвал причину: слёзы Лисса. Излюбленное оружие отравителей, редкий и баснословно дорогой яд — прозрачная сладкая жидкость, разъедающая внутренности и не оставляющая следов. Кто-то внутри этих стен, кто-то, кто ужинает за столом моей сестры, убивает её придворных — одну за другой.\n\n#bold Ворона на Драконий Камень, быстрее самого страха: это яд. Ищи убийцу рядом с собой.#!"
 sotd_rhaena.0010.a:0 "Послать ворона. И да помогут боги тому, чьё имя будет в ответе."
 sotd_rhaena.0011.t:0 "Отравитель Драконьего Камня"
 sotd_rhaena.0011.desc:0 "История доходит до меня по частям, и каждая страшнее предыдущей. Когда ворон достиг Драконьего Камня и Рейна прочла слова #italic «слёзы Лисса»#!, гадать ей не пришлось. Она вызвала мужа в зал Расписного стола и положила перед ним письмо. Эндроу Фарман, это мягкое, улыбчивое ничтожество, даже не стал отпираться. Он #bold хвастался#!. Сестра уехала, жена никогда его не любила, придворные дамы насмехались над ним и считали его пустым местом. Вот он и поил их ядом, глядел, как они умирают, и называл это единственной властью, которая ему когда-либо доставалась.\n\nРейна сказала, что он может уйти — через окно или через дверь, как пожелает. Он выбрал окно зала Расписного стола, где Эйгон некогда замышлял завоевание целого материка, и прыгнул.\n\nСестра велела изрубить его останки и скормить Пламенной Мечте и другим драконам во дворах. В ней тоже есть что-то от Мейгора, что бы ни твердили септоны.\n\n#bold Так умирают отравители. Но пять добрых душ уже не вернуть, и Драконий Камень навсегда останется для неё осквернённым.#!"
 sotd_rhaena.0011.a:0 "Так умирают отравители. Да упокоят боги дам Драконьего Камня."
 sotd_rhaena.0020.t:0 "У Чёрного Ужаса есть всадник"
 sotd_rhaena.0020.desc:0 "Ворон с Драконьего Камня принёс слова, от которых стынет кровь: Эйрея исчезла — и забрала с собой #bold БАЛЕРИОНА#!.\n\nДочь моего брата, отосланная от моего двора к матери, которую едва знала, жила на той мрачной скале одинокой и озлобленной. На рассвете она вошла в дымящиеся драконьи дворы и оседлала самого Чёрного Ужаса. Не дракончика, не одного из молодых драконов — зверя, который был стар уже во время гибели Валирии. Дракона Эйгона и Мейгора, самое огромное живое существо в известном мире. Стражники говорят, она смеялась, когда он взлетел.\n\nОни улетели на восток, над морем, и с тех пор их никто не видел. Тринадцатилетняя девочка верхом на чудовище, которое не удержать никакими цепями, скрылась там, где мне её не достать. Возможно, уже никому не достать.\n\n#bold Найдите её. Все корабли, все вороны, всё золото — на поиски. Найдите её.#!"
 sotd_rhaena.0020.a:0 "Каждый корабль, каждый ворон, каждая монета. Найдите её."
 sotd_rhaena.0021.t:0 "Поиски по всему свету"
 sotd_rhaena.0021.desc:0 "Полгода — и ничего. Мои посланники обошли Пентос, Тирош, Мир и Волантис. Сам Железный банк, после истории с яйцами особенно охотно предлагающий помощь, задействовал тысячи своих глаз. Говорят, чёрного дракона видели над Спорными землями. Чёрного дракона видели у Лисса. Чёрного дракона видели там, где его никогда не было, — люди, которым нужно моё золото.\n\nРейна облетает побережье на Пламенной Мечте, пока руки не трескаются от ветра. Алисанна зажигает свечи. Я сижу с Бартом допоздна. Он произносит то, чего ни один из нас не хочет слышать: их никто не видел, потому что Балерион отправился не в земли людей. Есть в мире место, которое он знает лучше любого живого существа. Место, которое помнит только он и откуда никто не возвращается.\n\n#bold Валирия. Милостивые боги, он унёс её домой, в Валирию.#!"
 sotd_rhaena.0021.a:0 "Продолжайте поиски. Она крови дракона. Она жива."
 sotd_rhaena.0022.t:0 "То, что вернулось из Валирии"
 sotd_rhaena.0022.desc:0 "На тринадцатый день четвёртой луны стража на стенах Красного замка подняла крик. Тень огромных чёрных крыльев впервые со смерти Мейгора легла на Королевскую Гавань. Балерион вернулся домой.\n\nНо боги, что вернулось вместе с ним! Вдоль левого бока Чёрного Ужаса тянется страшная, едва затянувшаяся рана почти девяти футов длиной. Он летит неровно, с тяжким усилием. К его спине цепляется Эйрея, привязанная лохмотьями, некогда бывшими одеждой. Скелет, обтянутый кожей; волосы спутаны, глаза налиты кровью. Она горит. Это не та лихорадка, которую знают мейстеры: от её маленького тела идёт такой жар, что воздух над ним дрожит. Коснувшись её лба, Бенифер отдёрнул руку, словно от кипящего котла. А под её кожей... Я не стану записывать, что видел у неё под кожей.\n\nВеликий мейстер Бенифер унёс её в свои покои. Я послал за септоном Бартом. Больше никого не впускать.\n\n#bold Что бы она ни нашла в руинах Валирии, оно вернулось вместе с ней — внутри неё.#!"
 sotd_rhaena.0022.a:0 "Бенифер и Барт, никого больше. И молитесь."
 sotd_rhaena.0023.t:0 "Огонь внутри"
 sotd_rhaena.0023.desc:0 "Принцесса Эйрея Таргариен умерла за час до рассвета. Лишь двое видели её последние часы. Один никогда о них не заговорит. Другой записал всё и запечатал рукопись: по его словам, ни один из ныне живущих королей не должен её прочесть.\n\nБарт сказал мне лишь следующее, и руки его дрожали: они сделали всё, что могут люди. В конце попытались даровать единственное оставшееся милосердие, но и этого оказалось мало. Существа, убившие её, были не из нашего мира, и места им здесь не было. Ей было тринадцать лет. Она хотела материнской любви, отцовского трона и собственного дракона. Но выбрала единственного живого зверя, который помнил дорогу домой — в ад.\n\nРейна прилетела слишком поздно, чтобы услышать голос дочери. Она взяла её прах, одна поднялась на Пламенной Мечте выше, чем мог видеть человеческий глаз, и развеяла его по ветру. Когда она вернулась на землю, слёз больше не было. Думаю, их уже никогда не будет.\n\n#bold Рукопись останется запечатанной. Иное знание — рана на теле мира.#!"
 sotd_rhaena.0023.a:0 "Запечатать рукопись. Есть вещи, о которых лучше не читать."
 sotd_rhaena.0024.t:0 "Орден драконоблюстителей"
 sotd_rhaena.0024.desc:0 "Никогда больше. Вот закон, который я вынес из этого горя: ни один ребёнок моего дома больше не войдёт без присмотра в драконье логово и не улетит навстречу смерти.\n\nБалериона, слишком израненного и старого для вольной жизни, я вернул на Драконий Камень. Драконья гора станет ему домом под надёжной охраной. Для этого я учредил новый орден — #bold драконоблюстителей#!. Семьдесят семь человек в чёрных чешуйчатых доспехах поклялись днём и ночью охранять драконов дома Таргариенов. Охранять мир от них, а их — от детского безрассудства.\n\nНа следующий день после развеивания праха Рейна покинула Драконий Камень. Она больше не желает владеть островом: #italic «Он снова твой, брат. Мне не нужен замок, который отравил Эндроу, и двор, отдавший мою дочь Валирии. На Драконьем Камне для меня остались лишь призраки».#! Я вернул остров Короне. Теперь сестра странствует из замка в замок — королева скорби.\n\n#bold Из огня рождается порядок. Никогда больше.#!"
 sotd_rhaena.0024.desc.no_rhaena:0 "Никогда больше. Вот закон, который я вынес из этого горя: ни один ребёнок моего дома больше не войдёт без присмотра в драконье логово и не улетит навстречу смерти.\n\nБалериона, слишком израненного и старого для вольной жизни, я вернул на Драконий Камень. Драконья гора станет ему домом под надёжной охраной. Для этого я учредил новый орден — #bold драконоблюстителей#!. Семьдесят семь человек в чёрных чешуйчатых доспехах поклялись днём и ночью охранять драконов дома Таргариенов. Охранять мир от них, а их — от детского безрассудства.\n\n#bold Из огня рождается порядок. Никогда больше.#!"
 sotd_rhaena.0024.a:0 "Из огня рождается порядок. Никогда больше."
 sotd_rhaena.0025.t:0 "Последнее жало Осы"
 sotd_rhaena.0025.desc:0 "Один из слухов о чёрном драконе показался достойным проверки. С Бархатных холмов к северу от Пентоса пришла весть: в горах поселилась огромная крылатая тень, а некий проводник клянётся отвести вооружённый отряд к её логову. Я послал сира Виллама Осу с дюжиной добрых воинов узнать правду.\n\nДракона там не было. Никогда не было. Разбойники распустили слух, чтобы заманить любопытных в холмы. Проводник привёл сира Виллама и его людей прямо в засаду. Их перебили до последнего в безымянном овраге — ради моего золота, приманив ложью.\n\nМне говорят, Оса дорого продал свою жизнь: пал последним, а земля вокруг была усеяна телами тех, кого он забрал с собой. Один из людей лорда Рего выкупил его голову у убийц, чтобы у меня не осталось сомнений. Сомнений нет. Я потерял рыцаря в белом плаще из-за пустого слуха — и сам послал его на смерть.\n\n#bold Сир Виллам Оса. Храбрый рыцарь, погибший из-за слуха. Королевство обеднело с его смертью.#!"
 sotd_rhaena.0025.a:0 "Похороните то, что нам вернули, с честью."
 sotd_rhaena.0026.t:0 "Белый плащ для Осы"
 sotd_rhaena.0026.desc:0 "Прошёл год с тех пор, как сир Виллам погиб в безымянном овраге. Его место среди семерых гвардейцев уже слишком долго пустует. О короле судят по воинам, которых он держит рядом, и я не торопился с выбором.\n\nСегодня утром перед Железным троном преклоняет колени сир Лукамор Стронг — рослый, прямодушный и неутомимый. Его копьё турнир за турниром выбивает из седла куда более знатных соперников, а рука с мечом словно не знает усталости. Простой люд называет его любострастником; шепчутся и о женщинах Королевского леса. Но никто не сомневается в его храбрости и ратном умении. Сир Джайлс поручился за него, и мне этого достаточно.\n\nЯ сам возлагаю ему на плечи белый плащ, который когда-то носил Оса.\n\n#bold Встань, сир Лукамор, рыцарь Королевской гвардии. Служи лучше, чем я послужил человеку, чей плащ ты носишь.#!"
 sotd_rhaena.0026.a:0 "Встань, сир Лукамор. Белый плащ твой."
 sotd_rhaena_barren_modifier:0 "Брак горестей"
 sotd_rhaena_barren_modifier_desc:0 "Дважды вдова и ныне замужем за человеком, которого она не может любить, Рейна Таргариен не родит больше детей."
