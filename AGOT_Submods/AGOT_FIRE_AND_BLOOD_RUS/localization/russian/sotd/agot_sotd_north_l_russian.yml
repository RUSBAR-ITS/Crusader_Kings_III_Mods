l_russian:
 fab_north.0001.t:0 "Старый Волк"
 fab_north.0001.desc:0 "Лорд Брандон Старк танцевал на Золотой свадьбе. Помню его смех: огромный седобородый человек, в лицо называвший юг землёй неженок и перепивший половину штормовых лордов в доказательство своих слов. Вместе с сыновьями и неизменной весёлостью он отплыл в Белую Гавань. Север поглотил его.\n\nТеперь ворон из Винтерфелла приносит продолжение. Не прошло и года после возвращения, как Брандон Старк умер в своей постели, пока за окном шёл снег. Его место занял сын Уолтон. Говорят, он суровее отца: скорее выхватит меч, чем улыбнётся.\n\nУ Севера новый лорд, которого я никогда не встречал."
 fab_north.0001.a:0 "Зима ведёт свой счёт."
 fab_north.0002.t:0 "Мятеж у Стены"
 fab_north.0002.desc.both:0 "Из воронятни приносят письмо: на печати ещё иней. Я читаю его дважды, прежде чем могу поверить.\n\nСир Оливер Бракен и сир Раймунд Маллери — люди Мейгора, которых я пощадил и отправил на Стену, надеясь, что они ещё послужат добру, — восстали против своего ордена. Бракен стал полновластным хозяином Инистых Врат, Маллери плетёт заговоры в Собольем замке. Чёрные братья, верные присяге, гибнут от рук тех, кто её нарушил.\n\nВиновато моё милосердие. Я подарил им жизнь, а они распорядились ею, как фальшивой монетой. Север уже поднимается. Когда речь о Стене, Старки не ждут дозволения с юга."
 fab_north.0002.desc.olyver:0 "Из воронятни приносят письмо: на печати ещё иней.\n\nСир Оливер Бракен, человек Мейгора, которого я пощадил и отправил на Стену, восстал против своего ордена и захватил Инистые Врата. Чёрные братья, верные присяге, гибнут от рук тех, кто её нарушил.\n\nВиновато моё милосердие. Я подарил ему жизнь, а он распорядился ею, как фальшивой монетой. Север уже поднимается. Когда речь о Стене, Старки не ждут дозволения с юга."
 fab_north.0002.desc.raymund:0 "Из воронятни приносят письмо: на печати ещё иней.\n\nСир Раймунд Маллери, человек Мейгора, которого я пощадил и отправил на Стену, поднял гарнизон Собольего замка против командиров. Чёрные братья, верные присяге, гибнут от рук тех, кто её нарушил.\n\nВиновато моё милосердие. Я подарил ему жизнь, а он распорядился ею, как фальшивой монетой. Север уже поднимается. Когда речь о Стене, Старки не ждут дозволения с юга."
 fab_north.0002.a:0 "Охранять Стену — дело Севера. Пусть волки ответят."
 fab_north.0002.a.tt:0 "Каноничный ход событий: лорд Уолтон Старк отправится подавлять мятеж. История помнит, чем закончился этот поход."
 fab_north.0002.b:0 "Я пощадил их. Я и покончу с ними. Седлайте Вермитора."
 fab_north.0002.b.tt:0 "Альтернативная история: король лично исправит свою ошибку — и от этого может зависеть жизнь Старка."
 fab_north.0003.t:0 "Волк выступает в поход"
 fab_north.0003.desc:0 "По Королевскому тракту одна за другой приходят вести. Лорд Уолтон Старк не стал ждать ни моего дозволения, ни весны. Едва успели остыть кости его отца, он созвал вассалов, снял Лёд с железных креплений и выступил на север. Суровые воины со сменными лошадьми идут через снега, которые южное войско сочло бы непроходимыми.\n\nМейстеры говорят, у вольного народа есть поговорка: Стена — край мира. У Старков короче: Стена наша."
 fab_north.0003.desc.nowalton:0 "По Королевскому тракту одна за другой приходят вести. Винтерфелл не стал ждать ни моего дозволения, ни весны. Знамёна Севера созваны. Суровые воины со сменными лошадьми пробиваются на север через снега, которые южное войско сочло бы непроходимыми. Рядом едут верные присяге чёрные братья.\n\nМейстеры говорят, у вольного народа есть поговорка: Стена — край мира. У Старков короче: Стена наша."
 fab_north.0003.a:0 "Пусть боги идут с ними. Мои и их."
 fab_north.0004.t:0 "Лёд у Инистых Врат"
 fab_north.0004.desc:0 "В Инистых Вратах всё кончено. По северному обычаю.\n\nМятежники держались два дня. На третий верные братья взобрались на обледенелые стены, а за ними — люди Старка. К сумеркам сир Оливер Бракен стоял на коленях в снегу того двора, который объявил своим. Ни суда поединком, ни просьб вспомнить прошлую службу. Лорд Уолтон Старк выслушал перечень преступлений, взял Лёд обеими руками и отсёк голову человеку, которого сохранила моя милость.\n\nГоворят, после лорд Винтерфелла произнёс лишь одно: «Он умер быстрее тех, кого предал»."
 fab_north.0004.desc.nowalton:0 "В Инистых Вратах всё кончено. По северному обычаю.\n\nМятежники держались два дня. На третий верные братья взобрались на обледенелые стены, а за ними — северяне. К сумеркам сир Оливер Бракен стоял на коленях в снегу того двора, который объявил своим. Ни суда поединком, ни просьб вспомнить прошлую службу. Лорд-командующий выслушал перечень преступлений и отсёк голову человеку, которого сохранила моя милость."
 fab_north.0004.a:0 "Один долг уплачен."
 fab_north.0005.t:0 "Бегство из Собольего замка"
 fab_north.0005.desc:0 "Соболий замок не стал сражаться. Узнав о судьбе Инистых Врат, сир Раймунд Маллери и последние мятежники ночью перебрались через Стену. Они спустились по верёвкам с ледяной громады и скрылись в Зачарованном лесу — там, куда не простирается ни королевский закон, ни власть лордов.\n\nНо лорд Уолтон Старк намерен идти следом. Командиры отговаривали его. Чёрные братья отговаривали. Проводники-одичалые наотрез отказались. И всё же он ведёт за Стену отборный отряд. Говорят, он ответил: клятвопреступник, бежавший от королевского суда, не перестаёт быть клятвопреступником по ту сторону Стены."
 fab_north.0005.a:0 "Возвращайся, волк. Остались лишь ничтожества."
 fab_north.0006.t:0 "Великаны"
 fab_north.0006.desc:0 "Уцелевшие рассказывают урывками. Эти обрывки не складываются в картину, которую здравомыслящий человек захотел бы увидеть целиком.\n\nОни напали на след мятежников в Зачарованном лесу и три дня шли в глубь края, где деревья старше королевств. На четвёртый день лес поднялся. Из белого безмолвия на отряд вышли великаны — не из сказок у костра, а серокожие, страшные, ростом с деревья. Мир наполнился дубинами, криками и запахом расколотой сосны.\n\nГоворят, Уолтон Старк убил двоих. Говорят, столько понадобилось, чтобы его одолеть. Назад принесли всё, что сумели унести."
 fab_north.0006.a:0 "Семеро, простите меня. Я послал этих людей на север."
 fab_north.0007.t:0 "Останки для Чёрного замка"
 fab_north.0007.desc:0 "Лорда Винтерфелла принесли в Чёрный замок по частям, завёрнутым в его собственный плащ. Верные братья встретили его у ворот с почестями. Уцелевшие разведчики будут помнить этот поход дольше, чем носить любой шрам. Позже одичалые со смехом рассказали дозорному о сире Раймунде Маллери: преклонившие колено, перешедшие Стену, побывали гостями на пиру. Что это был за пир, я не стану доверять пергаменту.\n\nТеперь лорд Винтерфелла — Аларик Старк. Его письмо с признанием моих титулов занимает три строки. Безупречно учтивое и холоднее всего, что когда-либо знала Стена.\n\nОн не пишет, что брата убило моё милосердие. Ему незачем."
 fab_north.0007.a:0 "Север помнит. Буду помнить и я."
 fab_north.0010.t:0 "На Вермиторе — к северу"
 fab_north.0010.desc:0 "Я пощадил этих людей. Что бы они ни жгли и ни разрушали, начало этому огню положил я. Не стану сидеть в Красном замке, считать по письмам погибших северян и ждать, пока другие заплатят мои долги.\n\nВермитор взмывает сквозь холод мощными взмахами бронзовых крыльев. Внизу серой нитью тянется Королевский тракт, за ним — снег, белее всякого пергамента. Впервые показавшаяся на горизонте Стена похожа на светлую кромку клинка.\n\nБракен поднимет голову в захваченном замке и увидит, как выглядит вернувшееся милосердие."
 fab_north.0010.a:0 "Выше. И быстрее."
 fab_north.0011.t:0 "Дракон у Инистых Врат"
 fab_north.0011.desc:0 "Боя не было. Ему и не суждено было случиться.\n\nВермитор опустился во двор Инистых Врат с грохотом, словно мир разрывался надвое. Мятеж закончился за то время, которое понадобилось испуганным людям, чтобы открыть ворота. Отряд Уолтона Старка, ещё в дне пути к югу, прибыл к рядам коленопреклонённых мятежников в снегу. На льду дымился дракон — гора тлеющих углей.\n\nЗдесь сир Оливер Бракен получил от меня то, что, возможно, должен был получить ещё у Красного замка: королевское правосудие, свершённое рукой короля. После я не спал. Но за моё милосердие не погиб ни один Старк. И ни один чёрный брат — с того самого часа, как я приземлился."
 fab_north.0011.a:0 "Я должен был с этим покончить. И покончил."
 fab_north.0012.t:0 "За пределами королевской власти"
 fab_north.0012.desc:0 "Сир Раймунд Маллери перебрался за Стену прежде, чем тень Вермитора коснулась Собольего замка. Туда даже дракон за ним не полетел: Вермитор отказался пересекать ледяную границу. Вместо него пошли разведчики. Они принесли рассказ вольного народа: смеясь, одичалые поведали, что преклонивший колено рыцарь, бежавший от дракона, стал гостем на их пиру — и с пира не вернулся.\n\nЛорд Уолтон Старк проводил меня до ворот Чёрного замка. Суровый человек, как и говорили. Но на прощание прижал кулак к груди. Его домочадцы говорят: со смерти отца он никого так не приветствовал.\n\n«Вы пришли сами, — сказал он. — Север этого не забудет»."
 fab_north.0012.a:0 "И я не забуду Стену."
 fab_north.0020.t:0 "Давно отложенный королевский объезд"
 fab_north.0020.desc:0 "Десять лет на троне, а я ни разу не видел Севера. Склоняясь над картами, Алисанна говорит прямо: нельзя считать королевство единым, если в половине его король никогда не бывал.\n\nРешено: большой объезд Белой Гавани, Винтерфелла и самой Стены. На этот раз поступим разумно. В каждом прежнем путешествии Вермитор приземлялся, а я потом неделю ждал собственный обоз. Довольно. Свита, одежда, повара, подарки — всё отправится ЗАРАНЕЕ, кораблём в Белую Гавань. Драконы догонят отряд в дороге.\n\nКоролева уже выбирает придворных дам. Она давно мечтала увидеть Север."
 fab_north.0020.a:0 "Объявите об этом. Драконы идут на север."
 fab_north.0020.b:0 "Север ждал десять лет. Подождёт и дольше."
 fab_north.0020.b.tt:0 "Альтернативная история: отменить объезд. Старки узнают об этом, и вся северная сюжетная ветвь не состоится. (Трясучка начнётся в положенный срок.)"
 fab_north.0021.t:0 "Посланники Пентоса и Тироша"
 fab_north.0021.desc:0 "Паруса свиты едва скрылись за горизонтом, а в моём тронном зале уже появились посланники Вольных городов.\n\nВот уже три года Пентос и Тирош душат торговлю друг друга, а заодно и половины Узкого моря. Теперь оба города прислали магистров, облачённых в шелка и доведённых до отчаяния, — те умоляют Железный трон рассудить их и заключить мир. Великая честь, говорит Барт. Великая западня, отвечаю я: такие переговоры затягиваются, а меня ждут в Винтерфелле.\n\nАлисанна, как всегда, разрубает узел. «Тогда я поеду вперёд, а ты догонишь меня, когда высохнут чернила. Отменить визит к Старкам? С таким же успехом можно оскорбить саму Стену»."
 fab_north.0021.a:0 "Поезжай вперёд, любовь моя. Я скоро тебя догоню."
 fab_north.0021.a.tt:0 "Каноничный путь: королева едет на север одна, а переговоры затягиваются гораздо дольше, чем кто-либо предполагал."
 fab_north.0021.b:0 "Пентос и Тирош могут починить свои сети сами. Мы едем вместе."
 fab_north.0021.b.tt:0 "Альтернативная история: отказаться от посредничества. Вольные города оскорблены, зато король и королева отправятся на север вместе."
 fab_north.0022.t:0 "Королева отплывает"
 fab_north.0022.desc:0 "Серым утром она спускается к кораблям в сопровождении придворных дам и септ, унося с собой добрую половину придворного веселья. Никогда ещё причалы не были столь шумными.\n\nСреброкрылая, разумеется, в корабле не нуждается. Когда флот выходит в залив, она облетает гавань, серебристо-голубая на фоне облаков. Моряки клянутся, что драконица королевы собирается сопровождать корабли до самого севера, словно собака, стерегущая стадо.\n\nК вечеру в Красном замке становится совсем тихо. Не думал, что мне будет так её не хватать."
 fab_north.0022.a:0 "Попутного ветра, моя королева. Я буду читать каждое письмо дважды."
 fab_north.0023.t:0 "Белая Гавань"
 fab_north.0023.desc:0 "Первое её письмо приходит из Белой Гавани, и даже в написанных строках я слышу её смех.\n\nМандерли превзошли сами себя: город вычищен добела, под стать названию; на каждом знамени — водяной; после пира с миногами и зимним элем её дамы ещё неделю будут приходить в себя. И, как и следовало ожидать от Алисанны, она уже сделала то, чего не делал ни один король в своих поездках: распахнула двери зала Нового замка для всех горожанок, знатных и простолюдинок, и просто выслушала их.\n\nПоследняя строка письма звучит уже не так весело. «Кое-что из услышанного, любовь моя, тебе тоже нужно узнать. Но не сейчас. Когда я вернусь домой»."
 fab_north.0023.a:0 "За что бы ни взялась моя королева, королевство от этого лишь выигрывает."
 fab_north.0024.t:0 "Холодный очаг"
 fab_north.0024.desc.grudge:0 "Винтерфелл, пишет она, встретил её со всей положенной учтивостью — и без малейшего тепла.\n\nЛорд Аларик Старк принял её во дворе, без запинки перечислил все титулы, позаботился о размещении свиты — а затем на три дня погрузился в угрюмое молчание. Под их ногами, в крипте, покоится его брат Уолтон, растерзанный великанами во время погони за мятежниками, которых МОЁ милосердие отправило на Стену. Аларик ни разу не написал мне с обвинениями. Он просто хранит эту обиду — так же, как Север хранит всё остальное.\n\n«Он смотрит на меня, — пишет Алисанна, — и видит дарованное тобой помилование. Дай мне время, любовь моя. Лёд тает. Нужно лишь терпение»."
 fab_north.0024.desc.kingcame:0 "Винтерфелл, пишет она, встретил её с подчёркнутой учтивостью и сдержанностью, за которой почти — но всё же не вполне — угадывается тепло.\n\nЛорд Уолтон Старк не из тех, кто улыбается незнакомцам. Но он помнит короля, прилетевшего на север верхом на драконе, чтобы исправить собственную ошибку, и выражает это сотней мелочей без лишних слов. Настороже остаются его придворные: южная королева в шелках непривычно смотрится в зале, увешанном железными мечами.\n\n«На меня смотрят, как на ястреба в курятнике, — пишет Алисанна, — но лорд напоминает своим людям, что в час нужды ты сам явился на Стену. Начало лучше, чем я смела надеяться»."
 fab_north.0024.desc.executed:0 "Винтерфелл, пишет она, встретил её с положенной учтивостью и той особенной осторожностью, с которой Север относится к власти южан.\n\nАлисанна пишет, что понять лорда Уолтона Старка непросто, но в его зале нет ни горя, ни затаённой обиды — лишь давнее северное недоверие к драконам. Однажды за вином он даже высказал нечто похожее на одобрение: его отец Брандон рассказывал ему о королевском суде над людьми Мейгора. «Головы с плеч, а не помилование, — говорил старый лорд. — Дракон рассудил тех рыцарей так, как рассудили бы МЫ».\n\n«Дай мне две недели, — пишет она, — и он будет рассказывать мне о том, как охотился его дед»."
 fab_north.0024.desc:0 "Винтерфелл, пишет она, встретил её со всей положенной учтивостью, но почти без тепла.\n\nЛорд Винтерфелла принял её во дворе, без запинки перечислил все титулы, позаботился о размещении свиты — а затем на несколько дней погрузился в угрюмое северное молчание. Это не враждебность, настаивает она: так Север встречает чужаков. А королева из дома Таргариенов с драконом над головой — самая необычная гостья, какую здесь могут припомнить.\n\n«Лёд тает, — пишет она. — Нужно лишь терпение»."
 fab_north.0024.a:0 "Если кто и способен растопить лёд в этом зале, то только она."
 fab_north.0025.t:0 "Остроумие и чудо"
 fab_north.0025.desc:0 "Следующий ворон приносит совсем другие вести.\n\nЕй удалось. Не подарками — Север не купить, пишет она, и саму такую попытку здесь презирают, — а просто оставаясь собой, неутомимой и неотразимой. Она отправилась на охоту в такую погоду, от которой половина её дам слегла. Она пила наравне с лордом Винтерфелла, искренне хваля северный эль, расспрашивала о его домочадцах, называя каждого по имени, выслушала давний спор о зимних запасах зерна и разрешила его так ловко, что теперь двое его вассалов готовы за неё в огонь и в воду.\n\nА под конец, на глазах у всего двора, она приземлилась на Среброкрылой ВНУТРИ стен Винтерфелла и позвала детей замка прикоснуться к живому дракону. «Лорд Винтерфелла рассмеялся», — пишет она и дважды подчёркивает эти слова. «Его домочадцы говорят, что не слышали этого смеха с тех пор, как он стал лордом»."
 fab_north.0025.a:0 "Королевству было проще завоевать её сердце, чем Северу."
 fab_north.0026.t:0 "Королева поднимается в небо"
 fab_north.0026.desc:0 "В Винтерфелле она делает то, чего боялась её свита и что сама она давно обещала в письмах: оставляет сопровождающих позади.\n\nСреброкрылая взмывает из кольца серых стен Винтерфелла в небо цвета полированной стали. Королева Семи Королевств летит на север вдоль едва различимой нити Королевского тракта, над последними полями, последними укреплениями, последними деревьями — туда, где кончается мир. Свите понадобится две недели, чтобы её догнать. Она намерена провести их среди чёрных братьев в Чёрном замке.\n\n«Лорды были возмущены, — пишет она. — Простой народ ликовал. Пожалуй, я на стороне простого народа»."
 fab_north.0026.desc.together:0 "В Винтерфелле она делает то, чего боялась её свита и чего, признаться, я сам надеялся избежать: оставляет нас позади.\n\nСреброкрылая взмывает из кольца серых стен Винтерфелла в небо цвета полированной стали. Моя королева летит на север вдоль едва различимой нити Королевского тракта, над последними полями, последними укреплениями, последними деревьями — туда, где кончается мир. «Тебе нужно расположить к себе лордов, — сказала она мне во дворе, натягивая перчатки, — а мне — чёрных братьев. Когда я вернусь, обменяемся рассказами».\n\nСвите понадобится две недели, чтобы её догнать. Ждать она не намерена."
 fab_north.0026.a:0 "Никогда не было такой королевы, как она. И никогда не будет."
 fab_north.0027.t:0 "Чёрный стол"
 fab_north.0027.desc.grudge:0 "В Чёрном замке братья Дозора угощают её солониной, чёрным хлебом и ничем не прикрытой правдой — и, по её словам, совершенно покоряют ей сердце.\n\nНо и Стена помнит свои потери. За столом старый разведчик осторожно заговорил о мятеже: об Инистых Вратах, о братьях, погибших верными клятве, о лорде Уолтоне Старке, чьё растерзанное тело привезли домой, потому что два помилованных рыцаря Мейгора сочли чёрные плащи недостойными себя. Лорд-командующий взглядом заставил его замолчать, но последовавшее молчание, пишет она, было тяжёлым.\n\n«Они слишком учтивы, чтобы сказать это своей королеве. Я скажу своему королю. Дозор заплатил за тех белых плащей, которых ты пощадил, любовь моя. Они это знают. Должны знать и мы»."
 fab_north.0027.desc.kingcame:0 "В Чёрном замке братья Дозора угощают её солониной, чёрным хлебом и ничем не прикрытой правдой — и, по её словам, совершенно покоряют ей сердце.\n\n«Здесь, на краю света, твоё имя в почёте, любовь моя. Старшие братья до сих пор вспоминают зиму, когда восстали помилованные рыцари, и короля, который не послал ни ворона, ни войска, а явился САМ — на бронзовых крыльях над Инистыми Вратами — и усмирил мятеж прежде, чем Север успел похоронить хоть одного верного человека. Тот лорд-командующий, Старый Медведь, уже умер, но его слова пережили его: „Железный трон однажды вспомнил о нас. Постарайтесь заслужить, чтобы он вспомнил и во второй раз“».\n\n«Здесь пьют за твоё здоровье, — пишет она. — Я подумала, тебе стоит знать, что где-то в твоём королевстве люди в чёрном поднимают чаши за короля»."
 fab_north.0027.desc.executed:0 "В Чёрном замке братья Дозора угощают её солониной, чёрным хлебом и ничем не прикрытой правдой — и, по её словам, совершенно покоряют ей сердце.\n\nОдно её удивило. Она опасалась услышать осторожные упрёки из-за рыцарей Мейгора: белых плащей, которые могли попасть на Стену, но вместо этого были казнены по приказу короля. Всё оказалось наоборот. «Короли желают добра, когда отправляют к нам обитателей своих темниц, — сказал ей за вином лорд-командующий. — Присылают предателей и называют это милосердием. Ваш король не прислал нам никого, на чью верность нельзя положиться. Дозор благодарил и худших людей за лучшие дары».\n\n«Похоже, — пишет она, — в этом случае более суровый выбор оказался милосерднее. Я ещё не решила, что об этом думать»."
 fab_north.0027.desc.exiled:0 "В Чёрном замке братья Дозора угощают её солониной, чёрным хлебом и ничем не прикрытой правдой — и, по её словам, совершенно покоряют ей сердце.\n\nЗа столом прозвучал один горький тост. Дозор слышал о рыцарях Мейгора, которых король пощадил и отправил за Узкое море: в Эссосе они продают свои мечи и живут вольготно, свободные от клятв. Чёрным братьям такие вести не по душе. «Любому закованному в цепи лордику предлагают Стену, — сказал старый разведчик. — Видно, белый плащ даёт право на более мягкий приговор». Лорд-командующий не стал его останавливать.\n\n«Они приняли бы тех рыцарей, любовь моя, — пишет она, — и были бы рады их мечам. Вспомни о Стене, когда в следующий раз будешь даровать помилование»."
 fab_north.0027.desc:0 "В Чёрном замке братья Дозора угощают её солониной, чёрным хлебом и ничем не прикрытой правдой — и, по её словам, совершенно покоряют ей сердце.\n\nЕй показали ледяные камеры и подъёмную клеть, оружейную с тысячей старых мечей, книги учёта с их страшной арифметикой: Стену, рассчитанную на десять тысяч защитников, удерживают считаные сотни. Она спросила лорда-командующего, в чём нуждается Дозор. Он рассмеялся и ответил: «Во всём». Затем, увидев её лицо, перестал смеяться и заговорил всерьёз. Список занял два листа.\n\n«Я ехала на север полюбоваться чудом, — пишет она. — А нашла девятьсот бедных и честных людей, которые держат на плечах небосвод. И я намерена им помочь»."
 fab_north.0027.a:0 "Прочитай мне список снова. Весь."
 fab_north.0028.t:0 "Среброкрылая не желает пересекать Стену"
 fab_north.0028.desc:0 "Одно письмо я буду хранить до самой смерти.\n\n«Трижды я пыталась направить её туда, любовь моя. Трижды. Я всего лишь хотела перелететь Стену и вернуться — увидеть Зачарованный лес сверху и сказать, что королева побывала за Стеной. Среброкрылая никогда мне ни в чём не отказывала. Но в этом отказала. Каждый раз, когда мы оказывались над этим льдом, она кричала и резко сворачивала на юг. Никакие понукания не заставляли её лететь дальше. На третий раз я почувствовала это сама — я не могу описать, что это было. Холод, который вовсе не холод. НЕТ — огромное, как весь мир.\n\nЧем бы ни была Стена, Джейхейрис, она не просто лёд. Наши драконы знают что-то, чего не знаем мы. Потом я долго сидела на снегу в Чёрном замке. Лорд-командующий молчал, и я была ему за это благодарна»."
 fab_north.0028.a:0 "Что бы ни защищало эту Стену, пусть боги сохранят эту силу."
 fab_north.0028.b:0 "Даже драконы знают, где кончается мир. Моя королева нашла край."
 fab_north.0029.t:0 "Что услышала королева"
 fab_north.0029.desc:0 "Она уже вернулась в Винтерфелл, когда приходит длинное письмо — то самое, обещанное ещё в Белой Гавани, написанное более твёрдой рукой, чем обычно.\n\nНа каждой остановке она устраивала приёмы для женщин: лорды покидали зал, а двери открывались для всех, кто хотел высказаться, — от торговок рыбой из Белой Гавани до прачек из Кротового городка, стирающих для чёрных братьев. В письме две главные темы. Первая — Дозор: девятьсот человек на нищенском довольствии охраняют сотню лиг льда, а плодородные земли к югу от Стены принадлежат лордам, которые и не смотрят на север. У неё есть предложение на этот счёт, пишет она, и в Винтерфелле меня ждёт засада.\n\nВторую тему она вовсе не желает доверять бумаге. «Речь об одном древнем праве лордов и о женщинах, которые от него страдают. Когда ты услышишь то же, что и я, ты положишь этому конец. Я тебя знаю»."
 fab_north.0029.desc.together:0 "Она возвращается в Винтерфелл сквозь снежный шквал, с обветренным лицом, серьёзная. В первый же вечер за столом она молчит, хотя на всех прежних остановках охотно рассказывала о своих приключениях.\n\nПозже, у камина в наших покоях, она говорит о двух вещах, которые открыл ей Север. Первая — Дозор: девятьсот человек на нищенском довольствии охраняют сотню лиг льда, а плодородные земли к югу от Стены принадлежат лордам, которые и не смотрят на север. У неё есть предложение, и она намерена высказать его перед всем двором лорда Старка, чтобы его нельзя было отклонить без лишнего шума.\n\nО второй вещи она говорит очень тихо, глядя в огонь. «Речь об одном древнем праве лордов и о женщинах, которые от него страдают. Когда мы вернёмся домой, любовь моя, я расскажу тебе, что услышала на женских приёмах. И тогда ты положишь этому конец. Я тебя знаю»."
 fab_north.0029.a:0 "Что ж, доберусь до севера — и пусть устраивает засаду."
 fab_north.0030.t:0 "Длинный стол"
 fab_north.0030.desc:0 "Уже два месяца. Два месяца пентосских расчётов и тирошских представлений.\n\nКаждая достигнутая уступка наутро снова становится предметом торга, лишь облечённая в новые шелка. Посланники тирошского архонта дважды за неделю покидали переговоры из-за формулировки во вступлении — ВО ВСТУПЛЕНИИ! Пентосские магистры так широко улыбались при этом, что я едва не отправил всю свору домой на одном корабле: пусть заканчивают свою войну в море.\n\nИ каждые три дня на этот стол, словно солнечный луч, опускается ворон с Севера: моя королева покоряет сердца в Винтерфелле, пирует с чёрными братьями, летает к краю света. Я обещал ей, что управлюсь самое большее за полгода. А до высыхания чернил ещё далеко."
 fab_north.0030.a:0 "Барт, скажи людям архонта, что преамбула остаётся в силе. Вся."
 fab_north.0031.t:0 "Наконец-то соглашение"
 fab_north.0031.desc:0 "Свершилось. Подписано, скреплено печатями и клятвами перед старыми богами, новыми и кем бы там ни молились тирошийцы в своих расписных храмах. Пентос и Тирош получили мир, Узкое море — свободные торговые пути, а Железный трон — благодарность двух Вольных городов и, что куда полезнее, уступки в пошлинах.\n\nПочти полгода — разница уже несущественна. Алисанна уезжала в одну пору, а теперь пишет мне из другой.\n\nВинтерфелл далеко на севере, и ждать я больше не намерен."
 fab_north.0031.a:0 "На север, и быстро. Готовьтесь к дороге — я не буду ждать ни дня."
 fab_north.0031.a.tt:0 "Начать путешествие в Винтерфелл. В меню путешествия король может выбрать полёт на Вермиторе и добраться за несколько дней или, если пожелает, отправиться верхом на лошади. (Отмена плана путешествия не оборвёт сюжетную цепочку.)"
 fab_north.0031.b:0 "По Королевскому тракту, с подобающей свитой — пусть Север УВИДИТ своего короля."
 fab_north.0031.b.tt:0 "Начать неторопливый путь по Королевскому тракту в Винтерфелл со всей пышностью королевского выезда. В дороге вас ждут отдельные события. (Отмена плана путешествия не оборвёт сюжетную цепочку.)"
 fab_north.0033.t:0 "Холодный приём"
 fab_north.0033.desc.grudge:0 "Лорд Аларик Старк принимает меня во дворе Винтерфелла со всеми положенными по закону почестями — и ни единым жестом сверх того.\n\nЕго учтивость безупречна. В глазах — могильный холод. Алисанна предупреждала: за полгода ей удалось своим теплом сменить враждебность на вежливость, не более. И всё же холод этого двора пробирает меня сквозь меха. Передо мной лорд, чей брат отправился на север исправлять последствия МОЕГО милосердия, а домой вернулся растерзанным.\n\nУ дверей он останавливается. «Прежде чем вы сядете пировать, ваша милость, — говорит он, — я хотел бы показать вам кое-что в крипте. Это не займёт много времени. Мёртвые долго не задерживают гостей»."
 fab_north.0033.desc.kingcame:0 "Лорд Уолтон Старк встречает меня во дворе Винтерфелла. На миг я замечаю лишь суровое лицо и серые меха, а затем он делает то, чего явно не ожидал весь его двор: спускается по ступеням и по-товарищески пожимает мне руку.\n\n«В прошлый раз, когда я видел вас, ваша милость, вы парили на бронзовых крыльях над Инистыми Вратами. Самый тяжёлый зимний поход в моей жизни закончился прежде, чем моё войско успело туда добраться. Я часто рассказывал эту историю. Теперь они наконец перестанут думать, что я её выдумал».\n\nЗа его спиной смеётся Алисанна. Север холоден. Но сегодня в этом зале будет тепло."
 fab_north.0033.desc.executed:0 "Лорд Уолтон Старк принимает меня во дворе Винтерфелла со сдержанной, неторопливой учтивостью человека, который редко преклоняет колени, но всякий раз делает это искренне.\n\n«Мой отец Брандон рассказывал о вас, ваша милость, — говорит он, пока мы поднимаемся по ступеням. — Вернувшись с Золотой свадьбы, он сказал, что на юге наконец появился настоящий король: вместо помилования он отрубил головы псам Мейгора. Отец говорил, что Север судит о человеке по тому, как тот обращается с мечом, когда приходит час расплаты. Вас он счёл достойным».\n\nДля Старка, шепчет мне Алисанна, это всё равно что свадебный пир, турнир и торжество победителя вместе взятые."
 fab_north.0033.desc.together:0 "Винтерфелл встречает нас двором, выметенным дочиста, словно пол в септе. Лорд Винтерфелла оказывает нам почести с безупречной, размеренной северной учтивостью, за которой ничего нельзя прочесть.\n\nМы прибыли на север вместе: драконы над длинной вереницей свиты, а посланники Вольных городов отправлены домой чинить собственные сети. Толпы в Зимнем городке приветствовали это зрелище, но двор Винтерфелла пока воздерживается от суждений. Пышным прибытием северян не расположишь к себе.\n\nКогда за нами с грохотом закрываются двери, Алисанна сжимает мою руку. «Терпение, любовь моя. Лёд тает. Мне уже доводилось его растапливать»."
 fab_north.0033.desc:0 "Лорд Старк принимает меня во дворе Винтерфелла со всеми положенными почестями и с той настороженной сдержанностью, с какой Север встречает драконов.\n\nПолгода Алисанна согревала этот дом своим присутствием и подготовила мне более радушный приём, чем я мог бы ожидать: придворные учтивы, пир накрыт, сказаны все подобающие слова. Но взгляды, которые следят за мной в дымном зале, принадлежат лордам, чьи отцы преклонили колени перед моими предками под угрозой огня. Никто из них этого не забыл.\n\nВинтерфелл можно покорить лишь так, как покорила его Алисанна: не торопясь."
 fab_north.0033.a:0 "Тогда посмотрим, что Север хочет показать своему королю."
 fab_north.0034.t:0 "Крипта Винтерфелла"
 fab_north.0034.desc:0 "Мы спускаемся с факелами мимо рядов каменных королей — Королей Зимы с мечами на коленях и лютоволками у ног. Десять тысяч лет истории слепо смотрят во тьму. Лорд Аларик молчит всю дорогу.\n\nОн останавливается у гробницы, более новой, чем остальные: камень ещё светлый. Изваяние изображает крупного мужчину с клинком на коленях. Мне не нужно называть его имя.\n\n«Мой брат Уолтон, — говорит Аларик. — Он взял Лёд и пошёл на север против людей, которых ваша милость отправили на Стену. Первого из них он обезглавил этим мечом. Остальных преследовал за Стеной, в Зачарованном лесу. Великаны разорвали его на пять частей. Мы похоронили то, что привезли обратно». Он поднимает факел и наконец смотрит мне в глаза. «Вы пощадили тех рыцарей, ваша милость. Вот уже восемь лет я гадаю, что король может на это ответить»."
 fab_north.0034.a:0 "Ваш брат заплатил за моё милосердие вместо меня. Мне жаль, лорд Старк."
 fab_north.0034.b:0 "(Ничего не говорить. Мёртвые ничего не просят.)"
 fab_north.0035.t:0 "Два волка за столом"
 fab_north.0035.desc.kingcame:0 "Здесь нет гробницы, к которой следовало бы спуститься, и обиды, которую она питала бы. Вместо этого — пир, и лорд Винтерфелла за почётным столом вновь уступает просьбам вассалов и рассказывает о зиме, когда король явился на север.\n\n«Инистые Врата вполне могли стать МОЕЙ могилой, — говорит Уолтон Старк с мрачным удовлетворением северянина, едва избежавшего смерти. — Штурмовать замок на Стене зимой, во время мятежа... Спросите Дозор, чего это стоит. А потом загремело небо, мятежники открыли ворота, и всё проклятое дело закончилось, прежде чем моё войско миновало Дар». Он поднимает чашу в мою честь, и весь зал следует его примеру. «За долг, который король уплатил САМ, сиры. Север помнит и добро, и зло»."
 fab_north.0035.desc.executed:0 "Здесь нет гробницы, к которой следовало бы спуститься, и обиды в зале — только пир и лорд Винтерфелла, который мало-помалу смягчается: не гранит уже, всего лишь дуб.\n\nУже поздно, огонь догорает, когда Уолтон Старк наконец заговаривает об этом. «Отец говорил, что этот мир куплен вашим правосудием, ваша милость. Казнью рыцарей Мейгора». Он медленно поворачивает чашу в руках. «На юге, говорят, сочли это жестокостью. Ни один северянин так не подумал. Клятвопреступник и на Стене остаётся клятвопреступником. Дозор хоронил братьев и за меньшее милосердие. Вы заплатили шестью головами, чтобы избавить его от этого. Винтерфелл считает такую цену невысокой».\n\nАлисанна ловит мой взгляд через стол. СЛУШАЙ, говорят её глаза. Север признаётся, что доверяет тебе."
 fab_north.0035.desc:0 "Здесь нет гробницы, к которой следовало бы спуститься, и старой раны, о которой напоминает этот зал. Только пир по-северному: обильный, неторопливый, искренний.\n\nЛорд Винтерфелла пьёт со мной, говорит об урожае, волчьих стаях и состоянии Королевского тракта. Где-то за полночь — точный миг трудно уловить — я понимаю: ко мне перестали присматриваться и начали принимать как гостя. Полгода трудов Алисанны принесли плоды за один вечер.\n\nСевер ничего не даёт поспешно. Зато всё, что даёт, — от души."
 fab_north.0035.a:0 "Что ж, за Винтерфелл. И за терпеливых королев."
 fab_north.0036.t:0 "Новый Дар"
 fab_north.0036.desc:0 "Она застаёт меня врасплох в Винтерфелле, как и обещала, — перед всем собравшимся двором. Значит, она намерена победить.\n\n«Ночной Дозор охраняет сотню лиг Стены на нищенском довольствии, — говорит моя королева. — Девятьсот человек там, где когда-то стояли десять тысяч. Они кормятся с Брандонова Дара, пока лорды к югу от него жиреют, отвернувшись от Стены. Я прошу короля удвоить земли Дозора: отдать ему полосу к югу от Дара, от моря до моря. Пусть она зовётся Новым Даром и кормит защитников Стены».\n\nВ зале воцарилась тишина. Лорды, чьи земли решено отдать, стоят неподвижно, словно каменные изваяния. Лицо лорда Старка непроницаемо. Люди лорда-командующего в дальнем конце стола затаили дыхание."
 fab_north.0036.a:0 "Пусть будет так. Новый Дар — Дозору, в вечное владение."
 fab_north.0036.a.tt:0 "Каноничное пожалование: графства Нового Дара переходят к лорду-командующему Ночного Дозора. Дозор этого не забудет — как и северные лорды."
 fab_north.0036.b:0 "У Стены достаточно земли. Север оставляет своё себе."
 fab_north.0037.t:0 "Корона Королевы"
 fab_north.0037.desc:0 "На только что пожалованных землях есть деревня у озера. На островке стоит каменная башня, к которой ведёт скрытая под водой дорога. Здесь свита королевы проводит последнюю ночь на Севере.\n\nДеревенские женщины угощают её всем, что у них есть. Утром, пока свита готовится к отъезду, Алисанна снимает с волос золотой обруч — тот самый, который носила всё путешествие, — и вкладывает в руки старосты. Пусть он навеки останется здесь в память о визите королевы.\n\nНе успевает свита скрыться из виду, как деревню уже называют Короной Королевы. Думаю, её будут звать так и через десять веков после того, как обратятся в прах все, кто помнит причину."
 fab_north.0037.a:0 "Север сохранит эту корону дольше, чем любая моя сокровищница."
 fab_north.0038.t:0 "Дорога домой"
 fab_north.0038.desc:0 "Снова на юг: взмахи крыльев, паруса и длинная вереница свиты на Королевском тракте. Из снегов — в осенние края, где воздух уже не обжигает холодом.\n\nКоролевская Гавань пахнет дымом, солью и людской теснотой. Иными словами — домом. Город встречает короля и королеву радостными криками, двор — горой прошений. А Алисанна, очаровавшая Винтерфелл, пировавшая с чёрными братьями и долетевшая на драконе до края мира, признаётся мне, что, глядя со спины Среброкрылой на Красный замок, испытала нечто вроде сожаления: путешествие окончилось.\n\nНо ещё не совсем. Всю дорогу домой она ждала случая рассказать мне кое-что из услышанного на Севере."
 fab_north.0038.a:0 "Что ж, я готов выслушать всё."
 fab_north.0039.t:0 "Первая ночь"
 fab_north.0039.desc:0 "Она приходит ко мне не как жена, а как просительница. Вместе с ней словно входят все женщины, которых она выслушала, — из каждого зала от Белой Гавани до Кротового городка. Каждый голос, прозвучавший после того, как лордов попросили выйти.\n\n«Право первой ночи, — говорит Алисанна. — Право лорда на невесту прежде её мужа. Мейстеры зовут его древним обычаем, лорды уверяют, что почти им не пользуются. А я сидела рядом с женщинами, которые это испытали. На Севере, в Речных землях — повсюду, любовь моя. Это не обычай. Это жестокость с родословной. Ни божеский, ни людской закон не должен её терпеть. А людской закон — это ты».\n\nОна не кладёт передо мной свитков. Только ждёт. Ещё в Винтерфелле она сказала: она знает, что я сделаю, когда услышу то же, что и она."
 fab_north.0039.a:0 "Тогда слушай закон людей: право первой ночи ОТМЕНЯЕТСЯ повсюду."
 fab_north.0039.a.tt:0 "Каноническая реформа: встречи королевы Алисанны с женщинами приводят к отмене права первой ночи во всех Семи Королевствах."
 fab_north.0039.a.lords_tt:0 "Великие лорды Севера, пользовавшиеся древним правом, возмутятся. Они надолго затаят небольшую обиду и на короля, и на королеву."
 fab_north.0039.b:0 "Древние права лордов — их собственное дело. Я не стану вмешиваться."
 fab_north.0040.t:0 "Вместе"
 fab_north.0040.desc:0 "Магистры Пентоса и Тироша отправлены домой с учтивыми речами, без договора и с одинаковым возмущением, едва прикрытым шелками. Пожалуй, я это переживу.\n\nСвита уже в море. При дворе возмущены вдвойне: сперва Железный трон отказался от чести выступить посредником, а теперь король и королева собираются провести всю поездку вместе. Два дракона над одной вереницей всадников — словно сказание времён Завоевания.\n\nАлисанна ничуть не раскаивается. «Несостоявшийся договор они тебе простят, — говорит она, натягивая перчатки. — А вот Север не простил бы нам отменённого визита»."
 fab_north.0040.a:0 "Что ж, два дракона отправляются на север. Пусть королевство поднимет взгляд."
 fab_north.0040.b:0 "Вместе по Королевскому тракту — королевская поездка, лигу за лигой."
 fab_north.0041.t:0 "На север, крыло к крылу"
 fab_north.0041.desc:0 "Вермитор и Среброкрылая летят на север вдоль Королевского тракта, крыло к крылу, бронза и серебро на фоне зимнего неба. Внизу люди выходят из домов посмотреть, как над ними пролетают король и королева.\n\nПод нами проплывает Перешеек, словно затонувший мир. За ним открывается Север — белый и бесконечный. Ветер время от времени доносит до меня обрывки смеха Алисанны. Десять лет она мечтала об этом: мы вдвоём, чистый холодный воздух и целый мир, ставший таким маленьким.\n\nСерые башни на горизонте. Поднимается Винтерфелл. Посмотрим, как Север встретит двух драконов, прилетевших искать его расположения."
 fab_north.0041.a:0 "Пора снижаться. В том холодном дворе нас ждут положенные приветствия."
 fab_north.0091.t:0 "Королевский тракт"
 fab_north.0091.desc:0 "Обоз отмеряет лигу за лигой по старинке, и я начинаю понимать, чего не видел все эти годы из драконьего седла.\n\nКороль на драконе — знамение; король на дороге — ЧЕЛОВЕК, и простой люд выходит посмотреть на эту разницу. Люди стоят вдоль изгородей, держа детей на плечах. Несут прошения, эль, жалобы на местного септона, однажды даже козу — подарок; мы её оставили. На каждом привале шатёр прошений полон, и за неделю по грязным дорогам я успеваю рассудить больше мелких тяжб, чем за месяц в тронном зале.\n\nВпервые обоз с поклажей оказывается ровно там, где и я."
 fab_north.0091.a:0 "Дальше, на север."
 fab_north.0092.t:0 "Перешеек"
 fab_north.0092.desc:0 "Гать через Перешеек тянется словно древко копья: узкая полоса суши в зелёно-буром затопленном мире. Колонна идёт по двое в ряд, а с обеих сторон дышит болото.\n\nБолотные жители не показываются, но следы их повсюду: тростниковая ширма, которой час назад не было, сплетённый ребёнком оберег у дороги, однажды — копьё, воткнутое прямо в грязь на расстоянии дальнего выстрела из лука. По словам проводников, это знак вежливости. Где-то там движется Сероводье, как двигалось всегда.\n\nЛюди не любят эту дорогу. Я же неожиданно полюбил. Ни одно войско не сумело прорваться по ней, и для её защиты не нужен дракон: Перешеек защищает себя сам."
 fab_north.0092.a:0 "А за ним — Север."
 fab_walton_grudge_opinion:0 "Обвиняет короля в смерти своего брата"
 fab_kings_fire_respect_opinion:0 "Лично подавил мятеж"
 fab_progress_slight_opinion:0 "Отмена королевского объезда Севера"
 fab_queens_charm_opinion:0 "Очарование королевы Алисанны"
 fab_new_gift_gratitude_opinion:0 "Даровал Новый Дар"
 fab_new_gift_resentment_opinion:0 "Отдал северные земли Дозору"
 fab_refused_queen_opinion:0 "Отказал королеве в просьбе"
 fab_kings_sorrow_opinion:0 "Признал цену своего милосердия"
 fab_first_night_lords_opinion:0 "Отменил право первой ночи"
 fab_walton_childless_modifier:0 "Зимняя ветвь"
