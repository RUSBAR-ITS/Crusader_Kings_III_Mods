l_russian:
 fab_north.0001.t:0 "Старый Волк"
 fab_north.0001.desc:0 "Лорд Брэндон Старк танцевал на Золотой свадьбе. Я помню, как он смеялся — крупный седобородый мужчина, который в лицо называл юг «мягкой страной» и выпил под столом половину «Повелителей бури», чтобы доказать свою точку зрения. Он отправился на корабле в Белую Гавань со своими сыновьями и своим хорошим настроением, и Север поглотил его целиком.\n\nТеперь ворон из Винтерфелла расскажет мне остальное. Брэндон Старк умер в течение года после своего возвращения домой, в своей постели под снегом. На его месте сидит его сын Уолтон — они говорят, что он более твердый человек, чем его отец, быстрее рисует и медленнее улыбается.\n\nУ Севера появился новый господин, и я никогда его не встречал."
 fab_north.0001.a:0 "Зима ведёт свой счёт."
 fab_north.0002.t:0 "Мятеж у Стены"
 fab_north.0002.desc.both:0 "Письмо приходит с лежбища с еще инеем на печати, и я перечитал его дважды, прежде чем позволил себе поверить.\n\nСир Оливер Брэкен и сир Раймунд Мэллери — люди Мейгора, двоих, которых я пощадил, двоих, которых я отправил на Стену, чтобы еще можно было выжать из них что-то хорошее — восстали против своего собственного порядка. Бракен сделал себя лордом во всем, кроме имени, в Инистых Вратах; Схемы Маллери в Сэйбл Холле. Черные братья, верные своим клятвам, погибли от рук черных братьев, которые их не выполнили.\n\nМоя милость сделала это. Я отдал им жизни, а они потратили их, как фальшивую монету. Север уже шевелится — Старки не ждут отпуска с юга, когда дело касается Стены."
 fab_north.0002.desc.olyver:0 "Письмо выходит из лежбища, печать все еще покрыта инеем.\n\nСир Оливер Брекен — человек Мейгора, рыцарь, которого я пощадил и отправил на Стену — восстал против собственного приказа и стал хозяином Реймгейта. Черные братья, верные своим клятвам, погибли от рук черных братьев, которые их не выполнили.\n\nМоя милость сделала это. Я отдал ему жизнь, а он потратил ее, как фальшивую монету. Север уже шевелится — Старки не ждут отпуска с юга, когда дело касается Стены."
 fab_north.0002.desc.raymund:0 "Письмо выходит из лежбища, печать все еще покрыта инеем.\n\nСир Раймунд Мэллери — человек Мейгора, рыцарь, которого я пощадил и отправил к Стене — поднял гарнизон Собольего замка против собственных офицеров. Черные братья, верные своим клятвам, погибли от рук черных братьев, которые их не выполнили.\n\nМоя милость сделала это. Я отдал ему жизнь, а он потратил ее, как фальшивую монету. Север уже шевелится — Старки не ждут отпуска с юга, когда дело касается Стены."
 fab_north.0002.a:0 "Стена — владение Севера. Пусть волки ответят."
 fab_north.0002.a.tt:0 "Каноничный путь: лорд Уолтон Старк едет подавлять мятеж. История помнит, чем кончилась та поездка."
 fab_north.0002.b:0 "Я пощадил их. Я покончу с ними. Седлай Вермитора."
 fab_north.0002.b.tt:0 "Альтернативная история: король лично исправит свою ошибку — и от этого может зависеть жизнь Старка."
 fab_north.0003.t:0 "Волк едет"
 fab_north.0003.desc:0 "Слово следует за словом по Королевской дороге. Лорд Уолтон Старк не дождался — ни моего отпуска, ни весны. Он созвал свои знамена во дворе, где кости его отца едва остыли, снял с железных штифтов огромный ледяной клинок и поскакал на север с сильными людьми, перебираясь верхом через снег, который южная армия назвала бы непроходимым.\n\nУ свободного народа есть поговорка, говорят мне мейстеры: Стена — это край света. У Старков есть более короткий. Стена наша."
 fab_north.0003.desc.nowalton:0 "Слово следует за словом по Королевской дороге. Винтерфелл не дождался — ни моего отпуска, ни весны. Звенят знамена Севера, и суровые люди на сменных лошадях продвигаются на север сквозь снег, южная армия назвала бы непроходимых, верных черных братьев, скачущих рядом с ними.\n\nУ свободного народа есть поговорка, говорят мне мейстеры: Стена — это край света. У Старков есть более короткий. Стена наша."
 fab_north.0003.a:0 "Боги с ними. Мои и их."
 fab_north.0004.t:0 "Лёд у Инистых Врат"
 fab_north.0004.desc:0 "Это делается в Раймегейте, и это делается северным путем.\n\nМятежники удерживали ворота два дня. На третий день верные братья пересекли скользкие ледяные стены, а за ними следовали люди лорда Старка, и с наступлением сумерек сир Оливер Брэкен преклонил колени в снегу двора, который он объявил своим. На этот раз не было никакого испытания боем, никакого оправдания старой службы. Лорд Уолтон Старк услышал, как оглашаются его преступления, схватил Лед обеими руками и ударил по голове человека, которого создала моя милость.\n\nГоворят, что лорд Винтерфелла сказал только это после: «Он умер быстрее, чем люди, которых он предал»."
 fab_north.0004.desc.nowalton:0 "Это делается в Раймегейте, и это делается северным путем.\n\nМятежники удерживали ворота два дня. На третий день верные братья пересекли скользкие ледяные стены, а за ними следовали люди Севера, и с наступлением сумерек сир Оливер Брэкен преклонил колени в снегу двора, который он объявил своим. На этот раз не было никакого испытания боем, никакого оправдания старой службы. Лорд-командующий услышал оглашение его преступлений и ударил по голове человека, которого создала моя милость."
 fab_north.0004.a:0 "Один долг уплачен."
 fab_north.0005.t:0 "Бегство из Собольего замка"
 fab_north.0005.desc:0 "Сейбл Холл не дрался. Когда до них дошла весть о Инистых Вратах, сир Раймунд Мэллери и последний из мятежников перешли ночью через Стену — вниз по льду по веревке в призрачный лес, где никогда не соблюдались ни законы короля, ни законы лорда.\n\nЗа исключением того, что лорд Уолтон Старк собирается последовать за ним. Его офицеры выступали против этого; черные братья выступали против этого; проводники одичалых отказались наотрез. Он все равно выводит избранных людей за Стену. Говорят, что он ответил, что клятвопреступники, бегущие от королевского правосудия, не перестают быть клятвопреступниками, находясь по другую сторону от него."
 fab_north.0005.a:0 "Возвращайся, волк. Остались лишь ничтожества."
 fab_north.0006.t:0 "Великаны"
 fab_north.0006.desc:0 "Выжившие говорят об этом по частям, и эти кусочки не складываются воедино ни во что, что здравомыслящий человек хотел бы видеть целым.\n\nОни поймали след мятежников в призрачном лесу и три дня следовали по нему вглубь страны, где деревья старше королевств. На четвертый день лес встал. Гиганты — не костровые, а серокожие, высокие и страшные — вышли из белой тишины на колонну, и мир превратился в клубы, крики и запах расколотой сосны.\n\nГоворят, что лорд Уолтон Старк убил двоих из них. Говорят, что столько людей понадобилось, чтобы его сбить. Они привезли обратно то, что могли унести."
 fab_north.0006.a:0 "Семеро, простите меня. Я послал этих людей на север."
 fab_north.0007.t:0 "Кости для Чёрного Замка"
 fab_north.0007.desc:0 "Лорда Винтерфелла они доставили домой, в Черный Замок, по частям, завернутым в его собственный плащ. Верные братья стояли, чтобы почтить его у ворот; выжившие в походе будут носить воспоминания дольше, чем любой шрам. О сире Раймунде Маллери одичалые позже со смехом рассказали рейнджеру, что коленопреклоненные, перешедшие через Стену, были гостями на пиру — а что это был за пир, я не стану излагать на пергаменте.\n\nАларик Старк теперь является лордом Винтерфелла. Его письмо, подтверждающее мои титулы, состоит из трех строк, оно верно во всех деталях и холоднее всего, что когда-либо чувствовала Стена.\n\nОн не говорит, что моя милость убила его брата. Ему это не нужно."
 fab_north.0007.a:0 "Север помнит. Буду помнить и я."
 fab_north.0010.t:0 "На Вермиторе, на Север"
 fab_north.0010.desc:0 "Я пощадил этих людей. Что бы они ни сжигали, что бы они ни ломали, огонь начинается с меня — и я не буду сидеть в Красном замке и подсчитывать мертвых северян по воронам, пока другие люди платят мои долги.\n\nВермитор поднимается сквозь холод огромными бронзовыми волнами, Королевская дорога — серой нитью внизу, а снег за ней — белее любого пергамента. Стена, когда она впервые появляется на горизонте, представляет собой линию света, похожую на лезвие клинка.\n\nБракен оторвется от своего украденного замка и увидит, как будет выглядеть милосердие, когда оно вернется."
 fab_north.0010.a:0 "Выше. И быстрее."
 fab_north.0011.t:0 "Дракон у Инистых Врат"
 fab_north.0011.desc:0 "Никакого боя не было. Битвы никогда не будет.\n\nВермитор обрушился на двор Инистых Врат с таким звуком, словно мир развернулся, и мятеж закончился за то время, пока испуганные люди успели открыть ворота. Колонна лорда Уолтона Старка, находившаяся еще в дне пути на юг, прибыла и обнаружила мятежников, стоящих рядами на коленях в снегу, и дракона, дымящегося на льду, как гора сложенных углей.\n\nСир Оливер Брэкен получил от меня в Инистых Вратах то, что я, возможно, должен был дать ему под Красным замком: королевское правосудие, осуществленное королем. Я не спал после. Но ни один Старк не умер из-за моей милости, как и ни один черный брат — ни один с того момента, как я приземлился."
 fab_north.0011.a:0 "Это мне предстояло закончить. Это закончено."
 fab_north.0012.t:0 "За пределами досягаемости короля"
 fab_north.0012.desc:0 "Сир Раймунд Мэллери перешел через Стену еще до того, как тень Вермитора коснулась Сейбл-холла, и там даже дракон не следует за ним — Вермитор не хотел брать ледяную линию, и вместо него пошли рейнджеры. Они привезли с собой историю свободного народа, рассказанную со смехом: коленопреклоненный рыцарь, сбежавший от дракона, был гостем на пиру одичалых и не покинул его.\n\nЛорд Уолтон Старк поехал со мной к Черным воротам Замка. Жестокий человек, как они говорили, но на прощание он прижал кулак к груди, чего, как говорят его домочадцы, он не делал ни для кого со времен своего отца.\n\n— Вы пришли сами, — сказал он. «Север этого не забывает»."
 fab_north.0012.a:0 "И я не забуду Стену."
 fab_north.0020.t:0 "Давно отложенный королевский объезд"
 fab_north.0020.desc:0 "Десять лет короля, и я никогда не видел Севера. Алисанна прямо говорит об этом через карты: одно королевство не может быть половиной королевства, в котором никогда не стоял король.\n\nИтак: большой объезд, до Белой Гавани, Винтерфелла и самой Стены. И на этот раз я хочу действовать умно. После каждого моего объезда приземляется Вермитор, а затем я неделю жду свой багаж. Больше не надо. Свита, гардероб, повара, подарки — все это идет ВПЕРЕД, на корабле в Белую Гавань, и драконы догоняют колонну в пути.\n\nКоролева уже выбирает своих дам. Она много лет мечтала о Севере."
 fab_north.0020.a:0 "Объявите об этом. Драконы идут на север."
 fab_north.0020.b:0 "Север ждал десять лет. Подождёт и дольше."
 fab_north.0020.b.tt:0 "Альтернативная история: отменить объезд. Старки узнают об этом, и вся северная сюжетная ветвь не состоится. (Дрожь начнётся в положенный срок.)"
 fab_north.0021.t:0 "Посланники Пентоса и Тироша"
 fab_north.0021.desc:0 "Паруса свиты едва скрылись за горизонтом, когда в мой тронный зал прибыли Вольные города.\n\nПентос и Тирош провели три года, душая торговлю друг друга, а вместе с ней и половину узкого моря. Теперь оба посылают магистров, закутанных в шелка и отчаявшихся, умолять Железный Трон сесть между ними и заключить мир. «Это большая честь», — говорит Барт. Я говорю, что это большая ловушка: такие переговоры длятся долго, и Винтерфелл ждет меня.\n\nАлисанна, как всегда, разрубает узел. — Тогда я пойду вперед, а ты догонишь меня, когда чернила высохнут. Отменить объезд по Старкам? Я бы скорее оскорбил саму Стену."
 fab_north.0021.a:0 "Поезжай вперёд, любовь моя. Я буду недалеко."
 fab_north.0021.a.tt:0 "Каноничный путь: королева едет на север одна, а переговоры затягиваются гораздо дольше, чем кто-либо предполагал."
 fab_north.0021.b:0 "Пентос и Тирош могут починить свои сети сами. Мы едем вместе."
 fab_north.0021.b.tt:0 "Альт-история: отказаться от посредничества. Вольные Города оскорблены, но король и королева едут на север бок о бок."
 fab_north.0022.t:0 "Королева отплывает"
 fab_north.0022.desc:0 "Она спускается к кораблям серым утром со своими дамами, септами и половиной веселья двора, и в доках никогда не было так шумно.\n\nСреброкрылая, конечно, не отправляется на корабль. Она обходит гавань один раз, когда флот выделяется в заливе, серебристо-голубой на фоне облаков, и моряки клянутся, что дракон королевы намерен вести конвой весь путь на север, как гончая со своим стадом.\n\nВечером в Красном замке становится очень тихо. Я не думал, что так сильно возражаю против этого."
 fab_north.0022.a:0 "Попутного ветра, моя королева. Я буду читать каждое письмо дважды."
 fab_north.0023.t:0 "Белая Гавань"
 fab_north.0023.desc:0 "Ее первое письмо приходит из Белой Гавани, и сквозь чернила я слышу ее смех.\n\nМандерли превзошли сами себя — город, вычищенный добела, как и его название, водяные на каждом знамени, пир из миноги и зимнего пива, от которого ее дамы будут восстанавливаться в течение недели. И, будучи Алисанной, она уже сделала то, чего никогда не делал ни один король: открыла зал Нового Замка женщинам города, высоким и низким вместе, и просто слушала.\n\nПоследняя строка ее письма менее весела. — Кое-что из того, что они мне говорят, любовь моя, тебе придется услышать. Еще нет. Когда я буду дома."
 fab_north.0023.a:0 "Что начинает моя королева, королевство в итоге оказывается в выигрыше."
 fab_north.0024.t:0 "Холодный очаг"
 fab_north.0024.desc.grudge:0 "Винтерфелл, по словам ее ворона, принял ее со всей должной вежливостью и никакой теплотой.\n\nЛорд Аларик Старк встретил ее у себя во дворе, точно назвал ее титулы, расселил ее свиту — а затем подарил ей три дня серого молчания. Его брат Уолтон спит в склепе под их ногами, разорванном на части гигантами, охотящимися на мятежников, посланных МОЕЙ милостью к Стене. Аларик ни разу не написал обвинения. Он просто хранит это, как все хранит Север.\n\n«Он смотрит на меня, — пишет Алисанна, — и видит ваше прощение. Дай мне время, любовь моя. Лед тает. Ему нужно только терпение»."
 fab_north.0024.desc.kingcame:0 "Винтерфелл, как говорит ее ворон, принял ее с тщательной вежливостью и сдержанностью, которая почти, но не совсем теплота.\n\nЛорд Уолтон Старк не из тех, кто улыбается незнакомцам, но он помнит короля, который прибыл на север на драконе, чтобы ответить на свою ошибку, и его приветствие говорит об этом сотней маленьких бессловесных способов. Именно его двор остается настороже: южные королевы и их шелка странно сидят в зале, увешанном железными мечами.\n\n«Они наблюдают за мной, как ястреб на курятнике, — пишет Алисанна, — но лорд говорит своему народу, что вы сами пришли к Стене, когда это имело значение. Мы начинаем лучше, чем я надеялся."
 fab_north.0024.desc.executed:0 "Винтерфелл, по словам ее ворона, принял ее с правильной вежливостью и особой осторожностью, которую Север проявляет к южной власти.\n\nЛорда Уолтона Старка трудно читать, пишет Алисанна, но в зале нет ни горя, ни злобы — только старая северная настороженность драконов. Однажды за вином он даже высказал ей что-то вроде одобрения: его отец Брэндон рассказал ему о правосудии короля над людьми Мейгора. «Голова, а не помилование», — сказал старый лорд. «Дракон судил этих рыцарей так, как судили бы МЫ».\n\n«Дайте мне две недели, — пишет она, — и я заставлю его рассказать мне охотничьи истории своего деда»."
 fab_north.0024.desc:0 "Винтерфелл, по словам ее ворона, принял ее со всей должной учтивостью и небольшой сердечностью.\n\nЛорд Винтерфелла встретил ее у себя во дворе, точно назвал титулы, расселил ее свиту — а затем подарил ей дни серого северного молчания. Это не вражда, утверждается в ее письме; это обычай Севера с чужаками, и королева Таргариенов с драконом над головой — самый странный гость, которого Винтерфелл запомнил.\n\n«Лед тает», — пишет она. — Ему нужно только терпение."
 fab_north.0024.a:0 "Если какая-то живая душа может растопить этот зал, то это она."
 fab_north.0025.t:0 "Остроумие и чудо"
 fab_north.0025.desc:0 "Следующий ворон — совершенно другая птица.\n\nОна сделала это. Не подарками — Север невозможно купить, пишет она и презирает эту попытку, — а будучи неустанно и непоколебимо самой собой. Она выехала на охоту в такую ​​погоду, что половина ее дам легла спать. Она подражала чашке лорда Винтерфелла честной похвалой северному элю, спрашивала о его семье по имени, выслушивала старый спор о запасах зимнего зерна и урегулировала его так аккуратно, что двое из его знаменосцев теперь клянутся ей.\n\nИ наконец, на глазах у всего зала, она посадила Среброкрылую ВНУТРИ стен Винтерфелла и велела детям замка прийти и прикоснуться к живому дракону. «Лорд Винтерфелла рассмеялся», — пишет она, дважды подчеркивая это. — Его домашние говорят, что не слышали этого с тех пор, как он приехал к светлости."
 fab_north.0025.a:0 "Королевство завоевало её с меньшими усилиями, чем Север."
 fab_north.0026.t:0 "Королева поднимается в небо"
 fab_north.0026.desc:0 "Из Винтерфелла она делает то, чего боялся ее сопровождающий и обещал в своих письмах: она покидает их.\n\nСреброкрылая поднимается из серого каменного круга Винтерфелла в небо, подобное полированной стали, и Королева Семи Королевств летит на длинном призраке Королевской Дороги на север, над последними фермами, последними крепостями, последними деревьями — туда, где мир просто останавливается. Ее эскорт будет догонять ее через две недели. Она намерена провести эти две недели среди черных братьев Черного Замка.\n\n«Лорды были шокированы», — говорится в ее письме. «Местные люди приветствовали. Я обнаружил, что я с простым народом."
 fab_north.0026.desc.together:0 "В Винтерфелле она делает то, чего боялся ее сопровождающий, и я, если честно, пообещал себе, что она этого не сделает: она покидает нас.\n\nСреброкрылая поднимается из серого каменного круга Винтерфелла в небо, подобное полированной стали, и моя Королева летит на длинном призраке Королевской дороги на север, над последними фермами, последними крепостями, последними деревьями — туда, где мир просто останавливается. «Тебе нужно победить своих лордов, — сказала она мне во дворе, натягивая перчатки, — а мне нужны мои черные братья. Мы поговорим друг с другом, когда я вернусь.\n\nЕе эскорт будет догонять ее через две недели. Она не намерена их ждать."
 fab_north.0026.a:0 "Никогда не было такой королевы, как она. И никогда не будет."
 fab_north.0027.t:0 "Чёрный стол"
 fab_north.0027.desc.grudge:0 "Дозор угощает ее в Черном замке соленой говядиной, черным хлебом и совершенной честностью — и она, как она пишет, полностью побеждена.\n\nНо Стена тоже ведет свою бухгалтерскую книгу. За столом старый рейнджер осторожно рассказал о мятеже: о Инистых Вратах, о братьях, которые умерли, сдерживая свои клятвы, о лорде Уолтоне Старке, которого унесли домой в кусках, потому что двое из помилованных рыцарей Мейгора сочли черное пальто слишком плохим. Лорд-командующий заставил его замолчать взглядом — но молчание после, как она пишет, имело вес.\n\n— Они слишком вежливы, чтобы сказать это своей королеве. Я скажу это моему королю. Дозор заплатил за белые плащи, которые ты сэкономил, любовь моя. Они это знают. Мы тоже должны это сделать."
 fab_north.0027.desc.kingcame:0 "Дозор угощает ее в Черном замке соленой говядиной, черным хлебом и совершенной честностью — и она, как она пишет, полностью побеждена.\n\nИ здесь, на краю света, твое имя — хорошая монета, любовь моя. Старшие братья до сих пор рассказывают это: в ту зиму восстали помилованные рыцари, и король, который не послал ни ворона, ни армии, а пришел САМ, протянул бронзовые крылья над Раймгейтом и положил конец зиме прежде, чем Север похоронил хотя бы одного верного человека. Старый Медведь лорда-командующего, который у них тогда был, мертв, но его слова пережили его: «Железный Трон однажды вспомнил о нас». Смотри, чтобы тебя помнят дважды».\n\n«Здесь за тебя пьют», — пишет она. — Я подумал, тебе следует знать, что где-то в твоем королевстве люди в черном пьют за короля."
 fab_north.0027.desc.executed:0 "Дозор угощает ее в Черном замке соленой говядиной, черным хлебом и совершенной честностью — и она, как она пишет, полностью побеждена.\n\nОдна вещь удивила ее. Она деликатно ожидала некоторого недовольства по поводу рыцарей Мейгора — белых плащей, которые могли прийти к Стене, но не пришли, потому что вместо этого король дал им меч. Она обнаружила обратное. — Короли имеют добрые намерения, когда опустошают нас из своих подземелий, — сказал ей за вином лорд-командующий. — Они посылают к нам своих предателей и называют это милосердием. Ваш король не послал к нам никого, кому он не мог бы доверять. Дозор поблагодарил худших людей за лучшие подарки.\n\n«Кажется, — пишет она, — что здесь более трудный выбор оказался более добрым. Я все еще решаю, что я об этом думаю»."
 fab_north.0027.desc.exiled:0 "Дозор угощает ее в Черном замке соленой говядиной, черным хлебом и совершенной честностью — и она, как она пишет, полностью побеждена.\n\nЗа столом прозвучал один твердый тост. Рыцари Мейгора, те, кого король пощадил и отправил через Узкое море — Дозор слышал рассказы о том, как они продавали свои мечи в Эссосе, без присяги и с комфортом, а черные братья находят это горьким пивом. «Каждому лорду в цепях предлагается Стена», — сказал старый рейнджер. «Кажется, за белый плащ можно получить более мягкий приговор». Лорд-командующий не заставил его замолчать.\n\n«Они бы взяли этих рыцарей, любовь моя, — пишет она, — и порадовались бы мечам. Помните о Стене, в следующий раз милосердие будет в вашем даре»."
 fab_north.0027.desc:0 "Дозор угощает ее в Черном замке соленой говядиной, черным хлебом и совершенной честностью — и она, как она пишет, полностью побеждена.\n\nОни показали ей ледяные камеры и клетку с лебедкой, арсенал с тысячами старых мечей, бухгалтерские книги с их ужасной арифметикой: Стену, построенную для десяти тысяч, удерживаемую сотнями. Она спросила лорда-командующего, что нужно Дозору, и он засмеялся и сказал «все», а затем, увидев ее лицо, перестал смеяться и начал отвечать честно. Список занял второй лист.\n\n«Я приехала на север, ожидая полюбоваться чудом», — пишет она. «Я нашел девятьсот бедных и честных людей, поддерживающих небо, и собираюсь что-то с этим сделать»."
 fab_north.0027.a:0 "Прочитай мне список снова. Весь."
 fab_north.0028.t:0 "Среброкрылая не желает пересекать Стену"
 fab_north.0028.desc:0 "Одно письмо я буду хранить до самой смерти.\n\n«Трижды я пыталась направить её туда, любовь моя. Трижды. Я всего лишь хотела перелететь Стену и вернуться — увидеть Зачарованный лес сверху и сказать, что королева побывала за Стеной. Среброкрылая никогда мне ни в чём не отказывала. Но в этом отказала. Каждый раз, когда мы оказывались над этим льдом, она кричала и резко сворачивала на юг. Никакие понукания не заставляли её лететь дальше. На третий раз я почувствовала это сама — я не могу описать, что это было. Холод, который вовсе не холод. НЕТ — огромное, как весь мир.\n\nЧем бы ни была Стена, Джейхейрис, она не просто лёд. Наши драконы знают что-то, чего не знаем мы. Потом я долго сидела на снегу в Чёрном замке. Лорд-командующий молчал, и я была ему за это благодарна»."
 fab_north.0028.a:0 "Что бы ни охраняло ту Стену, дай боги, оно никогда не падёт."
 fab_north.0028.b:0 "Даже драконы знают, где кончается мир. Моя королева нашла край."
 fab_north.0029.t:0 "Что услышала королева"
 fab_north.0029.desc:0 "Она вернулась в Винтерфелл, когда пришло длинное письмо — то, которое она обещала в Белой Гавани, написанное более твердым почерком, чем обычно.\n\nНа каждой остановке этого объезда она проводила свои женские суды: зал очищался от лордов, двери открывались для любой женщины, которая хотела говорить, от рыбниц из Белой Гавани до прачек черных братьев из Кротового города. Письмо наполнено двумя вещами. Первый — это Дозор: девятьсот человек держат сто лиг льда на нищем участке, в то время как хорошие земли к югу от Стены находятся под властью лордов, которые никогда не смотрят на север. У нее есть идея на этот счет, пишет она, и с ней я попаду в засаду в Винтерфелле.\n\nВторое она вообще не напишет. — Это касается старого права лордов и женщин, в отношении которых оно применяется. Когда ты услышишь то, что слышал я, ты положишь этому конец. Я знаю тебя.'"
 fab_north.0029.desc.together:0 "Она возвращается в Винтерфелл после снежного шквала, обветренная и серьезная, и в тот первый вечер она не рассказывает истории за столом, как на каждой другой остановке этого пути.\n\nПозже, у огня в наших покоях, она отдает мне обе половины того, что дал ей Север. Первый — это Дозор: девятьсот человек держат сто лиг льда на нищем участке, в то время как хорошие земли к югу от Стены находятся под властью лордов, которые никогда не смотрят на север. У нее есть идея на этот счет, и она намерена высказать ее перед всем двором лорда Старка, где ее нельзя будет спокойно отвергнуть.\n\nВторое она говорит очень тихо, наблюдая за огнем. — Это касается старого права лордов и женщин, в отношении которых оно применяется. Когда мы будем дома, любовь моя, я расскажу тебе то, что мне сказали мои женские суды, — и тогда ты покончишь с этим. Я знаю тебя.'"
 fab_north.0029.a:0 "Тогда дай мне добраться до севера и быть застигнутым врасплох."
 fab_north.0030.t:0 "Длинный стол"
 fab_north.0030.desc:0 "Два месяца, вот. Два месяца арифметики Пентоши и театра Тыроши.\n\nКаждое пропущенное очко возобновляется на следующее утро в разных вариантах. Люди Тирошского архонта дважды на этой неделе уходили из-за формулировки преамбулы — ПРЕАМБУЛЫ — и магистры Пентоши так широко улыбались этому повороту событий, что я почти отправил всю их группу домой в одном корпусе, чтобы закончить войну на море.\n\nИ каждый третий день ворон с Севера садится, словно солнечный свет, на этот стол: моя королева побеждает Винтерфелл, пирует с черными братьями, летает на край света. Полгода я ей обещал максимум. Чернила далеко не высохли."
 fab_north.0030.a:0 "Барт, скажи людям архонта, что преамбула остаётся в силе. Вся."
 fab_north.0031.t:0 "Наконец условия"
 fab_north.0031.desc:0 "Готово. Подписано, запечатано, приведено к присяге перед богами, старыми, новыми и всем, что Тироши хранят в своих расписанных храмах. Пентос и Тирош обретают мир; Узкое море вернуло свои торговые пути; Железный Трон имеет благодарность двух Вольных Городов и, что гораздо более полезно, их тарифные уступки.\n\nПолгода, достаточно близко, чтобы не иметь значения. Алисанна ушла в одном сезоне и пишет мне из другого.\n\nВинтерфелл находится далеко на севере, и мне надоело ждать."
 fab_north.0031.a:0 "На север, и быстро. Готовьтесь к дороге — я не буду ждать ни дня."
 fab_north.0031.a.tt:0 "Начать путешествие в Винтерфелл. В меню путешествия король может взять Вермитора и прибыть за несколько дней, или поехать верхом, если пожелает. (Отмена плана путешествия не оборвёт историю.)"
 fab_north.0031.b:0 "По королевской дороге, с подобающей колонной — пусть Север УВИДИТ, как приходит король."
 fab_north.0031.b.tt:0 "Начать медленный объезд по королевской дороге в Винтерфелл со всей помпой королевской колонны, и дорога будет иметь свои истории. (Отмена плана путешествия не оборвёт историю.)"
 fab_north.0033.t:0 "Холодный приём"
 fab_north.0033.desc.grudge:0 "Лорд Аларик Старк принимает меня во дворе Винтерфелла со всеми почестями, которых требует закон, и ни одним жестом больше.\n\nЕго вежливость точна. Его глаза — могила его брата. Алисанна предупредила меня — полгода ее тепла подарили мне разницу между враждебностью и корректностью, не более того — и все равно холод этого двора проникает сквозь меха. Это лорд, чей брат поехал на север, чтобы навести порядок по МОЕЙ милости, и вернулся домой разбитым на части.\n\nУ дверей он останавливается. — Прежде чем вы начнете пировать, ваша светлость, — говорит он, — в склепе есть кое-что, что я хотел бы вам показать. Это не займет много времени. Мертвые не любят судить."
 fab_north.0033.desc.kingcame:0 "Лорд Уолтон Старк принимает меня во дворе Винтерфелла, и на мгновение мрачное лицо и серые меха — это все, что я вижу, — а затем он делает то, чего весь его двор явно не ожидал: он спускается по ступенькам и сжимает мою руку, как товарищ.\n\n«В последний раз, когда я видел вашу светлость, — говорит он, — вы были длиной в бронзовые крылья над Раймгейтом, и худшая зимняя работа в моей жизни закончилась еще до того, как моя колонна достигла ее. Я часто рассказывал эту историю. Теперь они все могут перестать верить, что я это изобрел».\n\nПозади него смеется Алисанна. Север холодный. Этого зала сегодня вечером не будет."
 fab_north.0033.desc.executed:0 "Лорд Уолтон Старк принимает меня во дворе Винтерфелла с серьезной, неторопливой учтивостью человека, который редко становится на колени и делает это серьезно.\n\n— Мой отец Брэндон говорил о вас, ваша светлость, — говорит он, когда мы поднимаемся по ступенькам. — Он вернулся домой с Золотой свадьбы и сказал, что юг наконец-то стал настоящим королем — тем, кто вместо прощения отдал головы собакам Мейгора. Он сказал, что Север судит человека по тому, что он делает с мечом, когда у него есть долг. Он счел, что ты подходишь.\n\nИз Старка шепчет Алисанна мне в плечо: это свадебный пир, турнир и триумф вместе взятые."
 fab_north.0033.desc.together:0 "Винтерфелл принимает нас обоих во дворе, чистом, как пол в септе, и лорд Винтерфелла оказывает нам честь с четкой, размеренной, совершенно нечитаемой северной вежливостью.\n\nМы шли на север бок о бок — драконы над длинной колонной свиты, посланники Вольных городов, отправленные домой, чтобы починить собственные сети — и если толпы зимнего города приветствовали это зрелище, зал Винтерфелла оставляет за собой право судить. Север не любит гостей, приезжающих впечатляюще.\n\nАлисанна сжимает мою руку, когда дверь за нами закрывается. — Терпение, любовь моя. Лед тает. Я делал это раньше."
 fab_north.0033.desc:0 "Лорд Старк принимает меня во дворе Винтерфелла со всеми почестями, которых требует закон, и с особой охраняемой тишиной, которую Север соблюдает для драконов.\n\nПолгода тепла Алисанны прошли раньше меня и сделали этот путь более гладким, чем мог бы быть: зал правильный, пир уже накрыт, слова — все правильные слова. Но глаза, которые следят за мной по всему дымному залу, принадлежат лордам, чьи отцы преклонили колени передо мной под угрозой огня, и никто из них этого не забыл.\n\nВинтерфелл будет завоеван так же, как его выиграла Алисанна, или не будет вообще: медленно."
 fab_north.0033.a:0 "Тогда посмотрим, что Север хочет показать своему королю."
 fab_north.0034.t:0 "Склеп Винтерфелла"
 fab_north.0034.desc:0 "Мы спускаемся с факелами мимо каменных королей в их рядах — Королей Зимы с мечами на коленях и лютоволками у ног, десять тысяч лет они слепо смотрели в темноту. Лорд Аларик ничего не говорит на протяжении всего спуска.\n\nОн останавливается у могилы, более новой, чем остальные, камень все еще бледный. Это изображение крупного мужчины с клинком на коленях, и мне не нужно, чтобы мне читали имя.\n\n«Мой брат Уолтон», — говорит Аларик. — Он повел Лед на север против людей, которых Ваша Светлость послала к Стене, и обезглавил им первого из них. Остальных он преследовал за Стеной, в призрачный лес. Гиганты разорвали его на пять частей. Мы похоронили то, что вернулось». Он поднимает факел и наконец смотрит на меня. — Вы пощадили этих рыцарей, ваша светлость. Вот уже восемь лет я задаюсь вопросом, что на это говорит король»."
 fab_north.0034.a:0 "Ваш брат заплатил мою долю цены за это милосердие. Мне жаль, лорд Старк."
 fab_north.0034.b:0 "(Ничего не говорить. Мёртвые ничего не просят.)"
 fab_north.0035.t:0 "Два волка за столом"
 fab_north.0035.desc.kingcame:0 "Здесь нет могилы, которую можно было бы посетить, и никакой обиды на нее не хранится. Вместо этого устраивают пир — и за высоким столом лорд Винтерфелла рассказывает своим знаменосцам, еще раз, по многочисленным просьбам, историю о зиме, когда король пришел на север.\n\n«Инистые Врата должен был стать МОЕЙ могилой, как бы то ни было», — говорит Уолтон Старк с мрачным удовлетворением, которое Север приберегает для своих самых редких побегов. — Штурм замка на Стене в мятежную зиму — спросите Дозор, чего это стоит. А потом небо сотряслось, и ворота мятежников открылись, и все проклятое дело было сделано до того, как моя колонна преодолела Дар. Он поднимает мне чашку, и зал подходит к нему. — За долг, который король заплатил САМ, сэры. Север помнит и хорошее, и плохое»."
 fab_north.0035.desc.executed:0 "В этом зале нет ни могилы, которую стоит посетить, ни обиды — только пир и лорд Винтерфелла, который в ходе него превращается из гранита в простой дуб.\n\nУже поздно, и огонь тухнет, когда Уолтон Старк наконец заговаривает об этом. — Мой отец говорил, что ваше правосудие купило этот мир, ваша светлость. Рыцари Мейгора, те, которым ты дал меч. Он медленно поворачивает чашку. «Мне говорили, что на юге люди называют это суровым. Ни один северянин не называл это так. Клятвопреступники, отправленные на Стену, по-прежнему остаются клятвопреступниками — Дозор хоронил братьев за меньшую милость. Ты потратил шесть голов, чтобы избавить его от этого. Винтерфелл считает сделку дешевой.\n\nАлисанна ловит мой взгляд через стол. СЛУШАЙ, говорит ее взгляд. Север говорит вам, что доверяет вам."
 fab_north.0035.desc:0 "Под этим залом нет ни могилы, которую стоит посетить, ни старой раны — только пир на северный манер, то есть огромный, неторопливый и честный.\n\nЛорд Винтерфелла пьет со мной, рассказывает об урожаях, волчьих стаях и состоянии Королевской дороги, и где-то за полночь — точный момент трудно определить — я понимаю, что меня перестали проверять и начали принимать. Полгода работы Алисанны потрачено за один вечер.\n\nСевер ничего не дает быстро. Что это дает, это значит."
 fab_north.0035.a:0 "За Винтерфелл, затем. И за терпеливых королев."
 fab_north.0036.t:0 "Новый Дар"
 fab_north.0036.desc:0 "Она устраивает мне засаду в Винтерфелле, как и обещала, и делает это перед собравшимся судом, и именно поэтому я знаю, что она хочет победить.\n\n«Ночной Дозор держит сотню лиг Стены на нищей части», — говорит моя Королева. — Девятьсот человек там, где когда-то стояли десять тысяч, питаясь Даром Брэндона, в то время как лорды к югу от него жиреют, глядя в другую сторону. Я прошу короля удвоить земли Дозора: каждую лигу к югу от Дара, от одного моря до другого. Пусть его назовут Новым Даром, и пусть Стена съест».\n\nВ зале стало очень тихо. Лорды, чьи земли это, стоят вдоль него, как стоячие камни. Лицо лорда Старка закрыто. Люди лорда-командующего, сидящие за столом, перестали дышать."
 fab_north.0036.a:0 "Пусть будет так. Новый Дар — Дозору, в вечное владение."
 fab_north.0036.a.tt:0 "Каноничный дар: графства Нового Дара переходят к Лорду-Командующему Ночного Дозора. Дозор не забудет этого — и северные лорды тоже не забудут."
 fab_north.0036.b:0 "У Стены достаточно земли. Север оставляет своё себе."
 fab_north.0037.t:0 "Корона Королевы"
 fab_north.0037.desc:0 "На новых землях есть деревня на озере с каменным домом-башней на холме, к которому ведет потайная дамба, и именно там королева укрывается в свою последнюю северную ночь.\n\nДеревенские женщины угощают ее тем, что есть. Утром, когда колонна выстраивается, Алисанна снимает со своих волос золотой обруч — тот, который она носила на протяжении всего этого пути, — и передает его в руки деревенского старейшины, чтобы он навсегда хранился в этом месте в память о пребывании королевы.\n\nОни звонят в деревню Квинскрон, прежде чем колонна скроется из виду. Я подозреваю, что они будут называть это так, когда все, кто мог бы сказать, почему десять столетий превратились в пыль."
 fab_north.0037.a:0 "Север сохранит эту корону дольше, чем любая моя сокровищница."
 fab_north.0038.t:0 "Дорога домой"
 fab_north.0038.desc:0 "Снова юг — крылья, паруса и длинная колонна, катящаяся по Королевской дороге, из снегов в осеннюю страну, где воздух перестает причинять боль.\n\nКоролевская Гавань пахнет дымом, солью и слишком большим количеством людей, то есть домом. Город радушно приветствует своих короля и королеву; суд дает нам гору ходатайств; и Алисанна, которая очаровала Винтерфелл, пировала с черными братьями и поставила своего дракона на краю света, смотрит на Красный Замок со спины Среброкрылой, говорит она мне, с чем-то вроде разочарования, что все закончилось.\n\nЭто еще не конец. На Севере она слышала кое-что, что ждала всю дорогу домой, чтобы предстать передо мной."
 fab_north.0038.a:0 "Тогда дай нам услышать это. Всё."
 fab_north.0039.t:0 "Первая ночь"
 fab_north.0039.desc:0 "Она приходит ко мне не как моя жена, а как просительница, и она приводит с собой своих женских придворных — каждый зал от Белой Гавани до Кротового Города, каждый голос, который говорил, когда лордов высылали из комнаты.\n\n«Право первой ночи», — говорит Алисанна. — Претензии лорда на невесту перед ее мужем. Мейстеры называют это старым обычаем, а лорды называют его редко используемым, и я сидел с женщинами, к которым он применялся. На Севере, в речных землях — повсюду, любовь моя. Это не принято. Это жестокость с родословной. Ни один закон богов или людей не должен потерпеть этого, а вы — закон людей».\n\nОна не ставит передо мной ни одного свитка. Она только ждет. В Винтерфелле она сказала мне, что знает, что я сделаю, когда услышу то же, что услышала она."
 fab_north.0039.a:0 "Тогда слушай закон людей: право первой ночи ОТМЕНЯЕТСЯ повсюду."
 fab_north.0039.a.tt:0 "Каноническая реформа: встречи королевы Алисанны с женщинами приводят к отмене права первой ночи во всех Семи Королевствах."
 fab_north.0039.a.lords_tt:0 "Великие северные лорды, сохранявшие старое право, будут возмущены — небольшой, но постоянной обидой и на Короля, и на Королеву."
 fab_north.0039.b:0 "Старые права лордов — дело лордов. Я не стану вмешиваться в их залы."
 fab_north.0040.t:0 "Вместе"
 fab_north.0040.desc:0 "Магистров Пентоса и Тироша отправляют домой с прекрасными словами, без договора и с одинаковыми выражениями прикрытого шелком возмущения, и я считаю, что могу с этим жить.\n\nСвита уже в море. Двор дважды подвергается скандалу: один раз, что Железный Трон отказался от чести быть посредником, и еще раз, что король и королева собираются совершать весь процесс бок о бок, два дракона над одной колонной, как в какой-то сказке из Завоевания.\n\nАлисанна совершенно не раскаивается. «Они простят вам утраченный договор», — говорит она, натягивая перчатки для верховой езды. «Север никогда бы не простил нам утраченного объезда»."
 fab_north.0040.a:0 "Два дракона на север, тогда. Пусть королевство поднимет взгляд."
 fab_north.0040.b:0 "Вместе по королевской дороге — настоящий королевский объезд, лигу за лигой."
 fab_north.0041.t:0 "Крылья на север вместе"
 fab_north.0041.desc:0 "Вермитор и Среброкрылая ведут линию Королевского тракта от кончика к кончику крыла, бронзовые и серебряные на фоне зимнего неба, а под нами королевство выходит из дверей, чтобы посмотреть, как проезжают его король и королева.\n\nПерешеек ползет вниз, словно затонувший мир; затем открывается Север, белый и бесконечный, и смех Алисанны обрывками разносится через пропасть между нашими драконами, когда позволяет ветер. Она хотела этого десять лет: мы вдвоем, холодный чистый воздух, маленький мир.\n\nСерые башни на горизонте. Винтерфелл восстает. Давайте посмотрим, что Север делает с двумя ухаживающими драконами."
 fab_north.0041.a:0 "Вниз, теперь. Учтивость ждёт на том холодном дворе."
 fab_north.0091.t:0 "Королевская дорога"
 fab_north.0091.desc:0 "Обоз отмеряет лигу за лигой по старинке, и я начинаю понимать, чего не видел все эти годы из драконьего седла.\n\nКороль на драконе — знамение; король на дороге — ЧЕЛОВЕК, и простой люд выходит посмотреть на эту разницу. Люди стоят вдоль изгородей, держа детей на плечах. Несут прошения, эль, жалобы на местного септона, однажды даже козу — подарок; мы её оставили. На каждом привале шатёр прошений полон, и за неделю по грязным дорогам я успеваю рассудить больше мелких тяжб, чем за месяц в тронном зале.\n\nВпервые обоз с поклажей оказывается ровно там, где и я."
 fab_north.0091.a:0 "Дальше, на север."
 fab_north.0092.t:0 "Перешеек"
 fab_north.0092.desc:0 "Гать через Перешеек тянется словно древко копья: узкая полоса суши в зелёно-буром затопленном мире. Колонна идёт по двое в ряд, а с обеих сторон дышит болото.\n\nБолотные жители не показываются, но следы их повсюду: тростниковая ширма, которой час назад не было, сплетённый ребёнком оберег у дороги, однажды — копьё, воткнутое прямо в грязь на расстоянии дальнего выстрела из лука. По словам проводников, это знак вежливости. Где-то там движется Сероводье, как двигалось всегда.\n\nЛюди не любят эту дорогу. Я же неожиданно полюбил. Ни одно войско не сумело прорваться по ней, и для её защиты не нужен дракон: Перешеек защищает себя сам."
 fab_north.0092.a:0 "А за ним — Север."
 fab_walton_grudge_opinion:0 "Обвиняет короля в смерти своего брата"
 fab_kings_fire_respect_opinion:0 "Лично подавил мятеж"
 fab_progress_slight_opinion:0 "Отмена королевского объезда Севера"
 fab_queens_charm_opinion:0 "Очарование королевы Алисанны"
 fab_new_gift_gratitude_opinion:0 "Даровал Новый Дар"
 fab_new_gift_resentment_opinion:0 "Отдал северные земли Дозору"
 fab_refused_queen_opinion:0 "Отказал королеве в просьбе"
 fab_kings_sorrow_opinion:0 "Признал цену своего милосердия"
 fab_first_night_lords_opinion:0 "Отменил право первой ночи"
 fab_walton_childless_modifier:0 "Зимняя линия"
