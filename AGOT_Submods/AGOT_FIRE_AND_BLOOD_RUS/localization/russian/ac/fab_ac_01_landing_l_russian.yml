l_russian:
 fab_ac_landing.0001:0 "Полёт драконов"
 fab_ac_landing.0001.desc:0 "Сто лет назад мир счёл моего предка Эйнара безумцем. Лорд Эйнар Таргариен, один из малых драконьих владык могучей Валирии, продал свои владения и перевёз весь дом — жён, детей, драконов и прочих домочадцев — на мрачную дымящуюся скалу у западной окраины мира. Единственной причиной стали сны его дочери. Двенадцать лет спустя Четырнадцать Огней за одни сутки разорвали Валирию на части, и величайшая из известных миру цивилизаций утонула в пламени и солёной воде. Дейнис Сновидица узрела истину. Из всех драконьих владык Фригольда выжили лишь мы. Мы — последние.\n\nС тех пор миновало сто лет — целый век, который мир запомнил как одно непрерывное кровопролитие. Дочери Валирии терзали друг друга над телом своей матери. Я познал эти войны: когда Пентос и Тирош попросили юного лорда Драконьего Камня помочь им против цепких волантийцев, я полетел на восток верхом на Балерионе, сжёг военный флот до ватерлинии и вернулся домой. Магистры пировали в мою честь и умоляли остаться. Я отказался. На востоке нет ничего, кроме старого пепла, за который сражается другой старый пепел.\n\n#bold Запад всегда звал меня. Он звал Эйнара за сто лет до меня — и теперь я наконец понимаю почему.#!"
 fab_ac_landing.0001.option1:0 "Запад зовет."
 fab_ac_landing.0002:0 "Расписной стол"
 fab_ac_landing.0002.desc:0 "Много лет назад я приказал плотникам Драконьего Камня вырезать для меня стол. К концу работы они наверняка решили, что их господин сошёл с ума: пятьдесят футов в длину и двадцать пять в самом широком месте, высеченный из цельной огромной глыбы дерева и расписанный до последнего дюйма так, чтобы повторять облик Вестероса. Каждая река и бухта, каждый горный хребет и развалины древних кольцевых крепостей, каждый замок, город и укрепление от Староместа до Стены были нанесены в точности. Мои художники трудились над картами сотен купцов и рассказами тысяч странников.\n\nЛишь одно я запретил им изображать: границы. Обойдите стол — и вы не найдёте ни черты между Штормовыми землями и Простором, ни шва, разделяющего королевства, которые андалы выкраивали друг у друга. С возвышения в чертоге Драконьего Камня, где я сейчас сижу между сёстрами, под треск жаровни за спиной, видна истина, которую эти линии призваны скрыть.\n\n#bold Никогда не было семи королевств. Это единая земля. Ей нужен лишь один король.#!"
 fab_ac_landing.0002.option1:0 "Одна земля. Один король."
 fab_ac_landing.0003:0 "Высокомерный олень"
 fab_ac_landing.0003.desc:0 "Чудовищный замок Харрена Чёрного у Божьего Ока наконец близок к завершению, а вместе с ним — сорок лет страданий Речных земель. Человек, посвятивший жизнь величайшей крепости мира, не намерен мирно сидеть за её стенами. Весь Вестерос шепчется о новых завоеваниях Харрена, и никто не тревожится сильнее его соседа, Короля Бури.\n\nИ вот Аргилак Дюррандон, состарившийся и впервые за свою гордую жизнь испуганный, прислал из-за моря предложение: союз против Харрена, скреплённый браком с его дочерью Аргеллой, и приданое — земли вдоль Черноводной, которые станут преградой между оленем и кракеном. Стоит отметить, что эти земли принадлежат Харрену, а не Аргилаку: старик предложил мне владения другого короля. От руки дочери я учтиво отказался — кровь дракона не нуждается в жёнах; две мои сестры стали моими супругами по древнему валирийскому обычаю. Вместо себя я предложил Ориса Баратеона, самого близкого друга и, если верить слухам, моего брата, а в приданое попросил земли, которыми Аргилак действительно владеет.\n\nСегодня его ответ доставили в ящике. Руки моего посланника, засоленные, словно свинина. И слова: #italic «Других рук ты от меня не получишь».#!\n\n#bold Его зовут Надменным. Сегодня он оправдал своё прозвище — и узнает ему цену.#!"
 fab_ac_landing.0003.option1:0 "Аргилак потеряет из-за этого не только руки."
 fab_ac_landing.0004:0 "Лорд Драконьего Камня"
 fab_ac_landing.0004.desc:0 "Ящик стоит открытым на Расписном столе. Мейстер говорит, что посланник выживет. Но меча он больше не возьмёт.\n\nЯ был терпелив. Годами короли Вестероса слали на Драконий Камень воронов, прося моих драконов для своих войн, мой флот для своих распрей и брака с моим домом для своих дочерей — словно кровь дракона была отрядом наёмников, который можно нанять, умаслить лестью и отпустить. Оскорбление Аргилака — лишь последнее и самое грубое из сотни. Они видят мелкого лорда на бесплодной скале. Они забыли, кто вышел из Валирии и кого не сумел уничтожить Рок.\n\nС меня довольно любезностей мелких лордов и мелочных королей. Из всех домов древней Валирии лишь мой пережил Рок вместе с драконами, и больше ни у кого под солнцем их нет. Все они приняли моё терпение за слабость.\n\n#bold Довольно. Вестерос станет моим.#!"
 fab_ac_landing.0004.option1:0 "#S Мы отвечаем огнем и кровью. #!"
 fab_ac_landing.0005:0 "Дракон летит на запад"
 fab_ac_landing.0005.desc:0 "Я созвал знамёна и держал совет — с сёстрами, с Орисом, с лордами Узкого моря. Веларионы и Селтигары, родичи моего дома и такие же валирийцы, как мы, встали на мою сторону ещё до того, как я закончил говорить. Лорд Бар Эммон из Острого Мыса и лорд Масси из Камнепляса преклонили колено в тот же час. Мелкие лорды, сказали бы короли Вестероса. Первые лорды нового королевства, говорю я.\n\nЗатем я разослал воронов — каждому королю и великому лорду Вестероса, и все они несли одни и те же слова. Отныне в Вестеросе один король. Те, кто преклонит колено перед Эйгоном из дома Таргариенов, сохранят земли и титулы, лишившись лишь корон. А те, кто поднимет против него оружие, будут низвергнуты, унижены и уничтожены.\n\nМейстеры заметят, что я не обращался к отдельным королевствам, не признавал границ и счёл семь корон семью проявлениями тщеславия. Это не оплошность. Я стоял у Расписного стола и знаю, что такое Вестерос, даже если сам Вестерос пока этого не знает.\n\n#bold Во всех чертогах от Солнечного Копья до Винтерфелла прочтут: дракон не просит дважды.#!"
 fab_ac_landing.0005.option1:0 "В Вестеросе только один король."
 fab_ac_landing.0006:0 "Ответ Жабы и Ястреба"
 fab_ac_landing.0006.desc:0 "Вороны возвращаются, и два ответа заслуживают особого внимания.\n\nИз Солнечного Копья пишет Мерия Мартелл, принцесса Дорна: ей восемьдесят лет, она слепа, необъятно тучна и по-прежнему хитра настолько, насколько опасаются её враги. Жёлтая Жаба предлагает мне союз против Штормового короля Аргилака. Союз! Она будет сражаться рядом со мной, делить добычу — и ни в чём мне не уступит. Из Орлиного Гнезда пишет Шарра Аррен, регент Долины при своём мальчике Роннеле, расставляя более тонкую ловушку: союз, скреплённый браком со мной. Она присылает портрет и напоминает, что некогда её звали Цветком Горы, — нужно лишь назвать её сына моим наследником. Она жаждет получить восточный берег Зелёного Зубца и хочет, чтобы мои драконы отняли его для неё у Харрена.\n\nЯ отказал обеим, и жабе, и ястребу, одними и теми же словами: вороны отправились искать не союзников. Они отправились искать подданных. В грядущем мире нет места королям и королевам, которые станут говорить со мной на равных, — ибо в Вестеросе мне нет равных.\n\n#bold Пусть ещё немного поносят свои короны. В своё время я приду за ними — под знаменем, которое узнает весь мир.#!"
 fab_ac_landing.0006.option1:0 "Я ищу подданных, а не союзников."
 fab_ac_landing.0007.t:0 "Три головы дракона"
 fab_ac_landing.0007.desc:0 "Драконьи владыки древней Валирии не носили знамён. Фригольд не шёл на войну под гербами: дракон над головой был достаточно красноречив. Но я намерен править не Валирией, а Вестеросом, и Вестерос узнаёт мир по знамёнам: лютоволк и кракен, лев и олень, сокол и солнце с копьём.\n\nТак дадим ему знамя, которое запомнится. Висенья сама следила за работой: поле, чёрное, как крылья Балериона, а на нём красный, как пламя, #bold трёхголовый#! дракон. Одна голова — моя, две другие — моих сестёр-королев, ибо мы совершим это втроём. Когда мейстеры далёких времён будут писать о том, как Семь Королевств стали одним, это знамя будет реять над каждой страницей.\n\n#bold Пламя и кровь, чёрное и красное. Этот герб вышьют на каждом парусе. #!"
 fab_ac_landing.0007.a:0 "По голове на каждого из нас. Поднимите это знамя над Драконьим Камнем."
 fab_ac_landing.0008:0 "Притязание на весь Вестерос"
 fab_ac_landing.0008.desc.harren:0 "Ворон перелетел Божье Око с требованием Эйгона Таргариена: каждый король Вестероса должен сложить корону и признать лорда Драконьего Камня своим государем. Покорившимся он предлагает мир, отказавшимся — огонь.\n\nУ мальчишки три дракона, зато у меня Харренхол — величайшая крепость из когда-либо возведённых, со стенами, которые не пробить никакому войску, и башнями, которым не страшно пламя. Пусть Эйгон придёт и разобьётся о памятник, который я строил сорок лет.\n\n#bold Камень не горит, а Харрен Чёрный не преклоняет колен.#!"
 fab_ac_landing.0008.desc.torrhen:0 "Ворон с Драконьего Камня достиг Винтерфелла. Эйгон Таргариен именует себя королём всего Вестероса и велит всем венценосцам сложить короны. Покорившиеся сохранят свои земли; сопротивляющимся обещаны пламя и кровь.\n\nСевер следует за королями Старками со времён Долгой Ночи. Ни один южный завоеватель не пересекал Перешеек, чтобы править нами, но ни один из них не прилетал на Балерионе, с Вхагар и Мераксес по сторонам. Вскоре мне придётся созвать знамёна и решить, сколькими жизнями северян стоит заплатить за древнюю корону.\n\n#bold Север помнит своих королей. Дракон это узнает.#!"
 fab_ac_landing.0008.desc.meria:0 "Ворон Эйгона Таргариена долетел до Солнечного Копья. Драконий владыка велит мне отдать корону, преклонить колено и признать его королём всего Вестероса. Покорность принесёт мир, говорит он; отказ — драконий огонь.\n\nПусть другие короли считают свои стены и войска. Дорн пережил и более грозные силы, не давая ни битвы, ни покорности: лишь пустые дороги, отравленные колодцы и пески, целиком поглощающие захватчиков. Драконы могут сжечь всё, что найдут. Мы оставим им совсем немного.\n\n#bold Непреклонные, несгибаемые, несдающиеся. Вот мой ответ.#!"
 fab_ac_landing.0008.desc.loren:0 "Эйгон Таргариен прислал свои условия в Утёс Кастерли. Он объявляет весь Вестерос единым королевством под властью одного короля и предлагает мне обменять корону Скалы на его мир. Если я откажусь, предупреждает письмо, он ответит Балерионом, Вхагар и Мераксес.\n\nЗападные земли достаточно богаты, чтобы вооружить несметные войска, а Мерн Гарденер повелевает величайшими силами Простора. Вместе наши знамёна могли бы покрыть землю от горизонта до горизонта. Но Таргариены собираются сражаться с неба. За золото покупали любое известное людям оружие; теперь ему предстоит купить ответ драконам.\n\n#bold Не для того лев правил Скалой шесть тысяч лет, чтобы стать ручной кошкой дракона.#!"
 fab_ac_landing.0008.desc.mern:0 "Лорд Драконьего Камня прислал в Хайгарден ворона, провозглашая себя королём всего Вестероса. Эйгон Таргариен обещает милость, если я отдам зелёную корону, и грозит огнём, если откажусь. Он считает, что три дракона перевесят древнейшую династию и величайшее войско королевства.\n\nКаждое поле Простора может дать ещё отряд копейщиков. Лорену Ланнистеру грозит та же опасность, что и мне. Мощь Хайгардена и золото Утёса Кастерли создадут войско, какого Вестерос ещё не видел. У драконьего владыки есть крылья, но ему ещё предстоит захватить и удержать целый материк.\n\n#bold Дом Гарденеров процветает с зари королевской власти. Я не стану его последним цветком.#!"
 fab_ac_landing.0008.desc.argilac:0 "Ещё одно послание от мальчишки с Драконьего Камня. На предложение руки моей дочери Эйгон Таргариен ответил, предложив ей своего брата-бастарда, а теперь требует и мою корону. Он именует себя королём всего Вестероса и обещает огонь всякому правителю, который не преклонит колено.\n\nЯ громил дорнийские войска, убивал королей и защищал эти штормовые земли ещё до того, как Эйгон впервые сел в седло. Его звери ужасны, но бури низвергали существ и погорделивее драконов, а Штормовой Предел был воздвигнут наперекор ярости самих богов.\n\n#bold Он знает, где меня найти. У последнего Штормового короля ещё хватит сил на одну войну.#!"
 fab_ac_landing.0008.desc.ronnel:0 "Прилетел ворон от драконьего владыки. Мать дважды прочитала письмо, а затем заперлась на совете с лордами Долины. Эйгон Таргариен говорит, что весь Вестерос теперь одно королевство, а каждый король должен отдать ему корону или встретиться с тремя драконами.\n\nГоворят, ни одно войско не пройдёт Кровавые Врата и нет замка надёжнее Орлиного Гнезда. Но драконам не нужно взбираться по дорогам. Балерион достаточно велик, чтобы проглотить лошадь, Вхагар почти столь же свирепа, а у Мераксес золотые глаза. Все выглядят испуганными, когда думают, что я не смотрю.\n\n#bold Я король Горы и Долины. Уж наверное, даже дракон должен сначала спросить, прежде чем забрать мою корону.#!"
 fab_ac_landing.0008.desc:0 "Вороны несут воззвание Эйгона Таргариена ко всем дворам Вестероса: лорд Драконьего Камня предъявляет права на весь материк и объявляет себя его королём. Многие смеются над такой дерзостью, но более мудрые правители помнят, какую гибель драконы некогда несли войскам и городам.\n\nЭйгон приходит не один. Висенья летит на Вхагар, Рейнис — на Мераксес, а Балерион Чёрный Ужас повинуется самому Эйгону. Скоро Семь Королевств узнают, способны ли древние короны устоять перед последней мощью Валирии."
 fab_ac_landing.0008.option1:0 "Наши древние короны так легко не поддадутся."
 fab_ac_landing.0008.option.harren:0 "То, что мертво, умереть не может — и Харренхол никогда не падёт."
 fab_ac_landing.0008.option.torrhen:0 "Зима близко, даже для драконов."
 fab_ac_landing.0008.option.meria:0 "Непреклонные, несгибаемые, несдающиеся."
 fab_ac_landing.0008.option.loren:0 "Лев ответит когтями."
 fab_ac_landing.0008.option.mern:0 "Зеленая Рука не погибнет от драконьего огня."
 fab_ac_landing.0008.option.argilac:0 "Нам ярость! Приходи, дракон."
 fab_ac_landing.0008.option.ronnel:0 "Высокий, как честь, — выше даже драконов."
 fab_ac_landing.0009:0 "Последний камень"
 fab_ac_landing.0009.desc:0 "Сорок лет. Сорок лет леса, золота и согнутых над каменоломнями спин Речных земель — и сегодня каменщики положили последний камень Харренхола. Пять башен, посрамляющих горы, стены, которым не страшно ни одно людское орудие, залы, где можно разместить целые войска. Ни один замок в мире с ним не сравнится. И никогда не сравнится.\n\nИ в тот же день — ворон с Драконьего Камня. Валирийский островной лордик велит мне преклонить колено или погибнуть. Мне, чей род носил короны ещё до того, как его драгоценный Фригольд обратился в пепел!\n\nУ подводных богов всё-таки есть чувство юмора. Пусть придёт и посмотрит, что я построил. Валирия мертва уже сто лет. Я не склонюсь перед тем, что от неё осталось, а если он приведёт эти остатки к моим воротам, то найдёт их запертыми."
 fab_ac_landing.0009.option1:0 "Приди, дракон, и узнай, что означает камень."
 fab_ac_landing.0010:0 "Ларец с отрубленными руками"
 fab_ac_landing.0010.desc:0 "Посланник драконьего владыки стоял под кровом Дюррана Богоборца и передавал ответ господина так, словно оказывал великую любезность. Я предложил Эйгону Таргариену руку дочери и земли, которыми Харрен Хоар владеет по неправу: достаточно, чтобы два короля объединились против общего врага. Язычник отказался от Аргеллы. Вместо себя он предложил мне Ориса, своего единокровного брата-бастарда, да ещё осмелился потребовать дополнительных земель.\n\nЕсть оскорбления, которые король может проглотить ради блага державы. Это — не из их числа.\n\nПосланник покидает Штормовой Предел, возвращая Эйгону его ответ в кедровом ларце. Внутри — руки посланника. Если Орис Уотерс так жаждет заполучить что-то моё, что готов протянуть к этому руки, пусть начнёт с них.\n\nПусть Эйгон сидит на дымящейся скале со своими сёстрами-жёнами и принимает сдержанность за слабость, если ему угодно. Штормовые короли сражались с железнорождёнными, дорнийцами и врагами похуже ещё до гибели Валирии. Я не дожил бы до этих лет, если бы боялся каждого чужеземного лорда с диковинным именем и чудовищем под седлом. Если дракон хочет войны, клянусь Семерыми, он узнает, почему мой дом удерживал эти земли тысячу лет.\n\n#bold Буря дала ответ. Пусть Драконий Камень понимает его как пожелает.#!"
 fab_ac_landing.0010.option1:0 "Буря отвечает яростью."
 fab_ac_landing.0011:0 "Королевская Гавань"
 fab_ac_landing.0011.desc:0 "Наши корабли вытащены на берег там, где Черноводная впадает в залив. Я тщательно выбрал это место: на здешние земли притязают и Аргилак Высокомерный, и Харрен Чёрный — а значит, не защищает ни один. Пусть спорят, чья я теперь забота. К северу от реки поднимаются три холма: высокий, лесистый поодаль к северу и более низкий у самой воды. Никто ещё не потрудился дать им имена. Это изменится.\n\nНа высоком холме мои люди уже возводят крепость из земли и брёвен, а сёстры заняты первой задачей — прибрежными лордами. Рейнис летит на Мераксес в Росби, Висенья направляет Вхагар в Стокворт. Оба лорда преклонят колено перед своим королём или встретят драконий огонь.\n\n#bold Сегодня — бревенчатая крепость, когда-нибудь — город. Пусть мейстеры спорят о его имени. #!"
 fab_ac_landing.0011.option1:0 "Здесь завоевание укореняется."
 fab_ac_landing.0012:0 "Дракон у Черноводной"
 fab_ac_landing.0012.desc:0 "Таргариен высадился в устье Черноводной и окружил высокий холм рвом и деревянным частоколом. На моей земле, между прочим, — хотя мелкие сварливые лорды побережья забывают, чей мир обязаны блюсти, когда им это выгодно.\n\nБез сомнения, он хочет разозлить меня, чтобы я поспешил ему навстречу. Но зачем? Сколько бы дней он ни просидел в своей грязной крепости, мои стены ниже не станут. Пусть сперва обескровит себя в борьбе с Дарклином, Мутоном и гордостью Штормового короля.\n\nА когда от его маленького войска останутся лохмотья, пусть приходит и разбивает их о Харренхол."
 fab_ac_landing.0012.option1:0 "Пусть сперва прибрежные лорды поубавят его пыл."
 fab_ac_landing.0013:0 "Дракон выходит на берег"
 fab_ac_landing.0013.desc:0 "Весть с Черноводной: Таргариен высадился в устье реки, у трёх холмов, где рыбаки вытаскивают лодки на берег. Несколько тысяч воинов, несколько кораблей и три чудовища Драконьего Камня.\n\nУстье Черноводной принадлежит Харрену — пусть старый кальмар выковыряет его оттуда или потеряет Речные земли, пытаясь это сделать. Меня устроит и то и другое. Чья бы кровь ни пролилась первой, Штормовые земли будут наблюдать, вооружаться и ждать.\n\nБури обрушиваются на эти земли с тех самых пор, как Дюрран бросил вызов богам. Крылатая ящерица меня не пугает."
 fab_ac_landing.0013.option1:0 "Дракон и кальмар могут рвать друг друга."
 fab_ac_landing.0014:0 "Первый, кто преклонит колени"
 fab_ac_landing.0014.desc:0 "Сёстры возвращаются до конца недели, а следом за ними приходят первые клятвы.\n\nРейнис застала ворота Росби открытыми. Старый лорд смотрел, как Мераксес кружит над башнями: раз, другой — и велел спустить знамёна ещё до конца третьего круга. Он встретил её в собственном дворе, опустился на колени на мостовой и предложил хлеб, соль и присягу, не выпустив ни единой стрелы. Его замок недалеко от наших трёх холмов, его земли тянутся вдоль меловой дороги к Сумеречному Долу, а род достаточно древен, чтобы помнить времена, когда короли значили поменьше. Похоже, этот человек намерен пережить всё, что ждёт нас дальше. Такие люди мне пригодятся.\n\nСо Стоквортом пришлось потрудиться. Висенья пролетела над его крепостью, и арбалетчики — более храбрые, чем их лорд, или просто хуже осведомлённые — дали залп. Вхагар ответила одним выдохом. Крыши загорелись, и те же арбалетчики весь вечер таскали воду, пока их лорд размахивал белым знаменем со стены. Богатые хозяйства, полные амбары и дом, который следующие сто лет будет уверять, что хранил верность с самого начала. Обугленные стропила только украсят рассказ.\n\nИтак, две присяги, а всё побережье наблюдает: Хейфорд, Грачиный Приют, Оленьи Рога — дюжина мелких лордов взвешивает силу драконов против древних корон. Лишь из Сумеречного Дола и Девичьего Пруда, где правят Дарклины и Мутоны, не пришло ни слова.\n\n#bold У молчания на севере знакомый мне звук. Так звучит подсчёт мечей.#!"
 fab_ac_landing.0014.option1:0 "Хлеб и соль для верных."
 fab_ac_landing.0015:0 "Эйгонова Крепость"
 fab_ac_landing.0015.desc:0 "Крепость закончена — во всяком случае, достаточно, чтобы в ней мог переночевать король.\n\nМы возвели её на самом высоком из трёх холмов, где я впервые водрузил знамя: кольцо сырых брёвен и утрамбованной земли, деревянный зал под соломой и шкурами, конюшни, кузница, длинный дом для воинов. Ни единого блока тёсаного камня. Висенья прошлась по стене и назвала крепость поленницей, ждущей факела. Она не ошибается. Пока сгодится.\n\nИз ворот видно всё, ради чего я пришёл: залив, устье реки и рыбацкую деревню внизу, которая день ото дня разрастается в город палаток и грязных переулков. Торговцы, каменщики, обозная прислуга, септоны — всякий, кто почуял рождение нового двора. Простолюдины уже назвали холмы. Этот теперь зовётся Высоким холмом Эйгона; лесистый на севере — холмом Рейнис, а у воды — Висеньи. И городу не нужен мейстер, чтобы обрести имя. Люди просто говорят, что идут в королевскую гавань.\n\nБалерион греется на склоне под стеной и защищает крепость лучше всех её брёвен вместе взятых.\n\nХорошо, что он здесь. К сумеркам приходит весть: Дарклины из Сумеречного Дола и Мутоны из Девичьего Пруда созвали знамёна и объединили силы. Они намерены прийти и сжечь мою поленницу.\n\n#bold Пусть попробуют. У каждого короля должна быть резиденция, и моя перерастёт обе их крепости.#!"
 fab_ac_landing.0015.option1:0 "Это подойдет. Для начала."
 fab_ac_landing.0016:0 "Три тысячи мечей"
 fab_ac_landing.0016.desc:0 "Разведчики сосчитали их на дороге из Сумеречного Дола: три тысячи воинов, а за ними растянулись повозки, обозная прислуга и ополченцы. Они идут открыто и медленно — стало быть, ждут в конце пути битвы, а не охоты.\n\nЯ могу вывести в поле меньше шестнадцати сотен, и половина из них — моряки Узкого моря, которым привычнее сражаться с палубы, чем изо рва.\n\nНи один из этих лордов ещё не видел дракона. На этом держится весь их план, хотя сами они того не знают.\n\n#bold До самого рва у них будет время одуматься.#!"
 fab_ac_landing.0016.option1:0 "Три тысячи человек. У меня есть три дракона."
 fab_ac_landing.0017:0 "Эйгонова Крепость берётся за оружие"
 fab_ac_landing.0017.desc:0 "Ров вырыт, частокол возведён, а мои сёстры не согласны друг с другом.\n\nВисенья предлагает встать за брёвнами и заставить врага идти к нам: атакующие разобьются о частокол, говорит она, а драконы добьют их, пока строй рушится. Рейнис предпочла бы выступить и встретить их на выбранном мной поле, где есть простор для бегства, но бежать некуда.\n\n#bold Оба совета ведут к одному исходу. Разница лишь в том, где я буду стоять, когда всё произойдёт.#!"
 fab_ac_landing.0017.option1:0 "Удержим частокол. Пусть идут на нас."
 fab_ac_landing.0017.option2:0 "Выступаем. Я сам выберу поле боя."
 fab_ac_landing.0018:0 "Огонь на дороге в Росби"
 fab_ac_landing.0018.desc:0 "Они подошли к частоколу стройными рядами и всё ещё держали строй, когда разверзлось небо.\n\nВхагар и Мераксес вынырнули из солнечного сияния по обе стороны от них. Человек не успел бы дочитать молитву, а войско уже превратилось в огонь и крики. Наш ров задержал большую часть тех, кто бросился не в ту сторону.\n\nЛорд Дарклин и лорд Мутон сгорели со своими людьми. Из войска, вышедшего из Сумеречного Дола, домой не вернётся и десятая часть.\n\n#bold Первое войско, поднявшееся против меня в Вестеросе, стало пеплом. До конца недели об этом узнают во всех чертогах отсюда до Трезубца.#!"
 fab_ac_landing.0018.desc.sally:0 "Я не стал вести свою первую битву в Вестеросе, укрывшись за рвом. Я выступил и занял выбранное поле: дорога осталась у врагов за спиной, а оба их фланга были совершенно открыты.\n\nЗатем разверзлось небо. Вхагар и Мераксес вынырнули из солнечного сияния по обе стороны от них, и прежде чем человек успел бы дочитать молитву, войско превратилось в огонь и крики. Моим рядам почти не пришлось выдерживать натиск.\n\nЛорд Дарклин и лорд Мутон сгорели со своими людьми. Из войска, вышедшего из Сумеречного Дола, домой не вернётся и десятая часть.\n\n#bold Первое войско, поднявшееся против меня в Вестеросе, стало пеплом, а я стоял на поле и смотрел, как оно горит.#!"
 fab_ac_landing.0018.option1:0 "Первый из многих."
 fab_ac_landing.0019:0 "Наследники преклоняют колени"
 fab_ac_landing.0019.desc:0 "Они прибыли в Эйгонову Крепость прежде, чем похоронили своих мертвецов. Люди Сумеречного Дола въехали на рассвете под белым знаменем, люди Девичьего Пруда — часом позже. Ни те ни другие не торговались.\n\nОни опустились на колени в грязь перед недостроенным залом, сдали замки и попросили лишь об одном: сохранить родовые имена и земли. Я согласился. Люди Висеньи уже пересчитывают товары на складах Сумеречного Дола — самого оживлённого порта Узкого моря, который сегодня принадлежит мне.\n\n#bold Отцы не захотели преклонить колено — теперь его преклоняют наследники. Вестеросу следует увидеть обе стороны этого урока.#!"
 fab_ac_landing.0019.option1:0 "Поднимитесь. Вы сохраните свои имена и свои земли."
 fab_ac_landing.0021:0 "Первое испытание"
 fab_ac_landing.0021.desc:0 "Весть о нашей высадке обогнала разведчиков и понеслась вдоль берега. Лорд Дарклин из Сумеречного Дола и лорд Мутон из Девичьего Пруда объединили силы — по подсчётам дозорных, три тысячи воинов — и двинулись на юг, чтобы сбросить нас обратно в море. Это стало первым настоящим испытанием Завоевания и не заняло даже целого утра.\n\nОрис встретил их нашим авангардом и прорвал строй; Рейнис ударила с тыла на Мераксес, и войско обратилось в бегство. Оба лорда лежат среди павших. Сын Дарклина и брат Мутона преклонили колено на поле, среди своих мертвецов, и присягнули мне за отцовские чертоги — которые останутся за ними. Весь Вестерос усвоит: к тем, кто преклонит колено, я щедр. А у тех, кто поднимет на меня меч, я забираю меч.\n\nЯ велел собрать все до единого клинки павших и отнести на высокий холм, в Эйгонову Крепость. У меня есть для них предназначение, и для его исполнения понадобится ещё немало мечей.\n\n#bold Земли вокруг места высадки в безопасности. Вестерос испытал нас и получил ответ.#!"
 fab_ac_landing.0021.option1:0 "Соберите их мечи."
 fab_ac_landing.0022:0 "Диадема из валирийской стали"
 fab_ac_landing.0022.desc:0 "Сёстры не пожелали больше ждать. Завоеватель, называющий себя королём всего Вестероса, должен и выглядеть соответственно перед лордами, которыми намерен править, сказала Висенья. А свидетелей теперь хватает: новые вассалы присматриваются к человеку, которому принесли клятвы.\n\nТак всё и свершилось — без особой пышности. В деревянном зале стояла горстка свидетелей: недавно присягнувшие прибрежные лорды и мои командиры, а знамёна Дарклина и Мутона висели рядом с моими. Перед ними я преклонил колено перед старшей сестрой, как наши предки склонялись в тени Четырнадцати Огней. Висенья возложила мне на лоб обруч валирийской стали с крупными рубинами квадратной огранки: не южную безделушку из золота и бархата, а сталь, тёмную и острую, как изделия древней Валирии. Это единственная корона, которую я намерен носить.\n\nЗатем над рядами зазвенел голос Рейнис, и произнесённые ею слова станут титулом каждого последующего короля моего рода:\n\n#bold Эйгон, первый этого имени, король всего Вестероса и Щит своего народа.#!\n\nСобравшиеся подхватили клич: несколько десятков голосов там, где однажды будут тысячи. А где-то над облаками драконы ответили громче, чем смогло бы любое войско.\n\n#bold Семь Королевств ещё не знают, что у них есть король. Они узнают.#!"
 fab_ac_landing.0022.option1:0 "#S Король всего Вестероса. #!"
 fab_ac_landing.0023:0 "Десница короля"
 fab_ac_landing.0023.desc:0 "Корона — бремя, и король, взваливший на себя всё, сломается под этой тяжестью. Окружавшие меня лорды поняли это прежде, чем я проносил корону хотя бы день: внезапно в Эйгоновой Крепости не стало недостатка ни в советах, ни в советчиках, жаждавших оказаться на виду.\n\nКого возвысить первым, я не сомневался. Орис рядом со мной с тех пор, как мы мальчишками мерились затупленными мечами во дворе Драконьего Камня, задолго до первых бород. При дворе шепчут, что он мой брат, незаконнорождённый сын моего отца. Я никогда не удостаивал эти слухи ответом — и ни разу их не опроверг. Именно Орис разбил лордов Дарклина и Мутона на поле, закрепив нашу высадку. Где бой жарче всего — там он. Где я слабее всего — там тоже он.\n\nИ перед собравшимся двором я велел ему преклонить колено и назвал первой десницей короля. Пусть королевство запомнит мои слова, ибо в каждом заключена правда:\n\n#bold Мой щит, мой верный воин, моя крепкая правая рука.#!"
 fab_ac_landing.0023.option1:0 "Встаньте, мой лорд-десница."
