l_russian:
 ac_egg_quicksilver_desc:0 "Серебристое яйцо. Из него вылупится #bold Ртуть#!, драконица Эйниса Таргариена. Отдайте его ребёнку, которого хотите сделать её всадником."
 ac_egg_dreamfyre_desc:0 "Бледно-голубое яйцо. Из него вылупится #bold Пламенная Мечта#!, драконица Рейны Таргариен. Отдайте его ребёнку, которого хотите сделать её всадником."
 ac_egg_vermithor_desc:0 "Бронзовое яйцо. Из него вылупится #bold Вермитор#!, дракон Джейхейриса Таргариена. Отдайте его ребёнку, которого хотите сделать его всадником."
 ac_egg_cannibal_desc:0 "Чёрное яйцо. Из него вылупится #bold Каннибал#!, дикий дракон Драконьего Камня. Отдайте его ребёнку, которого хотите сделать его всадником."
 ac_egg_silverwing_desc:0 "Белое яйцо. Из него вылупится #bold Среброкрылая#!, драконица Алисанны Таргариен. Отдайте его ребёнку, которого хотите сделать её всадником."
 ac_egg_meleys_desc:0 "Красное яйцо. Из него вылупится #bold Мелеис#!, известная как Красная Королева. Отдайте его ребёнку, которого хотите сделать её всадником."
