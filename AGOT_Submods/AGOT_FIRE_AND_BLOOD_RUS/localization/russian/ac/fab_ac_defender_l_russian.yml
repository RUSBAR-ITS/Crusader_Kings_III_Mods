l_russian:
 fab_ac_defender.0001.t:0 "Жало для дракона"
 fab_ac_defender.0001.desc:0 "На военный совет приводят лисенийского торговца. От него веет духами, морской солью и уверенностью человека, знающего цену деньгам. По его словам, в повозках он везёт машины с огромными торсионными рычагами: скорпионы, способные метать железные болты так высоко, что они угрожают даже летящему дракону.\n\nТорговец не обещает, что его орудия убьют Балериона. Он лишь улыбается и замечает: даже Чёрному Ужасу придётся снизиться, чтобы достать пламенем мои ряды. За половину обычной цены осадного полка его мастера и машины поступят в моё распоряжение ещё до следующей битвы."
 fab_ac_defender.0001.a:0 "Купить скорпионов. Драконы тоже истекают кровью."
 fab_ac_defender.0001.a.tt:0 "К вашим силам присоединится один полк «[GetMaA('scorpions').GetName]» за половину стоимости найма полка мангонелей."
 fab_ac_defender.0001.b:0 "Отослать лисенийца вместе с его машинами."
 fab_ac_defender.0100.desc:0 "Эйгон Таргариен прислал требование в Штормовой Предел. Я должен сложить корону Дюррана Богоборца, преклонить колено и править Штормовыми землями с его дозволения. Взамен язычник обещает пощадить мой дом, земли и лордов. Откажусь — на юг придут его войска, а с ними дракон.\n\nОн говорит так, будто всё уже решено. Возможно, каждый преклонивший колени лорд приучал его ждать повиновения. Здесь такого урока не будет. Мои предки защищали эти земли от железнорождённых, дорнийцев, андалов и всех прочих врагов, которых посылали боги. Штормовой Предел выстоял тысячу лет войн. Не для того я столько носил корону Дюррана, чтобы отдать её валирийскому мальчишке, явившемуся с чудовищем и назвавшему себя королём.\n\nНо если я ошибусь, сгорит не одна моя корона. У каждого, кто идёт под знаменем коронованного оленя, за спиной есть жена, сын, дом или поле. Семеро знают: меня никогда не звали трусом. И всё же одних король посылает на смерть ради чести, других — лишь ради гордыни.\n\nЭйгон получит ответ.\n\n#bold Если склонюсь, меня могут назвать трусом. Если нет — никто никогда не посмеет.#!"
 fab_ac_defender.0100.a:0 "Я не обреку Штормовые земли на огонь ради своей гордыни. Отдаю корону."
 fab_ac_defender.0100.b:0 "Трубите сбор. Язычник узнает, какому королю бросил вызов."
 fab_ac_defender.0110.desc:0 "Эйгон Таргариен предлагает Простору мир ценой покорности. Если я преклоню колено, наши поля и замки избегнут драконьего пламени. Если откажусь, зелёная рука сожмёт меч, и война продолжится до решающего исхода."
 fab_ac_defender.0120.desc:0 "Драконий владыка требует верности Скалы и короны Западных земель. Покорившись, мой дом сохранит своё место в новом порядке. Отказавшись, мы доверим золоту, камню и западной стали защиту от драконьего пламени. Победы Эйгона не лишают меня права выбора."
 fab_ac_defender.0130.desc:0 "Эйгон Таргариен требует, чтобы Дорн покорился вслед за другими королевствами. Он обещает мир под своей властью и огонь каждой непокорной твердыне. Но пустыни поглощали войска и больше его армии, а дракон не сожжёт того, чего не может найти. Нужно дать ответ."
 fab_ac_defender.0140.desc:0 "Эйгон Таргариен требует покорности державы Харрена и короны Железных островов. Преклонив колено, можно сберечь уцелевшее. Отказ означает, что против Чёрного Ужаса мы доверимся чёрным стенам, решимости железнорождённых и водам Трезубца."
 fab_ac_defender.0150.desc:0 "Эйгон Таргариен высадился, чтобы сделать Королевские земли основанием своей новой державы. Его условия просты: присягнуть и получить пощаду либо стоять до конца и решить всё войной. Драконье пламя ужасно, но капитуляция больше не предрешена."
 fab_ac_defender.0160.desc:0 "Два Короля выступили вместе, чтобы ни Простору, ни Скале не пришлось в одиночку встречать драконов Эйгона. Теперь завоеватель требует моей покорности. Если король Запада принимает решения сам, я не вправе преклонить колено за него. Остаётся хранить наш договор и сражаться."
 fab_ac_defender.0170.desc:0 "Два Короля выступили вместе, чтобы ни Скале, ни Простору не пришлось в одиночку встречать драконов Эйгона. Теперь завоеватель требует моей покорности. Если король Простора принимает решения сам, я не вправе преклонить колено за него. Остаётся хранить наш договор и сражаться."
 fab_ac_defender.0180.desc:0 "Войско Эйгона вошло на Север, а следом пришло его требование: сложить древнюю корону и сберечь мой народ под новым троном либо доверить Перешейку, холоду и северной стали защиту от драконьего пламени. Решать мне, а не дракону."
 fab_ac_defender.0190.desc:0 "Дракон пришёл за Долиной. Эйгон предлагает мир под своей короной, если я отдам Соколиную корону. Отказ означает, что горам, рыцарям и скорпионам предстоит испытание против существ, владеющих небом. Пока я не отвечу, исход войны не предрешён."
 fab_ac_defender.0200.desc:0 "Драконий владыка вновь требует покорности Дорна. Он предлагает закончить войну под властью Железного трона, но каждый перевал и пустынная дорога ещё позволяют сопротивляться. Я могу избавить Дорн от нового похода — или заставить Эйгона завоёвывать каждую лигу."
 fab_ac_defender.1000.t:0 "Первое испытание закончилось"
 fab_ac_defender.1000.desc:0 "Война за Королевские земли окончена. Знамёна Эйгона Таргариена реют над дорогами и реками, которые мне не удалось удержать, а Чёрный Ужас кружит над страной, теперь подвластной драконьему владыке. К этому привели поражение или добровольная покорность — так или иначе, всё решено. Мои знамёна придётся спустить."
 fab_ac_defender.1000.a:0 "Королевские земли пали."
 fab_ac_defender.1010.t:0 "Королевство Харрена разрушено"
 fab_ac_defender.1010.desc:0 "Война за королевство Островов и Рек завершена. Трезубец теперь подчиняется дракону, драккары отступили домой, а корона, силой добытая Харвином Хоаром, отнята той же силой.\n\nХарренхол возводили, чтобы ни одно людское войско не смогло сокрушить этот дом. Против людей стен было достаточно. Против этого они никогда не могли помочь."
 fab_ac_defender.1010.desc.harren:0 "Сорок лет я потратил на эти камни. Сорок лет пота железнорождённых и золота Речных земель. Каменщикам, которым работа казалась слишком медленной, поручали другую, ещё более долгую. Когда поднялась последняя башня, я стал могущественнейшим лордом Вестероса — и стены были тому доказательством.\n\nДраконий владыка их не разрушил. Ему не понадобилось. Он забрал реки, острова и людей, которые должны были их защищать. Мне оставил замок.\n\nХарренхол стоит. Моё королевство — нет."
 fab_ac_defender.1010.desc.submit:0 "Я покорился. Об этом сложат песни — и ни одной доброй.\n\nСорок лет я возводил Харренхол, чтобы никакое людское войско не могло его отнять. Драконий владыка привёл не людское войско. Он предложил сохранить мне жизнь и острова моих предков, попросив лишь корону. А корона стоит меньше, чем собственные кости, обугленные дочерна в собственном зале.\n\nКоролевству Островов и Рек пришёл конец. Мне — нет."
 fab_ac_defender.1010.a:0 "Королевство потеряно. Но стены ещё стоят."
 fab_ac_defender.1010.a.submit:0 "Они могут петь то, что им нравится. Острова выстоят."
 fab_ac_defender.1020.t:0 "Последняя буря прошла"
 fab_ac_defender.1020.desc:0 "Судьба Штормовых земель наконец решена. Поражение в бою или моё решение уберечь страну от нового огня привели к одному: Штормовой Предел теперь под новой короной Эйгона Таргариена. Буря иссякла перед драконом."
 fab_ac_defender.1020.a:0 "Буря стихла."
 fab_ac_defender.1030.t:0 "Острова сдаются"
 fab_ac_defender.1030.desc:0 "Капитаны и короли Железных островов сопротивлялись, пока не проиграли войну. Эйгон Таргариен забрал корону, и отвергать условия дракона больше нельзя. Островам придётся считаться с новым порядком за своими серыми берегами."
 fab_ac_defender.1030.desc.submit:0 "Я отдаю Железные острова, пока драконье пламя не потребовало цены, которой не стоит никакая корона. Эйгон Таргариен получает корону и мою присягу. Зато капитаны, замки и жители островов уцелеют — и научатся жить при новом порядке за своими серыми берегами."
 fab_ac_defender.1030.a:0 "Железной цены оказалось недостаточно."
 fab_ac_defender.1100.t:0 "Королевство склоняется"
 fab_ac_defender.1100.desc:0 "Вороны принесли весть: королевство [fab_ac_news_a.GetShortUINamePossessive] пало перед Эйгоном Таргариеном. Продолжать войну было невозможно. Ещё одна корона легла в тень Чёрного Ужаса. Во всех дворах Вестероса теперь считают, сколько пути осталось от войска завоевателя до их стен."
 fab_ac_defender.1100.a:0 "Дракон наступает."
 fab_ac_defender.1110.t:0 "Западные королевства побеждены"
 fab_ac_defender.1110.desc:0 "Вороны несут вести с запада: и Простор, и Западные земли теперь подчиняются Эйгону Таргариену. Две древние короны пали перед драконом, а завоеватель обращает взор к королевствам, ещё остающимся вне его власти."
 fab_ac_defender.1110.a:0 "Ещё две короны под властью дракона."
 fab_ac_defender.1120.t:0 "Дорн покорен"
 fab_ac_defender.1120.desc:0 "Вопреки всем ожиданиям, Эйгон Таргариен вынудил Дорн покориться. Сопротивлению [fab_ac_news_a.GetShortUINamePossessive] пришёл конец; самое южное королевство теперь подвластно Железному трону. Если даже пустыни не остановили драконов, каждому ещё непокорённому правителю стоит оценить, много ли надежды осталось."
 fab_ac_defender.1120.a:0 "Даже Дорн преклонил колено."
 fab_ac_defender.1121.t:0 "Дракон повернул назад"
 fab_ac_defender.1121.desc:0 "Последние войска Эйгона Таргариена покинули наши владения. Земли, именуемые «[ROOT.Char.GetPrimaryTitle.GetNameNoTier]», свободны от захватчиков. То, что драконий владыка называл неизбежным завоеванием, разбилось о наши армии, крепости и решимость тех, кто отказался преклонить колени.\n\nЕго драконы несли ужас с неба, но не могли занять каждую дорогу, охранять каждый лагерь или принудить королевство к сдаче, когда его народ выбрал сопротивление. Завоеватель уходит, потеряв воинов и часть своей легендарной славы. По всему Вестеросу правители, уже считавшие триумф Эйгона судьбой, услышат другую историю.\n\nДом [ROOT.Char.GetHouse.GetName] встретил пламя и кровь — и выстоял. Дракону можно противостоять. Дракона можно победить."
 fab_ac_defender.1121.a:0 "Пошлите весть об этой победе во все королевства."
 fab_ac_defender.demand.t:0 "Пламя и кровь"
 fab_ac_defender.demand.submit:0 "Я уберегу свой народ. Мы сдаёмся."
 fab_ac_defender.demand.fight:0 "Мы встретим огонь сталью."
