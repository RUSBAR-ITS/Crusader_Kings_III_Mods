l_russian:
 fab_ac_defender.0001.t:0 "Жало для дракона"
 fab_ac_defender.0001.desc:0 "Лисеньского торговца вводят в мой военный совет под облаком духов, морской соли и дорогого доверия. Он утверждает, что его повозки оснащены двигателями, построенными на огромных торсионных рычагах: скорпионах, способных метать железные болты достаточно высоко, чтобы угрожать даже летящему дракону.\n\nТорговец не обещает, что его машины убьют Балериона. Он просто улыбается и замечает, что даже Черный Ужас должен спуститься вниз, прежде чем драконий огонь сможет достичь моих рядов. За половину обычной цены осадного полка его мастера и их оружие будут моими до следующего сражения."
 fab_ac_defender.0001.a:0 "Купите скорпионов. Драконы тоже истекают кровью."
 fab_ac_defender.0001.a.tt:0 "К вашим силам присоединится один полк «[GetMaA('scorpions').GetName]» за половину стоимости найма полка мангонелей."
 fab_ac_defender.0001.b:0 "Отослать лисенийца вместе с его машинами."
 fab_ac_defender.0100.desc:0 "Эйгон Таргариен отправил свое требование в Штормовой Предел. Я должен сложить корону Дюрранской Горе Бога, преклонить колени и удержать Штормовые земли с его позволения. Взамен язычники обещают, что мой дом, мои земли и мои лорды будут пощажены. Если я откажусь, его армии пойдут на юг, и его дракон вместе с ними.\n\nОн говорит так, как будто вопрос уже решен. Возможно, каждый лорд, преклонявший перед ним колени, научил его ожидать повиновения. Здесь он не найдет такого урока. Мои отцы защищали эти земли от железнорожденных, дорнийцев, андалов и всех остальных врагов, которых боги считали нужным послать против них. Штормовой Предел выдержал тысячу лет войны, и я не носил корону Дюррана так долго, чтобы сдать ее, потому что сюда прибыл валирийский мальчик со зверем и назвал себя королем.\n\nОднако если я сделаю неверный выбор, сгорит не только моя корона. У каждого мужчины, который едет под коронованным оленем, за спиной есть жена, сын, зал или поле. Семеро знают, что меня никогда не называли трусом, но есть смерти, которые король может приказать ради чести, и смерти, которые он приказывает только из гордости.\n\nЭйгон получит ответ.\n\n#bold Если я прогнусь, мужчины могут назвать меня трусом. Если я этого не сделаю, ни один человек никогда на это не осмелится.#!"
 fab_ac_defender.0100.a:0 "Я не буду сжигать Штормовые земли из-за своей гордости. Я отдаю корону."
 fab_ac_defender.0100.b:0 "Трубите сбор. Язычник узнает, какому королю бросил вызов."
 fab_ac_defender.0110.desc:0 "Эйгон Таргариен предлагает Простору мир подчинения. Если я преклоню колени, наши поля и замки будут избавлены от пламени дракона. Если я откажусь, зеленая рука сомкнется на своем мече, и война продолжится до своего истинного завершения."
 fab_ac_defender.0120.desc:0 "Повелитель драконов требует верности Скалы и короны Западных земель. Подчинение сохранит мой дом под его новым порядком; отказ означает доверие золоту, камню и западной стали против драконьего огня. Победы Эйгона не делают для меня этот выбор."
 fab_ac_defender.0130.desc:0 "Эйгон Таргариен требует, чтобы Дорн поклонился другим королевствам. Он обещает мир под своим правлением и огонь для каждой твердыни, которая сопротивляется. Однако пустыни поглотили более сильные армии, чем его, и дракон не может сжечь то, чего не может найти. Я должен ответить."
 fab_ac_defender.0140.desc:0 "Эйгон Таргариен требует подчинения владений Харрена и короны Железных островов. Преклонив колени, можно сохранить то, что осталось; Отказаться — значит довериться черным стенам, железнорожденной решимости и водам Трезубца против Черного Ужаса."
 fab_ac_defender.0150.desc:0 "Эйгон Таргариен сошёл на берег, чтобы сделать Королевские земли основой своего нового королевства. Его условия просты: поклянись в верности и будь пощажен, или держись и реши вопрос войной. Драконий огонь ужасен, но капитуляция больше не является неизбежной."
 fab_ac_defender.0160.desc:0 "Два Короля ехали вместе, чтобы ни Простор, ни Скала не смогли противостоять драконам Эйгона в одиночку. Теперь победитель требует моего подчинения. Если западный король руководствуется собственным советом, я не могу преклонить колени от его имени; Я могу только придерживаться нашего договора и сражаться."
 fab_ac_defender.0170.desc:0 "Два Короля ехали вместе, чтобы ни Скала, ни Простор не смогли противостоять драконам Эйгона в одиночку. Теперь победитель требует моего подчинения. Если король Простора руководствуется собственным советом, я не могу встать на колени от его имени; Я могу только придерживаться нашего договора и сражаться."
 fab_ac_defender.0180.desc:0 "Армия Эйгона перешла на Север, и за этим последовало его требование: сложить древнюю корону и сохранить мой народ под его новым троном, или довериться шее, холоду и северной стали против драконьего огня. Этот выбор будет моим, а не драконом."
 fab_ac_defender.0190.desc:0 "Дракон пришел в Долину. Эйгон предлагает мир под своей короной, если я отдам Корону Сокола; отказ означает испытание горы, рыцаря и скорпиона против существ, владеющих небом. Война не решится сама собой, пока я не отвечу."
 fab_ac_defender.0200.desc:0 "Повелитель драконов снова требует, чтобы Дорн отказался от неповиновения. Он предлагает положить конец войне под своим Железным Троном, в то время как каждый перевал и пустынная дорога по-прежнему вызывают сопротивление. Я могу пощадить Дорн еще на одну кампанию или заставить Эйгона выиграть все ее лиги."
 fab_ac_defender.1000.t:0 "Первое испытание закончилось"
 fab_ac_defender.1000.desc:0 "Война за Королевские земли окончена. Знамена Эйгона Таргариена возвышаются над дорогами и реками, которые я не смог удержать, а Черный Ужас окружает царство, которое теперь должно ответить повелителю драконов. Будь то поражение или моя собственная покорность, вопрос решен, и мои знамена должны быть спущены."
 fab_ac_defender.1000.a:0 "Королевские земли пали."
 fab_ac_defender.1010.t:0 "Королевство Харрена разрушено"
 fab_ac_defender.1010.desc:0 "Война за Королевство Островов и Рек окончена. Теперь «Трезубец» подчиняется дракону, длинные корабли оттащили домой, и корона, которую Харвин Хоар силой отобрал, была возвращена таким же образом.\n\nХарренхол был построен для того, чтобы никакая армия людей не смогла разрушить этот дом. Против людей стены были достаточным ответом. Они никогда не были ответом на это."
 fab_ac_defender.1010.desc.harren:0 "Сорок лет я провел на этих камнях. Сорок лет железного пота и золота речных земель, и каждый каменщик, который считал работу слишком медленной, был назначен еще на более медленную работу. Когда была возведена последняя башня, я был самым могущественным лордом Вестероса, и у меня были стены, чтобы доказать это.\n\nПовелитель драконов никогда не бросал их вниз. Ему это было не нужно. Он забрал реки, острова и людей, которые должны были их удерживать, а замок оставил мне.\n\nХарренхол стоит. В моем королевстве нет."
 fab_ac_defender.1010.desc.submit:0 "Я уступил, и об этом будут песни, и не одна добрая.\n\nСорок лет я провел, поднимая Харренхол, чтобы ни одна армия, созданная людьми, не смогла отобрать его у меня. Повелитель драконов не привел с собой армию людей. Он предложил мне мою жизнь и острова, которыми владели мои отцы, и попросил только корону, а корона — это меньшая вещь, чем собственные кости человека, сожженные до черноты в его собственном чертоге.\n\nКоролевству островов и рек пришел конец. Я нет."
 fab_ac_defender.1010.a:0 "Королевство потеряно. Но стены ещё стоят."
 fab_ac_defender.1010.a.submit:0 "Они могут петь то, что им нравится. Острова выстоят."
 fab_ac_defender.1020.t:0 "Последняя буря прошла"
 fab_ac_defender.1020.desc:0 "Судьба Штормовых земель наконец решена. Будь то поражение в бою или мое собственное решение избавить королевство от дальнейшего огня, Штормовой Предел теперь стоит под новой короной Эйгона Таргариена. Шторм закончился раньше дракона."
 fab_ac_defender.1020.a:0 "Буря стихла."
 fab_ac_defender.1030.t:0 "Острова сдаются"
 fab_ac_defender.1030.desc:0 "Капитаны и короли Железных островов сопротивлялись, пока война не была проиграна. Эйгон Таргариен принял корону, и от условий дракона больше нельзя отказываться. Островам придется признать новый порядок за пределами своих серых берегов."
 fab_ac_defender.1030.desc.submit:0 "Я решил отдать Железные острова до того, как драконий огонь назовет цену, которую не сможет выплатить ни одна корона. Эйгон Таргариен принимает корону и мою клятву, но капитаны остаются, а жители островов выживают, чтобы считаться с новым порядком за пределами их серых берегов."
 fab_ac_defender.1030.a:0 "Железной цены оказалось недостаточно."
 fab_ac_defender.1100.t:0 "Королевство склоняется"
 fab_ac_defender.1100.desc:0 "Вороны сообщают, что царство [fab_ac_news_a.GetShortUINamePossessive] перешло к Эйгону Таргариену. Войну больше невозможно продолжать, и под тенью Черного Ужаса теперь лежит еще одна корона. По всему Вестеросу каждый двор измеряет расстояние между своими стенами и армией завоевателя."
 fab_ac_defender.1100.a:0 "Дракон наступает."
 fab_ac_defender.1110.t:0 "Западные королевства побеждены"
 fab_ac_defender.1110.desc:0 "Вороны приносят вести с запада: и Простор, и Западные земли теперь подчиняются Эйгону Таргариену. Две древние короны пали под драконом, и завоеватель обращает свой взор на королевства, которые остаются вне его власти."
 fab_ac_defender.1110.a:0 "Еще две короны под драконом."
 fab_ac_defender.1120.t:0 "Дорн покорен"
 fab_ac_defender.1120.desc:0 "Вопреки всем ожиданиям, Эйгон Таргариен вынудил Дорн уступить. Сопротивление [fab_ac_news_a.GetShortUINamePossessive] прекращено, и самое южное королевство теперь стоит под Железным Троном. Если даже пустыни не могут остановить драконов, каждый непокоренный правитель должен взвесить остатки надежды."
 fab_ac_defender.1120.a:0 "Даже Дорн преклонил колено."
 fab_ac_defender.1121.t:0 "Дракон повернул назад"
 fab_ac_defender.1121.desc:0 "Последнее знамя Эйгона Таргариена ушло с [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. То, что повелитель драконов провозгласил неизбежным завоеванием, сломало наши армии, наши крепости и решимость тех, кто отказался встать на колени.\n\nЕго драконы приносили ужас с неба, но они не могли занять каждую дорогу, охранять каждый лагерь или заставить королевство сдаться после того, как его люди выбрали сопротивление. Завоеватель уходит с меньшим количеством солдат и легендой, приуменьшенной поражением. По всему Вестеросу правители, которые раньше считали триумф Эйгона судьбой, теперь услышат другую историю.\n\n[ROOT.Char.GetHouse.GetName] стоял перед огнем и кровью и выстоял. Дракону можно противостоять. Дракона можно победить."
 fab_ac_defender.1121.a:0 "Пошлите весть об этой победе во все королевства."
 fab_ac_defender.demand.t:0 "Пламя и кровь"
 fab_ac_defender.demand.submit:0 "Я уберегу свой народ. Мы сдаёмся."
 fab_ac_defender.demand.fight:0 "Мы встретим огонь сталью."
