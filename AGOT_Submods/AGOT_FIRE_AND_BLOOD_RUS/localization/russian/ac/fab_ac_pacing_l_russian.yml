l_russian:
 fab_conquest_pause.option:0 "Нам нужно время, чтобы подготовиться, прежде чем продолжать Завоевание."
 fab_conquest_pause.tt:0 "#I Завоевание подождёт, пока королю будет угодно. Возобновите его из меню Решений — против любого королевства, которое выберете.#!"
 fab_decision_conquer_riverlands:0 "Завоевать Речные земли"
 fab_decision_conquer_riverlands_desc:0 "Харрен Чёрный скрывается за самыми высокими стенами, когда-либо возведёнными человеком, а речные лорды стонут под его властью. Стены — лишь дерево и камень, раствор и труд. Башни Харренхолла не достигают высот, на которых летает Балерион, а Трезубец ждёт лучшего господина."
 fab_decision_conquer_riverlands_tooltip:0 "Возобновить Завоевание: отобрать Речные земли у Харрена Чёрного."
 fab_decision_conquer_riverlands_confirm:0 "Трезубец ждёт."
 fab_decision_conquer_stormlands:0 "Завоевать Штормовые земли"
 fab_decision_conquer_stormlands_desc:0 "Аргилак Высокомерный всё ещё называет себя Штормовым Королём, и его оскорбление не забыто. Орис поведёт войско на юг, а Рейнис пролетит над ним. Пусть старик получит бурю, которую просил."
 fab_decision_conquer_stormlands_tooltip:0 "Возобновить Завоевание: низложить последнего Штормового Короля."
 fab_decision_conquer_stormlands_confirm:0 "Сломить бурю."
 fab_decision_conquer_west:0 "Завоевать Простор и Скалу"
 fab_decision_conquer_west_desc:0 "Два короля всё ещё правят за Мандером и Скалой — и два короля вместе всё равно меньше, чем три дракона. Если Мерн и Лорен хотят объединить свои войска против нас, мы предоставим им поле для этого."
 fab_decision_conquer_west_tooltip:0 "Возобновить Завоевание: война за запад — Простор и Западные земли вместе."
 fab_decision_conquer_west_confirm:0 "Встретить льва и розу."
 fab_decision_conquer_vale:0 "Присоединить Долину к королевству"
 fab_decision_conquer_vale_desc:0 "Сокол сидит над облаками за своими горами и Кровавыми Воротами и думает, что он вне нашей досягаемости. Пошлите весть в Орлиное Гнездо: ни один перевал не достаточно высок, чтобы закрыться от дракона. Мы услышим, какие условия предложит королева-регент — или не примем никаких."
 fab_decision_conquer_vale_tooltip:0 "Возобновить Завоевание: обратиться против Долины Аррен."
 fab_decision_conquer_vale_confirm:0 "Орлиное Гнездо должно ответить."
 fab_decision_march_on_north:0 "Выступить на Север"
 fab_decision_march_on_north_desc:0 "К югу от Перешейка королевства наши; к северу от него Торрхен Старк все еще носит Корону Зимы. Армия пойдет на север через речные земли к Перешейку, а перед ней будут летать драконы — и мы увидим, выберет ли Король Севера лед или пламя."
 fab_decision_march_on_north_tooltip:0 "Возобновить Завоевание: выступить на Короля Севера. Сначала нужно завоевать Юг."
 fab_decision_march_on_north_confirm:0 "Дракон летит на север"
 fab_conquest_north_launch.option:0 "А теперь — Север."
 fab_conquest_north_won.option:0 "Север уже становится на колени. Царство растет."
 fab_conquest_north_marching.option:0 "Армия уже марширует на Север."
