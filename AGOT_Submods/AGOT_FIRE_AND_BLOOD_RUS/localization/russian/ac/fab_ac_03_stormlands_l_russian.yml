 fab_ac_stormlands.0001:0 "Навстречу буре"
 fab_ac_stormlands.0001.desc:0 "Войско поворачивает на юг, но поведу его не я. Война началась с оскорбления не только меня, но и Ориса: Аргилак отверг именно его руку, предложив моему соратнику менее знатную невесту, словно бросал собаке объедки. Поэтому Орис, моя десница, ведёт лучшие мои силы вдоль побережья к Штормовому Пределу. Над колоннами летит королева Рейнис верхом на Мераксес — серебро и золото на фоне темнеющего неба.\n\nРазведчики доносят, что Аргилак вывел воинов из гарнизонов и собирает все силы в открытом поле. Старый воин знает, как погиб Харрен; он не станет отсиживаться за каменными стенами в ожидании драконьего огня. Он намерен скрестить клинки с Орисом, оставив бурю за спиной, и завершить войну по старинке — или погибнуть, пытаясь это сделать.\n\nОн получит свою битву. Над Штормовыми землями уже громоздятся чёрные тучи, словно сам Бог Бури собирается стать свидетелем.\n\n#bold Певцам понадобится имя для грядущей битвы. Что-то подсказывает мне: они назовут её Последней Бурей.#!"
 fab_ac_stormlands.0001.option1:0 "Сокруши бурю, Орис."
 fab_ac_stormlands.0001.desc.first:0 "Войско поворачивает на юг, но поведу его не я. Война началась с оскорбления не только меня, но и Ориса: Аргилак отверг именно его руку, предложив моему соратнику менее знатную невесту, словно бросал собаке объедки. Поэтому Орис, моя десница, ведёт лучшие мои силы вдоль побережья к Штормовому Пределу. Над колоннами летит королева Рейнис верхом на Мераксес — серебро и золото на фоне темнеющего неба.\n\nРазведчики доносят, что Аргилак вывел воинов из гарнизонов и собирает все силы в открытом поле. Старый воин не любит прятаться за стенами и не станет отсиживаться в крепости, пока над нею кружат драконы. Он намерен скрестить клинки с Орисом, оставив бурю за спиной, и завершить войну по старинке — или погибнуть, пытаясь это сделать.\n\nОн получит свою битву. Над Штормовыми землями уже громоздятся чёрные тучи, словно сам Бог Бури собирается стать свидетелем.\n\n#bold Певцам понадобится имя для грядущей битвы. Что-то подсказывает мне: они назовут её Последней Бурей.#!"
 fab_ac_stormlands.0002:0 "Последняя Буря"
 fab_ac_stormlands.0002.desc:0 "Два дня небо над Штормовыми землями было тёмным, словно кровоподтёк. На второй день Аргилак вышел нам навстречу. Советники умоляли его остаться за стенами: Штормовой Предел ещё ни разу не пал, и ни один дракон не испытывал его камни. Старый король не желал слушать. Он не хотел узнавать, что драконий огонь сделает с замком, которому нечем ответить, и не собирался заживо жариться в собственной крепости. Лучше положиться на меч и бурю и встретить врага в поле.\n\nОн обрушился на наше войско, оставив ураган за спиной. Дождь лил стеной, земля обратилась в месиво. Надо признать: замысел был искусен. Тяжёлая конница врезалась в наши ряды, пока у лучников размокали тетивы. Та же буря не пускала Мераксес в небо: ни один дракон не смог бы взлететь в этой воющей мгле. Целый страшный час исход битвы висел на волоске.\n\nПотом центр нашего войска дрогнул и рассыпался. Рыцари Штормовых земель хлынули в брешь на полном скаку, уверенные в победе.\n\n#bold Они не знали, что моя сестра приготовила для них в сердце нашего войска.#!"
 fab_ac_stormlands.0002.option1:0 "Держать строй! Держать!"
 fab_ac_stormlands.0003:0 "Последняя Буря"
 fab_ac_stormlands.0003.desc:0 "Боги послали бурю, достойную своего имени, и я решил сражаться под её покровом: дождь размочит вражеские тетивы, грязь остановит наступление, а ураган прижмёт крылья их драконицы к земле.\n\nДважды моя конница атаковала фланг врага; дважды грязь и драконий огонь отбрасывали нас. При третьем натиске подо мной пал конь, и я продолжил бой пешим, среди тел воинов обеих сторон. Тогда-то бастард и спустился с холма ко мне.\n\nОн предложил мне сдаться. Сдаться! Моим ответом стала сталь. Теперь мы бьёмся под дождём, среди остатков моего войска: старый Король Бури против крепкой правой руки дракона. Пусть певцы смотрят внимательно. О чём бы они ни пели, о преклонившем колено Аргилаке песни не будет."
 fab_ac_stormlands.0003.option1:0 "Нам ярость!"
 fab_ac_stormlands.0004:0 "Дракон под дождём"
 fab_ac_stormlands.0004.desc:0 "В любой другой день Мераксес владела бы небом над полем боя. Но не сегодня: дождь слишком силён, ветер слишком яростен даже для дракона. Поэтому Рейнис не взлетела. Она осталась верхом на Мераксес в самом центре войска. Плотно сложив крылья, драконица замерла, словно скала среди реки, пока вокруг кипела битва. И ждала.\n\nРыцари Штормовых земель на полном скаку прорвались через наш разбитый центр — и увидели её. Кони, прежде нёсшие всадников сквозь град стрел и стену щитов, обезумели при одном взгляде на то, что стояло перед ними. Мераксес, как им предстояло узнать, не нуждалась в небе. Она встретила натиск, словно утёс — волну: драконьему пламени с десяти шагов не помеха мокрая земля. Тех, кого не поглотил огонь, поглотила её пасть — коня и всадника целиком.\n\nПрорыв, суливший Аргилаку победу, обернулся гибелью. Натиск захлебнулся на месте, а остатки авангарда штормовых лордов отхлынули под дождь, гонимые ветром, мимо своего короля.\n\n#bold Отчаянный замысел Аргилака разбился о то, что не под силу погасить ни одной буре.#!"
 fab_ac_stormlands.0004.option1:0 "Доложите мне об исходе битвы."
 fab_ac_stormlands.0005:0 "Старый путь"
 fab_ac_stormlands.0005.desc:0 "Дважды Аргилак падал с коня, дважды вставал и убивал тех, кто пытался его пленить. Теперь он стоит под ливнем в кольце спешившихся рыцарей. Стража полегла вокруг, войско бежит или умирает. Трижды ему предлагали пощаду — трижды он отвечал сталью. Не ради плена он вышел из-за стен.\n\nОб этом донесли Орису, и моя десница — да любят его боги — поступил так, как поступил бы я. Он велел разомкнуть кольцо копий, спешился, обнажил длинный меч и предложил старому королю закончить всё по древнему обычаю: клинок против клинка.\n\nСтарик, подобный буре, последний из королей, чей род восходит к заре времён, и лучший боец моего войска — одни в грязи между двумя армиями. Аргилак Надменный получит смерть, которой искал: с мечом в руке и достойным противником перед собой.\n\n#bold Осталось узнать, чью кровь смоет дождь.#!"
 fab_ac_stormlands.0005.option1:0 "Орис сражается с моего благословения. (Лично провести поединок за Ориса)"
 fab_ac_stormlands.0005.option2:0 "Это поединок Ориса, не мой. (Пусть решают боги)"
 fab_ac_stormlands.0007:0 "Огонь под дождём"
 fab_ac_stormlands.0007.desc:0 "Это едва не стало песней — той, которую я не хотел бы услышать. Аргилак бился так, словно сам Воин вселился в его старое тело: отражал каждый удар, отвечал двумя и заставил мою десницу опуститься на колено в грязь. Очевидцы говорят, старый король смеялся, занося меч для смертельного удара.\n\nТогда на него обрушилась сама буря.\n\nРейнис следила за поединком со спины Мераксес. Драконица оставалась в центре поля, где разбилась конная атака, достаточно близко, чтобы сквозь дождь различить каждый взмах меча. Последнего удара Рейнис ждать не стала. Даже по земле дракон одолеет сотню ярдов грязи быстрее любого коня. Мераксес хлынула вперёд, как прилив, и последний Король Бури погиб в драконьем пламени, в последний миг лишившись смерти, которую искал. Пусть певцы спорят, было ли это милосердием.\n\n#bold Орис жив. Тело его избито, но гордость ранена куда сильнее. Он в долгу перед моей сестрой — и такой долг нелегко нести даже деснице.#!"
 fab_ac_stormlands.0007.option1:0 "Орис обязан жизнью Рейнис."
 fab_ac_stormlands.0008:0 "Последний из королей Бури"
 fab_ac_stormlands.0008.desc:0 "Моя десница и старый король сражались в грязи между двумя войсками, а тысячи людей стояли под дождём и смотрели. Аргилак ещё был силён и по-стариковски хитёр: не раз его клинок ранил Ориса. Очевидцы говорят, был миг, когда исход мог решиться в любую сторону. Но Орис оказался моложе, хладнокровнее и искуснее. Всё закончилось так, как обычно заканчивается: последним быстрым ударом, в тишине, нарушаемой лишь дождём.\n\nАргилак Дюррандон умер так, как хотел: с мечом в руке и бурей за спиной. Последний Король Бури из рода, владевшего Штормовым Пределом с зари времён. Орис, благородный и в победе, опустился рядом на колени и собственноручно закрыл ему глаза. Это запомнят воины обеих сторон.\n\n#bold Штормовой Предел ещё стоит. В нём — Аргелла, дочь Аргилака, которая, говорят, заперла ворота и назвала себя Королевой Бури. Но буря сломлена. Остался лишь дождь.#!"
 fab_ac_stormlands.0008.option1:0 "Он погиб по древнему обычаю. Воздайте ему почести."
 fab_ac_stormlands.0010:0 "Судьба Короля Бури"
 fab_ac_stormlands.0010.desc.duel:0 "Так погиб Аргилак Надменный, последний Король Бури: в поединке с моей десницей, в грязи и под дождём, на глазах у двух войск. Певцы уже слагают песни и зовут битву Последней Бурей. На сей раз они правы: другой не будет. Череда королей, не прерывавшаяся со времён Дюррана Богоборца, пережившая бури, осады, андалов и тысячу лет гордыни, завершилась на острие меча. По древнему обычаю — именно так, как хотел старик.\n\nЕго воины мертвы, бежали или преклонили колени. Королевство подобно обезглавленному телу.\n\nНо корона ещё не утрачена окончательно. С юга доносят: Аргелла, дочь Аргилака, заперла ворота Штормового Предела и объявила себя Королевой Бури. Один замок, один гарнизон и непокорство одной молодой женщины — против всего, что сломило её отца.\n\n#bold Древняя твердыня Дюррана ни разу не пала ни перед бурей, ни перед осадой. Посмотрим, устоит ли она перед драконами.#!"
 fab_ac_stormlands.0010.desc.meraxes:0 "Так погиб Аргилак Надменный, последний Король Бури. Скажем прямо: убил его не человек. Он поставил на колено лучшего бойца моего войска, и лишь сама Мераксес смогла положить ему конец. Штормовые лорды будут скорбеть, но не стыдиться: король умер с мечом в руке, не побеждённый никем из людей. Певцам будет о чём петь. Битву зовут Последней Бурей, и на сей раз верно. Череда королей, не прерывавшаяся со времён Дюррана Богоборца, завершилась в драконьем пламени. Быть может, так напишут и обо всём Завоевании.\n\nЕго воины мертвы, бежали или преклонили колени. Королевство подобно обезглавленному телу.\n\nНо корона ещё не утрачена окончательно. С юга доносят: Аргелла, дочь Аргилака, заперла ворота Штормового Предела и объявила себя Королевой Бури. Один замок, один гарнизон и непокорство одной молодой женщины — против всего, что сломило её отца.\n\n#bold Древняя твердыня Дюррана ни разу не пала ни перед бурей, ни перед осадой. Посмотрим, устоит ли она перед драконами.#!"
 fab_ac_stormlands.0010.desc.fallen:0 "Так погиб Аргилак Надменный, последний Король Бури. Его конец был не таким, каким изобразили бы певцы: не поединок на глазах у двух войск. Война — не песня, и королей она забирает столь же небрежно, как простых людей. Но как бы смерть ни настигла его, меч был у него в руке — никто из знавших его в этом не сомневается. Вместе с ним завершилась череда королей, не прерывавшаяся со времён Дюррана Богоборца.\n\nЕго воины мертвы, бежали или преклонили колени. Королевство подобно обезглавленному телу.\n\nНо корона ещё не утрачена окончательно. С юга доносят: Аргелла, дочь Аргилака, заперла ворота Штормового Предела и объявила себя Королевой Бури. Один замок, один гарнизон и непокорство одной молодой женщины — против всего, что сломило её отца.\n\n#bold Древняя твердыня Дюррана ни разу не пала ни перед бурей, ни перед осадой. Посмотрим, устоит ли она перед драконами.#!"
 fab_ac_stormlands.0010.desc.deposed:0 "Так завершилось правление Аргилака Надменного — но не его жизнь. Последний Король Бури не получил конца, достойного песни: ни поединка на глазах у двух войск, ни последнего сияния славы. Его могущество таяло понемногу, замок за замком, знамя за знаменем, пока не осталось иного выхода, кроме как принять мои условия и жить. Говорят, старый воин предпочёл бы умереть с мечом в руке. Возможно. Но король, всю жизнь проведший в боях, лучше многих знает, когда борьба окончена.\n\nОн последний из своего рода, кто носил корону, как бы ни сложилась судьба его потомков. Череда королей, не прерывавшаяся со времён Дюррана Богоборца, завершилась не огнём и не сталью, а подписью.\n\nЕго войско разбито, лорды преклоняют колени. Теперь королевство должно перейти в более сильные руки.\n\n#bold Буря иссякла. Осталось решить, кто будет править Штормовыми землями от моего имени.#!"
 fab_ac_stormlands.0010.option1:0 "На этом поле заканчивается правление Аргилака."
 fab_ac_stormlands.0010.option2:0 "С Королём Бури покончено."
 fab_ac_stormlands.0011:0 "Орис захватывает Штормовые земли"
 fab_ac_stormlands.0011.desc:0 "Штормовой Предел сопротивлялся меньше двух недель — и сломили его не мы. Воины Аргеллы посмотрели с неприступных стен на моё войско и драконов и сами всё поняли: стены ни разу не пали, но им ещё ни разу не приходилось сдерживать драконий огонь. Не желая гореть за королеву-однодневку, гарнизон ночью восстал против неё. Аргеллу привели в лагерь Ориса как подношение в обмен на мир: нагую, как в день рождения, в цепях и с кляпом во рту.\n\nОрис пристыдил их всех. Собственными руками он снял с неё цепи, укрыл плечи плащом, усадил у костра, дал еды и вина и бережно рассказал о мужестве её отца в последние минуты. Говорят, она ещё не произнесла ни слова и смотрит на него, как птица в клетке — на кота. Такой страх не проходит за день. Но если кто-то способен его унять, то мой брат.\n\nЯ даровал Орису Штормовые земли, сделав его верховным лордом. Чтобы привязать к нему местных лордов, он женится на Аргелле, а для нового дома Баратеонов возьмёт коронованного оленя Дюррандонов и их девиз. Замок её отца, знамя её отца, девиз её отца: её род лишится одной лишь короны. Так кровь Дюррана Богоборца не исчезнет, а соединится с моей.\n\n#bold Когда у них родится наследник, Штормовые земли навеки закрепятся за родом моего брата, а ярость бури будет служить дракону.#!"
 fab_ac_stormlands.0011.desc.noargella:0 "С неповиновением Штормового Предела покончено. Теперь Штормовые земли нужно удержать, и я никогда не сомневался, чьей руке это поручить. Я даровал их Орису, сделав его верховным лордом: моему брату во всём, кроме имени, моей деснице и человеку, чей меч больше других сделал для завоевания побережья. Для новооснованного дома Баратеонов он берёт коронованного оленя Дюррандонов и их девиз. Герб побеждённых королей будет жить в доме, который их победил. Так и следует поступать: вплетать прежнюю славу в новую, а не сжигать её.\n\nБрак, который мог бы скрепить этот союз, — Ориса и Аргеллы, дочери Аргилака, — не состоялся. Судьба распорядилась иначе прежде, чем мы успели его заключить. Жаль: так было бы стройнее. Но штормовые лорды научатся любить оленя ради него самого — или научатся его бояться. Мой брат умеет преподать оба урока.\n\n#bold Штормовые земли обрели правителя моей собственной крови. Ярость бури будет служить дракону.#!"
 fab_ac_stormlands.0011.option1:0 "Пусть олень ещё долго стоит рядом с драконом."
 fab_ac_stormlands.0011.option2:0 "Нам ярость. (Продолжить игру за Ориса Баратеона)"
 fab_ac_stormlands.0011.option3:0 "Ни девиза мёртвого короля, ни его дочери. Собственный дом под знаком Десницы."
 fab_ac_stormlands.0011.option4:0 "Десница выбирает собственный путь. (Продолжить игру за Ориса Баратеона)"
 fab_ac_stormlands.0012:0 "Второй дом дракона"
 fab_ac_stormlands.0012.desc:0 "Над Штормовым Пределом не реет коронованный олень. Орис не пожелал ни дочери мёртвого короля, ни его славы. Он сохранил знамя, под которым завоевал Штормовые земли: чёрную руку на красном поле, знак брата, всегда бывшего моей крепкой правой рукой.\n\nШтормовые лорды могут ворчать, что бастард вознёсся слишком высоко. Я знаю, чья кровь течёт в жилах Ориса. Он сын моего отца, мой единокровный брат; обстоятельства рождения не делают его менее достойным потомком древней Валирии. Если новый дом будет опираться на это наследие, я могу даровать ему ещё большее.\n\nПо моему приказу с Драконьего Камня доставили три тяжёлых ларца. В них — три драконьих яйца, тёмных и твёрдых, как полированный камень, но тёплых на ощупь. Если отдать их Орису, Баратеоны однажды могут стать вторым родом драконьих владык, связанным с Таргариенами кровью, верностью и огнём. Но тогда впервые драконы окажутся в руках другого рода.\n\n#bold Баратеоны могут полететь рядом с нами. Но дракон, летящий рядом, однажды может избрать иной путь.#!"
 fab_ac_stormlands.0012.option1:0 "Он, как и мы, — кровь старой Валирии. Баратеоны полетят рядом с нами."
 fab_ac_stormlands.0012.option2:0 "Увы, в Вестеросе может быть лишь один род драконьих владык."
 fab_ac_stormlands.0012.eggs_tt:0 "Лорд Орис получит три драконьих яйца с Драконьего Камня."
 fab_ac_stormlands.0013:0 "Кровь в моих жилах"
 fab_ac_stormlands.0013.desc:0 "Над завоёванными мною стенами не реет коронованный олень. Я не взял ни руки Аргеллы Дюррандон, ни славы её отца. Над Штормовым Пределом развевается знамя, с которым я вступил в Последнюю Бурю: чёрная рука на красном поле, знак моей добровольной службы и побед, которые по праву могу назвать своими.\n\nШтормовые лорды называют меня бастардом, когда думают, что я не слышу. Они правы, но это не вся правда. У нас с Эйгоном один отец. В моих жилах течёт кровь древней Валирии, как бы мейстеры ни записывали моё имя.\n\nБрат принимает меня наедине. Перед ним три тяжёлых ларца, доставленных с Драконьего Камня. В них лежат три драконьих яйца: тёмные и твёрдые, как полированный камень, но тёплые под ладонью. Он предлагает их не деснице и не верховному лорду, а брату. С этими яйцами мои дети смогут подняться в небо рядом с его детьми, а Баратеоны действительно станут родом драконьих всадников. Но, приняв дар, я положу конец исключительной власти Таргариенов над драконьим пламенем. Наши потомки пожнут плоды нашей мудрости — или нашей глупости.\n\n#bold Я обрёл собственное имя и знамя. Теперь надо решить, какое наследие крови перейдёт вместе с ними.#!"
 fab_ac_stormlands.0013.option1:0 "Я — кровь старой Валирии, как и он. Баратеоны полетят рядом с ним."
 fab_ac_stormlands.0013.option2:0 "Увы, в Вестеросе может быть лишь один род драконьих владык."
 fab_ac_stormlands.0015:0 "Падение Короля Бури"
 fab_ac_stormlands.0015.desc:0 "Буря сломлена. С Аргилаком Надменным покончено: войско рассеяно, тысячелетнему правлению его рода пришёл конец, а Штормовые земли подчиняются дракону. Королевства, наблюдавшие за его неповиновением, притихли.\n\nТеперь все взгляды обращены на север, к последнему королю между мной и властью над востоком: Харрену Чёрному, засевшему за стенами величайшего замка, когда-либо возведённого людьми. Он думает, будто эти стены делают его совсем иным противником, нежели Аргилак. Они лишь отсрочат конец — не более.\n\nЕсть у Харрена слабость, от которой не спасут никакие стены: Речные земли ненавидят его. Харренхол возводили сорок лет под плетьми в каменоломнях. Люди, заплатившие за него кровью и сыновьями, помнят цену каждого камня. Мне говорят, что речные лорды готовы подняться под любым знаменем, сулящим конец власти железнорождённых. Хорошо. Пусть поднимутся под моим.\n\nУже обсуждают, что будет дальше: сохранят ли сыновья Харрена Железные острова, если преклонят колено, и кто станет править Трезубцем. Что бы ни случилось, Речные земли больше не будут подчиняться Пайку. Решим это потом. Сперва надо победить.\n\n#bold Харрен верит в камень. Посмотрим, чего стоит камень.#!"
 fab_ac_stormlands.0015.option1:0 "Чёрный преклонит колено — или Харренхол станет его погребальным костром."
 fab_ac_stormlands.0015.option_rivers_marching:0 "Буря укрощена. Следующий — Харренхол."
 fab_ac_stormlands.0016:0 "Дракон сломлен"
 fab_ac_stormlands.0016.desc:0 "С несостоявшимся завоевателем покончено: он мёртв или бежал на свою скалу. Слухи расходятся, да мне и всё равно. Войско его рассеяно, а его пышное самовенчание станет шуткой, которую певцы ещё сто лет будут рассказывать за вином.\n\nКороль всего Вестероса! Семь Королевств стояли ещё до того, как андалы пересекли море. А мальчишка с тремя чудовищами вздумал проглотить их целиком.\n\nБуря выстояла. Как и всегда."
 fab_ac_stormlands.0016.option1:0 "Так уходит последний драконий владыка."
