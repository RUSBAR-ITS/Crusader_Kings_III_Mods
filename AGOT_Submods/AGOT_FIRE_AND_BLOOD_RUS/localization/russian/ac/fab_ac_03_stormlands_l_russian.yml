l_russian:
 fab_ac_stormlands.0001:0 "Навстречу буре"
 fab_ac_stormlands.0001.desc:0 "Армия поворачивает на юг, но я не поведу ее. Эта война началась с оскорбления как Ориса, так и меня: именно его руку Аргилак не пожелал взять, предложив моему соратнику меньшую партию, как бросают объедки собаке. Итак, именно Орис, моя Десница, ведет цветок моей силы вдоль побережья к Штормовому Пределу — и над его колоннами летит королева Рейнис на Мераксес, серебро и золото на фоне темнеющего неба.\n\nНаши разведчики сообщают нам, что Аргилак очистил свои гарнизоны и собрал всю свою силу в открытом поле. Старый воин знает, как умер Харрен; он не будет гнить за камнем в ожидании драконьего огня. Он намерен встретиться с Орисом клинком к клинку, с бурей за спиной, и закончить эту войну старым способом — или покончить с собой в попытках.\n\nОн получит свою битву. Тучи уже сгущаются над Штормовыми землями, как будто сам Бог Шторма собирается присутствовать.\n\n#bold Певцам понадобится название для того, что грядет. Что-то мне подсказывает, что они назовут это Последним Штормом.#!"
 fab_ac_stormlands.0001.option1:0 "Сокруши бурю, Орис."
 fab_ac_stormlands.0001.desc.first:0 "Армия поворачивает на юг, но я не поведу ее. Эта война началась с оскорбления как Ориса, так и меня: именно его руку Аргилак не пожелал взять, предложив моему соратнику меньшую партию, как бросают объедки собаке. Итак, именно Орис, моя Десница, ведет цветок моей силы вдоль побережья к Штормовому Пределу — и над его колоннами летит королева Рейнис на Мераксес, серебро и золото на фоне темнеющего неба.\n\nНаши разведчики сообщают нам, что Аргилак очистил свои гарнизоны и собрал всю свою силу в открытом поле. Старый воин не любит стены и не собирается гнить за ними, пока драконы кружат по его небу. Он намерен встретиться с Орисом клинком к клинку, с бурей за спиной, и закончить эту войну старым способом — или покончить с собой в попытках.\n\nОн получит свою битву. Тучи уже сгущаются над Штормовыми землями, как будто сам Бог Шторма собирается присутствовать.\n\n#bold Певцам понадобится название для того, что грядет. Что-то мне подсказывает, что они назовут это Последним Штормом.#!"
 fab_ac_stormlands.0002:0 "Последняя Буря"
 fab_ac_stormlands.0002.desc:0 "Два дня небо над Штормовыми землями было черным, как синяк, а на второй день навстречу нам вышел Аргилак. Его советники умоляли его оставаться за стенами — Штормовой Предел никогда не пал, и ни один дракон еще не пробовал его камни. Старый король не хотел этого слышать. У него не было желания узнать, что делает драконий огонь с замком, который не может ему ответить; он не умрет, жарясь в своей собственной крепости. Лучше довериться мечу и буре и встретить врага в открытом поле.\n\nИтак, он напал на нашу армию, неся бурю за спиной, дождь лил ливнями, земля превратилась в трясину — и я скажу о нем следующее: это было сделано хорошо и хитро. Его тяжелая лошадь врезалась в нашу линию, в то время как из-за сырости тетивы наших лучников провисали, а тот же шторм, которому он доверял, не позволял Мераксес попасть в небо: ни один дракон не мог взлететь в этой воющей мгле. Настал черный час, и день висел на волоске.\n\nЗатем наш центр прогнулся и сломался — и рыцари бури галопом хлынули через брешь, думая, что день уже выигран.\n\n#bold Они не могли знать, что моя сестра приготовила для них в центре нашей армии. #!"
 fab_ac_stormlands.0002.option1:0 "Держать строй! Держать!"
 fab_ac_stormlands.0003:0 "Последняя Буря"
 fab_ac_stormlands.0003.desc:0 "Боги послали бурю, достойную этого имени, и я выбрал ее для своего поля битвы — дождь, чтобы затопить тетивы их луков, грязь, чтобы поглотить их наступление, и их крылья драконицы, прижатые к земле ураганом.\n\nДважды моя лошадь атаковала их с фланга; дважды грязь и драконий огонь отбрасывали нас назад, а в третьем натиске моя лошадь падала, и я сражался пешим, окруженный мертвецами обоих цветов. Именно тогда этот ублюдок спустился с холма, чтобы найти меня.\n\nОн призвал меня уступить. Урожай! Я дал ему ответ сталью. Теперь мы сражаемся, он и я, под дождем и руинами моей армии — старого короля бури против сильной правой руки дракона. Певцам лучше было внимательно следить. Что бы они ни пели, они не будут петь о том, что Аргилак преклонил колени."
 fab_ac_stormlands.0003.option1:0 "Нам ярость!"
 fab_ac_stormlands.0004:0 "Дракон под дождем"
 fab_ac_stormlands.0004.desc:0 "В любой другой день Мераксес правил бы небом над этим полем. Не в этот день — дождь лил слишком сильно, а ветер дул слишком сильно, чтобы дракон мог летать. Итак, Рейнис не полетела. Она посадила Мераксес в самом центре нашей армии, на земле, плотно сложив крылья для защиты от бури, неподвижно, как скала в реке, пока вокруг нее разгоралась битва. Ожидающий.\n\nРыцари бури на полном скаку прорвались через наш разрушенный центр — и нашли ее. Лошади, которые пронесли своих всадников сквозь град стрел и стену щитов, бросили один взгляд на то, что стояло перед ними, и сходили с ума. А Мераксес, как они узнают, не нуждается в небе. Она встретила атаку, как скала встречает волну: пламя дракона на десяти шагах не заботится о мокрой земле, и то, что не забрал огонь, сделали ее челюсти — лошадь и всадник вместе, целиком.\n\nРазрыв, который должен был принести Аргилаку победу в битве, стал его гибелью. Атака погибла там, где стояла, и то, что осталось от фургона повелителей бури, покатилось обратно под дождь, подхваченное ураганом, мимо их короля.\n\n#bold Великая авантюра Аргилака провалилась из-за того, что ни один шторм не сможет потопить. #!"
 fab_ac_stormlands.0004.option1:0 "Сообщи мне, чем все закончится."
 fab_ac_stormlands.0005:0 "Старый путь"
 fab_ac_stormlands.0005.desc:0 "Дважды Аргилак оставался без коня, дважды он поднимался на ноги и убивал людей, пришедших схватить его. Теперь он стоит в окружении спешившихся рыцарей под проливным дождем, его гвардия мертва, его армия бежала или умирает — и трижды предлагал пощаду, трижды он отвечал сталью. Он вышел из-за стен не для того, чтобы его схватили.\n\nВесть была донесена до Ориса, и моя Рука — боги любят его — сделала то, что сделал бы я сам. Он приказал раскрыть кольцо копий. Он слез с лошади, вытащил свой длинный меч и призвал старого короля закончить это по-старому, клинок за клинком.\n\nСтарый шторм человека, последний из династии королей, восходящей к рассвету дней, и лучший меч моей армии, одинокий в грязи между двумя армиями. Аргилак Высокомерный получит смерть, которую искал, — клинок в руке и достойный враг перед ним.\n\n#bold Осталось только посмотреть, чью кровь смывает дождь.#!"
 fab_ac_stormlands.0005.option1:0 "Орис сражается с моего благословения. (Направить его клинок)"
 fab_ac_stormlands.0005.option2:0 "Это поединок Ориса, не мой. (Пусть решают боги)"
 fab_ac_stormlands.0007:0 "Огонь под дождем"
 fab_ac_stormlands.0007.desc:0 "Это была почти песня — не та песня. Аргилак сражался так, как будто сам Воин проскользнул в свои старые кости: он отразил каждый удар, отдал два за один и повалил мою Руку на одно колено в грязь. Люди, наблюдавшие за происходящим, говорят, что старый король смеялся, когда поднял меч для смертельного удара.\n\nЗатем на него обрушилась сама буря.\n\nРейнис наблюдала за всем этим со спины Мераксес, приземлившись в центре поля, где разорвался заряд, достаточно близко, чтобы сквозь дождь видеть каждый удар. Она не стала ждать, чтобы увидеть это падение. Приземленный или нет, дракон пересекает сотню ярдов грязи быстрее, чем любая лошадь, когда-либо рожденная — Мераксес наступал, как наступающий прилив, и последний из Королей Шторма закончился в драконьем пламени, обманутый в самом конце смерти, которую он вышел найти. Певцы могут поспорить, было ли это милосердием.\n\n#bold Орис жив — тело в синяках, а его гордость ранена гораздо сильнее. Он должен моей сестре долг, который ни одной Руке не будет легко нести.#!"
 fab_ac_stormlands.0007.option1:0 "Этой победой мы обязаны Рейнис."
 fab_ac_stormlands.0008:0 "Последний из Штормовых королей"
 fab_ac_stormlands.0008.desc:0 "Они сражались в грязи между двумя армиями, моей Десницей и старым королем, в то время как тысячи стояли под дождем и наблюдали. Аргилак был еще силен и полон стариковской хитрости — он не раз отмечал Ориса, и был момент, как говорят наблюдатели, когда день мог пойти в любую сторону. Но Орис был моложе, холоднее и имел лучший клинок. Все закончилось так, как все кончается: быстро, наконец, и в тишине, если бы не дождь.\n\nАргилак Дюррандон умер так, как он хотел умереть — меч в руке, буря за спиной, последний Король Шторма из рода, удерживавшего Штормовой Предел с самого начала дней. И Орис, доблестный даже в победе, опустился на колени рядом с ним в грязи и закрыл глаза собственной рукой. Мужчины с обеих сторон это запомнят.\n\n#bold Штормовой Предел все еще стоит — и внутри него находится дочь Аргилака Аргелла, которая, как говорят, заперла свои врата и назвала себя Королевой Шторма. Шторм прекратился. Остается только дождь.#!"
 fab_ac_stormlands.0008.option1:0 "Он погиб по древнему обычаю. Воздайте ему почести."
 fab_ac_stormlands.0010:0 "Судьба Штормового короля"
 fab_ac_stormlands.0010.desc.duel:0 "Так заканчивается Аргилак, прозванный Высокомерным, последний Король Шторма, сраженный моей Рукой клинок за клинком в грязи и дожде, при наличии двух армий в качестве свидетелей. Певцы уже работают над этим; они называют битву «Последним штормом», и на этот раз певцы правы. Другого не будет. Линия королей, которая непрерывно бежала от Дюрранской Горе Богов — через штормы, осады, андалов и тысячу лет гордости — закончилась на острие меча, по-старому, именно так, как и желал старик.\n\nЕго армия мертва, бежала или стоит на коленях. Его царство — тело без головы.\n\nНо не совсем без короны. С юга приходит слух, что дочь Аргилака Аргелла заперла врата Штормового Предела и назвала себя Королевой Шторма — один замок, один гарнизон и неповиновение одной молодой женщины всему, что сломило ее отца.\n\n#bold Древняя резиденция Дюррана ни разу не подвергалась штурму или осаде. Посмотрим, что он сделает с драконами.#!"
 fab_ac_stormlands.0010.desc.meraxes:0 "Так заканчивается Аргилак по прозвищу Высокомерный — последний Король Шторма, и надо сказать прямо: никто его не убивал. Он повалил на одно колено лучший меч моей армии, и потребовалась сама Мераксес, чтобы прикончить его. Повелители бури будут скорбеть, но им не будет стыдно; их король умер с клинком в руке, не побеждённый ни одним из ныне живущих людей, и певцы этим воспользуются. Они называют битву «Последним штормом», и на этот раз певцы правы. Линия королей, которая непрерывно бежала из Дуррана Божьего Горя, закончилась — в драконьем пламени, как еще можно описать все это завоевание.\n\nЕго армия мертва, бежала или стоит на коленях. Его царство — тело без головы.\n\nНо не совсем без короны. С юга приходит слух, что дочь Аргилака Аргелла заперла врата Штормового Предела и назвала себя Королевой Шторма — один замок, один гарнизон и неповиновение одной молодой женщины всему, что сломило ее отца.\n\n#bold Древняя резиденция Дюррана ни разу не подвергалась штурму или осаде. Посмотрим, что он сделает с драконами.#!"
 fab_ac_stormlands.0010.desc.fallen:0 "Так заканчивается Аргилак по прозвищу Высокомерный — последний Король Шторма. Он не получил того финала, который певцы написали бы для него: сталь против стали перед двумя наблюдающими армиями; война — не песня, и она забирает королей так же беспечно, как и простых людей. Как бы то ни было, оно нашло его, оно нашло его с мечом в руке — никто из тех, кто знал этого человека, в этом не сомневается — и линия королей, которая непрерывно бежала от Дюррана Божьего Горя, закончилась с ним.\n\nЕго армия мертва, бежала или стоит на коленях. Его царство — тело без головы.\n\nНо не совсем без короны. С юга приходит слух, что дочь Аргилака Аргелла заперла врата Штормового Предела и назвала себя Королевой Шторма — один замок, один гарнизон и неповиновение одной молодой женщины всему, что сломило ее отца.\n\n#bold Древняя резиденция Дюррана ни разу не подвергалась штурму или осаде. Посмотрим, что он сделает с драконами.#!"
 fab_ac_stormlands.0010.desc.deposed:0 "Так заканчивается правление Аргилака, прозванного Высокомерным, но, как оказалось, не самого этого человека. Последний Король Шторма не получил финала, который написали бы для него певцы: ни дуэли перед двумя наблюдающими армиями, ни сияния славы. Вместо этого его сила подвела его на дюйм — замок за замком, знамя за знаменем — пока ничего не оставалось, как принять мои условия и жить. Есть те, кто говорит, что старый воин скорее умер бы с мечом в руке. Возможно. Но король, который всю свою жизнь провел в сражениях, лучше других знает, когда битва окончена.\n\nОн последний из своего рода, кто носил корону, что бы ни случилось с его кровью в дальнейшем. Линия королей, непрерывно бежавшая из Дюррана Божьего Горя, заканчивается не огнем или сталью, а подписью.\n\nЕго армия разбита, его лорды стоят на коленях — и его королевство теперь должно быть отдано в более сильные руки.\n\n#bold Буря утихла. Осталось решить, кто будет владеть Штормовыми землями от моего имени.#!"
 fab_ac_stormlands.0010.option1:0 "На этом поле заканчивается правление Аргилака."
 fab_ac_stormlands.0010.option2:0 "Со Штормовым королём покончено."
 fab_ac_stormlands.0011:0 "Орис захватывает Штормовые земли"
 fab_ac_stormlands.0011.desc:0 "Неповиновение Штормового Предела длилось менее двух недель — и нам его не удалось сломить. Собственный гарнизон Аргеллы смотрел из этих непавших стен на мою армию и моих драконов и понимал то, что никому не нужно было им говорить: стены, которые никогда не падали, также никогда не просили остановить драконий огонь. Вместо того, чтобы сжечь однодневную королеву, они восстали против нее ночью и доставили ее в лагерь Ориса в качестве мирной жертвы: с кляпом во рту, в цепях и обнаженную, как ее именины.\n\nОрис пристыдил каждого из них. Он своими руками снял с нее цепи, накинул ей на плечи свой плащ, накормил ее едой и вином у своего огня — и в конце мягко рассказал ей о мужестве ее отца. Говорят, она еще не произнесла ни слова; она наблюдает за ним, как птица в клетке наблюдает за котом. Такой страх, как у нее, не лечится за один день. Но если кто-нибудь из живых и сможет это исправить, так это мой брат.\n\nЯ даровал Орису Штормовые земли как Верховному Лорду, и, чтобы привязать к себе Штормовых Лордов, он женится на Аргелле — и возьмет для своего недавно основанного Дома Баратеонов коронованного оленя Дюррандона и их слова, связанные с ним. Место ее отца, знамя ее отца, слова ее отца: от ее рода ничего не отнято, кроме короны. Таким образом, кровь Даррана Божьего Скорби не закончилась, а соединилась с моей собственной.\n\n#bold Как только у них родится наследник, Штормовые земли навсегда будут принадлежать линии моего брата — и ярость шторма ответит дракону.#!"
 fab_ac_stormlands.0011.desc.noargella:0 "С неповиновением Штормового Предела покончено. Теперь Штормовые земли нужно удержать, и я никогда не сомневался, чьей руке это поручить. Я даровал их Орису, сделав его верховным лордом: моему брату во всём, кроме имени, моей деснице и человеку, чей меч больше других сделал для завоевания побережья. Для новооснованного дома Баратеонов он берёт коронованного оленя Дюррандонов и их девиз. Герб побеждённых королей будет жить в доме, который их победил. Так и следует поступать: вплетать прежнюю славу в новую, а не сжигать её.\n\nБрак, который мог бы скрепить этот союз, — Ориса и Аргеллы, дочери Аргилака, — не состоялся. Судьба распорядилась иначе прежде, чем мы успели его заключить. Жаль: так было бы стройнее. Но штормовые лорды научатся любить оленя ради него самого — или научатся его бояться. Мой брат умеет преподать оба урока.\n\n#bold Штормовые земли обрели правителя моей собственной крови. Ярость бури будет служить дракону.#!"
 fab_ac_stormlands.0011.option1:0 "Пусть долго олень стоит рядом с драконом."
 fab_ac_stormlands.0011.option2:0 "Нам ярость. (Продолжить игру за Ориса Баратеона)"
 fab_ac_stormlands.0011.option3:0 "Ни девиза мёртвого короля, ни его дочери. Собственный дом под знаком Десницы."
 fab_ac_stormlands.0011.option4:0 "Десница выбирает собственный путь. (Продолжить игру за Ориса Баратеона)"
 fab_ac_stormlands.0012:0 "Второй Дом Дракона"
 fab_ac_stormlands.0012.desc:0 "Коронованный олень не летает над Штормовым Пределом. Орис не захотел забрать ни дочь мертвого короля, ни славу мертвого короля себе. Он сохранил знамя, под которым завоевал Штормовые земли: черная рука на красной, знак брата, который всегда был моей сильной правой рукой.\n\nПовелители бурь могут бормотать о ублюдке, которого подняли слишком высоко. Я знаю кровь в жилах Ориса. Он сын моего отца, мой сводный брат и не меньший отпрыск старой Валирии, несмотря на случайность его рождения. Если его новый дом будет стоять на этом наследстве, я могу дать ему еще большее наследство.\n\nПо моему приказу из Драконьего Камня привезли три тяжелых гроба. Внутри них лежат три драконьих яйца, темные и твердые, как полированный камень, но теплые под рукой. Отданные Орису, однажды они смогут превратить Баратеонов во вторую семью повелителей драконов, связанную с Домом Таргариенов кровью, верностью и огнем. Или они могут впервые отдать драконов в руки за пределами моей линии.\n\n#bold Дом Баратеонов может летать рядом с нами. Однако дракон, летящий рядом с вами, однажды может выбрать другой курс. #!"
 fab_ac_stormlands.0012.option1:0 "Он, как и мы, — кровь старой Валирии. Баратеоны полетят рядом с нами."
 fab_ac_stormlands.0012.option2:0 "Увы, в Вестеросе может быть лишь один род драконьих владык."
 fab_ac_stormlands.0012.eggs_tt:0 "Три драконьих яйца из Драконьего Камня будут переданы Лорду Орису."
 fab_ac_stormlands.0013:0 "Кровь в моих венах"
 fab_ac_stormlands.0013.desc:0 "Коронованный олень не летает над моими вновь завоеванными стенами. Я не принял ни руки Аргеллы Дюррандон, ни славы ее отца. Над Штормовым Пределом развевается знамя, которое я нес в Последнюю Бурю: черная рука на красном, знак служения, которое я отдал добровольно, и побед, которые я могу назвать своими.\n\nПовелители бури называют меня ублюдком, когда считают, что я их не слышу. Они правы, но это не вся правда. У нас с Эйгоном родился один и тот же отец. В моих жилах течет кровь старой Валирии, однако мейстеры решили написать мое имя.\n\nМой брат принимает меня одного. Перед ним стоят три тяжелых гроба, принесенные из Драконьего Камня, и внутри них лежат три драконьих яйца, темные и твердые, как полированный камень, но теплые под моей рукой. Он предлагает их не своему Деснице или Верховному Лорду, а своему брату. С ними мои дети могли бы подняться в небо рядом с его собственными, и Дом Баратеонов действительно мог бы стать семьей наездников на драконах. Однако их принятие положило бы конец господству Дома Таргариенов над драконьим пламенем и связало бы наших потомков с нашей мудростью или глупостью.\n\n#bold Я забрал свое имя и знамя. Теперь я должен решить, какое кровное право перейдет к ним.#!"
 fab_ac_stormlands.0013.option1:0 "Я — кровь старой Валирии, как и он. Баратеоны полетят рядом с ним."
 fab_ac_stormlands.0013.option2:0 "Увы, в Вестеросе может быть лишь один род драконьих владык."
 fab_ac_stormlands.0015:0 "Падение Штормового короля"
 fab_ac_stormlands.0015.desc:0 "Шторм прекратился. С Аргилаком Высокомерным покончено — его армия рассеяна, тысячелетнее правление его рода закончилось — и теперь Штормовые земли подчиняются дракону. Королевства, которые видели, как он бросил мне вызов, замолчали.\n\nИтак, все взгляды обращены на север, на последнего короля, стоящего между мной и властью на востоке: Харрена Черного, сидящего на корточках за стенами величайшего замка, который когда-либо возводили люди. Он считает, что эти стены отличают его от Аргилака. Они делают его медленнее, не более того.\n\nИ у Харрена есть слабость, которую не могут исправить никакие стены: речные земли ненавидят его. Сорок лет кнутов и карьеров построили Харренхол, и люди, заплатившие за него кровью и сыновьями, помнят каждый камень цены. Мне говорили, что есть речные лорды, которые поднимутся под любым знаменем, обещающим конец правления железнорожденных. Хороший. Они могут встать за меня.\n\nУже ведутся разговоры о том, что будет дальше: смогут ли сыновья Харрена удержать Железные острова, если преклонят колени, и кто будет держать Трезубец, поскольку речные земли никогда больше не ответят Пайку, что бы ни случилось. Решения на другой день. Во-первых, мы должны победить.\n\n#bold Харрен доверяет камню. Посмотрим, чего стоит камень.#!"
 fab_ac_stormlands.0015.option1:0 "Черный преклонит колени — или Харренхол станет его костром."
 fab_ac_stormlands.0015.option_rivers_marching:0 "Буря укрощена. Следующий — Харренхол."
 fab_ac_stormlands.0016:0 "Сломанный Дракон"
 fab_ac_stormlands.0016.desc:0 "С потенциальным завоевателем покончено: он мертв или бежал обратно в свою скалу, легенды расходятся во мнениях, и я обнаружил, что мне все равно, что именно. Его армия рассеяна, а его великая коронация — это шутка, которую певцы будут рассказывать под вином сто лет.\n\nКороль всего Вестероса. Семь королевств существовали с тех пор, как андалы пересекли море, и один мальчик с тремя животными решил проглотить их целиком.\n\nШторм терпит. Так было всегда."
 fab_ac_stormlands.0016.option1:0 "Так уходит последний драконий владыка."
