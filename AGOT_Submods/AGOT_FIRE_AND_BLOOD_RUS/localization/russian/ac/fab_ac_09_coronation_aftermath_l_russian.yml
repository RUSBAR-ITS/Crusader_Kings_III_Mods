l_russian:
 fab_ac_coronation.0001:0 "Дракон на улицах"
 fab_ac_coronation.0001.desc:0 "Звездная сентябрь подарила мне корону; улицы Староместа подарили мне нечто более редкое.\n\nКогда обряды были завершены, я не вернулся в свою армию на носилках или под навесом, чего септоны, несомненно, ожидали от помазанного короля. Я оседлал Балериона на площади септы и проехал на нем по городу прогулкой — по извилистым мощеным улочкам, мимо залов гильдий и пристаней, под тенью самой Хайтауэра, его крылья были сложены, его черная чешуя сияла, моя корона все еще была на моем лбу.\n\nПосмотреть на это пришли десятки тысяч человек. Они заполнили улицы и крыши домов, висели из окон, отцы поднимали детей на плечи, чтобы посмотреть на Черного Ужаса — величайшего зверя в мире, гуляющего по улицам, прирученного, как лошадь, со своим новым королем на спине. Сначала были крики. Затем аплодисменты, волна за волной, катились впереди нас с улицы на улицу, пока весь город не заревел.\n\nСтрах поставил Вестерос на колени. Но страх ржавеет, и вместе с ним ржавеют и венцы, завоеванные одним страхом. То, что увидел сегодня Старомест, будет рассказываться трем поколениям: не дракон, который горит, а дракон, которому не нужно.\n\n#bold Каждое королевство услышит, как приветствовался Старомест. Завоевание заканчивается не тогда, когда они преклоняют колени, а когда они ликуют.#!"
 fab_ac_coronation.0001.option1:0 "Запомни этот день. Я тоже."
 fab_ac_coronation.0002:0 "Столица для дракона"
 fab_ac_coronation.0002.desc:0 "Война окончена. Шесть королевств склоняются перед одной короной, и теперь каждый лорд, торговец и септон в Вестеросе задают мне один и тот же вопрос: где будет жить эта корона?\n\nДраконий Камень — резиденция моих отцов — крепость, которую никогда не захватывал ни один флот, возведенная валирийскими руками в старину, с солью и дымом в самых камнях. Он сильный, он мой, и здесь началась моя линия. Но он стоит на острове на краю моего царства, и король, правящий с края своего царства, обнаружит, что середина его забудет.\n\nЕще есть холм, на котором я впервые вышел на берег, в устье Черноводной. Эйгонова Крепость состоит из дерева и грязи, а город, возвышающийся вокруг него, моложе моего правления, но он стоит там, где встречаются дороги и реки королевства. Местные жители уже дали этому месту имя. Они называют это место Королевской Гаванью.\n\nМой суд должен где-то сидеть. Мне выбирать."
 fab_ac_coronation.0002.option1:0 "Мой трон будет стоять в Королевской Гавани."
 fab_ac_coronation.0002.option2:0 "Драконий Камень останется резиденцией моего правления."
 fab_ac_coronation.0002.option4:0 "Харрен построил свои башни навечно. Теперь они служат дракону."
 fab_ac_coronation.0002.option5:0 "Мой двор будет заседать в Староместе, старейшем и величайшем из городов."
 fab_ac_coronation.0003:0 "Ковка Железного трона"
 fab_ac_coronation.0003.desc:0 "Семь Королевств принадлежат мне, и завоеватель должен занять место, достойное их. Я отдал приказ: чтобы все клинки, поднятые против меня, — мечи падших королей и сломленных лордов, собранные от Черноводной до Трезубца и самых ворот Штормового Предела, — были перенесены сюда и положены передо мной.\n\nМы складываем их высоко под открытым небом, и я приказываю Балериону дышать. Огонь Черного Ужаса раскален добела, достаточно горяч, чтобы расплавить тысячу клинков в одно. Несколько дней кузнецы трудятся, перековывая искореженную, полурасплавленную сталь в один чудовищный стул — зазубренный, колючий и жестокий, достаточно острый, чтобы укусить неосторожную руку.\n\nВ королевстве его уже называют Железным Троном #bold#!. Это неудобное сиденье, и я бы этого не хотел. Король никогда не должен сидеть сложа руки."
 fab_ac_coronation.0003.option1:0 "Король никогда не должен сидеть удобно."
 fab_ac_coronation.0004:0 "Дракон правит Вестеросом"
 fab_ac_coronation.0004.desc:0 "Зал сегодня полон, и мир за его пределами изменился.\n\nМои сестры стоят рядом со мной, как и стояли со времен Драконьего Камня: Висенья по правую руку от меня, Темная Сестра у ее бедра даже здесь; Слева от меня Рейнис, чьей улыбке ни один мужчина в этом зале не завидует. Под троном великие лорды Вестероса простираются к дверям, и там, где когда-то каждый из них смотрел на свою корону, теперь все глаза в королевстве обращаются к одному месту из плавленой и почерневшей стали.\n\nСейчас я думаю об этом как об одной земле, и это странно держать в уме. От Холодной Стены до красных гор на юге — один закон, один мир, один король. Реки, которые люди текли тысячу лет, протекают через одно царство. Дороги идут неразрывно. Купец может проехать от Белой Гавани до Беседки и ни разу не пересечь границу с оружием. То, что сто королей не смогли сделать за сто жизней, три дракона сделали за несколько лет.\n\nМейстеры могут вести записи о том, какое королевство рухнуло первым и какое было труднее всего разрушить. Это мелкие отчеты, и они будут забыты. Вот что мы будем помнить: небо над Вестеросом принадлежит дому Таргариенов и будет принадлежать нам еще тысячу и тысячу лет. Еще долго после того, как мои кости превратятся в прах, а имена моих сестер станут песнями, люди поднимут глаза и узнают, чья кровь ими правит. Они назовут нас Домом Дракона, и будут правы.\n\nИ все же земля не совсем едина. К югу от маршей пески лежат тихо, а в Солнечном Копье сидит старая слепая женщина, которая сказала моей сестре, что в Дорне нет короля, который мог бы преклонить колени, и отправила мне мои угрозы обратно нераспечатанными. Ее знамя — единственное знамя во всем Вестеросе, которое никогда не опускалось перед моими драконами.\n\n#bold Царство почти целое. Особняком стоит только Дорн — и останется ли он таковым на сезон или на все времена, решать мне.#!"
 fab_ac_coronation.0004.option1:0 "Мы предупреждали принцессу Мерию, что вернёмся с пламенем и кровью."
 fab_ac_coronation.0004.option2:0 "Дорн останется непреклонным, несгибаемым и несдающимся."
 fab_ac_coronation.0005:0 "Мир Дракона"
 fab_ac_coronation.0005.desc:0 "Завоевание завершено, и теперь королевство нужно научить жить с этим.\n\nОт Стены до дорнийских границ чеканятся или приводятся к присяге знамена побежденных королей. За исключением обожженных солнцем лордов Дорна, которые держатся за свои пески и свою злобу, каждый великий дом Вестероса теперь подчиняется [ROOT.Char.GetFirstName].\n\n[ROOT.Char.GetFirstName] больше не является просто Лордом Драконьего Камня или завоевателем с полукованой короной. С этого дня [ROOT.Char.GetFirstName] — #bold Король андалов, ройнаров и Первых Людей, Лорд Семи Королевств и Защитник Царства #!.\n\nИ когда королевство стало единым, во всех его уголках провозглашается один закон превыше всех остальных: #bold Королевский мир#!. С этого дня ни один лорд, великий или малый, каким бы ни был его ранг, каковы бы ни были его обиды, не будет вести войну со своим соседом или разрешать свои споры огнем и сталью. Частные войны, кровоточившие Вестерос на протяжении тысячи лет, закончились; справедливость принадлежит королевскому закону, королевскому суду и королевскому миру. Те, кто сломает его, ответят перед Железным Троном, а в Железном Троне есть драконы.\n\nЛорды будут пировать и заново давать клятвы. Дракон принес мир на землю, которая знала только войну, и на данный момент это царство едино."
 fab_ac_coronation.0005.option1:0 "Семь Королевств почти одно целое."
