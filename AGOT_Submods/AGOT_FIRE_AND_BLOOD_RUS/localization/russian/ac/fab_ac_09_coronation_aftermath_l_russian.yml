 fab_ac_coronation.0001:0 "Дракон на улицах"
 fab_ac_coronation.0001.desc:0 "Звёздная септа дала мне корону. Улицы Староместа — нечто более редкое.\n\nПосле обряда я не вернулся к войску в носилках или под балдахином, как септоны, несомненно, ожидали от помазанного короля. Я оседлал Балериона прямо на площади перед септой и проехал на нём шагом по городу: по извилистым мощёным улицам, мимо гильдейских домов и пристаней, под самой тенью Хайтауэра. Крылья дракона были сложены, чёрная чешуя сияла, а корона всё ещё венчала мою голову.\n\nПоглядеть вышли десятки тысяч. Они заполнили улицы и крыши, высовывались из окон. Отцы сажали детей на плечи, чтобы показать Чёрный Ужас — величайшее чудовище мира, идущее по их улицам смирно, как верховая лошадь, с новым королём на спине. Сначала раздавались крики ужаса. Потом — приветственные возгласы, волна за волной бежавшие впереди нас с улицы на улицу, пока не загремел весь город.\n\nСтрах поставил Вестерос на колени. Но страх ржавеет, а с ним — и короны, добытые одним страхом. О том, что Старомест увидел сегодня, будут рассказывать три поколения: о драконе, который не сжигает, потому что ему незачем сжигать.\n\n#bold Все королевства услышат о ликовании Староместа. Завоевание заканчивается не тогда, когда перед тобой преклоняют колени, а когда тебя приветствуют.#!"
 fab_ac_coronation.0001.option1:0 "Запомните этот день. Я его тоже не забуду."
 fab_ac_coronation.0002:0 "Столица для дракона"
 fab_ac_coronation.0002.desc:0 "Война окончена. Шесть королевств склонились перед одной короной, и теперь каждый лорд, торговец и септон Вестероса задаёт мне один вопрос: где эта корона обоснуется?\n\nДраконий Камень — твердыня моих предков. Ни один флот не смог её взять. Её воздвигли валирийские мастера по древнему обычаю; сами камни пропитаны солью и дымом. Замок крепок, принадлежит мне, и здесь начинался мой род. Но он стоит на острове у края моих владений. Король, правящий с окраины, рискует быть забытым в сердце королевства.\n\nЕсть и холм в устье Черноводной, где я впервые высадился. Эйгонова крепость построена из дерева и земли; город вокруг неё моложе моего правления. Но здесь сходятся дороги и реки королевства. Простой народ уже дал месту имя — Королевская Гавань.\n\nМоему двору нужно пристанище. Выбор за мной."
 fab_ac_coronation.0002.option1:0 "Мой трон будет стоять в Королевской Гавани."
 fab_ac_coronation.0002.option2:0 "Драконий Камень останется моей столицей."
 fab_ac_coronation.0002.option4:0 "Харрен построил свои башни навечно. Теперь они служат дракону."
 fab_ac_coronation.0002.option5:0 "Мой двор обоснуется в Староместе, древнейшем и величайшем из городов."
 fab_ac_coronation.0003:0 "Ковка Железного трона"
 fab_ac_coronation.0003.desc:0 "Семь Королевств мои, и завоевателю нужен достойный их трон. Я приказал доставить сюда все клинки, поднятые против меня: мечи павших королей и сломленных лордов, собранные от Черноводной до Трезубца и самых ворот Штормового Предела. Пусть сложат их передо мной.\n\nМы громоздим их под открытым небом, и я велю Балериону выдохнуть пламя. Огонь Чёрного Ужаса раскалён добела — он сплавляет тысячу клинков воедино. Днями кузнецы трудятся над искорёженной, полурасплавленной сталью, выковывая чудовищный трон: зубчатый, колючий, беспощадный, способный изрезать неосторожную руку.\n\nКоролевство уже зовёт его #bold Железным троном#!. Сидеть на нём неудобно, и таким я его и желал. Королю никогда не следует сидеть вольготно."
 fab_ac_coronation.0003.option1:0 "Королю никогда не следует сидеть вольготно."
 fab_ac_coronation.0004:0 "Дракон правит Вестеросом"
 fab_ac_coronation.0004.desc:0 "Сегодня зал полон, и мир за его стенами изменился.\n\nПо обе стороны стоят мои сёстры, как стояли ещё на Драконьем Камне. Справа Висенья — даже здесь Тёмная Сестра у неё на поясе. Слева Рейнис, чьей улыбке рад каждый мужчина в этом зале. От подножия трона до дверей стоят великие лорды Вестероса. Прежде каждый смотрел на свою корону. Теперь все взоры обращены к одному сиденью из сплавленной, почерневшей стали.\n\nЯ уже мыслю эти земли единым целым, и к этой мысли непросто привыкнуть. От ледяной Стены до Красных гор на юге — один закон, один мир, один король. Реки, за которые тысячу лет лилась кровь, текут по одной державе. Дороги больше не разделены границами. Купец может отправиться из Белой Гавани на Арбор и не пересечь ни одного вооружённого рубежа. Чего сотня королей не сумела за сотню жизней, три дракона добились за несколько лет.\n\nПусть мейстеры записывают, какое королевство покорилось первым, а какое было труднее сломить. Эти мелкие счёты забудутся. Запомнят другое: небо над Вестеросом принадлежит дому Таргариенов и будет принадлежать ещё тысячу лет — и ещё тысячу. Когда мои кости станут прахом, а имена сестёр — песнями, люди всё так же будут поднимать глаза и знать, чья кровь ими правит. Нас назовут Домом Дракона. И будут правы.\n\nИ всё же единство ещё не полно. К югу от марок тихо лежат пески. В Солнечном Копье сидит слепая старуха, сказавшая моей сестре, что у Дорна нет короля, способного преклонить колено. Мои угрозы она отправила обратно, не распечатав. Во всём Вестеросе лишь её знамя ни разу не склонилось перед моими драконами.\n\n#bold Королевство почти едино. Лишь Дорн стоит особняком. На один сезон или навсегда — решать мне.#!"
 fab_ac_coronation.0004.option1:0 "Мы предупреждали принцессу Мерию, что вернёмся с пламенем и кровью."
 fab_ac_coronation.0004.option2:0 "Дорн останется непреклонным, несгибаемым и несдающимся."
 fab_ac_coronation.0005:0 "Мир Дракона"
 fab_ac_coronation.0005.desc:0 "Завоевание завершено. Теперь королевству предстоит научиться с этим жить.\n\nОт Стены до дорнийских марок знамёна покорённых королей либо спущены, либо присягнули новому владыке. Лишь опалённые солнцем лорды Дорна остаются в своих песках со своей злобой. Все остальные великие дома Вестероса покорены; их новый властитель — [ROOT.Char.GetFirstName].\n\n[ROOT.Char.GetFirstName] больше не просто лорд Драконьего Камня и не завоеватель с наполовину выкованной короной. Отныне [ROOT.Char.GetFirstName] — #bold король андалов, ройнаров и Первых людей, владыка Семи Королевств и защитник государства#!.\n\nВ единой державе повсюду провозглашается закон превыше прочих: #bold королевский мир#!. Отныне ни один лорд, великий или малый, каковы бы ни были его звание и обиды, не вправе воевать с соседом или решать споры огнём и сталью. Усобицы, тысячу лет обескровливавшие Вестерос, закончились. Правосудие принадлежит королевскому закону, королевскому суду и королевскому миру. Нарушители ответят перед Железным троном — а у Железного трона есть драконы.\n\nЛорды будут пировать и вновь приносить клятвы. Дракон принёс мир земле, знавшей лишь войну. Пока королевство едино."
 fab_ac_coronation.0005.option1:0 "Семь Королевств почти стали единым целым."
