l_russian:
 fab_dorne_first_war_decision:0 "Подчинить Дорн Железному трону"
 fab_dorne_first_war_decision_desc:0 "Шесть королевств преклонили колена; седьмое прячется за своими песками. Жёлтая Жаба сказала моей сестре, что в Дорне нет короля, которого можно покорить, — и обещала нам беду, если мы вернёмся.\n\nМы предупредили её, каким будет наш ответ. Пламя и кровь."
 fab_dorne_first_war_decision_desc_deferred:0 "Перед советом я объявил первую войну оконченной, но не сказал, что всё решено. Орис по-прежнему томится в дорнийской темнице, лорд Хайгардена всё ещё лежит где-то в песках, а старуха называет себя непокорённой.\n\nПустыни отдохнули достаточно. Пламя и кровь — пока Дорн не усвоит урок."
 fab_dorne_first_war_decision_tooltip:0 "Пока Дорн стоит особняком, Завоевание не окончено."
 fab_dorne_first_war_decision_confirm:0 "Выпустить драконов."
 fab_crown_vale_war_decision:0 "Подчинить Долину"
 fab_crown_vale_war_decision_desc:0 "Сокол всё ещё сидит над облаками и величает себя королём. Горы и замки на перевалах остановили нашу первую попытку, но ни один перевал не защитит от дракона.\n\nДолина станет частью королевства. Пламя и кровь."
 fab_crown_vale_war_decision_tooltip:0 "Пока Долина стоит особняком, Завоевание не окончено."
 fab_crown_vale_war_decision_confirm:0 "Сокол должен ответить."
 fab_crown_north_war_decision:0 "Подчинить Север"
 fab_crown_north_war_decision_desc:0 "Короли Зимы всё ещё правят за Перешейком, как правили восемь тысяч лет, а наше первое наступление было остановлено на гати.\n\nКоролевство не может быть единым, пока половина его земель ему не подчиняется. Север преклонит колени. Пламя и кровь."
 fab_crown_north_war_decision_tooltip:0 "Пока Север стоит особняком, Завоевание не окончено."
 fab_crown_north_war_decision_confirm:0 "Волк должен ответить."
