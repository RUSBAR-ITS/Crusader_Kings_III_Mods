l_russian:
 fab_ac_north.0001:0 "Зимние знамёна"
 fab_ac_north.0001.desc:0 "Наконец пришли вести с севера, из-за Перешейка: купцы и капитан торгового судна из Белой Гавани сообщают, что король Торрхен Старк созвал знамёна в Винтерфелле.\n\nГоворят, стоя в великом зале предков, наследник восьми тысяч лет власти Старков поднял над головой Лёд — двуручный меч своего дома из валирийской стали, древнее любой северной вражды. И лорды зимы взревели так, что задрожали стропила. Дастины и Болтоны, Амберы и Карстарки, Мандерли, Мормонты, Флинты — суровые люди суровой земли. Никто из них ещё не преклонял колена перед властителем к югу от Перешейка.\n\nНо Север огромен: больше остальных королевств Вестероса вместе взятых и по большей части безлюден. За несколько недель такого войска не собрать. От Последнего Очага до Закатного моря лордам предстоит стянуть людей с расстояний, каких южные враги и представить не могут. Пройдут многие луны, прежде чем волк выступит.\n\n#bold Когда бы он ни явился и сколько бы воинов ни привёл, ответ будет один.#!"
 fab_ac_north.0001.option1:0 "Волк зашевелился. Хорошо."
 fab_ac_north.0002:0 "Созыв знамён"
 fab_ac_north.0002.desc:0 "Юг рушится. Не медленно, как королевства в старых сказаниях, а за считаные месяцы. Король Бури мёртв, Харрен сгорел в каменных стенах, Простор обратился в пепел, Скала преклонила колени. Каждый ворон с Перешейка несёт весть страшнее прежней.\n\nСевер не покорился андалам, когда им покорился весь юг. Он не склонялся ни перед кем. У Рва Кейлин собрались тридцать тысяч воинов. Я сам поведу их по гати на юг.\n\nМне не по душе эта война. Но король Севера, который позволяет пожирать юг по частям и ждёт своей очереди за Перешейком, — вовсе не король."
 fab_ac_north.0002.option1:0 "Зима встретит дракона."
 fab_ac_north.0003:0 "Волк пересекает Перешеек"
 fab_ac_north.0003.desc:0 "Весть настигла меня в Хайгардене, ещё пропахшем пеплом Пламенного поля: Торрхен Старк прошёл Перешеек во главе тридцати тысяч северян и вступил в Речные земли. Король Севера собрал войско быстрее, чем я считал возможным, и спешит к Трезубцу.\n\nС этого часа все планы на юге — Старомест, Марки, Дорн — отложены. Моё войско поворачивает на север и идёт со всей возможной скоростью. Я не еду с ним: лечу впереди на крыльях Балериона. Ещё раньше отправляются вороны к Рейнис, Висенье и каждому лорду, преклонившему колено после Харренхола и Пламенного поля. Люди Речных и Штормовых земель, Простора и Запада обязаны новому королю военной службой. Призову их исполнить долг у Трезубца.\n\n#bold Торрхен ведёт тридцать тысяч. Покажем ему судьбу тех, кто уже пытался противопоставить людей драконам.#!"
 fab_ac_north.0003.option1:0 "На север. Немедленно."
 fab_ac_north.0004:0 "Волк пересекает Перешеек"
 fab_ac_north.0004.desc:0 "Эйгонова крепость — скромное жилище для короля: деревянные стены и грязный двор над тремя холмами. Но она моя, и на её стенах я решил последний великий вопрос Завоевания. Север преклонит колено вслед за остальными.\n\nНесколько дней назад мои вороны отправились на север. Ответ пришёл на единственном языке, которым Старки говорят с завоевателями. Торрхен Старк прошёл Перешеек во главе тридцати тысяч северян, вступил в Речные земли и спешит к Трезубцу. Он собрал войско быстрее, чем я считал возможным. Теперь всё решится на поле боя — или в тени дракона.\n\nЯ не еду с войском. Лечу впереди на крыльях Балериона, а ещё раньше отправляются вороны к Рейнис, Висенье и каждому присягнувшему лорду. Люди Речных и Штормовых земель, Простора и Запада обязаны королю военной службой. Призову их исполнить долг у Трезубца.\n\n#bold Торрхен ведёт тридцать тысяч. Покажем ему судьбу тех, кто уже пытался противопоставить людей драконам.#!"
 fab_ac_north.0004.option1:0 "На север. К Трезубцу."
 fab_ac_north.0005:0 "Войско у Трезубца"
 fab_ac_north.0005.desc:0 "Волк достиг Трезубца и застал дракона в ожидании.\n\nТридцать тысяч воинов Торрхена Старка стоят на северном берегу. На противоположном у меня сорок пять тысяч: речные лорды, помнящие Харренхол, воины Штормовых земель под коронованным оленем моей десницы, люди Простора и Запада, видевшие, как два короля сгорели на Пламенном поле. Над нами кружат Балерион, Вхагар и Мераксес — каждый северянин может их пересчитать.\n\nМежду войсками стоит старый постоялый двор. Всю ночь через его двери проходят седобородые старейшины и мейстеры с посланиями из северного лагеря. Одни лорды убеждают Торрхена отдать корону и спасти народ. Другие советуют отступить за Ров Кейлин. Брандон Сноу шепчет о луке из чардрева, лодке и спящих драконах.\n\nНад рекой встаёт холодный рассвет. Дверь постоялого двора открывается. Король Севера выходит с ответом."
 fab_ac_north.0005.option1:0 "Торрхен кладёт Лёд к моим ногам. Север преклоняет колено."
 fab_ac_north.0005.option2:0 "«Зима близко», — говорит он. Что ж, пусть решит война."
 fab_ac_north.0005.option2.tt:0 "Война за завоевание продолжается. Брандон Сноу попытается убить одного из трёх драконов. Вероятность успеха — #V 10%#!."
 fab_ac_north.0006:0 "Совет на Трезубце"
 fab_ac_north.0006.desc:0 "Чем ближе мы подходим, тем страшнее открывающаяся правда. Я слышал рассказы и, как всякий разумный человек, делил их надвое. Но правда хуже рассказов. За один день сгорело войско, впятеро превосходившее силы дракона. Речные лорды, которые должны были восстать вместе с нами, вместо этого ему присягнули. За Трезубцем стоит армия больше моей, а над нею — три дракона.\n\nВассалы гремят о чести и крови Первых людей. Мой брат-бастард Брандон предлагает иное: клянётся, что переправится ночью с луком из чардрева и пустит стрелу в глаз спящему дракону.\n\nСыновья, братья, вся мощь Севера — я могу поставить всё на один бросок костей. А могу вступить в переговоры с драконом, пока за мной ещё стоит войско."
 fab_ac_north.0006.option1:0 "Вступим в переговоры. Я не сожгу Север ради своей гордыни."
 fab_ac_north.0006.option2:0 "Север выстоит. Брандон отправится сегодня ночью."
 fab_ac_north.0007:0 "Сложенная корона"
 fab_ac_north.0007.desc:0 "Всю ночь Брандон и три мудрейших моих мейстера переправлялись через Трезубец туда и обратно, передавая условия обеих сторон. К рассвету мы договорились. Я сделал то, чего собирался избежать, ведя на юг тридцать тысяч воинов. И то, что в итоге позволило им выжить.\n\nЯ преклонил колено в грязи на берегу, положил Лёд к его ногам и вручил завоевателю Зимнюю корону. Он поднял меня лордом Винтерфелла и Хранителем Севера, а мои люди отправились домой. Живыми. Все до одного.\n\nПевцы будут безжалостны. Преклонивший Колено — так они меня назовут, и мои лорды станут повторять это за вином до конца моих дней. На Пламенном поле список имён длиннее. И за каждым именем — мертвец."
 fab_ac_north.0007.option1:0 "Пусть зовут меня Преклонившим Колено. Мои люди живы."
 fab_ac_north.0008:0 "Лук, лодка, ночь"
 fab_ac_north.0008.desc:0 "Решено. Когда луна зашла, Брандон выскользнул из лагеря с луком из чардрева и двумя молчаливыми спутниками. Он направился к тёмному дальнему берегу, где чудовища спят среди шатров завоевателя.\n\nЕсли боги наших отцов смотрят на нас, к рассвету один дракон умрёт и весь Вестерос узнает, что они смертны. Если не смотрят — я погубил брата.\n\nСтарые сказания говорят, что против андалов шансы Теона Старка были ещё хуже. И всё же Голодный Волк насытился. Но у андалов не было драконов, а эта ночь кажется мне бесконечной."
 fab_ac_north.0008.option1:0 "Боги моих отцов, берегите его."
 fab_ac_north.0009:0 "Невозможная стрела"
 fab_ac_north.0009.desc:0 "Клянусь старыми богами и новыми — он сумел.\n\nДракон мёртв. Во тьме стрела Брандона угодила ему в глаз. Предсмертный крик разбудил оба лагеря и вскоре разбудит весь мир. Чудовища Валирии смертны — и доказал это бастард из Винтерфелла с луком из чардрева.\n\nВо вражеском лагере смятение; в моём ревут имя Брандона. Что бы ни грянуло теперь — а гнев завоевателя грянет непременно, — чары разрушены. Трубите в рога! Если суждено встретить бурю, мы встретим её первыми за триста лет людьми, узнавшими, что драконы тоже истекают кровью."
 fab_ac_north.0009.option1:0 "Драконы могут умереть. Теперь мир знает."
 fab_ac_north.0010:0 "Цена попытки"
 fab_ac_north.0010.desc:0 "На рассвете на дальнем берегу нашли то, что оставил огонь. Мой брат мёртв.\n\nБрандон добрался до спящих чудовищ. Добрался, слышите, миновав всю стражу завоевателя. Стрела полетела. Дракон проснулся. Хоронить нечего. Остался лишь наполовину обугленный лук из белого чардрева: какой-то храбрец-безумец из его спутников перенёс его назад через реку. Я буду хранить его до смерти.\n\nВойско завоевателя приходит в движение, а его разъярённые чудовища уже в небе. Мне предстоит защищаться как смогу, зная, что этого мало. И зная, что заговори я о мире днём раньше — брат всё ещё стоял бы рядом."
 fab_ac_north.0010.option1:0 "Покойся с миром, брат. Пусть чардрева хранят тебя."
 fab_ac_north.0011:0 "Север склоняется"
 fab_ac_north.0011.desc:0 "В сумерках через реку переправились под мирным знаменем Брандон Сноу, брат-бастард короля Севера, и три мейстера. Тот самый Брандон, который, по уверениям разведчиков, предлагал ночью переплыть Трезубец и перерезать глотки моим драконам, теперь прибыл договариваться. Всю ночь через тёмную воду перевозили послания. При свечах условия писали и переписывали. Отдам северянам должное: они торговались за честь, а не за жизнь.\n\nНаутро Торрхен Старк пересёк Трезубец. На южном берегу, на глазах обоих войск, он преклонил колено в речной грязи. Положил к моим ногам меч, а рядом — Зимнюю корону, древнюю корону северных королей, дошедшую из Эпохи героев. Он отдал её целой, тогда как все прочие короны Вестероса приходилось сжигать или сбивать с голов владельцев.\n\nОн поднимается лордом Винтерфелла и Хранителем Севера. Его земли и права сохранены, народ не сожжён. Тридцать тысяч северян вернутся к жёнам, потому что королю хватило мужества склониться. Его уже зовут Преклонившим Колено. Некоторые собственные лорды произносят это с презрением.\n\n#bold Им следовало бы произносить это на коленях. Сегодня Торрхен Старк спас больше жизней, чем большинство королей за всё правление.#!"
 fab_ac_north.0011.option1:0 "Торрхен Старк предпочёл свой народ короне."
 fab_ac_north.0012:0 "Триумф Брандона Сноу"
 fab_ac_north.0012.desc:0 "Крик будит меня раньше сигнальных рогов. За постоялым двором люди бегут от окровавленной горы крыльев. [global_var:fab_north_slain_dragon.GetName] лежит на берегу бездыханно; в огромном глазу торчит белое древко из чардрева.\n\nБрандон Сноу пересёк Трезубец под луной, миновал часовых и сделал то, что все короли Вестероса считали невозможным. Один из трёх драконов, ковавших мои победы, больше не взлетит. За рекой северяне ревут имя Брандона, уверенные, что чары Валирии разрушены.\n\nОсталось два дракона. Двух хватит, чтобы растопить снега от Рва Кейлин до Стены. Я предложил Старкам преклонить колено — они выбрали кровь. Я отвечу девизом своего дома."
 fab_ac_north.0012.option1:0 "Осталось два дракона. Север заплатит пламенем и кровью."
 fab_ac_north.0013:0 "Безумие Брандона Сноу"
 fab_ac_north.0013.desc:0 "Тревога поднимается в самый тёмный час ночи. Брандон Сноу переправился с луком из чардрева и прокрался к драконам, намереваясь пустить стрелу в спящий глаз. Ему удалось приблизиться достаточно, чтобы разбудить одного. Только и всего.\n\nДраконий огонь превращает ночь в день. К рассвету перед моим шатром висит обгоревший лук бастарда, а все три дракона уже в небе. Торрхен пожертвовал самым отважным братом и получил лишь рассказ о неудаче.\n\nНезачем превращать Север во второй Харренхол. Его король и войско здесь, передо мной; сперва сокрушу их. Винтерфелл ещё можно пощадить, если волк научится покорности на поле боя."
 fab_ac_north.0013.option1:0 "Разбейте его войско. Пусть на Севере останется чем править."
 fab_ac_north.0014:0 "Кто будет править Севером?"
 fab_ac_north.0014.desc:0 "Северное войско разбито, король в моей власти. Торрхен Старк преклонил колено там, где собирался дать бой. Перед ним лежит обнажённый Лёд, рядом — помятая Зимняя корона. Лорды опускаются на колени медленнее. Некоторые даже не смотрят на него.\n\nСевер слишком велик, чтобы править им с Черноводной. За Перешейком один из домов должен говорить от моего имени, созывать знамёна на мои войны и хранить королевский мир долгими зимами. Старки владели этими землями тысячелетиями; даже побеждённым волкам сохраняют древнюю верность. Но силён и Дредфорт, а Болтоны давно умеют держать людей в страхе. Белая Гавань предлагает корабли, серебро и благодарность Мандерли, хотя многие помнят: на Север они пришли изгнанниками из Простора.\n\nКорона отнята. Осталось пожаловать звание Хранителя."
 fab_ac_north.0014.option1:0 "Старки сохранят Винтерфелл и звание хранителей Севера."
 fab_ac_north.0014.option1.tt:0 "Дом Старков сохраняет власть верховных лордов Севера, подчиняясь Железному трону."
 fab_ac_north.0014.option2:0 "Отдать Север Болтонам. Страх удержит его в повиновении."
 fab_ac_north.0014.option2.tt:0 "Лорд Дредфорта получает титул верховного лорда Севера. Торрхен Старк и северные лорды должны присягнуть дому Болтонов."
 fab_ac_north.0014.option3:0 "Возвысить дом Мандерли. Северу нужны верный флот и серебро."
 fab_ac_north.0014.option3.tt:0 "Лорд Белой Гавани получает титул верховного лорда Севера. Торрхен Старк и северные лорды должны присягнуть дому Мандерли."
 fab_ac_north.0015:0 "Хранитель Севера"
 fab_ac_north.0015.desc:0 "Великий зал Винтерфелла строили для королей. Под древними стропилами клубится дым, под нами в криптах лежат каменные короли. Но помятая Зимняя корона покоится на плитах у моего сиденья. Живой человек её больше не наденет.\n\nВперёд выходит [fab_north_warden.GetTitledFirstName], представляя дом [fab_north_warden.GetHouse.GetName], на глазах у собравшихся северян. Я назначаю [fab_north_warden.GetHerHim] править северными лордами и хранить каждую холодную милю от Перешейка до Стены — но короны не даю. Неважно, тот ли это правитель, которого назвали после битвы, или наследник, поставленный передо мной войной и смертью. Теперь титул обязывает [fab_north_warden.GetHerHim], и [fab_north_warden.GetSheHe] принесёт присягу.\n\nОдин за другим северяне преклоняют колени, признавая [fab_north_warden.GetHerHim] своим правителем. Одни — по старой верности, другие — из страха, третьи — в память о трёх драконах над Трезубцем. Причины у них свои. Присяга — мне.\n\n#bold Короны больше нет. Север остаётся, а его Хранитель подчиняется Железному трону.#!"
 fab_ac_north.0015.option1:0 "Поднимитесь, [fab_north_warden.GetFirstName]. Храните Север от моего имени."
 fab_ac_north.0016:0 "Зима преклоняет колено"
 fab_ac_north.0016.desc:0 "Всё кончено. Войско Севера разбито, гать за моей спиной захвачена, драконы кружат где хотят. Между завоевателем и Винтерфеллом осталось лишь расстояние.\n\nПоследний выбор короля Севера — как всё завершить. Я преклоню колено. Не ради себя: гордость погибла вместе с войском. Ради каждой северной деревни, до которой чудовища ещё не добрались.\n\nВосемь тысяч лет завершаются на мне. Остаётся молиться, чтобы в победе дракон был столь же сдержан, сколь страшен в войне."
 fab_ac_north.0016.desc.submit:0 "Дракон вступил в мои владения, но Север ещё не сломлен. Я преклоню колено прежде, чем его сломят. Не ради себя — ради каждой деревни, до которой ещё не добрались чудовища, и каждого сына, которому незачем гибнуть, доказывая, что огонь горит и зимой.\n\nМоё решение завершает восемь тысяч лет королевской власти. Корона утрачена, но Север выстоит."
 fab_ac_north.0016.option1:0 "Север выстоит, даже преклонив колено."
