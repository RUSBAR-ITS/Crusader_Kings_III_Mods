l_russian:
 fab_ac_north.0001:0 "Зимние знамена"
 fab_ac_north.0001.desc:0 "Наконец к северу от Перешейка пришло известие, принесенное торговцами и торговым капитаном из Белой Гавани: в Винтерфелле король Торрхен Старк созвал свои знамена.\n\nГоворят, он стоял в великом зале своих предков, под восьмитысячелетними королями Старка, и поднял над головой Лед — большой меч своего дома, валирийскую сталь, старше любой обиды на Севере — и что повелители зимы ревели до тех пор, пока не затряслись стропила. Дастин и Болтон, Умбер и Карстарк, Мандерли, Мормонт и Флинт: суровые люди из суровой страны, никто из которых никогда не преклонял колени перед силой к югу от Перешейка.\n\nНо Север огромен — больше, чем все остальные королевства Вестероса вместе взятые, и большая его часть пуста. Сбор Севера — дело не недель; от Последнего очага до берегов Закатного моря его лорды должны собирать людей на расстояниях, которые мои южные враги не могут себе представить. Пройдет много лун, прежде чем волк сможет идти.\n\n#bold Когда бы он ни пришел и сколько бы людей он ни привел, ответ ждет его один и тот же. #!"
 fab_ac_north.0001.option1:0 "Волк зашевелился. Хорошо."
 fab_ac_north.0002:0 "Созыв знамён"
 fab_ac_north.0002.desc:0 "Юг падает. Не медленно, как в старых сказках рушатся королевства, а за несколько месяцев — Король Шторма мертв, Харрен сгорел в своих камнях, Простор превратился в пепел, а Скала встала на колени. Каждый ворон, вышедший из Перешейка, несет в себе еще худшую историю, чем предыдущий.\n\nСевер не преклонил колени перед андалами, в отличие от всего юга. Оно никогда ни перед кем не преклоняло колени. Тридцать тысяч человек собраны у Рва Кейлин, и я сам поведу их по дамбе.\n\nЯ не люблю эту войну. Но король Севера, который позволяет югу быть сожранным по частям и ждет своей очереди за Перешейком, вовсе не король."
 fab_ac_north.0002.option1:0 "Зима встретит дракона."
 fab_ac_north.0003:0 "Волк пересекает Перешеек"
 fab_ac_north.0003.desc:0 "Весть дошла до меня в Хайгардене, где все еще пахло пеплом Огненного поля: Торрхен Старк спустился через Перешеек во главе тридцати тысяч северян и вошел в речные земли. Король Севера провел сбор быстрее, чем я считал возможным, и он решительно идет к Трезубцу.\n\nВсе планы, которые я составил для юга — Старомест, марши, Дорн — с этого часа отложены. Моя армия поворачивает на север со всей возможной скоростью, и я не еду с ней: я лечу впереди всех на крыльях Балериона. Вороны выходят передо мной — к Рейнис, к Висенье и к каждому лорду, преклонившему колени перед Харренхолом и Огненным полем. Речной лорд и штормовик, ричмен и западный человек — все они задолжали своему новому королю войну, и я собираюсь собрать их в «Трезубце».\n\n#bold Торрхен приносит тридцать тысяч. Давайте покажем ему, что стало со всеми остальными, кто считал людей против драконов.#!"
 fab_ac_north.0003.option1:0 "На север. Немедленно."
 fab_ac_north.0004:0 "Волк пересекает Перешеек"
 fab_ac_north.0004.desc:0 "Эйгонова Крепость — неудачное место для короля — деревянные стены и глинобитный двор над тремя холмами, — но он мой, и с его валов я решил последнее великое дело Завоевания. Север встанет на колени, как и все остальные.\n\nМои вороны улетели на север несколько дней назад, и Север ответил на единственном языке, на котором Старки когда-либо разговаривали с потенциальными завоевателями. Торрхен Старк спустился через Перешеек во главе тридцати тысяч северян и пересек речные земли, решительно маршируя к Трезубцу. Король Севера собрался быстрее, чем я считал возможным, но он собрался, и теперь дело будет решено в поле или под тенью дракона.\n\nЯ не езжу с армией. Я лечу впереди всех на крыльях Балериона, и передо мной вылетают вороны — к Рейнис, к Висенье и к каждому лорду, преклонившему колени. Речной лорд и штормовик, ричман и западный человек — все они задолжали своему королю войну, и я собираюсь получить их в «Трезубце».\n\n#bold Торрхен приносит тридцать тысяч. Давайте покажем ему, что стало со всеми остальными, кто считал людей против драконов.#!"
 fab_ac_north.0004.option1:0 "На север. К Трезубцу."
 fab_ac_north.0005:0 "Армия у Трезубца"
 fab_ac_north.0005.desc:0 "Волк добрался до Трезубца и обнаружил, что его ждет дракон.\n\nТридцать тысяч Торрхена Старка стоят на северном берегу. По ту сторону воды у меня сорок пять тысяч: речные лорды, которые помнят Харренхол, штормовики под коронованным оленем моей Десницы, а также люди Простора и западных земель, которые видели, как два короля сгорели на Поле Огня. Балерион, Вхагар и Мераксес кружатся над нами, где их может сосчитать каждый северянин.\n\nМежду армиями стоит обветренная гостиница. Всю ночь через его двери проходят седобородые и мейстеры, неся слова из северного лагеря. Некоторые из лордов Торрхена убеждают его отдать свою корону и спасти свой народ. Другие советуют ему отступить за Ров Кейлин, а Брэндон Сноу шепчет о луке из чардрева, лодке и спящих драконах.\n\nНа реке холодает рассвет. Дверь гостиницы открывается, и Король Севера выходит вперед со своим ответом."
 fab_ac_north.0005.option1:0 "Торрхен кладёт Лёд к моим ногам. Север преклоняет колено."
 fab_ac_north.0005.option2:0 "Зима близко, говорит он. Тогда война решит."
 fab_ac_north.0005.option2.tt:0 "Завоевательная война продолжается. Брэндон Сноу попытается убить одного из трех драконов с шансом на успех #V 10%#!."
 fab_ac_north.0006:0 "Совет на Трезубце"
 fab_ac_north.0006.desc:0 "Чем ближе мы идем, тем хуже это правда. Я слышал сказки и сократил их наполовину, как это делает разумный человек, — а правда хуже сказок. За день сгорела армия, в пять раз превышающая численность дракона. Вместо этого речные лорды, которые должны были подняться вместе с нами, преклоняют перед ним колени, а его армия за Трезубцем больше моей, и над ней стоят три дракона.\n\nМои знаменосцы возвещают о чести и крови Первых Людей. А мой ублюдочный брат Брэндон предлагает кое-что еще: он клянется, что с помощью лука из чардрева и ночной тьмы он сможет пересечь реку и пронзить стрелой глаз спящего дракона.\n\nСыны, братья, вся сила Севера — я могу потратить все это на один бросок костей, или я могу вести переговоры с драконом, пока у меня еще есть армия, с которой можно вести переговоры."
 fab_ac_north.0006.option1:0 "Вступим в переговоры. Я не сожгу Север ради своей гордыни."
 fab_ac_north.0006.option2:0 "Север выстоит. Брэндон отправится сегодня ночью."
 fab_ac_north.0007:0 "Сложенная корона"
 fab_ac_north.0007.desc:0 "Всю ночь Брэндон и три моих мудрейших мейстера пересекали Трезубец, неся с собой мои и его условия. К рассвету все было сделано, и я сделал то, чего я повел на юг тридцать тысяч человек, чтобы избежать, и то, что я повел их на юг, в конце концов, чтобы выжить.\n\nЯ преклонил колени в грязи на берегу реки, положил лед к его ногам и отдал Корону Зимы в руки победителя. Он возвысил меня как Лорда Винтерфелла и Хранителя Севера, и мои люди снова отправились домой — все до единого, живые.\n\nПевцы не будут добрыми. Они назовут меня Королем, который преклонил колени, и мои лорды будут повторять это в своих чашах, пока я жив. Список имен «Огненного поля» длиннее, и каждое имя в нем мертво."
 fab_ac_north.0007.option1:0 "Пусть они называют меня Королем, который преклонил колени. Мои люди живы."
 fab_ac_north.0008:0 "Лук, лодка, ночь"
 fab_ac_north.0008.desc:0 "Дело сделано: Брэндон выскользнул из лагеря на закате луны со своим чардревовым луком и двумя молчаливыми людьми и направился в темноту дальнего берега, где звери спят среди палаток победителя.\n\nЕсли боги наших отцов наблюдают, к рассвету один из драконов мертв, и каждый человек в Вестеросе узнает, что они могут умереть. Если они не смотрят, я провел своего брата.\n\nСтарые предания говорят, что у Теона Старка были худшие шансы против андалов, и Голодный Волк накормился. Но у андалов не было драконов, и ночь кажется мне очень длинной."
 fab_ac_north.0008.option1:0 "Боги моих отцов, берегите его."
 fab_ac_north.0009:0 "Невозможная стрела"
 fab_ac_north.0009.desc:0 "Клянусь старыми богами и новыми — он сделал это.\n\nДракон мертв. Стрела Брэндона нашла свой глаз в темноте, и ее крик разбудил оба лагеря, а потом разбудит и весь мир. Звери Валирии могут умереть, и это доказал ублюдок из Винтерфелла с луком из чардрева.\n\nЛагерь дракона в смятении, а мой собственный выкрикивает имя Брэндона. Что бы ни случилось сейчас — и придет гнев завоевателя — чары разрушены. Подайте звуковые сигналы. Если нам придется бороться с надвигающейся бурей, мы будем сражаться с ней как первые люди за триста лет, узнавшие, что драконы истекают кровью."
 fab_ac_north.0009.option1:0 "Драконы могут умереть. Теперь мир знает."
 fab_ac_north.0010:0 "Цена попытки"
 fab_ac_north.0010.desc:0 "С первыми лучами солнца они нашли то, что оставил огонь, на дальнем берегу. Мой брат мертв.\n\nБрэндон добрался до спящих зверей — заметьте, добрался до них, минуя всех стражников, которые были у победителя — и стрела полетела, и дракон проснулся. Хоронить нечего. Есть полуобгоревший лук из белого чардрева, который какой-то храбрый дурак из его людей перевез через реку, и я буду хранить его до самой смерти.\n\nАрмия завоевателя волнуется, и его звери в небе теперь разъярены. Я должен защищаться, насколько могу, зная, что этого недостаточно, и зная, что одно мое слово о договоре, днем ​​раньше, и мой брат все еще будет стоять у меня за плечом."
 fab_ac_north.0010.option1:0 "Покойся с миром, брат. Пусть чардрева хранят тебя."
 fab_ac_north.0011:0 "Север склоняется"
 fab_ac_north.0011.desc:0 "В сумерках они переправились через реку под знаменем мира: Брэндон Сноу, внебрачный брат короля Севера, с тремя мейстерами в своей компании. Тот самый человек, клянутся мои разведчики, который предложил ночью переплыть Трезубец и перерезать глотки моим драконам, — вместо этого послан на переговоры со мной. Всю ночь по темной воде ходили туда-сюда сообщения, условия составлялись и перерисовывались при свете свечей, и я скажу это за северян: они торговались из-за своей чести, а не из-за своей жизни.\n\nУтром Торрхен Старк пересек Трезубец. Он подошел ко мне на южном берегу, на виду у обеих армий, и преклонил колени в речной иле. Он положил свой меч у моих ног и положил рядом с ним Корону Зимы — древнюю корону Королей Севера, пришедшую из Эпохи Героев, сдавшуюся целиком там, где любую другую корону в Вестеросе приходилось сжигать или сбивать со лба ее владельца.\n\nОн становится лордом Винтерфелла и хранителем Севера, его земли и права подтверждены, его народ не сожжен. Тридцать тысяч северян пойдут домой к своим женам, потому что их король имел смелость подчиниться. Люди уже называют его Королем, который преклонил колени, и некоторые из его собственных лордов говорят это с презрением.\n\n#bold Им следует произнести это на коленях. Торрхен Старк сегодня спас больше жизней, чем большинство королей за всю жизнь своего правления.#!"
 fab_ac_north.0011.option1:0 "Торрхен Старк предпочел своих людей своей короне."
 fab_ac_north.0012:0 "Триумф Брэндона Сноу"
 fab_ac_north.0012.desc:0 "Крик вырывает меня из сна еще до того, как зазвучат рожки. За пределами гостиницы люди бегут от горы крыльев и крови. [global_var:fab_north_slain_dragon.GetName] лежит мёртвый на берегу реки, белое чардрево древко зарыто в одном большом глазу.\n\nБрэндон Сноу пересек Трезубец под луной, прошел мимо моих часовых и сделал то, что каждый король Вестероса считал невозможным. Один из трех драконов, благодаря которым я одержал победу, никогда больше не полетит. По ту сторону воды северяне выкрикивают его имя, полагая, что заклятие Валирии разрушено.\n\nОстались два дракона, и двух драконов достаточно, чтобы растопить снег от Рва Кейлин до Стены. Дом Старков выбрал кровь, когда я предложил колено. Я отвечу словами моего дома."
 fab_ac_north.0012.option1:0 "Остаются два дракона. Север заплатит огнем и кровью."
 fab_ac_north.0013:0 "Безумие Брэндона Сноу"
 fab_ac_north.0013.desc:0 "Тревогу поднимают в самый темный час. Брэндон Сноу пересек реку с луком из чардрева и прокрался среди драконов, намереваясь вонзить стрелу в спящий глаз. Он подходит достаточно близко, чтобы разбудить одного. Вот и все.\n\nПламя Дракона превращает ночь в день. К рассвету обгоревший лук ублюдка висит перед моим шатером, и все три дракона уже в воздухе. Торрхен потратил своего самого смелого брата и не получил ничего, кроме истории неудач.\n\nНет необходимости делать второй Харренхол Севера. Его король и армия стоят передо мной, и я сокрушу их первым. Винтерфелл еще может быть пощажен, если волк научится послушанию на поле боя."
 fab_ac_north.0013.option1:0 "Разбейте его войско. Пусть на Севере останется чем править."
 fab_ac_north.0014:0 "Кто удержит Север?"
 fab_ac_north.0014.desc:0 "Северная армия разбита, ее король в моей власти. Торрхен Старк стоит на коленях там, где он когда-то собирался дать бой. Перед ним лежит обнаженный лед, а рядом с ним — разбитая корона зимы. Его лорды становятся на колени медленнее. Некоторые вообще на него не смотрят.\n\nСевер слишком огромен, чтобы управлять им из Черноводной. Один дом должен говорить моим голосом за Перешейком, Призывать вассалов на войну в моих войнах и сохранять мир короля в долгие зимы. Дом Старков удерживал эти земли на протяжении тысячелетий, и даже побежденные волки сохраняют давнюю лояльность. И все же Дредфорт силен, и Болтоны давно знают, как управлять боязливыми людьми. Белая Гавань предлагает корабли, серебро и благодарность Дома Мандерли, хотя многие помнят, что его лорды прибыли на север в качестве изгнанников из Простора.\n\nКорона взята. Должность опекуна еще предстоит присвоить."
 fab_ac_north.0014.option1:0 "Старки сохранят Винтерфелл и звание хранителей Севера."
 fab_ac_north.0014.option1.tt:0 "Дом Старков сохраняет власть верховных лордов Севера, подчиняясь Железному трону."
 fab_ac_north.0014.option2:0 "Отдать Север Болтонам. Страх удержит его в повиновении."
 fab_ac_north.0014.option2.tt:0 "Лорд Дредфорта получает титул верховного лорда Севера. Торрхен Старк и северные лорды должны присягнуть дому Болтонов."
 fab_ac_north.0014.option3:0 "Возвысить дом Мандерли. Северу нужны верный флот и серебро."
 fab_ac_north.0014.option3.tt:0 "Лорд Белой Гавани получает титул верховного лорда Севера. Торрхен Старк и северные лорды должны присягнуть дому Мандерли."
 fab_ac_north.0015:0 "Хранитель Севера"
 fab_ac_north.0015.desc:0 "Большой зал Винтерфелла был построен для королей. Дым собирается среди древних стропил, и каменные короли в склепах лежат под нами, но потрепанная корона зимы покоится на плитах под моим сиденьем. Ни одно живое чело больше не наденет его.\n\n[fab_north_warden.GetTitledFirstName] из Дома [fab_north_warden.GetHouse.GetName] выходит вперед под взглядами собравшихся северян. Я не дарую [fab_north_warden.GetHerHim] никакой короны, а только послушание северных лордов и охрану каждой холодной мили от Перешейка до Стены. Не имеет значения, правитель ли это, впервые названный в честь битвы, или наследник, которого война и смерть поставили передо мной. Титул принадлежит [fab_north_warden.GetHerHim], и [fab_north_warden.GetSheHe] должен принести присягу.\n\nОдин за другим северяне следуют за [fab_north_warden.GetHerHim] на колени. Некоторые склоняются к старой верности, некоторые из страха, а некоторые потому, что помнят трех драконов над Трезубцем. Причины у них свои. Их клятва моя.\n\n#bold Короны больше нет. Север остается, и его Страж подчиняется Железному Трону.#!"
 fab_ac_north.0015.option1:0 "Поднимитесь, [fab_north_warden.GetFirstName]. Охраняй Север во имя мое."
 fab_ac_north.0016:0 "Зима преклоняет колено"
 fab_ac_north.0016.desc:0 "Все кончено. Армия Севера разбита, дорога за моей спиной потеряна, и драконы кружат там, где им заблагорассудится. Между завоевателем и Винтерфеллом не осталось ничего, кроме миль.\n\nТаким образом, последний выбор, оставленный Королю Севера, — это способ финала. Я выбираю колено. Не для себя — моя гордость умерла вместе с моей армией — но для каждой северной деревни звери еще не нашли.\n\nВосемь тысяч лет, и все закончится на мне. Я могу только молиться, чтобы дракон был столь же велик в победах, как и ужасен на войне."
 fab_ac_north.0016.desc.submit:0 "Дракон проник в мое царство, но Север еще не сломлен. Я выбираю колено прежде, чем оно должно быть. Не для себя, а для каждой северной деревни, которую звери еще не нашли, и каждого сына, которому незачем умирать, доказывая, что зимой горит огонь.\n\nВосемь тысяч лет правления закончатся моим решением. Корона потеряна, но Север выстоит."
 fab_ac_north.0016.option1:0 "Север выстоит, даже согнувшись."
