l_russian:
 nick_fab_dragonsbane:0 "Погибель Драконов"
 nick_fab_dragonsbane_desc:0 "На затопленном поле, когда буря не давала Мераксес взлететь, [CHARACTER.GetShortUINameNoTooltipNoFormat] повёл сорок всадников в атаку на драконицу и пронзил её горло копьём."
 nick_fab_the_storm_queen:0 "Королева Бури"
 nick_fab_the_storm_queen_desc:0 "Провозглашена королевой на стенах Штормового Предела, в короне погибшего отца, пока внизу стояло войско Ориса, а за заливом — Мераксес."
