l_russian:
 fab_dorne.0001:0 "Тридцать тысяч копий"
 fab_dorne.0001.desc:0 "Дорн ответил на завоевание так же, как Дорн отвечает на все: песком, камнем и терпением.\n\nГоворят, что на Принцевом перевале ждут тридцать тысяч копейщиков, среди них около двух тысяч рыцарей и триста лордов. [fab_reach_lord.GetTitledFirstName] ведет королевскую армию через красные горы, стремясь доказать, что новая роза была посажена не только для изысканного аромата. Орис ведет тысячу отборных рыцарей на Костяной путь, где дорога сужается, и у каждой тени есть тетива.\n\nНад ними всеми летают драконы. Рейнис и Мераксес устремляются к побережью, Висенья наблюдает за перевалами, а я держу центр, а тень Балериона над моими знаменами.\n\n#bold Это не королевское поле и не стена вроде Харренхола. Дорн надо брать дорогой, ну и пройти, и жажду милю.#!"
 fab_dorne.0001.option1:0 "Взять первую милю."
 fab_dorne.0002:0 "Первая кровь"
 fab_dorne.0002.desc:0 "Рейнис нанесла первый удар по Дорну.\n\nВ дыму и ужасе Мераксес обрушилась на Дощатый Город, и шестовые лодки сирот горели на Зеленокровной, словно праздничные фонари. Лимонная Роща встретила нас пустыми залами. Пятнистый Лес и Вонючая Вода открыли ворота, а за ними сестра нашла лишь старух, детей и слуг, которые ничего не видели, ничего не слышали и не могли назвать ни одного человека, достойного драконьего пламени.\n\nОна пролетела вдоль всей Зеленокровной и обратно в поисках войска. Его нет. Теневой город под Солнечным Копьём наполовину опустел, а старую принцессу нигде не найти. Куда бы ни ушли дорнийские лорды, они забрали с собой все копья страны, оставив нам своих бабушек.\n\n#bold Драконье пламя нашло города, башни и пустые покои. Самого Дорна оно пока не нашло.#!"
 fab_dorne.0002.option1:0 "Продолжать поиски."
 fab_dorne.0003:0 "Песок и тишина"
 fab_dorne.0003.desc:0 "Чем глубже мы продвигаемся, тем меньше Дорна остается перед нами.\n\nПоля — почерневшая стерня. Зернохранилища стоят открытые и пустые. Уэллс, который должен был спасти людей от солнца, вонял гнилью, ядом и мертвецами, опущенными ночью. Сторожевые башни стоят заброшенными. Однажды наши разведчики обнаружили, что дорога завалена остриженными овечьими тушами, сложенными по плечо и дозревающими на жаре до тех пор, пока ни одна лошадь не приблизится к ним.\n\nНи одно знамя не предложило битву, и ни один лорд не вышел на защиту камней, носящих его имя. Дорнийцы дают о себе знать в каждой стреле, летящей со скал, в каждом закрытом окне, на каждой пустой дороге, где наша армия ест пыль и не видит врага, на которого стоит напасть.\n\n#bold Харрен спрятался за камнем. Дорнийцы создали крепость отсутствия, жары и песка.#!"
 fab_dorne.0003.option1:0 "В этой войне главный враг — жажда."
 fab_dorne.0004:0 "Войско разделяется"
 fab_dorne.0004.desc:0 "Одна дорога не выиграет эту войну.\n\nКаждый замок, который мы захватываем, стоит пустым. Каждая долина поглощает всадников целиком. Каждый ворон, которого я отправляю на юг, возвращается с одними лишь моими вопросами. Дорн не может быть вовлечен в битву на одном фронте по самой простой причине: Дорн вовсе не означает, что его будут сражаться на одном фронте.\n\nИтак, армия разделилась. [fab_reach_lord.GetTitledFirstName] направляет силы Простора в сторону Адской Холты, где, как говорят, Уллеры держат своих скорпионов и ножей в равном количестве. Я еду по восточной дороге в сторону Поднебесья и перевала Фаулера. Орис продвигается вверх по Костяному пути, упорно, как всегда, не желая позволить красному камню и стрелам трусов остановить правую руку короля.\n\nЕсли Дорн не устоит на месте и не будет завоеван, мы возьмем его по частям.\n\n#bold Где-то в этих песках сидит слепая старуха, выбравшая эту войну. Одна из моих армий найдет ее.#!"
 fab_dorne.0004.option1:0 "Разделить войско. Взять замки."
 fab_dorne.0005:0 "Сухой марш"
 fab_dorne.0005.desc:0 "[fab_reach_lord.GetTitledFirstName] достиг Пекла с армией, которой не позавидует ни один певец.\n\nЧетверть людей умерла от жажды, лихорадки, сломанных ног и стрел, выпущенных из мест, куда ни один всадник не смог бы добраться вовремя. Почти все лошади мертвы. Каждый водопой был загрязнен; каждый оазис был отравлен еще до того, как авангард приблизился к нему. Мужчины, которые в Хайгардене носили зеленое, теперь шатаются под коричневыми плащами, застывшими от соли и пыли.\n\nПекло подарил Простору стены, солнце и тишину. К моменту появления знамен Тиреллов его залы опустели, и [fab_reach_lord.GetSheHe] остался считать мертвых перед замком, который отказался даже от достоинства сдаться.\n\n#bold Дракон может летать над пустыней. Армия должна пересечь его.#!"
 fab_dorne.0005.option1:0 "Пустыня обескровливает нас, не обнажая клинка."
 fab_dorne.0006:0 "Поднебесье и Айронвуд"
 fab_dorne.0006.desc:0 "Поднебесье наше — в некотором роде. Одни клянутся, что мы взяли его штурмом; другие говорят, что ворота были открыты ещё до того, как первая лестница коснулась камня. В Дорне обе истории могут оказаться правдой, а при взятии пустых замков люди гибнут ничуть не реже.\n\nАйронвуд держался дольше, хотя и не с той силой, которую некогда сулило его имя. Со стен смотрели старики, мальчики и женщины, и, когда бой закончился, среди павших едва нашёлся хоть один мужчина воинского возраста. Тор сдал управляющий: лорд Джордейн недавно умер, а ни один наследник не пожелал умирать за камни, которыми уже пожертвовала его принцесса.\n\nЯ оставляю гарнизоны в захваченных замках. Над башнями поднимаются мои знамёна, в залах сидят мои кастеляны, и каждую ночь часовые смотрят на дороги, по которым никто не приходит. Замки принадлежат мне. Дорн — где-то в другом месте.\n\n#bold Мы отвоёвываем замки у призраков.#!"
 fab_dorne.0006.option1:0 "Оставить гарнизоны в каждом замке. Дорн должен где-то скрываться."
 fab_dorne.0007:0 "Шут Призрачного Холма"
 fab_dorne.0007.desc:0 "На Призрачный Холм Дом Толанд посылает защитника с ярким оружием и еще более яркой дерзостью. Он называет себя мечом своего господина, щитом своего дома, гневом Дорна в теле одного человека и бросает вызов дракону встретиться с ним на земле.\n\nЗа его спиной наблюдает замок. Мои собственные капитаны бормочут, что ни одному королю не придется отвечать на такой театральный поступок. Их осторожность имеет смысл, но Чёрное Пламя висит у меня на бедре, и каждый дорнийский взгляд в холмах ждет, нужен ли Эйгону Таргариену дракон, чтобы убить одного хвастливого человека.\n\n#bold Тогда певцы устроят дуэль.#!"
 fab_dorne.0007.option1:0 "Выходи. Посмотрим на этого чемпиона."
 fab_dorne.0008:0 "Костяной Путь"
 fab_dorne.0008.desc:0 "Ворон из Костяного Пути написан дрожащей рукой.\n\nОрис шел там, где горы перекрывают дорогу к ране. Сначала полетели камни, затем сверху стрелы, затем копья. Людей, выживших при дневном свете, убивали в темноте. К утру путь был заблокирован спереди и сзади, и дорнийцы приходили со всех выступов, где ни одна армия не могла бы устоять.\n\nТысяча рыцарей вошли в Костяной путь. Большинство из них мертвы. Дюжина лордов взята. Если выжившие говорят правду, сам Орис исчез в руках Виля Вила.\n\nЧеловек, который был моим щитом и сильной правой рукой, теперь находится где-то в красных горах, вне выкупа, угроз и драконьего огня.\n\n#bold Дорн пролил кровь из короны.#!"
 fab_dorne.0008.option1:0 "Найти, куда они его увели."
 fab_dorne.0009:0 "Одно королевство, целое и неделимое"
 fab_dorne.0009.desc:0 "В Солнечном Копье, под расписными копьями и старыми знаменами линии Нимерии, Дорн объявлен взятым.\n\nНа церемонии залы были полны: коронландцы, ричмены, штурмлендеры, армейские капитаны и те дорнийские сановники, которых можно было найти или заставить выступить свидетелями. Солнце Мартелла опустилось. Дракон был поднят. [fab_sunspear_castellan.GetTitledFirstName] назначен кастеляном Солнечного Копья и Хранителем Песков, которому поручено удерживать то, что завоевано драконами и копьями.\n\nМужчины приветствовали, потому что мужчины должны радоваться, когда король пересек пустыню и назвал это победой.\n\nГород теней наблюдал за происходящим из окон, закрытых ставнями, а песок за стенами хранил тишину.\n\n#bold Дорн мой. Теперь он должен научиться оставаться моим.#!"
 fab_dorne.0009.option1:0 "Королевство едино."
 fab_dorne.0010:0 "Домой через перевал"
 fab_dorne.0010.desc:0 "Я вернулся домой через Принцевый перевал, и королевство под названием Дорн завоевано.\n\n[fab_reach_lord.GetTitledFirstName] остается в Пекле с остатками армии [fab_reach_lord.GetHerHis], и буквы с каждым разом становятся короче. Мужчин тошнит от рыбы, выловленной из сернистой Серы, и они проклинают каждую чашку, прежде чем осмеливаются ее выпить. Патрули, отправленные в сторону Песчаника и Вейта, не возвращаются побежденными — они не возвращаются вообще, лошади, кольчуга и люди вместе. Всадники Коргайлов выскакивают из полуденного сияния и исчезают прежде, чем успевает начаться погоня.\n\nВ столице празднуют семь королевств под одним троном, и певцы уже спорят о том, кто первым перейдет пустыню. В Дорне люди продолжают умирать на дорогах, которые мы уже завоевали. Я оставил [fab_sunspear_castellan.GetTitledFirstName] дворец, [fab_reach_lord.GetTitledFirstName] печь, и им обоим моя удача.\n\n#bold Карта чище войны.#!"
 fab_dorne.0010.option1:0 "Пусть [fab_sunspear_castellan.GetTitledFirstName] держит Солнечное Копьё. Пусть [fab_reach_lord.GetTitledFirstName] держит марки."
 fab_dorne.0011:0 "Дорн восстаёт"
 fab_dorne.0011.desc:0 "Дорн поднялся позади нас, как огонь под пеплом.\n\nПоднебесье, Айронвуд, Тор и Призрачный холм снова взяты, а их гарнизоны преданы мечу. Кастелянов вытаскивают из залов и башен, пытают, ломают и выставляют напоказ каждому дорнийскому ребенку, чтобы он помнил. Город теней хлынул обратно в Солнечное Копье с ножами под плащами и камнями в каждой руке.\n\n[fab_sunspear_castellan.GetTitledFirstName], мой Страж Песков, был протащен через Башню Копий людьми, которые поклонялись ему всего несколько дней назад. Они привели его к Мерии Мартелл в верхнюю палату, где старая принцесса сидела под солнцем и копьем, слепыми глазами повернувшись в сторону его голоса. Он просил выкупа. Мерия спросила, выкупил ли Эйгон мертвецов, оставшихся на Принцевом перевале.\n\nПо ее команде окна были открыты. Моего кастеляна протащили по плитке, с трудом подняли на подоконник и швырнули над городом, которым он был призван править. Толпа внизу аплодировала, когда он ударил по камням.\n\nВ сумерках солнце Мартелла снова пролетело над Солнечным Копьем, и каждое дорнийское горло в городе теней услышало звук свободы.\n\n#bold Мы завоевали пустую землю. Дорнийцы ждали, пока нам придется его удерживать.#!"
 fab_dorne.0011.option1:0 "Эта война не окончена."
 fab_dorne.0012:0 "Исчезнувший в песках"
 fab_dorne.0012.desc:0 "[fab_reach_lord.GetTitledFirstName] двинулся из Пекла к Вейту и Солнечному Копью, и ни одно определенное слово не последовало за армией на север.\n\nРазведчики нашли сначала мертвых лошадей, затем сломанные копья, а затем холодный костер под скалой, где ни у одной армии не было причин разбивать лагерь. Пустыня возвращает остатки, когда хочет быть жестокой. Он не вернул ни лорда Хайгардена, ни армию, которая последовала за [fab_reach_lord.GetHerHim] в пески.\n\nУ Хайгардена будет новый лорд, а у Простора появится рана, которую не сможет объяснить ни один ворон. Дорн проглотил Верховного Лорда целиком.\n\n#bold Некоторые замки можно захватить. Некоторые пустыни берут только.#!"
 fab_dorne.0012.option1:0 "Роза исчезла в песке."
 fab_dorne.0013:0 "Непокорённый"
 fab_dorne.0013.desc:0 "Совет требует ответа.\n\nВисенья сожжет все дороги от Принцевого перевала до Зеленокровной. Повелители бури злятся на Ориса и на руки, которые Дорн еще может отобрать у него. Ричмены смотрят на юг со страхом и стыдом в равной степени, задаваясь вопросом, сколько еще зеленых сыновей поглотят пески, прежде чем Мартеллы признают, что они побеждены.\n\nДорн поставил вопрос более сложный, чем любая осада: что значит поражение, когда замки рушатся и возрождаются вновь, когда лорды исчезают и продолжают командовать, когда старая принцесса может сбросить моего кастеляна с башни, в то время как мои знамена едва вернулись домой?\n\nЯ могу высвободить огонь и кровь, пока пустыни не засияют красным, или я могу позволить старухе сохранить свои пески и объявить войну оконченной, прежде чем это потребует чего-то большего, чем гордость.\n\n#bold Дорн остается непокоренным. Выбор в том, смогу ли я это вынести. #!"
 fab_dorne.0013.option1:0 "Нет. Пламя и кровь, пока Дорн не запомнит."
 fab_dorne.0013.option3:0 "Не сейчас. Но день Дорна настанет."
 fab_dorne.0013.option2:0 "Пусть Дорн сохранит свои пески."
 fab_dorne.0015:0 "Шут Призрачного Холма"
 fab_dorne.0015.desc:0 "Чёрное Пламя быстро отвечает на насмешку. Защитник замка выступает в сияющих доспехах и падает в пыль прежде, чем успевает отзвучать его вызов. Чтобы убить его, не потребовалось искусного удара. Он сражался словно человек, никогда не державший меча за пределами представления скоморохов, — и, как оказалось, так оно и было.\n\nСмех за стенами Толандов раздался лишь после его падения. Это был не рыцарь, а шут лорда Толанда, наряженный в доспехи господина и посланный кривляться и умирать, пока обитатели замка ускользали за холмом.\n\nКогда наши люди взломали ворота, Призрачный Холм опустел: ни воинов, ни припасов, ни знамён, кладовые выметены, не осталось ни одного Толанда, которого можно было бы повесить. Лишь мёртвый шут в чужих доспехах да дорнийский смех, далеко разносившийся над камнями.\n\n#bold Они жертвуют шутами вместо рыцарей и называют это победой. Иногда я почти готов с ними согласиться.#!"
 fab_dorne.0015.option1:0 "Жестокая насмешка."
 fab_dorne.0017:0 "Война ножей"
 fab_dorne.0017.desc:0 "Во второй войне от знамен мало пользы.\n\nВ этот раз не будет ни завоеванных полей, ни завоевания тронов, ни утра, когда две армии встанут в долине и решат вопрос, как на Огненном поле. Дорнийские всадники врезаются в обозные поезда и исчезают в оврагах, которых нет ни на одной карте. Колодцы заполнены падалью. Моих посланников находят висящими на сухих деревьях с привязанными к запястьям королевскими печатями. Замки днем ​​преклоняют колени, а ночью открывают задние ворота, и тот же господин, который присягает мне в верности в полдень, в сумерках отправляет мои патрульные маршруты на юг.\n\nЭто будут набеги и репрессии, убийства и маленькие перемирия, которые приходится нарушать — долгий красный скрежет ножей, с дюжиной маленьких миров и никакого мира вообще.\n\nВисенья говорит, что страх должен быть больше, чем пустыня. Я отвечаю ей драконами, драпировками и золотом за каждого человека, который продаст нам имя.\n\n#bold Дорн выбрал ножи. Мы ответим огнем.#!"
 fab_dorne.0017.option1:0 "Пусть узнают, чего стоит огонь."
 fab_dorne.0018:0 "Выкуп на вес человека"
 fab_dorne.0018.desc:0 "Повозки с выкупом ехали на юг под охраной, их колеса глубоко утопили в золоте.\n\nУилсы без стыда назвали свою цену: вес лорда Ориса Баратеона в золоте и вес каждого штурмлендца, взятого с ним. Монета за монетой, слиток за слитком, выкуп подсчитывался при дорнийских свидетелях. Я не оставлю ни одного повелителя бури гнить из-за отсутствия оплаты и не дам никому повода говорить, что Железный Трон отказался от своего собственного.\n\nКак только золото стало принадлежать им, Уилсы открыли двери тюрьмы.\n\nОрис побледнел, похудел и молчал. За ним шли его знаменосцы, каждый из которых смотрел на перевязанные руины, где была его рука с мечом. Дорнийцы взяли выкуп, а затем забрали и руки, так что никто из них больше никогда не поднимет оружие против Дорна.\n\nКогда Орис встал на колени, он сделал это медленно. Кровь пропитала белье на его запястье. Он не стал бы на это смотреть. Вместо этого он посмотрел на меня, и в зале стало достаточно тихо, чтобы услышать шуршание мух над бинтами.\n\n#bold Дорн продал мне моего брата обратно на вес, оставив себе ту часть его тела, в которой был меч.#!"
 fab_dorne.0018.option1:0 "Заплатить и запомнить."
 fab_dorne.0019:0 "Месть короля"
 fab_dorne.0019.desc:0 "Костяной путь светился красным под Балерионом.\n\nГорные крепости дома Уилов цеплялись за камень, словно когти: башни над перевалом, залы, высеченные в скале, козьи тропы, норы для убийств и черные входы пещер, где могли исчезнуть целые семьи. Балерион на все это ответил огнем.\n\nПервыми треснули внешние стены. Ворота провисли и залились расплавленным железом. Крыши лопнули внутрь. Склады, псарни, конюшни, веревочные мосты, сторожевые вышки, расписные щиты и маленькая септа под скалой горели, пока дым не покатился через перевал, как вторая ночь.\n\nУилы слишком хорошо знали свою гору, чтобы умереть в залах наверху. Они бежали вниз, в пещеры и туннели, а замок над их головами превратился в руины. Мужчины, которых вытащили со дворов, выкрикивали имя своего господина и умирали, так и не сказав, куда он делся.\n\nК сумеркам над землей не осталось ни одной крепости. Горячие камни, мертвые лошади и почерневшие знамена трещали на ветру Балериона.\n\n#bold Я сжег Уила дотла. Дорн спрятался под обломками и выжил.#!"
 fab_dorne.0019.option1:0 "Продолжать жечь."
 fab_dorne.0020:0 "Мыс Гнева и Старомест"
 fab_dorne.0020.desc:0 "Война перешла свои границы.\n\nДорнийский капитан, называющий себя пиратским королем Ступеньков, напал на мыс Гнева с налетчиками и наемниками, разграбив полдюжины городов под носом повелителей бури — а за его спиной горит сам дождевой лес. Ночью через горы пришли охотники-охотники и захватили Ночную Песнь, увезя Каронов в Дорн в качестве заложников и оставив замок в дыму. Дальше на запад Джоффри Дейн подъехал к самым воротам Староместа и поджег факелом каждое поле, мельницу и деревню в пределах видимости Хайтауэра. Сир Гармон Хайтауэр повел против него рыцарей и был убит; его родственники не забрали себе ничего, кроме пепла и соломы.\n\nВисенья уже принесла ответ на юг — Лимонный лес, Призрачный холм и Тор сгорели за один оборот луны. И все равно набеги случаются. Карта завоевания не может удерживать такую ​​форму. Дорн истекает кровью, как яд в воде.\n\n#bold Они не могут победить драконов в небе, поэтому каждый берег и каждую дорогу они превращают в рану.#!"
 fab_dorne.0020.option1:0 "На каждую рану будет ответ."
 fab_dorne.0021:0 "Скорпион у Пекла"
 fab_dorne.0021.desc:0 "Ворон с юга несет самое худшее слово о войне.\n\nРейнис отправилась в Пекло, как я ей велел, и пошла так, как всегда — низко и неторопливо, с чистого неба, уверенная, что ничто внизу не сможет до нее добраться. Никогда ничего не было.\n\nЧто-то дошло до нее. Скорпион, восседавший на самой высокой башне, продолжал стрелять до тех пор, пока серебряная королева не заполнила небо над ним, а железный болт не попал Мераксес в глаз.\n\nДракон закричал так, что люди на стенах уронили копья и упали на колени, заткнув уши руками. Ее крылья взмахнули один раз, второй раз и потерпели неудачу. Мераксес обрушилась на Пекло, как гнев каждого бога одновременно, превратив башню, которая убила ее, и половину навесной стены в руины под собой, а пожары, которые она устроила, стали пожарами, которые похоронили ее.\n\n#bold И после этого небо над Пеклом оставалось пустым.#!"
 fab_dorne.0021.option1:0 "Что с Рейнис?"
 fab_dorne.0022:0 "Гнев дракона"
 fab_dorne.0022.desc:0 "Мы были детьми в этом зале, мы трое.\n\nРейнис танцевала вдоль этой галереи, а септы ругали ее за хрипоту. За ужином она пела матросские песни — те, стихи которых не должна знать ни одна королева, — пока даже Висенья не засмеялась против ее воли. В этом замке нет камня, внутри которого не звучал бы ее голос. Я продолжаю ловить себя на том, что прислушиваюсь к ее шагам на лестнице. Потом я вспоминаю. Воспоминание — это клинок, каждый раз вытащенный заново.\n\nНет тела. Это та часть, которую я не могу нести. Нечего сжигать, нечего класть в сентябрь, нечего пепла разбрасывать по ветру. Только тишина с юга — и под тишиной шепот, который я запретил и не могу перестать слышать. Что она не умерла, когда пал Мераксес. Что Уллеры вытащили ее из места крушения. Что где-то под Дорнийским камнем в темноте жила моя младшая сестра и звала нас, но мы не пришли.\n\nВисенья не плакала там, где ее мог видеть мужчина. Сегодня вечером в этом холодном зале она плачет — стоит прямо, как копье, с открытыми глазами, как будто горе — еще один враг, перед которым она не встанет на колени. Я смотрю на Расписной стол, на маленькие резные горы Дорна, созданные нашими предками, и мое лицо становится мокрым, прежде чем я это осознаю.\n\nОна была лучшей из нас. Самый добрый. Тот, кого люди любили, хотя их этому не учили. Теперь Дорн без нее узнает, что такое ее брат и сестра.\n\n#bold Час горя настал. Тогда у драконов будет свое.#!"
 fab_dorne.0022.option1:0 "Пламя и кровь, пока пески не вспомнят её."
 fab_dorne.0023:0 "Рынок ножей"
 fab_dorne.0023.desc:0 "Золото движется на юг быстрее, чем армии.\n\nЯ назначил цену за Дорн. Для Фаулера это на вес золота. Выкуп за замок за Вейта и Толанда. А для Уллера из Пекла, под стены которого попала моя сестра, этого достаточно, чтобы купить флот. Вороны разносят мои обещания в каждый двор, таверну и контору от Стены до Вольных городов. Некоторые мужчины убивают ради верности. Гораздо больше людей убьют за то, что я предлагаю.\n\nПески уже начали платить. Четыре лорда Уллера умерли в Пекле с тех пор, как впервые была объявлена ​​награда — один за другим, от ножа, падения и отравленной чаши — хотя из людей, выполнявших работу, только двое прожили достаточно долго, чтобы получить награду.\n\nИ Дорн, будучи Дорном, открыл свой кошелек. Лорд Коннингтон получил стрелу в горло во время охоты в собственном лесу. Вся семья лорда Мертинса умерла за столом с отравленным вином. Лорда Фелла нашли задушенным в борделе Королевской Гавани. В этой войне не осталось полей сражений. Там есть цены.\n\n#bold Каждая тень в Дорне будет задаваться вопросом, чего она стоит. Мой уже делает.#!"
 fab_dorne.0023.option1:0 "Открыть казну."
 fab_dorne.0024:0 "Уайл на свадьбе"
 fab_dorne.0024.desc:0 "Певцы еще исполняли первый припев, когда двери заперли.\n\nКровь Кафферена и Дубового сердца встретилась под гирляндами и светом свечей. Дети гонялись друг за другом под скамейками. Жених стоял, улыбаясь, и пил, и в этот момент появились люди Уилов. С галереи полетели арбалеты. Ножи вылезли из-под сервировочных скатертей. Зал наполнился криками так быстро, что музыка не успела остановиться.\n\nЛорды умерли с кубками в руках. Рыцари были убиты безоружными. Жениха кастрировали на глазах у собственных гостей и оставили давиться вином и кровью. Невесту и ее женщин утащили с пиршества, а за ними горели столы.\n\nК утру в свадебном зале воцарилась тишина, если не считать мух.\n\n#bold Есть преступления, о которых стыдно говорить даже на войне. #!"
 fab_dorne.0024.option1:0 "Запомнить имя Уайл."
 fab_dorne.0025:0 "Жёлтая Жаба умирает в постели"
 fab_dorne.0025.desc:0 "Мерия Мартелл мертва.\n\nОгонь не вытащил ее из седла, и золото не смогло купить нож, способный прикончить ее. Старая принцесса умерла в своей постели с закрытыми слепыми глазами, ее пески все еще были непокорены, и ее люди все еще называли ее непокоренной. После всех моих армий, клятв и драконьего огня она приняла тот конец, который выбрала.\n\nЕе сын Нимор принимает власть в Дорне: старый, осторожный, окруженный страной, простирающейся от Красных гор до устья Зеленой Крови. Все еще дорнийская битва.\n\n#bold Даже смерть не принесла мне победу, в которой отказалась Мерия.#!"
 fab_dorne.0025.option1:0 "Пусть сын ответит."
 fab_dorne.0026:0 "Принцесса и череп"
 fab_dorne.0026.desc:0 "Дерия Мартелл прибыла в Королевскую Гавань.\n\nНимор отправляет свою дочь с эскортом, посланником мира в шелковых и солнечных цветах, и перед ней люди несут череп Мераксес. Белая кость. Почерневшие руины. Пустая розетка, куда вошел скорпион. Суд бормочет убийство.\n\nОрис стоит среди повелителей бури, прижав рукав там, где раньше был его меч. «Отправьте ее обратно к отцу без руки», — говорит он не громко, не дико, но с холодной уверенностью человека, который заплатил за милосердие и узнал за него дорнийскую цену.\n\nВисенья выглядит так, словно готова убить девушку, стоящую на коленях.\n\nДерия не вздрагивает. Она предлагает мир без подчинения и запечатанное письмо от отца.\n\nНа мгновение я вижу только впадину, где когда-то горел глаз Мераксес.\n\n#bold Дорн привел моих мертвецов в мой зал, и каждая живая рана требует ответа. #!"
 fab_dorne.0026.option1:0 "Оставьте нас."
 fab_dorne.0027:0 "Королевский мир"
 fab_dorne.0027.desc:0 "Суд ждет, когда я вернусь.\n\nДерия Мартелл стоит под Железным Троном, за ее спиной стоит череп Мераксес, и вся ярость королевства направлена ​​на ее горло. Висенья ничего не говорит. Орис говорит слишком много с одним пустым рукавом. Повелители бури помнят своих искалеченных родственников. Коронованные лорды помнят Рейнис. Каждый мужчина в зале ожидает пожара, тюремного заключения или какой-то окончательной расплаты за долгие годы неповиновения.\n\nЯ даю им покой.\n\nДерия покидает Королевскую Гавань обеими руками. Посольство не подвергается репрессиям, ни один дракон не улетает на юг, и за кровь Мартелла не выплачивается награда. Дорн останется за пределами моего королевства, непокоренный и непокоренный, и договор будет скреплен моей печатью еще до того, как солнце взойдет высоко.\n\nПосле того, как я отказываюсь от первого вопроса, суд решает оставить письмо Нимора безымянным.\n\n#bold В королевстве осталось шесть королевств и рана.#!"
 fab_dorne.0027.option1:0 "Пусть война закончится."
 fab_dorne.0028:0 "Королева не вернулась"
 fab_dorne.0028.desc:0 "Каждое сообщение о кончине Рейнис противоречит последнему.\n\nНекоторые клянутся, что она упала с места и ударилась о камни прежде, чем Мераксес разрушил двор. Другие утверждают, что дракон раздавил ее сломанным крылом и горящей чешуей. В нескольких более уродливых сообщениях говорится, что она выжила после падения, что люди Уллера нашли ее среди обломков и заставляли ее дышать в муках, пока вокруг них горел замок.\n\nНи истина, ни тело не пришли на север. На их месте по пескам воцарилась тишина, достаточно широкая, чтобы унести все слухи, и достаточно жестокая, чтобы сделать каждый из них возможным.\n\n#bold Дорн убил дракона и забрал королеву.#!"
 fab_dorne.0028.option1:0 "Закончить эту войну и принести мне огонь."
 fab_dorne.0029:0 "Гнев дракона: пепел"
 fab_dorne.0029.desc:0 "Тень Балериона пересекла выбранное дорнийское место еще до того, как солнце достигло полудня.\n\nЗамок внизу запер свои ворота и спрятал знамена, как будто дерево и тишина могли сделать камень невинным. Я не вызывал повестку. Рейнис в Пекле ничего не дали. Черные крылья заслоняли двор, башни, колодцы и маленькую септицу, куда бежали молиться слуги. Черный Ужас открыл пасть, и камни узнали, как звучит горе дракона.\n\nКогда огонь утих, крыши уже не было. Мужчины вылезали из подвалов с дымящимися волосами. Вороны поднимались черными на фоне черного дыма, а затем снова падали, когда их охватывал жар.\n\n#bold Одна крепость сгорела. У Дорна их много.#!"
 fab_dorne.0029.option1:0 "Отметить и выбрать другую."
 fab_dorne.0030:0 "Гнев дракона: Вхагар спускается с небес"
 fab_dorne.0030.desc:0 "Висенья вернулась с копотью на доспехах и без мягкости на лице.\n\nОна сказала, что лорд наблюдал со своих стен, пока Вхагар не сложила крылья и не обрушилась на замок, как приговор. Скорпионы сгорели, прежде чем освободиться. Сторожка раскололась. Каждое зернохранилище загорелось таким ярким огнем, что всадники видели его за три долины.\n\nДорнийцы могут восстановиться; упрямство всегда обходилось дешевле подчинения. Когда камни снова поднимутся, Вхагар сможет преподать им тот же урок, но с меньшим терпением.\n\n#bold Один раз — предупреждение. Дважды — память. Трижды закон.#!"
 fab_dorne.0030.option1:0 "Пусть Висенья выберет следующую дорогу."
 fab_dorne.0031:0 "Гнев дракона: Нет безопасных стен"
 fab_dorne.0031.desc:0 "Последний дорнийский лорд опустошил залы еще до нашего прибытия.\n\nОн может услышать историю от тех, кто бежал. Балерион все равно сжег седло: конюшни, оружейную, резные двери, расписные щиты, окна детской и лежбище, где испуганные птицы до крови бились о свои клетки. Огню не нужно присутствие господина, чтобы сделать его беднее.\n\nК сумеркам замок превратился в красный панцирь, и в каждой деревне на многие мили чувствовался запах горячей извести, вареного зерна и старой гордости, превращающейся в дым.\n\n#bold Дорн скрывает своих лордов. Он не может скрыть свои дома.#!"
 fab_dorne.0031.option1:0 "Выбрать следующий замок."
 fab_dorne.0032:0 "Письмо Нимора"
 fab_dorne.0032.desc:0 "Я прочитал письмо на Железном Троне.\n\nМейстеры не записывают ни одного слова, а лорды под ступенями стоят слишком далеко, чтобы увидеть руку. Мужчины потом скажут, что мой кулак слишком сильно сжал лезвия и что, когда я поднимался, с моей ладони на ступеньки капала кровь.\n\nНимор, возможно, писал как один отец другому. Возможно, он назвал имена всех мертвых лордов, рыцарей, детей и королев, которых поглотила война. Возможно, он утверждал, что Рейнис жила после Пекла, а Дорн обладал силой положить конец ее мучениям. Возможно, он пообещал потратить каждую монету в песках на ножи из Браавоса и назвал в качестве цены моего сына.\n\nПисьмо сгорает прежде, чем кто-либо успевает его прочитать, и дым уносит единственную достоверную истину в зале.\n\n#bold Некоторые слова острее драконьей кости.#!"
 fab_dorne.0032.option1:0 "Балерион. Сейчас."
 fab_dorne.0033:0 "Ночной полёт на Драконий Камень"
 fab_dorne.0033.desc:0 "Балерион карабкается во тьму, а Королевская Гавань сжимается под нами.\n\nПисьмо пепельное. Моя рука все еще кровоточит. Ветер подхватывает дым из моего плаща и уносит его над заливом Черноводная. Драконий Камень возвышается над морем, черный и знакомый, старое сердце моего дома. Я иду туда без суда, совета или певцов, чтобы сделать выбор благородным постфактум.\n\nТам меня ждут камень, ночь и вопрос Нимора. К рассвету королевство получит ответ.\n\n#bold Дракон летит на север, и Дорн проживает еще одну ночь.#!"
 fab_dorne.0033.option1:0 "Вернуться на рассвете."
 fab_dorne.0035:0 "Культя короля"
 fab_dorne.0035.desc:0 "Орис пришел на совет, прижав правый рукав к груди.\n\nСуд постарался оставить рану безымянной, и молчание превратило его в зрелище. Лорды, смеявшиеся вместе с ним на пирах, пристально смотрели в свои чашки. Просители опустили глаза. Кресло рядом со мной, кресло Десницы, казалось, было создано для другого человека: повелителя бури, который сломал Аргилак под черным дождем, который проезжал ради меня по трудным дорогам, который превратил мои приказы в войну.\n\nОрис постоял перед ним какое-то время, а затем отодвинул стул.\n\n«Десница короля должна иметь руку», — сказал он. Его голос был ровным, как старое железо. «Я не потерплю, чтобы люди говорили о Королевском пне».\n\nОн вернется в Штормовые земли с Уилом, написанным в нем глубже, чем любой шрам. Исцеление — вот слово, которое использовали мейстеры; «Месть» — вот слово, которое Орис принес домой.\n\n#bold Моя Первая Рука оставляет мне на одну руку меньше в мире и еще одну клятву мести.#!"
 fab_dorne.0035.option1:0 "Ступай домой, брат."
 fab_dorne.0036:0 "Нож в темноте"
 fab_dorne.0036.desc:0 "Эйгонова Крепость — это лабиринт необработанной древесины и света факелов, и я ходил по его переходам тысячу ночей, ни разу не вспомнив о них.\n\nСегодня вечером там, где коридор поворачивает к моим покоям, ждет мужчина в ливрее моей кухни. Свечи погасли. Я слышу его раньше, чем вижу, и последним вижу нож.\n\nОн никогда не достигает меня. Гвардеец — я не знаю его имени, и мне этого стыдно — встает между нами плечом и проводит клинком по ребрам, а второй охранник вскрывает горло мужчине, прислонившись к стене. Все закончилось прежде, чем я успел перевести дух, чтобы закричать.\n\nОни раздевают тело и находят песок в пятках его ботинок и кошелек с дорнийским золотом, зашитый в рубашку. Я назначил цену лордам Дорна, и Дорн ответил тем же. Разница в том, что им повезет только один раз.\n\nГвардеец, проливший за меня кровь, получит земли, рыцарское звание, все, что он попросит. У мертвеца будет яма в земле. И у меня будут новые замки, новые дегустаторы и долгая прогулка до кровати."
 fab_dorne.0036.option1:0 "Удвоить стражу. Наградить того человека."
 fab_dorne.0037:0 "Чёрное Пламя отвечает"
 fab_dorne.0037.desc:0 "Четыре месяца двойной стражи, и это сделало меня беспечным в одном месте, где ни один король не думает быть бдительным: в его собственной конюшне, на рассвете, среди слуг, которых он видит каждый день.\n\nЖених, держащий тележку с кормом, не мой жених. Я знаю это так, как фехтовальщик разбирается в вещах: в руках, а не в голове — он неправильно двигается, неправильно смотрит, а когда я поворачиваюсь, он уже находится в пределах досягаемости любого крика о помощи, из его рукава выскальзывает изогнутый дорнийский нож.\n\nНо я носил Чёрного Пламени каждый час бодрствования с той ночи в коридоре. Висенья просила меня об этом, и я закончил с ней спорить.\n\nВалирийская сталь вылетает из ножен прежде, чем его нож вылетает из рукава. Он быстрый. Лезвие быстрее. Я оставляю его на соломе и стою один в сером свете, тяжело дыша, слушая, как прибегают стражники — снова слишком поздно — и впервые думаю, что моя сестра, возможно, права не только в отношении меча.\n\nУже дважды. Третий нож уже в дороге. Каждый мужчина в этом замке знает это, и я тоже."
 fab_dorne.0037.option1:0 "Я убил его сам. На этот раз."
 fab_dorne.0038:0 "Ножи на улицах"
 fab_dorne.0038.desc:0 "Король, который прячется в своем форте, не король, поэтому я еду вниз в город, выросший вокруг него, — и Висенья едет со мной, в шелке поверх кольчуги, как она всегда теперь бывает.\n\nЭто происходит среди рыбных ларьков и скамеек кордвейнеров, где толпа теснится сильнее всего. Двое мужчин выходят из толпы просителей, все еще покрытые дорожной пылью. Первый умирает с полуподнятым кинжалом и раскрытым запястьем до локтя прежде, чем мои охранники успели хотя бы обернуться. Второй фактически касается моей уздечки. Он протягивает руку, когда Темная Сестра проходит сквозь него один раз, а Висенья каким-то образом проходит мимо меня и возвращается обратно, и оба мужчины истекают кровью в грязь между одним ударом сердца и другим.\n\nМоя охрана прибудет позже. Они всегда приходят позже.\n\nМоя сестра смотрит на них так, как она смотрит на сломанный меч, потом на меня, и не говорит ни слова. Она не обязана это делать. Три ножа за год, и единственное лезвие, которое когда-либо имело значение, принадлежало ей.\n\nМы возвращаемся в Эйгонова Крепость в молчании. Я знаю свою сестру. Эта тишина — ее дыхание."
 fab_dorne.0038.option1:0 "Скажи это, сестра. Ты всё равно скажешь."
 fab_dorne.0039:0 "Кольчужная рубаха"
 fab_dorne.0039.desc:0 "Она приходит ко мне в холле, когда двор пуст, в кольчуге под шелками — она носит ее теперь день и ночь — и просит меня еще раз сделать то же самое.\n\nЯ говорю ей нет. Я говорю ей то же, что говорил ей со двора конюшни: #bold «У меня есть охрана». #!\n\nЯ не вижу ее движения. Вот и все — я, сломивший на одном поле двух королей, не вижу хода родной сестры. На моей щеке проходит холодная полоска, Темная Сестра уже скользит домой в ножнах, мои гвардейцы только сейчас тянутся к рукояткам, а моя кровь на клинке королевы.\n\n#bold «Ваши охранники медлительны и ленивы», — говорит #! Висенья. #bold «Я мог бы убить тебя так же легко, как и порезать. Даже с Чёрным Пламенем в твоей руке ты всего лишь один человек — и я не могу всегда быть с тобой.'#!\n\nСтражники замерли, ожидая, назовет ли их король это изменой. Я приложил пальцы к щеке, и они покраснели, и я почувствовал вовсе не гнев.\n\nОна права. Помоги мне боги, она была права с самого первого ножа."
 fab_dorne.0039.option1:0 "Ты доказала свою точку зрения, сестра."
 fab_dorne.0040:0 "Семеро для семи королевств"
 fab_dorne.0040.desc:0 "К тому времени, как Висенья изложила передо мной свой замысел, порез на моей щеке зажил, и это замысел — она продумала его так тщательно, как когда-либо продумывала войну.\n\nКороли всегда держали чемпионов. «Я — владыка Семи Королевств, — говорит она, — и поэтому у меня будет семь: лучшие рыцари королевства, присягнувшие не замку или зарплате, а своей жизни, люди, которые спят напротив моей двери и идут туда, куда я иду». Она вырежет их клятвы из того же материала, что и клятвы Ночного Дозора. Они будут служить всю жизнь. Они не будут владеть никакими землями, не будут брать жен, не будут иметь детей, не будут требовать никакой славы, кроме охраны короля. Белые плащи, белые щиты, белая чешуя — чтобы все люди могли узнать их с первого взгляда и чтобы их никогда нельзя было принять за что-то иное, чем они есть.\n\nЯ говорю ей, что мы устроим большой турнир, чтобы найти их, и на мгновение я доволен собой. Висенья нет. По ее словам, на турнире можно найти самый быстрый меч, а быстрый меч можно купить — на рыбном рынке нам не хватало умения. О том, что должно быть у семерки, нельзя судить по галерее: это верность. Она выберет их сама, одного за другим, и при этом будет смотреть каждому мужчине в глаза.\n\nЯ доверял ее суждениям о более важных вещах. Я доверяю этому."
 fab_dorne.0040.option1:0 "Тогда выбери их, сестра. Выбери хорошо."
 fab_dorne.0041:0 "Белые плащи"
 fab_dorne.0041.desc:0 "Семь рыцарей преклоняют колени на досках под Железным Троном, и пар от их дыхания поднимается в холодном зале.\n\nСир Ричард Рут. Сир Аддисон Хилл, бастард Корнфилда. Сир Грегор Гуд и сир Гриффит Гуд, кровь одного дома. Сир Хамфри, которого в народе называют Шуточником. Сир Робин Дарклин, которого люди зовут Даркробин, первый из старой крови Сумеречного Дола, принявший плащ. И во главе их сир Корлис Веларион из Дрифтмарка, мой родственник по соли старой крови, который будет первым, кто будет командовать ими.\n\nОдин за другим они произносят слова, которые написала для них моя сестра. Они отказываются от своих земель и прав, от жен, которых никогда не возьмут, и от сыновей, которых никогда не родят, от своих мест за каждым столом, кроме моего. Они не заслужат славы и не будут иметь залов. Они служат всю жизнь, и жизнь, которую они охраняют, — моя.\n\nПлащи накинуты на плечи белые, как свежий снег, и в зале очень тихо. Даже Висенья, которая выбрала каждого из них и не доверяет ничему в этом мире, которое она не могла бы удержать, наблюдает за этим с чем-то близким к удовлетворению.\n\nСемь королевств. Семь богов. Семь мечей между королем и каждым ножом в темноте. Дорн может послать то, что пожелает."
 fab_dorne.0041.option1:0 "Встань, сир Корлис. Охраняй своего короля."
 fab_dorne.0043:0 "Призраки Драконьего Камня"
 fab_dorne.0043.desc.aenys:0 "Драконий Камень принимает меня без единого слова, как старые дома забирают своих детей.\n\nЧто касается того, что написал мне Нимор, — эти слова превратились в пепел над заливом Черноводная, и пеплом они и останутся. Мейстеры могут догадаться. Певцы могут лгать. Сама Висенья может попросить меня приложить руку к Темной Сестре, и это ничего не изменит. Некоторые вещи король носит один, а эту я унесу в свою могилу.\n\nЯ собираюсь провести ночь за Расписным столом, а вместо этого ноги несут меня к двери в детскую. [fab_rhaenys_child.GetFirstName] спит с серебряными волосами [fab_rhaenys_child.GetHerHis] на подушке, маленькими под одеялами, а молодой дракон, вылупившийся в колыбели [fab_rhaenys_child.GetHerHis], лежит, свернувшись калачиком, в изножье кровати, словно кошка, созданная из бледного пламени. Рейнис носила [fab_rhaenys_child.GetHerHim] в этом замке, пока в королевстве шла война. Так мало лет у нее было с [fab_rhaenys_child.GetHerHim]. Она видела первые шаги, сделанные на этих самых камнях, — и никогда не увидит остального: первый полет, первые клятвы, тот день, когда лицо ребенка станет таким, каким она знала бы ее где угодно, и [fab_rhaenys_child.GetFirstName] запомнит ее скорее как теплоту, чем лицо.\n\nКогда я отворачиваюсь от кровати, она здесь — у окна, где она всегда стояла, где соленый ветер трепал ее волосы. Горе, сказали бы мейстеры, и никакого призрака. На Драконьем Камне разница всегда была незначительной. Она не говорит. Она смотрит на нашего спящего ребенка, а затем на меня, и ее глаза задают единственный вопрос, оставшийся в мире.\n\n#bold На рассвете я должен ответить ей, Нимору и ребенку позади меня. #!"
 fab_dorne.0043.desc.nochild:0 "Драконий Камень принимает меня без единого слова, как старые дома забирают своих детей.\n\nЧто касается того, что написал мне Нимор, — эти слова превратились в пепел над заливом Черноводная, и пеплом они и останутся. Мейстеры могут догадаться. Певцы могут лгать. Сама Висенья может попросить меня приложить руку к Темной Сестре, и это ничего не изменит. Некоторые вещи король носит один, а эту я унесу в свою могилу.\n\nЯ собираюсь провести ночь за Расписным столом, а вместо этого ноги несут меня к двери, которую я приказал построить и о которой никогда не говорю: в детскую. Здесь чисто и холодно. Ни одна колыбелька в ней никогда не обогревалась. Рейнис хотела детей так же, как она хотела неба — смеясь, уверенно, совершенно не торопясь, как будто годы принадлежали нам. «Мальчик с ее глазами», сказала она однажды, и сидит на драконе, и никаких моих размышлений. «Сначала у нас была война», — говорили мы себе. Было время.\n\nКогда я выхожу из пустой комнаты, она там — у окна, где она всегда стояла, где соленый ветер трепал ее волосы. Горе, сказали бы мейстеры, и никакого призрака. На Драконьем Камне разница всегда была незначительной. Она не говорит. Она смотрит на комнату, в которой никогда не было нашего ребенка, а затем на меня, и ее глаза задают единственный вопрос, оставшийся в мире.\n\n#bold На рассвете я должен ответить ей, и Нимору, и пустой комнате позади меня.#!"
 fab_dorne.0043.option1:0 "На рассвете. На рассвете я отвечу."
 fab_dorne.0048:0 "Дорнийский вопрос"
 fab_dorne.0048.desc:0 "Прошел год с тех пор, как королевство было провозглашено единым, а в провозглашении все еще есть дыра в форме Дорна.\n\nШесть королевств подчиняются Железному Трону не только по названию. Седьмой расположен за своими горами и песками, как будто Завоевание было слухом из-за моря. Совет не оставит это дело в покое. Висенья называет каждую луну, стоящую особняком, и это урок для любого лорда, который мечтает также выделиться. Лорды-участники марша спрашивают, чей мир царит в Принцевом перевале и Костяном пути, и не получают ответа, достойного ворона. Торговцы платят Мартеллу пошлину за Зеленокровную и в моем собственном зале вслух задаются вопросом, напугала ли старуха из Солнечного Копья драконов.\n\nМерию Мартелл предупредили, что я вернусь с огнем и кровью. Предупреждения короля не остаются в силе, но Дорн не нарушил мира, и пустыни пьют армии так же охотно, как они пьют дождь.\n\n#bold Одно королевство осталось за пределами моего царства. Мне задан вопрос прямо: сейчас, позже или никогда? #!"
 fab_dorne.0048.option1:0 "Сейчас. Пламя и кровь, как было обещано Мерии."
 fab_dorne.0048.option2:0 "Не сейчас. Дорн подождёт — и выбор останется за мной."
 fab_dorne.0049:0 "Осада Пекла"
 fab_dorne.0049.desc:0 "Война наконец-то изменилась.\n\nТе копья, которые оставил Дорн, заперты за стенами, которые им пощадили драконы, и самой гордой из этих стен является Пекло — резиденция Уллеров на Сере, олицетворение предательства даже среди дорнийцев. Каждый лорд, все еще отказывающий мне, смотрит на это. Пока он стоит, ни одно колено в Дорне не должно сгибаться первым.\n\nРейнис этого хочет. Ничто в Дорне еще не приблизилось к Мераксес, напоминает она мне; один проход по башням, и Уллеры окажутся на коленях раньше, чем их зернохранилища сломаются. Мои капитаны вместо осадных линий на Сере говорят о сапёрах, голоде и терпении. Месяцы в этой печи долины. А мужчины — с моими людьми пустыня никогда не обходилась дешево.\n\n#bold Пекло должен подчиниться. Осталось решить, сколько я на это потрачу.#!"
 fab_dorne.0049.option1:0 "Пошлём королеву Рейнис на Мераксес, чтобы заставить их сдаться."
 fab_dorne.0049.option2:0 "Мы возьмём Пекло обычными средствами — осадными линиями и терпением."
 fab_dorne.0050:0 "Дорн склоняется перед драконом"
 fab_dorne.0050.desc:0 "Огромные двери открыты, и солнце и копье Дома Мартеллов проносятся по всему моему залу — опущенными.\n\nНе было ни одного дня, когда эта война была выиграна. Пекло голодал, пока даже гордость Уллера не иссякла. Перевалы были взяты по миле за милей, снабжены гарнизонами, и ни разу их так и не вернули. Замок за замком, в песках не хватало мест, где можно было бы спрятать армию, и Дорн, никогда не побежденный в бою, проснувшись однажды утром, обнаружил, что поля больше не осталось.\n\nТеперь [fab_dorne_kneeler.GetTitledFirstName] преклоняет колени под Железным Троном перед лордами шести королевств, которых сегодня стало семь. [fab_dorne_kneeler.GetSheHe|U] не говорит на старом хвастливом языке Солнечного Копья, и никто в зале не говорит на нем от имени [fab_dorne_kneeler.GetHerHim]. Непокоренный, несгибаемый, несломленный — нет нужды говорить об этом. Каждый глаз может видеть, чем заканчивается хвастовство.\n\nПоклонился. Согнутый. И не сломлен только потому, что Я так хочу: Дорн сохраняет своих лордов, [fab_dorne_kneeler.GetFirstName] сохраняет солнце и копье, и все это проходит под крылом дракона.\n\n#bold Семь королевств. Одно царство. Позвоните в колокола.#!"
 fab_dorne.0050.option1:0 "Встань, [fab_dorne_kneeler.GetFirstName]. Королевство едино."
 fab_dorne.0051:0 "Немногие несломленные"
 fab_dorne.0051.desc:0 "Дорн преклонил колени. Не все дорнийцы присутствовали в зале.\n\nСегодня вечером там, где коридор поворачивает к моим покоям, в темноте свечей, которые кто-то для него затушил, ждал человек в кухонной ливрее. Если бы гвардеец у меня за плечом был на шаг медленнее, истории сказали бы, что Эйгон пережил войну с Дорном и умер в мире. Вместо этого гвардеец провел ножом по ребрам, а второй охранник прислонил мужчину к стене горло прежде, чем я успел перевести дух, чтобы закричать.\n\nВ каблуках ботинок мертвеца был песок. На его запястье была завязана полоска оранжевого шелка — солнце и копье, разорванное на траурный пояс. Ни один лорд не послал его; лорды заключили мир и намерены его соблюдать. Но в побежденной стране полно людей, с которыми никто не советовался, и каждый из них знает мое лицо.\n\n#bold Дорн поклонился. О некоторых его ножах не слышал.#!"
 fab_dorne.0051.option1:0 "Наградить того человека. И найти мне остальных."
 fab_dorne.0052:0 "Условия королевы"
 fab_dorne.0052.desc:0 "Висеня находит меня, когда суд тонкий. На этот раз она не спрашивает. Она говорит мне.\n\n«Я завоевала Дорн, — говорит она, — и, выиграв его, я осолила свое королевство его злейшими сыновьями — людьми, у которых не осталось войны и которым нечего терять». Царство, завоеванное терпением, должно сохраняться бдительностью, а мои стражи, замечает она, не обладают ни тем, ни другим.\n\nЯ говорю ей, что у меня есть охрана. Я не вижу ее движения. На моей щеке проходит холодная полоска, Темная Сестра уже скользит домой, и моя кровь течет на клинке королевы, а мои гвардейцы все еще тянутся к рукояткам.\n\n#bold «Вы завоевали Дорн, не потеряв ни одного дракона», — говорит она #!. #bold 'Было бы плохой шуткой потерять короля из-за кухонного ножа. Семь королевств, брат. Семь мечей, поклявшихся на всю жизнь — и каждый из них я выберу сам.'#!\n\nОна права. Она была права с самого коридора."
 fab_dorne.0052.option1:0 "Тогда выбери их, сестра. Выбери хорошо."
 fab_dorne.0053:0 "Семь мечей для семи королевств"
 fab_dorne.0053.desc:0 "Семь рыцарей преклоняют колени на досках под Железным Троном, и пар от их дыхания поднимается в холодном зале.\n\nСир Ричард Рут. Сир Аддисон Хилл, бастард Корнфилда. Сир Грегор Гуд и сир Гриффит Гуд, кровь одного дома. Сир Хамфри, которого в народе называют Шуточником. Сир Робин Дарклин, которого люди зовут Даркробин. Во главе их сир Корлис Веларион из Дрифтмарка, мой родственник по соли старой крови, первый, кто будет командовать ими.\n\nОдин за другим они произносят слова, которые написала моя сестра. Они отказываются от своих земель и прав, от жен, которых никогда не возьмут, и от сыновей, которых никогда не станут отцом. Они служат всю жизнь, и жизнь, которую они охраняют, — моя.\n\nПлащи накинуты на плечи белые, как свежий снег, и в зале очень тихо. На галерее дорнийские лорды приходят на север, чтобы присягнуть на верность, наблюдая, как семь мечей подняты из-за ножей их соотечественников. Сказка отправится домой раньше них.\n\n#bold Семь королевств. Семь богов. Семь мечей между королем и каждым ножом в темноте.#!"
 fab_dorne.0053.option1:0 "Встань, сир Корлис. Охраняй своего короля."
 fab_dorne.0054:0 "Копья для неба"
 fab_dorne.0054.desc:0 "Драконы вернулись в Дорн, как и обещала королева. Но на выполнение обещаний уходят годы, а мы не спим.\n\nКаждый кузнец от Дощатого города до Принцевого перевала строил с одной целью: огромных железных скорпионов, управляемых лебедкой и утяжеленных, чтобы бросать копье достаточно высоко и достаточно сильно, чтобы пробить глаз или крыло дракона. Теперь они выстилают стены Солнечного Копья, Адской Холты и каждой башни, через которую должны пройти звери. Дракон, который боится летать низко, — это всего лишь лошадь, которая ест больше.\n\nПески опустеют перед их армией, как и прежде, колодцы за нами засорятся, и на этот раз само небо будет для них небезопасным. Нимерия сожгла свои корабли, чтобы ее люди могли стоять и сражаться. Мы все еще ее дети."
 fab_dorne.0054.option1:0 "О нашем сопротивлении будут петь наравне с подвигами Нимерии."
 fab_dorne.0055:0 "Копье ломается"
 fab_dorne.0055.desc:0 "Этого было недостаточно. Скорпионы взяли свою цену — пусть повелители драконов никогда не говорят, что Дорн стоил дешево — но пески больше не наши, и Дом Мартеллов стоит на коленях там, где моя мать клялась, что ни один Мартелл никогда не сделает этого.\n\nСогнутые, согнутые, сломанные: они сейчас бросят нам в ответ наши собственные слова, и мы должны проглотить их вместе со всеми остальными.\n\nНо Дорн уже был завоеван раньше — по крайней мере, так думали андалы, а где сегодня андальские короли Дорна? Колено может сгибаться за сезон. Пустыня помнит дольше, чем династия. Мы терпим, мы наблюдаем и ждем, пока мир научит драконов тому, чему он научил каждого завоевателя до них."
 fab_dorne.0055.desc.submit:0 "Я не буду скормить Дорн драконам только для того, чтобы сохранить слово. Прежде чем перевалы наполнятся пеплом, а колодцы мертвыми, я принимаю условия Эйгона Таргариена и преклоняю колени перед его Железным Троном.\n\nОни скажут, что Дорн согнулся, согнулся и сломан. Колено может согнуться на время, а пустыня помнит дольше, чем династия. Мы терпим, мы наблюдаем и сохраняем достаточно себя, чтобы встретить все, что принесет нам история."
 fab_dorne.0055.option1:0 "Дорн переживет этот день."
 fab_poisoned_wells_modifier:0 "Отравленные колодцы"
 fab_poisoned_wells_modifier_desc:0 "Войско этого персонажа изнурено сожжёнными посевами, отравленными колодцами и дорнийскими набегами."
 fab_meria_no_command_modifier:0 "Жёлтая Жаба"
 fab_meria_no_command_modifier_desc:0 "Мерия Мартелл правит терпением, памятью и песками. Она не возглавляет армии."
 fab_orys_dornish_captive_modifier:0 "Дорнийский пленник"
 fab_orys_dornish_captive_modifier_desc:0 "Этот персонаж удерживается дорнийскими захватчиками до выплаты выкупа по сценарию."
 fab_toland_fool_modifier:0 "Шут Толанда"
 fab_toland_fool_modifier_desc:0 "Этот персонаж послан на дуэль как жестокая шутка, а не потому, что у него есть шанс победить."
 fab_dornish_war_plot_armor_modifier:0 "Ещё не рассказанная история"
 fab_dornish_war_plot_armor_modifier_desc:0 "Хроники уже знают, чем закончится эта история. До того дня ни чума, ни яд, ни наёмный нож не найдут свою цель."
 fab_dorne_scorpion_buildings_tt:0 "Солёным дорнийцам становятся доступны скорпионы для защиты от драконов."
 fab_martell_scorpion_army:0 "Дорнийский корпус скорпионов"
