l_russian:
 fab_dorne.0001:0 "Тридцать тысяч копий"
 fab_dorne.0001.desc:0 "Дорн ответил на вторжение так же, как отвечает на всё: песком, камнем и терпением.\n\nГоворят, на Принцевом перевале нас ждут тридцать тысяч копий, среди них почти две тысячи рыцарей и триста лордов. [fab_reach_lord.GetTitledFirstName] ведёт королевское войско через Красные горы, желая доказать, что новая роза посажена не только ради благоухания при дворе. Орис ведёт тысячу отборных рыцарей по Костяному Пути, где дорога сужается, а из каждой тени грозит стрела.\n\nНад войсками летят драконы. Рейнис на Мераксес устремляется к побережью, Висенья следит за перевалами, а я держу центр, укрыв знамёна тенью Балериона.\n\n#bold Здесь нас не ждёт король с войском в чистом поле или стены, как в Харренхоле. Дорн придётся брать дорога за дорогой, колодец за колодцем, перевал за перевалом — каждую милю, изнывая от жажды.#!"
 fab_dorne.0001.option1:0 "Взять первую милю."
 fab_dorne.0002:0 "Первая кровь"
 fab_dorne.0002.desc:0 "Рейнис нанесла первый удар по Дорну.\n\nВ дыму и ужасе Мераксес обрушилась на Дощатый Город, и шестовые лодки сирот горели на Зеленокровной, словно праздничные фонари. Лимонная Роща встретила нас пустыми залами. Спотсвуд и Стоячий Пруд открыли ворота, а за ними сестра нашла лишь старух, детей и слуг, которые ничего не видели, ничего не слышали и не могли назвать ни одного человека, достойного драконьего пламени.\n\nОна пролетела вдоль всей Зеленокровной и обратно в поисках войска. Его нет. Теневой город под Солнечным Копьём наполовину опустел, а старую принцессу нигде не найти. Куда бы ни ушли дорнийские лорды, они забрали с собой все копья страны, оставив нам своих бабушек.\n\n#bold Драконье пламя нашло города, башни и пустые покои. Самого Дорна оно пока не нашло.#!"
 fab_dorne.0002.option1:0 "Продолжать поиски."
 fab_dorne.0003:0 "Песок и тишина"
 fab_dorne.0003.desc:0 "Чем дальше мы идём, тем меньше Дорна остаётся перед нами.\n\nНа полях — обугленная стерня. Амбары распахнуты и пусты. Колодцы, которые должны были спасти людей от зноя, смердят гнилью, ядом и мертвечиной, сброшенной туда ночью. Сторожевые башни брошены. На одном перевале разведчики нашли дорогу, заваленную до плеча тушами остриженных овец. Они гнили на жаре, и ни одна лошадь не решалась подойти.\n\nНи одно войско не вышло нам навстречу. Ни один лорд не остался защищать замок, носящий его имя. Но дорнийцы дают о себе знать каждой стрелой со скал, каждым закрытым ставнем, каждой пустой дорогой, на которой наше войско глотает пыль, не видя врага, достойного атаки.\n\n#bold Харрен прятался за каменными стенами. Дорнийцам крепостью служат пустота, зной и песок.#!"
 fab_dorne.0003.option1:0 "В этой войне главный враг — жажда."
 fab_dorne.0004:0 "Войско разделяется"
 fab_dorne.0004.desc:0 "Одной дорогой эту войну не выиграть.\n\nВсе взятые замки пусты. Долины бесследно поглощают конные дозоры. Каждый ворон, посланный на юг, возвращается с моими же вопросами без ответов. Дорн не удаётся вынудить к битве на одном фронте по простой причине: Дорн вовсе не намерен давать нам битву.\n\nПоэтому войско разделяется. [fab_reach_lord.GetTitledFirstName] ведёт силы Простора к Пеклу, где у Уллеров, говорят, скорпионов не меньше, чем ножей. Я иду восточной дорогой к Поднебесью и перевалам Фаулеров. Орис продвигается по Костяному Пути, упрямый как всегда: ни красный камень, ни стрелы трусов не остановят десницу короля.\n\nЕсли Дорн не желает стоять на месте, пока мы его завоюем, придётся брать его по частям.\n\n#bold Где-то в этих песках сидит слепая старуха, выбравшая войну. Одно из моих войск её найдёт.#!"
 fab_dorne.0004.option1:0 "Разделить войско. Взять замки."
 fab_dorne.0005:0 "Поход без воды"
 fab_dorne.0005.desc:0 "[fab_reach_lord.GetTitledFirstName] подходит к Пеклу с войском, доле которого не позавидует ни один певец.\n\nЧетверть воинов потеряна из-за жажды, лихорадки, искалеченных ног и стрел, выпущенных из мест, куда не успевал добраться ни один конный дозор. Почти все лошади пали. Водоёмы испорчены; оазисы отравили задолго до появления авангарда. Те, кто выходил из Хайгардена в зелёном, теперь едва бредут под бурыми плащами, задубевшими от соли и пыли.\n\nПекло встретило воинов Простора стенами, солнцем и тишиной. К появлению знамён Тиреллов его залы уже опустели. Теперь [fab_reach_lord.GetSheHe] может лишь считать мёртвых перед замком, который даже не подарил победителям честь принять капитуляцию.\n\n#bold Дракон способен перелететь пустыню. Войску придётся её пройти.#!"
 fab_dorne.0005.option1:0 "Пустыня обескровливает нас, не обнажая клинка."
 fab_dorne.0006:0 "Поднебесье и Айронвуд"
 fab_dorne.0006.desc:0 "Поднебесье наше — в некотором роде. Одни клянутся, что мы взяли его штурмом; другие говорят, что ворота были открыты ещё до того, как первая лестница коснулась камня. В Дорне обе истории могут оказаться правдой, а при взятии пустых замков люди гибнут ничуть не реже.\n\nАйронвуд держался дольше, хотя и не с той силой, которую некогда сулило его имя. Со стен смотрели старики, мальчики и женщины, и, когда бой закончился, среди павших едва нашёлся хоть один мужчина воинского возраста. Тор сдал управляющий: лорд Джордейн недавно умер, а ни один наследник не пожелал умирать за камни, которыми уже пожертвовала его принцесса.\n\nЯ оставляю гарнизоны в захваченных замках. Над башнями поднимаются мои знамёна, в залах сидят мои кастеляны, и каждую ночь часовые смотрят на дороги, по которым никто не приходит. Замки принадлежат мне. Дорн — где-то в другом месте.\n\n#bold Мы отвоёвываем замки у призраков.#!"
 fab_dorne.0006.option1:0 "Оставить гарнизоны в каждом замке. Дорн должен где-то скрываться."
 fab_dorne.0007:0 "Шут Призрачного Холма"
 fab_dorne.0007.desc:0 "Из Призрачного Холма дом Толандов высылает бойца в сияющих доспехах, чья дерзость ещё ослепительнее. Он называет себя мечом своего лорда, щитом своего дома и гневом всего Дорна, воплощённым в одном человеке. И бросает дракону вызов: пусть сразится с ним на земле.\n\nИз замка за его спиной наблюдают за нами. Мои командиры ворчат, что королю не пристало участвовать в таком представлении. В их осторожности есть смысл. Но у меня на поясе Чёрное Пламя, а все дорнийцы в окрестных холмах ждут: понадобится ли Эйгону Таргариену дракон, чтобы убить одного хвастуна?\n\n#bold Что ж, будет певцам поединок.#!"
 fab_dorne.0007.option1:0 "Выходи. Посмотрим, что ты за боец."
 fab_dorne.0008:0 "Костяной Путь"
 fab_dorne.0008.desc:0 "Письмо, принесённое вороном с Костяного Пути, написано дрожащей рукой.\n\nОрис шёл там, где горы сжимают дорогу в узкую рану. Сперва сверху обрушились камни, затем стрелы и копья. Переживших день убивали во тьме. К утру путь оказался перекрыт с обеих сторон, а дорнийцы нападали с каждого уступа, на котором, казалось, не могло удержаться никакое войско.\n\nТысяча рыцарей вошла на Костяной Путь. Большинство мертвы. Дюжина лордов в плену. Если уцелевшие говорят правду, сам Орис попал в руки лорда Виля из Виля.\n\nМой щит и моя верная десница теперь где-то в Красных горах. Ни выкуп, ни угрозы, ни драконье пламя пока не могут до него добраться.\n\n#bold Дорн пустил кровь короне.#!"
 fab_dorne.0008.option1:0 "Найти, куда они его увели."
 fab_dorne.0009:0 "Одно королевство, целое и неделимое"
 fab_dorne.0009.desc:0 "В Солнечном Копье, под расписными копьями и древними знамёнами рода Нимерии, Дорн объявлен покорённым.\n\nЗалы переполнены участниками церемонии: лорды Королевских земель, Простора и Штормовых земель, военачальники и дорнийские сановники — те, кого удалось найти или заставить стать свидетелями. Солнце Мартеллов спущено, вместо него поднят дракон. [fab_sunspear_castellan.GetTitledFirstName] получает должности кастеляна Солнечного Копья и Хранителя Песков. Задача — удержать завоёванное драконами и копьями.\n\nЛюди ликуют: как же иначе, если король пересёк пустыню и объявил это победой?\n\nТеневой город наблюдает из-за закрытых ставней. За стенами пески хранят тишину.\n\n#bold Дорн мой. Теперь ему предстоит научиться оставаться моим.#!"
 fab_dorne.0009.option1:0 "Королевство едино."
 fab_dorne.0010:0 "Домой через перевал"
 fab_dorne.0010.desc:0 "Я вернулся домой через Принцев перевал. В королевстве говорят, что Дорн покорён.\n\n[fab_reach_lord.GetTitledFirstName] остаётся в Пекле; [fab_reach_lord.GetHerHis] войско тает, а письма становятся всё короче. Люди болеют от рыбы из сернистых вод Серноводной и проклинают каждую чашу, прежде чем решиться отпить. Дозоры, посланные к Песчанику и Вейту, не возвращаются разбитыми — они вообще не возвращаются. Ни люди, ни кони, ни кольчуги. Всадники Коргайлов возникают из полуденного марева и исчезают прежде, чем удаётся собрать погоню.\n\nВ столице пьют за семь королевств под одним троном, а певцы уже спорят, кто первым пересёк пустыню. В Дорне продолжают гибнуть на дорогах, которые мы уже завоевали. Моим наместникам достались разные дары: [fab_sunspear_castellan.GetTitledFirstName] теперь владеет дворцом, [fab_reach_lord.GetTitledFirstName] — раскалённой печью. Обоим я пожелал удачи.\n\n#bold На карте всё куда чище, чем на войне.#!"
 fab_dorne.0010.option1:0 "Пусть [fab_sunspear_castellan.GetTitledFirstName] держит Солнечное Копьё. Пусть [fab_reach_lord.GetTitledFirstName] держит марки."
 fab_dorne.0011:0 "Дорн восстаёт"
 fab_dorne.0011.desc:0 "Дорн восстал у нас за спиной, как пламя из-под пепла.\n\nПоднебесье, Айронвуд, Тор и Призрачный Холм отбиты, их гарнизоны вырезаны. Кастелянов тащат из залов и башен, пытают, калечат и выставляют напоказ — чтобы запомнил каждый дорнийский ребёнок. Жители теневого города хлынули в Солнечное Копьё с ножами под плащами и камнями в руках.\n\n[fab_sunspear_castellan.GetTitledFirstName], мой Хранитель Песков, оказался в руках тех, кто ещё несколько дней назад ему кланялся. Его притащили в верхний зал Копьевой башни к Мерии Мартелл. Старая принцесса сидела под знаменем с солнцем и копьём, обратив незрячие глаза к его голосу. Он просил отпустить его за выкуп. Мерия спросила, выкупил ли Эйгон мертвецов, оставшихся на Принцевом перевале.\n\nПо её приказу распахнули окна. Моего кастеляна поволокли по плитам, подняли на подоконник, невзирая на сопротивление, и выбросили вниз — над городом, которым он должен был править. Когда тело ударилось о камни, толпа разразилась ликованием.\n\nК сумеркам над Солнечным Копьём вновь реяло солнце Мартеллов, а теневой город оглашали крики свободы.\n\n#bold Мы завоевали пустую землю. Дорнийцы дождались, когда нам придётся её удерживать.#!"
 fab_dorne.0011.option1:0 "Эта война не окончена."
 fab_dorne.0012:0 "Исчезнувший в песках"
 fab_dorne.0012.desc:0 "[fab_reach_lord.GetTitledFirstName] выступает из Пекла к Вейту и Солнечному Копью. С тех пор на север не пришло ни одной достоверной вести о войске.\n\nРазведчики сперва нашли мёртвых лошадей, потом сломанные копья, потом остывшее кострище под скалой, где войску незачем было разбивать лагерь. Когда пустыня хочет быть жестокой, она возвращает обрывки. Но [fab_reach_lord.GetHerHim] она не вернула — как и войско, ушедшее вслед за своим предводителем в пески.\n\nХайгарден получит нового лорда. Простор — рану, о которой ни один ворон не расскажет всей правды. Дорн бесследно поглотил верховного лорда.\n\n#bold Замки можно брать. Но есть пустыни, которые только забирают.#!"
 fab_dorne.0012.option1:0 "Роза исчезла в песке."
 fab_dorne.0013:0 "Непокорённый"
 fab_dorne.0013.desc:0 "Совет требует ответа.\n\nВисенья готова выжечь все дороги от Принцева перевала до Зеленокровной. Штормовые лорды в ярости из-за Ориса: дорнийцы ещё могут отрубить ему руки. Лорды Простора смотрят на юг со страхом и стыдом, гадая, сколько неопытных юношей поглотят пески, прежде чем Мартеллы признают поражение.\n\nДорн ставит вопрос труднее любой осады: что значит «победить», если замки сдаются и вновь восстают, лорды исчезают, но продолжают командовать, а старая принцесса сбрасывает моего кастеляна с башни прежде, чем мои войска успевают вернуться домой?\n\nЯ могу принести пламя и кровь, пока пустыни не раскалятся докрасна. Или оставить старухе её пески и закончить войну, пока она не отняла у меня больше, чем гордость.\n\n#bold Дорн остаётся непокорённым. Вопрос лишь в том, сумею ли я с этим смириться.#!"
 fab_dorne.0013.option1:0 "Нет. Пламя и кровь, пока Дорн не запомнит."
 fab_dorne.0013.option3:0 "Не сейчас. Но день Дорна настанет."
 fab_dorne.0013.option2:0 "Пусть Дорн сохранит свои пески."
 fab_dorne.0015:0 "Шут Призрачного Холма"
 fab_dorne.0015.desc:0 "Чёрное Пламя быстро отвечает на насмешку. Защитник замка выступает в сияющих доспехах и падает в пыль прежде, чем успевает отзвучать его вызов. Чтобы убить его, не потребовалось искусного удара. Он сражался словно человек, никогда не державший меча за пределами представления скоморохов, — и, как оказалось, так оно и было.\n\nСмех за стенами Толандов раздался лишь после его падения. Это был не рыцарь, а шут лорда Толанда, наряженный в доспехи господина и посланный кривляться и умирать, пока обитатели замка ускользали за холмом.\n\nКогда наши люди взломали ворота, Призрачный Холм опустел: ни воинов, ни припасов, ни знамён, кладовые выметены, не осталось ни одного Толанда, которого можно было бы повесить. Лишь мёртвый шут в чужих доспехах да дорнийский смех, далеко разносившийся над камнями.\n\n#bold Они жертвуют шутами вместо рыцарей и называют это победой. Иногда я почти готов с ними согласиться.#!"
 fab_dorne.0015.option1:0 "Жестокая насмешка."
 fab_dorne.0017:0 "Война ножей"
 fab_dorne.0017.desc:0 "Во второй войне знамёна почти не нужны.\n\nНе будет побед на поле брани, захваченных тронов, рассвета, когда два войска сойдутся по разные стороны долины и решат всё, как на Пламенном поле. Дорнийские всадники налетают на обозы и исчезают в ущельях, которых нет ни на одной карте. Колодцы забиты падалью. Моих гонцов находят повешенными на сухих деревьях, с королевскими печатями, всё ещё привязанными к запястьям. Днём замки присягают мне, ночью открывают потайные ворота. Лорд, поклявшийся в верности в полдень, к закату отправляет на юг маршруты моих дозоров.\n\nНабеги и расправы, убийства и недолгие перемирия, заключённые лишь затем, чтобы их нарушить. Долгая кровавая резня, десятки частных соглашений — и никакого мира.\n\nВисенья говорит, что страх должен стать сильнее пустыни. Мой ответ — драконы, виселицы и золото каждому, кто продаст нам имя.\n\n#bold Дорн выбрал ножи. Мы ответим огнём.#!"
 fab_dorne.0017.option1:0 "Пусть узнают, чего стоит огонь."
 fab_dorne.0018:0 "Человек на вес золота"
 fab_dorne.0018.desc:0 "Повозки с выкупом отправились на юг под охраной; под тяжестью золота колёса глубоко увязали в дороге.\n\nВили без стыда назвали цену: вес лорда Ориса Баратеона в золоте — и столько же за каждого взятого с ним в плен штормового воина. Монета за монетой, слиток за слитком, выкуп пересчитывали при дорнийских свидетелях. Я не оставлю ни одного штормового лорда гнить в плену из-за нехватки денег. И не дам повода сказать, что Железный трон бросил своих.\n\nПолучив золото, Вили открыли темницы.\n\nОрис вышел бледным, исхудавшим, молчаливым. За ним шли его вассалы. Каждый смотрел на перевязанную культю той руки, в которой прежде держал меч. Дорнийцы взяли выкуп, а следом отняли руки — чтобы никто из пленников больше не поднял оружие против Дорна.\n\nОрис медленно опустился на колени. Повязку на запястье пропитала кровь. Он не смотрел на неё — только на меня. В зале стало так тихо, что было слышно жужжание мух над повязками.\n\n#bold Дорн продал мне брата обратно на вес, оставив себе руку, которая держала меч.#!"
 fab_dorne.0018.option1:0 "Заплатить и запомнить."
 fab_dorne.0019:0 "Месть короля"
 fab_dorne.0019.desc:0 "Под Балерионом Костяной Путь раскалился докрасна.\n\nГорные твердыни Вилей вцепились в камень когтями: башни над перевалом, высеченные в скале залы, козьи тропы, бойницы и чёрные пасти пещер, в которых могли скрыться целые семьи. На всё это Балерион ответил огнём.\n\nПервыми треснули внешние стены. Ворота просели, по ним потекло расплавленное железо. Кровли обрушились внутрь. Склады, псарни, конюшни, верёвочные мосты, сторожевые башни, расписные щиты и маленькая септа под скалой горели, пока дым не окутал перевал второй ночью.\n\nВили слишком хорошо знали свою гору, чтобы погибнуть в верхних залах. Они ушли в пещеры и подземные ходы, пока замок над ними превращался в развалины. Люди, которых вытаскивали из дворов, кричали имя своего лорда и умирали, так и не выдав его убежища.\n\nК сумеркам над землёй не осталось ни одной твердыни. Только раскалённые камни и мёртвые кони; обгоревшие знамёна трепетали от взмахов крыльев Балериона.\n\n#bold Я превратил Виль в груду развалин. Дорн укрылся под ними и выжил.#!"
 fab_dorne.0019.option1:0 "Продолжать жечь."
 fab_dorne.0020:0 "Мыс Гнева и Старомест"
 fab_dorne.0020.desc:0 "Война вышла за пределы Дорна.\n\nДорнийский капитан, величающий себя пиратским королём Ступеней, высадился на мысе Гнева с налётчиками и наёмными моряками. Полдюжины городов разграблены под носом у штормовых лордов, за спиной захватчиков горит Дождливый лес. Люди Фаулеров ночью перешли горы и взяли Ночную Песнь. Кароны уведены в Дорн заложниками, замок окутан дымом. Западнее Джоффри Дейн дошёл до самых ворот Староместа и сжёг все поля, мельницы и деревни, видимые с Хайтауэра. Сир Гармон Хайтауэр вывел против него рыцарей и погиб. Его родичи отбили лишь пепел и стерню.\n\nВисенья уже нанесла ответный удар: за одну луну сожжены Лимонная Роща, Призрачный Холм и Тор. Но набеги продолжаются. Никакая карта завоеваний не поспевает за этой войной. Дорн растекается за свои границы, словно яд в воде.\n\n#bold Они не могут одолеть драконов в небе и потому превращают каждый берег и каждую дорогу в рану.#!"
 fab_dorne.0020.option1:0 "На каждую рану будет ответ."
 fab_dorne.0021:0 "Скорпион у Пекла"
 fab_dorne.0021.desc:0 "Ворон с юга принёс самую страшную весть за всю войну.\n\nРейнис полетела к Пеклу по моему приказу. Как всегда: низко, неторопливо, в ясном небе, уверенная, что снизу ей ничто не угрожает. До сих пор так и было.\n\nНо в этот раз её достали. Скорпион на самой высокой башне ждал, пока серебряная королева не закроет собой небо, и тогда железный болт пронзил глаз Мераксес.\n\nДраконица закричала так, что воины на стенах побросали копья и рухнули на колени, зажав уши. Её крылья взмахнули раз, другой — и отказали. Мераксес обрушилась на Пекло, словно воплощённый гнев всех богов, уничтожив погубившую её башню и половину крепостной стены. Разожжённые ею пожары стали её погребальным костром.\n\n#bold После этого небо над Пеклом осталось пустым.#!"
 fab_dorne.0021.option1:0 "Что с Рейнис?"
 fab_dorne.0022:0 "Гнев дракона"
 fab_dorne.0022.desc:0 "В этом зале мы были детьми — все трое.\n\nРейнис танцевала вдоль галереи, пока септа не срывала голос, ругая её. За ужином пела матросские песни — с куплетами, которых королеве знать не полагается, — и даже Висенья невольно смеялась. Нет в этом замке камня, в котором не звучал бы её голос. Я всё ловлю себя на том, что прислушиваюсь к её шагам на лестнице. Потом вспоминаю. И каждый раз это режет, как заново обнажённый клинок.\n\nТела нет. Вот чего я не могу вынести. Нечего предать огню, нечего положить в септе, нет пепла, который можно развеять по ветру. Лишь молчание с юга — и за ним шёпот, который я запретил, но не перестаю слышать. Будто она не погибла при падении Мераксес. Будто Уллеры вытащили её из-под обломков. Будто где-то под дорнийским камнем моя младшая сестра жила во тьме и звала нас, а мы не пришли.\n\nВисенья не плакала ни при ком. Сегодня в этом холодном зале она плачет — прямая, как копьё, с открытыми глазами, словно горе для неё ещё один враг, перед которым нельзя склониться. Я смотрю на Расписной стол, на вырезанные предками горы Дорна, и не замечаю, как лицо становится мокрым.\n\nРейнис была лучшей из нас. Самой доброй. Её любили без принуждения. Теперь Дорн узнает, кем становятся её брат и сестра без неё.\n\n#bold Есть час для горя. Потом приходит час драконов.#!"
 fab_dorne.0022.option1:0 "Пламя и кровь, пока пески не вспомнят её."
 fab_dorne.0023:0 "Рынок ножей"
 fab_dorne.0023.desc:0 "Золото идёт на юг быстрее войск.\n\nЯ назначил цену за головы дорнийских лордов. За Фаулера — его вес в золоте. За Вейта и Толанда — по целому состоянию, достойному выкупа за замок. За Уллера из Пекла, под стенами которого пала моя сестра, — столько, что хватит на флот. Вороны разносят мои обещания по дворам, тавернам и торговым конторам от Стены до Вольных городов. Есть те, кто убивает из верности. За такую награду убьют куда больше людей.\n\nПески уже начали платить. С объявления награды в Пекле погибли четыре лорда Уллера — один за другим, от ножа, падения и яда в кубке. Но лишь двое убийц дожили до получения платы.\n\nДорн не остался в долгу и открыл собственную казну. Лорд Коннингтон получил стрелу в горло на охоте в своём лесу. Всё семейство лорда Мертинса погибло за столом от отравленного вина. Лорда Фелла нашли задушенным в борделе Королевской Гавани. У этой войны больше нет полей сражений. Только расценки.\n\n#bold Каждая тень в Дорне задумается, сколько она стоит. Мои уже задумались.#!"
 fab_dorne.0023.option1:0 "Открыть казну."
 fab_dorne.0024:0 "Виль на свадьбе"
 fab_dorne.0024.desc:0 "Певцы ещё не закончили первый припев, когда двери заперли.\n\nКафферены и Окхарты праздновали соединение двух родов среди гирлянд и свечей. Дети гонялись друг за другом под скамьями. Жених с улыбкой поднялся с кубком — и тут появились люди Вилей. С галереи на гостей нацелили арбалеты. Из-под столовых полотенец извлекли ножи. Зал наполнился криками прежде, чем смолкла музыка.\n\nЛорды умирали с кубками в руках. Безоружных рыцарей рубили на месте. Жениха оскопили на глазах у гостей и оставили захлёбываться вином и кровью. Невесту и её спутниц уволокли с пира; за их спинами горели столы.\n\nК утру в свадебном зале было тихо. Только жужжали мухи.\n\n#bold Есть преступления, которых должна стыдиться даже война.#!"
 fab_dorne.0024.option1:0 "Запомнить имя Вилей."
 fab_dorne.0025:0 "Жёлтая Жаба умирает в постели"
 fab_dorne.0025.desc:0 "Мерия Мартелл мертва.\n\nПламя не сбросило её с седла, золото не привело убийцу достаточно близко. Старая принцесса умерла в постели, сомкнув незрячие глаза. Её пески остались непокорёнными, как и она сама в глазах своего народа. Вопреки моим войскам, клятвам и драконьему пламени она обрела тот конец, который выбрала сама.\n\nДорном правит её сын Нимор — старый, осторожный. Ему досталась страна, разорённая от Красных гор до устья Зеленокровной. Но дорнийцы всё ещё сражаются.\n\n#bold Даже смерть не принесла мне победы, которую не отдала Мерия.#!"
 fab_dorne.0025.option1:0 "Пусть сын ответит."
 fab_dorne.0026:0 "Принцесса и череп"
 fab_dorne.0026.desc:0 "Дерия Мартелл прибыла в Королевскую Гавань.\n\nНимор прислал дочь с охраной — посланницу мира в шелках солнечных цветов. Перед ней несут череп Мераксес. Белая кость. Обугленные останки. Пустая глазница, в которую вошёл болт скорпиона. При дворе раздаются шёпоты об убийстве.\n\nОрис стоит среди штормовых лордов, с подколотым рукавом вместо руки, державшей меч. «Отправьте её к отцу без руки», — говорит он. Не громко, не в исступлении, а с холодной уверенностью человека, заплатившего за милосердие и узнавшего его дорнийскую цену.\n\nВисенья смотрит так, словно готова убить девушку прямо здесь, на коленях перед троном.\n\nДерия не дрогнула. Она предлагает мир без подчинения и запечатанное письмо отца.\n\nНа миг я вижу лишь пустоту, где некогда горел глаз Мераксес.\n\n#bold Дорн принёс моих мёртвых в мой зал. Каждая незажившая рана требует ответа.#!"
 fab_dorne.0026.option1:0 "Оставьте нас."
 fab_dorne.0027:0 "Королевский мир"
 fab_dorne.0027.desc:0 "Двор ждёт моего возвращения.\n\nДерия Мартелл стоит у подножия Железного трона. За ней — череп Мераксес, против неё — вся ярость королевства. Висенья молчит. Пустой рукав Ориса говорит больше всяких слов. Штормовые лорды помнят искалеченных родичей, лорды Королевских земель — Рейнис. Все в зале ждут пламени, темницы или последней расплаты за долгие годы неповиновения.\n\nЯ дарую им мир.\n\nДерия покинет Королевскую Гавань с обеими руками. Посольство не пострадает, драконы не полетят на юг, за кровь Мартеллов никто не получит награды. Дорн останется вне моего королевства, несклонённым и несломленным. До полудня договор будет скреплён моей печатью.\n\nНа первый же вопрос я отказываюсь отвечать. После этого при дворе больше не упоминают письмо Нимора.\n\n#bold Шесть королевств и одна незажившая рана — вот моя держава.#!"
 fab_dorne.0027.option1:0 "Пусть война закончится."
 fab_dorne.0028:0 "Королева не вернулась"
 fab_dorne.0028.desc:0 "Каждый новый рассказ о конце Рейнис противоречит предыдущему.\n\nОдни клянутся, что она выпала из седла и разбилась о камни прежде, чем Мераксес рухнула во двор. Другие — что драконица раздавила её сломанным крылом и пылающей чешуёй. Есть и страшнее слухи: Рейнис пережила падение, люди Уллеров нашли её среди обломков и держали её в живых, подвергая мучениям, пока вокруг горел замок.\n\nНа север не пришло ни правды, ни тела. Вместо них через пески пришло молчание — безграничное настолько, чтобы вместить любой слух, и жестокое настолько, чтобы каждый из них казался возможным.\n\n#bold Дорн убил дракона и отнял королеву.#!"
 fab_dorne.0028.option1:0 "Покончим с этой войной огнём."
 fab_dorne.0029:0 "Гнев дракона: пепел"
 fab_dorne.0029.desc:0 "Тень Балериона пересекла выбранный дорнийский замок ещё до полудня.\n\nВнизу заперли ворота и спрятали знамёна, словно дерево и молчание могли сделать камень невиновным. Я не посылал предупреждения. Рейнис в Пекле тоже не предупредили. Чёрные крылья заслонили двор, башни, колодцы и маленькую септу, куда слуги бежали молиться. Чёрный Ужас раскрыл пасть, и камни узнали, как звучит горе дракона.\n\nКогда пламя утихло, крыш уже не было. Из подвалов выползали люди с дымящимися волосами. Чёрные вороны взмывали на фоне чёрного дыма и падали обратно, настигнутые жаром.\n\n#bold Одна твердыня сгорела. У Дорна их много.#!"
 fab_dorne.0029.option1:0 "Отметить и выбрать другую."
 fab_dorne.0030:0 "Гнев дракона: Вхагар спускается с небес"
 fab_dorne.0030.desc:0 "Висенья вернулась с закопчёнными доспехами и непреклонным лицом.\n\nПо её словам, лорд смотрел со стен, пока Вхагар не сложила крылья и не обрушилась на замок, словно приговор. Скорпионы сгорели, не успев выстрелить. Надвратная башня раскололась. Амбары вспыхнули так ярко, что зарево видели всадники за три долины оттуда.\n\nДорнийцы могут всё отстроить. Упрямство всегда обходилось им дешевле покорности. Когда стены поднимутся вновь, Вхагар повторит урок — уже с меньшим терпением.\n\n#bold Первый раз — предупреждение. Второй — память. Третий — закон.#!"
 fab_dorne.0030.option1:0 "Пусть Висенья выберет следующую дорогу."
 fab_dorne.0031:0 "Гнев дракона: стены не спасут"
 fab_dorne.0031.desc:0 "Очередной дорнийский лорд опустошил свой замок до нашего прибытия.\n\nОб остальном ему расскажут беглецы. Балерион всё равно сжёг родовое гнездо: конюшни, оружейную, резные двери, расписные щиты, окна детской и воронятню, где испуганные птицы до крови бились о клетки. Чтобы разорить лорда, огню не нужно его присутствие.\n\nК сумеркам от замка остался раскалённый остов. Во всех деревнях на многие мили вокруг пахло горячей известью, горелым зерном и древней гордостью, обращённой в дым.\n\n#bold Дорн прячет своих лордов. Но спрятать их дома не может.#!"
 fab_dorne.0031.option1:0 "Выбрать следующий замок."
 fab_dorne.0032:0 "Письмо Нимора"
 fab_dorne.0032.desc:0 "Я читаю письмо на Железном троне.\n\nМейстеры не запишут ни слова. Лорды у подножия стоят слишком далеко, чтобы разобрать почерк. Позднее расскажут, что моя рука слишком крепко сжала клинки трона, а когда я поднялся, с ладони на ступени капала кровь.\n\nВозможно, Нимор писал как отец отцу. Возможно, перечислил всех лордов, рыцарей, детей и королев, которых поглотила война. Возможно, утверждал, что Рейнис пережила падение в Пекле и Дорн может прекратить её муки. Или обещал отдать всё дорнийское золото браавосским убийцам за жизнь моего сына.\n\nПисьмо сгорает прежде, чем кто-либо успевает попросить его прочесть. Дым уносит единственную несомненную истину в этом зале.\n\n#bold Иные слова острее драконьей кости.#!"
 fab_dorne.0032.option1:0 "Балерион. Сейчас."
 fab_dorne.0033:0 "Ночной полёт на Драконий Камень"
 fab_dorne.0033.desc:0 "Балерион набирает высоту во тьме; Королевская Гавань уменьшается под нами.\n\nПисьмо стало пеплом. Рука всё ещё кровоточит. Ветер срывает дым с моего плаща и уносит над Черноводным заливом. Впереди из моря поднимается Драконий Камень — чёрный, знакомый, древнее сердце моего дома. Я лечу туда без двора, совета и певцов, которые потом придали бы моему решению благородный вид.\n\nТам меня ждут камень, ночь и вопрос Нимора. К рассвету королевство получит ответ.\n\n#bold Дракон летит на север. Дорн проживёт ещё одну ночь.#!"
 fab_dorne.0033.option1:0 "Вернуться на рассвете."
 fab_dorne.0035:0 "Культя короля"
 fab_dorne.0035.desc:0 "Орис пришёл на совет с правым рукавом, приколотым к груди.\n\nПри дворе старались не упоминать его увечье, но это молчание лишь приковывало к нему взгляды. Лорды, прежде смеявшиеся с ним на пирах, уставились в кубки. Просители потупились. Кресло рядом со мной, кресло десницы, словно предназначалось другому человеку: штормовому лорду, сломившему Аргилака под чёрным дождём, прошедшему ради меня трудные дороги и воплощавшему мои приказы в битвах.\n\nОрис долго стоял перед креслом, а затем отодвинул его.\n\n«У десницы короля должна быть правая рука, — сказал он голосом безжизненным, как старое железо. — Не хочу, чтобы меня называли Культёй короля».\n\nОн вернётся в Штормовые земли. Имя Вилей врезалось в его память глубже любого шрама. Мейстеры говорили об исцелении; Орис увезёт домой жажду мести.\n\n#bold Мой первый десница покидает меня. В королевстве стало на одну руку меньше — и на одну клятву отмщения больше.#!"
 fab_dorne.0035.option1:0 "Ступай домой, брат."
 fab_dorne.0036:0 "Нож в темноте"
 fab_dorne.0036.desc:0 "Эйгонова крепость — лабиринт из свежего дерева, освещённый факелами. Я проходил по её коридорам тысячу ночей, не задумываясь о них.\n\nСегодня у поворота к моим покоям ждёт человек в одежде кухонного слуги. Свечи погашены. Сначала я слышу его, потом вижу — и лишь напоследок замечаю нож.\n\nДо меня он не добрался. Стражник — я стыжусь, что не знаю его имени, — встал между нами и принял удар в рёбра. Второй прижал убийцу к стене и перерезал ему горло. Всё кончилось прежде, чем я набрал воздуха для крика.\n\nС тела сняли одежду. В каблуках сапог — песок, в рубаху вшит кошелёк дорнийского золота. Я назначил награды за головы лордов Дорна, и Дорн ответил тем же. Разница в том, что им достаточно удачи лишь однажды.\n\nСтражник, проливший за меня кровь, получит землю, рыцарские шпоры — всё, чего попросит. Убийца — яму в земле. А я — новые замки на дверях, новых пробователей пищи и более долгий путь до постели."
 fab_dorne.0036.option1:0 "Удвоить стражу. Наградить того человека."
 fab_dorne.0037:0 "Чёрное Пламя отвечает"
 fab_dorne.0037.desc:0 "Четыре луны с удвоенной стражей притупили мою бдительность. Именно там, где король и не думает об опасности: у собственных конюшен, на рассвете, среди слуг, которых видит каждый день.\n\nЧеловек у тележки с кормом — не мой конюх. Я понимаю это, как понимает воин: руками, а не головой. Он иначе движется, иначе смотрит. Когда я оборачиваюсь, он уже слишком близко, чтобы крик успел призвать помощь. Из рукава выскальзывает изогнутый дорнийский нож.\n\nНо с той ночи в коридоре я не расстаюсь с Чёрным Пламенем ни на час бодрствования. Об этом просила Висенья. Спорить с ней я перестал.\n\nВалирийская сталь выходит из ножен прежде, чем нож освобождается от рукава. Он быстр. Клинок быстрее. Я оставляю его в соломе и стою один в сером свете, тяжело дыша. Слышу бег стражников — опять слишком поздно. И впервые думаю, что сестра, возможно, права не только насчёт меча.\n\nУже дважды. Третий нож уже в пути. Все в замке это знают. Я тоже."
 fab_dorne.0037.option1:0 "Я убил его сам. На этот раз."
 fab_dorne.0038:0 "Ножи на улицах"
 fab_dorne.0038.desc:0 "Король, прячущийся в своей крепости, — не король. Я выезжаю в выросший вокруг неё город. Рядом Висенья, в шелках поверх кольчуги: теперь она всегда так одета.\n\nВсё происходит среди рыбных прилавков и сапожных лавок, где толпа особенно тесна. Из просителей выходят двое, ещё покрытые дорожной пылью. Первый умирает, едва подняв кинжал: рука рассечена от запястья до локтя прежде, чем стражники успевают обернуться. Второй уже касается моей уздечки. Он тянется вверх, и Тёмная Сестра пронзает его одним ударом. Висенья каким-то образом успевает миновать меня и вернуться; между двумя ударами сердца оба убийцы истекают кровью в грязи.\n\nСтражники подбегают потом. Они всегда подбегают потом.\n\nСестра смотрит на них, как на сломанный меч. Затем на меня. Ни слова — они и не нужны. Три покушения за год, и решающим вновь оказался её клинок.\n\nМы молча возвращаемся в Эйгонову крепость. Я знаю сестру. Это молчание — лишь вдох перед речью."
 fab_dorne.0038.option1:0 "Скажи это, сестра. Ты всё равно скажешь."
 fab_dorne.0039:0 "Кольчужная рубаха"
 fab_dorne.0039.desc:0 "Она подходит ко мне в зале, когда придворных мало. Под шелками кольчуга — теперь она носит её днём и ночью. И вновь просит меня поступать так же.\n\nЯ отказываюсь. Повторяю то, что говорю со случая на конюшне: #bold «У меня есть стража».#!\n\nЯ не замечаю её движения. Вот и всё: я, сломивший двух королей на одном поле, не замечаю движения собственной сестры. Холодная черта пересекает щёку. Тёмная Сестра уже уходит в ножны, стражники только тянутся к рукоятям, а на клинке королевы — моя кровь.\n\n#bold «Твоя стража медлительна и ленива»,#! — говорит Висенья. #bold «Я могла убить тебя так же легко, как порезала. Даже с Чёрным Пламенем в руке ты лишь один человек. А я не могу всегда быть рядом».#!\n\nСтражники замерли, ожидая, не назовёт ли король это изменой. Я касаюсь щеки, вижу кровь на пальцах — и не чувствую гнева.\n\nОна права. Боги, она была права с самого первого ножа."
 fab_dorne.0039.option1:0 "Ты меня убедила, сестра."
 fab_dorne.0040:0 "Семеро для семи королевств"
 fab_dorne.0040.desc:0 "Порез на щеке уже затянулся коркой, когда Висенья излагает свой замысел. Именно замысел — продуманный так же тщательно, как план войны.\n\nКоролей всегда охраняли лучшие воины. Я владыка Семи Королевств, говорит она, значит, мне нужны семеро: лучшие рыцари державы, присягнувшие защищать мою жизнь, а не замок или жалованье. Они будут спать у моей двери и всюду следовать за мной. Их клятвы она хочет составить по образцу клятв Ночного Дозора. Пожизненная служба. Ни земель, ни жён, ни детей. Никакой славы, кроме службы королю. Белые плащи, белые щиты, белые чешуйчатые доспехи — чтобы все узнавали их с первого взгляда и ни с кем не путали.\n\nЯ предлагаю отобрать их на большом турнире и на миг доволен собой. Висенья — нет. Турнир выявит самый быстрый меч, говорит она, но быстрый меч можно купить. На рыбном рынке нам недоставало не мастерства. Семерым нужно то, чего не разглядеть с турнирной трибуны: верность. Она выберет их сама, одного за другим, глядя каждому в глаза.\n\nЯ доверял ей в более важных делах. Доверюсь и в этом."
 fab_dorne.0040.option1:0 "Тогда выбери их, сестра. Выбери хорошо."
 fab_dorne.0041:0 "Белые плащи"
 fab_dorne.0041.desc:0 "Семеро рыцарей преклоняют колени на деревянном полу перед Железным троном. В холодном зале их дыхание обращается в пар.\n\nСир Ричард Рут. Сир Аддисон Хилл, бастард Корнфилда. Сир Грегор Гуд и сир Гриффит Гуд, одного рода. Сир Хамфри, которого простой народ зовёт Лицедеем. Сир Робин Дарклин, прозванный Чёрным Дроздом, первый из древнего рода Сумеречного Дола, принявший белый плащ. Во главе — сир Корлис Веларион с Дрифтмарка, мой родич по древней крови и морской соли, их первый командир.\n\nОдин за другим они произносят слова, написанные моей сестрой. Отказываются от земель и притязаний, от жён, которых никогда не возьмут, от сыновей, которых не произведут на свет, от места за любым столом, кроме моего. Им не искать собственной славы и не владеть замками. Они служат пожизненно. И жизнь, которую оберегают, — моя.\n\nНа плечи ложатся плащи, белые, как свежий снег. Зал затих. Даже Висенья, выбравшая каждого и не доверяющая ничему, что не может удержать в руках, смотрит почти с удовлетворением.\n\nСемь королевств. Семь богов. Семь мечей между королём и любым ножом во тьме. Пусть Дорн посылает кого угодно."
 fab_dorne.0041.option1:0 "Встань, сир Корлис. Охраняй своего короля."
 fab_dorne.0043:0 "Призраки Драконьего Камня"
 fab_dorne.0043.desc.aenys:0 "Драконий Камень принимает меня молча, как старый дом встречает вернувшихся детей.\n\nСлова Нимора стали пеплом над Черноводным заливом — и останутся пеплом. Пусть мейстеры гадают, певцы лгут. Даже если Висенья станет допытываться, положив руку на Тёмную Сестру, это ничего не изменит. Некоторые тайны король несёт в одиночку. Эту я унесу в могилу.\n\nЯ собирался провести ночь у Расписного стола, но ноги сами привели к детской. [fab_rhaenys_child.GetFirstName] спит под одеялами; [fab_rhaenys_child.GetHerHis] серебряные волосы рассыпались по подушке. Молодой дракон, вылупившийся в колыбели, свернулся у изножья [fab_rhaenys_child.GetHerHis] кровати, словно кошка из бледного пламени. Рейнис носила [fab_rhaenys_child.GetHerHim] на руках в этом замке, пока королевство воевало. Как недолго ей довелось растить [fab_rhaenys_child.GetHerHim]. Она видела первые шаги по этим камням. Но не увидит первого полёта, первых клятв, дня, когда детское лицо станет тем, которое она узнала бы повсюду. А [fab_rhaenys_child.GetFirstName] запомнит скорее материнское тепло, чем её лицо.\n\nЯ отворачиваюсь от кровати — и вижу её. У окна, где она любила стоять, где солёный ветер трепал её волосы. Это горе, сказали бы мейстеры, а не призрак. На Драконьем Камне грань между ними всегда была тонка. Она молчит. Смотрит на нашего спящего ребёнка, потом на меня. Её глаза задают единственный вопрос, который ещё остался в мире.\n\n#bold К рассвету я должен ответить ей, Нимору и ребёнку за моей спиной.#!"
 fab_dorne.0043.desc.nochild:0 "Драконий Камень принимает меня молча, как старый дом встречает вернувшихся детей.\n\nСлова Нимора стали пеплом над Черноводным заливом — и останутся пеплом. Пусть мейстеры гадают, певцы лгут. Даже если Висенья станет допытываться, положив руку на Тёмную Сестру, это ничего не изменит. Некоторые тайны король несёт в одиночку. Эту я унесу в могилу.\n\nЯ собирался провести ночь у Расписного стола, но ноги привели к двери, о которой я не говорю: в детскую, устроенную по моему приказу. Здесь чисто и холодно. Колыбель никогда не знала детского тепла. Рейнис мечтала о детях так же, как о небе: со смехом, уверенно, не торопясь, словно все годы принадлежали нам. Однажды она сказала: мальчик с её глазами, с её умением держаться на драконе — и без моей угрюмости. Сначала война, убеждали мы себя. Время ещё есть.\n\nЯ отворачиваюсь от пустой комнаты — и вижу её. У окна, где она любила стоять, где солёный ветер трепал её волосы. Это горе, сказали бы мейстеры, а не призрак. На Драконьем Камне грань между ними всегда была тонка. Она молчит. Смотрит на комнату, в которой так и не поселился наш ребёнок, потом на меня. Её глаза задают единственный вопрос, который ещё остался в мире.\n\n#bold К рассвету я должен ответить ей, Нимору и пустой комнате за моей спиной.#!"
 fab_dorne.0043.option1:0 "На рассвете. На рассвете я отвечу."
 fab_dorne.0048:0 "Дорнийский вопрос"
 fab_dorne.0048.desc:0 "Год прошёл с тех пор, как державу провозгласили единой. Но в этом провозглашении всё ещё зияет дыра размером с Дорн.\n\nШесть королевств подчиняются Железному трону не только на словах. Седьмое сидит за горами и песками, словно Завоевание — лишь заморский слух. Совет не даёт забыть об этом. Висенья говорит: каждая луна независимости Дорна служит примером любому лорду, мечтающему о том же. Лорды марок спрашивают, кто обеспечивает мир на Принцевом перевале и Костяном Пути, — и не получают ответа, ради которого стоило посылать ворона. Купцы платят Мартеллам пошлины на Зеленокровной и в моём собственном зале гадают вслух: неужели старуха из Солнечного Копья всё-таки напугала драконов?\n\nМерию Мартелл предупредили, что я вернусь с пламенем и кровью. Неисполненные угрозы короля со временем теряют вес. Но Дорн не нарушал мира, а пустыни поглощают войска так же охотно, как дождь.\n\n#bold Одно королевство остаётся за пределами моей державы. Вопрос поставлен прямо: сейчас, позже или никогда?#!"
 fab_dorne.0048.option1:0 "Сейчас. Пламя и кровь, как было обещано Мерии."
 fab_dorne.0048.option2:0 "Не сейчас. Дорн подождёт — и выбор останется за мной."
 fab_dorne.0049:0 "Осада Пекла"
 fab_dorne.0049.desc:0 "Ход войны наконец переломился.\n\nУцелевшие дорнийские воины заперты за стенами, которые пощадили драконы. Самая гордая из оставшихся твердынь — Пекло, замок Уллеров на Серноводной, известный вероломством даже среди дорнийцев. На него смотрят все ещё не покорившиеся лорды. Пока он стоит, никто не обязан склоняться первым.\n\nРейнис хочет взять его. Она напоминает: никто в Дорне ещё не сумел даже приблизиться к Мераксес. Один проход над башнями — и Уллеры падут на колени прежде, чем загорятся амбары. Военачальники предлагают другое: осадные укрепления на Серноводной, подкопы, голод и терпение. Месяцы в раскалённой долине. И люди — пустыня всегда брала с нас щедрую дань.\n\n#bold Пекло должно сдаться. Осталось решить, чем я готов заплатить.#!"
 fab_dorne.0049.option1:0 "Пошлём королеву Рейнис на Мераксес, чтобы заставить их сдаться."
 fab_dorne.0049.option2:0 "Мы возьмём Пекло обычными средствами — осадными линиями и терпением."
 fab_dorne.0050:0 "Дорн склоняется перед драконом"
 fab_dorne.0050.desc:0 "Большие двери распахнуты. По залу проносят солнце и копьё Мартеллов — склонённое знамя.\n\nНе было единственного дня, решившего войну. Пекло голодало, пока не иссякла даже гордость Уллеров. На перевалах, изнывая от жажды, мы брали милю за милей, ставили гарнизоны — и на этот раз не отступали. С каждым потерянным замком у песков оставалось всё меньше мест, где можно спрятать войско. Дорн, ни разу не побеждённый на поле брани, однажды проснулся и обнаружил, что поля больше нет.\n\nТеперь [fab_dorne_kneeler.GetTitledFirstName] преклоняет колени перед Железным троном и лордами шести королевств, которых сегодня становится семь. [fab_dorne_kneeler.GetSheHe|U] не произносит гордого девиза Солнечного Копья. Никто в зале не берётся заменить [fab_dorne_kneeler.GetHerHim] и произнести девиз. «Непреклонные, несгибаемые, несдающиеся» — их и не нужно повторять. Все видят, чем кончилась похвальба.\n\nСклонились. Согнулись. И не сломлены лишь по моей воле: Дорн сохраняет своих лордов, [fab_dorne_kneeler.GetFirstName] — солнце и копьё. Всё это теперь под крылом дракона.\n\n#bold Семь королевств. Одна держава. Звоните в колокола.#!"
 fab_dorne.0050.option1:0 "Встань, [fab_dorne_kneeler.GetFirstName]. Королевство едино."
 fab_dorne.0051:0 "Немногие несломленные"
 fab_dorne.0051.desc:0 "Дорн преклонил колени. Но не все дорнийцы были в том зале.\n\nСегодня у поворота к моим покоям ждал человек в одежде кухонного слуги. Кто-то заранее погасил для него свечи. Будь стражник рядом со мной на шаг медленнее, летописи написали бы: Эйгон пережил войну с Дорном, но погиб от мира. Вместо меня стражник принял нож в рёбра. Второй прижал убийцу к стене и перерезал горло прежде, чем я успел крикнуть.\n\nВ каблуках мертвеца был песок. На запястье — полоска оранжевого шёлка: знамя с солнцем и копьём, разорванное на траурную повязку. Его не посылал ни один лорд: лорды заключили мир и намерены его соблюдать. Но в покорённой стране полно людей, чьего согласия не спрашивали. И каждый знает моё лицо.\n\n#bold Дорн склонился. Но не все его ножи об этом слышали.#!"
 fab_dorne.0051.option1:0 "Наградить того человека. И найти мне остальных."
 fab_dorne.0052:0 "Условия королевы"
 fab_dorne.0052.desc:0 "Висенья находит меня, когда придворных мало. На этот раз она не просит. Она ставит перед фактом.\n\nЯ завоевал Дорн, говорит она, и тем самым наполнил свою державу его озлобленными сыновьями — людьми, для которых война кончилась и которым нечего терять. Королевство, взятое терпением, удерживают бдительностью. Моя стража, замечает она, не обладает ни тем ни другим.\n\nЯ отвечаю, что у меня есть стража. И не замечаю её движения. Холодная черта пересекает щёку, Тёмная Сестра уже уходит в ножны, на клинке королевы — моя кровь. А стражники всё ещё тянутся к рукоятям.\n\n#bold «Ты покорил Дорн, не потеряв даже дракона»,#! — говорит она. #bold «Нелепо будет потерять короля из-за кухонного ножа. Семь королевств, брат. Семь мечей, присягнувших пожизненно. И каждого рыцаря я выберу сама».#!\n\nОна права. Она права с того самого покушения в коридоре."
 fab_dorne.0052.option1:0 "Тогда выбери их, сестра. Выбери хорошо."
 fab_dorne.0053:0 "Семь мечей для семи королевств"
 fab_dorne.0053.desc:0 "Семеро рыцарей преклоняют колени на деревянном полу перед Железным троном. В холодном зале их дыхание обращается в пар.\n\nСир Ричард Рут. Сир Аддисон Хилл, бастард Корнфилда. Сир Грегор Гуд и сир Гриффит Гуд, одного рода. Сир Хамфри, которого простой народ зовёт Лицедеем. Сир Робин Дарклин, прозванный Чёрным Дроздом. Во главе — сир Корлис Веларион с Дрифтмарка, мой родич по древней крови и морской соли, их первый командир.\n\nОдин за другим они произносят слова моей сестры. Отказываются от земель и притязаний, от жён, которых никогда не возьмут, от сыновей, которых не произведут на свет. Они служат пожизненно. И жизнь, которую оберегают, — моя.\n\nНа плечи ложатся плащи, белые, как свежий снег. Зал затих. С галереи смотрят дорнийские лорды, прибывшие присягнуть: семь мечей подняты из-за ножей их соотечественников. Этот рассказ доберётся домой раньше них.\n\n#bold Семь королевств. Семь богов. Семь мечей между королём и любым ножом во тьме.#!"
 fab_dorne.0053.option1:0 "Встань, сир Корлис. Охраняй своего короля."
 fab_dorne.0054:0 "Копья для неба"
 fab_dorne.0054.desc:0 "Драконы вернулись за Дорном, как обещала королева. Но исполнение обещаний занимает годы, и мы не проспали это время.\n\nКаждый кузнец от Дощатого Города до Принцева перевала работал ради одной цели: огромных железных скорпионов. Лебёдки и противовесы должны послать копьё достаточно высоко и мощно, чтобы пробить драконий глаз или крыло. Теперь скорпионы стоят на стенах Солнечного Копья, Пекла и каждой башни на пути чудовищ. Дракон, боящийся летать низко, — всего лишь лошадь с непомерным аппетитом.\n\nКак прежде, пески опустеют перед их войском. За собой мы оставим отравленные колодцы. На этот раз даже небо не станет для них безопасным. Нимерия сожгла свои корабли, чтобы её народ остался и сражался. Мы всё ещё её дети."
 fab_dorne.0054.option1:0 "О нашем сопротивлении будут петь наравне с подвигами Нимерии."
 fab_dorne.0055:0 "Сломанное копьё"
 fab_dorne.0055.desc:0 "Этого не хватило. Скорпионы взяли свою дань — пусть драконьи владыки не говорят, что Дорн достался им дёшево. Но пески больше не наши. Дом Мартеллов преклонил колени там, где моя мать клялась никогда не склоняться.\n\nПреклонившиеся, согнувшиеся, сдавшиеся. Теперь наши же слова обратят против нас. Придётся проглотить и это.\n\nНо Дорн уже покоряли — по крайней мере, так думали андалы. Где теперь их дорнийские короли? Колено можно преклонить на время. Пустыня помнит дольше любой династии. Мы выстоим, будем наблюдать и ждать, когда мир преподаст драконам тот же урок, что всем завоевателям до них."
 fab_dorne.0055.desc.submit:0 "Я не отдам Дорн драконам лишь ради верности девизу. Пока перевалы не засыпаны пеплом, а колодцы — мертвецами, я принимаю условия Эйгона Таргариена и преклоняю колени перед Железным троном.\n\nСкажут, что Дорн склонился, согнулся и сломлен. Но колено можно преклонить на время, а пустыня помнит дольше любой династии. Мы выстоим, будем наблюдать и сбережём силы, чтобы встретить всё, что ещё принесёт история."
 fab_dorne.0055.option1:0 "Дорн переживет этот день."
 fab_poisoned_wells_modifier:0 "Отравленные колодцы"
 fab_poisoned_wells_modifier_desc:0 "Войско этого персонажа изнурено сожжёнными посевами, отравленными колодцами и дорнийскими набегами."
 fab_meria_no_command_modifier:0 "Жёлтая Жаба"
 fab_meria_no_command_modifier_desc:0 "Мерия Мартелл полагается в правлении на терпение, память и пески. Она не водит войска в бой."
 fab_orys_dornish_captive_modifier:0 "В дорнийском плену"
 fab_orys_dornish_captive_modifier_desc:0 "Этот персонаж остаётся в дорнийском плену до выплаты выкупа в ходе сюжетных событий."
 fab_toland_fool_modifier:0 "Шут Толанда"
 fab_toland_fool_modifier_desc:0 "Этого персонажа отправили на поединок ради жестокой насмешки, а вовсе не в надежде на его победу."
 fab_dornish_war_plot_armor_modifier:0 "Ещё не рассказанная история"
 fab_dornish_war_plot_armor_modifier_desc:0 "Хроники уже знают, чем закончится эта история. До того дня ни чума, ни яд, ни наёмный нож не найдут свою цель."
 fab_dorne_scorpion_buildings_tt:0 "Солёным дорнийцам становятся доступны скорпионы для защиты от драконов."
 fab_martell_scorpion_army:0 "Дорнийский корпус скорпионов"
