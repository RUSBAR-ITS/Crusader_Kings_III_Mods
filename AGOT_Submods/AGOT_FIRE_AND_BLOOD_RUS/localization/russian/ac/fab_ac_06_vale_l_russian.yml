l_russian:
 fab_ac_vale.0001:0 "Флот направляется в Чаячий город"
 fab_ac_vale.0001.desc:0 "Короне нужны порты, а лучший из восточных портов, ещё не принадлежащих мне, — Чаячий город, большой город Долины на берегу залива. Пока моё войско разбирается с рекой и бурей, море принесёт войну Арренам.\n\nЯ поручил королевский флот Деймону Велариону, Владыке Приливов, — хозяину крупнейшего военного флота Узкого моря, родичу моей матери и лучшему моряку, когда-либо поднимавшему якорь у Дрифтмарка. С ним отправляется Висенья на Вхагар, чтобы любые силы, собранные Арренами, сражались в тени дракона. Приказ прост: взять Чаячий город и принести войну к порогу Долины.\n\nОрлиное Гнездо не станет бездействовать. Наши друзья за морем пишут, что Шарра Аррен забирает корабли из всех портов Долины, собирая флот, а дюжина браавосских боевых кораблей за её деньги присоединилась к нему. Я буду ждать.\n\n#bold Дракон владеет небом, а род Веларионов уже сто лет владеет Узким морем. Что против этого один наёмный флот?#!"
 fab_ac_vale.0001.option1:0 "Возьмите Чаячий город, мой Владыка Приливов."
 fab_ac_vale.0002:0 "Битва в водах у Чаячьего города"
 fab_ac_vale.0002.desc:0 "Море преподало мне урок, который земля никогда не осмеливалась: дракон может проиграть.\n\nФлоты встретились в водах Чаячьего города — боевые галеры Деймона противостояли сплоченной силе Арренов и их двенадцати корпусам Браавоси. Браавоси изменили ситуацию: пурпурные паруса и железные тараны, экипажи, подготовленные для войны на море, и капитаны, которые не паниковали при виде дракона над головой. Они прорвали нашу линию, взяли на абордаж флагман за флагманом и разорвали королевский флот на части.\n\nДеймон Веларион мертв. Повелитель приливов, сильная правая рука моего дома на море, родственник моей матери — убит на своей горящей палубе, а вокруг него гибнет его флот. Вместе с ним на дно залива ушла половина силы Дрифтмарка.\n\n#bold Вороны сегодня вечером прилетают в Орлиное гнездо с поздравлениями, без сомнения. Аррины могут ими насладиться. Висенья была выше той битвы — и Висенья не прощает.#!"
 fab_ac_vale.0002.option1:0 "Деймон, Владыка Приливов. Да упокоит его море."
 fab_ac_vale.0003:0 "Ответ Вхагар"
 fab_ac_vale.0003.desc:0 "Флот Аррена пережил мой собственный почти на час.\n\nВисенья наблюдала, как гибнет королевский флот со спины Вхагар, а затем обрушилась на победителей, пока их команды все еще аплодировали. Она носилась взад и вперед по заливу, неторопливо, как фермерка, стреляющая жнивью, и поджигала флот Арренов корабль за кораблем: громады, галеры, гордые военные корабли Браавоси с фиолетовыми парусами. Жители Чаячьего города наблюдали со своих стен, как каждый корпус, выигравший битву, сгорел до ватерлинии в течение часа после нее.\n\nТак что певцы могут называть это как хотят. Два флота вошли в воды Чаячьего города, и ни один флот не вышел: ничья, судя по арифметике кораблей. Но Город Чайки стоит невзятым за его стенами, и у меня не осталось флота, чтобы взять его, и это делает это поражением, что бы ни пели певцы. Первый из этой войны. Я имею в виду, что это будет последний раз.\n\n#bold Долина выиграла время ценой каждого корабля, которым она владеет. Посмотрим, чего им это будет стоить. #!"
 fab_ac_vale.0003.option1:0 "Победа, которая не оставляет флота, — это не победа."
 fab_ac_vale.0004:0 "Королева Трёх Сестёр"
 fab_ac_vale.0004.desc:0 "Стоимость сожжённого флота Долины уже наступила, и её платят Аррены.\n\nДо Укуса доходит слух: Три Сестры восстали. Сестры — вредители, контрабандисты и рыбаки, которые никогда не любили власть Гнезда — наблюдали, как сгорает последний корпус Аррена у Чаячьего города, и понимали, что не осталось ни одного соколиного флота, который мог бы их удержать. Они бросили людей Долины в море, объявили свои острова свободными от Горы и Долины и сделали Марлу Сандерленд, леди Систертона, своей королевой. Корона сестер, которую носит Сандерленд — первая за тысячу лет.\n\nШарра Аррен ничего не может с этим поделать. Ее флот — пепел на воде; С таким же успехом Сестры могли бы находиться по всему миру. И, признаюсь, на данный момент такая договоренность меня устраивает: с каждым человеком, которого потеряет Орлиное гнездо, станет на одного меньше у Кровавых Врат, когда придет моя очередь.\n\n#bold Маленькая королева может некоторое время держать свои камни влажными. Короны, надетые в сезон хаоса, имеют свойство спадать в сезон порядка — а порядок приближается.#!"
 fab_ac_vale.0004.option1:0 "Разберёмся с мятежами поочерёдно. Сначала Долина."
 fab_ac_vale.0005:0 "Восстание жителей Трёх Сестёр"
 fab_ac_vale.0005.desc:0 "Одна корона до сих пор открыто бросает вызов между Стеной и маршами и восседает на лбу королевы-разрушителя на мокрой скале в Укусе. Масло для помазания само по себе едва высыхает; пора Марле Сандерленд уйти.\n\nЯ поручил задание [fab_north_warden.GetFirstName], моему Хранителю Севера — это [fab_north_warden.GetHerHis], берущая на себя чуму вредителей, и королевству пойдет на пользу, если Север ответит на угрозу так близко к своему порогу. Флот Долины все еще представляет собой лес на верфях после Чаячьего города, поэтому Север выходит в море на наемных килях: сир Уоррик Мандерли ведет северную армию вниз по Укусу на галерах, занятых в Браавосе — тот самый город, военные корабли которого потопили мой флот, теперь переправляет мои армии, ибо Браавоси плывут за тем, кто платит. Орлиное гнездо посылает всю свою силу; Белая Гавань плывет самостоятельно.\n\nИ над ними всеми стоит Висенья на Вхагар. Сестры видели, как она сожгла победоносный флот до ватерлинии. Они будут думать об этом, пока паруса заполнят горизонт.\n\n#bold Последняя корона Завоевания восседает на самом маленьком троне. Принеси мне.#!"
 fab_ac_vale.0005.option1:0 "#S Кончай, [fab_north_warden.GetFirstName]. #!"
 fab_ac_vale.0006:0 "Три Сестры преклоняют колено"
 fab_ac_vale.0006.desc:0 "Никакого боя не было. Ссоры почти не было.\n\nКогда систермены выглянули из Систертона и увидели горизонт, полный парусов — нанятые сиром Уорриком Мандерли галеры Браавоси, черные от северных копий, корабли Белой Гавани позади них и Висенью, кружившую над всем этим на Вхагар — восстание закончилось между одним приливом и другим. Они слышали, что Вхагар сделал с флотом, выигравшим битву. Им не хотелось узнать, что она сделала с городами.\n\nСестры сами свергли свою королеву. Марла Сандерленд была выдана ее собственными лордами, а ее младший брат Стеффон вырос на ее месте, а лорд Стеффон преклонил колени на берегу и отдал Трех сестер Железному Трону и Орлиному гнезду, чьим опекой они останутся. Дом Мандерли берет одного из своих сыновей под опеку и в заложники; Дом Арренов берет другой. Сестры так или иначе сохранят веру.\n\nЧто касается королевы одной зимы: она променяла свою корону на серую. Марла Сандерленд идет к молчаливым сестрам — милость, как называют это мои консультанты, и так оно и есть. Молчаливые сестры не говорят об измене. Они вообще не разговаривают.\n\n#bold Вот и закончилась последняя корона, поднятая против меня. Царство одно — и таким оно и останется.#!"
 fab_ac_vale.0006.option1:0 "Серый цвет ей идет лучше короны."
 fab_ac_vale.0006.desc.kinsman:0 "Никакого боя не было. Ссоры почти не было.\n\nКогда систермены выглянули из Систертона и увидели горизонт, полный парусов — нанятые Браавоси черные галеры с северными копьями, корабли Белой Гавани позади них и Висенью, кружившую над всем этим на Вхагар — восстание закончилось между одним приливом и другим. Они слышали, что Вхагар сделал с флотом, выигравшим битву. Им не хотелось узнать, что она сделала с городами.\n\nСестры сами свергли свою королеву. Марлу Сандерленд выдали ее собственные лорды. Ее брат Стеффон, который должен был быть воспитан вместо нее, мертв, и власть переходит к [fab_sisters_heir.GetFirstName] из ее собственного дома, который преклонил колени на берегу и отдал Трех сестер Железному Трону и Орлиному гнезду, под опекой которого они останутся. Заложники крови Сандерленда отправляются в Уайт-Харбор и Орлиное гнездо. Сестры так или иначе сохранят веру.\n\nЧто касается королевы одной зимы: она променяла свою корону на серую. Марла Сандерленд идет к молчаливым сестрам — милость, как называют это мои консультанты, и так оно и есть. Молчаливые сестры не говорят об измене. Они вообще не разговаривают.\n\n#bold Вот и закончилась последняя корона, поднятая против меня. Царство одно — и таким оно и останется.#!"
 fab_ac_vale.0006.desc.attainted:0 "Никакого боя не было. Ссоры почти не было.\n\nКогда систермены выглянули из Систертона и увидели горизонт, полный парусов — нанятые Браавоси черные галеры с северными копьями, корабли Белой Гавани позади них и Висенью, кружившую над всем этим на Вхагар — восстание закончилось между одним приливом и другим. Они слышали, что Вхагар сделал с флотом, выигравшим битву. Им не хотелось узнать, что она сделала с городами.\n\nСестры сами свергли свою королеву. Марлу Сандерленд выдали ее собственные лорды, и за ней никто не стоит. Ее брат Стеффон мертв, а вместе с ним и последний из рода Сандерлендов; восстание съело дом, который его поднял. Три сестры переходят непосредственно на хранение в Орлиное гнездо, как и до этого безумия зимней короны.\n\nЧто касается самой королевы: она променяла свою корону на серую. Марла Сандерленд идет к молчаливым сестрам — милость, как называют это мои консультанты, и так оно и есть. Молчаливые сестры не говорят об измене. Они вообще не разговаривают.\n\n#bold Вот и закончилась последняя корона, поднятая против меня. Царство одно — и таким оно и останется.#!"
 fab_ac_vale.0007:0 "Мать пишет письмо"
 fab_ac_vale.0007.desc:0 "Теперь все в Орлином гнезде шепчутся о драконах. Королевства продолжают рушиться и рушиться, а Мать и лорды весь день сидят на совете за закрытыми дверями, и никто мне ничего не говорит, потому что мне восемь лет.\n\nНо я прислушивался у двери. Мать отправляет королю драконов письмо — она предложила выйти за него замуж, и в письме написано, что, поскольку у него нет сыновей, он должен сделать МЕНЯ своим наследником!\n\nНаследник всего Вестероса. Сир Марвин говорит, что мне не следует надеяться, что Мать только выигрывает время. Но подумайте об этом! У меня будет Долина И все остальное, и на мою свадьбу придет дракон."
 fab_ac_vale.0007.option1:0 "Теперь мы ждем ответа повелителя драконов."
 fab_ac_vale.0008:0 "Слово из Орлиного гнезда"
 fab_ac_vale.0008.desc:0 "Сокол увидел, куда дует ветер. Ворон из Орлиного гнезда приносит весть от Шарры Аррен, королевы-регентши Долины — и на этот раз она не пишет о союзах между равными. Короли, бросившие мне вызов, мертвы или преклонили колени, и Долина не желает присоединяться к ним; то, что она предлагает сейчас, — это подчинение. Своего рода.\n\n"
 fab_ac_vale.0008.option1:0 "Никакого брака. Висенья ответит Орлиному гнезду — по-своему."
 fab_ac_vale.0008.option2:0 "Я женюсь на Шарре. Мальчик — мой наследник, пока у меня не родится сын."
 fab_ac_vale.0008.option2.heir:0 "Я женюсь на Шарре, но у Железного Трона уже есть наследник."
 fab_ac_vale.0008.option2.heir_tt:0 "[fab_ac_eyrie_boy.GetFirstName] не будет назван наследником: у короля уже есть дети его собственной крови."
 fab_ac_vale.0008.option3:0 "#S Долину нужно завоевать, как и все остальные: огнем и кровью. #!"
 fab_ac_vale.0008.desc.early:0 "Сокол увидел, куда дует ветер. Ворон из Орлиного гнезда приносит весть от Шарры Аррен, королевы-регентши Долины — и на этот раз она не пишет о союзах между равными. Короли все еще противостоят мне, короны все еще на их головах, но королева-регент не намерена ждать и узнавать, живут ли они лучше, чем те, кто уже пал. То, что она предлагает сейчас, еще до того, как какой-либо дракон хотя бы повернулся к ее горам, — это подчинение. Своего рода.\n\n"
 fab_ac_vale.0008.desc.terms:0 "Ибо ее условия приходят завернутые в шелк. Вейл преклонит колени, пишет она, если я возьму ее в жены и назову своим наследником ее мальчика Роннеля. Мой наследник! Я, у которого нет сына, должен пообещать свое завоевание птенцу сокола. И вложил в письмо еще раз портрет: «Цветок горы», как ее называют певцы долины, и художник усердно зарабатывал свой гонорар. Я признаю, что она красивая женщина — и на десять лет старше меня, и те, кто называет ее самой красивой в Вестеросе, явно никогда не смотрели на валирийку.\n\n"
 fab_ac_vale.0008.desc.terms.heir:0 "Ибо ее условия завернуты в шелк. Вейл преклонит колени, пишет она, если я возьму ее в жены и назову своим наследником ее мальчика Роннеля. Мой наследник! Как будто у Железного Трона уже не было наследников моей крови, она поставила бы над ними птенца сокола. И вложил в письмо еще раз портрет: «Цветок горы», как ее называют певцы долины, и художник усердно зарабатывал свой гонорар. Я признаю, что она красивая женщина — и на десять лет старше меня, и те, кто называет ее самой красивой в Вестеросе, явно никогда не смотрели на валирийку.\n\n"
 fab_ac_vale.0008.desc.close:0 "И всё же мне не до смеха. За этим письмом стоит последнее королевство, которого ещё никто не покорял: Кровавые Ворота, разбившие каждое посланное против них войско, и Орлиное Гнездо над облаками, где шесть тысяч лет не ступала нога врага. Эти условия продиктовала гордыня — но, если я отвечу неверно, отстаивать их будут камень и небо.\n\n#bold Рука вдовы, горное королевство и мальчик на слишком большом троне. Завладеть Долиной можно по-разному.#!"
 fab_ac_vale.0009:0 "Дракон в отчимах"
 fab_ac_vale.0009.desc:0 "Мать вышла за него замуж! Король драконов теперь мой добрый отец, и я должен стать его наследником, как и просили в письме, и НИКТО в Долине не должен ни с кем сражаться.\n\nМейстер Айва говорит, что я должен серьезно отнестись к этому, потому что это важное государственное дело. Я очень стараюсь быть торжественной.\n\nНо у него есть ДРАКОН. Самый большой, черный. А когда я подрасту, возможно, он позволит мне на нем покататься."
 fab_ac_vale.0009.desc.no_heir:0 "Мать вышла за него замуж! Король драконов теперь мой добрый отец, и НИКТО в Долине не должен ни с кем сражаться.\n\nВ конце концов, я не буду его наследником. У него уже есть собственные дети, и мейстер Айва говорит, что это всегда было той частью письма, на которую король никогда бы не согласился. Он говорит, что я в любом случае должен серьезно отнестись к этому, потому что это по-прежнему важное государственное дело. Я очень стараюсь быть торжественной.\n\nНо у него есть ДРАКОН. Самый большой, черный. А когда я подрасту, возможно, он позволит мне на нем покататься."
 fab_ac_vale.0009.option1:0 "Я полечу над всем миром!"
 fab_ac_vale.0010:0 "Дама во дворе"
 fab_ac_vale.0010.desc:0 "Мать повсюду расставила солдат. Город Чайков получил новые стены, и целая армия засела у Кровавых Врат, а в Камне, Снеге и Небе было в три раза больше людей, и все говорили, что Орлиное гнездо — самый безопасный замок в мире, потому что ни одна армия не может подняться на Копье Гиганта.\n\nТолько дама не привела войско. Я был на уроках, когда все небо потемнело, и самый большой дракон в мире приземлился прямо посреди сада и сидел там, сложив крылья, как это делают наши соколы.\n\nДама в доспехах позволила мне сесть к ней на колени и рассмотреть ее вблизи. Он пахнет раскаленным железом, а его глаза подобны большому огню чайника. Потом выбежала Мать со всей своей охраной и побледнела как молоко. Дама только улыбнулась ей. И я спросил: «Мама, можно мне полететь с дамой?»"
 fab_ac_vale.0010.option1:0 "Отдайте ей корону! Я хочу полететь!"
 fab_ac_vale.0010.option2:0 "Нет. Я король, а короли хранят свои короны."
 fab_ac_vale.0011:0 "Орлиное гнездо отвергает Висенью"
 fab_ac_vale.0011.desc:0 "Висенья достигла Орлиного гнезда и встретила молодого короля Роннеля в собственном саду. Мальчику очень хотелось полететь на Вхагар, но Висенья ясно дала понять, что такой подарок последует только после того, как Долина подчинится. Королева-регент Шарра отказалась от этого требования. \n \nВместо того, чтобы нанести удар по ребенку, Висенья обратился против регентства, которое поддерживало его сопротивление. Шарра мертва, и Долине предстоит найти другую руку, чтобы управлять ею. \n \nБолее мудрый регент все же может принять мир. А до тех пор наши армии должны смотреть в сторону Кровавых Врат."
 fab_ac_vale.0011.option1:0 "Их отказ означает лишь новую войну."
 fab_ac_vale.0012:0 "Король, который летал"
 fab_ac_vale.0012.desc:0 "Ворон Висеньи из Долины больше похож на шутку, чем на сообщение о завоевании — и все же Долина принадлежит мне.\n\nШарра Аррен сделала все, что должен был регент. Кровавые Врата были укомплектованы людьми и снабжены продовольствием; армия стояла наготове у Врат Луны; Само Орлиное гнездо, которое ни один враг никогда не брал, было забито запасами на годы осады. Так что моя сестра не беспокоилась ни о чем из этого. Вхагар поднялся над Копьем Гиганта и спустился в собственный сад Гнезда — и когда Королева-Регент бросилась к своему сыну, она обнаружила мальчика-короля Горы и Долины, сидящего на коленях Висеньи и с изумлением смотрящего на дракона. #italic «Мама», #! спросил он ее, #italic «Могу ли я полететь с этой дамой?» #!\n\nШарра Аррен посмотрела на своего ребенка на руках королевы драконов и в одно мгновение поняла все, что имело значение. Она отдала короны Дома Арренов и тут же присягнула Долине на верность — и Висенья, которая сдерживает все свои обещания, исполнила желание юного Роннеля. Мальчик полетел с ней на Вхагар, трижды обогнул вершину Копья Гиганта и, смеясь, вернулся к матери.\n\nОтныне Дом Арренов будет править не как короли, а как Лорды Орлиного гнезда и Стражи Востока. Жители уже нашли мальчику имя: Летающий Король.\n\n#bold Королевство, которое еще не завоевала ни одна армия, завоеванное ценой поездки на драконе. Висенья никогда не позволит мне забыть об этом.#!"
 fab_ac_vale.0012.option1:0 "Корона в обмен на полёт на драконе."
 fab_ac_vale.0013:0 "Сокол складывает крылья"
 fab_ac_vale.0013.desc:0 "Это сделано. Рыцари Долины сражались так же храбро, как и все люди в Вестеросе, и это не имело никакого значения — стены, перевалы и высоты ничего не значат для врага, владеющего небом.\n\nКороны Горы и Долины, которые носили со времен Рыцаря Сокола, сдаются. Мы преклоняем колени, клянемся, служим. Дом Аррен сохраняет за собой Орлиное гнездо и охрану Востока, а это больше, чем обычно дают побежденным, и я теперь достаточно взрослый, чтобы понимать, что нам повезло с нашим победителем.\n\nВ моем доме всегда говорили: «Высоко, как честь». Есть честь и в том, чтобы хранить верность присягнувшему королю. Мы этому научимся."
 fab_ac_vale.0013.desc.submit:0 "Проходы Долины остаются под охраной, а Гнездо остается нетронутым, но ни один из них не может остановить дракона с неба. Я предпочитаю отказаться от корон Горы и Долины, прежде чем храбрость превратится в длинный список могил.\n\nМы преклоняем колени, клянемся, а Дом Аррен сохраняет Орлиное гнездо под новым троном Эйгона. В моем доме всегда говорили: «Высоко, как честь». Для меня большая честь сохранить тех, кто находится под моей опекой."
 fab_ac_vale.0013.option1:0 "Честь стоит выше страха."
 fab_ac_vale.0014:0 "Поверженный сокол"
 fab_ac_vale.0014.desc:0 "Говорили, что Орлиное гнездо невозможно завоевать. Его башни возвышаются над облаками, бледнея на фоне пустого неба, и каждая извилистая миля под ними была куплена кровью: Кровавые Врата сломаны, Врата Луны поддались, и горная дорога открылась под тенью драконов.\n\nСейчас я сижу в высоком зале Арренов, а за его узкими арками голубое небо. Короны Горы и Долины лежат у моих ног. [fab_vale_warden.GetTitledFirstName] из Дома [fab_vale_warden.GetHouse.GetName] преклоняет колени там, где короли соколов когда-то получали дань уважения от меньших людей. Начал ли [fab_vale_warden.GetSheHe] эту войну или унаследовал ее руины, не имеет значения больше, чем имена погибших внизу. Живые должны ответить за царство, которое они унаследовали.\n\nЛорды Долины преклоняют колени перед [fab_vale_warden.GetHerHim], гордые люди, кланяющиеся в кольчугах, все еще пострадавшие от кампании. Я оставляю им их древние дома, их горные крепости и Арренского Стража, если кровь Арренов еще сохраняет этот титул. Я беру на себя их королевскую власть. Сокол все еще может летать над Орлиным гнездом, но никогда больше не над драконом.\n\n#bold Даже самый высокий замок Вестероса должен смотреть вверх, когда над головой пролетают драконы. #!"
 fab_ac_vale.0014.option1:0 "Поднимитесь, [fab_vale_warden.GetFirstName]. Удерживайте Восток для Железного Трона."
 fab_ac_vale.0015:0 "Сын для Дракона"
 fab_ac_vale.0015.desc:0 "Ворон из королевского двора: у Эйгона есть собственный сын.\n\nВ письме матери говорилось, что я буду наследником дракона, пока этот день не наступит, и вот он настал, и глашатаи уже перестали произносить мое имя вслед за его. Мейстер Айва говорит, что обещание, имеющее конец, по-прежнему остается обещанием, и что Долина сегодня не меньше, чем была вчера.\n\nЭто не меньше. Оно только чувствует это."
 fab_ac_vale.0015.a:0 "Долина всегда принадлежала мне. И по-прежнему принадлежит."
