l_russian:
 fab_ac_vale.0001:0 "Флот направляется в Чаячий город"
 fab_ac_vale.0001.desc:0 "Короне нужны порты, а лучший из восточных портов, ещё не принадлежащих мне, — Чаячий город, большой город Долины на берегу залива. Пока моё войско разбирается с рекой и бурей, море принесёт войну Арренам.\n\nЯ поручил королевский флот Деймону Велариону, Владыке Приливов, — хозяину крупнейшего военного флота Узкого моря, родичу моей матери и лучшему моряку, когда-либо поднимавшему якорь у Дрифтмарка. С ним отправляется Висенья на Вхагар, чтобы любые силы, собранные Арренами, сражались в тени дракона. Приказ прост: взять Чаячий город и принести войну к порогу Долины.\n\nОрлиное Гнездо не станет бездействовать. Наши друзья за морем пишут, что Шарра Аррен забирает корабли из всех портов Долины, собирая флот, а дюжина браавосских боевых кораблей за её деньги присоединилась к нему. Я буду ждать.\n\n#bold Дракон владеет небом, а род Веларионов уже сто лет владеет Узким морем. Что против этого один наёмный флот?#!"
 fab_ac_vale.0001.option1:0 "Возьмите Чаячий город, мой Владыка Приливов."
 fab_ac_vale.0002:0 "Битва в водах у Чаячьего города"
 fab_ac_vale.0002.desc:0 "Море преподало мне урок, которого не могла преподать суша: даже дракон может проиграть.\n\nУ Чаячьего города галеры Деймона встретились с наспех собранным флотом Арренов, усиленным дюжиной браавосских кораблей. Пурпурные паруса, железные тараны, команды, привыкшие к морским сражениям, и капитаны, не испугавшиеся дракона. Они прорвали наш строй, взяли флагманские корабли на абордаж и разгромили королевский флот.\n\nДеймон погиб — его сразили на горящей палубе, когда вокруг гибли его корабли. Родич моей матери, моя опора на море. С ним на дно ушла половина морской мощи Дрифтмарка.\n\n#bold Сегодня вечером вороны принесут в Орлиное Гнездо поздравления. Пусть Аррены порадуются. Висенья видела битву с высоты — а она не прощает.#!"
 fab_ac_vale.0002.option1:0 "Деймон, Владыка Приливов. Да упокоит его море."
 fab_ac_vale.0003:0 "Ответ Вхагар"
 fab_ac_vale.0003.desc:0 "Флот Арренов пережил наш меньше чем на час.\n\nВисенья наблюдала за битвой со спины Вхагар, а затем обрушилась на победителей, ещё не смолкших от ликования. Она летала над бухтой взад и вперёд, неторопливо, словно крестьянка, выжигающая жнивьё. Большие корабли, галеры, браавосцы — всё обратилось в огонь. Чаячий город смотрел, как его флот догорает до самой ватерлинии.\n\nДва флота вошли в бухту. Ни один не вышел. Если считать корабли, вышла ничья. Но Чаячий город не взят, и флота, который мог бы его взять, у меня больше нет. Это поражение — первое в этой войне. Оно должно стать последним.\n\n#bold Долина купила себе время ценой всех своих кораблей.#!"
 fab_ac_vale.0003.option1:0 "Победа, которая не оставляет флота, — это не победа."
 fab_ac_vale.0004:0 "Королева Трёх Сестёр"
 fab_ac_vale.0004.desc:0 "Победа обошлась Долине во весь её флот. Теперь Арренам приходится расплачиваться.\n\nС Пасти пришла весть: Три Сестры восстали. Островитяне — грабители разбитых кораблей, контрабандисты и рыбаки — никогда не любили Арренов. Они знали, что флота у тех больше нет. Наместников из Долины бросили в море, острова объявили независимыми от Гор и Долины, а Марлу Сандерленд, леди Систертона, провозгласили первой за тысячу лет королевой Сестёр.\n\nШарра ничего не может сделать. Без кораблей Сестры для неё словно другой мир. Меня это устраивает: чем больше тревог у Орлиного Гнезда, тем меньше воинов у Кровавых Врат.\n\n#bold Пусть самозваная королева пока владеет своими мокрыми скалами. Короны, рождённые смутой, падают вместе с её концом.#!"
 fab_ac_vale.0004.option1:0 "Разберёмся с мятежами поочерёдно. Сначала Долина."
 fab_ac_vale.0005:0 "Восстание жителей Трёх Сестёр"
 fab_ac_vale.0005.desc:0 "Между Стеной и марками осталась лишь одна корона, открыто бросающая мне вызов: королева корабельных грабителей на мокрой скале в Пасти. Елей после моего помазания едва успел высохнуть, а уже пора отобрать корону у Марлы.\n\nЭтим займётся [fab_north_warden.GetFirstName], мой Хранитель Севера. Корабельные грабители давно разоряют [fab_north_warden.GetHerHis] берега. Пусть Север и ответит им: враг рядом.\n\nПосле Чаячьего города флот Долины всё ещё существует лишь в виде брёвен на верфях. Север нанял суда: сир Уоррик Мандерли ведёт северян на браавосских галерах. Тот самый город, чьи корабли потопили мой флот, теперь за деньги перевозит мои войска. Орлиное Гнездо пришлёт столько воинов, сколько сможет, а Белая Гавань — собственные корабли. Над ними на Вхагар полетит Висенья. На Сёстрах помнят, как она сожгла флот победителей. Вспомнят и тогда, когда на горизонте появятся паруса.\n\n#bold Последняя корона, самый жалкий трон. Принесите её мне.#!"
 fab_ac_vale.0005.option1:0 " #S Покончите с мятежом, [fab_north_warden.GetFirstName]. #!"
 fab_ac_vale.0006:0 "Три Сестры преклоняют колено"
 fab_ac_vale.0006.desc:0 "Битвы не было. Да что там — почти не было и споров.\n\nИз Систертона увидели флот на горизонте: нанятые Уорриком браавосские галеры с северными копейщиками, за ними корабли Белой Гавани, а над всеми — Висенья. Мятеж закончился между двумя приливами. Островитяне помнили, как Вхагар сожгла флот, который ПОБЕДИЛ, и не хотели той же участи для своих городов.\n\nОни свергли Марлу и выдали её своим же лордам. Власть перешла к её младшему брату Стеффону: на берегу он преклонил колено, признав Железный трон и верховную власть Орлиного Гнезда над островами. Одного из его сыновей Мандерли забрал воспитанником и заложником; второго забрали Аррены.\n\nМарла пробыла королевой одну зиму. Корону она сменила на серые одежды Молчаливых Сестёр. Это милость: больше ей не придётся говорить об измене. Больше ей вообще не придётся говорить.\n\n#bold Последняя корона пала. Королевство едино.#!"
 fab_ac_vale.0006.option1:0 "Серые одежды ей идут больше короны."
 fab_ac_vale.0006.desc.kinsman:0 "Битвы не было. Да что там — почти не было и споров.\n\nИз Систертона увидели флот на горизонте: нанятые браавосские галеры с северными копейщиками, за ними корабли Белой Гавани, а над всеми — Висенья. Мятеж закончился между двумя приливами. Островитяне помнили, как Вхагар сожгла флот, который ПОБЕДИЛ, и не хотели той же участи для своих городов.\n\nОни свергли Марлу и выдали её своим же лордам. Стеффон мёртв, и теперь её дом представляет [fab_sisters_heir.GetFirstName]: на берегу новый глава рода преклоняет колено, признавая Железный трон и верховную власть Орлиного Гнезда над островами. Заложников из рода Сандерлендов увозят в Белую Гавань и Орлиное Гнездо.\n\nМарла пробыла королевой одну зиму. Корону она сменила на серые одежды Молчаливых Сестёр. Это милость: больше ей не придётся говорить об измене. Больше ей вообще не придётся говорить.\n\n#bold Последняя корона пала. Королевство едино.#!"
 fab_ac_vale.0006.desc.attainted:0 "Битвы не было. Да что там — почти не было и споров.\n\nИз Систертона увидели флот на горизонте: нанятые браавосские галеры с северными копейщиками, за ними корабли Белой Гавани, а над всеми — Висенья. Мятеж закончился между двумя приливами. Островитяне помнили, как Вхагар сожгла флот, который ПОБЕДИЛ, и не хотели той же участи для своих городов.\n\nОни свергли Марлу и выдали её своим же лордам. Стеффон мёртв, и в роду не осталось подходящего наследника. Сестры переходят под прямую власть Орлиного Гнезда: Сандерлендам не оставят титул, под которым они подняли мятеж.\n\nСама Марла сменила корону на серые одежды Молчаливых Сестёр. Это милость: больше ей не придётся говорить об измене. Больше ей вообще не придётся говорить.\n\n#bold Последняя корона пала. Королевство едино.#!"
 fab_ac_vale.0007:0 "Мать пишет письмо"
 fab_ac_vale.0007.desc:0 "В Орлином Гнезде все шепчутся о драконах и павших королевствах. Мать запирается с советниками, а мне никто ничего не рассказывает, потому что мне восемь.\n\nНо я подслушал. Мать написала королю Эйгону. Она предлагает ВЫЙТИ ЗА НЕГО ЗАМУЖ, а раз у него нет сына — пусть назовёт МЕНЯ своим наследником.\n\nНаследником всего Вестероса! Марвин говорит, чтобы я не слишком надеялся: мать просто тянет время. Но если Эйгон согласится, мне достанется и Долина, и всё остальное. А на свадьбе будет дракон!"
 fab_ac_vale.0007.option1:0 "Теперь мы ждем ответа повелителя драконов."
 fab_ac_vale.0008:0 "Слово из Орлиного гнезда"
 fab_ac_vale.0008.desc:0 "Сокол увидел, куда дует ветер. Ворон из Орлиного гнезда приносит весть от Шарры Аррен, королевы-регентши Долины — и на этот раз она не пишет о союзах между равными. Короли, бросившие мне вызов, мертвы или преклонили колени, и Долина не желает присоединяться к ним; то, что она предлагает сейчас, — это подчинение. Своего рода.\n\n"
 fab_ac_vale.0008.option1:0 "Никакого брака. Висенья ответит Орлиному гнезду — по-своему."
 fab_ac_vale.0008.option2:0 "Я женюсь на Шарре. Мальчик — мой наследник, пока у меня не родится сын."
 fab_ac_vale.0008.option2.heir:0 "Я женюсь на Шарре, но у Железного Трона уже есть наследник."
 fab_ac_vale.0008.option2.heir_tt:0 "[fab_ac_eyrie_boy.GetFirstName] не будет назван наследником: у короля уже есть дети его собственной крови."
 fab_ac_vale.0008.option3:0 "#S Долину нужно завоевать, как и все остальные: огнем и кровью. #!"
 fab_ac_vale.0008.desc.early:0 "Сокол понял, куда дует ветер. Ворон из Орлиного Гнезда принёс письмо Шарры Аррен, королевы-регентши Долины. На этот раз она не предлагает союза равных. Против меня ещё стоят короли, ещё носят свои короны, но Шарра не собирается ждать, чтобы узнать, окажется ли их участь лучше участи уже павших. Теперь, прежде чем хоть один дракон повернёт к её горам, она предлагает покориться. На свой лад.\n\n"
 fab_ac_vale.0008.desc.terms:0 "Её условия обёрнуты шёлком. Долина преклонит колено, пишет она, если я возьму её в жёны и объявлю её мальчика Роннела своим наследником. Моим наследником! Раз у меня нет сына, я должен пообещать все свои завоевания соколёнку. В письмо снова вложен портрет. Горный Цветок — так называют её певцы Долины, и художник старательно отработал свою плату. Признаю: женщина она красивая. И на десять лет старше меня. А те, кто зовёт её первой красавицей Вестероса, явно ни разу не видели валирийку.\n\n"
 fab_ac_vale.0008.desc.terms.heir:0 "Её условия обёрнуты шёлком. Долина преклонит колено, пишет она, если я возьму её в жёны и объявлю её мальчика Роннела своим наследником. Моим наследником! Будто у Железного трона ещё нет наследников моей крови — а она хочет поставить соколёнка выше них. В письмо снова вложен портрет. Горный Цветок — так называют её певцы Долины, и художник старательно отработал свою плату. Признаю: женщина она красивая. И на десять лет старше меня. А те, кто зовёт её первой красавицей Вестероса, явно ни разу не видели валирийку.\n\n"
 fab_ac_vale.0008.desc.close:0 "И всё же мне не до смеха. За этим письмом стоит последнее королевство, которого ещё никто не покорял: Кровавые Ворота, разбившие каждое посланное против них войско, и Орлиное Гнездо над облаками, где шесть тысяч лет не ступала нога врага. Эти условия продиктовала гордыня — но, если я отвечу неверно, отстаивать их будут камень и небо.\n\n#bold Рука вдовы, горное королевство и мальчик на слишком большом троне. Завладеть Долиной можно по-разному.#!"
 fab_ac_vale.0009:0 "Дракон в отчимах"
 fab_ac_vale.0009.desc:0 "Мать вышла за него замуж! Король-дракон теперь мой отчим, а я стану его наследником, как она и просила в письме. И НИКОМУ в Долине не придётся воевать!\n\nМейстер Квинс говорит, что я должен держаться серьёзно: это важное государственное дело. Я очень стараюсь быть серьёзным.\n\nНо у него же ДРАКОН! Самый большой, чёрный. Может, когда я подрасту, он разрешит мне на нём полетать."
 fab_ac_vale.0009.desc.no_heir:0 "Мать вышла за него замуж! Король-дракон теперь мой отчим, и НИКОМУ в Долине не придётся воевать.\n\nТолько наследником я всё-таки не стану. У него уже есть свои дети, и мейстер Квинс говорит, что на эту просьбу из письма король бы никогда не согласился. Но держаться всё равно надо серьёзно: это ведь важное государственное дело. Я очень стараюсь быть серьёзным.\n\nНо у него же ДРАКОН! Самый большой, чёрный. Может, когда я подрасту, он разрешит мне на нём полетать."
 fab_ac_vale.0009.option1:0 "Я полечу над всем миром!"
 fab_ac_vale.0010:0 "Дама во дворе"
 fab_ac_vale.0010.desc:0 "Мать повсюду расставила солдат. В Чаячьем городе возвели новые стены, в Кровавых Вратах засело целое войско, а в Камне, Снеге и Небе воинов стало втрое больше. Все говорили, что Орлиное Гнездо — самый надёжный замок на свете: ни одна армия не взберётся на Копьё Гиганта.\n\nНо дама не привела армию. Я был на уроке, когда всё небо потемнело. Самый большой дракон в мире опустился прямо посреди сада и уселся там, складывая крылья, как наши соколы.\n\nДама в доспехах посадила меня к себе на колени и дала рассмотреть дракона вблизи. От него пахло раскалённым железом, а глаза пылали, как огонь под огромными котлами. Потом прибежала мать со всеми стражниками и стала белой как молоко. Дама только улыбнулась ей. И я спросил: «Мама, можно мне полетать с этой дамой?»"
 fab_ac_vale.0010.option1:0 "Отдайте ей корону! Я хочу полететь!"
 fab_ac_vale.0010.option2:0 "Нет. Я король, а короли не отдают свои короны."
 fab_ac_vale.0011:0 "Орлиное Гнездо отвергает требование Висеньи"
 fab_ac_vale.0011.desc:0 "Висенья добралась до Орлиного Гнезда и встретила юного короля Роннела прямо в замковом саду. Мальчик мечтал полетать на Вхагар, но Висенья дала понять: такой дар он получит лишь после покорения Долины. Королева-регентша Шарра отвергла её требование. \n \nВисенья не стала трогать ребёнка. Вместо этого она расправилась с регентшей, поддерживавшей его сопротивление. Шарра мертва, и теперь Долине придётся искать нового правителя. \n \nБолее мудрый регент, быть может, согласится на мир. А пока нашим войскам предстоит идти к Кровавым Вратам."
 fab_ac_vale.0011.option1:0 "Их отказ означает лишь новую войну."
 fab_ac_vale.0012:0 "Король, который летал"
 fab_ac_vale.0012.desc:0 "Письмо Висеньи из Долины больше похоже на шутку, чем на донесение о завоевании. И всё же Долина теперь моя.\n\nШарра Аррен сделала всё, что полагается регентше. В Кровавых Вратах стоял гарнизон и было вдоволь провизии; в Лунных Вратах ждало войско; само Орлиное Гнездо, куда ещё не входил ни один враг, запаслось на годы осады. Поэтому моя сестра не стала связываться ни с чем из этого. Вхагар взмыла над Копьём Гиганта и опустилась прямо в саду Орлиного Гнезда. Когда королева-регентша прибежала к сыну, мальчик-король Гор и Долины сидел на коленях у Висеньи и с восторгом смотрел на дракона. #italic «Мама,#! — спросил он, — #italic можно мне полетать с этой дамой?»#!\n\nШарра Аррен взглянула на своего ребёнка в объятиях королевы-дракона и в одно мгновение поняла всё самое важное. Она отдала короны дома Аррен и тут же присягнула от имени Долины. А Висенья, которая всегда держит слово, исполнила желание юного Роннела. Мальчик взлетел с ней на Вхагар, трижды облетел вершину Копья Гиганта и вернулся к матери со смехом.\n\nОтныне Аррены будут править не как короли, а как лорды Орлиного Гнезда и Хранители Востока. Простой народ уже нашёл мальчику прозвище: Летавший Король.\n\n#bold Королевство, которого не покорила ни одна армия, досталось нам за один полёт на драконе. Висенья никогда не даст мне этого забыть.#!"
 fab_ac_vale.0012.option1:0 "Корона в обмен на полёт на драконе."
 fab_ac_vale.0013:0 "Сокол складывает крылья"
 fab_ac_vale.0013.desc:0 "Всё кончено. Рыцари Долины сражались не менее храбро, чем лучшие воины Вестероса. Это ничего не изменило: стены, перевалы и высоты бессильны против врага, которому принадлежит небо.\n\nМы отдаём короны Гор и Долины, которые носили со времён Соколиного Рыцаря. Мы преклоняем колени, присягаем, служим. Дом Аррен сохраняет Орлиное Гнездо и звание Хранителей Востока — побеждённым редко оставляют столько. Теперь я достаточно взрослый, чтобы понимать: нам повезло с завоевателем.\n\n«Высокий как честь» — так всегда гласил девиз моего дома. Хранить верность королю, которому присягнул, тоже почётно. Мы этому научимся."
 fab_ac_vale.0013.desc.submit:0 "Перевалы Долины ещё под охраной, Орлиное Гнездо ещё неприступно, но ни то ни другое не преградит дракону путь по небу. Я решаю отдать короны Гор и Долины, пока наша храбрость не обернулась лишь новыми могилами.\n\nМы преклоняем колени и присягаем. Дом Аррен сохраняет Орлиное Гнездо под властью нового трона Эйгона. «Высокий как честь» — так всегда гласил девиз моего дома. Сберечь тех, кто вверен моей заботе, тоже почётно."
 fab_ac_vale.0013.option1:0 "Честь стоит выше страха."
 fab_ac_vale.0014:0 "Поверженный сокол"
 fab_ac_vale.0014.desc:0 "Говорили, Орлиное Гнездо невозможно покорить. Его светлые башни стоят над облаками на фоне пустого неба. За каждую милю извилистой дороги под ними заплачено кровью: Кровавые Врата разбиты, Лунные Врата сдались, горная дорога открылась под тенью драконов.\n\nТеперь я сижу в высоком зале Арренов, за узкими арками которого синеет небо. Короны Гор и Долины лежат у моих ног. Передо мной преклоняет колени [fab_vale_warden.GetTitledFirstName], чей дом — [fab_vale_warden.GetHouse.GetName], там, где короли-соколы некогда принимали почести от своих вассалов. Неважно, какую роль [fab_vale_warden.GetSheHe] играет в этой войне — зачинщика или наследника её разорения. Теперь это значит не больше, чем имена погибших внизу. Живые должны отвечать за доставшееся им королевство.\n\nЛорды Долины тоже становятся на колени, признавая [fab_vale_warden.GetHerHim] своим главой. Гордые люди с трудом склоняют спины; их кольчуги ещё хранят следы похода. Я оставляю им древние дома, горные замки и Хранителя из рода Арренов, если титул ещё принадлежит этому роду. Отнимаю я лишь королевскую власть. Сокол по-прежнему может парить над Орлиным Гнездом, но больше никогда — над драконом.\n\n#bold Даже из самого высокого замка Вестероса приходится смотреть вверх, когда над ним летят драконы.#!"
 fab_ac_vale.0014.option1:0 "Поднимитесь, [fab_vale_warden.GetFirstName]. Храните Восток во имя Железного трона."
 fab_ac_vale.0015:0 "Сын дракона"
 fab_ac_vale.0015.desc:0 "Ворон из королевского двора принёс весть: у Эйгона родился собственный сын.\n\nВ письме матери было сказано, что я останусь наследником дракона до этого дня. Теперь он настал, и глашатаи уже перестали называть моё имя вслед за его именем. Мейстер Квинс говорит, что обещание, данное до определённого срока, всё равно исполнено честно. И что сегодня Долина ничуть не меньше, чем вчера.\n\nНе меньше. Только кажется, что меньше."
 fab_ac_vale.0015.a:0 "Долина всегда принадлежала мне. И по-прежнему принадлежит."
