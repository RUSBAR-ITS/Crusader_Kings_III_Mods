l_russian:
 fab_ac_oldtown.0002:0 "От гор до песков"
 fab_ac_oldtown.0002.desc:0 "К югу от всех моих владений остаётся ещё одна держава — Дорн. И он не похож ни на одного из прежних противников.\n\nМартеллы Солнечного Копья никогда не были королями. По обычаю ройнаров они именуют себя принцами. Десять тысяч кораблей Нимерии сделали их теми, кто они есть, и уже семьсот лет её потомки защищают Дорн и от Королей Бури, и от Гарденеров. Их пустыни поглощали вторгавшиеся войска, горы хоронили остальных. Правит ими Мерия Мартелл — восьмидесятилетняя, слепая, необъятно тучная. Жёлтая Жаба, как зовут её враги; впрочем, проку от этого прозвища врагам немного. Однажды она уже писала мне, предлагая союз против Аргилака как равная равному. Тогда я отказал. Теперь Аргилак мёртв, а равных мне больше нет.\n\nРейнис летит в Солнечное Копьё, чтобы под крышей старой принцессы предложить ей выбор: преклонить колено или встретить дракона. Их девиз — #italic «Непреклонные, несгибаемые, несдающиеся»#!. Гордые слова для народа, ещё не знавшего драконьего пламени.\n\n#bold Посмотрим, останутся ли они верны этим словам, когда встретятся с драконом.#!"
 fab_ac_oldtown.0002.option1:0 "Наше войско поворачивает на юг."
 fab_ac_oldtown.0003:0 "Пустые пески"
 fab_ac_oldtown.0003.desc:0 "Первое письмо Рейнис с юга рассказывает о войне, не похожей ни на одну из прежних.\n\nУ Принцева перевала, прохода через Красные горы, стояло войско дорнийских копейщиков. Поэтому через горы она не пошла. Мераксес взмыла над перевалом, над красными и белыми песками и опустилась у замка Вейтов, чтобы потребовать покорности.\n\nОн оказался пуст. Его не брали штурмом, из него не бежали в панике: его оставили намеренно, забрав последнее копьё и последний мешок зерна. В городке под стенами остались лишь женщины, дети и старики. Они носили воду и пасли коз, будто дракон на рыночной площади был не удивительнее пыльной бури. Когда сестра спросила, куда ушли лорды и воины, все ответили одинаково — вежливо и непроницаемо, словно запертые ворота:\n\n#bold «Ушли».#!\n\nХаррен укрылся за камнем, и камень расплавился. Аргилак вышел на бой и погиб. Дорнийцы намерены укрыться за самой пустотой — а пустота не горит.\n\n#bold Рейнис летит дальше, к Солнечному Копью. Если лорды Дорна не примут её, примет их принцесса.#!"
 fab_ac_oldtown.0003.option1:0 "Тогда в Солнечное Копье."
 fab_ac_oldtown.0004:0 "Жёлтая Жаба"
 fab_ac_oldtown.0004.desc:0 "В Солнечном Копье, древнем замке Мартеллов, сестру встретила та же вызывающая тишина. Извилистые переулки теневого города опустели, Старый дворец стоял открытым и без охраны. Но этот замок был не совсем пуст. В своём зале, одна под знамёнами с солнцем и копьём, принцесса Дорна ждала дракона.\n\nМерия Мартелл правит Дорном шестьдесят лет. Ей восемьдесят; она очень тучна, слепа и почти облысела, кожа пожелтела и обвисла. Враги давно прозвали её Жёлтой Жабой Дорна. Большинство этих врагов уже обратилось в прах, а она всё ещё сидит на своём троне. Ни возраст, ни слепота ничуть не притупили её ум. Королеву Вестероса она приветствовала сидя, без страха и церемоний.\n\nОна не грозила ни знамёнами, ни войсками. Её ответ был куда труднее опровергнуть:\n\n#bold «Я не стану сражаться с вами и не преклоню перед вами колени. У Дорна нет короля. Передайте это своему брату».#!"
 fab_ac_oldtown.0004.option1:0 "#bold Передам. Но мы вернёмся, принцесса... #!"
 fab_ac_oldtown.0004.option2:0 "#bold ...и в следующий раз мы придём с пламенем и кровью.#!"
 fab_ac_oldtown.0005:0 "Дорн не преклонит колени"
 fab_ac_oldtown.0005.desc:0 "Старая принцесса выслушала предупреждение сестры, даже не моргнув. Королева Таргариенов с драконом на пороге сулила пламя и кровь, а Жёлтая Жаба словно слушала жалобы торговки рыбой на погоду. Затем она ответила — и, подозреваю, певцы сохранят её слова дольше, чем большинство королевских речей:\n\n#bold «Это ваши слова. Наши — „Непреклонные, несгибаемые, несдающиеся“. Вы можете сжечь нас, миледи... но не согнуть, не сломить и не заставить склониться. Это Дорн. Вам здесь не рады. Вернётесь — пеняйте на себя».#!\n\nТак королева и принцесса расстались, а Дорн остался непокорённым.\n\nСлепая старуха, одна в пустом замке, сделала то, чего не смогли камень Харрена, буря Аргилака и железный кулак Двух Королей: отправила Таргариен домой, так и не покорившись ей. Такая дерзость вызывает некоторое уважение, не стану отрицать. Но ничего не меняет. Расплата для Дорна отложена, а не отменена.\n\n#bold Жаба пока сохранит свои пустыни. Сперва меня ждёт корона в Староместе.#!"
 fab_ac_oldtown.0005.option1:0 "Королева и принцесса расстались, а Дорн остался неподвластен Железному трону."
 fab_ac_oldtown.0006:0 "Жаба принимает дракона"
 fab_ac_oldtown.0006.desc:0 "Мне передали, что королева-дракон застала Вейт именно таким, каким я его оставила: замок пуст, зерно вывезено, в городке — только старухи и малыши с одним ответом для неё. Ушли. Тех, кто ушёл, не сожжёшь.\n\nОна явилась в Солнечное Копьё — я знала, что так и будет, — и застала меня одну в моём зале. Мне восемьдесят лет, я слепая, толстая и почти лысая. Полвека назад враги прозвали меня Жёлтой Жабой; с тех пор я похоронила почти всех. Дракон на пороге не заставит моё сердце биться чаще.\n\nЯ сказала прямо: не стану с вами сражаться и не преклоню перед вами колени. У Дорна нет короля. Передайте это своему брату.\n\nОна обещала вернуться с пламенем и кровью. Их коротенький девиз. Я ответила нашим — «Непреклонные, несгибаемые, несдающиеся» — и отправила её к брату ни с чем. Пусть короли лугов и рек преклоняют колени. Здесь Дорн."
 fab_ac_oldtown.0006.option1:0 "Королева и принцесса расстались, а Дорн по-прежнему никому не поклонился."
 fab_ac_oldtown.0007:0 "Ответ моей матери и мой"
 fab_ac_oldtown.0007.desc:0 "Королева-дракон пересекла Красные горы единственным способом, который ничего не стоил Дорну, — пролетела над ними. Вейт оказался пуст до последнего копья, как и задумала моя мать до того, как боги забрали её. Жёлтой Жабы нет, но её замысел живёт. Я ничего в нём не изменил.\n\nНаконец Рейнис Таргариен явилась в Солнечное Копьё. Вместо старухи, для которой она готовила учтивые речи, её встретил я — один в зале, где моя мать правила шестьдесят лет.\n\nЯ дал ответ, доставшийся мне вместе с троном. Сражаться с ней не стану: её дракону здесь не с кем воевать. Колени не преклоню: у Дорна нет короля, которого можно покорить. Как заведено в её доме, она обещала пламя и кровь. Я ответил нашим девизом — «Непреклонные, несгибаемые, несдающиеся». Остальное сказали пустые пески."
 fab_ac_oldtown.0007.option1:0 "Королева и принц расстались, а Дорн по-прежнему никому не поклонился."
 fab_ac_oldtown.0008:0 "Ответ моей матери и мой"
 fab_ac_oldtown.0008.desc:0 "Королева-дракон пересекла Красные горы единственным способом, который ничего не стоил Дорну, — пролетела над ними. Вейт оказался пуст до последнего копья, как и задумала моя мать до того, как боги забрали её. Жёлтой Жабы нет, но её замысел живёт. Я ничего в нём не изменил.\n\nНаконец Рейнис Таргариен явилась в Солнечное Копьё. Вместо старухи, для которой она готовила учтивые речи, её встретил я — один в зале, где моя мать правила шестьдесят лет.\n\nЯ дал ответ, доставшийся мне вместе с троном. Сражаться с ней не стану: её дракону здесь не с кем воевать. Колени не преклоню: у Дорна нет короля, которого можно покорить. Как заведено в её доме, она обещала пламя и кровь. Я ответил нашим девизом — «Непреклонные, несгибаемые, несдающиеся». Остальное сказали пустые пески."
 fab_ac_oldtown.0008.option1:0 "Королева и принц расстались, а Дорн по-прежнему никому не поклонился."
 fab_ac_oldtown.0009:0 "Рейнис возвращается домой"
 fab_ac_oldtown.0009.desc:0 "Мераксес вернулась домой, а с ней и моя сестра — впервые за всё Завоевание с пустыми руками. Она к этому не привыкла. Я тоже.\n\nДо глубокой ночи мы обсуждали, во что выльется война с Дорном. Правда не по душе нам обоим. Там нет войска, которое можно разбить, гордого короля, который выйдет против меня в поле, замка, сожжением которого можно всё закончить. Только песок, жажда, пустые крепости и копья, что бьют из-за скал и исчезают. Драконы побеждают в битвах; Дорн битв не даёт. Покорение пустынь стоило бы мне долгих лет и множества войск. Только что сшитое королевство ещё слишком непрочно, чтобы позволить себе такую цену.\n\nПусть Дорн пока сохраняет пески, а старуха — свой трон. Но не стоит принимать терпение за прощение.\n\n#bold На юго-запад, к последним великим вратам, ещё не открывшимся передо мной: в Старомест, к верховному септону и Хайтауэру. Вере пора встретиться с драконом.#!"
 fab_ac_oldtown.0009.option1:0 "Дорн подождёт. Старомест — нет."
 fab_ac_oldtown.0010:0 "Маяк Староместа"
 fab_ac_oldtown.0010.desc:0 "Хайтауэр поднимается над горизонтом задолго до того, как становятся видны стены Староместа. Огонь маяка бледно горит на фоне южного неба. Под ним лежит величайший город Вестероса: Цитадель с учёными в сером, Звёздная септа с Отцом Правоверных, пристани, на которых теснится половина богатств королевства. Здесь больше жителей, чем в иных королевствах.\n\nВерховный септон провёл в молитве семь дней и семь ночей. Из города передают: Старица показала ему Старомест в драконьем пламени, если Хайтауэры окажут мне сопротивление. Но видения не открывают ворот, а священные советы не всегда вразумляют гордого лорда.\n\nМоё войско идёт по Дороге Роз под знаменем трёхглавого дракона. Сквозь утреннюю дымку всё отчётливее проступают стены. На моих глазах огонь на вершине Хайтауэра меняет цвет.\n\n#bold Сейчас я узнаю, последовал ли Старомест за светильником Старицы.#!"
 fab_ac_oldtown.0010.a:0 "Дракон летит над открытыми воротами. Старомест сделал мудрый выбор."
 fab_ac_oldtown.0010.b:0 "Маяк горит зелёным. Старомест созвал вассалов."
 fab_ac_oldtown.0011:0 "Зелёный огонь маяка"
 fab_ac_oldtown.0011.desc:0 "На вершине Хайтауэра пылает зелёный огонь.\n\nВорота заперты. Медовичку перегородила огромная цепь, и все колокола Староместа зовут людей к оружию вместо молитвы. Из садов и деревень за стенами сходятся под своими знамёнами вассалы Хайтауэров, отзываясь на зелёное пламя над городом. Верховный септон советовал покориться; вместо него ответила гордыня.\n\nВоеначальники предупреждают: даже короткая осада потребует золота, людей и времени. Стены Староместа крепки, но от Харренхола до Орлиного Гнезда камень уже не раз отступал передо мной. Никакая стена не закроет небо.\n\n#bold Старица показала им огонь. Лорд Хайтауэр решил увидеть его собственными глазами.#!"
 fab_ac_oldtown.0011.a:0 "Перекройте все дороги и поднимите драконов в небо. Старомест откроет ворота."
 fab_ac_oldtown.0012:0 "Цепь разорвана"
 fab_ac_oldtown.0012.desc:0 "Всё кончено. Войска Медовички рассеяны, гавань принадлежит ему, а над Хайтауэром, рядом с огнём маяка, реет трёхглавый дракон. Пока я пишу, его чудовища кружат вокруг башни — медленно, неторопливо, как подобает победителям.\n\nМы поставили десять тысяч лет владычества Хайтауэров против огненного видения старика. Видение взыскало свой долг. Мой меч сдан, колено преклонено. То, что город не сгорел целиком, — незаслуженная мною милость.\n\nЕго Святейшество, с самого начала советовавший покориться, через три дня коронует завоевателя в Звёздной септе. Да простят нас боги. Старица ведь пыталась осветить нам путь."
 fab_ac_oldtown.0012.option1:0 "Боги, простите нашу гордыню."
 fab_ac_oldtown.0013:0 "Семь елеев среди пепла"
 fab_ac_oldtown.0013.desc:0 "Когда я поднимаюсь, семь елеев ещё не высохли на моём лбу.\n\nНадо мной больше нет хрустального купола, ловящего утренний свет. Его оплавленные осколки лежат среди почерневших камней, а лики Семерых глядят из растрескавшихся ниш сквозь дым. Верховный септон нашёл священные елеи под рухнувшим алтарём. Он помазал меня там, где некогда стояла невредимая Звёздная септа. Его руки не дрожали, хотя к одеждам пристал пепел.\n\nЗа руинами молчит Старомест. Отцы не поднимают детей, чтобы показать им Балериона. Меня с короной на голове не сопровождают по улицам радостные крики. Маяк Хайтауэра снова горит красным, но под ним, над разбитыми воротами, реет трёхглавый дракон.\n\nЯ получил благословение Веры и покорность города — всё, за чем пришёл. Но от древнейшей септы Вестероса остались дымящиеся стены, Медовичка забита обломками, и каждый благочестивый лорд моего нового королевства запомнит цену этого помазания.\n\n#bold Королевство можно выковать на каменной наковальне. Но это не значит, что камень простит молот.#!"
 fab_ac_oldtown.0013.a:0 "Пепел мне свидетель. Я помазан на царство."
 fab_ac_oldtown.0015:0 "Хайтауэр покоряется"
 fab_ac_oldtown.0015.desc:0 "Ради величайшего города Вестероса мне не пришлось сломать ни единого копья. Когда моё войско завидело огонь Хайтауэра, ворота Староместа уже были открыты. На дороге ждал лорд Манфред Хайтауэр, готовый предложить меч, город и присягу.\n\nПричина оказалась удивительнее самих стен. Едва в Старомест пришла весть о моей высадке, верховный септон затворился в Звёздной септе на семь дней и семь ночей. Он постился на хлебе и воде, молясь поочерёдно у всех алтарей. На седьмой день он вышел и объявил: Старица подняла золотой светильник и показала грядущее. Если Старомест поднимет оружие против дракона, он сгорит; Хайтауэр, Цитадель и Звёздная септа будут разрушены. Лорд Манфред осторожен и благочестив: один его сын присягнул Сынам Воина, другой недавно стал септоном. Он послушал Отца Правоверных. Ни один житель Староместа не сгорел на Пламенном поле, хотя Хайтауэры издавна присягали Хайгардену.\n\nЛорд преклонил колени на дороге передо мной и Балерионом и сделал своё предложение. И ещё одно — руку младшей дочери. Я отказался со всей учтивостью. Тому, у кого уже две королевы, лучше не обзаводиться третьей.\n\n#bold В городе, говорят, меня ждёт Его Святейшество. Семеро желают освятить короной то, что уже завоевал меч.#!"
 fab_ac_oldtown.0015.option1:0 "Старица вовремя зажгла свой светильник, милорд. Встаньте."
 fab_ac_oldtown.0016:0 "Коронация Эйгона I Таргариена"
 fab_ac_oldtown.0016.desc:0 "Через три дня после того, как Старомест открыл мне ворота, я преклонил колени под куполом Звёздной септы — черномраморного сердца Веры. Его Святейшество помазал мой лоб семью елеями, возложил на голову корону и провозгласил перед богами и людьми:\n\n#bold Эйгон из дома Таргариенов, Первый этого имени, король андалов, ройнаров и Первых людей, владыка Семи Королевств и защитник государства.#!\n\nСеми Королевств, сказал Его Святейшество, хотя Дорн ещё не покорился. Пусть этот титул будет обещанием.\n\nКогда Висенья впервые короновала меня в Эйгоновой крепости, свидетелями стала лишь горстка лордов. Сегодня Звёздную септу заполнили сотни, в том числе мейстеры и архимейстеры Цитадели со своими кольцами, масками и мантиями. Серые писцы записывают то, что видят сами. Не сомневаюсь: в летописях началом моего правления назовут этот день, а не коронацию у Черноводной. Пусть так. Короля можно короновать дважды; королевство выковывают лишь раз.\n\n#bold Так Семь Королевств Вестероса становятся единой державой — моей волей, пламенем моих сестёр и теперь благословением богов, которых больше всего чтут мои подданные.#!"
 fab_ac_oldtown.0016.option1:0 "Семь елеев, одно королевство, один король."
 fab_ac_oldtown.0016.option2:0 "Я принимаю корону — но боги Валирии хранят мой дом."
