l_russian:
 fab_ac_oldtown.0002:0 "От гор до песков"
 fab_ac_oldtown.0002.desc:0 "К югу от всего, что я сейчас владею, осталось одно королевство: Дорн. И Дорн не похож ни на что, с чем я еще сталкивался.\n\nМартеллы Солнечного Копья никогда не были королями. Принцами они называют себя на манер ройнаров — десять тысяч кораблей Нимерии сделали их такими, какие они есть, и линия Нимерии удерживала Дорн от Короля Шторма и Гарденера на протяжении семисот лет. Их пустыни поглотили каждую армию, которая когда-либо шла на них; их горы похоронили остальных. Их правительницей является Мерия Мартелл, восьмидесятилетняя, слепая и огромная — Желтая Жаба, как называют ее враги, и ее враги мало что от этого выиграли. Она уже писала мне однажды, предлагая союз против Аргилака как один равный другому. Я тогда ей отказал. Теперь Аргилак мертв, и ему больше нет равных.\n\nИтак, Рейнис летит в Солнечное Копье, чтобы поговорить со старой принцессой под ее собственным кровом: коленом или драконом. Их слова: #italic Непокоренный, Несогнутый, Несломленный#! — гордое хвастовство для людей, которые еще никогда не встречали драконьего огня.\n\n#bold Посмотрим, будут ли они по-прежнему претендовать на эти слова после встречи с драконом. #!"
 fab_ac_oldtown.0002.option1:0 "Наша армия теперь поворачивает на юг."
 fab_ac_oldtown.0003:0 "Пустые пески"
 fab_ac_oldtown.0003.desc:0 "Первый ворон Рейнис с юга рассказывает о войне, непохожей на ту, в которой мы сражались.\n\nАрмия дорнийских копейщиков стояла на страже у Принцевого перевала, ворот через Красные горы — чтобы она не прошла через Красные горы. Мераксес поднялся над перевалом, над красными и белыми песками, и обрушился на замок Вейт, чтобы потребовать его подчинения.\n\nОна нашла его пустым. Не взяли, не бежали в панике — опустошили сознательно, до последнего копья и последнего мешка зерна. В городе под стенами остались только женщины, дети и старики, которые черпали воду и пасли коз, как будто дракон на рыночной площади был не более чужим, чем пыльная буря. Когда моя сестра спросила, куда делись их лорды и воины, они дали ей одно слово, каждый из них, вежливый и запертый, как запертые ворота:\n\n#bold «В гостях». #!\n\nХаррен спрятался за камнем, и камень расплавился. Аргилак вышел на бой и погиб. Дорнийцы хотят спрятаться за самой пустотой — а пустота не горит.\n\n#bold Рейнис летит к Солнечному Копью. Если лорды Дорна не примут ее, это сделает их принцесса.#!"
 fab_ac_oldtown.0003.option1:0 "Тогда в Солнечное Копье."
 fab_ac_oldtown.0004:0 "Желтая жаба"
 fab_ac_oldtown.0004.desc:0 "В Солнечном Копье, древней резиденции Дома Мартеллов, моя сестра нашла ту же вызывающую тишину: извилистые улочки города теней опустели, Старый дворец не заперт и не охраняется. Но этот замок не был совсем пуст. В своем зале, одна под знаменами с копьями и солнцем, принцесса Дорна сидела в ожидании дракона.\n\nМерия Мартелл правила Дорном шестьдесят лет. Ей восемьдесят лет, она очень толстая, слепая и почти лысая, ее кожа желтоватого цвета и обвислая — Желтая жаба Дорна, как давным-давно ее назвали враги, и большинство этих врагов теперь превратились в пыль, пока она все еще сидит на своем стуле. Ни возраст, ни слепота не притупили ее ума ни на волос, и она приветствовала королеву Вестероса, не вставая, без страха и без церемоний.\n\nОна не бросала вызов знаменам или армиям. Она предложила более сложный ответ:\n\n#bold «Я не буду сражаться с тобой и не преклоню перед тобой колени. В Дорне нет короля. Скажи это своему брату.'#!"
 fab_ac_oldtown.0004.option1:0 "#bold Передам. Но мы вернёмся, принцесса... #!"
 fab_ac_oldtown.0004.option2:0 "#bold ...и в следующий раз мы придем с огнем и кровью. #!"
 fab_ac_oldtown.0005:0 "Дорн не преклонит колени"
 fab_ac_oldtown.0005.desc:0 "Старая принцесса услышала предупреждение моей сестры даже не моргнув. Огонь и кровь, обещанные королевой Таргариенов с драконом на пороге — и Желтая Жаба, возможно, слушала жалобу рыбной хозяйки на погоду. Затем она дала свой ответ, и я подозреваю, что певцы будут хранить его дольше, чем большую часть того, что говорят короли:\n\n#bold «Ваши слова. Наши — Непокоренные, Негнущиеся, Несломленные. Вы можете сжечь нас, миледи... но вы не согнете, не сломаете и не заставите нас склониться. Это Дорн. Вы здесь не нужны. Возвращайтесь на свой страх и риск.'#!\n\nТак королева и принцесса расстались, а Дорн остался непокоренным.\n\nСлепая старая женщина, одна в пустом замке, сделала то, чего не смогли сделать камень Харрена, буря Аргилака и железный кулак Двух Королей: она отправила домой Таргариена без покорности. Я не буду притворяться, что эта смелость не вызывает определенного уважения и что она ничего не меняет. Расплата Дорна отложена, но не прощена.\n\n#bold Жаба пока сохраняет свои заслуги. Сначала меня ждет корона в Староместе.#!"
 fab_ac_oldtown.0005.option1:0 "Королева и принцесса расстались, а Дорн остался неподвластен Железному трону."
 fab_ac_oldtown.0006:0 "Жаба принимает дракона"
 fab_ac_oldtown.0006.desc:0 "Мне говорят, что королева драконов нашла Вейта именно так, как я и устроил: замок опустел, зернохранилища увезли, и в городе не осталось ни души, кроме бабушек и малышей, способных сказать ей одно слово. Прочь. Вы не можете сгореть.\n\nИ вот она пришла в Солнечное Копье, как я и знала, и нашла меня ждущим одного в своем зале. Мне восемьдесят лет, я слепой, толстый и почти лысый — полвека назад мои враги назвали меня Желтой жабой, и с тех пор я похоронил почти всех из них. Дракон на моем пороге не учащает мой пульс.\n\nЯ сказал ей прямо: я не буду сражаться с тобой и не стану перед тобой на коленях. В Дорне нет короля. Скажи это своему брату.\n\nОна обещала прийти снова с огнем и кровью. Их маленькие слова. Я отдал ей нашу — непокоренную, несгибаемую, несломленную — и отправил домой к брату ни с чем. Короли травы и реки могут преклонить колени. Это Дорн."
 fab_ac_oldtown.0006.option1:0 "Королева и принцесса расстались, а Дорн по-прежнему никому не поклонился."
 fab_ac_oldtown.0007:0 "Ответ моей матери и мой"
 fab_ac_oldtown.0007.desc:0 "Королева драконов пересекла Красные горы единственным способом, который ничего не стоил Дорну — через них — и обнаружила, что Вейт опустел до последнего копья, как и планировала моя мать, прежде чем боги забрали ее. Желтая Жаба исчезла, но ее замысел переживет ее, и я не сдвинул с места ни камня.\n\nИтак, Рейнис Таргариен пришла наконец в Солнечное Копье и нашла не старуху, которой она приготовила свои знаки внимания, а меня, одного в зале, где моя мать сидела шестьдесят лет.\n\nЯ дал ей ответ, который унаследовал вместе со стулом. Я не буду с ней бороться; ее дракону здесь не с чем сражаться. Я не преклоню перед ней колени; В Дорне нет короля, которого можно было бы завоевать. Она обещала огонь и кровь, как и ее дом. Я вернул ей наши слова — непокоренную, несгибаемую, несломленную — и позволил пустому песку сказать остальное."
 fab_ac_oldtown.0007.option1:0 "Королева и принц расстались, а Дорн по-прежнему никому не поклонился."
 fab_ac_oldtown.0008:0 "Ответ моей матери и мой"
 fab_ac_oldtown.0008.desc:0 "Королева драконов пересекла Красные горы единственным способом, который ничего не стоил Дорну — через них — и обнаружила, что Вейт опустел до последнего копья, как и планировала моя мать, прежде чем боги забрали ее. Желтая Жаба исчезла, но ее замысел переживет ее, и я не сдвинул с места ни камня.\n\nИтак, Рейнис Таргариен пришла наконец в Солнечное Копье и нашла не старуху, которой она приготовила свои знаки внимания, а меня, одного в зале, где моя мать сидела шестьдесят лет.\n\nЯ дал ей ответ, который унаследовал вместе со стулом. Я не буду с ней бороться; ее дракону здесь не с чем сражаться. Я не преклоню перед ней колени; В Дорне нет короля, которого можно было бы завоевать. Она обещала огонь и кровь, как и ее дом. Я вернул ей наши слова — непокоренную, несгибаемую, несломленную — и позволил пустому песку сказать остальное."
 fab_ac_oldtown.0008.option1:0 "Королева и принц расстались, а Дорн по-прежнему никому не поклонился."
 fab_ac_oldtown.0009:0 "Рейнис возвращается домой"
 fab_ac_oldtown.0009.desc:0 "Мераксес вернулся домой, и моя сестра вместе с ней — впервые в этом завоевании с пустыми руками. Она к этому не привыкла. Я тоже.\n\nМы долго говорили о том, что будет означать дорнийскую войну, и правда не устраивает нас обоих. Нет армии, которую можно было бы разбить там, нет гордого короля, который встретил бы меня в поле, нет замка, сожжение которого положило бы конец — только песок, жажда, пустые крепости и копья, которые ударяют по камням и исчезают. Драконы выигрывают битвы; Дорн не предлагает ничего. Покорение пустынь стоило бы мне лет и легионов, а царство, которое я только что соединил, слишком ново для обоих.\n\nИтак, Дорн сохраняет свои пески, а старуха сохраняет свое кресло — пока. Никто не должен путать терпение с прощением.\n\n#bold Итак, на юг и запад, к одним огромным воротам, которые еще не открылись: Старомест, Верховный септон и Хайтауэр. Пришло время Вере встретиться с драконом.#!"
 fab_ac_oldtown.0009.option1:0 "Дорн подождёт. Старомест — нет."
 fab_ac_oldtown.0010:0 "Маяк Староместа"
 fab_ac_oldtown.0010.desc:0 "Хайтауэр поднимается над горизонтом задолго до того, как появляются стены Староместа, его маяк светится бледным пламенем на фоне южного неба. Под ним лежит величайший город Вестероса: Цитадель и ее серые ученые, Звёздная септа и Отец правоверных, пристани, заполненные половиной богатств королевства, и большим количеством душ, чем могут похвастаться некоторые королевства.\n\nВерховный септон провел в молитве семь дней и семь ночей. Из города донесли, что Старица показала ему Старомест, сожженный драконьим огнём, если Хайтауэры будут сопротивляться мне. Однако видения не открывают врат, и святой совет не всегда одолевает гордого господина.\n\nМоя армия продвигается по розовой дороге под трехглавым драконом. Вскоре стены становятся четче в утренней дымке, и маяк на вершине Хайтауэра меняется у меня на глазах.\n\n#bold Теперь я узнаю, прислушался ли Старомест к лампе Старицы. #!"
 fab_ac_oldtown.0010.a:0 "Дракон летит над открытыми воротами. Старомест сделал мудрый выбор."
 fab_ac_oldtown.0010.b:0 "Огонь маяка зеленеет. Старомест созвал знамёна."
 fab_ac_oldtown.0011:0 "Маяк горит зеленым"
 fab_ac_oldtown.0011.desc:0 "Зеленый огонь пылает на вершине Хайтауэра.\n\nВорота заперты. Огромная цепь замыкает Медовое вино, и каждый колокол в Староместе призывает людей не к молитве, а к оружию. Из садов и деревень за стенами доносятся знамена заклятых мечей Дома Хайтауэров, отвечая зеленому пламени над их городом. Верховный септон советовал подчиниться; вместо него ответила гордость.\n\nМои капитаны предупреждают, что даже короткая осада будет стоить золота, людей и времени. Стены Староместа сильны, но камень от Харренхола до Орлиного гнезда передо мной рухнул, и никакая стена не сможет закрыть небо.\n\n#bold Старица показала им огонь. Лорд Хайтауэр решил посмотреть на это своими глазами. #!"
 fab_ac_oldtown.0011.a:0 "Закройте все дороги и поднимите драконов. Старомест откроет свои ворота."
 fab_ac_oldtown.0012:0 "Цепь разорвана"
 fab_ac_oldtown.0012.desc:0 "Это закончено. Знамена Медового вина разбросаны, гавань принадлежит ему, а трехглавый дракон летит из Хайтауэра, где горит пламя маяка. Пока я пишу, его звери кружат вокруг башни — медленно, не торопясь, как кружит победитель.\n\nМы поставили десять тысяч лет на сохранение Хайтауэра против видения старика об огне, и это видение вернуло свой долг. Мой меч сдан, мое колено согнуто. То, что город не сгорел дотла, — это милость, которую я не заслужил.\n\nЕго Высочество, который с самого начала советовал подчиниться, должен короновать победителя в Звездной сентябрь через три дня. Боги простят нас. Старица попыталась осветить путь."
 fab_ac_oldtown.0012.option1:0 "Боги, простите нашу гордыню."
 fab_ac_oldtown.0013:0 "Семь масел среди пепла"
 fab_ac_oldtown.0013.desc:0 "Когда я встаю, семь масел все еще остаются влажными на моем лбу.\n\nНадо мной нет хрустального купола, отражающего утренний свет. Его осколки лежат расплавленными среди почерневших камней, а лица Семи смотрят вниз из потрескавшихся ниш сквозь завесу дыма. Верховный септон нашел священные масла под упавшим алтарем. Он помазал меня там, где когда-то стояла целая Звёздная септа, его руки были тверды, хотя пепел прилип к его одежде.\n\nЗа руинами Старомест молчит. Ни один отец не поднимает своих детей, чтобы увидеть Балериона. Никакие аплодисменты не сопровождают мою корону по улицам. Маяк Хайтауэра снова горит красным, но под ним над разбитыми воротами летает трехголовый дракон.\n\nУ меня есть благословение Веры и подчинение города, как я и пришел требовать. Тем не менее, самая старая септа в Вестеросе представляет собой дымящуюся оболочку, Медовое вино забито обломками, и каждый благочестивый лорд в моем новом королевстве помнит цену этого помазания.\n\n#bold Царство можно выковать на каменной наковальне. Из этого не следует, что камень простит молот. #!"
 fab_ac_oldtown.0013.a:0 "Пепел свидетельствует. Я помазан королем."
 fab_ac_oldtown.0015:0 "Высокая башня сдаётся"
 fab_ac_oldtown.0015.desc:0 "Величайший город Вестероса не заставил меня сломать ради него ни одного копья. Когда моя армия приблизилась к огню Хайтауэра, мы обнаружили ворота Староместа открытыми, а лорд Манфред Хайтауэр ждал на дороге, чтобы предложить мне свой меч, свой город и свою клятву.\n\nПочему это более странная история, чем сами стены. Когда слухи о моей высадке впервые достигли Староместа, Верховный Септон заперся в Звездной Септе на семь дней и семь ночей, постясь на хлебе и воде и молясь у одного алтаря за другим. На седьмой день он появился и заявил, что Старица подняла свою золотую лампу и указала ему путь вперед: если Старомест ополчится против дракона, Старомест сгорит — Хайтауэр, Цитадель и Звёздная септа падут и разрушены. Лорд Манфред — осторожный и благочестивый человек — один сын присягнул Сынам Воина, другой недавно стал септоном — и он услышал своего Отца Верных. Ни один житель Староместа не сгорел на Огненном Поле, хотя Хайтауэры в древности присягнули Хайгардену.\n\nИтак, лорд преклонил колени на дороге передо мной и Балерионом и сделал свое предложение — и еще одно предложение: руку своей младшей дочери. Я со всей вежливостью отклонил ее предложение. Человеку с двумя ферзями лучше не собирать третьего.\n\n#bold А в городе, говорят, меня ждет Его Святейшество. Боги Семи желают увенчать то, что меч уже завоевал.#!"
 fab_ac_oldtown.0015.option1:0 "Старица вовремя зажгла свой светильник, милорд. Встаньте."
 fab_ac_oldtown.0016:0 "Коронация Эйгона I Таргариена"
 fab_ac_oldtown.0016.desc:0 "Через три дня после того, как ворота Староместа открылись для меня, я преклонил колени под куполом Звездной септы — черного мраморного сердца самой Веры — и Его Высочество Святейшество помазал мой лоб семью маслами, возложил на мою голову корону и провозгласил меня перед богами и людьми:\n\n#bold Эйгон из дома Таргариенов, первый своего имени, король андалов, ройнаров и первых людей, лорд семи королевств и защитник королевства.#!\n\nСемь Королевств, сказал Его Высочество, хотя Дорн остаётся непокоренным. Стиль может служить обещанием.\n\nЛишь горстка лордов была свидетелем того, как Висенья впервые короновала меня в Эйгоновой Крепости; сегодня Звездную септу заполнили сотни людей, и среди них мейстеры и архимейстеры Цитадели в своих кольцах, масках и мантиях. Серые писцы записывают то, чему свидетелями являются серые писцы, — я не сомневаюсь, что, когда будут написаны истории, именно этот день, а не коронацию у Черноводной, они запишут как первый день моего правления. Пусть будет так. Короля можно короновать дважды; Царство создается только один раз.\n\n#bold Таким образом, Семь Королевств Вестероса объединены в одно царство — по моей воле, огню моих сестер и теперь благословению богов, которое большинство моих подданных ценят больше всего. #!"
 fab_ac_oldtown.0016.option1:0 "Семь масел, одно царство, один король."
 fab_ac_oldtown.0016.option2:0 "Я принимаю корону — но боги Валирии хранят мой дом."
