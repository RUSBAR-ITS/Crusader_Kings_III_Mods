l_russian:
 fab_ac_riverlands.0001:0 "Север или Юг"
 fab_ac_riverlands.0001.desc:0 "Корона ничего не решает; она лишь даёт обещание. Моя обещает мне весь Вестерос, а Вестеросом владеют короли, не желающие с ним расставаться. В чертоге Эйгонфорта мой совет склонился над картами, и каждый указывает свой путь.\n\nНа севере, за стенами Харренхолла, восседает [fab_ac_harrenhal_lord.GetFirstNameNicknamed], правитель Островов и Рек. Железнорождённые возводили этот чудовищный замок сорок лет ценой крови и непосильного труда жителей Речных земель; певцы уверяют, что строительство завершилось в тот самый день, когда я ступил на берег. Пять башен словно пальцы жадной руки, стены слишком высоки и толсты для любой осадной лестницы. [fab_ac_harrenhal_lord.GetFirstName] полагает, что [fab_ac_harrenhal_lord.GetHerHis] каменные стены защитят [fab_ac_harrenhal_lord.GetHerHim]. Речные жители, построившие замок, стонут под этим ярмом. Мне говорят, что некоторые из их лордов поднимутся на мою сторону — если кто-нибудь даст им повод.\n\nНа юге ждёт Аргилак Надменный, старый Король Бури, который отрубил руки моему посланнику и прислал их в ящике. Его гордыня начала эту войну. Он стар, но ещё силён; в отличие от такого противника, как [fab_ac_harrenhal_lord.GetFirstName], он не станет прятаться за стенами. Дюррандон выйдет навстречу в открытое поле, невзирая на бурю. Было бы справедливо ответить ему первым.\n\n#bold Два короля, два пути. Что бы я ни выбрал, война за Вестерос начнётся всерьёз.#!"
 fab_ac_riverlands.0001.option1:0 "Направьте армию на дорогу в Харренхол."
 fab_ac_riverlands.0001.option2:0 "Сперва ответим Аргилаку."
 fab_ac_riverlands.0002:0 "Войско разделяется"
 fab_ac_riverlands.0002.desc:0 "Война не будет ждать плотников, поэтому сегодня утром я отправил армию на дороги.\n\nМоя идет на северо-запад, вверх по Черной воде к Оку Бога, над ней находится Балерион. Висенья плывет на север вместе с Деймоном Веларионом и флотом, чтобы узнать, сколько заплатит Долина за сохранение мира. Орис держит под ружьем остальных на южных границах, а над ним стоят Рейнис и Мераксес. Аргилак не хотел, чтобы он был хорошим сыном; он может считать его врагом.\n\n#bold Три дороги и три дракона. Моя заканчивается в Харренхоле.#!"
 fab_ac_riverlands.0002.option1:0 "Нас с Балерионом будет достаточно."
 fab_ac_riverlands.0003:0 "Битва в тростниках"
 fab_ac_riverlands.0003.desc:0 "Они ждали там, где высокие камыши растут на южном берегу Ока Божьего, и хорошо выбрали момент. Моя колонна растянулась вдоль воды, и земля под ногами бронетехники провалилась.\n\nЧего они не предусмотрели, так это того, что Балерион уже был в воздухе. Он прошел низко над водой, камыши поднялись из конца в конец, и после этого это было не битвой, а расплатой.\n\nМы держим поле. У нас также меньше людей, чем сегодня утром, и мейстеры будут работать до рассвета.\n\n#bold Эта страна будет стоить мне крови, даже если я выиграю. Лучше учиться здесь, чем у стен.#!"
 fab_ac_riverlands.0003.option1:0 "Поле наше. Вперёд!"
 fab_ac_riverlands.0004:0 "Плакучие ивы"
 fab_ac_riverlands.0004.desc:0 "Они пересекли Божье Око в темноте, обмотав весла тканью, и знают эту воду лучше, чем мои разведчики знают берег. Первое, что мы о них узнали, — это ивы, шевелящиеся там, где нет ветра.\n\nОни ударили в тыл, среди раненых и багажа, и снова исчезли, прежде чем перестали звучать гудки. Разбитые повозки, горящие палатки и больше моих людей убито, чем мне стоил камыш."
 fab_ac_riverlands.0004.desc.sons:0 "\n\nЗаключенные называют двоих, которые их переправили: [fab_ac_hoare_son_a.GetFirstName] и [fab_ac_hoare_son_b.GetFirstName] Хоар."
 fab_ac_riverlands.0004.desc.son:0 "\n\nЗаключенные называют человека, который их переправил: [fab_ac_hoare_son_a.GetFirstName] Хоар."
 fab_ac_riverlands.0004.desc.close:0 "\n\n#bold Они сражались как железнорожденные, и сражались хорошо. Я буду помнить ивы.#!"
 fab_ac_riverlands.0004.option1:0 "Сосчитайте павших. Затем найдите мне эти лодки."
 fab_ac_riverlands.0005:0 "Балерион на воде"
 fab_ac_riverlands.0005.desc:0 "Что бы железнорожденные ни знали о воде, Глаз Бога — это озеро, а озеро не дает кораблю спрятаться. С рассветом они все еще были на нем, гребли низко и тяжело, неся все, что унесли.\n\nБалерион вывел их в открытую воду. Лодки сгорели до ватерлинии, а люди в кольчугах не плавают."
 fab_ac_riverlands.0005.desc.sons:0 "\n\n[fab_ac_hoare_son_a.GetFirstName] и [fab_ac_hoare_son_b.GetFirstName] Хоар вчера вечером вышли на это озеро. Ни один не вернулся."
 fab_ac_riverlands.0005.desc.son:0 "\n\n[fab_ac_hoare_son_a.GetFirstName] Хоар вышел на озеро вчера вечером. Он не вернулся."
 fab_ac_riverlands.0005.desc.close:0 "\n\n#bold За Плакучие Ивы отомщено. Теперь — Харренхол.#!"
 fab_ac_riverlands.0005.option1:0 "Вести достигнут Харренхола раньше меня."
 fab_ac_riverlands.0006:0 "[fab_ac_harrenhal_lord.GetFirstName] призывает речных лордов"
 fab_ac_riverlands.0006.desc:0 "Вороны вылетели из Харренхола с первыми лучами солнца. [fab_ac_harrenhal_lord.GetFirstName] призвал всех речных лордов к оружию и назначил сбор под стенами замка.\n\nМои всадники уже три дня следят за бродами и речной дорогой. Ни колонн, ни знамен на Стоун-Хедж или Фэрмаркет, ни лодок, спускающихся по Трезубцу. Призыв раздался, и реки утихли.\n\n#bold Каждый лорд, игнорирующий этот призыв, уже наполовину ответил на мой. #!"
 fab_ac_riverlands.0006.option1:0 "Отметьте, кто придет. Отметьте, кто нет."
 fab_ac_riverlands.0009:0 "Дракон или Кальмар"
 fab_ac_riverlands.0009.desc:0 "Три поколения членов моего дома несли камень для памятника королям Хоара. Три поколения речной крови и речного серебра, поглощенные этой черной кучей на Божьем Оке, в то время как железнорожденные рифы подсчитывают наш урожай, а железнорожденные топоры отвечают на наши жалобы.\n\nТеперь повелитель драконов расположился лагерем у устья Черноводной и ведет войну с нашим хозяином, и каждый речной повелитель от Орлиного мыса до Девичьего пруда за зарешеченными дверями задает один и тот же вопрос: дракон — избавитель или просто следующий повелитель с более горячим клеймом?\n\nУ Дома Талли есть более древний ответ на этот вопрос. Когда-то мы были здесь королями, до королей штормов, до кальмаров. Тому, кто смирит [fab_ac_harrenhal_lord.GetFirstName], понадобятся речные люди, чтобы удерживать реки — и лорда, который встанет ПЕРВЫМ, будут помнить выше всех лордов, которые просто последовали за ним."
 fab_ac_riverlands.0009.option1:0 "Семья, Долг, Честь. Риверран восстает за дракона."
 fab_ac_riverlands.0009.option2:0 "Мы ждем и преклоняем колени перед тем, кто останется стоять."
 fab_ac_riverlands.0010.opening:0 "Король Эйгон,"
 fab_ac_riverlands.0010.desc:0 "Тирания [fab_ac_harrenhal_lord.GetFirstNamePossessive] больше не будет терзать Речные земли. Риверран и его знамёна теперь на стороне Дракона.\n\nПриказывайте, как пожелаете, и Трезубец будет вашим."
 fab_ac_riverlands.0010.desc.child:0 "Тирания Железнорожденных в последний раз разрушила Речные земли. Риверран и его знамена теперь стоят на стороне Дракона.\n\nКомандуйте нами, как пожелаете, и Трезубец станет вашим."
 fab_ac_riverlands.0011:0 "Риверран восстал"
 fab_ac_riverlands.0011.desc:0 "Слух разносится по рекам быстрее любого ворона: лорд Эдмин Талли открыл Риверран королю драконов и призвал каждого речного лорда восстать против [fab_ac_harrenhal_lord.GetFirstName].\n\nТри поколения мы пролили кровь ради памятника кальмару. Теперь Блэквуды движутся, а Бракены — на одной и той же стороне, впервые за столетие, и одно это должно сказать человеку, в какую сторону склоняются боги. Говорят, что повелитель драконов — снисходительный повелитель, осторожный с богами и обычаями, и это больше, чем когда-либо говорили о [fab_ac_harrenhal_lord.GetFirstName].\n\nЕсли реки поднимаются вместе, мы не мятежники; мы — царство, сбросившее чужеземное иго. Если мы отступим и дракон все равно победит, наши сыновья спросят нас, где мы были."
 fab_ac_riverlands.0011.option1:0 "Речные земли восстают. Власти железнорождённых пришёл конец."
 fab_ac_riverlands.0011.option2:0 "Мы ждем и преклоняем колени перед тем, кто останется стоять."
 fab_ac_riverlands.0013:0 "Стены Черного короля"
 fab_ac_riverlands.0013.desc:0 "Харренхол пожирает горизонт задолго до того, как моя армия достигнет берега озера. Пять чудовищных башен возвышаются над стенами, достаточно широкими, чтобы люди могли проехать по шесть человек в ряд, каждый камень потемнел от дождя и речного тумана. [fab_ac_harrenhal_lord.GetFirstNameNicknamed] потратил сорок лет на возведение этого места и сорок лет обескровливал речные земли, чтобы заплатить за него. Последний камень был заложен незадолго до моего приземления. [fab_ac_harrenhal_lord.GetSheHe|U] построил [fab_ac_harrenhal_lord.GetHerHim] себе гробницу и принял ее за королевство.\n\nМои капитаны измеряют стены и возвращаются с мрачными лицами. Лестницы ломались под собственным весом, не доходя до зубчатых стен. Баранам приходится пересекать места убийства, окруженные сотнями ям для убийств, в то время как озеро охраняет один фланг, а железнорожденные [fab_ac_harrenhal_lord.GetFirstName] удерживают ворота. Возможно, мы можем уморить [fab_ac_harrenhal_lord.GetHerHim] голодом, но запасы внутри могут пережить не один урожай, и каждая луна, проведенная здесь, — это луна, бесплатно дарованная другим королям Вестероса.\n\nЗатем тень Балериона проходит над палатками, и ответ кажется очевидным. Стоун может не пускать мужчин. Оно еще никогда не закрывало небо.\n\nТем не менее, огонь не обязательно должен быть первым произнесенным словом. Я могу призвать [fab_ac_harrenhal_lord.GetFirstName] под знаменем мира и предложить [fab_ac_harrenhal_lord.GetHerHim] один шанс обменять корону [fab_ac_harrenhal_lord.GetHerHis] на жизнь [fab_ac_harrenhal_lord.GetHerHis] — или я могу избавить тех, кто находится в замке, от драконьего пламени и довериться времени, стали и голоду, чтобы открыть то, что закрыла гордость."
 fab_ac_riverlands.0013.desc.heir:0 "Харренхол пожирает горизонт задолго до того, как моя армия достигнет берега озера. Пять чудовищных башен возвышаются над стенами, достаточно широкими, чтобы люди могли проехать по шесть человек в ряд, каждый камень потемнел от дождя и речного тумана. Сорок лет речной крови и тяжелого труда ушли на это место, и последний камень был заложен незадолго до моего приземления. Король, который поднял его, мертв, и теперь он принадлежит [fab_ac_harrenhal_lord.GetFirstName].\n\nМои капитаны измеряют стены и возвращаются с мрачными лицами. Лестницы ломались под собственным весом, не доходя до зубчатых стен. Баранам приходится пересекать места убийств, окруженные сотнями ям для убийств, в то время как озеро охраняет один фланг, а железнорожденные [fab_ac_harrenhal_lord.GetFirstName] удерживают ворота. Возможно, мы можем уморить [fab_ac_harrenhal_lord.GetHerHim] голодом, но запасы внутри могут пережить не один урожай, и каждая луна, проведенная здесь, — это луна, бесплатно дарованная другим королям Вестероса.\n\nЗатем тень Балериона проходит над палатками, и ответ кажется очевидным. Стоун может не пускать мужчин. Оно еще никогда не закрывало небо.\n\nТем не менее, огонь не обязательно должен быть первым произнесенным словом. Я могу призвать [fab_ac_harrenhal_lord.GetFirstName] под знаменем мира и предложить [fab_ac_harrenhal_lord.GetHerHim] один шанс обменять корону [fab_ac_harrenhal_lord.GetHerHis] на жизнь [fab_ac_harrenhal_lord.GetHerHis] — или я могу избавить тех, кто находится в замке, от драконьего пламени и довериться времени, стали и голоду, чтобы открыть то, что закрыла гордость."
 fab_ac_riverlands.0013.desc.child:0 "Харренхол пожирает горизонт задолго до того, как моя армия достигнет берега озера. Пять чудовищных башен возвышаются над стенами, достаточно широкими, чтобы люди могли проехать по шесть человек в ряд, каждый камень потемнел от дождя и речного тумана. Сорок лет речной крови и тяжелого труда ушли на это место, и последний камень был заложен незадолго до моего приземления. Король, поднявший его, мертв, и теперь им владеет [fab_ac_harrenhal_lord.GetFirstName]: ребенок, слишком маленький, чтобы поднять меч, а железнорожденные капитаны командуют стенами под именем [fab_ac_harrenhal_lord.GetHerHis].\n\nМои капитаны измеряют стены и возвращаются с мрачными лицами. Лестницы ломались под собственным весом, не доходя до зубчатых стен. Баранам приходится пересекать места убийства, окруженные сотнями ям для убийств, в то время как озеро охраняет один фланг, а железнорожденные удерживают ворота. Возможно, мы можем уморить их голодом, но запасы внутри могут пережить не один урожай, и каждая луна, проведенная здесь, — это луна, бесплатно дарованная другим королям Вестероса.\n\nЗатем тень Балериона проходит над палатками, и ответ кажется очевидным. Стоун может не пускать мужчин. Оно еще никогда не закрывало небо.\n\nНикаких переговоров не будет. Я не торгуюсь ни с детьми, ни с прячущимися за ними серыми капитанами, и в этих стенах нет никого, чье слово могло бы привязать железнорожденных к миру. У них были все шансы открыть свои ворота. На закате они узнают, чего стоят их стены."
 fab_ac_riverlands.0013.option1:0 "Пусть [fab_ac_harrenhal_lord.GetFirstName] явится ко мне. [fab_ac_harrenhal_lord.GetSheHe|U] получит один шанс преклонить колено."
 fab_ac_riverlands.0013.option1.child:0 "Никаких переговоров с ребёнком. На закате Харренхол сгорит."
 fab_ac_riverlands.0013.option2:0 "Нет. Камень ответит на камень, и голод откроет врата."
 fab_ac_riverlands.0014:0 "Перед стенами Харренхола"
 fab_ac_riverlands.0014.desc:0 "[fab_ac_harrenhal_lord.GetFirstName] согласился на слова перед войной. Мы встретились на открытой местности под его чудовищным замком, под знаменем мира: я пришел с горсткой рыцарей, а [fab_ac_harrenhal_lord.GetFirstName] выехал из его ворот в сопровождении своих сыновей. Старый король седен и мрачен, тверд, как камень, который он так любит, и в его глазах, когда он смотрел на меня, не было страха — только черное веселье, как человек мог бы смотреть на нищего, пришедшего потребовать свой зал.\n\nПозади него возвышались пять башен, и я готов признать это старым пауком: ни один замок, когда-либо построенный людьми, не имеет стен, подобных им. Сорок лет крови и тяжелого труда речных земель стоят в этих стенах. Если бы у меня не было драконов, я мог бы состариться и умереть под ними.\n\nНо у меня есть драконы. Итак, начнем с условий — щедрых, предлагаемых один раз."
 fab_ac_riverlands.0014.desc.heir:0 "[fab_ac_harrenhal_lord.GetFirstName] согласился на слова перед войной. Мы встретились на открытой местности под Харренхолом, под знаменем мира: я пришел с горсткой рыцарей, а [fab_ac_harrenhal_lord.GetFirstName] выехал из ворот с железнорожденными капитанами в [fab_ac_harrenhal_lord.GetHerHis] позади. В глазах [fab_ac_harrenhal_lord.GetHerHis], когда [fab_ac_harrenhal_lord.GetSheHe] смотрел на меня, не было страха, только презрение, как если бы я был нищим, пришедшим потребовать зал для [fab_ac_harrenhal_lord.GetHerHis].\n\nПозади [fab_ac_harrenhal_lord.GetHerHim] возвышались пять башен, и вот что я признаю: ни один замок, когда-либо построенный людьми, не имеет стен, подобных им. Сорок лет крови и тяжелого труда речных земель стоят в этих стенах. Если бы у меня не было драконов, я мог бы состариться и умереть под ними.\n\nНо у меня есть драконы. Итак, начнем с условий — щедрых, предлагаемых один раз."
 fab_ac_riverlands.0014.option1:0 "#bold Уступи сейчас, и ты сможешь остаться владыкой Железных островов. #!"
 fab_ac_riverlands.0014.option2:0 "#bold Уступите сейчас, и ваши сыновья будут жить и править после вас. #!"
 fab_ac_riverlands.0014.option2.heir:0 "#bold Сдайтесь сейчас, и ваша кровь будет править островами после вас. #!"
 fab_ac_riverlands.0014.option3:0 "#bold Перед вашими стенами у меня восемь тысяч воинов. #!"
 fab_ac_riverlands.0015:0 "Крепкие и толстые"
 fab_ac_riverlands.0015.desc:0 "Старый король молча выслушал мои условия. Его сыновья наблюдали за ним; один из них, я думаю, принял бы это предложение, если бы оно принадлежало ему. Это не так. [fab_ac_harrenhal_lord.GetFirstName] наклонился из седла, сплюнул и дал мне ответ:\n\n#bold «То, что находится за пределами моих стен, меня не волнует. Эти стены крепкие и толстые». #!\n\nКрепкий и толстый. Каждый их камень оплачен кровью речных земель, каждая башня проклята вдовами людей, погибших при их возведении. Он сорок лет отвоевывал этот замок у побежденного народа, а теперь собирается спрятаться в нем, пока моя армия прорывается к воротам.\n\nОн все еще думает о стенах. Он еще не понял, что высадилось на его берегах."
 fab_ac_riverlands.0015.desc.heir:0 "[fab_ac_harrenhal_lord.GetFirstName] молча выслушал мои условия. Капитаны [fab_ac_harrenhal_lord.GetHerHis] наблюдали за [fab_ac_harrenhal_lord.GetHerHim], и я думаю, что многие из них приняли бы это предложение, если бы оно было их собственным. Это не так. [fab_ac_harrenhal_lord.GetFirstName] наклонился из седла, сплюнул и дал мне [fab_ac_harrenhal_lord.GetHerHis] ответ:\n\n#bold «То, что находится за пределами моих стен, меня не волнует. Эти стены крепкие и толстые». #!\n\nКрепкий и толстый. Каждый их камень оплачен кровью речных земель, каждая башня проклята вдовами людей, погибших при их возведении. Теперь [fab_ac_harrenhal_lord.GetSheHe] намерен спрятаться за ними, пока моя армия прорвется к воротам.\n\n[fab_ac_harrenhal_lord.GetSheHe|U] все еще думает о стенах. [fab_ac_harrenhal_lord.GetSheHe|U] еще не понял, что приземлилось на берегах [fab_ac_harrenhal_lord.GetHerHis]."
 fab_ac_riverlands.0015.option1:0 "#bold Но не настолько высоко, чтобы не пускать драконов. Драконы летают. #!"
 fab_ac_riverlands.0016:0 "Камень не горит"
 fab_ac_riverlands.0016.desc:0 "Впервые что-то шевельнулось в глазах старого короля — еще не страх, а тень, где начинается страх. Он освоил это достаточно быстро, и его ответ прозвучал ровно, как падающая решётка:\n\n#bold «Я построил из камня. Камень не горит». #!\n\nИ вот она — вся вера [fab_ac_harrenhal_lord.GetFirstName], обнаженная под знаменем мира. Он верит в это. Он пришел к выводу, что столько жестокости, наваленной так высоко, должно быть защитой от чего угодно: против богов, времени и драконов.\n\nСолнце висит низко и красное на западе за башнями. Слова готовы. Остается сказать ему только одно, а потом покататься на лошадях и долго ехать обратно в свою армию — и я не оглянусь назад."
 fab_ac_riverlands.0016.desc.heir:0 "Впервые что-то шевельнулось в глазах [fab_ac_harrenhal_lord.GetFirstName] — не страх, пока еще, а тень, в которой начинается страх. [fab_ac_harrenhal_lord.GetSheHe|U] справился с этим достаточно быстро, и ответ [fab_ac_harrenhal_lord.GetHerHis] прозвучал плоско, как падающая решётка:\n\n#bold «Харренхол построен из камня. Камень не горит». #!\n\nИ вот она — вся вера [fab_ac_harrenhal_lord.GetFirstName], обнаженная под знаменем мира. [fab_ac_harrenhal_lord.GetSheHe|U] верит в это. [fab_ac_harrenhal_lord.GetSheHe|U] пришел к убеждению, что столько жестокости, наваленной так высоко, должно быть защитой от чего угодно: от богов, времени и драконов.\n\nСолнце висит низко и красное на западе за башнями. Слова готовы. Осталось сказать [fab_ac_harrenhal_lord.GetHerHim] только одно, а потом покататься на лошадях и долго ехать обратно в свою армию — и я не оглянусь назад."
 fab_ac_riverlands.0016.option1:0 "#bold Когда солнце сядет, ваш род пресечётся. #!"
 fab_ac_riverlands.0017:0 "Переговоры у ворот"
 fab_ac_riverlands.0017.desc:0 "Повелитель драконов подошел к моим воротам под знаменем мира, и я поехал послушать его. Он моложе, чем я думал, и тише — он не теряет слов, я ему это признаю.\n\nОн предложил мне Железные острова в качестве моей линии, если я сдамся, и указал на тысячи людей, которые разбили лагерь за моими стенами. Я ему прямо сказал: то, что за пределами моих стен, меня не касается. Такие стены еще никогда не строились.\n\n#bold — Но не настолько высоко, чтобы не пускать драконов, — сказал он #!. #bold «Драконы летают». #!\n\nЯ построил из камня, сказал я ему. Камень не горит.\n\nОн посмотрел на меня, как мужчина смотрит на уже вырытую могилу, и дал мне время до заката. Мои сыновья смотрят с башен. Выбор за мной."
 fab_ac_riverlands.0017.desc.heir:0 "Повелитель драконов подошел к моим воротам под знаменем мира, и я поехал послушать его. Он моложе, чем я думал, и тише — он не теряет слов, я ему это признаю.\n\nОн предложил мне Железные острова в качестве моей линии, если я сдамся, и указал на тысячи людей, которые разбили лагерь за моими стенами. Я ему прямо сказал: то, что за пределами моих стен, меня не касается. Такие стены еще никогда не строились.\n\n#bold — Но не настолько высоко, чтобы не пускать драконов, — сказал он #!. #bold «Драконы летают». #!\n\n«Харренхол построен из камня», — сказал я ему. Камень не горит.\n\nОн посмотрел на меня, как мужчина смотрит на уже вырытую могилу, и дал мне время до заката. Мои родственники наблюдают с башен. Выбор за мной."
 fab_ac_riverlands.0017.option1:0 "Камень не горит. Пусть делает что хочет."
 fab_ac_riverlands.0017.option2:0 "Преклоните колени и сохраните острова."
 fab_ac_riverlands.0018:0 "Харренхол в огне"
 fab_ac_riverlands.0018.desc:0 "[fab_ac_harrenhal_lord.GetFirstName] дал мне [fab_ac_harrenhal_lord.GetHerHis] ответ, и это был вообще не ответ. Пусть будет так.\n\nКогда солнце зашло, я поднял Балериона все выше и выше во тьму, сквозь холод и облака, пока величайший замок, когда-либо возведенный в Вестеросе, не превратился в россыпь углей далеко внизу, а сам дракон не был больше мотылька на фоне луны. Там мы повернули. Вот мы и упали.\n\nНа черных, как смоль, крыльях Балерион пронесся сквозь ночь, и когда пять башен Харренхола поднялись навстречу нам, дракон раскрыл пасть и окунул их в черный огонь, пронзенный красными мечами.\n\n«Камень не горит», — похвастался мне [fab_ac_harrenhal_lord.GetFirstName]. Но ни один замок не строится только из камня. Дерево и шерсть, пенька и солома, хлеб и солонина и зерно в кладовых — все это загорелось. Железнорождённые [fab_ac_harrenhal_lord.GetHerHis] также не были сделаны из камня. Дымясь, крича, окутанные пламенем, они бежали через дворы, падали с дорожек и разбивались о землю внизу. А камень сам расколется и потечет, если огонь будет достаточно горячим. Башни светились в ночи красным, как пять огромных свечей, и, как свечи, они начали падать и извиваться, расплавленная скала стекала по их бокам.\n\n[fab_ac_harrenhal_lord.GetFirstNameNicknamed] и последний представитель линии [fab_ac_harrenhal_lord.GetHerHis] погибли в аду, поглотившем это чудовищное сиденье. Королевство Островов и Рек погибло вместе с ними, и Речные Земли стали моими."
 fab_ac_riverlands.0018.desc.child:0 "От ребенка не было ответа, и я его не искал.\n\nКогда солнце зашло, я поднял Балериона все выше и выше во тьму, сквозь холод и облака, пока величайший замок, когда-либо возведенный в Вестеросе, не превратился в россыпь углей далеко внизу, а сам дракон не был больше мотылька на фоне луны. Там мы повернули. Вот мы и упали.\n\nНа черных, как смоль, крыльях Балерион пронесся сквозь ночь, и когда пять башен Харренхола поднялись навстречу нам, дракон раскрыл пасть и окунул их в черный огонь, пронзенный красными мечами.\n\n«Камень не горит», — хвастался железнорожденный. Но ни один замок не строится только из камня. Дерево и шерсть, пенька и солома, хлеб и солонина и зерно в кладовых — все это загорелось. И железнорождённые не были сделаны из камня. Дымясь, крича, окутанные пламенем, они бежали через дворы, падали с дорожек и разбивались о землю внизу. А камень сам расколется и потечет, если огонь будет достаточно горячим. Башни светились в ночи красным, как пять огромных свечей, и, как свечи, они начали падать и извиваться, расплавленная скала стекала по их бокам.\n\n[fab_ac_harrenhal_lord.GetFirstName] и последний представитель линии [fab_ac_harrenhal_lord.GetHerHis] погибли в аду, поглотившем это чудовищное сиденье. Королевство Островов и Рек погибло вместе с ними, и Речные Земли стали моими."
 fab_ac_riverlands.0018.option1:0 "#bold Дракарис!#!"
 fab_ac_riverlands.0019:0 "Выбор Лорда Трезубца"
 fab_ac_riverlands.0019.desc:0 "Железнорожденное ярмо снято с Трезубца. Три поколения речные земли стонали под Домом Хоара, истекая кровью из-за его войн и его стен — и именно сами речные жители, как и мои драконы, сбросили ярмо. Я имею в виду, что они должны помнить об этом. Но земля без лорда — это земля, находящаяся в состоянии войны сама с собой, и у Трезубца должен быть Верховный Лорд, который будет удерживать ее от моего имени. Два имени имеют наибольшее значение в моих советах.\n\nЭдмин Талли из Риверрана был первым из речных лордов, который встал за меня. Он созвал свои знамена, пока железнорожденные все еще держали Трезубец, и результат был далеко не однозначным, и куда вел Риверран, за ним следовала и остальная часть Трезубца. Речные лорды знают его; они доверяют ему; он один из своих. Верный человек, высоко поднятый благодарным королем — это урок, который я хотел бы, чтобы весь Вестерос усвоил, и усвоил как можно раньше.\n\nИ все же есть Квентон Квохерис, мой старый мастер над оружием в Драконьем Камне, который научил меня владеть мечом, а затем носил его при себе. Кровь Старой Валирии течет в его жилах, как и в моих, — брат по оружию, проверенный задолго до начала этого завоевания. Дайте ему Трезубец, и его сердце будет принадлежать человеку, связанному со мной не только благодарностью.\n\nНекоторые при дворе также высказываются от имени Маллистеров Сигарда — древней и благородной линии, военные корабли которой следят за возвращением железнорождённых.\n\n#bold Кто заслуживает трезубца? #!"
 fab_ac_riverlands.0019.option1:0 "Лорд Талли встал первым. Он поднимется выше всех."
 fab_ac_riverlands.0019.option2:0 "Кровь Старой Валирии будет править Трезубцем."
 fab_ac_riverlands.0020:0 "Новый верховный лорд Трезубца"
 fab_ac_riverlands.0020.desc:0 "Железнорожденный король превратился в пепел, его род прервался, а король, ради которого выросли реки, сохранил веру в людей, которые восстали первыми.\n\nПеред собравшимися речными лордами король Эйгон провозгласил Дом Талли Верховными Лордами Трезубца — это присяга каждого лорда от Орлиного мыса до Девичьего пруда, присягнувшая не гарнизону завоевателя, а Риверрану. Реками управляли речные люди впервые за триста лет.\n\nЯ поставил свой дом на незнакомца с тремя драконами, но мудрым советом было подождать. Каждый лорд, который ждал, может задуматься о разнице между подъемом и преследованием."
 fab_ac_riverlands.0020.option1:0 "Трезубец славит Эйгона Дракона."
 fab_ac_riverlands.0021:0 "Новый хозяин Харренхола"
 fab_ac_riverlands.0021.desc:0 "Харренхол стоит. Это все, что можно о нем сказать: башни, воздвигнутые, чтобы пережить века, расплавлены и почернели, искривлены, как свечи на пиру какого-то великана, а залы внизу все еще пахнут дымом. Но даже разрушенные, эти стены господствуют над сердцем речных земель, и величайший замок, когда-либо построенный людьми, не может оставаться без хозяина.\n\nКвентон Квохерис долгие годы служил мне мастером над оружием Драконьего Камня; именно он первым вложил мне в руку настоящий меч. Его кровь — это кровь Старой Валирии, и он сражался на моей стороне с тех пор, как мы сошли на берег. Посадить Дом Квохерис в Харренхоле — значит поставить человека, которому я доверяю, в центр моего нового королевства — и показать всему Вестеросу, что те, кто следует за драконом, восстают вместе с ним.\n\nПоскольку Дом Хоаров больше не является препятствием, я могу уступить место. Хотя, возможно, такой великий замок вообще не стоит дарить — дракон мог бы пока оставить Харренхол для дома Таргариенов."
 fab_ac_riverlands.0021.option1:0 "Харренхол перейдёт к новооснованному дому Квохерисов."
 fab_ac_riverlands.0021.option2:0 "Валирийская кровь будет охранять сердце Трезубца."
 fab_ac_riverlands.0021.option3:0 "Замок может служить и другой цели."
 fab_ac_riverlands.0021.desc.whole:0 "Харренхол остался цел. Эти пять чудовищных башен были воздвигнуты, чтобы пережить века и пережить своего строителя — черные и огромные над водами Божьего Ока, за стенами, которые ни одна армия Вестероса не могла бы надеяться штурмовать. До пожара так и не дошло; величайший замок, когда-либо построенный людьми, переходит ко мне, и все залы, построенные для смирения королей, теперь ждут меня. Столь обширное место не может сидеть без господина.\n\nКвентон Квохерис долгие годы служил мне мастером над оружием Драконьего Камня; именно он первым вложил мне в руку настоящий меч. Его кровь — это кровь Старой Валирии, и он сражался на моей стороне с тех пор, как мы сошли на берег. Посадить Дом Квохерис в Харренхоле — значит поставить человека, которому я доверяю, в центр моего нового королевства — и показать всему Вестеросу, что те, кто следует за драконом, восстают вместе с ним.\n\nПоскольку Дом Хоаров больше не является препятствием, я могу уступить место. Хотя, возможно, такой великий замок вообще не стоит дарить — дракон мог бы пока оставить Харренхол для дома Таргариенов."
 fab_ac_riverlands.0022:0 "Ключи к великой глупости"
 fab_ac_riverlands.0022.desc:0 "Мой дом последовал за Таргариенами из Валирии до Судного дня, когда уйти было безумием, а остаться — смертью, и с тех пор мы служили на Драконьем Камне — я научил самого короля фехтованию во дворе под Каменным Барабаном.\n\nЯ ожидал скромной награды, когда войны закончатся. Крепость, немного земли. Вместо этого король подарил мне Харренхол — величайший замок, когда-либо построенный людьми, с обгоревшими костями его последнего короля, едва остывшими в башне, которую они теперь называют Королевским шпилем.\n\nРечные лорды искоса поглядывают на возвышающегося над ними валирийского мастера оружия, а простой народ бормочет, что это место проклято. Возможно. Но дом должен где-то начинаться, а Дом Квохерис начинается в самом большом зале Вестероса."
 fab_ac_riverlands.0022.option1:0 "Мы служим Дракону, как и всегда."
 fab_ac_riverlands.0023:0 "Черный король сломлен"
 fab_ac_riverlands.0023.desc:0 "Королю островов и рек пришел конец — его род, его королевство и его хвастовство — и все это за одну ночь. Трезубец принадлежит мне, и речные жители, пролившие кровь, чтобы возвести его стены, теперь преклоняют колени перед домом, который их разрушил.\n\n"
 fab_ac_riverlands.0023.option1:0 "Сокрушим Аргилака! На Штормовой Предел!"
 fab_ac_riverlands.0023.desc.whole:0 "С Королем Островов и Рек покончено: его королевство отнято у него, его хвастовство уничтожено, железная хватка Трезубца разбита навсегда и все остальное. Его башни все еще стоят над Оком Бога, но ни один Хоар больше не будет смотреть на них как на короля. Речные жители, пролившие кровь, чтобы построить его стены, теперь преклоняют колени перед домом, который освободил их от него.\n\n"
 fab_ac_riverlands.0023.desc.south:0 "Теперь все взгляды обращены на юг. Аргилак Высокомерный до сих пор называет себя Королем Шторма, и именно его наглость — руки моего посланника, возвращенные мне в шкатулке — положила начало этой войне. Он не допустит ошибки железнорожденного короля; старый воин не любит стены. Он выйдет навстречу нам с мечом в руке, как это делали короли Дюррандона на протяжении тысячи лет.\n\nУже идут разговоры о том, что последует за ним. У Аргилака нет сына, только его дочь Аргелла, и ни один другой Дюррандон не выжил; некоторые на моих советах хотели бы увидеть верного нашему дому штормовика, поднявшегося над Штормовыми землями после его падения. Решения на другой день. Во-первых, Король Шторма должен получить свой шторм."
 fab_ac_riverlands.0023.desc.south_fallen:0 "Юг меня не дождался. Аргилак Высокомерный мертв, и война, начатая его дерзостью, почти закончилась без него. Его дочь все еще удерживает Штормовой Предел, но повелители бури уже делают выбор между ней и драконом, и этот выбор не заставит себя долго ждать."
 fab_ac_riverlands.0023.option_storm_marching:0 "Трезубец мой. Штормовой Предел станет следующим."
 fab_ac_riverlands.0025:0 "Последний уголёк гаснет"
 fab_ac_riverlands.0025.desc:0 "С Таргариеном покончено: он мертв или прячется на своей скале, в этом нет двух сказок, которые сходятся во мнении. Его грандиозное завоевание завершено, и оно так и не достигло моих стен.\n\nСоляной лорд с тремя зверями, который думал стать королем всего Вестероса, написав письма. Короли островов и рек пережили сотню таких мечтателей.\n\nХарренхол стоит. Это единственный ответ, который мир когда-либо должен был дать ему."
 fab_ac_riverlands.0025.option1:0 "Последний уголек Валирии погас."
 fab_ac_riverlands.0026:0 "Стены были достаточным ответом"
 fab_ac_riverlands.0026.desc:0 "Дракон сломался. Его армия разбросана от Божьего Ока до Трезубца, его лорды едут на юг, поджав хвосты, а половина моего лагеря клянется, что он мертв. Я поверю в это, когда мужчина положит голову мне на стол.\n\nОн пересек мои реки. Он сжег мои поля. А потом он подошел к подножию моих стен и узнал, что такое сорок лет камня. Каждый мечтатель, который думал, что драконы сделали стены бесполезными, теперь может подумать снова.\n\nКоролевство Островов и Рек стоит. Харренхол стоит. Он может прийти снова, когда у него хватит на это смелости."
 fab_ac_riverlands.0026.option1:0 "Он может прийти снова."
