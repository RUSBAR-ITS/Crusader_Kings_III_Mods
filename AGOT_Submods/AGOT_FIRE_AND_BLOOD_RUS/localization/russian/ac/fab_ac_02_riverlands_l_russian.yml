l_russian:
 fab_ac_riverlands.0001:0 "Север или юг"
 fab_ac_riverlands.0001.desc:0 "Корона ничего не решает; она лишь даёт обещание. Моя обещает мне весь Вестерос, а Вестеросом владеют короли, не желающие с ним расставаться. В чертоге Эйгоновой крепости мой совет склонился над картами, и каждый указывает свой путь.\n\nНа севере, за стенами Харренхола, восседает [fab_ac_harrenhal_lord.GetFirstNameNicknamed], правитель Островов и Рек. Железнорождённые возводили этот чудовищный замок сорок лет ценой крови и непосильного труда жителей Речных земель; певцы уверяют, что строительство завершилось в тот самый день, когда я ступил на берег. Пять башен словно пальцы жадной руки, стены слишком высоки и толсты для любой осадной лестницы. [fab_ac_harrenhal_lord.GetFirstName] полагает, что [fab_ac_harrenhal_lord.GetHerHis] каменные стены защитят [fab_ac_harrenhal_lord.GetHerHim]. Речные жители, построившие замок, стонут под этим ярмом. Мне говорят, что некоторые из их лордов поднимутся на мою сторону — если кто-нибудь даст им повод.\n\nНа юге ждёт Аргилак Надменный, старый Король Бури, который отрубил руки моему посланнику и прислал их в ящике. Его гордыня начала эту войну. Он стар, но ещё силён; в отличие от такого противника, как [fab_ac_harrenhal_lord.GetFirstName], он не станет прятаться за стенами. Дюррандон выйдет навстречу в открытое поле, невзирая на бурю. Было бы справедливо ответить ему первым.\n\n#bold Два короля, два пути. Что бы я ни выбрал, война за Вестерос начнётся всерьёз.#!"
 fab_ac_riverlands.0001.option1:0 "Направьте войско к Харренхолу."
 fab_ac_riverlands.0001.option2:0 "Сперва ответим Аргилаку."
 fab_ac_riverlands.0002:0 "Войско разделяется"
 fab_ac_riverlands.0002.desc:0 "Война не станет ждать плотников, и сегодня утром я разделил войско, отправив каждую часть своей дорогой.\n\nМой путь лежит на северо-запад, вверх по Черноводной к Божьему Оку; над войском летит Балерион. Висенья плывёт на север с Деймоном Веларионом и флотом, чтобы узнать, какую цену Долина готова заплатить за мир. Орис держит остальных наготове у южных рубежей, под защитой Рейнис и Мераксес. Аргилак не пожелал принять его как зятя — примет как врага.\n\n#bold Три дороги и три дракона. Моя дорога ведёт к Харренхолу.#!"
 fab_ac_riverlands.0002.option1:0 "Нас с Балерионом будет достаточно."
 fab_ac_riverlands.0003:0 "Битва в тростниках"
 fab_ac_riverlands.0003.desc:0 "Они ждали в высоких тростниках на южном берегу Божьего Ока и удачно выбрали миг для нападения. Моя колонна растянулась вдоль воды, а зыбкая почва проваливалась под тяжестью воинов в доспехах.\n\nНо они не учли, что Балерион уже в воздухе. Он пронёсся низко над водой, тростники запылали от края до края, и битва превратилась в расправу.\n\nПоле осталось за нами. Но воинов у нас теперь меньше, чем утром, и мейстерам предстоит работать до рассвета.\n\n#bold Даже победы в этой стране обойдутся мне кровью. Лучше усвоить этот урок здесь, чем у стен замка.#!"
 fab_ac_riverlands.0003.option1:0 "Поле наше. Вперёд!"
 fab_ac_riverlands.0004:0 "Плакучие ивы"
 fab_ac_riverlands.0004.desc:0 "Они пересекли Божье Око в темноте, обмотав вёсла тканью. Эти воды знакомы им лучше, чем моим разведчикам — берег. Первым знаком их приближения стали ивы, зашевелившиеся там, где не было ветра.\n\nОни ударили по тылу, по раненым и обозу, и исчезли прежде, чем смолкли сигнальные рога. Разбитые повозки, горящие палатки и больше погибших, чем в битве среди тростников."
 fab_ac_riverlands.0004.desc.sons:0 "\n\nПленники назвали предводителей переправы: [fab_ac_hoare_son_a.GetFirstName] и [fab_ac_hoare_son_b.GetFirstName] Хоар."
 fab_ac_riverlands.0004.desc.son:0 "\n\nПленники назвали предводителя переправы: [fab_ac_hoare_son_a.GetFirstName] Хоар."
 fab_ac_riverlands.0004.desc.close:0 "\n\n#bold Они сражались как подобает железнорождённым — и сражались хорошо. Я запомню эти ивы.#!"
 fab_ac_riverlands.0004.option1:0 "Сосчитайте павших. Затем найдите мне эти лодки."
 fab_ac_riverlands.0005:0 "Балерион на воде"
 fab_ac_riverlands.0005.desc:0 "Как бы хорошо железнорождённые ни знали воды, Божье Око — озеро, и драккару здесь негде укрыться. На рассвете они всё ещё были на воде: тяжело нагруженные добычей лодки низко сидели в озере.\n\nБалерион настиг их на открытой воде. Лодки сгорели до ватерлинии, а в кольчуге далеко не уплывёшь."
 fab_ac_riverlands.0005.desc.sons:0 "\n\n[fab_ac_hoare_son_a.GetFirstName] и [fab_ac_hoare_son_b.GetFirstName] Хоар вчера вечером вышли на это озеро. Ни один не вернулся."
 fab_ac_riverlands.0005.desc.son:0 "\n\n[fab_ac_hoare_son_a.GetFirstName] Хоар вышел на озеро вчера вечером. Он не вернулся."
 fab_ac_riverlands.0005.desc.close:0 "\n\n#bold За Плакучие Ивы отомщено. Теперь — Харренхол.#!"
 fab_ac_riverlands.0005.option1:0 "Вести достигнут Харренхола раньше меня."
 fab_ac_riverlands.0006:0 "[fab_ac_harrenhal_lord.GetFirstName] призывает речных лордов"
 fab_ac_riverlands.0006.desc:0 "На рассвете из Харренхола вылетели вороны. [fab_ac_harrenhal_lord.GetFirstName] созывает всех речных лордов к оружию и назначает сбор у стен замка.\n\nМои разведчики уже три дня следят за бродами и дорогой вдоль реки. Ни походных колонн, ни знамён Стоунхеджа или Ярмарочного Поля, ни лодок, плывущих вниз по Трезубцу. Призыв разослан, а Речные земли замерли в тишине.\n\n#bold Каждый лорд, оставивший этот призыв без ответа, уже наполовину ответил на мой.#!"
 fab_ac_riverlands.0006.option1:0 "Запомните, кто придёт. И кто не придёт."
 fab_ac_riverlands.0009:0 "Дракон или кальмар"
 fab_ac_riverlands.0009.desc:0 "Три поколения моего дома таскали камень для памятника королям Хоарам. Три поколения крови и серебра Речных земель поглотила та чёрная громада у Божьего Ока. Железнорождённые управители пересчитывают наши урожаи, а на жалобы отвечают топорами.\n\nТеперь у устья Черноводной стоит лагерем драконий владыка, воюющий с нашим господином. За запертыми дверями каждый речной лорд от Орлиного мыса до Девичьего Пруда задаётся одним вопросом: дракон несёт освобождение или это лишь новый хозяин с ещё более раскалённым клеймом?\n\nУ дома Талли есть свой, древний ответ. Мы некогда были здесь королями — ещё до королей Бури, ещё до кальмаров. Кому бы ни уступил [fab_ac_harrenhal_lord.GetFirstName], победителю понадобятся местные люди, чтобы удержать Речные земли. И лорда, восставшего ПЕРВЫМ, будут чтить больше, чем всех, кто лишь последовал за ним."
 fab_ac_riverlands.0009.option1:0 "Семья, долг, честь. Риверран восстаёт за дракона."
 fab_ac_riverlands.0009.option2:0 "Подождём и преклоним колено перед победителем."
 fab_ac_riverlands.0010.opening:0 "Король Эйгон,"
 fab_ac_riverlands.0010.desc:0 "Тирания [fab_ac_harrenhal_lord.GetFirstNamePossessive] больше не будет терзать Речные земли. Риверран и его знамёна теперь на стороне Дракона.\n\nПриказывайте, как пожелаете, и Трезубец будет вашим."
 fab_ac_riverlands.0010.desc.child:0 "Довольно тирании железнорождённых над Речными землями. Риверран и его знамёна теперь на стороне Дракона.\n\nПриказывайте, как пожелаете, и Трезубец будет вашим."
 fab_ac_riverlands.0011:0 "Риверран восстал"
 fab_ac_riverlands.0011.desc:0 "Весть разносится по Речным землям быстрее любого ворона: лорд Эдмин Талли открыл ворота Риверрана королю-дракону и призвал всех речных лордов восстать. Нынешний их господин, [fab_ac_harrenhal_lord.GetFirstName], должен пасть.\n\nТри поколения мы истекали кровью ради памятника кальмару. Теперь выступили и Блэквуды, и Бракены — впервые за столетие на одной стороне; уже одно это говорит о том, кому благоволят боги. Драконий владыка, говорят, милостив к вассалам и чтит чужих богов и обычаи. Подобной славой [fab_ac_harrenhal_lord.GetFirstName] похвастаться не может.\n\nЕсли Речные земли восстанут вместе, мы будем не мятежниками, а королевством, сбрасывающим чужеземное иго. Если же мы останемся в стороне, а дракон всё равно победит, сыновья спросят нас, где мы были."
 fab_ac_riverlands.0011.option1:0 "Речные земли восстают. Власти железнорождённых пришёл конец."
 fab_ac_riverlands.0011.option2:0 "Подождём и преклоним колено перед победителем."
 fab_ac_riverlands.0013:0 "Стены Чёрного короля"
 fab_ac_riverlands.0013.desc:0 "Харренхол заслоняет горизонт задолго до того, как моё войско достигает берега озера. Пять чудовищных башен возвышаются над стенами, по которым могут проехать шестеро всадников в ряд. Каждый камень потемнел от дождя и речного тумана. [fab_ac_harrenhal_lord.GetFirstNameNicknamed] сорок лет возводил эту твердыню и все эти годы обескровливал Речные земли, оплачивая стройку. Последний камень положили незадолго до моей высадки. [fab_ac_harrenhal_lord.GetSheHe|U] создал гробницу, которая поглотит [fab_ac_harrenhal_lord.GetHerHim], и принял её за королевство.\n\nМои командиры осматривают стены и возвращаются мрачнее тучи. Лестницы такой высоты сломались бы под собственной тяжестью, не достигнув зубцов. Тараны придётся тащить по открытой местности, под огнём сотен бойниц. Один фланг прикрывает озеро, а ворота держат железнорождённые, которыми правит [fab_ac_harrenhal_lord.GetFirstName]. Можно попробовать уморить [fab_ac_harrenhal_lord.GetHerHim] голодом. Возможно, удастся взять замок измором, но здешних запасов хватит не на один урожай. Каждая луна под этими стенами — ещё одна луна передышки для остальных королей Вестероса.\n\nНад шатрами скользит тень Балериона, и ответ становится ясен. Каменные стены останавливают людей. Но небо они не закрывают.\n\nИ всё же первым словом необязательно должен стать огонь. Я могу вызвать противника под мирное знамя. Пусть [fab_ac_harrenhal_lord.GetFirstName] явится на переговоры: я готов пощадить [fab_ac_harrenhal_lord.GetHerHim], если [fab_ac_harrenhal_lord.GetHerHis] корона станет платой за [fab_ac_harrenhal_lord.GetHerHis] жизнь. А могу избавить обитателей замка от драконьего пламени и позволить времени, стали и голоду открыть то, что заперла гордыня."
 fab_ac_riverlands.0013.desc.heir:0 "Харренхол заслоняет горизонт задолго до того, как моё войско достигает берега озера. Пять чудовищных башен возвышаются над стенами, по которым могут проехать шестеро всадников в ряд. Каждый камень потемнел от дождя и речного тумана. Сорок лет крови и тяжкого труда Речных земель ушло на этот замок. Последний камень положили незадолго до моей высадки. Король, воздвигший его, мёртв; теперь здесь правит [fab_ac_harrenhal_lord.GetFirstName].\n\nМои командиры осматривают стены и возвращаются мрачнее тучи. Лестницы такой высоты сломались бы под собственной тяжестью, не достигнув зубцов. Тараны придётся тащить по открытой местности, под огнём сотен бойниц. Один фланг прикрывает озеро, а ворота держат железнорождённые, которыми правит [fab_ac_harrenhal_lord.GetFirstName]. Можно попробовать уморить [fab_ac_harrenhal_lord.GetHerHim] голодом. Возможно, удастся взять замок измором, но здешних запасов хватит не на один урожай. Каждая луна под этими стенами — ещё одна луна передышки для остальных королей Вестероса.\n\nНад шатрами скользит тень Балериона, и ответ становится ясен. Каменные стены останавливают людей. Но небо они не закрывают.\n\nИ всё же первым словом необязательно должен стать огонь. Я могу вызвать противника под мирное знамя. Пусть [fab_ac_harrenhal_lord.GetFirstName] явится на переговоры: я готов пощадить [fab_ac_harrenhal_lord.GetHerHim], если [fab_ac_harrenhal_lord.GetHerHis] корона станет платой за [fab_ac_harrenhal_lord.GetHerHis] жизнь. А могу избавить обитателей замка от драконьего пламени и позволить времени, стали и голоду открыть то, что заперла гордыня."
 fab_ac_riverlands.0013.desc.child:0 "Харренхол заслоняет горизонт задолго до того, как моё войско достигает берега озера. Пять чудовищных башен возвышаются над стенами, по которым могут проехать шестеро всадников в ряд. Каждый камень потемнел от дождя и речного тумана. Сорок лет крови и тяжкого труда Речных земель ушло на этот замок. Последний камень положили незадолго до моей высадки. Король, воздвигший его, мёртв; теперь здесь правит [fab_ac_harrenhal_lord.GetFirstName] — ребёнок, которому ещё не под силу даже поднять меч. Обороной руководят железнорождённые военачальники, выступающие от [fab_ac_harrenhal_lord.GetHerHis] имени.\n\nМои командиры осматривают стены и возвращаются мрачнее тучи. Лестницы такой высоты сломались бы под собственной тяжестью, не достигнув зубцов. Тараны придётся тащить по открытой местности, под огнём сотен бойниц. Один фланг прикрывает озеро, а ворота держат железнорождённые. Возможно, удастся взять замок измором, но здешних запасов хватит не на один урожай. Каждая луна под этими стенами — ещё одна луна передышки для остальных королей Вестероса.\n\nНад шатрами скользит тень Балериона, и ответ становится ясен. Каменные стены останавливают людей. Но небо они не закрывают.\n\nПереговоров не будет. Я не торгуюсь ни с детьми, ни с седыми военачальниками, которые прячутся за ними. За этими стенами нет никого, чьё слово обязало бы железнорождённых соблюдать мир. У них было достаточно возможностей открыть ворота. На закате они узнают цену своим стенам."
 fab_ac_riverlands.0013.option1:0 "Пусть [fab_ac_harrenhal_lord.GetFirstName] явится ко мне. [fab_ac_harrenhal_lord.GetSheHe|U] получит один шанс преклонить колено."
 fab_ac_riverlands.0013.option1.child:0 "Никаких переговоров с ребёнком. На закате Харренхол сгорит."
 fab_ac_riverlands.0013.option2:0 "Нет. Против камня пойдёт камень, а голод откроет ворота."
 fab_ac_riverlands.0014:0 "Перед стенами Харренхола"
 fab_ac_riverlands.0014.desc:0 "[fab_ac_harrenhal_lord.GetFirstName] согласился поговорить, прежде чем начнётся бой. Мы встретились на открытом месте у его чудовищного замка, под мирным знаменем. Я прибыл с горсткой рыцарей, а [fab_ac_harrenhal_lord.GetFirstName] выехал из ворот с сыновьями. Старый король сед, мрачен и твёрд, как столь любимый им камень. В его взгляде не было страха — лишь злое веселье, с каким смотрят на нищего, явившегося требовать хозяйские чертоги.\n\nЗа ним высились пять башен, и в одном я отдам старому пауку должное: подобных стен люди ещё не возводили. В них — сорок лет крови и тяжкого труда Речных земель. Не будь у меня драконов, я мог бы состариться и умереть под этими стенами.\n\nНо у меня есть драконы. Так начнём с условий: щедрых, но предложенных лишь однажды."
 fab_ac_riverlands.0014.desc.heir:0 "[fab_ac_harrenhal_lord.GetFirstName] соглашается поговорить, прежде чем начнётся бой. Мы встречаемся на открытом месте у Харренхола, под мирным знаменем. Я привожу горстку рыцарей. Из ворот выезжает [fab_ac_harrenhal_lord.GetFirstName], а следом — [fab_ac_harrenhal_lord.GetHerHis] железнорождённые военачальники. В [fab_ac_harrenhal_lord.GetHerHis] глазах нет страха: [fab_ac_harrenhal_lord.GetSheHe] смотрит на меня лишь с презрением, словно нищий явился требовать [fab_ac_harrenhal_lord.GetHerHis] чертоги.\n\nЗа спиной моего противника возвышаются пять башен, будто защищая [fab_ac_harrenhal_lord.GetHerHim]. В одном отдам должное: подобных стен люди ещё не возводили. В них — сорок лет крови и тяжкого труда Речных земель. Не будь у меня драконов, я мог бы состариться и умереть под этими стенами.\n\nНо у меня есть драконы. Так начнём с условий: щедрых, но предложенных лишь однажды."
 fab_ac_riverlands.0014.option1:0 "#bold Сдайтесь сейчас, и вы останетесь лордом Железных островов. #!"
 fab_ac_riverlands.0014.option2:0 "#bold Сдайтесь сейчас, и ваши сыновья будут живы и станут править после вас. #!"
 fab_ac_riverlands.0014.option2.heir:0 "#bold Сдайтесь сейчас, и ваши потомки будут править островами после вас. #!"
 fab_ac_riverlands.0014.option3:0 "#bold Перед вашими стенами у меня восемь тысяч воинов. #!"
 fab_ac_riverlands.0015:0 "Крепкие и толстые"
 fab_ac_riverlands.0015.desc:0 "Старый король молча выслушал мои условия. Сыновья смотрели на него; один, кажется, принял бы предложение, будь решение за ним. Но решал не он. [fab_ac_harrenhal_lord.GetFirstName] наклонился в седле, сплюнул и ответил:\n\n#bold «Что за моими стенами, меня не касается. Эти стены крепки и толсты».#!\n\nКрепки и толсты. Каждый их камень оплачен кровью Речных земель, каждая башня проклята вдовами тех, кто погиб, возводя её. Сорок лет он выжимал этот замок из покорённого народа, а теперь намерен укрыться внутри и ждать, пока моё войско разобьётся о ворота.\n\nОн всё ещё думает о стенах. Он ещё не понял, что высадилось на его берегах."
 fab_ac_riverlands.0015.desc.heir:0 "[fab_ac_harrenhal_lord.GetFirstName] молча выслушивает мои условия. Все [fab_ac_harrenhal_lord.GetHerHis] военачальники смотрят на своего правителя, ожидая ответа. Думаю, многие приняли бы предложение, будь решение за ними. Но выбирают не они: сейчас все слушают только [fab_ac_harrenhal_lord.GetHerHim]. [fab_ac_harrenhal_lord.GetFirstName] наклоняется в седле и сплёвывает. Вот [fab_ac_harrenhal_lord.GetHerHis] ответ:\n\n#bold «Что за моими стенами, меня не касается. Эти стены крепки и толсты».#!\n\nКрепки и толсты. Каждый их камень оплачен кровью Речных земель, каждая башня проклята вдовами тех, кто погиб, возводя её. Теперь [fab_ac_harrenhal_lord.GetSheHe] собирается укрыться за ними и ждать, пока моё войско разобьётся о ворота.\n\n[fab_ac_harrenhal_lord.GetSheHe|U] всё ещё думает о стенах. [fab_ac_harrenhal_lord.GetSheHe|U] ещё не понимает, что высадилось на [fab_ac_harrenhal_lord.GetHerHis] берегах."
 fab_ac_riverlands.0015.option1:0 "#bold Но недостаточно высоки, чтобы остановить драконов. Драконы летают. #!"
 fab_ac_riverlands.0016:0 "Камень не горит"
 fab_ac_riverlands.0016.desc:0 "Впервые в глазах старого короля что-то промелькнуло: ещё не страх, но его первая тень. Он быстро совладал с собой, и ответ упал, словно опускная решётка:\n\n#bold «Я строил из камня. Камень не горит».#!\n\nВот она, вся его вера, обнажённая под мирным знаменем. [fab_ac_harrenhal_lord.GetFirstName] верит в это. Он убедил себя, что столь высокая громада жестокости устоит перед чем угодно: перед богами, временем и драконами.\n\nЗа башнями, низко на западе, краснеет солнце. Слова исчерпаны. Мне осталось сказать лишь одно, затем развернуть коня и проделать долгий путь обратно к войску. И я не оглянусь."
 fab_ac_riverlands.0016.desc.heir:0 "Впервые [fab_ac_harrenhal_lord.GetFirstName] выдаёт взглядом что-то: ещё не страх, но его первую тень. [fab_ac_harrenhal_lord.GetSheHe|U] быстро берёт себя в руки, и [fab_ac_harrenhal_lord.GetHerHis] ответ падает, словно опускная решётка:\n\n#bold «Харренхол построен из камня. Камень не горит».#!\n\nВот она, вся вера моего противника, обнажённая под мирным знаменем. [fab_ac_harrenhal_lord.GetFirstName] не сомневается в своих словах. [fab_ac_harrenhal_lord.GetSheHe|U] верит в это. [fab_ac_harrenhal_lord.GetSheHe|U] полагает, что столь высокая громада жестокости устоит перед чем угодно: перед богами, временем и драконами.\n\nЗа башнями, низко на западе, краснеет солнце. Слова исчерпаны. Мне осталось лишь предупредить [fab_ac_harrenhal_lord.GetHerHim], затем развернуть коня и проделать долгий путь обратно к войску. И я не оглянусь."
 fab_ac_riverlands.0016.option1:0 "#bold Когда солнце сядет, ваш род пресечётся. #!"
 fab_ac_riverlands.0017:0 "Переговоры у ворот"
 fab_ac_riverlands.0017.desc:0 "Драконий владыка явился к моим воротам под мирным знаменем. Я выезжаю ему навстречу. Он моложе, чем мне представлялось, и немногословнее — надо признать, слов на ветер не бросает.\n\nОн предлагает сохранить Железные острова за моим родом, если я сдамся, и указывает на тысячи воинов, стоящих лагерем у стен. Мой ответ прост: то, что за стенами, меня не касается. Подобных стен прежде не возводили.\n\n#bold «Но недостаточно высоки, чтобы остановить драконов,#! — говорит он. — #bold Драконы летают».#!\n\nЯ строил из камня, отвечаю я. Камень не горит.\n\nОн смотрит на меня, словно на уже вырытую могилу, и даёт срок до заката. Сыновья наблюдают с башен. Выбор за мной."
 fab_ac_riverlands.0017.desc.heir:0 "Драконий владыка явился к моим воротам под мирным знаменем. Я выезжаю ему навстречу. Он моложе, чем мне представлялось, и немногословнее — надо признать, слов на ветер не бросает.\n\nОн предлагает сохранить Железные острова за моим родом, если я сдамся, и указывает на тысячи воинов, стоящих лагерем у стен. Мой ответ прост: то, что за стенами, меня не касается. Подобных стен прежде не возводили.\n\n#bold «Но недостаточно высоки, чтобы остановить драконов,#! — говорит он. — #bold Драконы летают».#!\n\nХарренхол построен из камня, отвечаю я. Камень не горит.\n\nОн смотрит на меня, словно на уже вырытую могилу, и даёт срок до заката. Родичи наблюдают с башен. Выбор за мной."
 fab_ac_riverlands.0017.option1:0 "Камень не горит. Пусть делает что хочет."
 fab_ac_riverlands.0017.option2:0 "Преклонить колено и сохранить острова."
 fab_ac_riverlands.0018:0 "Харренхол в огне"
 fab_ac_riverlands.0018.desc:0 "[fab_ac_harrenhal_lord.GetFirstName] дал ответ. Но [fab_ac_harrenhal_lord.GetHerHis] слова ничего не решали. Что ж, пусть будет так.\n\nНа закате я поднялся на Балерионе всё выше во тьму, сквозь холод и облака. Величайший замок Вестероса стал россыпью угольков далеко внизу, а дракон на фоне луны казался не больше мотылька. Там мы развернулись. Оттуда устремились вниз.\n\nНа чёрных, как смоль, крыльях Балерион пронзил ночь. Когда пять башен Харренхола выросли навстречу, он разверз пасть и омыл их чёрным пламенем с красными полосами, подобными мечам.\n\n«Камень не горит», — хвастал [fab_ac_harrenhal_lord.GetFirstName]. Но ни один замок не состоит из одного лишь камня. Дерево и шерсть, пенька и солома, хлеб, солонина и зерно в кладовых — всё запылало. И [fab_ac_harrenhal_lord.GetHerHis] железнорождённые были не каменными. Охваченные пламенем, крича и дымясь, они бежали через дворы, падали со стен и разбивались о землю. Да и сам камень трескается и плавится в достаточно жарком огне. Башни краснели в ночи, словно пять огромных свечей, и, как свечи, оседали и искривлялись; расплавленный камень стекал по их стенам.\n\n[fab_ac_harrenhal_lord.GetFirstNameNicknamed] и последние представители [fab_ac_harrenhal_lord.GetHerHis] рода погибли в огненном аду, поглотившем чудовищный замок. Вместе с ними погибло королевство Островов и Рек, а Речные земли стали моими."
 fab_ac_riverlands.0018.desc.child:0 "Я не ждал ответа от ребёнка и не стал его требовать.\n\nНа закате я поднялся на Балерионе всё выше во тьму, сквозь холод и облака. Величайший замок Вестероса стал россыпью угольков далеко внизу, а дракон на фоне луны казался не больше мотылька. Там мы развернулись. Оттуда устремились вниз.\n\nНа чёрных, как смоль, крыльях Балерион пронзил ночь. Когда пять башен Харренхола выросли навстречу, он разверз пасть и омыл их чёрным пламенем с красными полосами, подобными мечам.\n\n«Камень не горит», — хвастались железнорождённые. Но ни один замок не состоит из одного лишь камня. Дерево и шерсть, пенька и солома, хлеб, солонина и зерно в кладовых — всё запылало. И сами железнорождённые были не каменными. Охваченные пламенем, крича и дымясь, они бежали через дворы, падали со стен и разбивались о землю. Да и сам камень трескается и плавится в достаточно жарком огне. Башни краснели в ночи, словно пять огромных свечей, и, как свечи, оседали и искривлялись; расплавленный камень стекал по их стенам.\n\n[fab_ac_harrenhal_lord.GetFirstName] и последние представители [fab_ac_harrenhal_lord.GetHerHis] рода погибли в огненном аду, поглотившем чудовищный замок. Вместе с ними погибло королевство Островов и Рек, а Речные земли стали моими."
 fab_ac_riverlands.0018.option1:0 "#bold Дракарис!#!"
 fab_ac_riverlands.0019:0 "Выбор лорда Трезубца"
 fab_ac_riverlands.0019.desc:0 "Трезубец сбросил ярмо железнорождённых. Три поколения Речные земли стонали под властью Хоаров, платя кровью за их войны и стены. Освободились они не только благодаря моим драконам, но и собственными силами; я хочу, чтобы они это помнили. Однако земля без лорда обречена на междоусобицы. Трезубцу нужен верховный лорд, который будет править от моего имени. На совете чаще всего звучат два имени.\n\nЭдмин Талли из Риверрана первым среди речных лордов поднялся на мою сторону. Он созвал знамёна, когда железнорождённые ещё держали Трезубец, а исход борьбы был далеко не ясен. За Риверраном пошли остальные. Речные лорды знают его, доверяют ему — он свой. Верный человек, возвышенный благодарным королём: этот урок должен усвоить весь Вестерос, и чем скорее, тем лучше.\n\nНо есть и Квентон Квохерис, мой старый мастер над оружием с Драконьего Камня: он учил меня владеть мечом, а после сражался рядом. В его жилах, как и в моих, течёт кровь древней Валирии. Верный соратник, испытанный задолго до Завоевания. Если отдать ему Трезубец, сердце этих земель окажется в руках человека, связанного со мной не одной благодарностью.\n\nНекоторые при дворе предлагают и Маллистеров из Сигарда — древний и благородный род, чьи боевые корабли защитят берега от возвращения железнорождённых.\n\n#bold Кто достоин Трезубца?#!"
 fab_ac_riverlands.0019.option1:0 "Лорд Талли восстал первым. Он и возвысится над остальными."
 fab_ac_riverlands.0019.option2:0 "Кровь древней Валирии будет править Трезубцем."
 fab_ac_riverlands.0020:0 "Новый верховный лорд Трезубца"
 fab_ac_riverlands.0020.desc:0 "Король железнорождённых обратился в пепел, род его пресёкся, а король, за которого восстали Речные земли, сдержал слово перед теми, кто поднялся первым.\n\nПеред собравшимися речными лордами король Эйгон объявил дом Талли верховными лордами Трезубца. Каждый лорд от Орлиного мыса до Девичьего Пруда присягнёт Риверрану, а не гарнизону завоевателя. Впервые за триста лет Речными землями будут править свои.\n\nЯ поставил судьбу своего дома на чужеземца с тремя драконами, когда благоразумие велело выждать. Теперь каждый, кто ждал, может задуматься о разнице между тем, кто поднимается первым, и тем, кто идёт следом."
 fab_ac_riverlands.0020.option1:0 "Трезубец славит Эйгона Дракона."
 fab_ac_riverlands.0021:0 "Новый хозяин Харренхола"
 fab_ac_riverlands.0021.desc:0 "Харренхол стоит. Большего о нём не скажешь: башни, возведённые на века, почернели, оплавились и искривились, словно свечи на пиру великана. Из нижних залов ещё тянет дымом. Но даже в руинах эти стены господствуют над сердцем Речных земель. Величайший замок, когда-либо построенный людьми, не может оставаться без лорда.\n\nКвентон Квохерис долгие годы служил мастером над оружием на Драконьем Камне. Он первым вложил настоящий меч в мою руку. В нём течёт кровь древней Валирии, и он сражается рядом со мной с самой высадки. Посадить Квохерисов в Харренхоле — значит поставить в сердце нового королевства человека, которому я доверяю, и показать Вестеросу: следующие за драконом возвышаются вместе с ним.\n\nДом Хоаров больше не стоит на пути, и я волен пожаловать замок кому захочу. Хотя, быть может, столь великую крепость вовсе не стоит отдавать: пока дракон мог бы оставить Харренхол дому Таргариенов."
 fab_ac_riverlands.0021.option1:0 "Харренхол перейдёт к новооснованному дому Квохерисов."
 fab_ac_riverlands.0021.option2:0 "Валирийская кровь будет охранять сердце Трезубца."
 fab_ac_riverlands.0021.option3:0 "Замок может служить и другой цели."
 fab_ac_riverlands.0021.desc.whole:0 "Харренхол стоит невредимым. Пять чудовищных башен, воздвигнутых на века, пережили своего создателя. Огромные и чёрные, они высятся над Божьим Оком за стенами, которые не взяло бы штурмом ни одно войско Вестероса. До огня дело не дошло: величайший замок, когда-либо построенный людьми, переходит ко мне целым, камень к камню. Чертоги, призванные смирять королей, ждут моего двора. Такая твердыня не может оставаться без лорда.\n\nКвентон Квохерис долгие годы служил мастером над оружием на Драконьем Камне. Он первым вложил настоящий меч в мою руку. В нём течёт кровь древней Валирии, и он сражается рядом со мной с самой высадки. Посадить Квохерисов в Харренхоле — значит поставить в сердце нового королевства человека, которому я доверяю, и показать Вестеросу: следующие за драконом возвышаются вместе с ним.\n\nДом Хоаров больше не стоит на пути, и я волен пожаловать замок кому захочу. Хотя, быть может, столь великую крепость вовсе не стоит отдавать: пока дракон мог бы оставить Харренхол дому Таргариенов."
 fab_ac_riverlands.0022:0 "Ключи от великого безумия"
 fab_ac_riverlands.0022.desc:0 "Мой дом покинул Валирию вслед за Таргариенами ещё до Рока, когда уйти казалось безумием, а остаться означало смерть. С тех пор мы служим на Драконьем Камне. Я сам учил короля владеть мечом во дворе у Каменного Барабана.\n\nПосле войны я надеялся на скромную награду: небольшую крепость, немного земли. Вместо этого король даровал мне Харренхол — величайший замок, когда-либо возведённый людьми. Обгоревшие кости его последнего короля едва успели остыть в башне, которую теперь зовут Королевским Костром.\n\nРечные лорды косятся на валирийского мастера над оружием, возвышенного над ними, а простолюдины шепчутся о проклятии. Возможно. Но всякому дому надо с чего-то начинать, и дом Квохерисов начинает с величайшего чертога Вестероса."
 fab_ac_riverlands.0022.option1:0 "Мы служим Дракону, как и всегда."
 fab_ac_riverlands.0023:0 "Чёрный король сломлен"
 fab_ac_riverlands.0023.desc:0 "Королю Островов и Рек пришёл конец: за одну ночь исчезли его род, его королевство и его похвальба. Трезубец мой, а жители Речных земель, платившие кровью за возведение его стен, теперь преклоняют колено перед домом, который их разрушил.\n\n"
 fab_ac_riverlands.0023.option1:0 "Сокрушим Аргилака! На Штормовой Предел!"
 fab_ac_riverlands.0023.desc.whole:0 "С королём Островов и Рек покончено. Королевство отнято, похвальба посрамлена, власть железнорождённых над Трезубцем сломлена навсегда. Башни ещё возвышаются над Божьим Оком, но ни один Хоар больше не взглянет на них как король. Жители Речных земель, платившие кровью за эти стены, теперь преклоняют колено перед домом, избавившим их от тирана.\n\n"
 fab_ac_riverlands.0023.desc.south:0 "Теперь все взгляды обращены на юг. Аргилак Надменный по-прежнему зовёт себя Королём Бури. Именно его дерзость — руки моего посланника, присланные в ящике, — положила начало войне. Он не повторит ошибки железнорождённого короля: старый воин не любит прятаться за стенами. Он выйдет нам навстречу с мечом в руке, как делали короли Дюррандоны тысячу лет.\n\nУже говорят о том, что будет после него. У Аргилака нет сына, лишь дочь Аргелла, а других Дюррандонов не осталось. Некоторые мои советники хотели бы после его падения поставить над Штормовыми землями местного лорда, верного нашему дому. Это решим в другой день. Сперва Король Бури должен встретить свою бурю."
 fab_ac_riverlands.0023.desc.south_fallen:0 "Юг не стал ждать меня. Аргилак Надменный мёртв, и война, начатая его дерзостью, почти завершилась без него. Дочь ещё удерживает Штормовой Предел, но лорды Штормовых земель уже выбирают между нею и драконом. Долго этот выбор не займёт."
 fab_ac_riverlands.0023.option_storm_marching:0 "Трезубец мой. Штормовой Предел станет следующим."
 fab_ac_riverlands.0025:0 "Последний уголёк гаснет"
 fab_ac_riverlands.0025.desc:0 "С Таргариеном покончено. Одни говорят, он мёртв, другие — что прячется на своей скале. Великое завоевание завершилось, даже не достигнув моих стен.\n\nКакой-то островной лордик с тремя чудовищами думал стать королём всего Вестероса, рассылая письма. Короли Островов и Рек пережили сотню таких мечтателей.\n\nХарренхол стоит. Это единственный ответ, который мир должен был ему дать."
 fab_ac_riverlands.0025.option1:0 "Последний уголёк Валирии погас."
 fab_ac_riverlands.0026:0 "Стены были достаточным ответом"
 fab_ac_riverlands.0026.desc:0 "Дракон отступил. Его войско рассеяно от Божьего Ока до Трезубца, лорды бегут на юг, поджав хвосты, а половина моего лагеря клянётся, что он мёртв. Я поверю, когда мне принесут его голову.\n\nОн пересёк мои реки. Сжёг мои поля. А затем подошёл к стенам и понял, что значат сорок лет, воплощённые в камне. Теперь пусть каждый мечтатель, решивший, будто драконы сделали стены бесполезными, подумает ещё раз.\n\nКоролевство Островов и Рек стоит. Харренхол стоит. Пусть приходит снова, когда наберётся духу."
 fab_ac_riverlands.0026.option1:0 "Пусть попробует прийти снова."
