l_russian:
 ourfury.0001:0 "Посланник Дракона"
 ourfury.0001.desc:0 "Посланник драконьего владыки стоит передо мной в большом зале с ответом Эйгона. Я велю огласить его перед моими лордами. Я предложил Эйгону Таргариену руку дочери, а в приданое — земли к востоку от Божьего Ока, между Трезубцем и Черноводной. Когда-то ими владели короли Бури, теперь владеет Харрен Хоар. Взамен я просил поддержки Драконьего Камня, когда придёт пора свести счёты с Харреном. Разумное предложение. Если Эйгону нужны земли, Харрену есть что терять, а у меня всегда хватало духу их отобрать.\n\nЭйгон отказывается от брака. У него уже две жены, обе — его сёстры, и язычник заявляет, что третья ему не нужна. Вместо себя он предлагает Аргелле своего единокровного брата, Ориса Уотерса. Посланник называет его соратником и военачальником Эйгона, словно командование войском способно привести отца на свадьбу бастарда или дать тому имя, достойное быть высеченным над воротами. Орис — незаконнорождённый, и Эйгон предлагает пустить его в постель моей дочери.\n\nНо и это не всё. Названные мною земли Эйгон согласен принять лишь как начало приданого. Ему нужен ещё Крюк Масси и штормовые земли к югу от Черноводной, вплоть до Путеводной и верховьев Мандера. Эти земли уже принадлежат мне. Их держат люди, поклявшиеся перед богами и людьми в верности Штормовому Пределу. Я предложил ему шкуру Харрена, а дракон потянулся за моей.\n\nВ этом зале есть люди, которые сбросили бы посланника со скал и за меньшее. Я их не виню. Но гнев — плохой повод выслушать врага лишь наполовину. Прежде чем решить, какого ответа заслуживает наглость Эйгона, я узнаю её целиком."
 ourfury.0001.a:0 "Стража! Отрубить ему руки. Других рук Эйгон не получит."
 ourfury.0001.b:0 "Договаривай. Что ещё предлагает дракон?"
 ourfury.0001.c:0 "Передай на Драконий Камень мой отказ. Я услышал достаточно."
 ourfury.0002:0 "Условия брака с бастардом"
 ourfury.0002.desc:0 "Я позволяю посланнику договорить. Орис Уотерс женится на Аргелле, а земли к востоку от Божьего Ока, названные мною вначале, отойдут с нею в приданое, если мы отвоюем их у Харрена. Эйгон также требует Крюк Масси и земли между Черноводной, Путеводной и верхним Мандером. Взамен Драконий Камень выступает со мной против Харрена Хоара. Силы Эйгона будут направлены на север, не на юг; ни одному королю не придётся присягать другому.\n\nПоследнее и спасает предложение от нужника. В письме Эйгона нет ни требования покорности, ни дани, ни притязаний на Штормовой Предел. Ему нужны земли, брак и общая война. При всех своих языческих обычаях он хотя бы помнит, что пишет коронованному королю, а не вызывает к себе в зал мелкого лордика.\n\nЗагвоздка — в Орисе. Аргелла — моя единственная наследница, и её муж окажется ближе к Штормовому Пределу, чем вправе оказаться чужак. Однако Семеро не повелевали дому жены растворяться в доме мужа лишь потому, что писцам так удобнее. Если Орис войдёт в мой дом через Аргеллу, то на моих условиях. Ребёнок, который унаследует ей, может носить имя Дюррандон, получить от матери кровь Дюррандонов и занять престол, на котором сидели её предки, когда Драконий Камень был ещё дымящейся скалой.\n\nПусть Эйгон получит земли и брак, которых просит. Я получу его силу против Харрена, а Штормовой Предел останется за моей кровью и моим именем. Если этого ему мало, значит, союза он никогда и не желал. #bold Орис Уотерс может жениться на моей дочери, но наследником Штормового Предела будет Дюррандон.#!"
 ourfury.0002.a:0 "Он войдёт в мой род — или свадьбы не будет. Так и передайте."
 ourfury.0002.b:0 "Нет. Тысячелетний род Дюррандонов не оборвётся в этом зале."
 ourfury.0003:0 "Ворон на Драконий Камень"
 ourfury.0003.desc:0 "Ворон покидает Штормовой Предел ещё до сумерек. Я пишу ответ сам: дело достаточно простое, чтобы уместить его в одну строку, и достаточно важное, чтобы не позволить мейстеру притупить остроту моих слов.\n\n#italic Твоему брату здесь будут рады. Его сыновья станут Дюррандонами.#!\n\nУ моих лордов есть возражения, и они не стесняются их высказывать. Одним не по душе происхождение Ориса, другим — земли, которых требует Эйгон, третьим — любой договор с человеком, который спит с собственными сёстрами и зовёт это браком. Я выслушал всех. Семеро могут судить душу Эйгона, когда пожелают; меня занимают Харрен Хоар, три дракона и вопрос, останется ли дом Дюррандон в Штормовом Пределе после войны.\n\nЯ уступил земли, чтобы не воевать одновременно с Харреном и Драконьим Камнем. Но ни короны, ни рода я не уступал. Если Эйгон примет условие, Орис явится на юг мужем Аргеллы, и договор будет в силе. Если откажется — пусть оставляет бастарда себе и иным путём узнаёт, какова цена Штормовых земель. #bold Условия отправлены. Пусть Драконий Камень принимает их — или подавится.#!"
 ourfury.0003.a:0 "Скоро мы получим ответ Эйгона."
 ourfury.0004:0 "Ответ Дракона"
 ourfury.0004.desc:0 "Ответ с Драконьего Камня приходит раньше, чем я ожидал. Эйгон принимает условие без споров. Орис прибудет в Штормовой Предел, чтобы обвенчаться перед моим двором и под взорами Семерых. Дети Аргеллы будут носить имя Дюррандон и наследовать по её линии.\n\nОстальная часть письма посвящена землям и войне. Крюк Масси и земли к югу от Черноводной перейдут к Эйгону, как и условлено. Когда наши знамёна выступят против Харрена Хоара, Драконий Камень пойдёт с нами. Эйгон пишет, что ему незачем ссориться с домом, который верен заключённому договору, и незачем губить древний род лишь ради доказательства своей силы. Прекрасные слова для человека с тремя драконами. Мне предлагали худшие условия люди, за которыми стояло куда меньше.\n\nЯ ожидал торга из-за единственного условия, которым не готов поступиться. Вместо этого Эйгон сразу согласился. Либо он понимает цену дома Дюррандон, либо настолько уверен в себе, что позволяет мне сохранить имя, забирая всё остальное, чего хочет. Скоро я узнаю. #bold Я искал союзника против Харрена и нашёл его. Теперь посмотрим, так ли хорошо дракон держит слово, как даёт его на бумаге.#!"
 ourfury.0004.a:0 "Откройте ему ворота. Штормовой Предел не боится какого-то бастарда."
 ourfury.0004.b:0 "Нет. Я передумал связывать свою наследницу браком с Драконьим Камнем."
 ourfury.0005:0 "Свадьба в Штормовом Пределе"
 ourfury.0005.desc:0 "Они венчаются в большом зале под кровом Дюррана — перед Семерыми, собравшимися лордами Штормовых земель и столькими свидетелями, что никто впоследствии не сможет притвориться, будто неверно понял уговор. Септон называет Аргеллу Дюррандон и Ориса Уотерса перед Отцом и Матерью, соединяет их руки и призывает Семерых засвидетельствовать клятвы. Эйгон волен как угодно оправдывать браки братьев с сёстрами на Драконьем Камне. В Штормовом Пределе моя дочь выходит замуж по законам богов и людей.\n\nОрис совсем не таков, каким некоторые мои лорды представляли бастарда с Драконьего Камня. Он широкоплеч, немногословен и осмотрительно учтив. На пиру его, как водится, испытывают, но он никому не даёт повода для искомой ссоры. Я почти предпочёл бы обратное: о человеке легче судить по вспышке гнева, чем по терпению. Но условия брака он повторяет перед всем залом без колебаний. Наследство Аргеллы принадлежит ей, а дети, которые получат его через неё, будут Дюррандонами Штормового Предела.\n\nАргелла пристально наблюдает за ним с самого приезда и находит для него больше слов, чем нашла для меня, когда речь зашла о браке. Я не стану называть несколько разговоров привязанностью — и не требую её. Короли заключали браки и по худшим причинам, чем земли, кровь и полезный меч. Многим доставались зятья хуже человека, с которым дочь хотя бы может разговаривать. Брак законен, наследование определено, Семеро услышали клятвы. #bold Орис вошёл в дом Дюррандон. Дом Дюррандон не вошёл в его дом.#!"
 ourfury.0005.a:0 "Нам ярость — и никакой брак этого не изменит."
 ourfury.0005.b:0 "Наливайте вино. Сегодня есть за что выпить."
 ourfury.0006:0 "Буря идёт на север"
 ourfury.0006.desc:0 "Брак исполнил половину уговора. Вторая половина — Харрен Хоар. Его чудовищный замок возвышается у Божьего Ока, а подвластные ему Речные земли лежат между моим королевством и землями, обещанными в приданое Аргелле. Чтобы они сменили хозяина, надо прежде вырвать их у Харрена. Я мечтал унизить этого железнорождённого мерзавца задолго до того, как Эйгон Таргариен научился смотреть на запад.\n\nЛорды Штормовых земель собираются и выступают на север по старым дорогам через Королевский лес к Черноводной. С ними едет Орис, а знамёна Эйгона уже движутся с Драконьего Камня. Я не намерен губить добрых воинов у стен Харренхола, если драконий огонь справится с камнем меньшей ценой. Но замок — ещё не королевство. У Харрена есть речные лорды, броды, амбары, паромные переправы и армии. Всё это нужно сдерживать и брать под контроль, пока драконы завоёвывают земли, за которые я заплатил.\n\nТак буря идёт с драконом против железнорождённых. Я предпочёл бы законнорождённого зятя и меньшую цену союза. Но договор скреплён клятвой, а я держу клятвы, какие бы вольности Эйгон ни позволял себе с законами богов и людей в собственной постели. #bold Трубите сбор. Харрен слишком долго владел украденными землями.#!"
 ourfury.0006.a:0 "Буря идёт на север. Харрен первым отнял наши земли."
 ourfury.0006.b:0 "Пусть едут мои лорды. Королю незачем самому мерить каждую дорогу."
 ourfury.0007:0 "Союзник на моей границе"
 ourfury.0007.desc:0 "Эйгон Таргариен высадился в устье Черноводной, у трёх холмов, где рыбаки вытаскивают лодки на берег. Впервые за мою жизнь чужое войско появилось в нескольких днях пути от моей границы, а ни один житель Штормовых земель не потянулся за мечом.\n\nКрюк Масси теперь его. Как и земли к югу, до Путеводной. Я отдал их собственноручной подписью и своей печатью — прежде я не делал такого ни для кого. Не стану притворяться, будто их у меня отняли. Лордам, державшим их от Штормового Предела, предстоят новые клятвы, и ни одну из присланных ими жалоб я не пожелал бы читать вслух.\n\nГод назад к этим стенам прискакали гонцы с вестью о драконах над морем, и люди схватились за мечи. Сегодня утром гонцы принесли ту же весть — и смысл у неё обратный. Как только закончится сбор, звери полетят на север. Сорок лет Харрен Хоар возводил стены в ожидании достойного врага. Теперь ждать осталось недолго.\n\n#bold Уговор заключён. Пусть дракон докажет, что стоит уплаченной мною цены.#!"
 ourfury.0007.a:0 "Теперь дракон мой. Харрен узнает об этом первым."
 ourfury.0010:0 "Цена мира"
 ourfury.0010.desc:0 "Война изменила Вестерос. Власть Харрена над Речными землями сломлена, но на нём устремления Эйгона не закончились. Из-за границы приходят вести о сражениях, договорах, покорности и отказах, однако наш уговор остаётся прежним. Штормовые земли не подчинены Эйгону: с ним нас связывают брак и договор, а не присяга. Я не позволю успехам в других краях заставить его забыть эту разницу.\n\nЭйгон прибывает в Штормовой Предел обсудить будущее. Не дожидаясь вопроса, он подтверждает: дети Аргеллы останутся Дюррандонами, а прежние соглашения о землях и правах будут соблюдены. Затем язычник, некогда писавший мне как король королю, просит единственное, чего раньше не касался.\n\nЕму нужна моя корона. Я должен сложить королевский титул и остаться лордом Штормового Предела. При мне будут Штормовые земли, вассалы, доходы и наследники. Я буду править той же страной с того же престола, но под короной Эйгона, а не собственной. Ради этой скалы Дюрран Богоборец бросил вызов самим богам. Теперь Эйгон Таргариен просит отдать ему то, чего не смогли отнять ни бури, ни железнорождённые, ни андалы, ни дорнийцы.\n\nЯ знаю, что означает война с его домом. Я видел драконов в деле. Лишь глупец принимает знание вражеской силы за страх перед нею. Вопрос в другом: тратить ли жизни моих лордов и их сыновей ради обруча на лбу — или отдать Эйгону титул и сохранить всё остальное? #bold Если я склонюсь, то потому, что сам выбрал, чем дом Дюррандон может пожертвовать. Не потому, что меня запугал язычник.#!"
 ourfury.0010.a:0 "Корона — лишь металл. Штормовой Предел — это камень, кровь и люди."
 ourfury.0010.b:0 "Дюрран не склонился перед богами. Я не склонюсь перед язычником."
 ourfury.0011:0 "Буря склоняется, но не сломлена"
 ourfury.0011.desc:0 "Всё происходит в моём зале, перед моими лордами. Если уж я снимаю корону Дюррана, пусть каждый лорд Штормовых земель видит: у моего горла нет меча. Я сам вкладываю её в руки Эйгона. Он принимает её без торжества, откладывает и провозглашает меня лордом Штормового Предела, закрепляя Штормовые земли за мной и моими наследниками под своей короной.\n\nЗатем лорды присягают заново. Вчера их клятвы заканчивались на мне. Сегодня через меня они восходят к Эйгону. Но люди, замки, подати, суд и ополчение Штормовых земель остаются в прежних руках. Аргелла по-прежнему моя наследница, а её дети будут Дюррандонами Штормового Предела. Эйгон получил присягу короля, а не право перечеркнуть тысячу лет моего рода.\n\nУтром, когда септон завтракал, я ещё был королём. Теперь — нет. Не стану притворяться, будто эта потеря ничего не значит, но и унижаться из-за неё не буду. Харрен потерял земли, род и, возможно, многое ещё. Я потерял корону, сохранив Штормовой Предел, дочь, имя и всех лордов, которые имели значение вчера. Пусть люди сами решат, какой уговор предпочли бы. #bold Корона принадлежит Эйгону. Буря остаётся за Дюррандонами.#!"
 ourfury.0011.a:0 "Нам ярость. Король я или лорд — этого у меня не отнять."
 ourfury.0020:0 "Посланник возвращается невредимым"
 ourfury.0020.desc:0 "Я ответил посланнику, прежде чем он договорил, и ответил стоя, чтобы никто в зале не принял мои слова за приглашение к дальнейшему спору. Аргелла не продаётся бастарду. Ни за земли Харрена, ни за его голову, ни за дружбу человека, который спит с собственными сёстрами и надеется, что Семеро отвернутся.\n\nПоловина моих лордов хотела, чтобы его вынесли по частям. Фелл сказал это прямо, Грандисон — ещё громче. Посланник вышел за ворота на своих ногах и с обеими руками, но это не милосердие. К королю, который калечит герольдов, перестают посылать герольдов. У меня слишком много границ, чтобы потратить такое преимущество на одного валирийского посланца. Пусть Эйгон получит недвусмысленный отказ. Он не сможет выдать его за бред разгневанного старика.\n\nОн пойдёт на юг. Я жду этого с тех пор, как первый ворон полетел на Драконий Камень, и ожидание ничего не меняет. Железнорождённые, андалы, дорнийцы — все приходили на этот берег по причинам весомее отказа в свадьбе. И все уходили, недосчитавшись людей.\n\n#bold Пусть забирает руки своего посланника. И оставляет себе своего бастарда. Остальное решим на поле боя.#!"
 ourfury.0020.a:0 "Отправьте его домой невредимым. Война всё равно придёт."
 ourfury.0021:0 "Все условия выслушаны. Ответ — нет"
 ourfury.0021.desc:0 "Я выслушал всё. Каждую лигу земли, каждое условие, каждую любезность. Ни покорности, ни дани, ни притязаний на Штормовой Предел. Силы Драконьего Камня вместе с моими обращаются на север, против Харрена Хоара. Не стану притворяться, будто предложение плохое. Лучше любого, какое этот род делал королю Вестероса, — и, вероятно, ещё когда-либо сделает.\n\nИ всё же дело в Аргелле. Она — моё единственное дитя и весь мой дом после меня. А Эйгон предлагает отдать её человеку без собственного родового имени и счесть расчёт оконченным. Король может торговать землёй. Землю можно вернуть; некоторые земли за свою жизнь я возвращал дважды. Но наследство дочери переходит лишь однажды, и тот, кого пустят в её постель, навсегда занимает престол Дюррана.\n\nПоэтому мой ответ — нет. Ответ окончательный и осознанный. Никто не скажет потом, будто я отказал в гневе, не поняв предложения. Я понял его достаточно хорошо. Именно потому и отверг.\n\n#bold Дракон назвал честную цену. Но попросил единственное, что никогда не продавалось.#!"
 ourfury.0021.a:0 "Я всё услышал. Мой ответ не изменится."
 ourfury.0022:0 "Отозванный ворон"
 ourfury.0022.desc:0 "Одиннадцать дней письмо Эйгона лежит у меня. Одиннадцать дней я читаю его, откладываю и беру снова. Он принял условие без единого возражения. Дети Аргеллы будут Дюррандонами, пишет он, словно ему это ничего не стоит. Я поставил такое условие, уверенный, что оно сорвёт сделку. Человек не уступает так легко то, что намерен сохранить.\n\nЛибо ему всё равно, чьё имя высечено над воротами, пока сами ворота принадлежат ему, либо он собирается забрать и имя, но готов подождать поколение. Я сидел за столом с людьми, которые уступали всё, а затем забирали обратно раньше, чем высыхали чернила. Я и сам бывал таким.\n\nПосланник давно уехал, и в зале не на кого кричать, кроме моих лордов. Они высказали своё мнение ещё при отправке первого ворона. Значит, сегодня полетит второй — с отзывом предложения. Эйгон проявил щедрость на глазах у всего Вестероса, и на глазах у всего Вестероса ему откажут. Именно так будут рассказывать об этом в каждом зале до самой Стены. Пусть рассказывают. Лучше прослыть непостоянным, чем королём, который посадил потомство бастарда на престол Дюррана и ещё поблагодарил за одолжение.\n\n#bold Я назвал цену, которую он, как мне казалось, не заплатит. Он заплатил. Это и решило дело.#!"
 ourfury.0022.a:0 "Отправьте ворона. Предложение отозвано."
 ourfury.0030:0 "Война зятя"
 ourfury.0030.desc:0 "Эйгон объявил войну за мою корону, и простым вторжением это не назовёшь. Две зимы назад его брат сидел за моим столом и клялся перед Семерыми, что его сыновья будут носить моё имя. Люди, выходящие из Штормового Предела, сражались рядом с этими знамёнами у Божьего Ока. Некоторые хоронили друзей из того войска. Теперь им предстоит искать оставшихся в живых.\n\nЕму нужен лишь обруч. Не Штормовой Предел, не Штормовые земли, не наследство Аргеллы. Ничего из этого он не просил и не получит по одной лишь просьбе. Только корону Дюррана Богоборца — потому что страна с двумя королями ещё не то единое королевство, о котором он говорит.\n\nОрис придёт на юг. Эйгон с самого начала посылал его за Штормовыми землями и теперь не видит причин менять решение. Мой зять против моих знамён. А внуки, которых боги сочтут нужным мне даровать, услышат эту историю от той стороны, что уцелеет, чтобы её рассказать.\n\n#bold Я сдержал все клятвы, данные этому дому. Но этой клятвы я не давал.#!"
 ourfury.0030.a:0 "Созывайте знамёна. Он никогда не имел права требовать корону."
 ourfury.0030.b:0 "Он муж моей дочери. Пусть поклянётся в верности."
 ourfury.0030.c:0 "Отправьте его назад к брату."
 ourfury.0030.d:0 "Схватите его. Моими людьми он командовать не будет."
 ourfury.0033:0 "Клятва зятя"
 ourfury.0033.desc:0 "Я велю привести его в большой зал, где свидетелем станет каждый лорд Штормовых земель, находящийся в замке. Сделанное без огласки впоследствии легко оспорить. Орис Уотерс — муж моей дочери, мои внуки будут носить моё имя, а войско его брата идёт по моим дорогам. Две из этих трёх вещей чего-то стоят для меня. Я намерен выяснить, какие.\n\nДважды просить не приходится. Он опускается на колено перед всем залом и говорит прямо, без прикрас: он присягнул Штормовому Пределу и дому, в который вошёл через брак; отправляя его на юг, Эйгон не освободил его от обязательств; ради меня он обнажит меч против любого живого человека. Имени брата он не произносит. Я замечаю это, но оставляю без внимания.\n\nАргелла смотрит с помоста и ни разу не взглядывает на меня. Ей есть что терять больше, чем любому из нас, и она прекрасно знает, что я сделал бы с ним, замешкайся он хоть на миг. Он не замешкался. Кем бы ещё ни создали его Семеро, трусом они его не сделали, а я знал немало трусов знатного рождения.\n\nИтак, он выступает с нами. Найдутся люди, которые назовут меня за это дураком. Пусть говорят там, где я услышу. Я принимал клятвы у более родовитых людей, державших их хуже.\n\n#bold Он преклонил колено в моём зале и поклялся перед Семерыми. Пусть теперь дракон приходит и смотрит, что получил, отдав мне этого бастарда.#!"
 ourfury.0033.a:0 "Встань, зять. Ты поедешь по правую руку от меня."
 ourfury.0031:0 "Крюк возвращается домой"
 ourfury.0031.desc:0 "Условия подписаны, корона остаётся у меня. Эйгон не потерял своего королевства, и я не стану оскорблять ни его, ни себя подобным утверждением. Он проиграл войну, которую сам начал, и заплатил единственной монетой, которая мне была нужна.\n\nКрюк Масси снова принадлежит Дюррандонам. Как и Путеводные леса с лесами Байуотера: теперь каждое владение к югу от его нового города посылает ополчение в Штормовой Предел. Короли Бури держали эти земли ещё до первого Таргариена, пересёкшего море. Мне довелось владеть ими дважды за одну жизнь — большинство людей и один раз такого не добиваются.\n\nРадости меньше, чем я ожидал. Орис всё ещё мой зять, Аргелла — его жена, а в земле лежат штормовые лорды, которые сражались под знамёнами дракона, прежде чем выступить против них. Выигранная война остаётся выигранной войной. Но лучше было бы, если бы она вовсе не понадобилась.\n\n#bold Он пришёл за короной Дюррана Богоборца, а ушёл, лишившись части того, с чем пришёл.#!"
 ourfury.0031.a:0 "Крюк Масси снова подчиняется Штормовому Пределу."
 ourfury.0032:0 "Цена, уплаченная дважды"
 ourfury.0032.desc:0 "Эйгон ставит те же условия, что поставил ещё до первой смерти. Моя корона в обмен на сохранение моих земель. Штормовой Предел, Штормовые земли, лорды, доходы, а после меня — Аргелла. Всё остаётся при мне, но под его короной. Ни одно слово не изменилось. Ему не понадобилось ничего менять.\n\nВойной я купил ровно то, что мне предлагали даром. Всё, что я приобрёл сверх того, — уверенность, что победить не мог. Я обещал лордам, что меня не запугают и не заставят склониться. Так и вышло. Меня не запугали — меня разбили. Возможно, певцы найдут в этом больше красоты. Я не нахожу.\n\nХуже всего не Эйгон. Он завоеватель, завоеватели забирают короны; проиграть человеку, отнявшему уже шесть, не такой уж позор. Хуже то, что его брат, муж моей дочери, сидит за моим столом на пирах. И ещё до конца года люди, разбившие моё войско, будут пить в моём зале.\n\n#bold Я не пожелал продать корону. В конце концов отдал её даром — и заплатил за эту честь.#!"
 ourfury.0032.a:0 "Тогда забирай. Чтобы узнать цену, мне пришлось пережить войну."
 ourfury.0100:0 "Сбор войск Бури"
 ourfury.0100.desc:0 "Значит, война. Я отверг Драконий Камень и созвал знамёна. Лорды Штормовых земель ответили, как и подобает. Фелл идёт из Фелвуда, Эррол — из Стогов Сена, Баклер — из Бронзовых Врат, Грандисон — из Грандвью, а Дондаррион спускается из Чёрного Приюта со всеми воинами марок, каких смог собрать. Пусть Эйгон на своей скале зовёт себя кем угодно. К югу от Черноводной люди ещё подчиняются Аргилаку Дюррандону.\n\nДожди пришли рано и обрушились сразу. Дороги к югу от Черноводной, ещё две недели назад твёрдые, превратились в грязь; все ручьи разлились. Семеро послали мне погоду, достойную короля Бури. Дракон перелетит местность, где застрянет армия, но Орису всё ещё нужны повозки, фураж, сухие тетивы и земля, на которой могут устоять люди.\n\nОрис ведёт на юг большую часть войска Эйгона. С ним Рейнис Таргариен на Мераксес. У меня больше людей, лучшее знание местности и лорды, защищающие свои поля. У него — дракон. Не стану преуменьшать это преимущество, но и вести себя так, будто один зверь уже завоевал Штормовые земли, не намерен. От места нашей встречи зависит, поймёт ли это и Орис."
 ourfury.0100.a:0 "Королевский лес. Он узнает, что скрывают мои деревья."
 ourfury.0100.b:0 "Открытое поле. Без изгородей, уловок и оправданий."
 ourfury.0100.c:0 "Дождливый лес. Пусть сперва Орис в нём утонет."
 ourfury.0110:0 "Дождь над Королевским лесом"
 ourfury.0110.desc:0 "Фелл, Баклер и Эррол ударили по авангарду Таргариенов на переправе через Путеводную. Они вышли из леса на рассвете, успели перебить немало людей, прежде чем Орис привёл в порядок остальное войско, и отступили до того, как его превосходящие силы сомкнули окружение. К полудню многие из его воинов были убиты или пропали, а штормовые лорды снова скрылись в краях, где с детства охотились, ездили верхом и проливали кровь.\n\nРейнис прилетела на Мераксес ещё до полудня, но низкие тучи, косой дождь и кроны деревьев помешали ей отыскать крупные отряды нападавших. Она выжгла участки леса вдоль дороги и оттеснила штормовых лордов дальше, однако большинство успело рассеяться до появления драконицы. Говорят, некоторые воины Ориса приветствовали её радостными криками. Люди кричат громче всего, когда нужно напомнить себе, что они не боятся.\n\nЗасада стоила Орису крови и времени, а нам показала, как быстро Мераксес карает за ошибку. Хорошо. Лучше узнать пределы её силы сейчас, чем обнаружить их, когда под ней окажется половина моего войска. #bold Орис вошёл в мои земли. За каждую дорогу, каждый брод и каждую рощу ему придётся платить.#!"
 ourfury.0110.a:0 "Продолжайте набеги. Пусть бастард не пройдёт спокойно ни мили."
 ourfury.0110.b:0 "Довольно мелких стычек. Вынудим его дать сражение."
 ourfury.0111:0 "Разгневанный король"
 ourfury.0111.desc:0 "Вести о боях вышли за пределы Штормовых земель. Купцы и посланники расспрашивают о Путеводной и о том, как непогода сдержала Мераксес. Пусть остальной Вестерос судачит. Меня заботит мнение моего лагеря: люди, прежде вскидывавшие глаза к небу при каждой тени, увидели, что воины дракона кровоточат, как все прочие.\n\nМои лорды видели, как Орис теряет людей на незнакомых дорогах. Видели, как дождь и ветер прижимают Мераксес к земле. К ним вернулась уверенность, и я намерен воспользоваться ею, пока осторожность снова не стала страхом. Лорду можно простить уважение к дракону. Нельзя простить, если он учит своих людей бояться чудовища ещё до его появления.\n\nУ Ориса по-прежнему дисциплинированное войско, у Рейнис — Мераксес. Я знаю это не хуже трясущегося мейстера, который прибавляет дракона к армии и объявляет сумму непобедимой. #bold Мы уже пустили им кровь. Клянусь Воином, пустим ещё раз, прежде чем они вспомнят о храбрости.#!"
 ourfury.0111.a:0 "Я поеду с авангардом. Не стану прятаться за своими лордами."
 ourfury.0111.b:0 "Удерживать строй. Осторожность — не трусость."
 ourfury.0112:0 "Скованные крылья"
 ourfury.0112.desc:0 "Буря нависла над побережьем и не стихает уже три дня. Мераксес остаётся на земле над Путеводной, плотно прижав крылья под дождём. Разведчики дважды видели, как Рейнис пыталась поднять её в небо. Обе попытки закончились едва начавшись. Если Семеро даруют мне драконицу, скованную непогодой, я не оскорблю их отказом.\n\nБез Мераксес в небе Орис вынужден действовать как любой другой полководец. Его войско меньше моего, оно далеко углубилось в земли Штормового Предела и зажато на дорогах, размокших от дождя. Пусть он десница Эйгона, брат, бастард или всё сразу. На земле он лишь человек во главе людей. Я побеждал и более достойных противников.\n\nНепогода не вечна. Ветер стихнет, Рейнис снова взлетит — и соотношение сил изменится. До тех пор поле принадлежит воинам, и к югу от Черноводной никто не имеет на него больше прав, чем я. #bold Пока Мераксес прикована к земле, Орис узнает участь всех, кто считал Штормовые земли лёгкой добычей.#!"
 ourfury.0112.a:0 "Вперёд. Воин даровал нам этот час."
 ourfury.0112.b:0 "Отправьте разведчиков. Я хочу знать, смогут ли люди до неё добраться."
 ourfury.0120:0 "Небо чернеет"
 ourfury.0120.desc:0 "Перед рассветом ветер утих, и Рейнис не стала медлить. Мераксес взлетела низко над деревьями и нашла штормовых лордов, тревоживших войско Ориса со времён переправы через Путеводную. Дождь пропитывал лес несколько дней, но драконий огонь одинаково пожирал мокрые листья, зелёные ветви, коней и людей. Стоило ей найти их, как Неведомый быстро собрал свою жатву.\n\nЛорд Эррол мёртв. Фелл и Баклер вывели остатки своих отрядов; многие вернулись без щитов и коней, все пропахли дымом. О потерянных товарищах они говорят меньше, чем о рёве Мераксес над деревьями перед огнём. Не стану за это называть их трусами. Трус бежит до появления опасности. Эти люди держались, пока само небо не выжгло их позиции.\n\nКоней можно заменить. Лордов — нет. Я не стану губить добрых воинов в лесах, которые Мераксес обращает в печь, лишь ради доказательства своей храбрости. Кто считает осторожность страхом, пусть скажет мне в лицо. #bold Драконица снова в небе. Мы изменим ход войны, прежде чем она изменит его за нас.#!"
 ourfury.0120.a:0 "Рассредоточить войско. Пусть чудовище охотится за тенями."
 ourfury.0120.b:0 "Держаться вместе. Её встретят все наши луки."
 ourfury.0121:0 "Лорды колеблются"
 ourfury.0121.desc:0 "Сегодня вечером в мой шатёр пришли три лорда. Ни один не говорил только за себя. За всех выступил Грандисон. Эррол мёртв, Фелл потерял почти половину воинов, уведённых на север, Баклеру не хватает коней. Каждый ворон с побережья приносит вести о деревнях, пустеющих перед наступлением Таргариенов. Слова «страх» никто не произнёс. Это штормовые лорды, и они заслужили от меня лучшее, чем такое обвинение.\n\nЗатем Грандисон сообщил: в лагере Ориса открыто оглашают условия Эйгона. Каждый штормовой лорд, преклонивший колено, сохранит земли, замок и имя. Язычник достаточно узнал Вестерос, чтобы понять, куда вонзить нож. Он не требует от лордов предать их дома. Он предлагает пощадить дома, если они предадут меня.\n\nГрандисон не просил позволения покинуть войско. Он сказал: прикажу остаться — его дом останется и примет всё, что последует. Клянусь Семерыми, именно поэтому решать мне, а не ему. Клятвы дают мне право требовать всего. Но король, который губит храбрецов лишь потому, что тем хватает храбрости повиноваться, путает гордость с долгом. #bold Я сам решу, чего требует верность дому Дюррандон. Ни один драконий владыка не решит этого за меня.#!"
 ourfury.0121.a:0 "Напомните им о клятвах. Пока я стою, никто не уйдёт."
 ourfury.0121.b:0 "Трусы и клятвопреступники. Пусть бегут домой, за свои стены."
 ourfury.0122:0 "Падение Бронзовых Врат"
 ourfury.0122.desc:0 "Бронзовые Врата взяты, моё войско отброшено за Слейн. Из двадцати тысяч, явившихся на первый сбор, осталось, пожалуй, одиннадцать. Правый фланг дрогнул у брода после нескольких налётов Мераксес. Эти люди не были трусами. Я видел, как под ними горели кони, как они пытались сомкнуть ряды с пылающими щитами. Сам Воин не мог бы требовать большего от смертных. Баклер погиб, удерживая их строй достаточно долго, чтобы остальные переправились.\n\nЗа моей спиной открыта дорога к Штормовому Пределу. Я отправил Аргеллу в замок: готовить оборону и поддерживать дух гарнизона. Она не хуже меня знает, что одними стенами эту войну не выиграть, пока Мераксес летает. Но Штормовой Предел пережил всех глупцов, считавших, что держит его только камень.\n\nВойско у меня ещё есть. Орис его не уничтожил. Если и дальше уступать землю, между ним и наследством дочери скоро ничего не останется. Я могу выбрать следующее поле боя, вывести на него всех оставшихся людей и решить исход войны прежде, чем Мераксес выжжет королевство по частям. Я и так отступил достаточно далеко для любого, кому вздумается назвать меня трусом. #bold Следующая земля, уступленная Орису, будет измеряться кровью, а не милями.#!"
 ourfury.0122.a:0 "Развернуться и сражаться. Никто не назовёт Аргилака Дюррандона трусом."
 ourfury.0122.b:0 "Отступаем к Штормовому Пределу. Его стены нас ещё не подводили."
 ourfury.0130:0 "Последняя Буря"
 ourfury.0130.desc:0 "Орис занял холмы к югу от Бронзовых Врат и укрепился на высоте. В ясную погоду я признал бы позицию сильной и оставил его голодать на ней. Но погода далеко не ясная. Дождь хлещет так, что слепит лучников; склоны раскисли. Мераксес притаилась на склоне, рядом с нею Рейнис: в такую бурю драконица не может удержаться в небе. Боги послали мне непогоду, достойную имени Дюррандон.\n\nМоё войско многочисленнее. Буря отняла у Ориса большую часть преимуществ, приведших его сюда, но не сам холм. Нам придётся подниматься к нему, и каждый конь, потерявший опору, откроет брешь для вражеских копий. Пусть так. Воин не обещал сухой земли. Я тоже.\n\nПеред боем я объезжаю строй. Здесь Фелл, Грандисон, Дондаррион, Морриген и остатки людей Баклера. Они прошли со мной все отступления этой войны и ещё ни разу не отказались исполнить приказ. Не заставлю их ещё день гадать, осталось ли у короля мужество повести их в бой. #bold Трубите атаку. Если Орису нужны Штормовые земли, пусть отнимает их здесь.#!"
 ourfury.0130.a:0 "Ударим в центр. Разобьём его там, где он уверен в своей силе."
 ourfury.0130.b:0 "Займём левый склон. Выбьем его с холма."
 ourfury.0131:0 "Ярость"
 ourfury.0131.desc:0 "Первая атака захлебнулась на склоне. Вторая достигла строя Таргариенов, но была отброшена в грязь. В третьей мы прорвали их центр. На время всякий строй исчез: лишь штормовая конница пробивалась вверх сквозь дождь, а пехота Ориса пыталась закрыть брешь. Я слышал, как конницу называют бесполезной в грязи. Эти люди не скакали с моей.\n\nТогда Мераксес нашла место для огненного выдоха. Взлететь она не могла, но ей это и не понадобилось. Передние ряды авангарда исчезли в пламени; кони, вынесшие рыцарей из трёх атак, сбрасывали всадников и бежали. Мой конь рухнул подо мной в давке. Когда я выбрался, рука со щитом онемела, а вокруг нас уже кипела пешая схватка. Если я нужен Неведомому, пусть спускается за мной в грязь.\n\nШтормовые лорды ещё сражаются. Каждый раз, когда воины Ориса входят в пролом, их встречает новый отряд дружинных рыцарей, и центр держится ещё немного. Сквозь шум дождя слышен рог с холма. Люди впереди расступаются перед кем-то, идущим вниз через их ряды. Я знаю кто это, ещё не видя лица. #bold Хорошо. Хватит с меня людей, посланных Орисом Уотерсом. Теперь пусть сам ответит за свою войну.#!"
 ourfury.0131.a:0 "Я встречу его. Король Бури не прячется."
 ourfury.0132:0 "Бастард спускается с холма"
 ourfury.0132.desc:0 "Орис Уотерс останавливается в грязи в нескольких шагах от меня и предлагает сдаться. Обращается со всеми моими титулами, обещает пощадить ещё сражающихся вокруг людей. Говорит: сложу меч — сохраню Штормовой Предел, Аргелла получит наследство, а штормовые лорды, подчинившиеся вместе со мной, удержат земли. Будто всё это уже принадлежит ему и он вправе возвращать мне моё.\n\nОн моложе, невредим и закован в доспехи до горла. Я потерял коня и щит, левая рука едва сжимается, а за его спиной на холме — воины Таргариенов. Я признаю все его преимущества. Ни одного права приказывать мне — не признаю. Человек не становится моим королём, встав повыше, а бастард не становится щедрым, предлагая мне мой же замок.\n\n#italic Сдавайтесь, ваша милость.#!\n\nДюррандонов и раньше обращали в бегство. Нас осаждали, разбивали, морили голодом, вынуждали покупать мир — и всё же Штормовой Предел носит наше имя. Не стану первым в роду, открывшим в себе трусость лишь потому, что Орис Уотерс достаточно учтиво попросил. #bold Если ему нужен меч короля Бури, пусть подойдёт и возьмёт.#!"
 ourfury.0132.desc.courtesy:0 "Орис Уотерс останавливается в нескольких шагах и снимает шлем, прежде чем заговорить. Что бы я о нём ни думал, это достойный поступок. Пока вокруг ещё умирают люди, он лично излагает условия, обращаясь ко мне со всеми титулами, которых лагерь Эйгона всю войну пытался меня лишить.\n\nЕсли я сдамся, штормовых лордов пощадят. Штормовой Предел останется за моим домом, права Аргеллы на наследство будут подтверждены, вассалы сохранят земли. Он даже предлагает мне место за своим столом после войны. Похоже, это больше, чем брат-язычник поручил ему обещать. Возможно, так и есть. Я могу уважать мужество, нужное для такого предложения, не считая себя обязанным принять его.\n\n#italic Сдавайтесь, ваша милость. Прошу вас.#!\n\nНа миг я понимаю, почему Эйгон ему доверяет. Затем смотрю мимо Ориса на ещё сражающихся под моим знаменем людей и мокрое полотнище с коронованным оленем над ними. За учтивость полагается учтивость, а не капитуляция. #bold Я отвечу как воин воину. Если ему нужна моя покорность, пусть добудет её сталью.#!"
 ourfury.0132.a:0 "Ответим ему сталью."
 ourfury.0132.b:0 "Прорубите мне путь наружу. Пусть потом говорят что угодно."
 ourfury.0135:0 "Король Бури выстоял"
 ourfury.0135.desc:0 "Орис Уотерс лежит мёртвым в грязи у моих ног. Окружающие понимают это раньше меня. Он оказался сильнее, чем я ждал, и на удивление проворен для такого крупного человека. В начале схватки его меч пробил мне левое плечо; после этого сил впустую я не тратил. Отступал, заставлял его разворачиваться в грязи и ждал, пока он слишком вложится в удар, которым надеялся всё закончить. Не стыдно признать: бастард был хорош. И всё же он мёртв.\n\nЯснее самого удара я помню открывшуюся возможность. Он поскользнулся, мой клинок вошёл ему под мышку, и человек, пришедший на юг за Штормовым Пределом, опустился передо мной на колени. Когда подоспели мои дружинные рыцари, крик уже прокатился по обоим войскам, а центр Ориса начал отступать с холма. Кто сражался лучше, пусть решает Воин. Поле боя уже вынесло приговор.\n\nМеня сажают на другого коня и кое-как перевязывают плечо. На другом конце поля я вижу Мераксес, всё ещё прикованную бурей к земле. Рядом Рейнис, между нами — остатки войска Ориса. Я убил десницу Эйгона. Боги оставили одного из его драконов в грязи, в пределах видимости моего знамени. Осторожному человеку хватило бы такой победы. #bold Меня никогда не обвиняли в осторожности. Если до Мераксес можно добраться, я намерен это сделать.#!"
 ourfury.0135.a:0 "Сорок всадников — за мной. Посмотрим, течёт ли у драконов кровь."
 ourfury.0135.b:0 "Трубите отбой. Я не превращу победу в тщеславие."
 ourfury.0136:0 "День, когда их сломила буря"
 ourfury.0136.desc:0 "Пока лорды приводили войско в порядок, я смотрел на Мераксес на склоне. Некоторое время мне хотелось бросить к ней через поле всех коней, ещё способных двигаться. Наконец Фелл взялся за мою узду — на такое осмелятся немногие в Вестеросе — и сказал то, что я уже знал: Орис мёртв, его центр отступает, а мои люди слишком изнурены, чтобы пережить ещё одну атаку, если драконица обернётся против них.\n\nИ я велел трубить отбой. Я не люблю отступать ни перед чем живым, особенно перед раненым драконом. Но мужество — не то же самое, что напрасно погубить людей, уже выигравших мне битву. Пусть придворный дурень называет такую осторожность трусостью. Пусть приезжает в Штормовой Предел и объясняет это лордам, стоявшим со мной в грязи.\n\nМераксес ещё жива, Эйгону ещё есть за что воевать. Но Орис, пришедший сокрушить моё королевство, мёртв на выбранном им поле. Я едва поднимаю руку выше груди, зато жив, войско по-прежнему моё, а за спиной — Штормовой Предел. #bold Бастард пришёл за моей короной. Вместо неё достался Неведомому.#!"
 ourfury.0136.a:0 "Перевяжите рану. Я ещё не закончил с Эйгоном."
 ourfury.0140:0 "Мераксес на земле"
 ourfury.0140.desc:0 "Я веду сорок всадников через затопленное поле к Мераксес. Больший отряд замедлит нас и раньше привлечёт внимание. Меньший не пробьётся через стражу, собирающуюся вокруг Рейнис. Кто-то назовёт это безумием, если доживёт до рассказа. Люди и достойнее называли меня хуже. Дождь так силён, что драконица пропадает из виду между ударами сердца — и всякий раз появляется ближе и крупнее.\n\nВблизи в ней нет ничего изящного. Склон заполнен сложенными крыльями, бледной чешуёй, мышцами и жаром дыхания Мераксес. Одна голова больше груди боевого коня. При нашем приближении за нами следит глаз. Я ожидал размеров и огня. Не ожидал уверенности, что за этим глазом есть разум, и взгляда, словно нарушитель здесь — я.\n\nРейнис у основания шеи выкрикивает приказы по-валирийски и пытается поднять драконицу на ноги. Мераксес шевелится, перенося вес, и мои люди без приказа берут копья наперевес. Я вверяю душу Семерым, зажимаю древко под мышкой и выбираю узкое место, где горло переходит в грудь. #bold Если Воин довёл меня досюда, пусть посмотрит, что будет дальше.#!"
 ourfury.0140.a:0 "Вперёд. Сорок всадников выяснят, можно ли убить дракона."
 ourfury.0141:0 "Как захотел Эйгон"
 ourfury.0141.desc:0 "Из сорока всадников, ушедших с моим отцом, в Штормовой Предел возвращаются одиннадцать. В главном их рассказы совпадают. Они добрались до Мераксес прежде, чем та смогла взлететь. Вместо этого она приподнялась на передних лапах и одним взмахом сложенного крыла смяла левую часть атакующего отряда, ещё даже не раскрыв пасть.\n\nОтец миновал крыло. Двое видели, как его копьё ударило у основания шеи и острие вошло в плоть. Затем Рейнис добралась до седла, Мераксес повернула голову, и пламя поглотило коня вместе со всадником. Никто из одиннадцати не видел, чтобы отец поднялся.\n\nПеред атакой он снял корону и отдал оруженосцу. Вот что вернулось ко мне вместе с уцелевшими людьми и вестью о проигранном сражении. #bold Мой отец мёртв. Его корона лежит у меня на столе. Теперь мне держать Штормовой Предел.#!"
 ourfury.0141.a:0 "Ворота останутся закрытыми."
 ourfury.0142:0 "Дракон повержен"
 ourfury.0142.desc:0 "Моё копьё вошло в основание горла Мераксес, где чешуйки у шеи становились мельче. Древко ушло глубже, чем, казалось, способно войти любое копьё. Затем драконица извернулась и чуть не вырвала мне руку из сустава. Разворачиваясь, она погребла под крылом людей и коней, но из раны под дождём продолжала хлестать тёмная кровь. Значит, у драконов всё-таки течёт кровь. И, клянусь Семерыми, её немало.\n\nДальнейшее я помню лишь обрывками. Рядом со мной удар крыла унёс племянника Фелла. Кто-то оттащил Рейнис, когда Мераксес повалилась набок. Драконица дважды пыталась встать и не смогла. Каждое движение слабело, пока огромная шея не опустилась в грязь навсегда. Люди, всю войну боявшиеся звука её крыльев, молча стояли вокруг и смотрели, как из неё уходит жизнь.\n\nОрис уже был мёртв. Падение Мераксес окончательно сломило остатки его войска. Люди побежали на север, к Черноводной, унося Рейнис. Её вынесли с поля живой, хотя и тяжело раненной. У меня не осталось ни коней, ни сил для долгой погони. Не стану извиняться за то, что не преследовал разбитого врага после того, как в одном сражении убил и полководца, и его дракона.\n\nМераксес лежит там, где пала, — такая огромная даже в смерти, что рядом с нею люди понижают голос. Пусть Эйгон Таргариен оставит себе сестёр-жён, языческие обычаи и титулы, собранные в других краях. Один из драконов, с которыми он пересёк Черноводную, мёртв в моём королевстве. А коронованный олень всё ещё реет над Штормовым Пределом. #bold Язычник услышит это ясно. Штормовые земли ему не принадлежат.#!"
 ourfury.0142.a:0 "Отправьте весть. Пусть Эйгон узнает, кто убил его дракона."
 ourfury.0150:0 "Грязь и кровь"
 ourfury.0150.desc:0 "Орис Уотерс победил меня в грязи на глазах у двух войск. Нет смысла лгать об этом. Он был моложе, сильнее и к концу долгого дня ещё держался на ногах, когда я уже не мог. Падая, я чувствовал его меч в своём теле.\n\nТеперь я лежу в грязи, среди крови и кишок. Так заканчивает воин, а я никогда не притворялся кем-то иным. Пятьдесят лет войны — и всё это время земля ждала.\n\nПусть Эйгон забирает поле. Последнего слова он не получит.\n\n#bold Я Аргилак Дюррандон. Я буду вечно жить в песнях.#!"
 ourfury.0150.a:0 "Так умирает последний король Бури."
 ourfury.0160:0 "Королева Бури"
 ourfury.0160.desc:0 "Мой отец мёртв. Прежде чем день кончится, я велю провозгласить себя королевой Штормовых земель со стен Штормового Предела. Гарнизон видит корону на моей голове. Капитаны присягают перед собственными людьми, и к ночи все ворота заперты.\n\nШтормовой Предел выдерживает бури, осады и войны с тех пор, как Дюрран поставил на этой скале седьмой замок. Внутри стен — четыреста воинов, припасы для долгой осады и крепость, которую обычному войску не взять штурмом. Но по другую сторону залива, вместе с войском, убившим отца, находятся Рейнис и Мераксес. Никакая стена не заставит дракона соблюдать правила обычной осады.\n\nКорона не остановит Мераксес. Зато не оставит сомнений, кому принадлежит власть. Если Орис хочет Штормовые земли, ему придётся иметь дело с женщиной, которая их унаследовала. А моим людям — решить, будут ли они держать со мной Штормовой Предел, прежде чем враг решит за них. #bold Мой отец погиб. Дом Дюррандон — нет.#!"
 ourfury.0160.a:0 "Заприте ворота. Людей — на стены."
 ourfury.0160.b:0 "Отправьте посланника под мирным знаменем к Орису. К нему, не к его брату."
 ourfury.0160.b.other:0 "[fab_ourfury_foe.GetTitledFirstName] получит послание под белым знаменем. Больше переговоры вести не с кем."
 ourfury.0160.a.hold:0 "Заприте ворота. Мои люди их удержат."
 ourfury.0160.a.yield:0 "Ты. Положи это и отойди от двери."
 ourfury.0160.a.yield.named:0 "[fab_ourfury_captain.GetFirstName], что ты делаешь?"
 ourfury.0160.desc.noorys:0 "Мой отец мёртв. Прежде чем день кончится, я велю провозгласить себя королевой Штормовых земель со стен Штормового Предела. Гарнизон видит корону на моей голове. Капитаны присягают перед собственными людьми, и к ночи все ворота заперты.\n\nОрис Уотерс тоже мёртв. Отец убил его в грязи перед двумя войсками. Бастард, которого Эйгон намеревался посадить в этом замке, никогда не увидит его изнутри. Чем бы ещё ни заплатил отец — а заплатил он всем, — этого он добился.\n\nЗа заливом остались [fab_ourfury_foe.GetTitledFirstName], дракон и войско, потерявшее предводителя. У меня четыреста воинов, припасы для долгой осады и крепость, которую обычной армии не взять штурмом. Дракона этим не остановить. Но другого у меня нет.\n\n#bold Мой отец погиб. Погиб и человек, которому меня прочили. Дом Дюррандон ещё жив.#!"
 ourfury.0310:0 "Четыреста воинов"
 ourfury.0310.desc:0 "[fab_ourfury_foe.GetTitledFirstName] стоит лагерем под этими стенами так давно, что люди перестали жить в шатрах и дали этому месту название. Штурма не было. Штормовой Предел никогда не брали штурмом, и внизу нет глупцов, желающих первыми попытаться.\n\nУ меня четыреста воинов. Столько было, когда я надела отцовскую корону, столько осталось и сейчас. Можно счесть это стойкостью — пока не сосчитаешь, у скольких жёны и поля остались в деревнях, которые снабжает продовольствием вражеское войско. Никто не открыл ворот. Это ещё не значит, что никто об этом не думает.\n\nМераксес так близко, что её видно с морской стены. Каждое утро я сама не замечаю, как начинаю искать её взглядом. Потомкам Дюррана с детства твердят: стены, простоявшие тысячу лет, переживут ещё одну зиму. Никому из них не приходилось объяснять это дракону.\n\n#bold Ворота держатся, пока я приказываю их держать. Хотела бы я знать, надолго ли это.#!"
 ourfury.0310.a:0 "Ворота держатся. Пусть сидит в грязи."
 ourfury.0310.a.hold:0 "Ворота держатся, и мои капитаны держатся вместе с ними."
 ourfury.0310.b.yield:0 "Значит, это случится сегодня ночью. И руками моих же людей."
 ourfury.0310.b.yield.named:0 "[fab_ourfury_captain.GetFirstName]... Только не ты."
 ourfury.0310.c:0 "Отправьте к Орису. Я договорюсь с ним прежде, чем другие договорятся за меня."
 ourfury.0310.c.other:0 "[fab_ourfury_foe.GetTitledFirstName] получит моё послание. Я начну переговоры прежде, чем мои командиры начнут их от моего имени."
 ourfury.0310.desc.nodragon:0 "[fab_ourfury_foe.GetTitledFirstName] стоит под нашими стенами так давно, что в лагере уже не живут в палатках и даже успели дать этому месту имя. Штурма не было. Штормовой Предел ещё никто не брал приступом, и внизу нет глупцов, желающих попытаться первыми.\n\nУ меня четыреста человек. Столько же было, когда я надела отцовскую корону. Казалось бы, всё прочно — пока не задумаешься, у скольких из них жёны и поля в деревнях, которые снабжает продовольствием вражеское войско. Пока никто не открыл ворота. Это не значит, что никто об этом не думает.\n\nНад заливом нет дракона. Это единственная неожиданность за всю осаду; я видела, как мои люди смотрят со стен в пустое небо и расправляют плечи. Пустое небо не накормит четыреста человек, но я приму то, что посылают Семеро.\n\n#bold Ворота заперты, пока такова моя воля. Как же мне хотелось бы знать, надолго ли её хватит.#!"
 ourfury.0320:0 "Ворота открываются без меня"
 ourfury.0320.desc.delivered:0 "Они пришли за мной ночью. Отдам им должное: значит, им всё-таки было стыдно. Четверо моих командиров, присягнувших мне в этом зале, когда отец лежал в земле всего три дня. Сперва отняли меч, потом корону. Никто не взглянул мне в глаза.\n\nОни доставили меня к Орису Уотерсу связанной, обнажённой, с кляпом во рту. Преподнесли в дар, как дарят серебряную посуду, коня или ключи от ворот. С тех пор я много думала, чем именно была для них. Пришла к выводу, что ключами.\n\nОрис велел их выпороть. Не поблагодарил, не заплатил и приказал развязать и укрыть меня, прежде чем выслушал хоть слово от кого-либо в шатре. Что бы ни говорили об этом человеке, он прекрасно понимал, что произошло, и не желал быть к этому причастным.\n\n#bold Штормовой Предел не взяли. Его продали люди, которые сами не понимали, что продают.#!"
 ourfury.0320.desc.parley:0 "Моё послание под знаменем мира получил мой противник — [fab_ourfury_foe.GetTitledFirstName]. Я сама вышла за ворота на встречу. Отец не пошёл бы на это; половина моих командиров тоже такого не ожидала. Без верёвок, на своих ногах. Что бы ни написали потом, этот выбор сделала я.\n\nУсловия именно те, каких следовало ждать: Штормовой Предел, Штормовые земли, корона Дюррана Богоборца — всё отходит Таргариенам. То, что я вышла сама, не дало мне преимущества за столом переговоров. Только возможность выйти самой.\n\nМои командиры едва скрывают облегчение. Я решила не винить их за это. Четыреста человек против войска и дракона — ненадёжная преграда. Я повторяла эту цифру вслух, словно от повторения она могла стать чем-то большим.\n\n#bold Я отдала всё сама. Это не то же самое, что лишиться всего насильно. И я намерена помнить об этой разнице.#!"
 ourfury.0320.desc.beaten:0 "Всё кончено. В поле, а не у этих ворот — единственная милость судьбы. Штормовые земли истощены. Больше некого созывать под знамёна, лорды не могут прислать новых воинов, и нет в королевстве дороги, по которой Таргариены не прошли бы беспрепятственно.\n\nЯ удержала Штормовой Предел. Вот и всё, что могу сказать в своё оправдание. Ворота не открылись, гарнизон не сдался, но это ничего не изменило. Королевство — не замок. Пока я удерживала одно, у меня отняли другое.\n\nНа юг прибывает [fab_ourfury_foe.GetTitledFirstName] с условиями Эйгона. Они не жестоки — в этом и не было нужды. Зачем жестокость, если у женщины больше нечего отнять?\n\n#bold Я удержала ворота и потеряла королевство. Отец понял бы эту арифметику — и возненавидел бы её не меньше моего.#!"
 ourfury.0320.a:0 "Вот и конец. Я выслушаю условия."
 ourfury.0320.desc.beaten.noorys:0 "Всё кончено. В поле, а не у этих ворот — единственная милость судьбы. Штормовые земли истощены. Больше некого созывать под знамёна, лорды не могут прислать новых воинов, и нет в королевстве дороги, по которой Таргариены не прошли бы беспрепятственно.\n\nЯ удержала Штормовой Предел. Вот и всё, что могу сказать в своё оправдание. Ворота не открылись, гарнизон не сдался, но это ничего не изменило. Королевство — не замок. Пока я удерживала одно, у меня отняли другое.\n\nУсловия Эйгона прибыли без человека, который должен был их привезти. Об этом позаботился отец. Ни единой строки его поступок не изменил; я и не рассчитывала на иное. И всё же я рада — и больше не стыжусь этой радости.\n\n#bold Я удержала ворота и потеряла королевство. Отец понял бы эту арифметику — и возненавидел бы её не меньше моего.#!"
 ourfury.0321:0 "Чужой плащ, чужое имя"
 ourfury.0321.desc:0 "Орис Уотерс получит Штормовой Предел, а вместе с ним — меня. Эйгон решил этот вопрос так же, как теперь решает все остальные: коротко и письменно. В Вестеросе не осталось никого, кто мог бы ему возразить.\n\nОрис совсем не такой, каким его описывал отец. Тот считал его позором, бастардом, которого мне предложили в мужья ради оскорбления, и ответил ларцом. Я наблюдаю за Орисом две недели: он немногословен, осторожен, некрасив и явно тяготится победой. В чём-то от этого только хуже. Было бы гораздо проще, окажись он таким, каким его мне представляли.\n\nОн спросил моего согласия, хотя ничто его к этому не обязывало. Я заметила это. Ответ в любом случае один, и оба мы это знаем. Но он спросил, и я это запомню. Когда-нибудь певцы захотят знать, что же легло в основу нашего брака: приказ или его вопрос.\n\n#bold Я последняя в роду Дюррана и первая в том, что придёт ему на смену. Нам ярость — как прежде. Только зверь на знамени будет другим.#!"
 ourfury.0321.desc.delivered:0 "Он накинул на меня свой плащ, прежде чем о чём-либо спросить. Сам, на глазах у людей, которые меня привели. Это первое, что я скажу об Орисе Уотерсе, и решила, что буду повторять именно это. Остальное, случившееся той ночью, принадлежит мне, и я не отдам это певцам.\n\nПо воле Эйгона он получит Штормовой Предел, а вместе с ним — меня. Я могла бы сказать, что выбора мне не оставили. Это было бы правдой, но лишь меньшей её частью. Он спросил. После всего, что со мной сделали, когда никто на свете не мог бы заставить его считаться с моей волей. И дождался ответа, в котором не нуждался.\n\nОтец отказал бы ему. Отец и отказал — прислав ларец. Во многом из-за этого ларца я стою теперь в чужом плаще и смотрю, как приходит конец моему дому. Я много об этом думала и едва ли когда-нибудь перестану.\n\n#bold Он укрыл меня, когда мои люди этого не сделали. Слабое основание для брака. Но большего отец мне не оставил.#!"
 ourfury.0321.desc.noorys:0 "Орис Уотерс мёртв: отец убил его в грязи на глазах у двух войск. Там же погиб и брак, который приготовил для меня Эйгон. Больше нет бастарда, которому меня отдадут, и никто не накинет плащ мне на плечи.\n\nНо условия Эйгона остаются в силе. Штормовые земли и корона Дюррана Богоборца принадлежат ему. Штормовым Пределом я владею по его милости, а не по праву крови. Другого мужа он мне пока не нашёл. Напоминать ему о такой возможности я не собираюсь.\n\nВот я и осталась Дюррандон, сохранив родовое гнездо и потеряв всё остальное. Не замужем, не помолвлена и пока никому не обещана. Отец назвал бы это плохой сделкой. Но он тоже мёртв, и последним его делом на этой земле было не дать моему наречённому мужу получить меня.\n\n#bold Отец мёртв, Орис мёртв, а я всё ещё здесь. Пока придётся довольствоваться этим.#!"
 ourfury.0321.a:0 "Дайте мне плащ. Я знаю, чего он стоит."
 ourfury.0321.b:0 "Тогда я останусь Дюррандон, что бы ещё ни потеряла."
 ourfury.0170:0 "Колено и корона"
 ourfury.0170.desc:0 "Всё кончено, и я дожил до того дня, когда условия мира легли на бумагу. После победы Ориса пришёл ответ Эйгона — официальный и до боли сдержанный. Он требует моей короны и присяги, но не Штормового Предела, не наследства Аргеллы и не уничтожения моего дома. Проигравшему трудно стерпеть учтивость победителя. Но тем меньше у него причин отказываться от переговоров.\n\nЯ отдаю корону Дюррана Богоборца и признаю Эйгона королём. Взамен остаюсь лордом Штормового Предела и правлю Штормовыми землями от марок до Тарта под властью Эйгона. За моим домом сохраняются доходы, права и верность лордов, присягнувших Дюррандонам. Аргелла остаётся моей бесспорной наследницей.\n\nЯ спрашиваю о браке, который он некогда предложил. Эйгон отвечает, что Орис получит награду в другом месте. Руку Аргеллы он не станет требовать как вторую плату за земли, которые я уже подчинил ему своей клятвой. Что бы о нём ни говорили, сверх необходимого он не требует.\n\nЯ стану Дюррандоном, отказавшимся от короны. Так меня и будут помнить. Но имя Дюррандонов унаследует и Аргелла, когда после моей смерти займёт Штормовой Предел. Королевская власть кончилась, а род — нет. #bold Я лишился короны, но сохранил то, что должен передать дочери.#!"
 ourfury.0170.a:0 "Да будет так. Штормовой Предел останется за Дюррандонами."
 ourfury.0200:0 "Нам ярость"
 ourfury.0200.desc:0 "Войско Эйгона покинуло Штормовые земли. Людей, шедших на юг за Орисом, больше нет на наших дорогах, лагеря опустели, над марками не кружат драконы. Куда теперь обратит взор Эйгон, я не знаю. И не намерен, сидя в Штормовом Пределе, приписывать ему победы, которых он не одержал.\n\nВойна изменила Вестерос. В других королевствах тоже ответили на притязания Эйгона; пока мы сражались, каждый двор сделал свой выбор. Пусть сами подводят итоги. Мой прост: Эйгон послал в Штормовые земли войско, и оно вернулось без моей короны. Какие бы знамёна ни реяли за нашими границами, здесь по-прежнему реет коронованный олень.\n\nМы не вернули мир, каким он был до того, как драконы пересекли Черноводную. Это и невозможно. Только Семеро знают, какие вести принесут новые вороны. Пока Штормовой Предел мой, лорды откликаются на мой зов, и ни одному чужеземному королю я не присягал. #bold Там, где перед Эйгоном склонились, он вправе называться завоевателем. В Штормовых землях ему дали отпор.#!"
 ourfury.0200.a:0 "Разошлите вести ко всем дворам — и моими собственными словами."
 ourfury.0200.desc.argella:0 "Войско Эйгона покинуло Штормовые земли. Ориса больше нет на наших дорогах; от лагерей под стенами остались лишь ямы, полные дождевой воды. Над марками уже месяц не видели дракона.\n\nМеня провозгласили королевой на этих стенах через три дня после смерти отца. Внизу стояло вражеское войско, а в этом зале командиры вслух подсчитывали наши силы. Четыреста человек. Дракон на той стороне залива. Двадцатилетняя девушка в короне мертвеца. Я записала, кто и что говорил. Ещё не решила, зачем мне этот список.\n\nВойна изменила Вестерос. Я не стану притворяться, будто Штормовые земли справились с этим в одиночку. В других краях короли преклонили колени, заключили сделки и теперь должны с ними жить. Мой итог проще. Эйгон Таргариен послал войско за моей короной. Войско ушло без неё.\n\n#bold Они думали, что хоронят дом Дюррандонов. А на деле видели лишь смену его главы.#!"
 ourfury.0201:0 "Ответы королевских дворов"
 ourfury.0201.desc:0 "Поле битвы ещё не просохло, а вороны уже несут письма. От королей, от лордов, от людей, предусмотрительно не указавших свой титул. Есть поздравления, но больше вопросов. Как мы разбили Ориса? Что стало с Мераксес? Как велики потери Эйгона? Ждёт ли Штормовой Предел его возвращения? Те, кто до битвы не поставил бы на меня ломаного медяка, внезапно преисполнились уважения к Штормовым землям.\n\nВместе с вопросами приходят предложения: зерно, кони, посольства, браки, корабли, взаимная защита. Их цена выяснится, лишь когда двинется новое войско и станет ясно, кто держит слово. Я не принимаю всё это за дружбу. Об искренности пусть судит Отец; королю полезнее судить о том, что человек способен дать на деле.\n\nГлавное — теперь при каждом дворе понимают: воля Эйгона не равна судьбе. Я лучше прочих знаю цену нашей победы и то, как нам помогла погода. Но знаю и то, чьи люди выстояли в бурю и чей меч убил Ориса Уотерса. #bold Я выслушаю каждое предложение и буду вести переговоры с трона, которого Эйгон не смог меня лишить.#!"
 ourfury.0201.a:0 "Ответьте каждому двору. Пусть ждут моего слова."
 ourfury.0201.b:0 "Сперва те, у кого есть корабли. Комплиментами гарнизонов не удержать."
 ourfury.0201.desc.argella:0 "Земля ещё не просохла, а вороны уже несут письма. В основном поздравления, за которыми скрываются вопросы. Как удалось снять осаду? Что стало с Мераксес? Как сильно пострадал Орис? Ждёт ли Штормовой Предел его возвращения? Те, кто не поставил бы на меня ломаного медяка, внезапно преисполнились безмерного уважения к Штормовым землям.\n\nОчень многих интересует, за кого я собираюсь замуж. Двое предложили себя. Ещё один — своего одиннадцатилетнего сына. Я неспешно читаю эти письма и не тороплюсь с ответами. Ведь королева, которая спешит замуж, тем самым показывает всему миру, как дёшево себя ценит.\n\nВопросы перемежаются с предложениями: зерно, кони, корабли, посольства, взаимная защита. Их цена выяснится, когда двинется новое войско и станет ясно, кто держит слово. Я совсем недавно узнала, как мало таких людей, если над заливом кружит дракон.\n\n#bold Я выслушаю каждое предложение. И буду вести переговоры с трона, который Эйгон не смог захватить, а мои командиры — продать.#!"
 ourfury.0202:0 "Драконьи владыки ещё здесь"
 ourfury.0202.desc:0 "В Штормовой Предел приходят донесения от купцов, капитанов и соглядатаев, которым платят за слухи из портов, где бывают корабли Эйгона. Источники сходятся лишь в одном: поражение в Штормовых землях не умерило его честолюбия. Хорошо. Я меньше уважал бы его, если бы один удар по носу заставил его навсегда укрыться на Драконьем Камне. Хотя спал бы крепче.\n\nКакими бы землями Эйгон ни владел, сколько бы драконов ни осталось у его дома, в какие бы войны он ни ввязался, Штормовой Предел всё равно под угрозой. Он может вернуться сам, прислать другого полководца, дождаться моей смерти или тайно предложить сделку лордам, недовольным ценой, которую пришлось заплатить за мою победу. Лишь дурак готовится к удобному противнику, а не к настоящему. Враги много чего обо мне говорят, но доказать мою глупость ещё никому не удалось.\n\nЯ не буду вечно править Штормовым Пределом. После меня его получит Аргелла, за ней — её наследники. Им нужна более надёжная опора, чем удача, сопутствовавшая мне на залитом водой поле. Укрепления, корабли, союзы, разведчики и мир, где его можно купить, послужат им лучше молитв о новой буре. Семеро дали людям и руки, и молитвы; я намерен прибегнуть к тому и другому. #bold Эйгон может вернуться. В следующий раз Штормовые земли будут готовы прежде, чем сгустятся тучи.#!"
 ourfury.0202.a:0 "Укрепите побережье. Следующего дракона мы встретим во всеоружии."
 ourfury.0202.b:0 "Отправьте посланника. Даже Эйгон поймёт выгоду мира."
 ourfury.0202.desc.argella:0 "Приходят донесения от купцов, капитанов и соглядатаев, которым платят за то, чтобы они слонялись по портам, куда заходят корабли Эйгона. Источники сходятся лишь в одном: неудача в Штормовых землях не умерила его честолюбия. Иначе я меньше уважала бы его. Хотя спала бы куда крепче.\n\nОн может прийти сам. Может прислать другого полководца. Может просто ждать — ему это ничего не стоит, а мне обходится в каждый год тревожного ожидания. Или избрать самый дешёвый путь: тайно предложить сделку штормовым лордам, которые уже показали, чего для них стоит моя корона перед лицом опасности. Я знаю, что выбрала бы на его месте.\n\nПоэтому стены растут, за побережьем наблюдают, защитники ворот получают землю, а о тех, кто предлагал открыть их, я не забываю. У меня нет ни мужа, ни наследников, зато есть время, чтобы сделать выбор осмотрительно. Моё наследие должно опираться на нечто более прочное, чем одна снятая осада и сезон ненастья.\n\n#bold Эйгон может вернуться. В следующий раз Штормовые земли будут готовы прежде, чем сгустятся тучи.#!"
 ourfury.0210:0 "Зачем останавливаться здесь?"
 ourfury.0210.desc:0 "Вороны перестали приносить дурные вести. Оказывается, это куда непривычнее, чем я ожидал. Эйгон Таргариен пришёл на юг с тремя драконами и силами всех поглощённых им королевств, а ушёл без моей короны. Те, кто целый год твердил, что Штормовые земли не удержать, теперь объясняют гостям, как мы это сделали.\n\nМеня не оставляет одна мысль, хотя мне самому она не по душе. Почему я должен был преклонить колени? Все доводы сводились к драконам. Теперь их меньше, а уцелевшие стали осторожнее над моей землёй. Если то, что делало победу Эйгона неизбежной, больше её не обеспечивает, то что такое Трезубец? Хайгарден? Солнечное Копьё?\n\nДревние короны на головах тех, кто смотрел, как буря ломает завоевателя, и не вмешивался. Им ничего не стоило подождать и узнать, выживу ли я. Ни ворона со словами поддержки. Ни одного копья. Через год они будут вспоминать это иначе. И я тоже.\n\nМои лорды ещё не произнесли этого вслух, но уже высказали все подводящие к тому мысли. Войско не распущено. Люди, разбившие Ориса, ещё в строю и обеспечены припасами. Лучшего случая не будет, а в терпеливости меня никто никогда не обвинял.\n\n#bold Я сломил дракона. Теперь пусть остальные объяснят, почему не должны преклонить колени перед бурей.#!"
 ourfury.0210.a:0 "Подготовьте притязания. Трезубец, Простор и Дорн."
 ourfury.0210.b:0 "Мейстеры пусть запишут. А я выберу подходящий момент."
