l_russian:
 ourfury.0001:0 "Посланник Дракона"
 ourfury.0001.desc:0 "Посланник повелителя драконов стоит передо мной в большом зале с ответом Эйгона, и я заставляю его передать его моим лордам. Я предложил Эйгону Таргариену руку своей дочери и в качестве ее приданого земли к востоку от Ока Божьего между Трезубцем и Черноводной, страну, которой когда-то владели Короли Шторма, а сейчас владеет Харрен Хоар. Взамен я попросил Драконий Камень быть рядом со мной, когда придет время договориться с Харреном. В этом был смысл. Если Эйгону нужна была земля, Харрену было что потерять более чем достаточно, а мне никогда не хватало смелости отобрать ее у него.\n\nЭйгон отказывается от брака. У него уже есть две жены, обе его сестры, и язычник говорит, что ему не нужна третья. Вместо этого он предлагает своего сводного брата Ориса Уотерса в обмен на Аргеллу. Посланник называет его спутником и капитаном Эйгона, как будто командование может поставить отца на свадьбу бастарда или дать ему имя, достойное высечения над воротами. Орис — подлец, и Эйгон предлагает уложить его в постель моей дочери.\n\nЭто еще не все. Эйгон принимает названные мною земли только как начало приданого. Он также хочет, чтобы Масси-Хук и страна Штормлендеров тянулись на юг от Черноводной к Вендуотеру и истокам Мандера. Эти земли уже мои, ими владеют люди, присягнувшие перед богами и людьми на Штормовой Предел. Я предложил ему шкуру Харрена, и дракон в ответ потянулся за моей.\n\nВ этом зале есть люди, которые за меньшие деньги скинули бы посланника со скал, и я их не виню. Тем не менее, гнев — плохая причина оставлять намерения врага наполовину услышанными. Я узнаю всю наглость Эйгона, прежде чем решу, какого ответа она заслуживает."
 ourfury.0001.a:0 "Стража! Отрубить ему руки. Других рук Эйгон не получит."
 ourfury.0001.b:0 "Скажи всё целиком. Что еще предлагает дракон?"
 ourfury.0001.c:0 "Отнеси мой отказ в Драконий Камень. Я услышал достаточно."
 ourfury.0002:0 "Условия брака с бастардом"
 ourfury.0002.desc:0 "Я дал посланнику закончить. Орис Уотерс должен жениться на Аргелле, и земли к востоку от Ока Божьего, которые я впервые назвал, отойдут вместе с этим браком, если мы отнимем их у Харрена. Эйгон также требует Масси-Хук и территорию между Черноводной, Вендуотером и верхним Мандером. В свою очередь, Драконий Камень присоединяется ко мне против Харрена Хоара. Силы Эйгона будут направлены на север, а не на юг, и ни один король не будет присягать другому.\n\nЭта последняя часть спасает предложение от тайной. В письме Эйгона нет ни требований почтения, ни дани, ни претензий на Штормовой Предел. Ему нужны земли, брак и совместная война, и, несмотря на все свои языческие обычаи, он, по крайней мере, помнит, что пишет коронованному королю, а не вызывает в свой дворец какого-нибудь мелкого лорда.\n\nОрис остается трудностью. Аргелла — мой единственный наследник, и мужчина, за которого она выйдет замуж, будет стоять ближе к Штормовому Пределу, чем любой посторонний имеет право стоять. Однако Семь не постановили, что дом жены должен переходить в дом ее мужа только потому, что писцы находят этот обычай удобным. Если Орис войдет в этот дом через Аргеллу, то он войдет в него на моих условиях. Ребенок, который станет ее преемником, сможет носить имя Дюррандон, унаследовать кровь Дюррандона от своей матери и занять место, которое занимали отцы его матери до того, как Драконий Камень был чем-то большим, чем дымящаяся скала.\n\nЭйгон может получить земли, о которых он просил, и брак, который он предложил. У меня будет его сила против Харрена, и Штормовой Предел останется в моей крови и под моим именем. Если ему этого недостаточно, значит, он вообще никогда не хотел союза. #bold Орис Уотерс может жениться на моей дочери, но наследником Штормового Предела будет Дюррандон.#!"
 ourfury.0002.a:0 "Он войдёт в мой род — или свадьбы не будет. Так и передайте."
 ourfury.0002.b:0 "Нет. Тысяча лет Дюррандонов не заканчивается в этом зале."
 ourfury.0003:0 "Ворон на Драконий Камень"
 ourfury.0003.desc:0 "Ворон покидает Штормовой Предел еще до наступления сумерек. Я пишу ответ сам, потому что дело достаточно простое, чтобы уместиться в одну строку, и настолько важное, что мне не придется заставлять мейстера отшлифовывать его края.\n\n#italic Добро пожаловать, твой брат. Его сыновья будут Дюррандонами.#!\n\nУ моих лордов есть возражения, и никто из них не стесняется высказать их. Некоторые возражают против рождения Ориса, некоторые против земель, которые потребовал Эйгон, а некоторые против любого договора с человеком, который спит со своими сестрами и называет это браком. Я слышал их все. Семь могут судить душу Эйгона, когда захотят; Меня беспокоит Харрен Хоар, три дракона и то, останется ли Дом Дюррандон в Штормовом Пределе, когда битва закончится.\n\nЯ уступил землю вместо того, чтобы вместе сражаться с Харреном и Драконим Камнем, но я не уступил ни свою корону, ни свой дом. Если Эйгон примет это условие, Орис отправится на юг как муж Аргеллы, и договор останется в силе. Если он откажется, он может оставить своего ублюдка и узнать, чего стоят Штормовые земли, другой дорогой. #bold Условия отправлены. Драконий Камень может забрать их или подавиться ими.#!"
 ourfury.0003.a:0 "Скоро мы получим ответ Эйгона."
 ourfury.0004:0 "Ответ Дракона"
 ourfury.0004.desc:0 "Ответ от Драконьего Камня приходит раньше, чем я ожидал, и Эйгон без возражений принимает это условие. Орис приедет в Штормовой Предел для бракосочетания, которое будет заключено перед моим двором и на глазах Семи, и дети, рожденные от Аргеллы, будут носить имя Дюррандон и унаследовать через нее.\n\nОстальная часть письма касается земель и войны. Масси-Хук и территория к югу от Черноводной должны пройти в соответствии с соглашением. Когда наши знамена выступят против Харрена Хоара, Драконий Камень пойдет вместе с нами. Эйгон пишет, что у него нет ссор с домом, который хранит ему верность, и он не желает разрушать древнюю линию только для того, чтобы доказать, что он может. Прекрасные слова от человека с тремя драконами, но я слышал слова и похуже от людей, за которыми стоит гораздо меньше.\n\nЯ ожидал, что придется торговаться из-за одного условия, на которое я не уступлю. Вместо этого Эйгон сразу принял его, а это означает, что либо он понимает ценность Дома Дюррандон, либо он достаточно уверен в себе, чтобы позволить мне сохранить мое имя, пока он берет то, что еще хочет. Я узнаю, что достаточно скоро. #bold Я попросил союзника против Харрена. У меня есть один, и я хочу посмотреть, сохранит ли дракон веру так же хорошо, как он ее пишет.#!"
 ourfury.0004.a:0 "Откройте ему ворота. Штормовой Предел не боится какого-то бастарда."
 ourfury.0004.b:0 "Нет. Я передумал связывать свою наследницу браком с Драконьим Камнем."
 ourfury.0005:0 "Свадьба в Штормовом Пределе"
 ourfury.0005.desc:0 "Они поженились в большом зале под крышей Дюррана, перед Семерыми, собравшимися повелителями бури и достаточным количеством свидетелей, чтобы ни один мужчина впоследствии не стал притворяться, что неправильно понял сделку. Септон называет Аргеллу Дюррандон и Ориса Уотерса перед Отцом и Матерью, соединяет их руки и призывает Семерых стать свидетелями принесения клятв. Эйгон может придумывать какие угодно оправдания для свадьбы сестры с братом на Драконьем камне. В Штормовом Пределе моя дочь выходит замуж по законам богов и людей.\n\nОрис — это не то, чего некоторые из моих лордов ожидали от ублюдка из Драконьего Камня. Он широк, тих и осторожен в своих любезностях. Люди испытывают его во время пира, как это делают люди, и он не дает никому из них ссоры, которой они ищут. Я бы даже предпочел, чтобы он это сделал, потому что о характере мужчины судить легче, чем о его терпении, но условия брака он повторяет перед залом без колебаний. Наследство Аргеллы принадлежит ей, и дети, которые унаследуют его от нее, будут Дюррандонами из Штормового Предела.\n\nАргелла внимательно наблюдала за ним с момента его прибытия и нашла, что сказать ему больше, чем мне о браке. Я не стану вызывать привязанность к горстке разговоров и не требую этого. Короли вступали в брак по более плохим причинам, чем земля, кровь и полезный меч, и многие поступали хуже, чем муж, с которым их дочь могла бы вынести разговор. Брак законен, наследование установлено, и Семь услышали клятвы. #bold Орис вошел в Дом Дюррандон. Дом Дюррандон не вошел в свой.#!"
 ourfury.0005.a:0 "Нам ярость — и никакой брак этого не изменит."
 ourfury.0005.b:0 "Налейте вино. День заслужил это."
 ourfury.0006:0 "Шторм движется на север"
 ourfury.0006.desc:0 "Брак решил половину сделки. Харрен Хоар — другой. Его чудовищный замок возвышается рядом с Оком Бога, а речные земли, которыми он управляет, лежат между моим королевством и землями, которые я обещал жениться на Аргелле. Если эти земли когда-либо перейдут из рук в руки, сначала необходимо отобрать у них Харрена, а я хотел, чтобы этот железнорожденный негодяй был смирен задолго до того, как Эйгон Таргариен научился смотреть на запад.\n\nПовелители штормов собираются и едут на север по старым дорогам через Королевский лес к Черноводной. Орис едет вместе с ними, и знамена Эйгона уже движутся от Драконьего Камня. Я не собираюсь тратить хороших людей из Штормовых земель на стены Харренхола, если драконий огонь может дешевле ответить на камень, но замки — это не королевства. У Харрена есть речные лорды, переправы, зернохранилища, переправы и армии, которые нужно удерживать, пока драконы отвоевывают землю, за которую я заплатил.\n\nИтак, буря вместе с драконом идет против железнорожденных. Я бы предпочёл, чтобы рядом с моей дочерью был сын надлежащего происхождения и меньшая цена за союз, но сделка заключена, и я сдержу свои клятвы, какие бы вольности Эйгон ни допускал в отношении законов богов и людей в своей собственной постели. #bold Объявите сбор. Харрен достаточно долго сидел на украденных землях.#!"
 ourfury.0006.a:0 "Шторм движется на север. Харрен первым украл у нас."
 ourfury.0006.b:0 "Пусть едут мои лорды. Королю незачем самому мерить каждую дорогу."
 ourfury.0007:0 "Союзник на моей границе"
 ourfury.0007.desc:0 "Эйгон Таргариен высадился на берег в устье Черной воды, на трех холмах, где рыбаки выбрасывают на берег свои лодки, и впервые в моей жизни иностранная армия высадилась в нескольких днях езды от моей границы, и ни один штормовик не потянулся за мечом.\n\nКрюк Масси принадлежит ему. Так же и страна, идущая на юг к Вендуотеру. Я подписал эти земли своей рукой и собственной печатью, чего я раньше ни для кого не делал, и нельзя притворяться, что их у меня отобрали. Лорды, удерживавшие их под Штормовым Пределом, должны принести новые клятвы, и ни один из них не прислал мне жалобы, которые я хотел бы прочитать вслух.\n\nГод назад к этим стенам пришли всадники и сообщили, что над водой видели драконов, а люди потянулись за мечами. Сегодня утром всадники снова пришли с тем же словом, а оно означает противоположное. Звери улетают на север, как только сбор закончится. Харрен Хоар сорок лет возводил стены против достойного их врага, и он не будет долго ждать.\n\n#bold Сделка заключена. Теперь пусть дракон докажет, что он стоит того, что я за него заплатил.#!"
 ourfury.0007.a:0 "Теперь дракон мой. Харрен узнает об этом первым."
 ourfury.0010:0 "Цена мира"
 ourfury.0010.desc:0 "Война изменила Вестерос. Власть Харрена над речными землями ослабла, и амбиции Эйгона на нем не закончились. Сообщения из-за моих границ приносят битвы, сделки, подчинения и отказы, но ни одно из них не меняет соглашения, заключенного здесь. Штормовые земли остаются вне власти Эйгона, связанные с ним браком и договором, но не клятвой, и я не собираюсь допускать, чтобы успех в другом месте заставил его забыть разницу.\n\nЭйгон приходит в Штормовой Предел, чтобы поговорить о том, что будет дальше. Прежде чем я спрошу, он подтверждает, что дети Аргеллы остаются Дюррандонами и что земли и права, уже согласованные между нами, сохранятся. Тогда язычник, который однажды позаботился написать мне, как один царь другому, просит то единственное, что он оставил нетронутым.\n\nЕму нужна моя корона. Я должен отказаться от королевской власти и остаться лордом Штормового Предела, оставив в своих руках Штормовые земли, моих вассалов, мои доходы и моих наследников. Я буду править той же страной с того же места, но под короной Эйгона, а не своей собственной. Дюрран Божья Горе бросил вызов самим богам ради этой скалы, и теперь Эйгон Таргариен просит меня передать то, что не удалось захватить штормам, железнорождённым, андалам и дорнийцам.\n\nЯ знаю, что будет означать войну против его дома. Я видел драконов в действии, и только дурак ошибочно принимает знание силы врага за страх перед ним. Вопрос в том, потрачу ли я жизни своих лордов и их сыновей на то, чтобы сохранить обруч на своем лбу, или дам Эйгону его титул и сохраню все, что под ним. #bold Если я прогнусь, то это будет потому, что я выбрал то, что Дом Дюррандон может позволить себе потерять, а не потому, что язычники напугали меня. #!"
 ourfury.0010.a:0 "Корона — лишь металл. Штормовой Предел — это камень, кровь и люди."
 ourfury.0010.b:0 "Дюрран не склонился перед богами. Я не склонюсь перед язычником."
 ourfury.0011:0 "Буря склоняется, но не сдаётся"
 ourfury.0011.desc:0 "Это делается в моем зале, перед моими лордами, потому что, если мне придется свергнуть корону Дюррана, я сделаю это там, где каждый повелитель бури увидит, что у моего горла нет меча. Я сам отдаю его в руки Эйгону. Он принимает его без триумфа, откладывает в сторону и называет меня лордом Штормового Предела, подтверждая, что Штормовые земли принадлежат мне и моим наследникам под его короной.\n\nЗатем мои лорды снова клянутся. Вчера их клятвы закончились для меня. Сегодня они проходят через меня к Эйгону, но люди, замки, ренты, суды и рекруты Штормовых земель остаются под одной рукой. Аргелла по-прежнему моя наследница, а ее дети по-прежнему будут Дюррандонами Штормового Предела. Эйгон завоевал королевскую клятву, а не право разрушить тысячу лет моего дома.\n\nЯ был королем, когда септон сегодня утром прервал пост, и сейчас я им не являюсь. Я не буду притворяться, что потеря — это ничто, и не буду унижаться из-за нее. Харрен потерял свои земли, род и, возможно, многое другое. Я потерял корону и сохранил Штормовой Предел, свою дочь, свое имя и каждого лорда, который имел значение вчера. Люди могут сами решать, какую сделку они предпочли бы заключить. #bold Корона принадлежит Эйгону. Шторм остается Дюррандоном.#!"
 ourfury.0011.a:0 "Нам ярость. Король я или лорд — этого у меня не отнять."
 ourfury.0020:0 "Посланник возвращается невредимым"
 ourfury.0020.desc:0 "Я дал посланнику ответ еще до того, как он закончил его подносить, и дал его стоя, чтобы ни один человек в зале не мог принять его за предмет, все еще открытый для спора. Аргелла не продается ублюдку. Не ради земель Харрена, не ради головы Харрена и не ради дружбы человека, который спит со своими сестрами и ожидает, что Семеро поищут что-то другое.\n\nПоловина моих лордов хотела, чтобы его вынесли на куски. Фелл сказал это прямо, а Грандисон — громче. Он вышел за ворота на своих ногах, своими руками, и это не было милосердием. Король, который режет герольдов, — это король, которому никто не мешает послать герольдов, а у меня слишком много границ, чтобы тратить эту монету на одного посланника Валирийского. Эйгон может добиться честного отказа. Он не сможет назвать это бредом вспыльчивого старика.\n\nОн придет на юг. Я ожидал этого с тех пор, как первый ворон прилетел на Драконий Камень, и это ожидание ничего не меняет. Железнорождённые, андалы, дорнийцы: каждый из них прибыл на это побережье по более веской причине, чем отказ от свадьбы, и каждый из них вернулся домой без мужчин.\n\n#bold Он держит руки. Он держит своего ублюдка. Остальное мы решим на местах.#!"
 ourfury.0020.a:0 "Отправьте его домой невредимым. Война всё равно придёт."
 ourfury.0021:0 "Все условия выслушаны. Ответ — нет"
 ourfury.0021.desc:0 "Я слышал все это. Каждая лига земли, каждая статья, каждая вежливость. Никакого уважения, никакой дани, никаких претензий на Штормовой Предел, и силы Драконьего Камня обратились на север против Харрена Хоара рядом с моими. Я не буду притворяться, что это было плохое предложение. Это лучше, чем любой король Вестероса был подарён этой семьей, и, вероятно, лучше, чем любой другой будет.\n\nВсе равно дело в Аргелле. Она мой единственный ребенок и весь мой дом после меня, и Эйгон предлагает поселить ее на человека без собственного имени и объявить счет сбалансированным. Король может торговать землей. Землю можно вернуть, и я дважды в жизни возвращал часть ее. То, что проходит через дочь, проходит один раз, и все, что попадает в ее постель, навсегда остается на месте Дюррана.\n\nИтак, ответ — нет, учитывая целостность и знание. Ни один мужчина не скажет потом, что я в гневе отказался, не поняв, что лежит на столе. Я это понял достаточно хорошо. Именно поэтому у меня этого не было бы.\n\n#bold Дракон назвал справедливую цену. Он попросил одну вещь, которая никогда не продавалась.#!"
 ourfury.0021.a:0 "Я всё услышал. Мой ответ не изменится."
 ourfury.0022:0 "Отозванный ворон"
 ourfury.0022.desc:0 "Одиннадцать дней я получал письмо Эйгона, и одиннадцать дней я читал его, откладывал и снова брал. Он выполнил это условие без единого слова аргументов. Дети Аргеллы будут Дюррандонами, пишет он, как будто это ему ничего не стоит. Я назвал это условие, потому что был уверен, что оно разрушит все дело, а человек не отдает так легко то, что хочет сохранить.\n\nЛибо ему все равно, чье имя высечено над воротами, пока ворота принадлежат ему, либо он хочет, чтобы и это тоже было, и считает, что это может подождать одно поколение. Я сидел за столом с людьми, которые все уступали и забирали все обратно, прежде чем чернила высохли. Я был одним из них.\n\nПосланника давно нет, и в этом зале некому кричать, кроме моих лордов, которые рассказали мне, что они думали, когда прилетел первый ворон. Итак, сегодня вечером улетит второй ворон и заберет предложение обратно. Эйгон проявит щедрость там, где это сможет увидеть весь Вестерос, и откажется там, где это увидит весь Вестерос, и эту историю будут рассказывать таким образом в каждом зале отсюда до Стены. И так будет сказано. Меня скорее назовут изменчивым, чем королем, который поставил на место Дюррана ублюдочную черту и поблагодарил его за благосклонность.\n\n#bold Я спросил цену, которую, как я думал, он не заплатит. Он заплатил, и это то, что меня решило.#!"
 ourfury.0022.a:0 "Отправьте ворона. Предложение отозвано."
 ourfury.0030:0 "Война зятя"
 ourfury.0030.desc:0 "Эйгон высказался за мою корону, и это нельзя назвать вторжением. Две зимы назад его брат сидел за моим столом и поклялся перед Семерыми, что его сыновья будут носить мое имя. Люди, выходящие из Штормового Предела, маршировали рядом со знаменами у Божьего Ока. Некоторые из них похоронили друзей из той армии и теперь отправятся искать выживших.\n\nЕму нужен обруч и ничего кроме него. Ни Штормовой Предел, ни Штормовые земли, ни наследство Аргеллы. Он ни о чем не просил, и ничего из этого он не получит, прося. Только корона Дюррана Божьего Скорби, и только потому, что королевство с двумя королями в нем еще не то царство, которое, по его словам, у него есть.\n\nОрис пойдет на юг. Эйгон с самого начала отправил Ориса в Штормовые земли и не видит причин останавливаться сейчас. Мой зять против моих собственных знамен, и те внуки, которых боги сочтут нужными подарить мне, услышат об этом с той стороны, с которой останется рассказать.\n\n#bold Я сдержал все клятвы, данные этому дому. Я никогда не клялся им в этом.#!"
 ourfury.0030.a:0 "Созывайте знамёна. Он никогда не имел права требовать корону."
 ourfury.0030.b:0 "Он муж моей дочери. Пусть принесёт клятву."
 ourfury.0030.c:0 "Отправьте его назад к брату."
 ourfury.0030.d:0 "Схватите его. Моими людьми он командовать не будет."
 ourfury.0033:0 "Клятва зятя"
 ourfury.0033.desc:0 "Я велел привести его в большой зал, где все грозовые лорды Штормового Предела стояли и наблюдали за этим, потому что то, что делается тихо, — это то, о чем можно будет спорить позже. Орис Уотерс — муж моей дочери, мои внуки будут носить мое имя, а армия его брата марширует по моим дорогам. Двое из этих трёх для меня чего-то стоят. Я имею в виду выяснить, какой именно.\n\nОн не заставляет меня спрашивать дважды. Он опускается на одно колено на камни перед всем залом и говорит прямо и без прикрас: что он поклялся Штормовому Пределу и дому, в котором женился, что Эйгон не освободил его ни от чего, когда отправил на юг, и что он обнажит за меня свой меч против любого живого человека. Он не называет имя своего брата. Я замечаю, что он этого не делает, и пропускаю это мимо ушей.\n\nАргелла наблюдает за происходящим с помоста и ни разу не смотрит на меня. Ей есть что терять здесь больше, чем любому из нас, и она точно знает, что бы я с ним сделал, если бы он колебался. Он не колебался. Что бы еще Семь ни сделали из него, они не сделали его трусом, и я знал очень много знатных людей, которые были такими.\n\nПоэтому он едет с нами. Мужчины скажут, что я был дураком, позволив это, и эти мужчины могут сказать это там, где я могу их услышать. Я принимал клятвы от людей более высокого происхождения, которые содержали их хуже.\n\n#bold Он преклонил колени в моем зале и поклялся перед Семерыми. Теперь пусть дракон придет и посмотрит, что он купил у этого ублюдка.#!"
 ourfury.0033.a:0 "Встань, зять. Ты поедешь по правую руку от меня."
 ourfury.0031:0 "Крюк возвращается домой"
 ourfury.0031.desc:0 "Условия подписаны, и корона остается у меня. Эйгон не потерял свое королевство, и я не буду оскорблять никого из нас, утверждая, что он это сделал. Он проиграл войну, которую решил начать, и заплатил за нее той единственной монетой, которую я хотел.\n\nКрюк Масси снова стал землей Дюррандона. То же самое происходит с лесом Вендуотер и лесами вдоль залива, а это означает, что каждое владение к югу от его нового города теперь отправляет свои рекруты в Штормовой Предел. Короли Шторма удерживали все это еще до того, как Таргариены пересекли воду, и я удерживал их дважды за одну жизнь, а это больше, чем большинству людей удается что-либо сделать.\n\nУдовольствия от этого меньше, чем я ожидал. Орис по-прежнему мой зять, а Аргелла по-прежнему его жена, и в земле есть повелители бури, которые скакали под знаменами драконов, прежде чем те выступили против них. Выигранная война — это выигранная война. Это не то же самое, что никогда не нуждаться в нем.\n\n#bold Он пришел за короной Дюрранской Горе Богов и вернулся домой с меньшим, чем принес.#!"
 ourfury.0031.a:0 "Крюк Масси снова подчиняется Штормовому Пределу."
 ourfury.0032:0 "Цена, уплаченная дважды"
 ourfury.0032.desc:0 "Условия, которые устанавливает Эйгон, — это условия, которые он поставил перед смертью одного человека. Моя корона для моих земель. Штормовой Предел, Штормовые Земли, мои лорды, мои доходы и Аргелла после меня — все это осталось под его властью. Ни одно слово не изменилось. Ему не нужно было его перемещать.\n\nТаким образом, я купил войной именно то, что мне предложили даром, и все, что мне нужно продемонстрировать в качестве разницы, — это уверенность в том, что я не смог бы ее выиграть. Я сказал своим лордам, что не побоюсь встать на колени, и это не так. Меня втянули в это. Певцам это может показаться красивее. Я не делаю.\n\nХуже всего не Эйгон. Эйгон — победитель, а победители получают короны, и нет ничего постыдного в том, чтобы проиграть человеку, завоевавшему шесть из них. Хуже всего то, что его брат сидит за моим столом по праздникам, женатый на моей дочери, и что люди, которые разбили мою армию, будут пить в моем зале еще до конца года.\n\n#bold Я бы корону не продавал. В конце концов я отдал его и заплатил за эту привилегию.#!"
 ourfury.0032.a:0 "Тогда забирай. Чтобы узнать цену, мне пришлось пережить войну."
 ourfury.0100:0 "Сбор Шторма"
 ourfury.0100.desc:0 "Итак, это война. Я отверг Драконий Камень и призвал свои знамена, и повелители бури ответили так, как и положено повелителям бури. Фелл родом из Оскверненного леса, Эррол из Хейстэк-Холла, Баклер из Бронзегейта, Грандисон из Грандвью, а Дондаррион из Блэкхейвена со всеми маршевыми мечами, которые у него есть. Эйгон может называть себя на своем камне как угодно. К югу от Черноводной люди все еще подчиняются Аргилаку Дюррандону.\n\nДожди начались рано и сильно. Дороги, которые две недели назад были твердыми, превратились в грязь с юга Черноводной, и все ручьи текут высоко. Семеро прислали мне погоду, достойную Короля Шторма. Дракон может пересечь страну и остановить армию, но Орису все еще нужны повозки, фураж, сухие тетивы и земля, на которой люди могут стоять.\n\nОрис идет на юг с большей частью армии Эйгона, и Рейнис Таргариен находится с ним на Мераксес. У меня больше людей, я лучше знаю страну, и лорды защищают свои поля. У него есть дракон. Мне не нужно притворяться, что последнее преимущество невелико, но я и не буду вести себя так, как будто один зверь уже завоевал Штормовые земли. От того, где мы встретимся, будет зависеть, узнает ли Орис это сам."
 ourfury.0100.a:0 "Королевский лес. Он узнает, что скрывают мои деревья."
 ourfury.0100.b:0 "Открытое поле. Без изгородей, уловок и оправданий."
 ourfury.0100.c:0 "Дождливый лес. Пусть сперва Орис в нём утонет."
 ourfury.0110:0 "Дождь над Королевским лесом"
 ourfury.0110.desc:0 "Фелл, Баклер и Эррол ударили фургон Таргариенов, когда тот пересекал Вендуотер. Они вышли из-за деревьев с первыми лучами солнца, убили людей прежде, чем Орис смог привести в порядок остальную часть своей армии, и отступили прежде, чем вес его армии смог сомкнуться вокруг них. К полудню многие из его людей были мертвы или пропали без вести, а повелители штормов исчезли обратно в страну, на которую они охотились, ездили верхом и проливали кровь с детства.\n\nРейнис привела Мераксес еще до полудня, но низкая облачность, проливной дождь и древесный покров не позволили ей обнаружить сил рейдеров. Она сожгла участки леса вдоль дороги и заставила повелителей бури отступить, но большинство из них уже рассеялось, прежде чем дракон добрался до них. Мне сказали, что некоторые из людей Орис приветствовали ее появление над головой. Мужчины громко аплодируют, когда им нужно напомнить, что они не боятся.\n\nЗасада стоила Орису крови и времени, и она показала нам, как быстро Мераксес может наказать за ошибку. Хороший. Я предпочел бы знать, где находится зверь сейчас, чем обнаружить его, когда половина моей армии оказалась в ловушке под ним. #bold Орис вошел в мою страну. Он заплатит за каждую дорогу, брод и каждый лес, который отнимет у меня.#!"
 ourfury.0110.a:0 "Продолжайте набеги. Пусть бастард не пройдёт спокойно ни мили."
 ourfury.0110.b:0 "Довольно мелких стычек. Вынудим его дать сражение."
 ourfury.0111:0 "Разгневанный король"
 ourfury.0111.desc:0 "Новости о боевых действиях разошлись за пределы Штормовых земель. Купцы и посланники задают вопросы о Вендуотере и о том, что Мераксес проверяется погодой. Остальной Вестерос может сплетничать. Единственное суждение, которое меня беспокоит, происходит внутри моего собственного лагеря, где люди, которые когда-то смотрели в небо на каждую тень, теперь видели, как люди-драконы истекают кровью, как и все остальные.\n\nМои лорды видели, как Орис теряет людей на незнакомых ему дорогах. Они видели, как Мераксес упал под дождем и ветром. Их уверенность вернулась, и я собираюсь воспользоваться ею, прежде чем осторожность снова перерастет в страх. Лорда можно простить за уважение к дракону. Ему не простят за то, что он научил своих людей бояться врага до того, как он появится.\n\nУ Ориса все еще есть дисциплинированная армия, а у Рейнис все еще есть Мераксес. Я знаю это не хуже любого дрожащего мейстера, который может добавить к одной армии одного дракона и объявить сумму непобедимой. #bold Однажды мы их окровавили. Клянусь Воином, я хочу сделать это еще раз, прежде чем они вспомнят о своей храбрости. #!"
 ourfury.0111.a:0 "Я поеду с авангардом. Не стану прятаться за своими лордами."
 ourfury.0111.b:0 "Удерживать строй. Осторожность — не трусость."
 ourfury.0112:0 "Скованные крылья"
 ourfury.0112.desc:0 "Шторм улегся над побережьем и не утихает уже три дня. Мераксес остается на земле над Вендуотером, плотно сложив крылья от дождя. Мои разведчики видели, как Рейнис дважды пыталась ее поднять, и обе попытки закончились почти сразу же, как и начались. Если Семеро собираются подарить мне дракона, скованного погодой, я не буду оскорблять их, отказываясь от подарка.\n\nБез Мераксес в воздухе Орису приходится двигаться, как и любому другому командиру. Его армия меньше моей, находится глубоко в стране, соответствующей Штормовому Пределу, и вынуждена выйти на дороги, которые дождь превратил в грязь. Он может быть Десницей Эйгона, братом, бастардом или всеми тремя вместе. На земле он по-прежнему является лидером среди соперников, и я побеждал более сильных соперников, чем он.\n\nПогода не будет держаться вечно. Когда ветер утихнет, Рейнис снова поднимется, и вместе с ней изменится все преимущество. До тех пор поле принадлежит солдатам, и никто к югу от Черноводной не имеет на него больше прав, чем я. #bold Пока Мераксес находится под арестом, Орис узнает, что стало с каждым человеком, принявшим Штормовые земли за легкую страну. #!"
 ourfury.0112.a:0 "Вперёд. Воин даровал нам этот час."
 ourfury.0112.b:0 "Отправьте разведчиков. Я хочу знать, смогут ли люди до неё добраться."
 ourfury.0120:0 "Небо становится черным"
 ourfury.0120.desc:0 "Перед рассветом ветер утих, и Рейнис не теряла времени. Мераксес пролетел низко над деревьями и обнаружил повелителей штормов, которые мешали маршу Ориса со времен Вендуотера. Дождь пропитывал лес несколько дней, но драконий огонь прожигал мокрые листья, зеленые ветви, лошадей и людей. Неведомый быстро взял должное, как только она их нашла.\n\nЛорд Эррол мертв. Фелл и Баклер вернули назад все, что смогли, из своих команд, многие из них были без щитов и лошадей, и от каждого человека среди них пахло дымом. Они меньше говорят о людях, которых потеряли, чем о звуке, который Мераксес издал над деревьями перед тем, как сошел пожар. Я не буду называть их трусами из-за этого. Трусливый убегает до того, как наступит опасность. Эти люди стояли до тех пор, пока само небо не сожгло их.\n\nМогу заменить лошадей. Я не могу заменить лордов и не буду продолжать скармливать добрым людям леса, которые Мераксес может превратить в печь только для того, чтобы доказать, что у меня есть храбрость. Любой, кто принимает благоразумие за страх, может сказать это в моих слухах. #bold Дракон снова летает. Мы изменим войну раньше, чем она изменит ее за нас.#!"
 ourfury.0120.a:0 "Рассредоточить войско. Пусть чудовище охотится за тенями."
 ourfury.0120.b:0 "Держаться вместе. Её встретят все наши луки."
 ourfury.0121:0 "Лорды колеблются"
 ourfury.0121.desc:0 "Сегодня вечером в мою палатку пришли три лорда, и ни один из них не пришел только ради себя. Грандисон говорил за остальное. Эррол мертв, Фелл потерял почти половину людей, которых увел на север, Баклеру не хватает лошадей, и каждый ворон с побережья приносит еще один отчет о деревнях, опустевших перед наступлением Таргариенов. Ни один мужчина в палатке не произнес слово «страх». Они повелители штормов, и от меня они заслужили даже больше.\n\nЗатем Грандисон сообщил мне, что условия Эйгона открыто повторяются в лагере Ориса. Любой повелитель бури, преклоняющий колени, сохраняет свои земли, свой замок и свое имя. Язычник достаточно узнал о Вестеросе, чтобы знать, куда положить нож. Он не просит моих лордов предать свои дома. Он предлагает пощадить эти дома, если они предадут меня.\n\nГрандисон не просил разрешения дезертировать. Он сказал, что если я прикажу ему остаться, его дом останется и заберет все, что с ним связано. Клянусь Семерыми, именно поэтому решение остается за мной, а не за ним. Их клятвы дают мне право требовать всего. Король, который тратит храбрых людей только потому, что они достаточно храбры, чтобы подчиняться ему, ошибочно принимает гордость за долг. #bold Я решу, чего требует верность дому Дюррандон, и ни один драконлорд не решит это за меня. #!"
 ourfury.0121.a:0 "Напомните им о клятвах. Пока я стою, никто не уйдёт."
 ourfury.0121.b:0 "Трусы и клятвопреступники. Пусть бегут домой, за свои стены."
 ourfury.0122:0 "Падение Бронзовых Врат"
 ourfury.0122.desc:0 "Бронзегейт взят, моя армия отброшена через Слейн, и у меня осталось примерно одиннадцать тысяч человек из двадцати тысяч, принявших участие в первом сборе. Правый уступил дорогу у брода после того, как Мераксес несколько раз пересек его. Эти люди не были трусами. Я видел горящих под ними лошадей и людей, пытающихся сомкнуть ряды, в то время как их щиты загорелись. Сам Воин не мог требовать большего от смертных. Баклер умер, удерживая их вместе достаточно долго, чтобы остальные смогли пересечь границу.\n\nДорога в Штормовой Предел позади меня открыта. Я отправил Аргеллу обратно с приказом подготовить замок и обеспечить устойчивость гарнизона. Она знает так же хорошо, как и я, что одни стены не выиграют эту войну, пока Мераксес умеет летать, но Штормовой Предел пережил каждого дурака, который думал, что камень — это все, что его удерживает.\n\nУ меня все еще есть армия, и Орис ее не уничтожил. Если я продолжу уступать позиции, вскоре между ним и наследством моей дочери не останется земли. Я могу выбрать следующее поле боя, привести на него всех оставшихся у меня людей и заставить эту войну завершиться до того, как Мераксес сожжет королевство на куски. Я отступил достаточно далеко, чтобы любой человек мог назвать меня трусом. #bold Следующий участок земли, который я отдам Орису, будет измеряться кровью, а не милями. #!"
 ourfury.0122.a:0 "Развернуться и сражаться. Никто не назовёт Аргилака Дюррандона трусом."
 ourfury.0122.b:0 "Отступаем к Штормовому Пределу. Его стены нас ещё не подводили."
 ourfury.0130:0 "Последняя Буря"
 ourfury.0130.desc:0 "Орис захватил холмы к югу от Бронзегейта и выкопал своих людей на возвышенности. В ясную погоду я бы назвал это сильной позицией и позволил ему проголодаться на ней. Погода совсем не ясная. Дождь льет по полю настолько сильно, что ослепляет лучника, склоны превращаются в грязь, а Мераксес присел на склоне холма, а Рейнис рядом с ней, не в силах удержаться на высоте во время шторма. Боги послали мне бурю, достойную имени Дюррандон.\n\nМоя армия больше, а буря уничтожила большую часть преимуществ, которые привели Ориса так далеко. Холм не исчез. Нам придется карабкаться за ним, и каждая потерявшая равновесие лошадь откроет брешь для его копий. Пусть будет так. Воин не обещает сухой земли, и я тоже.\n\nЯ еду по очереди, прежде чем мы начнем. Там Фелл, там Грандисон, там Дондаррион и Морриген, а также остатки людей Баклера. Они следовали за мной при каждом отступлении в этой кампании и еще не отказались выполнить приказ. Я не буду просить таких людей провести еще один день, размышляя, хватит ли у их короля смелости использовать их. #bold Озвучьте заряд. Если Орису нужны Штормовые земли, он может забрать их у нас здесь.#!"
 ourfury.0130.a:0 "Ударим в центр. Разобьём его там, где он уверен в своей силе."
 ourfury.0130.b:0 "Займём левый склон. Выбьем его с холма."
 ourfury.0131:0 "Ярость"
 ourfury.0131.desc:0 "Первый заряд погиб на склоне. Второй достиг линии Таргариенов и был отброшен обратно в грязь. На третьем мы ворвались в их центр, и какое-то время линии вообще не было, только лошадь Штормовой земли пробиралась в гору сквозь дождь, в то время как нога Ориса пыталась закрыть брешь. Я слышал, как люди называли кавалерию бесполезной в грязи. Эти люди никогда не ездили со мной.\n\nТогда Мераксес нашел место, где можно было дышать огнем. Она не могла забрать небо, да в этом и не было необходимости. Передняя часть моего авангарда исчезла в пламени, и лошади, пронесшие рыцарей через три атаки, вырвались из-под всадников и побежали. Моя собственная лошадь рухнула подо мной в давке. К тому времени, как я выбрался наружу, моя рука, владеющая щитом, онемела, и битва вокруг нас уже завершилась. Если Неведомый хочет меня, ему придется пойти ради меня в грязь.\n\nПовелители штормов все еще сражаются. Каждый раз, когда люди Ориса прорываются в брешь, их встречает еще один отряд домашних рыцарей, и центр держится немного дольше. Где-то над дождем с холма звучит рог, и люди впереди меня отступают в сторону, ожидая, что кто-то спустится сквозь их ряды. Я знаю, кто это, еще до того, как увижу его. #bold Хорошо. Мне надоело убивать людей, посланных Орисом Уотерсом. Теперь он может ответить за свою войну.#!"
 ourfury.0131.a:0 "Я встречу его. Король Бури не прячется."
 ourfury.0132:0 "Ублюдок спускается с холма"
 ourfury.0132.desc:0 "Орис Уотерс останавливается в нескольких шагах от меня в грязи и призывает меня уступить. Он дает мне мои титулы, предлагает пощадить людей, все еще сражающихся вокруг нас, и говорит, что, если я сложу свой меч, я сохраню Штормовой Предел, Аргелла сохранит свое наследство, а повелители бури, которые подчинятся мне, сохранят свои земли. Он говорит так, как будто эти вещи уже принадлежат ему и он должен вернуть мне.\n\nОн моложе, не ранен и бронирован до горла. Я потерял коня и щит, моя левая рука едва сжимается, а за ним на холме стоят люди Таргариенов. Я предоставляю ему все преимущества и ни одного права командовать мной. Мужчина не станет моим королем, если он стоит на более высоком месте, а ублюдок не станет щедрым, предложив мне мой собственный замок.\n\n#italic Выход, ваша светлость.#!\n\nДюррандонов и раньше выгоняли с полей. Нас осаждали, избивали, морили голодом и заставляли покупать мир, и Штормовой Предел до сих пор носит наше имя. Я не буду первым в своем роду, кто обнаружит трусость, потому что Орис Уотерс достаточно вежливо спрашивает. #bold Если ему нужен меч Короля Шторма, он может прийти и забрать его.#!"
 ourfury.0132.desc.courtesy:0 "Орис Уотерс останавливается в нескольких шагах от меня и снимает шлем, прежде чем заговорить. Что бы я ни думал об этом человеке, это сделано правильно. Он выдвигает условия лицом к лицу, в то время как люди все еще умирают вокруг нас, и он дает мне все титулы, которые лагерь Эйгона пытался отобрать в этой войне.\n\nОн предлагает пощаду повелителям штормов, если я уступлю. Штормовой Предел остается за моим домом, наследство Аргеллы подтверждено, а мои вассалы сохраняют свои земли. Он даже предлагает мне место за своим столом после войны, что звучит как нечто большее, чем обещал ему его брат-язычник, и, возможно, так оно и есть. Я могу уважать смелость, необходимую для того, чтобы сделать такое предложение, не притворяясь, что я обязан его принять.\n\n#italic Выход, ваша светлость. Пожалуйста.#!\n\nНа мгновение я понимаю, почему Эйгон ему доверяет. Затем я смотрю мимо Ориса на людей, все еще сражающихся под моим знаменем, и на мокрого коронованного оленя, висящего над ними. Вежливость заслуживает вежливости, а не сдачи. #bold Я отвечу ему, как один воин отвечает другому. Если он хочет моего подчинения, он должен выиграть его сталью.#!"
 ourfury.0132.a:0 "Ответим ему сталью."
 ourfury.0132.b:0 "Прорубите мне путь наружу. Пусть потом говорят что угодно."
 ourfury.0135:0 "Штормовой король выстоял"
 ourfury.0135.desc:0 "Орис Уотерс мертв в грязи у моих ног, и люди вокруг нас знают об этом раньше меня. Он оказался сильнее, чем я ожидал, и быстрее, чем имел право быть человек его роста. В начале боя он вонзил меч мне в левое плечо, и после этого у меня уже не было сил тратить зря. Я отступил, заставлял его поворачиваться в грязи и ждал, пока он не приложит слишком много усилий к порезу, который, как он думал, положит конец этому. Нет ничего постыдного в том, чтобы признать, что этот ублюдок был хорош. Он все равно мертв.\n\nЯ помню начало яснее, чем последующий удар. Его нога подкосилась, мой клинок нашел его под рукой, а человек, который шел на юг, чтобы захватить Штормовой Предел, упал передо мной на колени. К тому времени, как рыцари моего дома подошли к нам, крик распространился по обеим линиям, и центр Ориса начал отходить от холма. Воин может судить, кто из нас сражался лучше. Поле уже вынесло свое решение.\n\nМеня посадили на другую лошадь и связали плечо, как могли. Затем я вижу Мераксес на другом конце поля, все еще стоящего на земле из-за бури, Рейнис рядом с ней и остатки армии Ориса между нами. Я убил Руку Эйгона. Боги оставили одного из его драконов сидящим в грязи в пределах видимости моего знамени. Осторожный человек назвал бы эту победу достаточной. #bold Меня никогда не обвиняли в осторожности. Если с Мераксес можно связаться, я хочу связаться с ней. #!"
 ourfury.0135.a:0 "Сорок всадников — за мной. Посмотрим, течёт ли у драконов кровь."
 ourfury.0135.b:0 "Трубите отбой. Я не превращу победу в тщеславие."
 ourfury.0136:0 "День, когда их сломила буря"
 ourfury.0136.desc:0 "Я наблюдал за Мераксес на склоне холма, пока мои лорды приводили армию в порядок. Какое-то время я хотел, чтобы каждую лошадь, которая еще могла двигаться, отправили за ней через поле. Наконец Фелл положил руку на мою узду, на что осмелились бы очень немногие мужчины в Вестеросе, и рассказал мне то, что я уже знал: Орис был мертв, его центр отступал, а мои собственные люди были слишком измотаны, чтобы пережить еще одну атаку, если дракон нападет на них.\n\nИтак, я озвучил отзыв. Я не люблю отступать ни от какого живого существа, а тем более от раненого дракона, но есть разница между смелостью и отбрасыванием людей, которые уже выиграли для меня мою битву. Какой-нибудь придворный дурак, если захочет, может назвать эту осторожность малодушной. Он может прийти в Штормовой Предел и объяснить это перед теми же лордами, которые стояли со мной в грязи.\n\nМераксес все еще жив, и Эйгону еще предстоит вести войны, но Орис пришел на юг, чтобы разрушить мое королевство, и лежит мертвым на поле, которое он выбрал. Мое плечо не сильно поднимется над грудью, но я жив, моя армия по-прежнему моя, и Штормовой Предел остается позади. #bold Этот ублюдок пришел за моей короной. Вместо него он у Неведомого.#!"
 ourfury.0136.a:0 "Перевяжите рану. Я ещё не закончил с Эйгоном."
 ourfury.0140:0 "Мераксес на земле"
 ourfury.0140.desc:0 "Я провожу сорок всадников через затопленное поле в сторону Мераксес. Больше мужчин замедлило бы нас и скорее привлекло бы внимание. Меньшее количество не оставит нам надежды добраться до нее через стражу, собравшуюся вокруг Рейнис. Некоторые люди назовут это безумием, если кто-нибудь из них доживет до того, чтобы услышать о нем. Лучшие люди называли меня хуже. Дождь настолько сильный, что дракон исчезает между одним ударом сердца и следующим, а затем возвращается в большем размере каждый раз, когда расстояние сокращается.\n\nВблизи в ней нет ничего изящного. Мераксес наполняет склон холма сложенными крыльями, бледной чешуей, мускулами и жаром ее дыхания. Одна только ее голова больше груди боевого коня, и один глаз следит за нами, когда мы приближаемся. Я ожидал размера и огня. Я не ожидал уверенности в том, что за этим глазом скрывается мысль или что зверь посмотрит на меня так, будто это я вторгся на территорию.\n\nРейнис стоит у основания шеи, выкрикивает команды на валирийском языке и пытается поставить дракона в вертикальное положение. Мераксес переместила свой вес, и люди вокруг меня без всякого предупреждения опустили копья. Я вручаю свою душу Семерым, кладу копье под руку и выбираю узкое место, где горло встречается с грудью. #bold Если Воин завел меня так далеко, он может посмотреть, что будет дальше. #!"
 ourfury.0140.a:0 "Вперёд. Сорок всадников выяснят, можно ли убить дракона."
 ourfury.0141:0 "Как захотел Эйгон"
 ourfury.0141.desc:0 "Одиннадцать человек возвращаются в Штормовой Предел из сорока, которые ехали с моим отцом, и их рассказы во многом совпадают. Они достигли Мераксес прежде, чем дракон смог улететь. Вместо этого она поднялась на передние ноги, и одним взмахом сложенного крыла сломала левую сторону атаки прежде, чем она успела открыть рот.\n\nМой отец прошел крыло. Двое мужчин увидели, как его копье ударило в основание шеи, и увидели, как острие вошло внутрь. Затем Рейнис села в седло, Мераксес повернул голову, и огонь объединил лошадь и всадника. Никто из одиннадцати не видел, чтобы он снова поднялся.\n\nПеред атакой он снял свою корону и отдал ее оруженосцу. Вот что вернулось ко мне вместе с его выжившими людьми и осознанием того, что поле боя для нас потеряно. #bold Мой отец умер. Его корона у меня на столе, а Штормовой Предел принадлежит мне.#!"
 ourfury.0141.a:0 "Ворота останутся закрытыми."
 ourfury.0142:0 "Падение Дракона"
 ourfury.0142.desc:0 "Мое копье вошло в основание горла Мераксес, где чешуя сужалась к шее. Я почувствовал, как древко вошло глубже, чем могло пройти любое копье, затем дракон извернулся и чуть не вырвал мою руку из гнезда. Когда она пришла в себя, люди и лошади исчезли под ее крылом, но из раны продолжала литься темная кровь дождем. Так что драконы все-таки истекают кровью, и, судя по Семерке, ее очень много.\n\nПосле этого я помню очень мало. Племянника Фелла схватили за крыло рядом со мной. Кто-то оттащил Рейнис, когда Мераксес качнулся на ее бок. Дракон дважды пытался подняться и не смог. Каждое движение становилось слабее, пока огромная шея не погрузилась в грязь и больше не поднималась. Мужчины, которые всю войну боялись звука ее крыльев, молча стояли вокруг нее и смотрели, как из нее уходит жизнь.\n\nОрис был уже мертв, и зрелище падения Мераксес положило конец тому, что осталось от его армии. Его люди двинулись на север, к Черноводной, унося с собой Рейнис. Она была жива, когда ее забрали с поля боя, хотя и сильно пострадала. У меня не осталось ни лошадей, ни сил, чтобы преследовать далеко, и я не буду извиняться за то, что не смог преследовать побитых людей после того, как убил их командира и их дракона на одном поле.\n\nМераксес лежит там, где она упала, такая большая даже после смерти, что мужчины рядом с ней понижают голоса. Эйгон Таргариен может сохранить своих сестер-жен, свои языческие обычаи и любые титулы, которые он накопил где-либо еще. Один из драконов, с которыми он пересек Черную воду, мертв в моем королевстве, а коронованный олень все еще летает над Штормовым Пределом. #bold Язычник это ясно услышит. Штормовые земли не его.#!"
 ourfury.0142.a:0 "Отправьте весть. Пусть Эйгон узнает, кто убил его дракона."
 ourfury.0150:0 "Грязь и кровь"
 ourfury.0150.desc:0 "Орис Уотерс избил меня в грязи перед двумя армиями, и нет никакой лжи, достойной того, чтобы говорить об этом. Он был моложе, он был сильнее и удерживал ноги в конце долгого дня, когда я не мог. Когда я упал, его меч уже был сквозь меня.\n\nВот я и лежу здесь, в грязи, кишках и крови, вот чем это кончается для солдата, и я никогда не претендовал на то, чтобы быть кем-то другим. Пятьдесят лет войны, а земля всегда ждала.\n\nЭйгон может получить поле. Он не может получить последнее.\n\n#bold Я Аргилак Дюррандон, и я буду жить вечно в песнях.#!"
 ourfury.0150.a:0 "Так умирает последний из Королей Бури."
 ourfury.0160:0 "Штормовая королева"
 ourfury.0160.desc:0 "Мой отец умер, и еще до конца дня я провозгласил себя королевой Штормовых земель со стен Штормового Предела. Гарнизон видит корону на моей голове, капитаны приносят клятву перед теми же людьми, которыми командуют, и до наступления темноты все ворота запираются.\n\nШтормовой Предел выдержал штормы, осады и войны с тех пор, как Дюрран возвел на этой скале седьмой замок. У меня в стенах четыреста человек, достаточно продовольствия, чтобы выдержать длительную оборону, и крепость, которую не сможет взять штурмом ни одна обычная армия. Однако по ту сторону залива Рейнис и Мераксес находятся вместе с силами, убившими моего отца, и никакая стена не сможет заставить дракона сражаться по правилам обычной осады.\n\nКорона не остановит Мераксес. Это может сохранить ясность вопроса. Если Орису нужны Штормовые земли, он должен разобраться с женщиной, которая их унаследовала, а мои люди должны решить, смогут ли они удержать Штормовой Предел вместе со мной, прежде чем враг решит это за них. #bold Моего отца больше нет. Дом Дюррандон — нет.#!"
 ourfury.0160.a:0 "Заприте ворота. Людей — на стены."
 ourfury.0160.b:0 "Отправьте посланника под мирным знаменем к Орису. К нему, не к его брату."
 ourfury.0160.b.other:0 "[fab_ourfury_foe.GetTitledFirstName] получит послание под белым знаменем. Больше переговоры вести не с кем."
 ourfury.0160.a.hold:0 "Запри ворота. Мои люди их удержат."
 ourfury.0160.a.yield:0 "Ты. Положи это и отойди от двери."
 ourfury.0160.a.yield.named:0 "[fab_ourfury_captain.GetFirstName], что ты делаешь?"
 ourfury.0160.desc.noorys:0 "Мой отец умер, и еще до конца дня я провозгласил себя королевой Штормовых земель со стен Штормового Предела. Гарнизон видит корону на моей голове, капитаны приносят клятву перед теми же людьми, которыми командуют, и до наступления темноты все ворота запираются.\n\nОрис Уотерс тоже мертв. Мой отец убил его в грязи на глазах у двух армий, и поэтому ублюдок Эйгон, которому предстояло поселиться в этом замке, никогда не увидит его изнутри. Что бы еще ни тратил мой отец, а он тратил все, он покупал это.\n\nЗа заливом остался [fab_ourfury_foe.GetTitledFirstName], дракон и армия, потерявшая человека, который ее возглавлял. У меня есть четыреста человек, провизия, достаточная для длительного инвестирования, и крепость, которую ни одна обычная армия не сможет взять штурмом. Ничто из этого не является аргументом против дракона. Это только то, что у меня есть.\n\n#bold Моего отца больше нет, как и человека, для которого они меня предназначали. Дом Дюррандон не является ни тем, ни другим.#!"
 ourfury.0310:0 "Четыреста воинов"
 ourfury.0310.desc:0 "[fab_ourfury_foe.GetTitledFirstName] разбил лагерь под этими стенами достаточно долго, чтобы люди перестали пользоваться палатками и начали называть это место по имени. Никакого нападения не было. Штормовой Предел никогда не был взят штурмом, и никто там не настолько глуп, чтобы захотеть попытаться первым.\n\nУ меня четыреста человек. У меня было четыреста, когда я надел на голову отцовскую корону, и до сих пор у меня осталось четыреста, что звучит как стабильность, пока не посчитаешь, у скольких из них есть жены и поля в деревнях, которые кормит армия. Никто не открыл ворота. Это не то же самое, что об этом никто не думает.\n\nМераксес находится достаточно близко, и я могу видеть ее со стороны моря, и я ищу ее каждое утро, прежде чем решу. Потомкам Дюррана всю жизнь говорили, что стена, стоявшая тысячу лет, выдержит еще одну зиму. Никому из них никогда не приходилось объяснять дракону, что такое стена.\n\n#bold Врата держатся, пока я говорю. Мне бы очень хотелось знать, как долго это будет продолжаться. #!"
 ourfury.0310.a:0 "Ворота держатся. Пусть сидит в грязи."
 ourfury.0310.a.hold:0 "Ворота держатся, и мои капитаны держатся вместе с ними."
 ourfury.0310.b.yield:0 "Значит, это случится сегодня ночью. И руками моих же людей."
 ourfury.0310.b.yield.named:0 "[fab_ourfury_captain.GetFirstName]. И ты тоже."
 ourfury.0310.c:0 "Отправьте к Орису. Я договорюсь с ним прежде, чем другие договорятся за меня."
 ourfury.0310.c.other:0 "[fab_ourfury_foe.GetTitledFirstName] получит моё послание. Я начну переговоры прежде, чем мои командиры начнут их от моего имени."
 ourfury.0310.desc.nodragon:0 "[fab_ourfury_foe.GetTitledFirstName] разбил лагерь под этими стенами достаточно долго, чтобы люди перестали пользоваться палатками и начали называть это место по имени. Никакого нападения не было. Штормовой Предел никогда не был взят штурмом, и никто там не настолько глуп, чтобы захотеть попытаться первым.\n\nУ меня четыреста человек. У меня было четыреста, когда я надел на голову отцовскую корону, и до сих пор у меня осталось четыреста, что звучит как стабильность, пока не посчитаешь, у скольких из них есть жены и поля в деревнях, которые кормит армия. Никто не открыл ворота. Это не то же самое, что об этом никто не думает.\n\nНад заливом нет дракона. Это единственная вещь в этой осаде, которая пошла так, как никто не ожидал, и я видел, как люди на стенах смотрели на пустое небо и стояли немного прямее ради него. Пустое небо не накормит четыреста человек, но я возьму то, что пришлют Семь.\n\n#bold Врата держатся, пока я говорю. Мне бы очень хотелось знать, как долго это будет продолжаться. #!"
 ourfury.0320:0 "Ворота открываются без меня"
 ourfury.0320.desc.delivered:0 "Они пришли за мной ночью, и я отдаю им должное, потому что это означало, что им было стыдно. Четверо моих капитанов, людей, которые поклялись мне в этом зале вместе с моим отцом три дня под землей. Сначала они забрали мой меч, а потом корону, и ни один из них не посмотрел на меня, пока они это делали.\n\nОни отвезли меня в Орис-Уотерс, связанного, раздетого и с кляпом во рту, и преподнесли мне подарок, как мужчина дарит тарелку, лошадь или ключи от ворот. С тех пор я много думал о том, кого из них они имели в виду. Я определился с ключами.\n\nОрис приказал их выпороть. Он не поблагодарил их, не заплатил им и приказал освободить и укрыть меня, прежде чем он услышит хоть слово от кого-либо в этой палатке. Что бы еще ни было правдой об этом человеке, он точно знал, что было сделано, и не хотел участвовать в этом.\n\n#bold Штормовой Предел не был взят. Его продали люди, которые не могли сказать вам, что они продают.#!"
 ourfury.0320.desc.parley:0 "Я послал в [fab_ourfury_foe.GetTitledFirstName] под знаменем мира и вышел из своих ворот, чтобы встретить их, что больше, чем сделал бы мой отец и больше, чем ожидала половина моих капитанов. Веревки не было, и меня никто не нес. Что бы об этом ни написали потом, эта часть принадлежит мне.\n\nУсловия такие же, какими они всегда были. Штормовой Предел, Штормовые Земли и корона Дюррана Горя Богов — все это в руках Таргариенов. То, что я вышел стоя, ничего не дало мне за столом. Это заставило меня выйти стоя.\n\nМои капитаны испытали облегчение и изо всех сил стараются не показывать этого, и я решил не обвинять их в этом. Четыреста человек против армии, и дракон никогда не был стеной. Это было число, которое я произнес вслух, чтобы посмотреть, поможет ли это.\n\n#bold Я отдал его. Это не то же самое, что получить его, и я намерен запомнить разницу.#!"
 ourfury.0320.desc.beaten:0 "Оно завершилось, и оно завершилось на поле, а не у этих ворот, что является единственной милостью в нем. Штормовые земли опустошены. В этом королевстве не осталось ни одной дороги, по которой Таргариены не прошли бы на досуге.\n\nЯ держал Штормовой Предел. Вот и все, что я могу сказать о себе. Стены никогда не открывались, гарнизон никогда не разрушался, и все это не имело значения, потому что королевство — это не замок, и я выбежал из одного, пока был занят сохранением другого.\n\nУсловия Эйгона идут на юг с [fab_ourfury_foe.GetTitledFirstName], и они не жестокие. Им никогда не понадобится это делать. Мужчине не обязательно быть жестоким с женщиной, у которой в руках нечего взять.\n\n#bold Я удержал врата и потерял королевство. Мой отец понял бы эту арифметику и возненавидел бы ее точно так же, как и я.#!"
 ourfury.0320.a:0 "Вот и конец. Я выслушаю условия."
 ourfury.0320.desc.beaten.noorys:0 "Оно завершилось, и оно завершилось на поле, а не у этих ворот, что является единственной милостью в нем. Штормовые земли опустошены. В этом королевстве не осталось ни одной дороги, по которой Таргариены не прошли бы на досуге.\n\nЯ держал Штормовой Предел. Вот и все, что я могу сказать о себе. Стены никогда не открывались, гарнизон никогда не разрушался, и все это не имело значения, потому что королевство — это не замок, и я выбежал из одного, пока был занят сохранением другого.\n\nУсловия Эйгона приходят без человека, который должен был их принести. Мой отец позаботился об этом. Это не повлияло ни на одну строчку из них, и я никогда не думал, что так будет, но я все равно рад этому и перестал извиняться перед самим собой за то, что рад.\n\n#bold Я удержал врата и потерял королевство. Мой отец понял бы эту арифметику и возненавидел бы ее точно так же, как и я.#!"
 ourfury.0321:0 "Плащ и имя не мое"
 ourfury.0321.desc:0 "Орис Уотерс получит Штормовой Предел, а вместе с ним и я. Эйгон уладил этот вопрос так, как он решает все сейчас, то есть кратко и письменно, и в Вестеросе не осталось никого, кто мог бы сказать ему обратное.\n\nОн не то существо, которое описал мой отец. Отец выставил его пятном, ублюдком, выставил в качестве оскорбления и ответил ему коробкой. Я наблюдал за этим человеком две недели: он тихий, осторожный, некрасивый и явно чувствует себя некомфортно из-за победы. Это по-своему хуже. Было бы гораздо проще, если бы он был тем, кем мне обещали.\n\nОн скорее спросил меня, чем рассказал, чего от него ничего не требовалось, и что я заметил. Ответ в любом случае один и тот же, и мы оба это знаем. Но он спросил, и я помню, что он спросил, и однажды певцы захотят узнать, что из этих двух вещей было браком.\n\n#bold Я последний из рода Дюрранов и первый из того, что это такое. Наша ярость все еще остается. Просто полетит под другим зверем.#!"
 ourfury.0321.desc.delivered:0 "Он накинул на меня свой плащ, прежде чем вообще о чем-либо спросить, и сделал это сам, и сделал он это, стоя перед людьми, которые меня привели. Это первое, что я скажу об Орисе Уотерсе, и я решил, что буду продолжать говорить именно это, потому что оставшаяся часть вечера принадлежит мне, и я не собираюсь отдавать его певцам.\n\nПо слову Эйгона, он получит Штормовой Предел, а вместе с ним и я. Я мог бы сказать вам, что у меня не было выбора, и это было бы правдой, и это также была бы меньшая половина правды. — спросил он. Он спрашивал обо всем, что уже было сделано со мной, когда ни один человек из живых не сделал бы его, и ждал ответа, в котором он не нуждался.\n\nМой отец бы ему отказал. Мой отец отказался от него с коробкой, и эта коробка во многом является причиной того, что я стою в чужом плаще и смотрю, как мой дом заканчивается позади меня. Я много думал об этом и не уверен, что закончил.\n\n#bold Он прикрывал меня, когда мои люди этого не делали. Это тонкая вещь, на которой можно строить брак. Это больше, чем оставил мне мой отец.#!"
 ourfury.0321.desc.noorys:0 "Орис Уотерс мертв, убит моим отцом в грязи на глазах у двух армий, и брак, который Эйгон приготовил для меня, погиб там же. Не осталось ни одного ублюдка, которому можно было бы передать меня, и мне не накинут плащ.\n\nУсловия Эйгона остаются в силе. Штормовые земли принадлежат ему, корона Дюррана Божья Скорбь принадлежит ему, и я владею Штормовым Пределом по его воле, а не по праву моей крови. Чего он не сделал, так это не нашел мне другого мужа, и я не собираюсь напоминать ему, что эта мысль ему доступна.\n\nИтак, я тот Дюррандон, который сохранил кресло и потерял все, что над ним. Неженат, без обещаний и на данный момент о нем не говорят. Мой отец назвал бы это плохой сделкой. Мой отец тоже умер, и последнее, что он сделал на этой земле, — это позаботился о том, чтобы человек, которому суждено было заполучить меня, никогда этого не сделает.\n\n#bold Он ушел, и Орис ушел, а я все еще здесь. На данный момент это должно послужить.#!"
 ourfury.0321.a:0 "Дайте мне плащ. Я знаю, чего он стоит."
 ourfury.0321.b:0 "Тогда я останусь Дюррандон, что бы ещё ни потеряла."
 ourfury.0170:0 "Колено и Корона"
 ourfury.0170.desc:0 "Оно завершено, и я жив, чтобы увидеть написанные условия. Ответ Эйгона последовал после победы Ориса, формальный и почти болезненно сдержанный. Он требует моей короны и моей клятвы, но он не требует Штормового Предела, наследства Аргеллы или разрушения моего дома. Вежливость в случае поражения трудно переварить, но она оставляет человеку меньше оправданий для отказа услышать то, что ему предлагают.\n\nЯ отказываюсь от короны Дюррана Божьего Скорби и признаю Эйгона королем. Взамен я остаюсь лордом Штормового Предела, удерживающим штормовые земли от Маркей до Тарта под короной Эйгона, с доходами и правами моего дома и верностью лордов, присягнувших Дюррандонам. Аргелла остается моим бесспорным наследником.\n\nЯ спрашиваю, что стало с браком, который он когда-то предложил. Ответ Эйгона заключается в том, что Орис будет вознагражден в другом месте и что он не собирается использовать руку Аргеллы в качестве второй цены за земли, которые я уже отдал под присягой. Что бы о нем ни говорили, он не использует преимущества, выходящие за рамки тех условий, которые ему нужны.\n\nЯ Дюррандон, сложивший корону, и это имя последует за мной. Он также последует за Аргеллой в Штормовой Предел после моего ухода. На этом королевская власть заканчивается, а дом — нет. #bold Я потерял корону и сохранил наследство под ней.#!"
 ourfury.0170.a:0 "Да будет так. Штормовой Предел останется за Дюррандонами."
 ourfury.0200:0 "Нам ярость"
 ourfury.0200.desc:0 "Армия Эйгона покинула Штормовые земли. Люди, следовавшие за Орисом на юг, ушли с наших дорог, их лагеря стоят пустыми, и над маршами не кружит ни один дракон. Я не знаю, куда Эйгон повернет дальше, и у меня нет намерений сидеть в Штормовом Пределе и придумывать для него победы, которых он не одержал.\n\nВойна изменила Вестерос. Заявления Эйгона не остались без ответа в других местах, и каждый суд сделал свой собственный выбор, пока мы сражались. Они могут вести свои собственные учетные записи. Моя достаточно проста: Эйгон послал армию в Штормовые земли, и эта армия вернулась без моей короны. Какие бы знамена сейчас ни развевались за моими границами, венценосный олень все равно летает здесь.\n\nМы не восстановили мир, существовавший до того, как драконы пересекли Черноводную, и не смогли бы. Только Семеро знают, что принесут следующие вороны. На данный момент Штормовой Предел по-прежнему принадлежит мне, мои лорды по-прежнему отвечают на мой призыв, и ни один иностранный король не сдерживает моей клятвы. #bold Эйгон может называть себя победителем там, где люди склоняются к нему. В Штормовых землях он может назвать себя отверженным.#!"
 ourfury.0200.a:0 "Разошлите вести ко всем дворам — и моими собственными словами."
 ourfury.0200.desc.argella:0 "Армия Эйгона покинула Штормовые земли. Орис исчез с наших дорог, лагеря под стенами превратились в ямы, полные дождевой воды, а над маршами за месяц не было видно ни одного дракона.\n\nНа этих стенах было объявлено, что мой отец умер три дня спустя, а армия находится на полях внизу, и в этом зале были капитаны, которые вслух производили арифметику передо мной. Четыреста человек. Один дракон через залив. Девушка двадцати лет в короне мертвеца. Я вел список того, кто что сказал. Я еще не решил, для чего нужен этот список.\n\nВойна изменила Вестерос, и я не буду притворяться, что Штормовые земли изменили его в одиночку. Короли преклонили колени в других местах, заключили свои собственные сделки и должны жить в них. Мой проще, чем любой из них. Эйгон Таргариен послал армию за моей короной, и армия ушла домой без нее.\n\n#bold Они считали, что хоронят Дом Дюррандон. Они смотрели, как он переходит из рук в руки.#!"
 ourfury.0201:0 "Ответы королевских дворов"
 ourfury.0201.desc:0 "Вороны начинаются еще до того, как поле высохнет. Некоторые исходят от королей, некоторые от лордов, а некоторые от людей, которые стараются не помещать титул вверху страницы. Среди них есть поздравления, но больше вопросов. Они хотят знать, как был побежден Орис, что сталось с Мераксес, насколько сильно пострадала армия Эйгона и ожидает ли Штормовой Предел его возвращения. Люди, которые не поставили бы на меня ни копейки перед битвой, внезапно открыли для себя огромное уважение к Штормовым землям.\n\nПредложения перемежаются с вопросами. Зерно, лошади, послы, браки, корабли и обещания взаимной защиты — все это представлено мне, хотя их ценность будет полностью зависеть от того, кто еще сдержит свое слово, когда двинется следующая армия. Я ничего из этого не принимаю за дружбу. Отец может судить искренность; королю лучше судить, что на самом деле может сделать другой человек.\n\nВажно то, что каждый двор теперь понимает, что воля Эйгона — это не то же самое, что судьба. Я лучше, чем кто-либо из них, знаю, чего стоила победа и насколько нам благоприятствовала погода, но я также знаю, чьи люди выстояли в такую ​​погоду и чей меч убил Ориса Уотерса. #bold Я выслушаю каждое предложение и буду торговаться с места, которое Эйгон не смог отобрать у меня. #!"
 ourfury.0201.a:0 "Ответьте каждому двору. Пусть ждут моего слова."
 ourfury.0201.b:0 "Сперва те, у кого есть корабли. Комплиментами гарнизонов не удержать."
 ourfury.0201.desc.argella:0 "Вороны стартуют еще до того, как земля высохнет. В основном поздравления, а под ними вопросы. Они хотят знать, как была прорвана осада, что случилось с Мераксес, насколько сильно пострадал Орис и ожидает ли Штормовой Предел его возвращения. Люди, которые не поставили бы на меня ни копейки, внезапно почувствовали огромное уважение к Штормовым землям.\n\nМногие из них хотят знать, за кого я собираюсь выйти замуж. Двое предложили себя. Один сделал предложение своему сыну, которому одиннадцать лет. Я читаю эти письма медленно и не отвечаю ни на одно из них быстро, потому что королева, спешащая выйти замуж, — это королева, которая рассказала миру именно то, чего, по ее мнению, она стоит.\n\nПредложения переплетаются с вопросами. Зерно, лошади, корабли, послы, обещания взаимной защиты. Их ценность полностью зависит от того, кто еще сдержит свое слово, когда двинется следующая армия, и недавно я закончил узнавать, сколько именно людей держат свое слово перед драконом в заливе.\n\n#bold Выслушаю каждое предложение. Я буду торговаться с места, которое Эйгон не мог занять, а мои капитаны не могли продать.#!"
 ourfury.0202:0 "Повелители Драконов остаются"
 ourfury.0202.desc:0 "В Штормовой Предел продолжают поступать сообщения от торговцев, капитанов и людей, которым платят за прослушивание в портах, где известны корабли Эйгона. Они мало в чем сходятся, за исключением того, что поражение в Штормовых землях не положило конец его амбициям. Хороший. Я бы меньше думал о нем, если бы из-за одного окровавленного носа он навсегда скрылся на Драконьем камне, хотя от этого я бы лучше спал.\n\nКакие бы земли сейчас ни принадлежали Эйгону, какие бы драконы ни оставались в его доме и какие бы войны ни занимали его где-либо еще, ни одно из них не делает Штормовой Предел безопасным. Он может вернуться сам, послать другого командира, дождаться моей смерти или прошептать условия лордам, которые недовольны ценой, которую я заставил их заплатить. Только дурак готовится к врагу, которого хотел бы иметь, и как бы еще мои враги ни называли меня, они еще не доказали, что я дурак.\n\nЯ не буду удерживать Штормовой Предел вечно. Аргелла унаследует после меня, а ее наследники после нее. То, что я им оставляю, должно быть сильнее тех обстоятельств, которые благоприятствовали мне на одном затопленном поле. Форты, корабли, союзы, разведчики и мир там, где мир можно купить, послужат им лучше, чем молитвы о той же буре. Семь дали людям не только молитвы, но и руки, и я собираюсь использовать и то, и другое. #bold Эйгон может прийти снова. В следующий раз я имею в виду, что Штормовые земли должны быть готовы до того, как соберутся облака.#!"
 ourfury.0202.a:0 "Укрепите побережье. Следующего дракона мы встретим во всеоружии."
 ourfury.0202.b:0 "Отправьте посланника. Даже Эйгон поймёт выгоду мира."
 ourfury.0202.desc.argella:0 "Сообщения от торговцев, капитанов и людей, которым платят за то, чтобы слоняться в портах, куда заходят корабли Эйгона, продолжают поступать. Они почти ни в чем не сходятся, за исключением того, что одна неудача в Штормовых землях не положила конец его амбициям. Если бы это было так, я бы меньше думал о нем, хотя спал бы гораздо лучше.\n\nОн может прийти сам. Он может послать другого командира. Он может просто ждать, что ему ничего не стоит, а мне — каждый год, который я провожу в ожидании. Или он может сделать самую дешевую вещь и прошептать условия повелителям штормов, которые уже поняли, чего для них стоит моя корона, находясь под давлением. Я знаю, кого бы я выбрал на его месте.\n\nИтак, стены поднимаются выше, за берегом наблюдают, люди, удерживавшие эти ворота, получают землю, а людей, которые говорили об их открытии, вспоминают. У меня нет ни мужа, ни наследников, и у меня много времени, чтобы тщательно обзавестись и тем, и другим. То, что я оставлю после себя, должно быть сильнее, чем одно снятие осады и сезон ненастной погоды.\n\n#bold Эйгон может прийти снова. Я имею в виду, что в следующий раз Штормовые земли будут ждать, пока не соберутся облака. #!"
 ourfury.0210:0 "Зачем останавливаться здесь?"
 ourfury.0210.desc:0 "Вороны перестали приносить мне плохие новости, и это чувство более странное, чем я ожидал. Эйгон Таргариен пришел на юг с тремя драконами и всеми королевствами, которые он уже проглотил, и вернулся домой без моей короны. Люди, которые целый год объясняли мне, почему Штормовые земли невозможно удержать, теперь объясняют посетителям, как мы их удерживали.\n\nВот я и сижу с мыслью, вид которой мне не очень нравится, и она не уходит. Каждый аргумент в пользу того, почему мне следовало преклонить колени, был аргументом о драконах. Драконов сейчас меньше, чем было, а те, что остались, научились осторожно относиться к моей стране. Если то, что сделало Эйгона неизбежным, больше не является неизбежным, то что же такое Трезубец? Что такое Хайгарден? Что такое Солнечное Копье?\n\nЭто старые короны, которые носили люди, которые наблюдали, как буря сломила победителя, и ничего не сделали, потому что им ничего не стоило подождать и посмотреть, выживу ли я. Ни одного ворона поддержки. Ни одного копья. Через год они запомнят это по-другому, и я тоже.\n\nМои лорды не сказали этого вслух, но начали говорить все, что было до этого. Сбор еще продолжается. Люди, победившие Ориса, все еще находятся в поле и все еще накормлены. Лучшего момента не будет никогда, и меня никогда в жизни не обвиняли в терпении.\n\n#bold Я сломал дракона. Теперь остальные смогут объяснить, почему им не следует преклонять колени перед бурей. #!"
 ourfury.0210.a:0 "Подготовьте притязания. Трезубец, Простор и Дорн."
 ourfury.0210.b:0 "Мейстеры пусть запишут. А я выберу подходящий момент."
