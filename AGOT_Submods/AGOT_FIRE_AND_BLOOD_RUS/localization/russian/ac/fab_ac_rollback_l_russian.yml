l_russian:
 fab_ac_rollback.0001:0 "Завоевание отменено"
 fab_ac_rollback.0001.desc:0 "Эйгона Таргариена будут помнить не как основателя королевства, а как повелителя драконов, чьи амбиции превзошли его силы. Его поражение преподносит Дому Таргариена горький урок: драконы внушают ужас, но сам по себе террор не может гарантировать господство."
 fab_ac_rollback.0001.option1:0 "Царство, которого никогда не будет."
 fab_ac_rollback.0002:0 "Мечта о завоевании заканчивается"
 fab_ac_rollback.0002.desc:0 "Попытка создать одно царство из семи провалилась. Имя Эйгона сохранится как предупреждение последующим Таргариенам о том, что кровь и драконы не могут спасти любые безрассудные амбиции. Вестерос остается разделенным, а нарисованная таблица изображает будущее, которое так и не наступило."
 fab_ac_rollback.0002.option1:0 "Мечта умирает вместе с войной."
 fab_ac_rollback.0003:0 "Две древние короны сломаны"
 fab_ac_rollback.0003.desc.loren:0 "Вороны прибывают к Утесу Кастерли черной процессией. Харрен Хоар побежден, его обширное речное королевство вырвано из хватки железнорожденных. Аргилак Дюррандон тоже пал, и штормовой короны, которую носили со времен Дюррана Божья скорбь, больше нет.\n\nЭто были не слабые короли, правившие скудными землями. Харрен доверял самым прочным стенам, когда-либо построенным; Аргилак всю жизнь доказывал свои способности в боях. Эйгон Таргариен сломал их обоих еще до конца года. То, что началось как невозможное хвастовство иностранного лорда, теперь продвигается на запад как завоевание.\n\nСкала остается, и Хайгарден остается. Если лев и зеленая рука хотят остановить дракона, мы должны сделать то, чего не смогли сделать олень и черная корона: вместе встретить огонь, со всей силой двух королевств."
 fab_ac_rollback.0003.desc.mern:0 "Новости читаются вслух под зелеными арками Хайгардена. Речное королевство Харрена Хоара было разрушено, и Аргилак Дюррандон пал; две королевские линии, правившие до того, как андалы пересекли Узкое море, были свергнуты в течение одного сезона кампании.\n\nХаррен верил, что никакой огонь не сможет справиться с камнем. Аргилак считал, что ни один молодой завоеватель не сможет его одолеть. Их неудачи ясно излагают урок: нельзя позволить Эйгону выбрать землю, изолировать другую корону и направить всех трех драконов против одного королевства одновременно. В Просторе больше людей, чем в любом живом королевстве, но их количество, разбросанное по замкам, сожжет замок за замком.\n\nТолько Скала может добавить достаточно силы, чтобы обеспечить уверенность в преимуществе. Я должен объединить Лорен Ланнистер, собрать оба королевства на одном поле и заставить дракона сразиться с большим количеством людей, чем смогут убить даже три зверя."
 fab_ac_rollback.0003.desc:0 "Харрен Хоар и Аргилак Дюррандон терпят поражение. Королевства рек и штормов пали перед Эйгоном Таргариеном, и две древние короны исчезли за один сезон.\n\nСтены Харренхола и доблесть Аргилака оказались беспомощными против драконов. То, что началось как дерзкое заявление повелителя Узкого моря, превратилось в завоевание Вестероса. Каждое королевство, все еще свободное, теперь должно решить, оставаться ли ему в одиночку, искать союзников или сдаться, прежде чем огонь достигнет его границ."
 fab_ac_rollback.0003.option.loren:0 "Отправить в Хайгарден. Лев не будет противостоять дракону в одиночку."
 fab_ac_rollback.0003.option.mern:0 "Созвать Простор. Затем отправить ворона на Скалу."
 fab_ac_rollback.0003.option1:0 "Война изменилась. Мы должны подготовиться."
 fab_ac_rollback.0004:0 "Лев и Рука повержены"
 fab_ac_rollback.0004.desc:0 "Объединенная сила Дома Ланнистеров и Дома Гарденеров была подорвана. Самые богатые королевства Вестероса собрали армию, не имеющую себе равных, только для того, чтобы увидеть, как она разбита под натиском драконов. \n \nЕсли Эйгон сможет уничтожить такую ​​армию, каждая оставшаяся корона должна задаться вопросом, кто еще сможет его остановить."
 fab_ac_rollback.0004.option1:0 "Баланс Вестероса нарушен."
 fab_ac_rollback.0005:0 "Коронация Эйгона I Таргариена"
 fab_ac_rollback.0005.desc:0 "Под хрустальным куполом Звездной септы Староместа Верховный септон помазал Эйгона Таргариена семью маслами и возложил на его голову корону. Перед собравшимися лордами и верующими он провозгласил его #bold Эйгоном из Дома Таргариенов, Первым Его имени, Королем Андалов, Ройнаров и Первых Людей, Лордом Семи Королевств и Защитником Царства.#!\n\nВисенья однажды уже короновала Эйгона у Черноводной, свидетелем чего была лишь небольшая компания. Здесь за обрядом наблюдали сотни людей, в том числе мейстеры и архимейстеры Цитадели; впоследствии десятки тысяч людей заполнили улицы Староместа, когда новый король проехал по городу на Балерионе. Именно эту вторую коронацию история запомнит как начало его правления.\n\nС помощью стали, пламени и силы своих сестер Эйгон объединил королевства Вестероса в единое царство. Теперь сама Вера благословила то, что выиграли драконы."
 fab_ac_rollback.0005.option1:0 "Одно царство теперь стоит под короной дракона."
