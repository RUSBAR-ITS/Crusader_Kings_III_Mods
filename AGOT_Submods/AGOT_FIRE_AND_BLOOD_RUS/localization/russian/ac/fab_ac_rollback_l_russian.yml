l_russian:
 fab_ac_rollback.0001:0 "Крах Завоевания"
 fab_ac_rollback.0001.desc:0 "Эйгона Таргариена запомнят не основателем державы, а драконьим владыкой, чьё честолюбие превзошло его силы. Поражение стало горьким уроком для его дома: драконы внушают ужас, но одного ужаса для власти недостаточно."
 fab_ac_rollback.0001.option1:0 "Королевство, которому не быть."
 fab_ac_rollback.0002:0 "Конец мечты о завоевании"
 fab_ac_rollback.0002.desc:0 "Попытка выковать одну державу из семи провалилась. Имя Эйгона станет предостережением будущим Таргариенам: кровь и драконы не спасут всякий безрассудный замысел. Вестерос остаётся разделённым, а Расписной стол изображает будущее, которое так и не настало."
 fab_ac_rollback.0002.option1:0 "Мечта умирает вместе с войной."
 fab_ac_rollback.0003:0 "Две древние короны сломаны"
 fab_ac_rollback.0003.desc.loren:0 "Чёрной вереницей прилетают вороны к Утёсу Кастерли. Харрен Хоар побеждён, его обширное речное королевство вырвано из хватки железнорождённых. Аргилак Дюррандон тоже пал. Нет больше короны Бури, которую носили со времён Дюррана Богоборца.\n\nОни не были слабыми королями скудных земель. Харрен полагался на крепчайшие стены, когда-либо возведённые людьми; Аргилак всю жизнь доказывал доблесть в бою. Эйгон Таргариен сломил обоих ещё до конца года. Невероятное хвастовство чужеземного лорда стало завоеванием, идущим на запад.\n\nСкала ещё стоит, и Хайгарден тоже. Чтобы остановить дракона, льву и зелёной руке придётся сделать то, чего не смогли олень и чёрная корона: вместе встретить пламя всей мощью двух королевств."
 fab_ac_rollback.0003.desc.mern:0 "Под зелёными сводами Хайгардена вслух читают вести. Речное королевство Харрена Хоара разбито, Аргилак Дюррандон пал. Два королевских рода, правивших ещё до перехода андалов через Узкое море, сметены за один военный сезон.\n\nХаррен верил, что огонь не одолеет камень. Аргилак — что юный завоеватель не одолеет его самого. Их поражения дают ясный урок: нельзя позволить Эйгону выбирать место битвы, отрезать очередного короля от союзников и бросать всех трёх драконов на королевства по одному. Простор выставит больше воинов, чем любая другая держава, но, рассеянные по замкам, они будут сгорать замок за замком.\n\nЛишь Скала даст достаточно сил для решающего перевеса. Нужно заключить союз с Лореном Ланнистером, собрать оба войска на одном поле и поставить против дракона столько людей, сколько не смогут убить даже три чудовища."
 fab_ac_rollback.0003.desc:0 "Харрен Хоар и Аргилак Дюррандон побеждены. Королевства рек и бури пали перед Эйгоном Таргариеном. За один сезон исчезли две древние короны.\n\nСтены Харренхола и доблесть Аргилака оказались бессильны перед драконами. Дерзкое притязание лорда с Узкого моря превратилось в завоевание Вестероса. Каждой ещё свободной державе пора решить: стоять в одиночку, искать союзников или покориться прежде, чем огонь достигнет её границ."
 fab_ac_rollback.0003.option.loren:0 "Пошлите весть в Хайгарден. Лев не встретит дракона в одиночку."
 fab_ac_rollback.0003.option.mern:0 "Созвать Простор. Затем отправить ворона на Скалу."
 fab_ac_rollback.0003.option1:0 "Война изменилась. Мы должны подготовиться."
 fab_ac_rollback.0004:0 "Лев и Рука повержены"
 fab_ac_rollback.0004.desc:0 "Объединённые силы Ланнистеров и Гарденеров сокрушены. Богатейшие королевства Вестероса собрали несравненное войско — и увидели, как драконы его разбили. \n \nЕсли Эйгон способен уничтожить такую армию, всем ещё правящим королям остаётся спросить: кто теперь его остановит?"
 fab_ac_rollback.0004.option1:0 "Равновесие сил в Вестеросе нарушено."
 fab_ac_rollback.0005:0 "Коронация Эйгона I Таргариена"
 fab_ac_rollback.0005.desc:0 "Под хрустальным куполом Звёздной септы Староместа верховный септон помазал Эйгона Таргариена семью елеями и возложил на него корону. Перед собравшимися лордами и верующими он провозгласил его #bold Эйгоном из дома Таргариенов, Первым этого имени, королём андалов, ройнаров и Первых людей, владыкой Семи Королевств и защитником государства.#!\n\nВисенья уже короновала Эйгона у Черноводной при немногих свидетелях. Здесь обряд видели сотни, в том числе мейстеры и архимейстеры Цитадели. После десятки тысяч заполнили улицы Староместа, по которым новый король проехал на Балерионе. Именно эту вторую коронацию летописи запомнят как начало его правления.\n\nСталью, пламенем и силой сестёр Эйгон выковал из королевств Вестероса одну державу. Теперь сама Вера благословила завоёванное драконами."
 fab_ac_rollback.0005.option1:0 "Единая держава под короной дракона."
