l_russian:
 fab_ac_iron_islands.0001:0 "Кровавое вече"
 fab_ac_iron_islands.0001.desc:0 "Пока Семь Королевств пируют королевским миром, Железные острова пожирают сами себя.\n\nКогда Харрен и его род сгорели, железнорожденные на зеленых землях попытались вернуться домой — и речные жители, которых они бичевали на протяжении трех поколений, нападали на них на каждой дороге и в устье реки, так что немногие из них когда-либо снова видели море. На самих островах хаос венчал дюжину голов. Куорин Волмарк, лорд Харлоу, чья бабушка приходилась сестрой Харвину Жесткорукому, объявил себя законным наследником и королем Харрена. Жрецы Утонувшего Бога не захотели его принять: в Старом Вике они наложили корону из коряги на Лодоса, босоногого святого человека, называющего себя сыном Утонувшего Бога. Еще больше королей появились на Большом Вике, на Оркмонте и на Пайке.\n\nУже больше года они убивают друг друга на островах и по всему Закатному морю. Король Оркмонта уже убит. Торговцы рассказывают о затонувших кораблях и приливах, заваленных трупами, и клянутся, что сотни кракенов восстали, чтобы полакомиться мертвецами.\n\n#bold Я не сломал восемь королей, чтобы пострадать еще дюжину. Сейчас начинается последняя война Завоевания — и флоты Ланниспорта и Хайгардена, Арбора и Медвежьего острова плывут вместе с драконом.#!"
 fab_ac_iron_islands.0001.option1:0 "Одно королевство. Один король. И на островах тоже."
 fab_ac_iron_islands.0002:0 "Зов Кракенов"
 fab_ac_iron_islands.0002.desc:0 "Вести приходят с флотов, и это самое странное сообщение из всех войн, в которых я участвовал.\n\nКогда паруса Ланниспорта и Хайгардена, Арбора и Медвежьего острова затмили западное море, король-жрец Лодос собрал своих верных на берегу Старого Вика и призвал своего отца, Утонувшего Бога, сломить захватчиков. Он протянул руки, пишут мои капитаны, и приказал кракенам глубин подняться и утащить все корабли зеленых земель вниз в затопленные залы.\n\nВерующие смотрели на воду. Море катилось, светилось и ничего не делало. Ни один кракен не поднялся; ни один корпус даже не поцарапал киль. Флоты шли по спокойному морю и попутному ветру, а сын бога, мокрый от воды, молча стоял на берегу.\n\n#bold Балерион, по крайней мере, отвечает, когда я звоню. Мы стремимся к Большому Вику.#!"
 fab_ac_iron_islands.0002.option1:0 "Глубины хранят свои тайны."
 fab_ac_iron_islands.0003:0 "Старый путь королей"
 fab_ac_iron_islands.0003.desc:0 "Великий Вик принадлежит нам, и острова разрушаются — и теперь Куорин Волмарк вышел, чтобы положить конец этой войне единственным способом, который когда-либо знали его отцы.\n\nСамокоронованный король железнорожденных высадился со своими домашними топорами и бросил вызов моему лагерю: Старый Путь, король против короля, клинок против клинка, перед обеими армиями. Он не дурак: с каждым приливом его дело все больше тонет, и мертвый дракон — единственное, что может его поднять на воду. И он тоже не слабак: суровый человек старой крови Жесткорукого с топором, который хорошо кормил Утонувшего Бога в прошлом году.\n\nУстав от боевых действий, половина островов уже требует мира; другая половина ждет только того, чтобы посмотреть, осмелится ли дракон. Я пересек Закатное море не для того, чтобы ответить на вызов железного человека стеной щитов.\n\n#bold Чёрное Пламя ничего не пил со времен Огненного поля. Железнорожденный увидит, что ответит король.#!"
 fab_ac_iron_islands.0003.option1:0 "#S Я принимаю. Чёрное Пламя и я. #!"
 fab_ac_iron_islands.0005:0 "Долг Чёрного Пламени"
 fab_ac_iron_islands.0005.desc:0 "Это было сделано перед обеими армиями, на берегу Большого Вика, по старинному обычаю, который железнорожденные считают более святым, чем любой септ или септон.\n\nКорин Волмарк напал на меня так же, как его отцы наступали на мир: рев, размахивая топором, уверенный, что бездна была с ним. Несмотря на всю свою массу, он был силен и быстр, и на несколько ударов железнорожденный осмелился надеяться. Затем Чёрное Пламя повернул рукоятку топора и повернул ее еще раз, и третий удар раскрыл его от плеча до грудины. Валирийская сталь не ведет счетов и не дает секундантов. Последний король крови Харвина Жесткорукого умер на песке, а его корона катилась по прибою.\n\nИ железнорожденные — эти железнорождённые, терроризировавшие все побережья Вестероса с незапамятных времен — посмотрели на своего мертвого короля и преклонили колени. Претенденты на Большом Вике и Пайке перед наступлением темноты преклонили колени, соревнуясь друг с другом за право быть первыми. Однако на бумаге эта война затянулась, но закончилась она на этом пляже.\n\n#bold Они хотели старого пути. Они получили это.#!"
 fab_ac_iron_islands.0005.option1:0 "Старый путь окончен. Как и его короли."
 fab_ac_iron_islands.0006:0 "Отброшенный назад"
 fab_ac_iron_islands.0006.desc:0 "Напишу прямо, раз певцы этого не сделают: Куорен Волмарк одолел меня.\n\nМы встретились на берегу Большого Вика перед обоими войсками, по Старому Пути, и секира железнорождённого оказалась столь же грозной, как обещала его слава. Дважды он отвёл Чёрное Пламя, третьим ударом заставил меня пошатнуться, и лишь проворство моей стражи — и, признаю, моих собственных ног — позволило мне живым вернуться в свой строй. Железнорождённые так громко выкрикивали имя своего бога, что им вторили скалы.\n\nНо поединок — это поединок, а война — это война. Его секира не потопит мои флоты, не накормит голодающие острова и не вернёт год кровопролития, принёсший ему корону из плавника. Блокада держится, осады продолжаются, и дракон не обязан дважды проявлять благородство.\n\n#bold Старый Путь принёс победу на берегу. Новый путь принесёт победу на островах.#!"
 fab_ac_iron_islands.0006.option1:0 "Дуэль — это не война."
 fab_ac_iron_islands.0007:0 "Совет с Утонувшим Богом"
 fab_ac_iron_islands.0007.desc:0 "Король-жрец Лодос ответил за своих молчаливых кракенов.\n\nКогда весть о повороте войны достигла Старого Вика, сын Утонувшего Бога не бежал, не лечил и не сражался. Он спустился к берегу, где однажды призвал кракенов, набил свою одежду камнями и сказал своим верным, что идет вниз, чтобы посоветоваться со своим отцом. Затем он вошел в море и продолжал идти, пока вода не сомкнулась над его головой.\n\nТысячи его последователей сделали то же самое. В течение нескольких дней приливы переносили утонувших обратно на берега Старого Вика, и мейстеры говорят, что их будет выбрасывать на берег еще долгие годы. Тела самого Лодоса не нашли — и я подозреваю, что никогда не найдет. Уже невежественные шепчут, что он сидит по правую руку отца и вернется.\n\n#bold Он может хранить свой совет в затопленных залах. Острова над водой — мои.#!"
 fab_ac_iron_islands.0007.option1:0 "То, что мертво, может остаться мертвым."
 fab_ac_iron_islands.0008:0 "Судьба островов"
 fab_ac_iron_islands.0008.desc:0 "Война островов окончена. Последние претенденты преклонили колени на песках Пайка и Большого Вика; кроны коряг — это пепел или океанское дно; и железнорожденные навсегда отказались от всех претензий, которые их короли когда-то предъявляли к речным землям. Острова и реки Харвина Харвина Харвина разрушены навсегда.\n\nНо самими островами необходимо управлять, и в этом мои советники расходятся во мнениях. Некоторые готовы натравить на них льва: Утёс Кастерли близок, богат и нетерпелив, а железнорожденные уже боятся флота Ланниспорта. Некоторые отдали бы их волку: у Севера в крови соленая вода, и у него есть свои десятки, чтобы расплатиться с разбойниками. А некоторые советуют более странный курс: я позволю железнорожденным выбирать своего господина, как они выбирали своих королей в древности. Уставшие от крови, они скорее преклонят колени перед своим, чем перед каким-либо хозяином зеленых земель; и лорд, обязанный своим возвышением моему терпению, избранный своим народом, дважды связан со мной.\n\n#bold Огонь и кровь завоевали острова. Теперь мудрость должна сохранить их.#!"
 fab_ac_iron_islands.0008.option1:0 "Железнорождённые сами выберут своего лорда."
 fab_ac_iron_islands.0008.option2:0 "Лев будет держать поводок кракена."
 fab_ac_iron_islands.0008.option3:0 "Волк будет наблюдать за западным морем."
 fab_ac_iron_islands.0011:0 "Черный король не преклонит колени"
 fab_ac_iron_islands.0011.desc:0 "Королевский мир распространяется на Семь Королевств — по крайней мере, на шесть из них. За Закатным морем, на своих мокрых и обдуваемых ветром скалах, последний из Дома Хоаров все еще носит корону из коряг и называет себя королем.\n\nЯ оставил ему острова, когда пал Трезубец, и теперь признаю, что милосердие было ошибкой. Кровь Харрена никогда не успокоится под драконом, которого она не боится. С Пайка его вороны улетают, называя своего хозяина королем Железных островов, как будто башни Харренхола вообще никогда не стояли; его корабли снова начали беспокоить западное побережье, проверяя, есть ли у мира зубы. Речные лорды, пролившие кровь при трёх поколениях Хоаров, присылают мне письма с просьбой завершить работу.\n\nЭто будет закончено. Ни одно королевство не может терпеть короля в своем западном море, и я не разрушил королевство Черного Харрена, чтобы оставить его дому корону, над которой он будет размышлять.\n\n#bold Последняя война Завоевания начинается сейчас — и флоты Ланниспорта и Хайгардена, Арбора и Медвежьего острова плывут вместе с драконом.#!"
 fab_ac_iron_islands.0011.option1:0 "Одно королевство. Один король. И на островах тоже."
 fab_ac_iron_islands.0012:0 "Сбор Железного Флота"
 fab_ac_iron_islands.0012.desc:0 "Черный король призвал свои знамена, и, к моему удивлению, многие откликнулись.\n\nКем бы ни были Хоары, они не те чужаки на этих островах, которыми мог бы быть Корин Волмарк или какой-нибудь вскочивый священник. Дом Харрена правил железнорожденными на протяжении четырех поколений, и разбойники знают это имя, если им мало что нравится. Из Старого Вика и Большого Вика, из Оркмонта, Блэктайда и Солтклиффа к Пайку приходят длинные корабли — капитаны, которые никогда не преклонят колени перед завоевателем зеленых земель и будут рады, что за черного короля стоит умереть. Они собираются сражаться со мной по-старому: корабль против корабля, топор против меча, абордаж через прибой.\n\nМои капитаны считают свои паруса, и им не нравится это число. Каждый из этих корпусов горит так же, как и любой другой, и железнорожденные никогда за свою долгую пиратскую историю не сталкивались с тем, что ждет над их мачтами.\n\n#bold Они не разучились хорошо умирать. Я хочу напомнить им, насколько тщательно.#!"
 fab_ac_iron_islands.0012.option1:0 "Пусть они приходят. Небо принадлежит мне."
 fab_ac_iron_islands.0013:0 "Старый путь королей"
 fab_ac_iron_islands.0013.desc:0 "Война обернулась против островов — и теперь черный король вышел, чтобы положить ей конец единственным способом, который когда-либо знал его дом.\n\nОн приземлился со своими домашними топорами и бросил вызов моему лагерю: Старый Путь, король против короля, клинок против клинка, перед обеими армиями. Он не дурак: с каждым приливом его дело опускается все ниже, и мертвый дракон — единственное, что может его поднять. И он тоже не слабак: суровый человек старой железной крови, выросший с колыбели с уверенностью, что Хоар никому не поклоняется.\n\nПоловина островов устала от крови и шепчет о мире; другая половина ждет только того, чтобы посмотреть, осмелится ли дракон. Я плыл по Закатному морю не для того, чтобы ответить на вызов железного человека из-за стены щитов.\n\n#bold Чёрное Пламя ничего не пил со времен Огненного поля. Последний черный король увидит, как ответит дракон.#!"
 fab_ac_iron_islands.0013.option1:0 "#S Я принимаю. Чёрное Пламя и я. #!"
 fab_ac_iron_islands.0013.desc.champion:0 "Война обернулась против островов — и теперь острова решили положить ей конец единственным способом, который когда-либо знали их короли.\n\nНо коряга-корона сидит на РЕБЕНКЕ. Кем бы еще ни были железнорожденные, они не пошлют мальчика против дракона; Старый Путь требует чемпиона, и они нашли его — самый твердый меч, оставшийся на этих мокрых камнях, взрослого человека старой железной крови, который поклялся стоять за своего маленького короля перед обеими армиями. Вызов все равно пришел в мой лагерь: клинок против клинка, на берегу, корона мальчика сидит на руке его чемпиона.\n\nПоловина островов устала от крови и шепчет о мире; другая половина ждет только того, чтобы посмотреть, осмелится ли дракон. Я плыл по Закатному морю не для того, чтобы ответить на вызов железного человека из-за стены щитов.\n\n#bold Чёрное Пламя ничего не пил со времен Огненного поля. Чемпион мальчика-короля увидит, как ответит дракон.#!"
 fab_ac_iron_islands.0015.desc.champion:0 "Это было сделано перед обеими армиями, на берегу, по старинному обычаю, который железнорожденные считают более святым, чем любой септ.\n\nЗащитник мальчика-короля напал на меня, как железнорожденные приходили в мир с самого начала дней: без сомнения, без пощады, некоторые Утонувший бог ехал на его плече. Он был силен, и на несколько ударов железнорожденный осмелился зарычать. Затем Чёрное Пламя отвернул свой клинок и повернул его снова, и третий обмен оставил чемпиона на песке, а дело мальчика истекло кровью вместе с ним. Валирийская сталь не ведет счетов и не дает секундантов.\n\nИ железнорожденные, терроризировавшие все побережья Вестероса с незапамятных времен, посмотрели на своего павшего чемпиона и плачущего мальчика-короля и преклонили колени. Ребенок потеряет корону, а не голову; Я не воюю с детьми. Что бы ни осталось от этой войны на бумаге, она закончилась на этом пляже.\n\n#bold Дом Хоар носил корону на протяжении четырех поколений. Он больше не будет носить ничего.#!"
 fab_ac_iron_islands.0015:0 "Последний из черных королей"
 fab_ac_iron_islands.0015.desc:0 "Это было сделано перед обеими армиями, на берегу, по старинному обычаю, который железнорожденные считают более святым, чем любой септ.\n\nЧерный король напал на меня, как его дом нападал на мир на протяжении четырех поколений: без сомнения, без пощады, некий Утонувший бог ехал на его плече. Он был сильным и быстрым, чем обещал его размер, и на несколько ударов железнорожденный осмелился зарычать. Затем Чёрное Пламя отвернул свой клинок и повернул его снова, и третий обмен закончил линию Харвина Жесткорукого на песке. Валирийская сталь не ведет счетов и не дает секундантов. Его коряга скатилась в прибой и была унесена на глубину, о которой он молился.\n\nИ железнорожденные, терроризировавшие все побережья Вестероса с незапамятных времен, взглянули на своего мертвого короля, последнего из черной линии, и преклонили колени. Что бы ни осталось от этой войны на бумаге, она закончилась на этом пляже.\n\n#bold Дом Хоар носил корону на протяжении четырех поколений. Он больше не будет носить ничего.#!"
 fab_ac_iron_islands.0015.option1:0 "Род Чёрного короля пресёкся."
 fab_ac_iron_islands.0016.desc.champion:0 "Напишу прямо, раз певцы этого не сделают: защитник мальчика-короля одолел меня.\n\nМы встретились на берегу перед обоими войсками, по Старому Пути, и рука железнорождённого оказалась столь грозной, что островитянам оставалось только благодарить богов. Он отвёл Чёрное Пламя, заставил меня пошатнуться, и лишь проворство моей стражи — и, признаю, моих собственных ног — позволило мне живым вернуться в свой строй. Железнорождённые так громко выкрикивали имя Утонувшего Бога, что им вторили скалы, а ребёнок на троне из плавника сегодня стал в их глазах вдвойне королём.\n\nНо поединок — это поединок, а война — это война. Секира одного защитника не потопит мои флоты, не накормит эти голодные скалы и не вернёт силы, которые дом Хоаров потратил за долгие годы владычества над Трезубцем. Блокада держится, осады продолжаются, и дракон не обязан дважды проявлять благородство.\n\n#bold Старый Путь принёс победу на берегу. Новый путь принесёт победу на островах.#!"
 fab_ac_iron_islands.0016:0 "Отброшенный назад"
 fab_ac_iron_islands.0016.desc:0 "Напишу прямо, раз певцы этого не сделают: чёрный король одолел меня.\n\nМы встретились на берегу перед обоими войсками, по Старому Пути, и рука железнорождённого оказалась столь же грозной, как обещала слава его дома. Он отвёл Чёрное Пламя, заставил меня пошатнуться, и лишь проворство моей стражи — и, признаю, моих собственных ног — позволило мне живым вернуться в свой строй. Железнорождённые так громко выкрикивали имя Утонувшего Бога, что им вторили скалы.\n\nНо поединок — это поединок, а война — это война. Его секира не потопит мои флоты, не накормит голодающие скалы и не вернёт силы, которые его дом потратил за долгие годы владычества над Трезубцем. Блокада держится, осады продолжаются, и дракон не обязан дважды проявлять благородство.\n\n#bold Старый Путь принёс победу на берегу. Новый путь принесёт победу на островах.#!"
 fab_ac_iron_islands.0016.option1:0 "Дуэль — это не война."
