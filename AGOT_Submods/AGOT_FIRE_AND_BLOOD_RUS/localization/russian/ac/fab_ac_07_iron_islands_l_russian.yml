 fab_ac_iron_islands.0001:0 "Кровавое вече"
 fab_ac_iron_islands.0001.desc:0 "Пока Семь Королевств наслаждаются королевским миром, Железные острова пожирают сами себя.\n\nКогда Харрен и его род сгорели, железнорождённые на зелёных землях попытались вернуться домой. Но речные жители, которых они терзали три поколения, нападали на них на каждой дороге и в каждом устье. Немногим удалось вновь увидеть море. На самих островах смута породила с десяток королей. Куорен Волмарк, лорд с Харлоу, чья бабка была сестрой Харвина Жесткорукого, объявил себя законным наследником Харрена и королём. Жрецы Утонувшего Бога его не признали: на Старом Вике они возложили корону из плавника на Лодоса, босоногого святого, называющего себя сыном Утонувшего Бога. Новые короли появились и на Большом Вике, и на Оркмонте, и на Пайке.\n\nУже больше года они режут друг друга на островах и в Закатном море. Король Оркмонта уже убит. Торговцы рассказывают об обломках кораблей и волнах, забитых трупами. Они клянутся, что сотни кракенов поднялись из глубин, чтобы пожрать мертвецов.\n\n#bold Не для того я сокрушил восемь королей, чтобы терпеть ещё дюжину. Начинается последняя война Завоевания. Флоты Ланниспорта и Хайгардена, Арбора и Медвежьего острова идут под знаменем дракона.#!"
 fab_ac_iron_islands.0001.option1:0 "Одно королевство. Один король. И на островах тоже."
 fab_ac_iron_islands.0002:0 "Призыв кракенов"
 fab_ac_iron_islands.0002.desc:0 "С флота пришло самое странное донесение за все мои войны.\n\nКогда паруса Ланниспорта и Хайгардена, Арбора и Медвежьего острова затмили западное море, король-жрец Лодос собрал верных на берегу Старого Вика. Он призвал своего отца, Утонувшего Бога, сокрушить захватчиков. Мои капитаны пишут, что он раскинул руки и велел кракенам подняться из бездны и утащить все корабли зелёных земель в подводные чертоги.\n\nВерующие смотрели на воду. Море волновалось, блестело — и больше ничего не происходило. Не появился ни один кракен, ни один киль даже не оцарапало. Флот шёл по спокойному морю с попутным ветром, а промокший сын бога молча стоял на берегу.\n\n#bold Балерион хотя бы отзывается, когда я зову. Продолжаем путь к Большому Вику.#!"
 fab_ac_iron_islands.0002.option1:0 "Глубины хранят свои тайны."
 fab_ac_iron_islands.0003:0 "Старый путь королей"
 fab_ac_iron_islands.0003.desc:0 "Большой Вик наш, сопротивление островов рушится. И теперь Куорен Волмарк явился закончить эту войну единственным способом, известным его предкам.\n\nСамозваный король железнорождённых высадился со своей дружиной и прислал в мой лагерь вызов: по Старому Пути, король против короля, клинок против клинка, на глазах у обоих войск. Он не глуп: с каждым приливом надежда на победу всё глубже уходит под воду. Спасти её может лишь мёртвый дракон. И он не слабак: суровый потомок Жесткорукого, чей топор за последний год вдоволь накормил Утонувшего Бога.\n\nПоловина островов устала от войны и уже шепчется о мире. Другая ждёт лишь одного: хватит ли дракону смелости? Не для того я пересёк Закатное море, чтобы отвечать на вызов железнорождённого из-за стены щитов.\n\n#bold Со времён Пламенного поля Чёрное Пламя не пило крови. Железнорождённые увидят, как отвечает король.#!"
 fab_ac_iron_islands.0003.option1:0 "#S Я принимаю. Чёрное Пламя и я. #!"
 fab_ac_iron_islands.0005:0 "Дань Чёрному Пламени"
 fab_ac_iron_islands.0005.desc:0 "Всё произошло перед обоими войсками, на берегу Большого Вика, по древнему обычаю, который железнорождённые чтут больше любой септы и любого септона.\n\nКуорен Волмарк бросился на меня, как его предки бросались на весь мир: с рёвом, размахивая топором, уверенный, что бездна на его стороне. Он был силён и на удивление проворен для своей тяжёлой фигуры. Несколько ударов железнорождённые ещё смели надеяться. Затем Чёрное Пламя отбило древко его топора, потом ещё раз, а на третьем обмене ударами рассекло его от плеча до грудины. Валирийская сталь не сводит счётов и не даёт второго шанса. Последний король из рода Харвина Жесткорукого умер на песке, а корону покатило прибоем.\n\nИ железнорождённые — эти железные люди, с незапамятных времён наводившие ужас на все берега Вестероса, — посмотрели на мёртвого короля и преклонили колени. Претенденты Большого Вика и Пайка сдались ещё до темноты, торопясь опередить друг друга. Сколько бы война ни продолжалась на бумаге, закончилась она на том берегу.\n\n#bold Они хотели Старого Пути. Они его получили.#!"
 fab_ac_iron_islands.0005.option1:0 "Старому Пути конец. И его королям тоже."
 fab_ac_iron_islands.0006:0 "Вынужденное отступление"
 fab_ac_iron_islands.0006.desc:0 "Напишу прямо, раз певцы этого не сделают: Куорен Волмарк одолел меня.\n\nМы встретились на берегу Большого Вика перед обоими войсками, по Старому Пути, и секира железнорождённого оказалась столь же грозной, как обещала его слава. Дважды он отвёл Чёрное Пламя, третьим ударом заставил меня пошатнуться, и лишь проворство моей стражи — и, признаю, моих собственных ног — позволило мне живым вернуться в свой строй. Железнорождённые так громко выкрикивали имя своего бога, что им вторили скалы.\n\nНо поединок — это поединок, а война — это война. Его секира не потопит мои флоты, не накормит голодающие острова и не вернёт год кровопролития, принёсший ему корону из плавника. Блокада держится, осады продолжаются, и дракон не обязан дважды проявлять благородство.\n\n#bold Старый Путь принёс победу на берегу. Новый путь принесёт победу на островах.#!"
 fab_ac_iron_islands.0006.option1:0 "Поединок — ещё не война."
 fab_ac_iron_islands.0007:0 "Совет с Утонувшим Богом"
 fab_ac_iron_islands.0007.desc:0 "Король-жрец Лодос ответил за своих безмолвных кракенов.\n\nКогда до Старого Вика дошли вести о переломе в войне, сын Утонувшего Бога не стал бежать, вести переговоры или сражаться. Он спустился к берегу, где прежде призывал кракенов, набил одежду камнями и объявил верным, что отправляется вниз, на совет к отцу. Затем вошёл в море и шёл, пока вода не сомкнулась над головой.\n\nТысячи последователей сделали то же самое. Уже несколько дней приливы выносят утопленников на берега Старого Вика. Мейстеры говорят, что море будет выбрасывать их ещё годами. Тела самого Лодоса не нашли — и, подозреваю, не найдут никогда. Невежды уже шепчутся, будто он сидит по правую руку отца и однажды вернётся.\n\n#bold Пусть советуется в подводных чертогах. Острова над водой принадлежат мне.#!"
 fab_ac_iron_islands.0007.option1:0 "То, что мертво, пусть остаётся мёртвым."
 fab_ac_iron_islands.0008:0 "Судьба островов"
 fab_ac_iron_islands.0008.desc:0 "Война на островах закончилась. Последние претенденты преклонили колени на песках Пайка и Большого Вика. Короны из плавника стали пеплом или покоятся на морском дне. Железнорождённые навсегда отказались от всех притязаний своих королей на Речные земли. Королевство Островов и Рек Харвина Жесткорукого прекратило существование навеки.\n\nНо островами кто-то должен править, и здесь мои советники расходятся во мнениях. Одни предлагают отдать их льву: Утёс Кастерли близок, богат и жаждет новых владений, а железнорождённые уже боятся флота Ланниспорта. Другие — волку: в жилах Севера течёт солёная вода, и с налётчиками у него свои счёты. Третьи советуют нечто необычное: позволить железнорождённым выбрать собственного лорда, как встарь они выбирали королей. Устав от крови, они охотнее преклонят колени перед своим, чем перед господином с зелёных земель. А лорд, избранный собственным народом с моего дозволения, будет обязан мне вдвойне.\n\n#bold Пламя и кровь принесли мне острова. Теперь мудрость должна помочь их удержать.#!"
 fab_ac_iron_islands.0008.option1:0 "Железнорождённые сами выберут своего лорда."
 fab_ac_iron_islands.0008.option2:0 "Лев будет держать кракена на привязи."
 fab_ac_iron_islands.0008.option3:0 "Волк будет стеречь западное море."
 fab_ac_iron_islands.0011:0 "Чёрный король не преклонит колено"
 fab_ac_iron_islands.0011.desc:0 "Королевский мир воцарился в Семи Королевствах. По крайней мере, в шести. За водами Закатного моря, на мокрых скалах под ветром, последний из дома Хоар всё ещё носит корону из плавника и зовёт себя королём.\n\nКогда пал Трезубец, я оставил ему острова. Теперь признаю: милость была ошибкой. Потомок Харрена не собирался покорно жить под властью дракона, которого не боялся. С Пайка летят вороны с письмами, где он именует себя королём Железных островов, словно башен Харренхола никогда и не было. Его драккары вновь тревожат западное побережье, проверяя, способен ли мир укусить. Речные лорды, страдавшие при трёх поколениях Хоаров, молят меня в письмах довести дело до конца.\n\nТак и будет. В едином королевстве нельзя терпеть ещё одного короля на западном море. Не для того я сокрушил державу Чёрного Харрена, чтобы оставить его дому корону и мечты о былом.\n\n#bold Начинается последняя война Завоевания. Флоты Ланниспорта и Хайгардена, Арбора и Медвежьего острова идут под знаменем дракона.#!"
 fab_ac_iron_islands.0011.option1:0 "Одно королевство. Один король. И на островах тоже."
 fab_ac_iron_islands.0012:0 "Сбор Железного флота"
 fab_ac_iron_islands.0012.desc:0 "Чёрный король созвал вассалов, и, к моему удивлению, откликнулось немало.\n\nКакими бы ни были Хоары, они на этих островах не чужаки — в отличие от Куорена Волмарка или жреца-выскочки. Дом Харрена правит железнорождёнными уже четыре поколения, и это имя знакомо налётчикам, которым мало что дорого. Со Старого и Большого Вика, с Оркмонта, Чёрной Волны и Солёного Утёса к Пайку идут драккары. Их капитаны никогда не преклонят колени перед завоевателем с зелёных земель и рады умереть за чёрного короля. Они намерены сражаться по Старому Пути: корабль против корабля, топор против меча, абордаж среди волн.\n\nМои капитаны считают вражеские паруса, и число им не нравится. Но каждый из этих кораблей горит не хуже любого другого. За всю свою долгую разбойничью историю железнорождённые ещё не встречали того, что ждёт над их мачтами.\n\n#bold Они не разучились достойно умирать. Я напомню им, насколько беспощадной бывает смерть.#!"
 fab_ac_iron_islands.0012.option1:0 "Пусть они приходят. Небо принадлежит мне."
 fab_ac_iron_islands.0013:0 "Старый путь королей"
 fab_ac_iron_islands.0013.desc:0 "Война обернулась против островов. Теперь чёрный король явился закончить её единственным способом, известным его дому.\n\nОн высадился со своей дружиной и прислал в мой лагерь вызов: по Старому Пути, король против короля, клинок против клинка, на глазах у обоих войск. Он не глуп: с каждым приливом надежда на победу всё глубже уходит под воду. Спасти её может лишь мёртвый дракон. И он не слабак: суровый потомок древнего железного рода, с колыбели знающий, что Хоар не склоняется ни перед кем.\n\nПоловина островов устала от крови и шепчется о мире. Другая ждёт лишь одного: хватит ли дракону смелости? Не для того я пересёк Закатное море, чтобы отвечать на вызов железнорождённого из-за стены щитов.\n\n#bold Со времён Пламенного поля Чёрное Пламя не пило крови. Последний чёрный король увидит, как отвечает дракон.#!"
 fab_ac_iron_islands.0013.option1:0 "#S Я принимаю. Чёрное Пламя и я. #!"
 fab_ac_iron_islands.0013.desc.champion:0 "Война обернулась против островов. Теперь островитяне решили закончить её единственным способом, известным их королям.\n\nНо корону из плавника носит РЕБЁНОК. Каковы бы ни были железнорождённые, мальчика против дракона они не пошлют. Старый Путь требует защитника, и они его нашли: самого грозного мечника, оставшегося на этих мокрых скалах. Взрослого воина древней железной крови, поклявшегося выступить за маленького короля перед обоими войсками. Вызов всё равно доставлен в мой лагерь: клинок против клинка, на морском берегу. Судьба короны мальчика — в руке его защитника.\n\nПоловина островов устала от крови и шепчется о мире. Другая ждёт лишь одного: хватит ли дракону смелости? Не для того я пересёк Закатное море, чтобы отвечать на вызов железнорождённого из-за стены щитов.\n\n#bold Со времён Пламенного поля Чёрное Пламя не пило крови. Защитник мальчика-короля увидит, как отвечает дракон.#!"
 fab_ac_iron_islands.0015.desc.champion:0 "Всё произошло перед обоими войсками, на берегу, по древнему обычаю, который железнорождённые чтут больше любой септы.\n\nЗащитник мальчика-короля бросился на меня, как железнорождённые с незапамятных времён бросаются на весь мир: без сомнений, без пощады, уверенный, что Утонувший Бог стоит за его плечом. Он был силён, и несколько ударов железнорождённые ещё смели реветь от восторга. Затем Чёрное Пламя отвело его клинок, потом ещё раз, а на третьем обмене ударами защитник упал на песок. Вместе с его кровью утекала и надежда мальчика на победу. Валирийская сталь не сводит счётов и не даёт второго шанса.\n\nИ железнорождённые, с незапамятных времён наводившие ужас на все берега Вестероса, посмотрели на павшего защитника и плачущего мальчика-короля — и преклонили колени. Ребёнок лишится короны, а не головы: я не воюю с детьми. Сколько бы война ни продолжалась на бумаге, закончилась она на том берегу.\n\n#bold Четыре поколения Хоаров носили корону. Больше её не наденет никто из этого дома.#!"
 fab_ac_iron_islands.0015:0 "Последний из чёрных королей"
 fab_ac_iron_islands.0015.desc:0 "Всё произошло перед обоими войсками, на берегу, по древнему обычаю, который железнорождённые чтут больше любой септы.\n\nЧёрный король бросился на меня, как его дом уже четыре поколения бросается на весь мир: без сомнений, без пощады, уверенный, что Утонувший Бог стоит за его плечом. Он был силён и на удивление проворен для своей тяжёлой фигуры. Несколько ударов железнорождённые ещё смели реветь от восторга. Затем Чёрное Пламя отвело его клинок, потом ещё раз, а на третьем обмене ударами род Харвина Жесткорукого пресёкся на песке. Валирийская сталь не сводит счётов и не даёт второго шанса. Корона из плавника скатилась в прибой, и море унесло её в глубину, которой он молился.\n\nИ железнорождённые, с незапамятных времён наводившие ужас на все берега Вестероса, посмотрели на мёртвого короля, последнего в чёрном роду, — и преклонили колени. Сколько бы война ни продолжалась на бумаге, закончилась она на том берегу.\n\n#bold Четыре поколения Хоаров носили корону. Больше её не наденет никто из этого дома.#!"
 fab_ac_iron_islands.0015.option1:0 "Род Чёрного короля пресёкся."
 fab_ac_iron_islands.0016.desc.champion:0 "Напишу прямо, раз певцы этого не сделают: защитник мальчика-короля одолел меня.\n\nМы встретились на берегу перед обоими войсками, по Старому Пути, и рука железнорождённого оказалась столь грозной, что островитянам оставалось только благодарить богов. Он отвёл Чёрное Пламя, заставил меня пошатнуться, и лишь проворство моей стражи — и, признаю, моих собственных ног — позволило мне живым вернуться в свой строй. Железнорождённые так громко выкрикивали имя Утонувшего Бога, что им вторили скалы, а ребёнок на троне из плавника сегодня стал в их глазах вдвойне королём.\n\nНо поединок — это поединок, а война — это война. Секира одного защитника не потопит мои флоты, не накормит эти голодные скалы и не вернёт силы, которые дом Хоаров потратил за долгие годы владычества над Трезубцем. Блокада держится, осады продолжаются, и дракон не обязан дважды проявлять благородство.\n\n#bold Старый Путь принёс победу на берегу. Новый путь принесёт победу на островах.#!"
 fab_ac_iron_islands.0016:0 "Вынужденное отступление"
 fab_ac_iron_islands.0016.desc:0 "Напишу прямо, раз певцы этого не сделают: чёрный король одолел меня.\n\nМы встретились на берегу перед обоими войсками, по Старому Пути, и рука железнорождённого оказалась столь же грозной, как обещала слава его дома. Он отвёл Чёрное Пламя, заставил меня пошатнуться, и лишь проворство моей стражи — и, признаю, моих собственных ног — позволило мне живым вернуться в свой строй. Железнорождённые так громко выкрикивали имя Утонувшего Бога, что им вторили скалы.\n\nНо поединок — это поединок, а война — это война. Его секира не потопит мои флоты, не накормит голодающие скалы и не вернёт силы, которые его дом потратил за долгие годы владычества над Трезубцем. Блокада держится, осады продолжаются, и дракон не обязан дважды проявлять благородство.\n\n#bold Старый Путь принёс победу на берегу. Новый путь принесёт победу на островах.#!"
 fab_ac_iron_islands.0016.option1:0 "Поединок — ещё не война."
