l_russian:
 fab_ac_west.0001:0 "Покорение Расколотой Клешни"
 fab_ac_west.0001.desc:0 "После смерти Харрена в расплавленных башнях и разрушения Короля Шторма, один упрямый уголок моего нового королевства остался невысказанным: мыс Крэккло, это переплетение болот, сосновых пустошей и потрескавшихся серых скал между заливом и узким морем. Мелкие лорды в полуразрушенных башнях, Бруны, Богги, Краббы и Харди, которые до него никогда по-настоящему не склонялись ни перед Харреном, ни перед Королями Шторма — люди, которые превратили гордую бедность и упрямство во что-то вроде религии.\n\nВисенья одна отправилась на Вхагар, чтобы потребовать от них подчинения. Она всегда понимала таких людей лучше меня, и они доказывали ее правоту. Лорды Треснувшего Когтя бедны, но они не слепы: они слышали о Харренхоле и знали, что у них нет шансов против дракона. Один за другим они вышли из своих болот и башен и положили свои мечи к ногам моей сестры — без колебаний, говорит она мне, и достаточно близко с гордостью, потому что они преклоняли колени перед валирийской королевой на укусах дракона, а не преклоняли колени перед соседом.\n\nИ Висенья в своей мудрости дала им единственную награду, сокровище таких людей: она взяла их как свои собственные. Над ними не будет поставлен ни один речной лорд, ни сюзерен Короны, ни посредник любого рода. Лорды Мыса Крэккло не будут присягать на верность никому — никому, кроме самого Железного Трона.\n\n#bold Пустошь гордых нищих, присягнувших прямо короне. Этим обещанием Висенья, возможно, купила больше лояльности, чем я купил помилованием на три королевства.#!"
 fab_ac_west.0001.option1:0 "Они склоняются лишь перед драконом. Теперь идём на запад."
 fab_ac_west.0001.option_west_won:0 "Они преклоняют колени только перед драконом, как это уже делает Запад."
 fab_ac_west.0001.option_west_marching:0 "Они склоняются лишь перед драконом. Войско уже на западе."
 fab_ac_west.0001.desc.alt:0 "После победы Трезубца и удара последнего знамени Харрена один упрямый уголок моего нового королевства остался невысказанным: мыс Крэккло, это переплетение болот, сосновых пустошей и потрескавшихся серых скал между заливом и узким морем. Мелкие лорды в полуразрушенных башнях, Бруны, Богги, Краббы и Харди, которые до него никогда по-настоящему не склонялись ни перед Харреном, ни перед Королями Шторма — люди, которые превратили гордую бедность и упрямство во что-то вроде религии.\n\nВисенья одна отправилась на Вхагар, чтобы потребовать от них подчинения. Она всегда понимала таких людей лучше меня, и они доказывали ее правоту. Лорды Треснувшего Когтя бедны, но они не слепы: они слышали, что случилось с королевством Харрена, и знали, что у них нет шансов против дракона. Один за другим они вышли из своих болот и башен и положили свои мечи к ногам моей сестры — без колебаний, говорит она мне, и достаточно близко с гордостью, потому что они преклоняли колени перед валирийской королевой на укусах дракона, а не преклоняли колени перед соседом.\n\nИ Висенья в своей мудрости дала им единственную награду, сокровище таких людей: она взяла их как свои собственные. Над ними не будет поставлен ни один речной лорд, ни сюзерен Короны, ни посредник любого рода. Лорды Мыса Крэккло не будут присягать на верность никому — никому, кроме самого Железного Трона.\n\n#bold Пустошь гордых нищих, присягнувших прямо короне. Этим обещанием Висенья, возможно, купила больше лояльности, чем я купил помилованием на три королевства.#!"
 fab_ac_west.0002:0 "Лев и Зеленая рука"
 fab_ac_west.0002.desc:0 "Два великих короля Запада наконец-то объединились против меня.\n\nИз Хайгардена выступает Мерн, Девятый по имени Его Дом Гарденеров, Король Простора, со всей силой самого плодородного королевства Вестероса за его спиной. Под стенами Золотой Рощи его встретил Лорен Ланнистер, Король Скалы, спустившийся из западных земель, сопровождаемый всей приобретенной за золото сталью Утёса Кастерли. Вместе, как клянутся мои всадники, они командуют самой могущественной армией, которую когда-либо видели в Вестеросе: пять с половиной тысяч человек, шестьсот лордов, больших и малых под их знаменами, и более пяти тысяч рыцарей в доспехах. Ни один из королей не любит другого — Скала и Простор враждовали за пределы границ уже тысячу лет — но страх перед драконом сделал братьев старыми врагами.\n\nИ они не ждут, что я приду к ним. Армия такого размера пожирает землю, где бы она ни стояла; они уже разбили свои лагеря в Золотой роще и повернули на север, сквозь высокую траву и золотую пшеницу, в поисках моей армии и битвы, которая одним махом положит конец этой войне.\n\n#bold Два коронованных короля маршируют вместе, по пять человек на каждого из меня. #!"
 fab_ac_west.0002.option1:0 "Это может быть проблемой."
 fab_ac_west.0003:0 "Лев и Зеленая рука"
 fab_ac_west.0003.desc:0 "Последние вороны лежат раскрытыми на моем столе совета, и каждый несет одни и те же невероятные новости. Харрен Черный мертв в стенах, которые он называл нерушимыми. Аргилак Дюррандон пал с мечом в руке. Две древние короны исчезли за то время, которое требуется торговцу, чтобы добраться из Ланниспорта до Скалы.\n\nНа одном письме изображена зеленая рука Гарденера Дома. Король Мерн предлагает, чтобы Рич и Рок встретились с Эйгоном вместе: его бесконечные поля копий соединились с моей бронированной лошадью и золотой сокровищницей. Наши королевства соперничали за границы на протяжении поколений, но ни у кого из нас не останется границ, из-за которых можно было бы ссориться, если дракон заберет обе короны.\n\nГордость советует мне оставаться в одиночестве. Арифметика дает более мудрый совет. Объединившись, мы создадим величайшую армию, которую когда-либо видел Вестерос, и заставим Эйгона понять, что три зверя не смогут удержать континент."
 fab_ac_west.0003.option1:0 "Передайте в Хайгарден: лев выступит вместе с рукой."
 fab_ac_west.0004:0 "Рука тянется на запад"
 fab_ac_west.0004.desc:0 "Каждый ворон с востока несет в себе смерть чего-то древнего. Башни Харрена не смогли защитить его от драконьего огня. Мужество Аргилака не смогло спасти его корону. Речные и Штормовые земли теперь подчиняются лорду, чья армия вряд ли сможет составить одно крыло моей собственной армии.\n\nВ этом опасность. Эйгон доказал, что стен и доблести, предлагаемых по отдельности, недостаточно. Если я буду ждать за Мандером, пока он по очереди уничтожает каждое королевство, величайшие силы Вестероса будут потрачены на борьбу в одиночку. Итак, я созвал свой совет под зелеными знаменами Хайгардена и написал письмо, которое гордость когда-то запретила мне писать.\n\nЛорен Ланнистер командует золотым и тяжелым конем Скалы. Я командую урожаем, рыцарством и бесчисленными копьями Простора. Наши отцы ссорились из-за границ; нашим сыновьям не придется унаследовать королевства, если лев и Зеленая рука не встанут вместе сейчас."
 fab_ac_west.0004.option1:0 "Нашей рукой Простор даст ответ — и лев с нами."
 fab_ac_west.0005:0 "У дракона три головы"
 fab_ac_west.0005.desc:0 "У Двух Королей могут быть свои номера. У меня есть кое-что получше.\n\nМоя армия — пятая часть их армии, и большая часть ее — стальные речные лорды, присягнувшие мне всего за полгода, — я отдался [fab_host_lord.GetTitledFirstName] из Девичьего пруда. Этот дом был одним из первых, кто выступил против меня после высадки, и оставил своего старого хозяина среди убитых за него; клятва, данная мне среди этих обломков, соблюдается лучше, чем большинство других, данных добровольно, и ее лорд — более твердая рука в поле, чем могут похвастаться лорды вдвое выше его ранга. [fab_host_lord.GetSheHe] знает, что мне нужно: не выиграть битву, а удерживать строй, пока небо одерживает победу. Моя армия может быть меньше их, но она движется в два раза быстрее — и я имею в виду выбирать землю, а не заставлять ее выбирать за меня.\n\nА в остальном эту битву будут вести трое. В каждой войне этого завоевания мы с сестрами действовали по отдельности: Висенья — мысу Трещины, Рейнис — Последнему Шторму, каждый дракон — война сама по себе. Не в этот раз. Против пятидесяти тысяч наших сил не будет разделения: Балерион, Вхагар и Мераксес вместе поднимут небо над одним полем, впервые с тех пор, как мы покинули Драконий Камень.\n\n#bold Два короля полагают, что идут сражаться с армией. Они идут, чтобы узнать, что такое три дракона.#!"
 fab_ac_west.0005.option1:0 "Немедленно пошлите сообщение королеве Висенье и королеве Рейнис."
 fab_ac_west.0005.desc.early:0 "У Двух Королей могут быть свои номера. У меня есть кое-что получше.\n\nМоя армия — пятая часть их армии, большая часть которой присягнула мне только с тех пор, как я прибыл на берег, — я отдался [fab_host_lord.GetTitledFirstName] из Девичьего пруда. Этот дом был одним из первых, кто выступил против меня после высадки, и оставил своего старого хозяина среди убитых за него; клятва, данная мне среди этих обломков, соблюдается лучше, чем большинство других, данных добровольно, и ее лорд — более твердая рука в поле, чем могут похвастаться лорды вдвое выше его ранга. [fab_host_lord.GetSheHe] знает, что мне нужно: не выиграть битву, а удерживать строй, пока небо одерживает победу. Моя армия может быть меньше их, но она движется в два раза быстрее — и я имею в виду выбирать землю, а не заставлять ее выбирать за меня.\n\nА в остальном эту битву будут вести трое. После приземления мы с сестрами летали порознь чаще, чем вместе, каждый дракон ведёт войну сам по себе. Не в этот раз. Против пятидесяти тысяч наших сил не будет разделения: Балерион, Вхагар и Мераксес вместе поднимут небо над одним полем, впервые с тех пор, как мы покинули Драконий Камень.\n\n#bold Два короля полагают, что идут сражаться с армией. Они идут, чтобы узнать, что такое три дракона.#!"
 fab_ac_west.0006:0 "Под лесом знамен"
 fab_ac_west.0006.desc:0 "Перевалы позади нас забиты людьми, лошадьми, повозками и развевающимися малиновыми знаменами. Каждый лорд Западных земель ответил мне. Впереди, через Простор, Мерн Гарденер марширует под еще большим зеленым лесом. Там, где наши армии объединятся, пятьдесят пять тысяч солдат будут стоять вместе — самая большая армия, когда-либо собиравшаяся на этом континенте.\n\nСилы Эйгона составляют едва ли пятую часть наших. Его люди вели кампанию без отдыха, вдали от Драконьего Камня и с враждебными королевствами со всех сторон. Даже драконам приходится приземляться, есть и уставать. Если мы распространимся достаточно широко, нажмем достаточно сильно и не дадим ему возможности убежать, плоть и кровь скажут об этом.\n\nМои капитаны уверенно разговаривают у костров. Я дважды производил собственные расчеты. Цифры по-прежнему в подавляющем большинстве в нашу пользу."
 fab_ac_west.0006.option1:0 "Трубите выступление. Пусть Эйгон считает наши знамёна."
 fab_ac_west.0007:0 "Дракон идёт на Простор"
 fab_ac_west.0007.desc:0 "Всадники достигли лагеря еще до рассвета: Эйгон пересек Черную воду и повернул на юго-запад, в Простор. Его основная армия продвигается по речным дорогам, в то время как его флот идет в ногу с побережьем. Балерион летит над центром; Вхагар и Мераксес идут впереди, сжигая сторожевые башни и рассеивая все отряды, посланные, чтобы задержать его. Впервые за всю войну все три Таргариена и все три дракона маршируют вместе.\n\nЕго цель ясна. Эйгон намерен начать битву до того, как Лорен сможет объединить западную армию с моей, а затем уничтожить наши королевства по отдельности, как он уничтожил Харрен и Аргилак. Я приказал знаменам Простора сконцентрироваться в Золотой Роще, где встречаются дороги из Хайгардена и Утёса Кастерли. Лорен уже находится к востоку от Золотого Зуба со всеми всадниками, которых могут предоставить Западные земли.\n\nКогда наши армии объединятся, пятьдесят пять тысяч солдат будут стоять под зеленой рукой и золотым львом: около пяти человек на каждого, которым командует Эйгон, тысячи рыцарей в доспехах и достаточно лучников, чтобы затмить небо. Мы не можем спрятаться от драконов за камнем. Мы рассредоточимся по открытой местности, лишим их единственной цели и нападем на меньшую армию Эйгона со всех сторон."
 fab_ac_west.0007.option1:0 "Созвать все знамёна к Золотой Роще. Встретим дракона вместе."
 fab_ac_west.0009:0 "Два короля"
 fab_ac_west.0009.desc:0 "Мои королевы прибыли, Рейнис из Штормового Предела и Висенья из мыса Крэккло, и вместе мы погнали Двух Королей к месту по моему выбору: широкой открытой равнине к югу от Черноводной, где однажды пролегет золотая дорога. Никакой возвышенности, как у Ориса во время Последнего Шторма. Никаких стен, никаких рек, ничего, что могло бы укрепить мою линию обороны — Мерн намеревается обойти оба моих фланга и пронзить своим железным кулаком мой центр, и на этой местности он вполне может это сделать.\n\nНо обратите внимание на землю, как я ее отметил: трава и пшеница от горизонта до горизонта, высокая и созревшая для жатвы. Дождя не было уже две недели. День безоблачный и ветреный.\n\n#bold У них есть номера. У нас есть небо — и само поле — это подстерегающее оружие.#!"
 fab_ac_west.0009.option1:0 "Выстроить войско полумесяцем. И ждать."
 fab_ac_west.0010:0 "Последний урожай"
 fab_ac_west.0010.desc:0 "Наш натиск смял их первый ряд. Я видел, как копейщики Эйгона подались под тяжестью войска Простора, слышал крики тысяч людей под зелёной рукой и знал: расчёт был верен. Его войско слишком мало. Его Завоевание закончится здесь.\n\nЗатем Балерион спустился сквозь тучу стрел. Вхагар прилетела с востока, Мераксес — с запада. Они жгли не людей, а сухие поля вокруг них. Летняя пшеница стала стеной пламени. Ветер погнал огонь через наш тыл, а драконье пламя захлестнуло передние ряды, заперев конных и пеших под почерневшим небом. Доспехи раскалялись докрасна на живых людях. Вспыхнули знамёна. Горела сама земля под нами.\n\nМои сыновья погибли. Мои братья погибли. Куда ни посмотрю, ещё одна зелёная рука падает в огонь. Десять тысяч лет крови Гарденеров заканчиваются здесь — одним урожаем пепла."
 fab_ac_west.0010.option1:0 "Зеленая рука горит..."
 fab_ac_west.0011:0 "Железный кулак"
 fab_ac_west.0011.desc:0 "Они пришли под звуки своих труб под морем знамен, и я не буду утверждать, что это было что-то менее великолепное. Сам король Мерн возглавил атаку на мой центр на своем золотом жеребце, а его сын Гавен рядом с ним держал огромную зеленую руку на белом поле. С ревом и криками, подгоняемые рожками и барабанами, рыцари Простора и Скалы обрушились на мою армию сквозь град стрел — и моя линия не смогла их сдержать. Копейщики моего полумесяца были сметены, как мякина; мой центр был разрушен; железный кулак пронзил его, и пятьдесят пять тысяч глоток выли о победе.\n\nМоим людям оставалось только согнуться, а не сломаться — Джон Мутон удерживает то, что осталось от линии, а его лучники уже отступают против ветра, именно так, как им было сказано.\n\nПотому что к тому времени мы с сестрами уже были в воздухе.\n\n#bold Я повел Балериона сквозь ураган копий, камней и стрел, Вхагар и Мераксес поднимались на обоих флангах — а под нами вся гордая армия Двух Королей, раскинувшаяся по сухому, как трут, пшеничному полю. #!"
 fab_ac_west.0011.option1:0 "#S Дракарис! #!"
 fab_ac_west.0012:0 "Огненный дождь"
 fab_ac_west.0012.desc:0 "Я пронесся вдоль их рядов к Балериону, достаточно низко, чтобы почувствовать, как их стрелы гремят на его чешуе, снова и снова омывая железный кулак пламенем. Но победу одержали мои королевы: Рейнис и Висенья разожгли костры с наветренной стороны врага и позади него, и сухая трава и стоящая пшеница взлетели вверх одновременно, быстрее, чем может бежать человек.\n\nОстальное сделал ветер. Он распространил пламя на стены и направил дым в лица наступающих рядов. Запах огня свел их скакунов с ума; Когда дым сгустился, конь и всадник были ослеплены, а атака, которая должна была сокрушить меня, распалась на десять тысяч человек, пробирающихся сквозь горящий туман. Стены огня поднимались со всех сторон. Их гордое море знамен превратилось в море пламени.\n\nА с наветренной стороны, в безопасности от пожара, люди лорда Мутона ждали со своими луками и копьями и быстро расправлялись с обожженными и горящими людьми, которые, шатаясь, вышли из ада.\n\n#bold Пятьдесят пять тысяч человек, а Два Короля вообще ни разу не привели меня в бой. Мне принесли растопку.#!"
 fab_ac_west.0012.option1:0 "Сжечь поле."
 fab_ac_west.0013:0 "Поле огня"
 fab_ac_west.0013.desc:0 "«Огненное поле», как его уже называют люди. Никогда не будет другого подобного.\n\nВ огне погибло более четырех тысяч человек; еще тысяча пала от меча, копья и стрел; десятки тысяч получили ожоги, некоторые настолько жестокие, что шрамы останутся с ними в могилах. Король Мерн Девятый лежит среди мертвых, а с ним его сыновья, его внуки, его братья, его двоюродные братья — зеленая рука сожгла корень и ветку. Одного племянника извлекли из пепла живым; мейстеры дают ему дни, не больше, и когда он уходит, вместе с ним умирает Дом Гарденеров — линия Гарта Гринхэнда, старейшего королевского дома в Вестеросе.\n\nЛорен Ланнистер жива. Когда он увидел, что день пропал, Король Скалы повернулся и поскакал прямо через стену пламени и дыма на другую сторону — самое смелое, что любой человек сделал на этом поле, включая моего собственного подопечного. Мои всадники теперь охотятся за ним.\n\nИз моей армии мы потеряли менее сотни человек. Висеня получил стрелу в плечо; она сама вытащила его и назвала царапиной. Драконы наедаются мертвецами.\n\n#bold Я приказал собрать все мечи убитых и отправить их вниз по реке, в Эйгонова Крепость. Куча растет.#!"
 fab_ac_west.0013.option1:0 "Соберите мечи убитых."
 fab_ac_west.0014:0 "Поле в огне"
 fab_ac_west.0014.desc:0 "По всем меркам, известным войне, мы победили. Наш фургон разбил ряды Эйгона, наша лошадь обогнула его фланги, и десятки тысяч двинулись вперед под львиной и зеленой рукой. Затем Балерион взобрался на солнце, Вхагар и Мераксес рядом с ним, и всякая мера перестала иметь значение.\n\nДраконы не сжигали наших солдат по одной шеренге. Они подожгли сухую траву позади нас и превратили сам ветер в оружие. Пламя бежало быстрее лошадей. Мужчины бросали мечи, чтобы царапать горящие доспехи. Король Мерн мертв, его сыновья и братья вместе с ним, а древний Дом Гарденеров погиб за один день.\n\nЯ убежал сквозь дым, достаточно густой, чтобы скрыть короля. Всадники Эйгона скоро меня найдут. Я могу отдать свою корону и сохранить свой дом или сбежать в Утёс Кастерли и довериться его горным стенам от огня, уничтожившего Харренхол."
 fab_ac_west.0014.option1:0 "Живой лев может снова зарычать. Я отдам корону."
 fab_ac_west.0014.option2:0 "Утёс Кастерли никогда не падал. Я испытаю его огонь на камне."
 fab_ac_west.0020:0 "Сложенная зелёная корона"
 fab_ac_west.0020.desc:0 "Война проиграна, хотя зеленые поля не превратились в костер. Наши отряды разбросаны, наши дороги открыты, и каждый ворон приводит другого лорда, спрашивающего, спасет ли Простор еще одна битва или просто скормит драконам еще больше сыновей. Я знаю ответ, каким бы горьким он ни был.\n\nПеред лагерем Эйгона я снимаю корону, сошедшую с Гарта Зеленорукого, и кладу к его ногам. Он забирает мою корону, но оставляет мне Хайгарден, мою линию и власть над Простором под своим новым троном. Таким образом, десять тысяч лет правления Гарденеров закончились не вымиранием, а подчинением.\n\nКорону можно отдать, чтобы народ выжил. Поля снова будут засеяны. Мандер по-прежнему будет существовать, и зеленая рука будет существовать без короны."
 fab_ac_west.0020.desc.submit:0 "Я предпочел живой Простор королевской гордости. Прежде чем драконий огонь обратит наши поля в пепел, я снимаю корону, спущенную с Гарта Зеленорукого, и возлагаю ее к ногам Эйгона Таргариена. Он забирает мою корону, но оставляет мне Хайгарден, мою линию и власть над Простором под своим новым троном.\n\nДесять тысяч лет правления Гарденеров закончились моей собственной рукой, но поля будут засеяны снова. Мандер по-прежнему будет существовать, и зеленая рука будет существовать без короны."
 fab_ac_west.0020.option1:0 "Нашей рукой Простор выстоит."
 fab_ac_west.0021:0 "Последний король Скалы"
 fab_ac_west.0021.desc:0 "Жар все еще поднимается от земли, когда меня приводят к Эйгону Таргариену. Балерион ждет позади него, сложив черные крылья, в то время как пепел падает над руинами величайшей армии, когда-либо созданной Вестеросом. Никаких угроз не говорится. Ничего не нужно.\n\nЯ кладу свой меч, снимаю золотую корону со Скалы и кладу обе вещи к ногам победителя. Эйгон принимает мое подчинение, затем возвращает мой меч и возвышает меня как Лорда Утёса Кастерли и Хранителя Запада. Моя корона утеряна, но мои земли, мои дети и правление Дома Ланнистеров остаются моими.\n\nГарденеры поставили на кон всё и не оставили наследника, который оплакивал бы их. Я купил будущее своего дома за корону. Ланнистер платит свои долги — и я буду помнить и дарованную сегодня милость, и цену, которую за нее потребовали."
 fab_ac_west.0021.desc.submit:0 "Утёс Кастерли никогда не падал, и я не буду тратить жизни запада только на то, чтобы доказать, что его стены защищены от драконьего огня. Я кладу свой меч, снимаю золотую корону со Скалы и кладу обе вещи к ногам Эйгона Таргариена по своему собственному решению.\n\nОн возвращает мой меч и возвышает меня как Лорда Утёса Кастерли и Хранителя Запада. Моя корона ушла, но мои земли, мои дети и правление Дома Ланнистеров остались. Я купил будущее своего дома за корону, а Ланнистеры всегда платят свои долги."
 fab_ac_west.0021.option1:0 "Корона потеряна. Утёс и его львы выстоят."
 fab_ac_west.0022:0 "Замок без короля"
 fab_ac_west.0022.desc:0 "Король мертв. Его сыновья мертвы, его братья, его двоюродные братья — каждый человек зеленой руки, приехавший на это проклятое поле, мертв, а Дом Гарденеров исчез из этого мира за один-единственный полдень пожара.\n\nИ я, хранивший счета, запасы и ключи этого замка, как мои отцы хранили их для королей древности, теперь владею Хайгарденом, и нет короля, которому он мог бы принадлежать. Армия завоевателя находится на Розовой дороге. В Просторе не осталось армии, которая могла бы его замедлить, не говоря уже о том, чтобы остановить.\n\nЯ могу открыть врата и вручить дракону несгоревший драгоценный камень — или запереть их и превратить Хайгарден в костер для уже погибшей династии."
 fab_ac_west.0022.option1:0 "Откройте ворота. Хайгарден должен жить."
 fab_ac_west.0022.option2:0 "Заприте ворота в память о короле Мерне!"
 fab_ac_west.0023:0 "Награда стюарду"
 fab_ac_west.0023.desc:0 "Я отдал завоевателю Хайгарден целиком — его ворота открыты, его житницы полны, его жители не окровавлены — и он вернул его мне.\n\nЛорд Хайгардена. Верховный лорд Мандера. Страж Юга. Титулы, которые никогда не предназначались для линии управляющего, и половина старых домов Простора подавятся каждым из них. Они поехали на Огненное Поле, и мой дом сохранил замок и урожай, а это именно то, в чем Простор всегда нуждался от своих хозяев.\n\nДом Тиреллов всем обязан дракону. Он не найдет нас забывчивыми."
 fab_ac_west.0023.option1:0 "Становимся сильнее."
 fab_ac_west.0024:0 "Новый Лорд Простора"
 fab_ac_west.0024.desc:0 "Когда моя армия подошла к Хайгардену, мы обнаружили, что его ворота уже открыты, а на стенах никого нет. Харлан Тирелл, потомственный верховный стюард Простора, вышел навстречу нам пешком — и без обнажения сдал величайший замок юга, его ключи, его гарнизон и всю казну. Зеленая рука горела на Поле Огненном; его управляющий не видел никакой выгоды в том, чтобы гореть вместе с ним.\n\nТеперь величайшее место юга принадлежит мне, и в моих советах весят три имени. Харлан Тирелл, чей дом управлял Простором в течение нескольких поколений, пока Гарденеры носили корону, — каждый лорд Мандера знает свою печать и свою справедливость, а управляющий, высоко поднятый собственной рукой короля, не порождает претендентов. Лорд Пик из Старпайка, гордый и жесткий, чья линия может похвастаться кровью Гарденеров от старых браков и держит марши, охраняющие Дорн, — те из моих советников, которые не доверяют подскочившим домашним мужчинам, громче всех произносят его имя. И есть третий, которого я не надеялся найти живым: племянник короля Мерна, последняя живая капля рода Гарта Зеленорукого, унесенная с Огненного поля настолько сожженная, что мейстеры удивляются, что он все еще дышит. Дайте мальчику сад, и зеленая рука снова вырастет — если он выживет и если королевство, завоеванное огнем, преклонит колени перед огнем, который так почти не уничтожился.\n\nОдна сила Простора все еще стоит особняком: Старомест. Хайтауэры сидят за стенами самого богатого города Вестероса и не посылают ни неповиновения, ни почтения — только молчание и наблюдателей на своих башнях. Старик Староместа ждет, чтобы узнать, что задумали боги. Он может подождать еще немного.\n\n#bold У сада должен быть смотритель. Дракону предстоит выбрать его.#!"
 fab_ac_west.0024.option1:0 "Роза будет заботиться о Просторе."
 fab_ac_west.0024.option2:0 "Звёздный Пик хранил мой мир в Марках. Пики будут хранить Простор."
 fab_ac_west.0024.option3:0 "Зелёная рука вновь обретёт силу. Возвысить последнего Гарденера."
 fab_ac_west.0025:0 "Возвышение розы"
 fab_ac_west.0025.desc:0 "Это было сделано в большом зале Хайгардена, под знаменами, еще слабо пахнущими дымом. Харлан Тирелл преклонил колени в качестве стюарда, и я своими руками возвысил его как лорда Хайгардена, верховного лорда Мандера и стража Юга, чтобы держать весь Простор под своим именем.\n\nМне сказали, что он плакал, но не при мне. Его дом хранил этот сад для чужих корон со времен зеленых королей; теперь сад принадлежит им, а я оставлю его себе. Лорды Мандера приходили один за другим, чтобы воздать ему должное — некоторые с радостью, потому что знали его справедливость; некоторые смотрели на сожженные поля, а мысли благоразумно держали за зубами. Флоренты из Брайтуотера преклонили колени последними и самыми низкими, и я не думаю, что они забудут порядок этого коленопреклонения. Я тоже.\n\nПосле этого я тихо уладил одно дело: обгоревшего мальчика, племянника Мерна, я поручил заботе мейстеров со всей добротой, которую мог предложить мой лагерь. То, что положило начало пожару, невозможно исправить. Зеленая рука заканчивается на одре больного в Хайгардене, за которым ухаживают слуги дома, унаследовавшего его сад.\n\n#bold Роза будет ухаживать за тем, что посадила зеленая рука. И он всегда будет помнить, чьим подарком был этот сад.#!"
 fab_ac_west.0026:0 "Замок в Марках"
 fab_ac_west.0026.desc:0 "Это было сделано в большом зале Хайгардена, под чужими знаменами. Лорд Пик из Старпайка преклонил колени перед марширующим лордом и поднялся, лорд Хайгардена, верховный лорд Мандера и страж Юга, чтобы держать весь Простор под моим именем.\n\nУ моих советников были свои причины, и они были вескими: старая кровь, кровь Гарденеров от двойного брака, сильное место в маршах, которое наблюдало за Дорном на протяжении веков, и твердость, которая может понадобиться мягкому зеленому сердцу Простора в те годы, которые я для него запланировал. Лорды Простора, в свою очередь, отдали дань уважения — хотя я заметил, сколько взглядов было устремлено на Харлана Тирелла, тихо стоящего среди них, стюарда, который открыл ворота и получил обратно только свое управление. Пику придется наблюдать за розой так же внимательно, как он наблюдает за песком.\n\nПосле этого я тихо уладил одно дело: обгоревшего мальчика, племянника Мерна, я поручил заботе мейстеров со всей добротой, которую мог предложить мой лагерь. То, что положило начало пожару, невозможно исправить. Зеленая рука заканчивается больничной койкой в ​​Хайгардене, в замке, который теперь подчиняется Старпайку.\n\n#bold Горжусь, суров и благодарен. Марши пришли в сад.#!"
 fab_ac_west.0027:0 "Зелёная рука выстояла"
 fab_ac_west.0027.desc:0 "Это было сделано в большом зале Хайгардена, и половина двора плакала, глядя на это. [fab_gardener_nephew.GetFirstName], племянник короля Мерна, последняя выжившая представительница рода Гарта Гринхэнда, был доставлен на помост в носилках — он еще не может стоять без посторонней помощи — и встал на колени, опустив голову. Я вырастил его лордом Хайгардена, верховным лордом Мандера и хранителем Юга, чтобы он держал под своим именем сад, посаженный его отцами.\n\nМейстеры прямо говорят мне, что он, возможно, не доживет до конца года; Огонь, унесший его короля и родственников, не пощадил его настолько, чтобы согласиться подождать. Но он принес клятву не дрожащим голосом, и когда это было сделано, лорды Простора снова преклонили колени перед Гарденером — и каждый из них имел в виду это так, как никакой грант завоевателя не мог заставить их иметь это в виду. Если Семь даруют ему годы, зеленая рука снова вырастет под покоем дракона. Если они этого не сделают, ни один человек не скажет, что Эйгон Таргариен позволил линии зеленых королей закончиться на одре больного, в то время как его сад был отдан над его головой.\n\nХарлан Тирелл сохраняет за собой управление и служит мальчику так же, как его дом служил Гарденерам на протяжении трехсот лет. Некоторые вещи, похоже, выдерживают даже драконий огонь.\n\n#bold Зеленая рука, выросшая из ясеня. Большую часть этого сделают певцы.#!"
 fab_ac_west.0029:0 "У Запада должен быть Лорд"
 fab_ac_west.0029.desc:0 "На следующий день после битвы они схватили Короля Скалы, и он попросил его встать на колени. Прежде чем я его воспитаю, мои консультанты попросят меня взвесить то, что я воспитываю.\n\nЛорен Ланнистер ехал против меня рядом с Мерном Гарденером, держа за спиной всю купленную золотом сталь Запада — и, в отличие от Мерна, он жив, потому что у него хватило ума проехать ЧЕРЕЗ мой огонь, а не стоять в нем. Гордый и способный человек, и лорды западных земель давно привыкли подчиняться Скале. Подтвердите его, и Запад сменит хозяев за один день и больше не доставит мне хлопот.\n\nНо есть и другие голоса. Рейны Кастамере — вторая сила запада, красные львы по сравнению с золотом Кастерли, богатые своими рудниками и более гордые, чем принцы, — и они поспешили, очень поспешили прошептать, что короля, сражавшегося с драконом, лучше заменить домом, который будет всем обязан дракону. В Верховном Лорде есть мудрость, созданная исключительно из благодарности. Также есть уверенность, что Скала никогда не забывает обид.\n\n#bold Золотой лев или красный. Запад в любом случае преклонит колени — вопрос в том, перед кем он преклонит колени первым. #!"
 fab_ac_west.0029.option1:0 "Лорен преклонил колено, пока ещё мог выбирать. Подтвердить его власть над Утёсом."
 fab_ac_west.0029.option2:0 "Красный лев, всем мне обязанный. Возвысить дом Рейнов."
 fab_ac_west.0030:0 "Хранитель Запада"
 fab_ac_west.0030.desc:0 "Они взяли Короля Скалы на следующий день после битвы, всего в дне пути от поля боя. Он не сопротивлялся. Он прошёл через огонь, чтобы сохранить свою свободу ещё на одну ночь, и я думаю, он потратил её, решая, какой человек преклонит передо мной колени утром.\n\nГордый, как это бывает. Лорен Ланнистер предстал передо мной с прямой спиной и все еще покрытым копотью плащом, положил свой меч и корону у моих ног, преклонил колени и воздал мне должное как Королю всего Вестероса — первым из великих королей, сделавшим это, пока у него еще оставалось дыхание, чтобы выбирать. И я, верный обещанию, данному всему Вестеросу, собственными руками поднял на ноги моего побежденного врага. Он сохраняет свои земли и свою светлость: теперь он Лорд Утёса Кастерли, больше не король, а кроме того, Хранитель Запада, удерживающий Западные земли от моего имени. Его знаменосцы последовали за ним до колен, а за ними — поток лордов Простора, переживших драконий огонь, каждый из которых радовался больше предыдущего тому, что я облегчаю преклонение колен.\n\nКорона отправится в мою сокровищницу. Меч идет вниз по реке вместе со всеми остальными.\n\n#bold Певцы уже нашли ему имя: Лорен Последний. Носит, говорят, без жалоб. Он жив и слышит это — мудрость этого имени не требует объяснений.#!"
 fab_ac_west.0030.option1:0 "Здесь кончается королевская власть Лорена."
 fab_ac_west.0031:0 "Красный лев восстает"
 fab_ac_west.0031.desc:0 "Это было сделано в тени Скалы, которую он смирил. Лорд Кастамере преклонил колени знаменосца и поднялся до верховного лорда Западных земель и Хранителя Запада, чтобы удерживать запад от моего имени — первый Рейн, когда-либо превзошедший Ланнистера, и он хорошо это знает.\n\nЛорен Последний в свою очередь преклонил колени и воздал должное человеку, который был его вассалом две недели назад. Он выполнил это правильно, слово в слово и жест за жестом, с лицом, словно вырезанным из самой Скалы. Он хранит Утёс Кастерли и его золото, а его гордость сохраняет все, что может унести. Я вырастил верховного лорда, который обязан мне всем, и сверг короля, который будет завидовать мне до самой могилы — мои советники называют это честной сделкой, и со стороны Рейнов это определенно так.\n\nКрасные львиные знамена уже развеваются от Кастамере к морю. Золотой лев теперь пролетает над одним замком, и Запад потратит целое поколение на изучение нового порядка вещей — или на его проверку.\n\n#bold Золото и красный. Пока оба преклоняют колени, дракону не важно, какой лев рычит громче.#!"
 fab_ac_west.0031.option1:0 "Будь его шкура золотой или красной, у льва всё равно есть когти."
 fab_ac_west.0032:0 "Зеленая рука ломает дракона"
 fab_ac_west.0032.desc:0 "Армия Эйгона отступает за пределы Простора. Дороги, которые вели его завоевателей на юг, теперь несут сгоревшие повозки, раненых людей и разорванные знамена драконов обратно к Черноводной. Три дракона вошли в мое королевство. Ни один из них не выиграл.\n\nМы отказали Эйгону в битве, которую он хотел, разделили его меньшую армию и нанесли удар там, где его звери не могли быть повсюду одновременно. Каждая сожженная деревня поднимала против него новую роту; каждого павшего рыцаря заменили десять копейщиков с соседнего поля. Наконец даже драконы не смогли удержаться под армией, которая не переставала расти.\n\nКолокола Хайгардена звучат над Мандером. Корона Гарта Зеленорукого остается моей, и теперь весь Вестерос знает, что Таргариен не является воплощением судьбы. Дракон может истекать кровью. Дракон может потерпеть неудачу."
 fab_ac_west.0032.option1:0 "Нашей рукой!"
 fab_ac_west.0033:0 "Лев побеждает Дракона"
 fab_ac_west.0033.desc:0 "Последнее знамя Эйгона исчезло за пределами Золотого Зуба. Повелитель драконов, который пересек Вестерос, словно королевства были линиями на его Расписном столе, был изгнан из западных земель, а его армия разбита силой Скалы.\n\nБалерион омрачил наши небеса, драконий огонь опустошил наши поля, но Утёс Кастерли не открыл своих врат. Жители Запада, побежавшие с Огненного поля, вернулись, чтобы сражаться под львиным знаменем, и каждая победа привлекала все больше людей из шахты, холма и гавани. Эйгон узнал то, чего Харрен и Мерн так и не поняли: драконы внушают ужас, но один только ужас не может удержать королевство, решившее сопротивляться.\n\nКорона остается на моей голове. От Ланниспорта до Золотого Зуба колокола отвечают друг другу на холмах, и с запада доносится единственный крик — громче, чем взмах крыльев дракона."
 fab_ac_west.0033.option1:0 "У льва еще есть когти."
