l_russian:
 fab_ac_west.0001:0 "Покорение Расколотой Клешни"
 fab_ac_west.0001.desc:0 "Харрен погиб в оплавленных башнях, Король Бури повержен, но один упрямый уголок моего нового королевства ещё не признал моей власти: Расколотая Клешня, лабиринт болот, сосновых пустошей и потрескавшихся серых утёсов между заливом и Узким морем. Брюны, Боггсы, Крэббы, Харди — мелкие лорды полуразрушенных башен, никогда по-настоящему не покорявшиеся ни Харрену, ни прежним королям Бури. Народ, сделавший гордую бедность и упрямство почти религией.\n\nВисенья сама отправилась к ним на Вхагар, без сопровождения, требовать покорности. Она всегда понимала таких людей лучше меня, и они подтвердили её правоту. Лорды Расколотой Клешни бедны, но не слепы: они слышали о Харренхоле и знали, что против дракона им не устоять. Один за другим они выходили из болот и башен и складывали мечи у ног моей сестры. По её словам, без колебаний и едва ли не с гордостью: склониться перед валирийской королевой на драконе не так обидно, как перед соседом.\n\nМудрая Висенья дала им единственную награду, которой они дорожат: приняла под свою руку. Над ними не будет ни речного лорда, ни сюзерена из Королевских земель, ни иного посредника. Лорды Расколотой Клешни будут присягать лишь самому Железному трону.\n\n#bold Дикий край гордых бедняков, присягнувших прямо короне. Возможно, этим обещанием Висенья обрела больше верности, чем я — помилованиями в трёх королевствах.#!"
 fab_ac_west.0001.option1:0 "Они склоняются лишь перед драконом. Теперь идём на запад."
 fab_ac_west.0001.option_west_won:0 "Они преклоняют колени только перед драконом, как это уже делает Запад."
 fab_ac_west.0001.option_west_marching:0 "Они склоняются лишь перед драконом. Войско уже на западе."
 fab_ac_west.0001.desc.alt:0 "Трезубец завоёван, последние знамёна Харрена спущены, но один упрямый уголок моего нового королевства ещё не признал моей власти: Расколотая Клешня, лабиринт болот, сосновых пустошей и потрескавшихся серых утёсов между заливом и Узким морем. Брюны, Боггсы, Крэббы, Харди — мелкие лорды полуразрушенных башен, никогда по-настоящему не покорявшиеся ни Харрену, ни прежним королям Бури. Народ, сделавший гордую бедность и упрямство почти религией.\n\nВисенья сама отправилась к ним на Вхагар, без сопровождения, требовать покорности. Она всегда понимала таких людей лучше меня, и они подтвердили её правоту. Лорды Расколотой Клешни бедны, но не слепы: они знали судьбу королевства Харрена и знали, что против дракона им не устоять. Один за другим они выходили из болот и башен и складывали мечи у ног моей сестры. По её словам, без колебаний и едва ли не с гордостью: склониться перед валирийской королевой на драконе не так обидно, как перед соседом.\n\nМудрая Висенья дала им единственную награду, которой они дорожат: приняла под свою руку. Над ними не будет ни речного лорда, ни сюзерена из Королевских земель, ни иного посредника. Лорды Расколотой Клешни будут присягать лишь самому Железному трону.\n\n#bold Дикий край гордых бедняков, присягнувших прямо короне. Возможно, этим обещанием Висенья обрела больше верности, чем я — помилованиями в трёх королевствах.#!"
 fab_ac_west.0002:0 "Лев и Зелёная Рука"
 fab_ac_west.0002.desc:0 "Два великих короля запада наконец объединились против меня.\n\nИз Хайгардена выступает Мерн, девятый этого имени, из дома Гарденеров, король Простора. За ним — вся мощь плодороднейшего королевства Вестероса. У стен Золотой Рощи к нему присоединился Лорен Ланнистер, король Скалы, с войском Западных земель, вооружённым на золото Утёса Кастерли. Разведчики клянутся: вместе они собрали сильнейшее войско, какое видел Вестерос. Пятьдесят пять тысяч воинов, шестьсот больших и малых лордов под их знамёнами, свыше пяти тысяч закованных в доспехи рыцарей. Любви между королями нет: Скала и Простор тысячу лет воевали за пограничные земли. Но страх перед драконом сделал давних врагов братьями.\n\nИ ждать моего прихода они не собираются. Такое войско опустошает любую землю, на которой стоит. Они уже снялись с лагеря у Золотой Рощи и повернули на север, через высокие травы и золотую пшеницу, в поисках моего войска и битвы, которая разом завершит войну.\n\n#bold Два венценосных короля идут вместе. На каждого моего воина — пятеро их.#!"
 fab_ac_west.0002.option1:0 "Это может стать серьёзной угрозой."
 fab_ac_west.0003:0 "Лев и Зелёная Рука"
 fab_ac_west.0003.desc:0 "На столе совета разложены свежие письма. Каждое несёт одну и ту же невероятную весть. Харрен Чёрный погиб за стенами, которые считал несокрушимыми. Аргилак Дюррандон пал с мечом в руке. Две древние короны исчезли за время, за которое купец едва успеет доехать от Ланниспорта до Скалы.\n\nНа одном письме — зелёная рука Гарденеров. Король Мерн предлагает Простору и Скале встретить Эйгона вместе: соединить его бескрайние ряды копейщиков с моей тяжёлой конницей и золотой казной. Наши королевства поколениями спорили за пограничье, но спорить будет не о чем, если дракон отнимет обе короны.\n\nГордость велит стоять в одиночку. Расчёт даёт более мудрый совет. Вместе мы соберём величайшее войско Вестероса — и научим Эйгона, что трем чудовищам не удержать целый материк."
 fab_ac_west.0003.option1:0 "Передайте в Хайгарден: лев выступит вместе с рукой."
 fab_ac_west.0004:0 "Рука тянется на запад"
 fab_ac_west.0004.desc:0 "Каждый ворон с востока несёт весть о гибели чего-то древнего. Башни не укрыли Харрена от драконьего огня. Мужество не спасло корону Аргилака. Речные и Штормовые земли теперь подчиняются лорду, чьего войска едва хватило бы на один фланг моего.\n\nВ том и опасность. Эйгон доказал: поодиночке ни стены, ни доблесть не спасут. Если я буду ждать за Мандером, пока он уничтожает королевства одно за другим, величайшая сила Вестероса растратит себя в одиночной борьбе. Поэтому я созвал совет под зелёными знамёнами Хайгардена и написал письмо, которого прежде не позволяла написать гордость.\n\nЛорен Ланнистер располагает золотом и тяжёлой конницей Скалы. Я — урожаями, рыцарством и несметными копейщиками Простора. Наши отцы ссорились из-за границ. Нашим сыновьям не останется королевств в наследство, если лев и Зелёная Рука не встанут вместе сейчас."
 fab_ac_west.0004.option1:0 "Нашей рукой Простор даст ответ — и лев с нами."
 fab_ac_west.0005:0 "У дракона три головы"
 fab_ac_west.0005.desc:0 "Пусть у Двух Королей численное превосходство. У меня есть кое-что получше.\n\nМоё войско впятеро меньше их. Большую его часть составляют воины речных лордов, присягнувших мне едва полгода назад. Теперь им командует [fab_host_lord.GetTitledFirstName] из Девичьего Пруда. Этот дом одним из первых выступил против меня после высадки и заплатил жизнью прежнего лорда. Но клятву, принесённую среди разгрома, здесь соблюдают лучше многих добровольных, а полководческому искусству главы дома позавидовали бы лорды куда более высокого положения. [fab_host_lord.GetSheHe] знает, что мне нужно: не выиграть бой, а удержать строй, пока победу одерживает небо. Пусть моё войско меньше — движется оно вдвое быстрее. Поле выберу я, а не противник.\n\nВ остальном эту битву выиграют трое. До сих пор мы с сёстрами наносили удары порознь: Висенья — в Расколотой Клешне, Рейнис — в Последней Буре; каждый дракон вёл свою войну. Теперь будет иначе. Против пятидесяти пяти тысяч мы не станем разделять силы. Балерион, Вхагар и Мераксес впервые со времени нашего отлёта с Драконьего Камня поднимутся вместе над одним полем.\n\n#bold Два Короля думают, что идут сражаться с войском. Они идут узнать, что такое три дракона.#!"
 fab_ac_west.0005.option1:0 "Немедленно пошлите сообщение королеве Висенье и королеве Рейнис."
 fab_ac_west.0005.desc.early:0 "Пусть у Двух Королей численное превосходство. У меня есть кое-что получше.\n\nМоё войско впятеро меньше их. Большая его часть присягнула мне лишь после высадки. Теперь им командует [fab_host_lord.GetTitledFirstName] из Девичьего Пруда. Этот дом одним из первых выступил против меня после высадки и заплатил жизнью прежнего лорда. Но клятву, принесённую среди разгрома, здесь соблюдают лучше многих добровольных, а полководческому искусству главы дома позавидовали бы лорды куда более высокого положения. [fab_host_lord.GetSheHe] знает, что мне нужно: не выиграть бой, а удержать строй, пока победу одерживает небо. Пусть моё войско меньше — движется оно вдвое быстрее. Поле выберу я, а не противник.\n\nВ остальном эту битву выиграют трое. После высадки мы с сёстрами чаще летали порознь, чем вместе; каждый дракон вёл свою войну. Теперь будет иначе. Против пятидесяти пяти тысяч мы не станем разделять силы. Балерион, Вхагар и Мераксес впервые со времени нашего отлёта с Драконьего Камня поднимутся вместе над одним полем.\n\n#bold Два Короля думают, что идут сражаться с войском. Они идут узнать, что такое три дракона.#!"
 fab_ac_west.0006:0 "Под лесом знамён"
 fab_ac_west.0006.desc:0 "Перевалы за нами забиты людьми, конями, повозками и развевающимися багряными знамёнами. На мой зов ответил каждый лорд Западных земель. Впереди, через Простор, идёт Мерн Гарденер под ещё более густым лесом зелёных стягов. Объединившись, наши войска составят пятьдесят пять тысяч воинов — крупнейшую армию в истории материка.\n\nСил у Эйгона едва пятая часть от наших. Его люди воюют без отдыха, вдали от Драконьего Камня, в окружении враждебных королевств. Даже драконы устают; им нужно садиться на землю и есть. Если охватить его достаточно широко, ударить достаточно сильно и отрезать отступление, превосходство в людях скажется.\n\nУ костров командиры говорят уверенно. Я дважды проверил собственные расчёты. Численный перевес по-прежнему подавляющий."
 fab_ac_west.0006.option1:0 "Трубите выступление. Пусть Эйгон считает наши знамёна."
 fab_ac_west.0007:0 "Дракон идёт на Простор"
 fab_ac_west.0007.desc:0 "Разведчики достигли лагеря до рассвета: Эйгон пересёк Черноводную и повернул на юго-запад, в Простор. Его главное войско идёт по дорогам вдоль рек, а флот следует рядом у побережья. Над центром летит Балерион; впереди Вхагар и Мераксес жгут дозорные башни и рассеивают отряды, посланные задержать продвижение. Впервые за войну все трое Таргариенов и все три дракона выступают вместе.\n\nЕго цель ясна: навязать бой прежде, чем Лорен объединит западное войско с моим, а затем уничтожить наши королевства порознь, как он уничтожил Харрена и Аргилака. Я приказал знамёнам Простора собраться у Золотой Рощи, на пересечении дорог из Хайгардена и Утёса Кастерли. Лорен уже миновал Золотой Зуб и ведёт на восток всех всадников, которых могут выставить Западные земли.\n\nКогда войска соединятся, под зелёной рукой и золотым львом встанут пятьдесят пять тысяч воинов. Почти пятеро на каждого воина Эйгона, тысячи рыцарей в доспехах и столько лучников, что их стрелы затмят небо. От драконов не укрыться за камнем. Мы растянемся по открытому полю, не дадим им единой цели и охватим малочисленное войско Эйгона со всех сторон."
 fab_ac_west.0007.option1:0 "Созвать все знамёна к Золотой Роще. Встретим дракона вместе."
 fab_ac_west.0009:0 "Два короля"
 fab_ac_west.0009.desc:0 "Мои королевы прибыли: Рейнис — из Штормового Предела, Висенья — из Расколотой Клешни. Вместе мы опередили Двух Королей и заняли выбранное мной место: широкую открытую равнину к югу от Черноводной, где однажды пройдёт Золотая дорога. Нет возвышенности, как у Ориса в Последнюю Бурю. Нет стен, нет рек, не на что опереть строй. Мерн намерен охватить оба фланга и пробить центр железным кулаком. Здесь ему вполне может это удаться.\n\nНо стоит приглядеться к земле, как пригляделся я: от горизонта до горизонта — высокая трава и пшеница, поспевшая к жатве. Две недели не было дождя. День безоблачный. И ветреный.\n\n#bold На их стороне численность. На нашей — небо. А само поле — оружие, которое ждёт своего часа.#!"
 fab_ac_west.0009.option1:0 "Выстроить войско полумесяцем. И ждать."
 fab_ac_west.0010:0 "Последний урожай"
 fab_ac_west.0010.desc:0 "Наш натиск смял их первый ряд. Я видел, как копейщики Эйгона подались под тяжестью войска Простора, слышал крики тысяч людей под зелёной рукой и знал: расчёт был верен. Его войско слишком мало. Его Завоевание закончится здесь.\n\nЗатем Балерион спустился сквозь тучу стрел. Вхагар прилетела с востока, Мераксес — с запада. Они жгли не людей, а сухие поля вокруг них. Летняя пшеница стала стеной пламени. Ветер погнал огонь через наш тыл, а драконье пламя захлестнуло передние ряды, заперев конных и пеших под почерневшим небом. Доспехи раскалялись докрасна на живых людях. Вспыхнули знамёна. Горела сама земля под нами.\n\nМои сыновья погибли. Мои братья погибли. Куда ни посмотрю, ещё одна зелёная рука падает в огонь. Десять тысяч лет крови Гарденеров заканчиваются здесь — одним урожаем пепла."
 fab_ac_west.0010.option1:0 "Зелёная рука горит..."
 fab_ac_west.0011:0 "Железный кулак"
 fab_ac_west.0011.desc:0 "Они двинулись под звуки труб, под морем знамён. Не стану отрицать: зрелище было великолепным. Сам король Мерн на золотистом жеребце повёл атаку на мой центр. Рядом его сын Гавен нёс огромную зелёную руку на белом поле. Под рёв рогов и барабанов рыцари Простора и Скалы пронеслись сквозь град стрел и обрушились на наши ряды. Строй не выдержал. Копейщиков, выстроенных полумесяцем, смело словно мякину. Центр был разбит, железный кулак прорвался, и пятьдесят пять тысяч глоток взревели о победе.\n\nМоим людям надо было отступить под натиском, но не рассыпаться. Джон Мутон удерживает остатки строя, а его лучники уже отходят против ветра, в точности по приказу.\n\nК тому времени мы с сёстрами уже были в воздухе.\n\n#bold Я поднял Балериона сквозь бурю копий, камней и стрел. По бокам взмыли Вхагар и Мераксес. Под нами — всё гордое войско Двух Королей на пшеничном поле, сухом, как трут.#!"
 fab_ac_west.0011.option1:0 "#S Дракарис! #!"
 fab_ac_west.0012:0 "Огненный дождь"
 fab_ac_west.0012.desc:0 "Верхом на Балерионе я прошёл вдоль вражеских рядов так низко, что ощущал удары стрел о его чешую, и снова и снова заливал железный кулак пламенем. Но победу принесли мои королевы. Рейнис и Висенья зажгли поля с наветренной стороны и за спинами врагов. Сухая трава и нежатая пшеница вспыхнули разом, огонь бежал быстрее человека.\n\nОстальное сделал ветер. Он раздул пламя в стены и погнал дым в лица наступающим. Запах огня сводил коней с ума. В густом дыму слепли и кони, и всадники. Натиск, призванный сокрушить меня, распался на десять тысяч людей, бредущих на ощупь сквозь пылающий туман. Со всех сторон поднялись огненные стены. Гордое море знамён стало морем пламени.\n\nС наветренной стороны, в безопасности, ждали воины лорда Мутона с луками и копьями. Они быстро расправлялись с обожжёнными и ещё горящими людьми, которые шатаясь выбирались из ада.\n\n#bold Пятьдесят пять тысяч воинов. Два Короля привели их вовсе не на битву со мной. Они привезли мне растопку.#!"
 fab_ac_west.0012.option1:0 "Сжечь поле."
 fab_ac_west.0013:0 "Пламенное поле"
 fab_ac_west.0013.desc:0 "Пламенное поле — так его уже называют. Другого такого не будет.\n\nБольше четырёх тысяч погибло в пламени, ещё тысяча — от мечей, копий и стрел. Десятки тысяч обожжены, иные так страшно, что унесут шрамы в могилу. Среди мёртвых — король Мерн Девятый, его сыновья, внуки, братья и кузены. Зелёную руку выжгли с корнем. Одного племянника извлекли из пепла живым, но мейстеры дают ему считаные дни. С его смертью погибнет и дом Гарденеров, потомков Гарта Зеленорукого, древнейший королевский род Вестероса.\n\nЛорен Ланнистер жив. Поняв, что битва проиграна, король Скалы развернул коня и проскочил прямо сквозь стену пламени и дыма. Смелее в тот день не поступил никто, даже я в своей атаке. Теперь его ищут мои разъезды.\n\nНаше войско потеряло меньше сотни. Стрела ранила Висенью в плечо; она сама выдернула её и назвала рану царапиной. Драконы объедаются мертвецами.\n\n#bold Я велел собрать все мечи павших и отправить вниз по реке, в Эйгонову крепость. Груда растёт.#!"
 fab_ac_west.0013.option1:0 "Соберите мечи убитых."
 fab_ac_west.0014:0 "Поле в огне"
 fab_ac_west.0014.desc:0 "По всем законам войны мы уже победили. Авангард смял ряды Эйгона, конница обошла фланги, десятки тысяч теснили врага под львом и зелёной рукой. Затем Балерион взмыл к солнцу, а рядом с ним — Вхагар и Мераксес. И все расчёты потеряли смысл.\n\nДраконы не выжигали наши шеренги одну за другой. Они подожгли сухую траву у нас за спиной, обратив в оружие сам ветер. Пламя мчалось быстрее коней. Люди бросали мечи и пытались сорвать горящие доспехи. Король Мерн мёртв, с ним его сыновья и братья. Древний дом Гарденеров погиб за один день.\n\nЯ спасся в дыму, достаточно густом, чтобы скрыть даже короля. Скоро всадники Эйгона меня найдут. Можно отдать корону и сохранить свой дом. А можно бежать в Утёс Кастерли и доверить его горным стенам защиту от огня, уничтожившего Харренхол."
 fab_ac_west.0014.option1:0 "Живой лев может снова зарычать. Я отдам корону."
 fab_ac_west.0014.option2:0 "Утёс Кастерли ещё не пал ни разу. Испытаю его стены драконьим огнём."
 fab_ac_west.0020:0 "Сложенная зелёная корона"
 fab_ac_west.0020.desc:0 "Война проиграна, хотя зелёные поля и не стали погребальным костром. Отряды рассеяны, дороги открыты врагу, а каждый новый ворон несёт вопрос очередного лорда: спасёт ли Простор ещё одна битва или лишь отдаст драконам на съедение новых сыновей? Как ни горек ответ, я его знаю.\n\nПеред лагерем Эйгона я снимаю корону, унаследованную от Гарта Зеленорукого, и кладу к его ногам. Он забирает корону, но оставляет мне Хайгарден, мой род и власть над Простором под своим новым троном. Так десять тысяч лет королевской власти Гарденеров завершаются не гибелью рода, а покорностью.\n\nМожно пожертвовать короной, чтобы спасти народ. Поля засеют вновь. Мандер продолжит течь, и зелёная рука будет жить без короны."
 fab_ac_west.0020.desc.submit:0 "Я выбрал жизнь Простора, а не королевскую гордость. Прежде чем драконий огонь превратит наши поля в пепел, я снимаю корону, унаследованную от Гарта Зеленорукого, и кладу к ногам Эйгона Таргариена. Он забирает корону, но оставляет мне Хайгарден, мой род и власть над Простором под своим новым троном.\n\nМоей рукой завершаются десять тысяч лет королевской власти Гарденеров. Но поля засеют вновь. Мандер продолжит течь, и зелёная рука будет жить без короны."
 fab_ac_west.0020.option1:0 "Нашей рукой Простор выстоит."
 fab_ac_west.0021:0 "Последний король Скалы"
 fab_ac_west.0021.desc:0 "Земля ещё дышит жаром, когда меня приводят к Эйгону Таргариену. За ним ждёт Балерион, сложив чёрные крылья. Над останками величайшего войска Вестероса кружит пепел. Никто не угрожает. В этом нет нужды.\n\nЯ снимаю золотую корону Скалы и вместе с мечом кладу к ногам завоевателя. Эйгон принимает мою покорность, возвращает меч и утверждает меня лордом Утёса Кастерли и Хранителем Запада. Корона утрачена, но земли, дети и власть дома Ланнистеров сохранены.\n\nГарденеры поставили на кон всё и не оставили наследника, который мог бы их оплакать. Я купил будущее своего дома ценой короны. Ланнистер платит долги. Я запомню и сегодняшнюю милость, и назначенную за неё цену."
 fab_ac_west.0021.desc.submit:0 "Утёс Кастерли ещё не пал ни разу. Но я не стану жертвовать жизнями людей Запада лишь ради испытания его стен драконьим огнём. По собственной воле я снимаю золотую корону Скалы и вместе с мечом кладу к ногам Эйгона Таргариена.\n\nОн возвращает меч и утверждает меня лордом Утёса Кастерли и Хранителем Запада. Корона утрачена, но земли, дети и власть дома Ланнистеров сохранены. Я купил будущее своего дома ценой короны. А Ланнистеры всегда платят долги."
 fab_ac_west.0021.option1:0 "Корона потеряна. Утёс и его львы выстоят."
 fab_ac_west.0022:0 "Замок без короля"
 fab_ac_west.0022.desc:0 "Король мёртв. Его сыновья, братья, кузены — все, кто отправился на проклятое поле под зелёной рукой, мертвы. За один огненный день дом Гарденеров исчез с лица земли.\n\nЯ вёл счета, хранил припасы и ключи этого замка, как мои предки при прежних королях. Теперь Хайгарден в моих руках, но короля, которому я мог бы его сберечь, больше нет. Войско завоевателя идёт по Розовой дороге. В Просторе не осталось сил, способных даже задержать его, не то что остановить.\n\nМожно открыть ворота и вручить дракону нетронутую жемчужину. А можно запереться и превратить Хайгарден в погребальный костёр уже мёртвой династии."
 fab_ac_west.0022.option1:0 "Откройте ворота. Хайгарден должен жить."
 fab_ac_west.0022.option2:0 "Заприте ворота в память о короле Мерне!"
 fab_ac_west.0023:0 "Награда управляющему"
 fab_ac_west.0023.desc:0 "Я передал завоевателю Хайгарден невредимым: ворота открыты, амбары полны, люди не пролили крови. А он отдал замок мне.\n\nЛорд Хайгардена. Верховный лорд Мандера. Хранитель Юга. Титулы, о которых роду управляющих и мечтать не полагалось. Половина древних домов Простора подавится каждым из них. Они скакали на Пламенное поле, а мой дом сберёг замок и позаботился об урожае. Именно это Простору всегда было нужно от правителей.\n\nДом Тиреллов всем обязан дракону. Мы этого не забудем."
 fab_ac_west.0023.option1:0 "Вырастая — крепнем."
 fab_ac_west.0024:0 "Новый лорд Простора"
 fab_ac_west.0024.desc:0 "Когда наше войско показалось у Хайгардена, ворота уже были открыты, а стены пусты. Харлан Тирелл, наследственный верховный управляющий Простора, вышел навстречу пешком и без единого обнажённого меча сдал величайший замок юга: ключи, гарнизон и всю казну. Зелёная рука сгорела на Пламенном поле; её управляющий не видел смысла гореть следом.\n\nТеперь я волен пожаловать величайшую твердыню юга кому захочу. На совете звучат три имени. Харлан Тирелл: его дом поколениями управлял Простором, пока Гарденеры носили корону. Каждый лорд Мандера знает его печать и справедливость; управляющий, возвышенный рукой короля, не станет источником притязаний на престол. Лорд Пик из Звёздного Пика — гордый и суровый, потомок Гарденеров по древним бракам, владелец пограничных земель, сторожащих Дорн. Его поддерживают советники, не доверяющие выскочкам из замковой прислуги. Третьего кандидата я не рассчитывал застать живым: племянник Мерна, последний потомок Гарта Зеленорукого, вынесенный с Пламенного поля с такими ожогами, что мейстеры дивятся, как он ещё дышит. Отдать мальчику сад — и зелёная рука расцветёт вновь. Если он выживет. И если завоёванная огнём держава склонится перед тем, кого огонь едва не уничтожил.\n\nОдна сила Простора ещё стоит в стороне: Старомест. Хайтауэры укрылись за стенами богатейшего города Вестероса и не выказывают ни неповиновения, ни покорности. Лишь молчат и наблюдают с башен. Старик Староместа ждёт, пока откроется воля богов. Пусть подождёт ещё.\n\n#bold Саду нужен хранитель. И выбрать его должен дракон.#!"
 fab_ac_west.0024.option1:0 "Роза будет заботиться о Просторе."
 fab_ac_west.0024.option2:0 "Звёздный Пик хранил мой мир в Марках. Пики будут хранить Простор."
 fab_ac_west.0024.option3:0 "Зелёная рука вновь обретёт силу. Возвысить последнего Гарденера."
 fab_ac_west.0025:0 "Возвышение розы"
 fab_ac_west.0025.desc:0 "Всё свершилось в великом зале Хайгардена, под знамёнами, ещё слегка пахнувшими дымом. Харлан Тирелл преклонил колено управляющим, а я собственноручно поднял его лордом Хайгардена, верховным лордом Мандера и Хранителем Юга, чтобы он правил всем Простором от моего имени.\n\nГоворят, он плакал — но не при мне. Со времён зелёных королей его дом хранил этот сад для чужих корон. Теперь сад принадлежит им, а служить они будут моей. Лорды Мандера присягали один за другим. Одни охотно — они знают его справедливость. Другие смотрели на выжженные поля и благоразумно держали мысли при себе. Флоренты из Ясноводной крепости преклонили колени последними и склонились ниже всех. Не думаю, что они забудут этот порядок. Я тоже не забуду.\n\nПозже, без огласки, я уладил ещё одно дело: обожжённого мальчика, племянника Мерна, поручил мейстерам, велев окружить его всей доступной заботой. То, что начал огонь, людям уже не исправить. Зелёная рука угаснет на ложе больного в Хайгардене, под присмотром слуг дома, унаследовавшего её сад.\n\n#bold Роза будет хранить то, что посадила зелёная рука. И всегда помнить, кто даровал ей сад.#!"
 fab_ac_west.0026:0 "Замок в Марках"
 fab_ac_west.0026.desc:0 "Всё свершилось в великом зале Хайгардена, под чужими для него знамёнами. Лорд Пик из Звёздного Пика преклонил колено лордом Марок, а поднялся лордом Хайгардена, верховным лордом Мандера и Хранителем Юга. Весь Простор он будет держать от моего имени.\n\nДоводы советников были весомы: древний род, дважды породнившийся с Гарденерами, сильная крепость в Марках, веками сторожившая Дорн, и твёрдость, которая пригодится мягкому зелёному сердцу Простора в задуманные мной годы. Лорды присягали по очереди. Но я заметил, как многие поглядывали на молчаливого Харлана Тирелла: управляющего, который открыл ворота и получил назад лишь свою должность. За розой Пику придётся следить столь же пристально, как за песками Дорна.\n\nПозже, без огласки, я уладил ещё одно дело: обожжённого мальчика, племянника Мерна, поручил мейстерам, велев окружить его всей доступной заботой. То, что начал огонь, людям уже не исправить. Зелёная рука угаснет на ложе больного в Хайгардене, в замке, отныне подчинённом Звёздному Пику.\n\n#bold Гордый, суровый и связанный со мной благодарностью. Марки пришли в сад.#!"
 fab_ac_west.0027:0 "Зелёная рука выстояла"
 fab_ac_west.0027.desc:0 "Всё свершилось в великом зале Хайгардена, и половина двора плакала при этом зрелище. Племянник короля Мерна, [fab_gardener_nephew.GetFirstName], последний потомок Гарта Зеленорукого, был внесён на помост на носилках. Сам он ещё не мог стоять и вместо коленопреклонения лишь склонил голову. Я возвысил его до лорда Хайгардена, верховного лорда Мандера и Хранителя Юга: пусть от моего имени держит сад, посаженный предками.\n\nМейстеры говорят прямо: он может не дожить до конца года. Огонь, забравший его короля и родичей, не столько пощадил его, сколько согласился подождать. Но клятву он произнёс твёрдым голосом. Затем лорды Простора вновь преклонили колени перед Гарденером — искренне, все до одного, как не заставило бы преклониться никакое пожалование завоевателя. Если Семеро даруют ему годы, зелёная рука возродится под мирной властью дракона. Если нет, никто не скажет, будто Эйгон Таргариен позволил роду зелёных королей угаснуть на одре болезни, раздавая его сад за спиной у умирающего.\n\nХарлан Тирелл остаётся управляющим и служит мальчику, как его дом служил Гарденерам триста лет. Кажется, кое-что переживает даже драконий огонь.\n\n#bold Зелёная рука, возрождённая из пепла. Певцам будет о чём петь.#!"
 fab_ac_west.0029:0 "Западу нужен лорд"
 fab_ac_west.0029.desc:0 "Короля Скалы схватили на следующий день после битвы. Он просит позволения преклонить колено. Но прежде чем я подниму его, советники предлагают взвесить, кого именно я возвышаю.\n\nЛорен Ланнистер выступил против меня рядом с Мерном Гарденером, с войском, вооружённым на всё золото запада. В отличие от Мерна, он жив: хватило ума проскакать СКВОЗЬ огонь, а не остаться в нём. Человек гордый, способный, а лорды Западных земель давно привыкли подчиняться Скале. Подтверди его власть — и запад за один день сменит верховного властителя, больше не доставляя мне хлопот.\n\nНо звучат и другие голоса. Рейны из Кастамере — вторая сила запада: красные львы против золотых, богатые рудниками и гордые пуще принцев. Они быстро, очень быстро зашептали, что короля, воевавшего с драконом, лучше заменить домом, который будет всем дракону обязан. Есть мудрость в возвышении лорда, связанного одной благодарностью. Но несомненно и другое: Скала не забывает обид.\n\n#bold Золотой лев или красный. Запад в любом случае преклонит колени. Вопрос лишь в том, перед кем — сперва.#!"
 fab_ac_west.0029.option1:0 "Лорен преклонил колено, пока ещё мог выбирать. Подтвердить его власть над Утёсом."
 fab_ac_west.0029.option2:0 "Красный лев, всем мне обязанный. Возвысить дом Рейнов."
 fab_ac_west.0030:0 "Хранитель Запада"
 fab_ac_west.0030.desc:0 "Короля Скалы схватили на следующий день после битвы, менее чем в дне пути от поля. Он не сопротивлялся. Сквозь огонь он пробился ради ещё одной ночи свободы. Думаю, эту ночь он провёл, решая, каким предстанет передо мной утром.\n\nГордым, как оказалось. Лорен Ланнистер явился с прямой спиной и ещё закопчённым плащом, положил меч и корону к моим ногам, преклонил колено и присягнул мне как королю всего Вестероса. Первый из великих королей, сделавший это, пока ещё был жив и мог выбирать. Верный обещанию, данному Вестеросу, я собственноручно поднял побеждённого врага. Он сохраняет земли и власть: отныне лорд Утёса Кастерли, уже не король, а также Хранитель Запада, правящий Западными землями от моего имени. Вслед за ним преклонили колени вассалы, затем — вереница уцелевших лордов Простора. Каждый радовался больше предыдущего тому, как легко я принимаю покорность.\n\nКорона отправится в мою сокровищницу. Меч — вниз по реке, вместе с остальными.\n\n#bold Певцы уже дали ему имя: Лорен Последний. Говорят, он носит его без жалоб. Он остался жив, чтобы слышать это имя. Мудрость такого выбора не нуждается в объяснении.#!"
 fab_ac_west.0030.option1:0 "Здесь кончается королевская власть Лорена."
 fab_ac_west.0031:0 "Возвышение красного льва"
 fab_ac_west.0031.desc:0 "Всё свершилось в тени Скалы, которую унизило это решение. Лорд Кастамере преклонил колено вассалом, а поднялся верховным лордом Западных земель и Хранителем Запада, чтобы править от моего имени. Первый Рейн, поставленный выше Ланнистера, — и он прекрасно это понимает.\n\nЗатем Лорен Последний присягнул человеку, который две недели назад был его вассалом. Всё исполнено безукоризненно: каждое слово, каждый жест. Лицо словно высечено из самой Скалы. Он сохраняет Утёс Кастерли и золото, а его гордости остаётся то, что она способна вынести. Я возвысил лорда, обязанного мне всем, и низложил короля, который будет ненавидеть меня до могилы. Советники называют обмен справедливым; с точки зрения Рейнов — безусловно.\n\nКрасные львы уже реют от Кастамере до моря. Золотой лев — теперь лишь над одним замком. Целое поколение запад будет привыкать к новому порядку или испытывать его на прочность.\n\n#bold Золото и багрянец. Пока оба льва преклоняют колени, дракону неважно, кто рычит громче.#!"
 fab_ac_west.0031.option1:0 "Будь его шкура золотой или красной, у льва всё равно есть когти."
 fab_ac_west.0032:0 "Зелёная Рука сокрушает дракона"
 fab_ac_west.0032.desc:0 "Войско Эйгона отступает за границы Простора. По дорогам, что вели завоевателей на юг, теперь тянутся к Черноводной обгоревшие повозки, раненые и порванные драконьи знамёна. Три дракона вступили в моё королевство. Ни один его не завоевал.\n\nМы не дали Эйгону желанной битвы, раздробили его малочисленное войско и били там, где не было его чудовищ: повсюду сразу они быть не могли. Каждая сожжённая деревня поднимала новый отряд; каждого павшего рыцаря заменяли десять копейщиков с соседнего поля. Наконец даже драконы не смогли удерживать землю перед непрерывно растущей армией.\n\nНад Мандером звонят колокола Хайгардена. Корона Гарта Зеленорукого остаётся моей. Весь Вестерос знает теперь, что Таргариен — не воплощённый рок. Дракон может истекать кровью. Дракон может проиграть."
 fab_ac_west.0032.option1:0 "Нашей рукой!"
 fab_ac_west.0033:0 "Лев побеждает дракона"
 fab_ac_west.0033.desc:0 "Последние знамёна Эйгона скрылись за Золотым Зубом. Драконий владыка, пересекавший Вестерос так, словно королевства были лишь линиями на Расписном столе, изгнан из Западных земель. Его войско разбилось о мощь Скалы.\n\nБалерион затмевал небо, драконий огонь выжигал поля, но Утёс Кастерли не открыл ворот. Люди Запада, бежавшие с Пламенного поля, вернулись под львиное знамя. Каждая победа приводила новых воинов из рудников, с холмов и из гаваней. Эйгон усвоил то, до чего Харрен и Мерн не дожили: драконы внушают ужас, но одним ужасом не удержать королевство, решившее сопротивляться.\n\nКорона по-прежнему на моей голове. От Ланниспорта до Золотого Зуба колокола перекликаются среди холмов, и над западом поднимается единый клич, громче взмахов драконьих крыльев."
 fab_ac_west.0033.option1:0 "У льва ещё есть когти."
