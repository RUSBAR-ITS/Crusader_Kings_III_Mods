 fab_crowned_seven_desc:0 "Вера учит, что единый бог являет семь ликов: Отца, Матери, Воина, Девы, Кузнеца, Старицы и Неведомого. Служение совершается в септах под руководством септонов и верховного септона. В основе учения и благочестия лежит «Семиконечная звезда»."
