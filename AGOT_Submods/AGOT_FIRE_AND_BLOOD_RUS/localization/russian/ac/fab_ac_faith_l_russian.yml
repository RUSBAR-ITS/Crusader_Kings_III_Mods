 fab_crowned_seven_desc:0 "Вера учит, что у одного бога семь лиц: Отец, Мать, Воин, Девушка, Кузнец, Старица и Неведомый. Поклонение ему регулируется септами, септонами и авторитетом Верховного септона, при этом Семиконечная звезда находится в центре доктрины и преданности."
