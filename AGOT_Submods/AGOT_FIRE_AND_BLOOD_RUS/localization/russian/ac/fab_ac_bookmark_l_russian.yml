l_russian:
 fab_bm_group_dragon:0 "Дом Дракона"
 fab_bm_conquest:0 "Завоевание Эйгона"
 fab_bm_conquest_desc:0 "2 год до З.Э. Вестерос разделён на семь враждующих королевств. Семь гордых корон воюют друг с другом со времён прихода андалов. На дымящемся острове у восточного побережья молодой лорд изучает расписной стол, вырезанный в форме целого материка, — и смотрит на запад.\n\nУ Эйгона Таргариена нет ни огромного войска, ни богатой казны, ни древних прав на трон. У него есть Драконий Камень, две сестры-королевы и три дракона — последние драконы во всём мире и единственный довод, который ему когда-либо понадобится. Балерион Чёрный Ужас, Вхагар и Мераксес против объединённой мощи Вестероса: арфисты будут называть это безумием до той самой минуты, когда назовут судьбой.\n\n#bold Семь королевств. Одна мечта дракона. Пламя и кровь.#!"
 bookmark_fab_aegon:0 "Лорд Эйгон Таргариен"
 bookmark_fab_aegon_desc:0 "[Concept( 'story_content_fab_aegon', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_fab_aegon', '$bm_story_content_available_copy|q$' )|E]\nЛорд Драконьего Камня остаётся загадкой даже для тех, кто его любит: замкнутый, задумчивый человек, который принимает советы лишь от двух своих сестёр-жён и, как шепчутся, видит во сне ещё не случившееся. Теперь загадка обрела ответ, и этот ответ — завоевание. Верхом на Балерионе Чёрном Ужасе, с Висеньей и Рейнис по сторонам, Эйгон намерен превратить семь королевств в одно.\n\n#bold Начинается война Завоевателя. Кем его запомнит история: человеком, объединившим Вестерос, или безумцем, сгинувшим среди его копий?#!"
 bookmark_fab_aegon_subheading:0 "Последний драконий владыка"
 bookmark_fab_visenya:0 "Висенья, королева и всадница дракона"
 bookmark_fab_visenya_subheading:0 "Всадница Вхагар"
 bookmark_fab_rhaenys:0 "Рейнис, королева и всадница дракона"
 bookmark_fab_rhaenys_subheading:0 "Всадница Мераксес"
 bookmark_fab_harren:0 "Харрен Хоар, Чёрный Король"
 bookmark_fab_harren_desc:0 "Сорок лет дом Хоаров обескровливал Речные земли, возводя Харренхолл — величайший замок, какой видел мир. Теперь его башни наконец достроены. Харрен Чёрный стар, жесток и совершенно уверен: ни одна армия не пробьёт эти стены, а ни одному живущему королю не хватит сил даже попытаться.\n\n#bold Но погибель Харренхолла прилетит на крыльях. Сумеет ли король железнорождённых избежать пламени, уготованного ему историей?#!"
 bookmark_fab_harren_subheading:0 "Король Островов и Рек"
 bookmark_fab_torrhen:0 "Король Торрхен Старк"
 bookmark_fab_torrhen_desc:0 "Север помнит тысячу лет королей Старков, и Торрхен намерен остаться верным каждому из них. Когда придут драконы, он созовёт знамёна и поведёт тридцать тысяч воинов на юг — к речному берегу, где придётся поставить на одну чашу весов древнейшую корону Вестероса, а на другую — жизни всех, кто стоит за его спиной.\n\n#bold История назовёт его Преклонившим Колено. Но история ещё не написана: преклоните ли вы колени или Север сгорит, но не покорится?#!"
 bookmark_fab_torrhen_subheading:0 "Король Севера"
 bookmark_fab_meria:0 "Принцесса Мерия Мартелл"
 bookmark_fab_meria_desc:0 "Слепая, страдающая подагрой, почти восьмидесятилетняя — и опаснее любого рыцаря в своих песчаных владениях. Мерия Мартелл, Жёлтая Жаба Дорна, пережила всех соперников, когда-либо смеявшихся над ней. Она не встретит драконов в открытом поле: за неё будут сражаться сами пески, а Дорн невозможно покорить, если его не найти.\n\n#bold «Вы можете нас сжечь, миледи, но не согнуть, не сломить и не заставить склониться». Докажите это.#!"
 bookmark_fab_meria_subheading:0 "Принцесса Дорна"
 bookmark_fab_loren:0 "Король Лорен Ланнистер"
 bookmark_fab_loren_desc:0 "Золото Утёса Кастерли сделало Лорена Ланнистера богатейшим королём Вестероса, но никакие сокровища не купят защиту от драконьего пламени. За его спиной — Западные земли, рядом — Простор. Последний Король Скалы ведёт войско, способное похоронить менее грозных завоевателей под своими знамёнами.\n\n#bold Сумеет ли Лорен превратить Пламенное Поле в могилу честолюбивых замыслов Эйгона и сохранить над Скалой корону Ланнистеров?#!"
 bookmark_fab_loren_subheading:0 "Король Скалы"
 bookmark_fab_mern:0 "Король Мерн IX Гарденер"
 bookmark_fab_mern_desc:0 "Дом Гарденеров правит из Хайгардена с рассвета легендарных времён, и Мерн IX не намерен стать королём, при котором увянет этот древний род. Простор может выставить больше мечей, чем любое другое королевство Вестероса, а союз с Лореном Ланнистером даёт Мерну войско сокрушительной силы. Но даже самый богатый урожай может погибнуть в огне.\n\n#bold Сумеет ли последний король Гарденеров разбить драконов и сохранить зелёную корону Простора?#!"
 bookmark_fab_mern_subheading:0 "Король Простора"
 bookmark_fab_argilac:0 "Король Аргилак Дюррандон"
 bookmark_fab_argilac_desc:0 "[Concept( 'story_content_fab_argilac', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_fab_argilac', '$bm_story_content_available_copy|q$' )|E]\nАргилак Надменный стар, но воин, некогда разгромивший дорнийское вторжение, не утратил своей ярости. В ответ на предложение земель и брачного союза Эйгон Таргариен предложил его единственной дочери руку бастарда — оскорбление, которого не стерпел бы ни один Король Бури. Теперь надвигающаяся буря обрушится на драконов.\n\n#bold Сбросит ли Аргилак захватчиков обратно в Узкое море или дом Дюррандонов погибнет вместе со своим последним королём?#!"
 bookmark_fab_argilac_subheading:0 "Король Бури"
 bookmark_fab_argella:0 "Принцесса Аргелла Дюррандон"
 bookmark_fab_argella_subheading:0 "Дочь Короля Бури"
 bookmark_fab_ronnel:0 "Король Роннел Аррен"
 bookmark_fab_ronnel_desc:0 "Роннел Аррен носит древнюю корону ещё ребёнком, оставив управление Горой и Долиной в умелых руках своей матери Шарры. Кровавые Ворота и высоты Орлиного Гнезда смиряли всех захватчиков, ступавших по земле. Но королевам Эйгона не нужны дороги, а их драконы способны взмыть над самыми крепкими стенами.\n\n#bold Сумеют ли мальчик-король и его регентша удержать Долину вне досягаемости Завоевателя?#!"
 bookmark_fab_ronnel_subheading:0 "Король Горы и Долины"
 bookmark_fab_sharra:0 "Королева Шарра Аррен"
 bookmark_fab_sharra_subheading:0 "Леди-регент Долины"
 game_concept_story_content_fab_aegon:0 "$game_concept_story_generic_prefix$ $bookmark_fab_aegon$"
 game_concept_story_content_fab_aegon_desc:0 "#tooltip_heading Объём сюжета: большой#!\n\nИграя за Эйгона Таргариена, вы будете завоёвывать Вестерос королевство за королевством. Сценарные события проведут вас от высадки у Черноводной до Харренхолла, Пламенного Поля, преклонившего колено короля Севера и долгой изнурительной войны в Дорне, а затем продолжат историю созданного вами королевства после окончания боёв."
 game_concept_story_content_fab_argilac:0 "$game_concept_story_generic_prefix$ $bookmark_fab_argilac$"
 game_concept_story_content_fab_argilac_desc:0 "#tooltip_heading Объём сюжета: средний#!\n\nИграя за Аргилака Дюррандона, вы ответите за посланника, которого отправили назад без рук. Сценарные события расскажут о войне Короля Бури против Эйгона и Ориса Баратеона, о созванных вами штормовых лордах и о судьбе вашей дочери и короны после прихода драконов."
