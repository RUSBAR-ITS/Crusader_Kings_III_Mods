l_russian:
 game_rule_category_fab:0 "Пламя и кровь"
 rule_fab_canon_dragon_eggs:0 "#P Пламя и кровь:#! Канонические драконьи яйца"
 setting_fab_canon_dragon_eggs_yes:0 "Да (по умолчанию)"
 setting_fab_canon_dragon_eggs_yes_desc:0 "Эйгон I и Джейхейрис I начинают игру с драконьими яйцами, из которых вылупятся их канонические драконы."
 setting_fab_canon_dragon_eggs_no:0 "Нет"
 setting_fab_canon_dragon_eggs_no_desc:0 "Канонические драконьи яйца не добавляются в инвентарь. Рекомендуется при игре с AGOT More Dragon Eggs, который добавляет собственные канонические яйца."
 rule_fab_jaehaerys_children_fates:0 "#P Пламя и кровь:#! Дети Джейхейриса"
 setting_fab_jaehaerys_children_fates_chance:0 "Воля случая (по умолчанию)"
 setting_fab_jaehaerys_children_fates_chance_desc:0 "Судьбы Эйгона и Дейнерис определяются вероятностями, предусмотренными их событиями."
 setting_fab_jaehaerys_children_fates_both_live:0 "Оба выживут"
 setting_fab_jaehaerys_children_fates_both_live_desc:0 "Эйгон переживёт младенчество. Дейнерис переживёт Дрожь."
 setting_fab_jaehaerys_children_fates_aegon_lives:0 "Эйгон выживет, Дейнерис умрёт"
 setting_fab_jaehaerys_children_fates_aegon_lives_desc:0 "Эйгон переживёт младенчество. Дейнерис умрёт от Дрожи."
 setting_fab_jaehaerys_children_fates_daenerys_lives:0 "Дейнерис выживет, Эйгон умрёт"
 setting_fab_jaehaerys_children_fates_daenerys_lives_desc:0 "Дейнерис переживёт Дрожь. Эйгон умрёт в колыбели."
 setting_fab_jaehaerys_children_fates_both_die:0 "Канон: оба умрут"
 setting_fab_jaehaerys_children_fates_both_die_desc:0 "Эйгон умрёт в колыбели. Дейнерис умрёт от Дрожи."
 rule_fab_gaemon_valerion_health:0 "#P Пламя и кровь:#! Геймон и Валерион"
 setting_fab_gaemon_valerion_health_none:0 "Канон: ни один не будет спасён"
 setting_fab_gaemon_valerion_health_none_desc:0 "Алисанна родит Геймона в 73 году от З.Э., а Валериона — в 77 году. Оба появятся на свет слабыми и болезненными; едва ли кто-нибудь из них доживёт до первых именин."
 setting_fab_gaemon_valerion_health_both:0 "Шанс на спасение для обоих"
 setting_fab_gaemon_valerion_health_both_desc:0 "Геймон и Валерион родятся слабыми и болезненными, но заботливый уход даст каждому из них настоящий шанс выжить."
 setting_fab_gaemon_valerion_health_gaemon:0 "Только Геймон"
 setting_fab_gaemon_valerion_health_gaemon_desc:0 "Заботливый уход даст Геймону настоящий шанс выжить. Судьба Валериона останется в руках Семерых."
 setting_fab_gaemon_valerion_health_valerion:0 "Только Валерион"
 setting_fab_gaemon_valerion_health_valerion_desc:0 "Заботливый уход даст Валериону настоящий шанс выжить. Судьба Геймона останется в руках Семерых."
 rule_fab_aemon_tarth_fate:0 "#P Пламя и кровь:#! Эймон на Тарте"
 setting_fab_aemon_tarth_fate_chance:0 "Случайный болт (по умолчанию)"
 setting_fab_aemon_tarth_fate_chance_desc:0 "Во время мирийского нападения на Тарт Эймон погибнет с вероятностью 75% и выживет с вероятностью 25%."
 setting_fab_aemon_tarth_fate_canon:0 "Канон: Эймон погибнет"
 setting_fab_aemon_tarth_fate_canon_desc:0 "В 92 году от З.Э. арбалетный болт сразит Эймона насмерть."
 setting_fab_aemon_tarth_fate_survives:0 "Эймон выживет"
 setting_fab_aemon_tarth_fate_survives_desc:0 "Болт не нанесёт смертельной раны, и Эймон вернётся живым."
 rule_fab_alyssa_childbed_fate:0 "#P Пламя и кровь:#! Последние роды Алиссы"
 setting_fab_alyssa_childbed_fate_canon:0 "Канон: Алисса умрёт (по умолчанию)"
 setting_fab_alyssa_childbed_fate_canon_desc:0 "Алисса умрёт после рождения сына Эйгона. Каноническая судьба младенца не изменится."
 setting_fab_alyssa_childbed_fate_survives:0 "Алисса выживет"
 setting_fab_alyssa_childbed_fate_survives_desc:0 "Алисса оправится после рождения Эйгона. Событие её смерти не произойдёт, но младенца по-прежнему ждёт каноническая судьба."
 rule_fab_baelon_final_illness_fate:0 "#P Пламя и кровь:#! Последняя болезнь Бейлона"
 setting_fab_baelon_final_illness_fate_chance:0 "Мейстеры попытаются помочь (по умолчанию)"
 setting_fab_baelon_final_illness_fate_chance_desc:0 "С вероятностью 80% Бейлон умрёт через пять дней; с вероятностью 20% лечение мейстеров поможет ему выздороветь."
 setting_fab_baelon_final_illness_fate_canon:0 "Канон: Бейлон умрёт"
 setting_fab_baelon_final_illness_fate_canon_desc:0 "Никакое лечение не остановит болезнь в животе Бейлона. Он умрёт в 101 году от З.Э."
 setting_fab_baelon_final_illness_fate_survives:0 "Бейлон выздоровеет"
 setting_fab_baelon_final_illness_fate_survives_desc:0 "Лечение мейстеров окажется успешным, и Бейлон выживет."
 rule_fab_saera_reconciliation_fate:0 "#P Пламя и кровь:#! Примирение с Сейрой"
 setting_fab_saera_reconciliation_fate_chance:0 "Письмо по воле случая (по умолчанию)"
 setting_fab_saera_reconciliation_fate_chance_desc:0 "После бегства Сейры существует 30% вероятность того, что Джейхейрис получит искреннюю просьбу о примирении."
 setting_fab_saera_reconciliation_fate_canon:0 "Канон: разрыв отношений"
 setting_fab_saera_reconciliation_fate_canon_desc:0 "Джейхейрис и Сейра так и не примирятся."
 setting_fab_saera_reconciliation_fate_reconciles:0 "Просьба достигнет двора"
 setting_fab_saera_reconciliation_fate_reconciles_desc:0 "Сейра попросит о примирении. Джейхейрис сможет принять её просьбу или отказать."
 rule_fab_gael_fate:0 "#P Пламя и кровь:#! Судьба Гейль"
 setting_fab_gael_fate_chance:0 "Забота семьи (по умолчанию)"
 setting_fab_gael_fate_chance_desc:0 "С вероятностью 80% Гейль постигнет каноническая трагедия; с вероятностью 20% её найдут, пока ещё не поздно."
 setting_fab_gael_fate_canon:0 "Канон: Гейль погибнет"
 setting_fab_gael_fate_canon_desc:0 "Потеряв ребёнка, Гейль утопится в Черноводном заливе."
 setting_fab_gael_fate_survives:0 "Гейль найдут"
 setting_fab_gael_fate_survives_desc:0 "Внимательные поиски позволят найти Гейль прежде, чем она войдёт в воду."
 rule_fab_viserra_ride_fate:0 "#P Пламя и кровь:#! Последняя скачка Визерры"
 setting_fab_viserra_ride_fate_chance:0 "Падение с лошади (по умолчанию)"
 setting_fab_viserra_ride_fate_chance_desc:0 "Накануне отъезда в Белую Гавань Визерра с друзьями поскачет наперегонки домой по улицам Королевской Гавани. С вероятностью 80% она сломает шею при падении, а с вероятностью 20% удержится в седле и выживет."
 setting_fab_viserra_ride_fate_canon:0 "Канон: Визерра погибнет"
 setting_fab_viserra_ride_fate_canon_desc:0 "Падение на улицах Королевской Гавани сломает Визерре шею. В 87 году от З.Э. она умрёт, так и не выйдя замуж."
 setting_fab_viserra_ride_fate_survives:0 "Визерра выживет"
 setting_fab_viserra_ride_fate_survives_desc:0 "Падение из седла обойдётся Визерре двумя сломанными рёбрами вместо сломанной шеи. Её принесут в Красный замок, где придётся ответить за свою выходку."
 rule_fab_ours_is_the_fury:0 "#P Пламя и кровь:#! Нам ярость"
 setting_fab_ours_is_the_fury_enabled:0 "Полная цепочка (по умолчанию)"
 setting_fab_ours_is_the_fury_enabled_desc:0 "Перед войной Аргилак сможет провести переговоры с Драконьим Камнем. Если они не увенчаются успехом, цепочка Последней Бури развернётся полностью."
 setting_fab_ours_is_the_fury_canon:0 "Только Последняя Буря"
 setting_fab_ours_is_the_fury_canon_desc:0 "Брачный союз не будет заключён. Война неизбежна, и Последняя Буря всё равно произойдёт."
 setting_fab_ours_is_the_fury_disabled:0 "Отключено"
 setting_fab_ours_is_the_fury_disabled_desc:0 "Судьба Штормовых земель будет решаться так же, как без этой сюжетной цепочки."
 rule_fab_ourfury_storm_queen_fate:0 "#P Пламя и кровь:#! Судьба Королевы Бури"
 setting_fab_ourfury_storm_queen_fate_chance:0 "Воля случая (по умолчанию)"
 setting_fab_ourfury_storm_queen_fate_chance_desc:0 "Верность гарнизона Аргеллы будет испытана дважды. Чаще всего её выдадут Орису, как и в летописях."
 setting_fab_ourfury_storm_queen_fate_player:0 "Выбор игрока"
 setting_fab_ourfury_storm_queen_fate_player_desc:0 "Никакой случайности. Аргелла сама выберет, останется ли гарнизон верен ей или выдаст её врагу."
 setting_fab_ourfury_storm_queen_fate_canon:0 "Всегда выдают"
 setting_fab_ourfury_storm_queen_fate_canon_desc:0 "Гарнизон дрогнет и выдаст Аргеллу Орису. Если Орис мёртв, ворота останутся закрытыми."
 setting_fab_ourfury_storm_queen_fate_defiant:0 "Ворота устоят"
 setting_fab_ourfury_storm_queen_fate_defiant_desc:0 "Люди Аргеллы никогда не дрогнут. Штормовой Предел падёт лишь после поражения в открытом бою."
