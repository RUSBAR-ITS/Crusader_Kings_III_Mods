 # Close the formatting tag inherited from the English source.
 lp_feudal_government_desc:0 "$game_concept_feudal_desc$\n\n#F Феодализм — это жёсткая социальная структура и форма правления, основанная на королях, лордах и крестьянах. Знать властвует над простонародьем на своей земле через систему вассальной верности и клятв. В этой системе каждый человек обязан нести военную службу своему лорду в обмен на защиту, надел земли и людей, которые будут на ней работать.\n\nЗападный феодализм особенно характерен для Вестероса и уникален тем, что вассалов называют «лордами» независимо от их места в иерархии; самых могущественных из них порой именуют «лордами-парамонтами» или даже жалуют княжескими титулами, как в Дорне.#!"

 # The singular concept already aliases this description in AGOT+ rus.
 game_concept_asoiaf_canon_children_concept_desc:0 "Система #bold «Каноничные дети»#! позволяет каноническим персонажам рождаться во время игры.\n\nКаноничные дети будут рождаться, если доминирующий партнёр заключит брак с нужным Домом. Например, если Эддард Старк женится на #italic любой#! Талли, у него будут рождаться каноничные дети.\n\nСистема использует обычные циклы беременности/родов CK3, поэтому дети #italic не обязательно#! родятся в тот же год, что и в лоре.\n\nУзнать, как продолжить линию персонажа, можно в описании модификатора «Каноничные дети», который получают участники системы.\n\n@warning_icon! #X Не будет работать, если включена система канонических детей из ванильного AGOT.#!"
