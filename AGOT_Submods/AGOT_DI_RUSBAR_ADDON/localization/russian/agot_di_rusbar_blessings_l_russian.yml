l_russian:
 agot_di_rusbar_great_valyrian_blessing:0 "Большое Валирийское Благословение"
 agot_di_rusbar_great_valyrian_blessing_desc:0 "В этом персонаже пробудилась сила древней Валирии: крепость тела, острота ума и воля, способная подчинять королевства."
 agot_di_rusbar_valyrian_blessing:0 "Валирийское Благословение"
 agot_di_rusbar_valyrian_blessing_desc:0 "Благословение древней Валирии укрепляет тело, оберегает от изнурения и хранит силу крови потомков."
 agot_di_rusbar_valyrian_slave:0 "Валирийский раб"
 agot_di_rusbar_valyrian_slave_desc:0 "Древнее колдовство сковало способности этого персонажа и подавило способность продолжить род."
 agot_di_rusbar_valyrian_gods_interaction:0 "Обратиться к Валирийским Богам"
 agot_di_rusbar_valyrian_gods_interaction_desc:0 "Призвать древних богов Валирии, чтобы даровать избраннику их силу, сковать его волю или снять прежде наложенные чары.\n\nПока нет ни одного из трёх модификаторов, можно выбрать любой. Если модификатор уже есть, доступно только его снятие."
 agot_di_rusbar_valyrian_gods_options:0 "Избрать волю богов"
 agot_di_rusbar_valyrian_gods_valid_option_tt:0 "Выберите доступное действие для живого человека при включённом меню DI. Перед выдачей другого модификатора снимите имеющийся."
 agot_di_rusbar_gods_grant_great:0 "$agot_di_rusbar_great_valyrian_blessing$"
 agot_di_rusbar_gods_grant_blessing:0 "$agot_di_rusbar_valyrian_blessing$"
 agot_di_rusbar_gods_grant_slave:0 "$agot_di_rusbar_valyrian_slave$"
 agot_di_rusbar_gods_remove_great:0 "Снять Большое Валирийское Благословение"
 agot_di_rusbar_gods_remove_blessing:0 "Снять Валирийское Благословение"
 agot_di_rusbar_gods_remove_slave:0 "Снять модификатор «Валирийский раб»"
