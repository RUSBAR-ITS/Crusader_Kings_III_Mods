l_russian:
 agot_di_rusbar_eye_interaction:0 "Валирийское Око"
 agot_di_rusbar_eye_interaction_desc:0 "Сквозь дым и пламя Око различает дарования, сокрытые от обычного взора. Назовите службу, в которой нуждается этот двор, — и древнее знание укажет достойного человека."
 agot_di_rusbar_treatises_interaction:0 "Изучить Древние Валирийские трактаты"
 agot_di_rusbar_treatises_interaction_desc:0 "Уцелевшие трактаты владык Валирии даруют знания о ремесле, управлении и служении власти. Персонаж обретёт мастерство для первой подходящей из занимаемых должностей. Верность не добавляется; должность и работодатель сохраняются."
 agot_di_rusbar_treatises_valid_tt:0 "Персонаж должен занимать должность, для которой предусмотрена подготовка."
 agot_di_rusbar_eye_target_tt:0 "Выберите живого правителя с собственным двором или лагерем."
 agot_di_rusbar_eye_lore:0 "Назовите службу — Око найдёт того, кто достоин её исполнить. Созданный простолюдин верен своему господину и сразу занимает свободное место."
 agot_di_rusbar_eye_settings_hint:0 "Обязательные требования должности имеют приоритет над общими настройками. Подробности — в подсказке должности."
 agot_di_rusbar_eye_failed:0 "Назначение не состоялось: условия должности изменились или кандидат не прошёл штатную проверку. Персонаж остался при выбранном дворе."
 agot_di_rusbar_eye_failed_title:0 "Око: назначение недоступно"
 agot_di_rusbar_eye_created:0 "Созданный персонаж"
