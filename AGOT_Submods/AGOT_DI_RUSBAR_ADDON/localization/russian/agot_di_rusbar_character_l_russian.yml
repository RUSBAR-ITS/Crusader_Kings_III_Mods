l_russian:
 agot_di_rusbar_choose_option_tt:0 "Выберите вариант."
 agot_di_rusbar_education_interaction:0 "Совершенствовать образование"
 agot_di_rusbar_education_interaction_desc:0 "Поднять каждое уже имеющееся образование до высшей доступной ступени. Новые направления не добавляются."
 agot_di_rusbar_skills_interaction:0 "Обрести валирийское мастерство"
 agot_di_rusbar_skills_interaction_desc:0 "Повысить все шесть базовых навыков. Максимум определяется пределами игры; бонусы свойств учитываются отдельно."
 agot_di_rusbar_skills_10:0 "Все навыки: +10"
 agot_di_rusbar_skills_20:0 "Все навыки: +20"
 agot_di_rusbar_skills_30:0 "Все навыки: +30"
 agot_di_rusbar_skills_40:0 "Все навыки: +40"
 agot_di_rusbar_skills_50:0 "Все навыки: +50"
 agot_di_rusbar_skills_max:0 "Все навыки: максимум"
 agot_di_rusbar_rejuvenate_interaction:0 "Вернуть юность"
 agot_di_rusbar_rejuvenate_interaction_desc:0 "Вернуть персонажу возраст 16 лет, сохранив свойства, навыки и родственные связи."
 agot_di_rusbar_human_blood_interaction:0 "Испить крови Древней Валирии"
 agot_di_rusbar_human_blood_interaction_desc:0 "Древняя кровь избавляет от избранных наследственных изъянов. Кровь Владыки также дарует высшие благоприятные наследственные свойства. Происхождение, культура и вера сохраняются."
 agot_di_rusbar_redeemer_blood:0 "Кровь Избавителя"
 agot_di_rusbar_lord_blood:0 "Кровь Владыки"
 agot_di_rusbar_dragon_blood_interaction:0 "Испить крови Праматери Драконов"
 agot_di_rusbar_dragon_blood_interaction_desc:0 "Милосердие Матери избавляет дракона от дурного телосложения, медлительности и уродливости. Благословение также дарует могучее тело, проворность, величественность и плодовитость. Долговязость, характер и обученность сохраняются."
 agot_di_rusbar_mothers_mercy:0 "Милосердие Матери"
 agot_di_rusbar_mothers_blessing:0 "Благословение Матери"
