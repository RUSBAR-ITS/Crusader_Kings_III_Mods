l_russian:
 agot_di_rusbar_valyrian_diplomat:0 "Валирийский Дипломат"
 agot_di_rusbar_valyrian_diplomat_desc:0 "Слово этого персонажа весит больше золота, а заключённые им союзы крепче драконьей стали.\n\nВсе ветки дипломатии освоены. Дальнейшее получение опыта дипломатии блокируется; лишние очки способностей этого направления удаляются при ежемесячной проверке."
 agot_di_rusbar_valyrian_spy:0 "Валирийский Шпион"
 agot_di_rusbar_valyrian_spy_desc:0 "За закрытыми дверями шепчутся о тайнах, которые этому персонажу давно известны.\n\nВсе четыре ветки интриг, включая шпионскую сеть, освоены. Дальнейшее получение опыта интриг блокируется; лишние очки способностей этого направления удаляются при ежемесячной проверке."
 agot_di_rusbar_valyrian_warrior:0 "Валирийский Воитель"
 agot_di_rusbar_valyrian_warrior_desc:0 "Сталь, строй и замысел полководца служат этому персонажу так же верно, как некогда драконы служили владыкам Валирии.\n\nВсе ветки военного дела освоены. Дальнейшее получение военного опыта блокируется; лишние очки способностей этого направления удаляются при ежемесячной проверке."
 agot_di_rusbar_valyrian_sage:0 "Валирийский Мудрец"
 agot_di_rusbar_valyrian_sage_desc:0 "Знания этого персонажа достойны древних книгохранилищ Валирии.\n\nВсе ветки учёности освоены. Дальнейшее получение опыта учёности блокируется; лишние очки способностей этого направления удаляются при ежемесячной проверке."
 agot_di_rusbar_dragon_lord:0 "Драконий Владыка"
 agot_di_rusbar_dragon_lord_desc:0 "Величие державы держится не только на драконьем пламени. Казна, земли и верная служба подданных подчинены воле этого персонажа.\n\nВсе ветки управления освоены. Дальнейшее получение опыта управления блокируется; лишние очки способностей этого направления удаляются при ежемесячной проверке."
 agot_di_rusbar_valyria_returned:0 "Побывавший на руинах Валирии"
 agot_di_rusbar_valyria_returned_desc:0 "Почётное имя для того, чьё знание дорог и дальних стран достойно путешественника, вернувшегося из погибшей Валирии.\n\nВсе ветки странника освоены. Дальнейшее получение опыта странника блокируется; лишние очки способностей этого направления удаляются при ежемесячной проверке."
