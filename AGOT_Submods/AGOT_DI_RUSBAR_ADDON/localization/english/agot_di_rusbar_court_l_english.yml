l_english:
 agot_di_rusbar_eye_interaction:0 "The Valyrian Eye"
 agot_di_rusbar_eye_interaction_desc:0 "Through smoke and flame, the Eye sees gifts hidden from ordinary sight. Name the service this court needs, and ancient wisdom shall reveal a worthy servant.\n\n$agot_di_rusbar_court_preparation_tt$"
 agot_di_rusbar_treatises_interaction:0 "Study the Ancient Valyrian Treatises"
 agot_di_rusbar_treatises_interaction_desc:0 "The surviving treatises of Valyria teach craft, governance and service. Prepare the character for the first supported office they hold. Loyalty is not granted; their office and employer remain unchanged.\n\n$agot_di_rusbar_court_preparation_tt$"
 agot_di_rusbar_treatises_valid_tt:0 "The character must hold a supported office."
 agot_di_rusbar_eye_target_tt:0 "Choose a living ruler with their own court or camp."
 agot_di_rusbar_eye_lore:0 "Name the service, and the Eye will find one worthy of it. A loyal commoner joins this court and immediately fills the vacancy."
 agot_di_rusbar_eye_settings_hint:0 "Mandatory office requirements override the general settings. See each office’s tooltip for details."
 agot_di_rusbar_eye_failed:0 "Appointment failed: the office conditions changed or the candidate failed the game’s eligibility check. The character remains at the selected court."
 agot_di_rusbar_court_preparation_tt:0 "All base skills are raised to at least 25; higher values are preserved. Exception: the Stooge keeps zero base skills. After preparation, personality is filled to four traits with random compatible choices that do not penalize skills or the selected office."
 agot_di_rusbar_eye_failed_title:0 "The Eye: appointment unavailable"
