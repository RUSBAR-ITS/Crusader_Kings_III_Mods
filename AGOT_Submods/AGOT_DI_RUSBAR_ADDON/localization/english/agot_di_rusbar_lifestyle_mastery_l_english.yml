l_english:
 agot_di_rusbar_valyrian_diplomat:0 "Valyrian Diplomat"
 agot_di_rusbar_valyrian_diplomat_desc:0 "This character's word outweighs gold, and their alliances endure like Valyrian steel.\n\nAll Diplomacy trees are complete. Further Diplomacy experience is suppressed; surplus perk points in this lifestyle are removed by the monthly check."
 agot_di_rusbar_valyrian_spy:0 "Valyrian Spy"
 agot_di_rusbar_valyrian_spy_desc:0 "Behind closed doors, people whisper secrets this character has long known.\n\nAll four Intrigue trees, including Spynetwork, are complete. Further Intrigue experience is suppressed; surplus perk points in this lifestyle are removed by the monthly check."
 agot_di_rusbar_valyrian_warrior:0 "Valyrian Warrior"
 agot_di_rusbar_valyrian_warrior_desc:0 "Steel, formation, and strategy serve this character as faithfully as dragons once served the lords of Valyria.\n\nAll Martial trees are complete. Further Martial experience is suppressed; surplus perk points in this lifestyle are removed by the monthly check."
 agot_di_rusbar_valyrian_sage:0 "Valyrian Sage"
 agot_di_rusbar_valyrian_sage_desc:0 "This character's knowledge is worthy of the ancient libraries of Valyria.\n\nAll Learning trees are complete. Further Learning experience is suppressed; surplus perk points in this lifestyle are removed by the monthly check."
 agot_di_rusbar_dragon_lord:0 "Dragon Lord"
 agot_di_rusbar_dragon_lord_desc:0 "Great realms rest on more than dragonfire. The treasury, the land, and the faithful service of subjects all answer to this character's will.\n\nAll Stewardship trees are complete. Further Stewardship experience is suppressed; surplus perk points in this lifestyle are removed by the monthly check."
 agot_di_rusbar_valyria_returned:0 "Returned from the Ruins of Valyria"
 agot_di_rusbar_valyria_returned_desc:0 "An honorific for one whose knowledge of roads and distant lands befits a traveler returned from fallen Valyria.\n\nAll Wanderer trees are complete. Further Wanderer experience is suppressed; surplus perk points in this lifestyle are removed by the monthly check."
