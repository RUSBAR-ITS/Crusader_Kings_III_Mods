l_english:
 agot_di_rusbar_great_valyrian_blessing:0 "Great Valyrian Blessing"
 agot_di_rusbar_great_valyrian_blessing_desc:0 "The power of ancient Valyria has awakened in this character: a vigorous body, a keen mind, and a will capable of bending kingdoms."
 agot_di_rusbar_valyrian_blessing:0 "Valyrian Blessing"
 agot_di_rusbar_valyrian_blessing_desc:0 "The blessing of ancient Valyria strengthens the body, wards off exhaustion, and preserves the strength of the bloodline."
 agot_di_rusbar_valyrian_slave:0 "Valyrian Slave"
 agot_di_rusbar_valyrian_slave_desc:0 "Ancient sorcery has shackled this character's abilities and suppressed their capacity to continue the bloodline."
 agot_di_rusbar_valyrian_gods_interaction:0 "Appeal to the Valyrian Gods"
 agot_di_rusbar_valyrian_gods_interaction_desc:0 "Call upon the ancient gods of Valyria to grant their chosen one power, bind their will, or lift an enchantment bestowed before.\n\nWhen none of the three modifiers is present, you may choose any one. If a modifier is already present, only its removal is available."
 agot_di_rusbar_valyrian_gods_options:0 "Choose the Will of the Gods"
 agot_di_rusbar_valyrian_gods_valid_option_tt:0 "Choose an available action for a living human with the DI menu enabled. Remove any existing modifier before granting another."
 agot_di_rusbar_gods_grant_great:0 "$agot_di_rusbar_great_valyrian_blessing$"
 agot_di_rusbar_gods_grant_blessing:0 "$agot_di_rusbar_valyrian_blessing$"
 agot_di_rusbar_gods_grant_slave:0 "$agot_di_rusbar_valyrian_slave$"
 agot_di_rusbar_gods_remove_great:0 "Remove the Great Valyrian Blessing"
 agot_di_rusbar_gods_remove_blessing:0 "Remove the Valyrian Blessing"
 agot_di_rusbar_gods_remove_slave:0 "Remove Valyrian Slave"
