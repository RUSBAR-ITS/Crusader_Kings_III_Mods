 building_type_palestone_sword_01:0 "Белокаменный Меч"
 CASTLE_HOARE_REQUIREMENT:0 "Вы должны владеть либо королевством Двух Виков, либо империей Железных островов. Кроме того, вам необходимо владеть баронством замка Хоаров. Ваша форма правления не должна быть племенной, кочевой или вануа."
 cow_custom_mapmode.t:0 "Замок или город пятого уровня или выше."
 REBUILD_CASTAMERE_SECOND:0 "Сначала доведите восстановление обычных руин до стадии «[GetBuilding('medium_ruin_03').GetName]» или выше. После этого станет доступно улучшение «[GetBuilding('agot_castamere_ruins_01').GetName]» → «[GetBuilding('agot_castamere_ruins_02').GetName]»."
 REBUILD_OLDSTONES_SECOND:0 "Сначала доведите восстановление обычных руин до стадии «[GetBuilding('large_ruin_03').GetName]» или выше. После этого станет доступно улучшение «[GetBuilding('agot_oldstones_01').GetName]» → «[GetBuilding('agot_oldstones_02').GetName]»."
 reconstruct_large_ruin_tooltip:0 "Чтобы начать восстановление, у вас должно быть не менее [Select_CString(GetPlayer.HasTreasury, '@treasury_icon!', '@gold_icon!')]#high 600#!. Кроме того, ваши земли должны граничить с руинами, ваш лагерь авантюриста должен находиться в разрушенном баронстве либо вы должны быть его де-юре сюзереном."
