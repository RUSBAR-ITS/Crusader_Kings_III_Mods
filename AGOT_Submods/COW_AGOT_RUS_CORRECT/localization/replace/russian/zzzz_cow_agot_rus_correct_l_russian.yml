 building_agot_karhold_01_desc:0 "$building_karhold_01_desc$"
 building_agot_rooks_rest_01_desc:0 "Грачиный Приют — мощная прибрежная крепость, с высоты которой открывается широкий вид на море и небеса за пределами Королевских земель. Исторически принадлежавший дому Стонтон замок известен стаями чёрных грачей, гнездящихся в его башнях.\n\nПусть он и не величайшая твердыня Королевских земель, прочные стены издавна делали его ценным оплотом — и заманчивой целью во время войн.\n\nКогда-то крепость стала свидетелем одного из самых известных драконьих сражений в истории державы. Во время Танца Драконов у Грачиного Приюта сошлись Мелеис, Солнечный Огонь и Вхагар: с небес обрушились пламя и ярость, а Почти королева встретила свой конец.\n\nКамни замка давно восстановили, но обугленная память того дня живёт в каждом грачином крике и каждой тени на его стенах."
 building_bearisland_01_desc:0 "Медвежий остров издавна был предметом спора между Севером и Железными островами. Тысячи лет назад им правил северный дом Вудфут, затем остров захватили древние железнорождённые и использовали для господства над Закатным морем, пока король Родрик Старк не вернул его Северу и не передал во владение Мормонтам.\n\nОстровом управляют из Усадьбы Мормонтов, возведённой Мормонтами взамен разрушенного замка Вудфутов.\n\nЭто обнесённый деревянными стенами замок с каменным Большим чертогом под куполом, опирающимся на каркас из огромных брёвен. Вокруг него тянется палисад из камня и дерева."
 building_castamere_06_desc:0 "По богатству и влиянию Кастамере теперь не уступает ни одному городу мира. Для потока купцов, ремесленников и простых крестьян, ищущих лучшей доли, требуется новое жильё.\n\nНовый город даст рабочие руки для дальнейшего роста и слуг, которым можно поручить повседневные заботы, избавив нас от этих дел."
 building_cow_rooks_rest_01_desc:0 "Грачиный Приют — мощная прибрежная крепость, с высоты которой открывается широкий вид на море и небеса за пределами Королевских земель. Исторически принадлежавший дому Стонтон замок известен стаями чёрных грачей, гнездящихся в его башнях.\n\nПусть он и не величайшая твердыня Королевских земель, прочные стены издавна делали его ценным оплотом — и заманчивой целью во время войн."
 building_deepwood_motte_01_desc:0 "Темнолесье — небольшая деревянная крепость, построенная домом Гловер на месте, откуда в Век Героев его представители правили как малые короли.\n\nЭтот старый, но не особенно мощный замок стоит в Волчьем лесу на широком округлом холме с плоской вершиной. На вершине стоит большой чертог, в одном конце которого возвышается пятидесятифутовая дозорная башня — самое высокое сооружение по эту сторону северных гор."
 building_oldstones_old_final_desc:0 "От родовой твердыни дома Мадд, откуда его короли правили Королевством Рек и Холмов, остались лишь фундаменты.\n\nСреди руин стоит огромная резная гробница, в которой погребён король Тристифер IV Мадд.\n\nКамень потрескался и крошится по углам, белеет пятнами лишайника, а дикие розы оплели ноги короля и уже тянутся к его груди."
 building_palestone_sword_01:0 "Белокаменный Меч"
 building_palestone_sword_01_desc:0 "Более десяти тысяч лет назад Дейны проследили путь упавшей звезды до острова в устье Быстроводной, где возвели замковый город Звездопад.\n\nИз металла той звезды выковали легендарный клинок Рассвет, а точное место её падения Дейны отметили величественной башней, видной за много лиг, — Белокаменным Мечом.\n\nЭта башня, величайшая в Дорне, и поныне напоминает о богатой истории, могуществе и славе дома Дейн."
 building_type_agot_karhold_01:0 "$building_type_karhold_01_special$"
 building_type_agot_karhold_01_desc:0 "$building_type_karhold_01_special_desc$"
 building_type_agot_lonely_light_01_desc:0 "Одинокий Свет, самая западная точка известного мира, служит последним маяком перед тёмной неизвестностью за Закатным морем. Мейстеры и другие учёные считают мир круглым, однако сведений об успешном кругосветном плавании нет."
