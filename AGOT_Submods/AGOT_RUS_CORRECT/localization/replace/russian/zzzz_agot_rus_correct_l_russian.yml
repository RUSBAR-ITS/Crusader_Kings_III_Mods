 # Исправления синтаксиса, подтверждённые логом запуска 18.09.2026.
 lmf_address_cousin:0 "[Select_CString(second.IsFemale, 'Кузина', 'Кузен')] [second.GetFirstNameNoTooltip]"
 lmf_lover.1100.desc.start: "Пока пот остывал после утех, я [Select_CString(ROOT.Char.IsFemale, 'поняла', 'понял' )] - [lover.GetFirstNameNoTooltip] чего-то хочет. В [lover.GetHerHis] глазах был тот самый взгляд желания.\n\n«Я [Select_CString(lover.IsFemale, 'видела', 'видел' )] "
 sc_harpy_adherent_plural:0 "Благодатные"
 agot_silly_mode.0200.desc:0 "Входит повар, его шаги неуверенные, глаза широко раскрыты от страха. «Вы посылали за мной, [Select_CString(ROOT.Char.IsFemale, 'миледи', 'милорд' )]?»\n\n«Да, я бы [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] омлет. Совершенно особенный», - отвечаю я, поворачиваясь в сторону, чтобы поднять выбранную мной жертву.\n\nОн хмурит брови в замешательстве, но оно быстро сменяется шоком, когда я вкладываю драконье яйцо в его дрожащие руки. «Я... Я не уверен, что я... Если вы этого хотите», - бормочет он, заикаясь и глядя на яйцо так, словно оно может взорваться в любой момент.\n\nЯ киваю ему, и моя улыбка становится шире. «Я что-то [Select_CString(ROOT.Char.IsFemale, 'проголодалась', 'проголодался' )]. Не тяни»."
 agot_travel_events_dragon.9000.desc: "[awkward_entourage_member.GetName] нервно подходит ко мне, когда я седлаю дракона [dragon.GetFirstName] для нашего путешествия. «К сожалению, поскольку вы решили отправиться в путь верхом на драконе [dragon.GetFirstNameNoTooltip], те из нас, кто не является драконьими наездниками, не смогут присоединиться к вам в пути. Мы будем с нетерпением ждать вашего возвращения ко двору, [Select_CString(ROOT.Char.IsFemale, 'миледи', 'милорд' )].»"
 admin_vassal_tab_appointment: "Назначение [GetPlayer.Custom('GetGovernorConceptPossessiveNoTooltip')|l]"
 game_concept_exam_score_desc: "$game_concept_exam_score$ определяет, насколько вероятно, что соискатель успешно сдаст [imperial_examination|E].\n\nБалл основывается на [Concept('skills', 'навыках')|E] [Concept('learning', 'учёности')|E], [Concept('stewardship', 'управления')|E] и [Concept('martial', 'военного дела')|E] соискателя — в зависимости от направленности экзамена.\n\nЛишь десять лучших соискателей в [GetActivityType('activity_imperial_examination').GetName] [activity|E] могут попытаться пройти @palace_exam_icon! #V дворцовый экзамен#!."
