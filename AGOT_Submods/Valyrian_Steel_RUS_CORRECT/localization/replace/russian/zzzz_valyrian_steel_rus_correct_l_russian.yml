 # Generated by tools/Build-ValyrianSteelRusCorrect.ps1; six confirmed localization fixes only.
 bond_with_dragon_scheme_success_chance_add:0 "Шанс установить связь с драконом или приручить его"
 fund_expedition_0001_desc:0 "Слух о том, что я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов')] снарядить экспедицию в Старую Валирию, быстро разошёлся по моей державе. Даже страх перед Дымным морем не отпугнул всех, кто жаждет славы и древних артефактов: несколько храбрецов откликнулись на мой призыв.\n\n[optionOne.GetFirstName], [optionTwo.GetFirstName] и [optionThree.GetFirstName] стоят передо мной; каждый просит доверить экспедицию именно ему."
 fund_expedition_00021_desc:0 "[choice.GetFirstName] собирает команду и готовится немедленно отплыть. Я [Select_CString(ROOT.Char.IsFemale, 'велела', 'велел')] искать любые артефакты, но за дополнительное золото [choice.GetFirstName], вероятно, сможет сосредоточить усилия на конкретном типе находки..."
 fund_expedition_0014_alt_desc:0 "[choice.GetFirstName] открывает сундук и достаёт артефакт. [choice.GetSheHe|U] вручает мне [newly_created_artifact.GetName]! Кубок сделан искусно, но ему недостаёт величия, которого я [Select_CString(ROOT.Char.IsFemale, 'ждала', 'ждал')]: это всего лишь сосуд для питья, а не легендарное оружие и не могущественный артефакт. Слоистая поверхность валирийской стали впечатляет, но после всех опасностей руин Валирии награда кажется слишком скромной.\n\nИ всё же умелый кузнец, пожалуй, смог бы перековать этот кубок в нечто большее."
 fund_expedition_0014_desc:0 "Позже меня приводят к сундуку, который [choice.GetFirstName] [Select_CString(choice.IsFemale, 'оставила', 'оставил' )] для меня. Внутри — [newly_created_artifact.GetName]! Кубок сделан искусно, но ему недостаёт величия, которого я [Select_CString(ROOT.Char.IsFemale, 'ждала', 'ждал')]: это всего лишь сосуд для питья, а не легендарное оружие и не могущественный артефакт. Слоистая поверхность валирийской стали впечатляет, но после всех опасностей руин Валирии награда кажется слишком скромной...\n\nИ всё же умелый кузнец, пожалуй, смог бы перековать этот кубок в нечто большее."
 funded_my_expedition_valyria_desc_third_perspective:0 "экспедиция [owner.GetFullNamePossessiveRegnal] к руинам Старой Валирии была снаряжена на средства [funder.GetFullNameNicknamedRegnal]"
