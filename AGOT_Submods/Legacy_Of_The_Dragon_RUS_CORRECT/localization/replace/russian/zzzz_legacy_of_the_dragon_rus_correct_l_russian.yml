 # Generated from docs/corrections.json; only reviewed changed keys.
 agot_house_customizer.0020.d:0 "$agot_house_customizer.0020.da$"
 agot_house_customizer.0020.e:0 "$agot_house_customizer.0020.ea$"
 artifact_orys_hammer_description:0 "Ярость — боевой молот, который получил в дар [orys.GetFirstName], когда [aegonTarg.GetTitledFirstName] узаконил его и признал основателем нового дома — [orys.GetDynasty.GetBaseName].\n\nДом [orys.GetDynasty.GetBaseName] видит в этом молоте символ своей силы, славы и законности."
 artifact_seafoam_description:0 "Морская Пена — прославленная полуторная сабля из валирийской стали, родовая реликвия Дома Веларионов."
 artifact_viserys_mask_requirements:0 "Для личного ношения маски нужны увечье, шрамы, рана или болезнь. Выставить её на пьедестале можно независимо от состояния здоровья."
 read_prophecy.0001.b:0 "Пусть [heir.GetFirstName] узнает пророчество."
 read_prophecy.0003.a:0 "[heir.GetFirstName] теперь знает пророчество..."
 read_prophecy_0001_desc:0 "Давно я не [Select_CString(ROOT.Char.IsFemale, 'вглядывалась', 'вглядывался')] в кинжал, которым некогда владел [aegonTarg.GetTitledFirstName]. В его клинке сокрыты слова пророчества.\n\nБыть может, настало время вновь прочесть их?"
 read_prophecy_0021_b_desc:0 "Когда я вглядываюсь в клинок, мой взгляд приковывает один-единственный глиф...\n\n#COLOR:{1.0,1.0,1.0};FONT:ValyrianGlyphsFont;SIZE:21 :C:#!\n\nВалирийский знак #COLOR:{0.5,0.0,0.0} крови#!. Туман и расплывчатые тени смыкаются вокруг меня. Вскоре рядом проступают смутно знакомые лица. [Select_CString(ancestor_1.IsFemale, 'Первой', 'Первым')] в тумане появляется [ancestor_1.GetTitledFirstName]. Затем я узнаю [ancestor_2.GetTitledFirstName], [ancestor_3.GetTitledFirstName] и [ancestor_4.GetTitledFirstName] — все они стоят вокруг и улыбаются.\n\nВскоре меня окружают все мои предки, а с ними и родичи, которых я пока не узнаю.\n\nИх улыбки меркнут, как и мир вокруг. Предки бросаются друг на друга в жутком порыве вражды... а затем их ярость обращается на меня. Они смыкаются вокруг, холодные руки стискивают горло — и видение меркнет.\n\nЯ вновь прихожу в себя в своих покоях: [Select_CString(ROOT.Char.IsFemale, 'живая', 'живой')], но потрясён[Select_CString(ROOT.Char.IsFemale, 'ная', 'ный')]."
 read_prophecy_desc_to_heir_third_perspective:0 "[owner.GetName] [Select_CString(owner.IsFemale, 'передала', 'передал')] пророчество, сокрытое в кинжале [aegonTargLoc.GetFirstNameNicknamedPossessive]. [heir.GetName] теперь хранит эту тайну"
 read_prophecy_to_heir_desc:0 "Я [Select_CString(owner.IsFemale, 'передала', 'передал')] пророчество, сокрытое в кинжале [aegonTargLoc.GetFirstNameNicknamedPossessive]. [heir.GetName] теперь хранит эту тайну"
 read_prophecy_to_heir_desc_second_perspective:0 "Вы передали пророчество, сокрытое в кинжале [aegonTargLoc.GetFirstNameNicknamedPossessive]. [heir.GetName] теперь хранит эту тайну"
 rediscover_events_0001_desc:0 "Многие реликвии моих предков до сих пор считаются утраченными; некоторые появились ещё до того, как [aegonTarg.GetTitledFirstName] прибыл в Вестерос...\n\nБыть может, если не пожалеть золота и выбрать верного человека, эти сокровища снова получит дом [main.GetDynasty.GetBaseName]..."
 rediscover_events_1005_desc:0 "[antiquarian.GetFirstName] прибывает к моему двору и преподносит великий дар.\n\n«Корона Завоевателя... Да обретёте вы ту же силу, которой обладал [aegonTarg.GetTitledFirstName]...»\n\nПосле прибытия в Вестерос [aegonTarg.GetTitledFirstName] был коронован этим обручем. Коронацию провела [visenya.GetFirstName], его сестра и жена.\n\nДом [aegonTarg.GetDynasty.GetBaseName] передавал корону от одного короля к другому. В Дорне [daeron.GetTitledFirstName] утратил эту реликвию.\n\nТеперь дом [main.GetDynasty.GetBaseName] вновь владеет ею, хотя рубины вырваны из гнёзд...\n\nБыть может, я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог')] бы заплатить мастеру, чтобы вернуть короне былое великолепие?"
 rediscover_events_1006_desc:0 "[antiquarian.GetFirstName] прибывает к моему двору и вручает королевский дар.\n\n«[aenys.GetTitledFirstName] когда-то носил эту корону... Вскоре после того, как умер [jaehaerys.GetTitledFirstName], след реликвии затерялся, но теперь, вопреки всем ожиданиям, она найдена...»\n\nЭту корону носил второй король Вестероса из Дома [main.GetDynasty.GetBaseName] — [aenys.GetTitledFirstName], до своей смерти.\n\nТеперь она вернулась к законным владельцам."
 setting_extra_visuals_desc:0 "Морская Пена и топор Селтигаров получат новые качественные 3D-модели. В этом облике топор, известный как Клешня Краба, носит название «Бедствие»."
 setting_rediscover_mechanic_enabled_desc:0 "Открывает решение о поиске утраченных реликвий Таргариенов. Поиск доступен совершеннолетнему правителю с земельными владениями из династии Таргариенов или дома Блэкфайр, если при дворе есть хранитель древностей и ещё остались ненайденные реликвии.\n\nПоддерживаются кампании, начатые в следующие даты от Завоевания Эйгона: 8 февраля 233 года, 11 января 239 года, 21 декабря 258 года, 1 января 277 года, 15 сентября 282 года и 2 июня 284 года. Начальный набор доступных реликвий зависит от выбранной даты."
