 artifact_viserys_mask_requirements:0 "Wearing this mask requires disfigurement, scars, a wound or an illness. Displaying it on a pedestal has no health requirement."
 rediscover_events_1006_desc:0 "[antiquarian.GetFirstName] arrives to my courtroom and presents a royal gift to me.\n\n"The crown of [aenys.GetTitledFirstName]...It was lost sometime after the death of [jaehaerys.GetTitledFirstName], but alas now it is found..."\n\nThis crown was was worn by the second [main.GetDynasty.GetBaseName] King in Westeros, [aenys.GetTitledFirstName] until his death.\n\nIt has now returned to its rightful owners."
 rediscover_mechanic_effect_1:0 ""
 setting_extra_visuals_desc:0 "Seafoam and the Celtigar axe will receive new high-quality 3D models. In this form, the axe known as Pincer is named Calamity."
 setting_rediscover_mechanic_enabled_desc:0 "Enables a decision to recover lost Targaryen relics. The search is available to an adult landed ruler of the Targaryen dynasty or House Blackfyre who employs an Antiquarian, while undiscovered relics remain.\n\nSupported campaign start dates: 8 February 233 AC, 11 January 239 AC, 21 December 258 AC, 1 January 277 AC, 15 September 282 AC and 2 June 284 AC. The initial set of available relics depends on the start date."
 valyrian_mask_05_tooltip:0 "A mask of #BOLD;COLOR:{0.81,0.81,0.81} Silver#! make will suffice."
