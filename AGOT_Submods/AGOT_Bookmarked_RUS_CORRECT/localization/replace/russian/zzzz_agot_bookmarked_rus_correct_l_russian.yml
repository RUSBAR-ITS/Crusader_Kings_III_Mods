 # Generated by Build-AGOTBookmarkedRusCorrect.ps1; source details are in docs/source-manifest.json.
 agot_bm_7899_desc:0 "Валирийский Фригольд пал, когда полуостров был уничтожен Роком. Всего за несколько часов Валирия исчезла, а Фригольд был разрушен. Дом Таргариенов выжил, ещё до Рока перебравшись на Драконий Камень, самый западный форпост Валирии, расположенный в Узком море. \n\nВыжили и некоторые другие драконьи владыки — те, кого не было в Валирии во время Рока. Поговаривают, что в Тироше, Лисе и Квохоре драконьи владыки избежали гибели и теперь не знают, что ждет их в будущем. #bold \n\nАурион Варезис, драконий владыка, гостивший в Квохоре, провозгласил себя первым Императором Валирии и собрал войска из квохорцев. Со своим драконом и армией в тридцать тысяч человек он выступил, чтобы завладеть руинами Валирии...#!"
 bookmark_10_aegon_targaryen_desc:0 "Эйгон «Дракон» правит своим недавно завоеванным королевством уже почти десять лет, и только Дорн оспаривает его господство на континенте к югу от Стены. Но война с дорнийскими повстанцами не за горами, ведь любимая сестра-жена и королева Эйгона Рейнис погибла на своём драконе Мераксес, пытаясь подчинить себе непокоренных. Оставшаяся сестра-жена короля Висенья скорбит вместе с ним, придумывая, как обезопасить дом Дракона от потенциальных убийц, таящихся за каждой дверью.\n\n#bold Пока Висенья думает о личной безопасности, Эйгон размышляет о том, как лучше защитить свою новую столицу от нападения: жалкие оборонительные сооружения Эйгонфорта кажутся совершенно недостаточными для столицы королевства, раскинувшегося на весь континент.#!"
 bookmark_129_aegon_targaryen_2_desc:0 "Когда король Визерис I Таргариен скончался в 129 году от З.Э., принцесса Рейнира Таргариен всё ещё была законной наследницей Железного Трона. Поскольку она была беременна на Драконьем Камне, «зелёные» в Королевской Гавани скрыли весть о смерти Визериса, оставив тело короля в его покоях на семь дней, пока шли приготовления к коронации Эйгона. Малый совет единогласно согласился короновать Эйгона, за исключением лорда Лимана Бизбери.\n\nИзначально Эйгон отказался участвовать в планах матери по своей коронации, настаивая, что Рейнира — наследница, однако сир Кристон Коль, Лорд-командующий Королевской Гвардии, убедил его, что, если Рейнира займёт трон, она казнит Эйгона и его братьев. Юстас утверждает, что лишь это заставило Эйгона принять корону. Удержит ли Эйгон Таргариен Железный Трон или потеряет всё?"
 bookmark_129_aegon_targaryen_desc:0 "Эйгон Таргариен, второй сего имени, занял Железный трон после смерти своего отца Визериса I. Хотя его единокровная сестра Рейнира была избранной наследницей их отца и принцессой Драконьего Камня, Эйгон все равно завладел Королевской Гаванью и королевством.\n\n#bold И хотя в результате этой узурпации вскоре может начаться война, Эйгон носит меч, корону и имя Завоевателя и ожидает, что королевство быстро подчинится ему. Если Рейнира не склонит колена, она познает Пламя и кровь!#!"
 bookmark_153_aegon_targaryen_desc:0 "Вот уже двадцать два года Эйгон «Неудачливый» правит на Железном троне. У него нет недостатка в наследниках: два сына - Дейрон и Бейлор - воспитываются при дворе, а также его племянники, сыновья его брата Визериса. Несмотря на уверенность в престолонаследии, безопасность его дома находится под постоянным вопросом.\n\n#bold Со смертью драконов источник власти Таргариенов ослабевает; теперь, чтобы дом Дракона остался на вершине власти, необходимо заключать браки и сделки.#!"
 bookmark_178_aegon_targaryen_desc:0 "Эйгон Таргариен, четвёртый сего имени, правит всего шесть лет, но за это время он успел зарекомендовать себя упадочным, дегенеративным и коррумпированным правителем, мало заботящимся о государственных делах. Между раздорами со старшим сыном - и единственным законным наследником - Дейроном, взаимной ненавистью с братом Эймоном «Рыцарем-Драконом» и непростыми отношениями с сестрой-женой Нейрис, Эйгон показал себя слабовольным королем, управляемым больше собственными удовольствиями, чем каким-либо долгом перед королевством.\n\n#bold Хотя его бастарды могут быть бесчисленными, так называемые «Великие бастарды» Эйгона могут определить судьбу королевства, пока Эйгон будет разбираться с беспорядком, который он устроил в доме Дракона.#!"
 bookmark_195_daemon_blackfyre_desc:0 "Деймон I Блэкфайр, урождённый Деймон Уотерс, бастард короля Эйгона IV Недостойного и его кузины принцессы Дейны. Деймон основал дом Блэкфайров, названный так в честь одноимённого меча из валирийской стали дома Таргариенов, подаренного ему Эйгоном IV. Он восстал против своего законорождённого брата Дейрона II Таргариена в борьбе за Железный Трон, начав первое из восстаний Блэкфайров. Одержит ли он победу или будет повержен?"
 bookmark_195_daeron_targaryen_desc:0 "Дейрон II Таргариен, также известный как Дейрон Добрый, — двенадцатый король-Таргариен на Железном Троне. Дейрон мирно присоединил Дорн к Семи Королевствам, объединив все земли Вестероса к югу от Стены. Теперь его единокровный брат-бастард Деймон Блэкфайр оспаривает его право на трон, что ведёт к гражданской войне — Первому Восстанию Блэкфайра. Сумеет ли он отстоять свои права?"
 bookmark_195_harys_bracken_desc:0 "Лорд Харис Бракен, чей племянник Эйгор «Жгучий Клинок» втянул его в войну за престол, может на века возвысить свой дом — если, конечно, не встретит преждевременный конец. Добьётся ли он успеха или падет жертвой междоусобицы?"
 bookmark_298_joffrey_baratheon_desc:0 "После смерти Роберта Джоффри созвал совет и приказал подготовить свою коронацию как Владыки Семи Королевств. Когда Эддард предъявил завещание Роберта, в котором тот назначил его регентом и упомянул «наследника», не называя имени Джоффри, королева-мать Серсея разорвала документ и велела Старку принести присягу её сыну. В ответ Эддард заявил, что Джоффри не имеет прав на трон, а его дядя, лорд Станнис Баратеон, является истинным наследником.\n\nПосле ареста Эддарда и вынужденного признания им своей «измены», а также провозглашения Джоффри законным наследником Железного Трона, «милость» Джоффри обернулась публичной казнью Эддарда Старка Сиром Илином Пейном на ступенях Великой Септы Бейлора — прямо на глазах у его дочери Сансы Старк. Останется ли Джоффри безнаказанным или падёт от рук более достойных?"
 bookmark_299_joffrey_baratheon_desc:0 "После смерти Роберта Джоффри созвал совет и приказал подготовить свою коронацию как Владыки Семи Королевств. Когда Эддард предъявил завещание Роберта, в котором тот назначил его регентом и упомянул «наследника», не называя имени Джоффри, королева-мать Серсея разорвала документ и велела Старку принести присягу её сыну. В ответ Эддард заявил, что Джоффри не имеет прав на трон, а его дядя, лорд Станнис Баратеон, является истинным наследником.\n\nПосле ареста Эддарда и вынужденного признания им своей «измены», а также провозглашения Джоффри законным наследником Железного Трона, «милость» Джоффри обернулась публичной казнью Эддарда Старка Сиром Илином Пейном на ступенях Великой Септы Бейлора — прямо на глазах у его дочери Сансы Старк. Останется ли Джоффри безнаказанным или падёт от рук более достойных?"
 bookmark_299_walder_frey_desc:0 "Мир полон возможностей — тридцать шесть возможностей, если быть точным. Как лорд Переправы, «Покойный Лорд» Уолдер Фрей занимает влиятельное положение в войне Пяти Королей. Робб Старк, известный как Молодой Волк, согласился на помолвку с его дочерью Рослин в обмен на стратегическое преимущество, которое даёт контроль над Переправой. Останется ли Молодой Волк верен своему слову или предаст Уолдера, положив конец этому союзу?"
 bookmark_2bc_argilac_durrandon_desc:0 "Аргилак Дюррандон, прозванный Надменным, долгие годы защищал Штормовые земли от соседей. Он отражал нападения дорнийцев, воевал с Простором и сражался за Узким морем. Теперь король стареет, а Харрен Чёрный, владыка Островов и Рек, угрожает его державе с севера. Аргилак ищет способ обезопасить свои владения и будущее дочери Аргеллы; союз с драконьим владыкой Драконьего Камня мог бы изменить расстановку сил.\n\n#bold Удастся ли Аргилаку договориться с Таргариенами, сохранив гордость и независимость своего дома? Или королю снова придётся защищать наследие Дюррандонов мечом, когда дипломатия уступит место войне?#!"
 bookmark_2bc_harren_hoare_desc:0 "Харрен Хоар, прозванный Чёрным, держит Железные острова и Речные земли в страхе. Сорок лет трудов и поборов воплощаются в Харренхолле — огромной крепости, которая должна увековечить его имя. Ради её стен истощены богатства обоих берегов, а тысячи пленников погибли на работах. Речные лорды подчиняются Харрену, но любовь к своему королю едва ли удержит их от измены, если появится достаточно сильный соперник.\n\n#bold Сможет ли Харрен сохранить власть над Трезубцем и передать сыновьям могущественное королевство? Камень внушает уверенность, но ещё предстоит узнать, надёжнее ли высокие стены верности вассалов, когда с Драконьего Камня придёт новая угроза.#!"
 bookmark_2bc_mern_gardener_desc:0 "Мерн IX Гарденер правит Простором из Хайгардена. Под его знамёнами собираются могущественные лорды и закованные в сталь рыцари, а плодородные земли кормят огромное воинство. Многочисленные наследники обещают продолжить род Гарденеров, и королю трудно представить силу, способную лишить его короны. Но на Драконьем Камне Таргариены располагают оружием, которого нет ни у одного короля Вестероса, — драконами.\n\n#bold Сумеет ли Мерн найти союзников и защитить Простор, когда одной численности войска окажется недостаточно? Судьба древнего дома будет зависеть от того, что король предпочтёт: уверенность в своих рыцарях или осторожность перед новой угрозой.#!"
 bookmark_2bc_torrhen_stark_desc:0 "Торрхен Старк носит корону Севера и правит из Винтерфелла. Его вассалы чтут древние обычаи, а далеко на юге другие короли спорят за земли и власть. Но драконы Таргариенов могут изменить привычный порядок всего Вестероса, и северному королю придётся решить, как встретить угрозу своему народу. Собрать знамёна нетрудно; куда труднее определить, какой ценой следует защищать независимость.\n\n#bold Сумеет ли Торрхен уберечь Север, сохранив корону предков? Решение остаётся за ним: искать союзников, готовиться к битве или добиваться мира. Слава короля и жизни его подданных могут потребовать разных жертв.#!"
 bookmark_300_stannis_baratheon_desc:0 "Год темен и полон ошибок."
 bookmark_99_aenar_targaryen_desc:0 "За двенадцать лет до Рока Валирии дочь Эйнара, Дейнис Сновидица, предрекла гибель Валирии. После этого Эйнар продал свои владения в Валирии и Землях Долгого Лета и переселился с семьей и драконами на Драконий Камень — самую западную заставу Валирийской Республики. Таргариены были далеко не самыми могущественными из драконьих владык, и их враги в Валирии сочли их бегство проявлением трусости. Однако, поскольку Эйнар увез семью из Валирии, Таргариены стали самыми могущественными драконьими владыками после Рока."
 bookmark_99_arrec_durrandon_desc:0 "Аррек Дюррандон, Король Штормовых земель и богатых Речных земель, завоеванных триста лет назад его предком Арланом III Дюррандоном, восседает на троне Штормовых Королей. Однако его правление непрочно, ибо другие короли в Вестеросе по-прежнему с завистью взирают на потенциальное богатство Речных земель. На Западе начинают шевелиться Железнорожденные, возможно, вынашивая планы отвоевать Речные земли у Штормового Короля."
 bookmark_99_garland_gardener_desc:0 "Пока Гарланд не достиг совершеннолетия, Верховный стюард Простора из дома Тиреллов правил как регент. Ныне Гарланд VI правит одним из сильнейших королевств Вестероса. Умный, но циничный король; тайны честолюбивых планов Гарланда известны лишь ему самому, и лишь время покажет, сколь высоко вознесется дом Гарденеров."
