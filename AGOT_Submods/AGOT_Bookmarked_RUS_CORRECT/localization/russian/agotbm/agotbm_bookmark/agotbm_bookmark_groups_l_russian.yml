 agot_bm_8298:0 "Война Пяти Королей"
 agot_bm_8298_desc:0 "Вестерос охвачен войной. После внезапной смерти Роберта Баратеона на Железный Трон восходит Джоффри, в чьём происхождении многие сомневаются. Эддард Старк, Хранитель Севера и Десница Короля, отправил письмо Станнису Баратеону, в котором высказал свои подозрения, что Джоффри — не сын Роберта, а результат кровосмесительных отношений между королевой Серсеей и её братом сиром Джейме Ланнистером. Джоффри, возмущённый обвинениями лорда Эддарда, приказал казнить его. Теперь сын Эддарда Робб при поддержке дома Талли из Речных земель созвал свои знамёна и выступил на Королевскую гавань. Тем временем лорд Бейлон Грейджой, разглядевший в текущей ситуации очередную возможность, претендует на Морской Трон и желает вернуть былую власть железнорождённых. Наконец, за Узким морем, Дейнерис Таргариен, оплакивающая смерть своего мужа и нерождённого ребёнка, начинает свой долгий путь в Вестерос. В этом сценарии вам предстоит пережить центральный конфликт 'Песни Льда и Пламени' Джорджа Р.Р. Мартина, но помните: Зима близко."
  
