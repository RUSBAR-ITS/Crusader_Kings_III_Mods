 bookmark_299_walder_frey:0 "Лорд Уолдер" 
 bookmark_299_walder_frey_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_299_walder_frey_desc:0 "Мир полон возможностей — тридцать шесть возможностей, если быть точным. Как лорд Переправы, «Покойный Лорд» Уолдер Фрей занимает влиятельное положение в войне Пяти Королей. Робб Старк, известный как Молодой Волк, согласился на помолвку с его дочерью Рослин в обмен на стратегическое преимущество, которое даёт контроль над Переправой. Останется ли Молодой Волк верен своему слову или предаст Уолдера, положив конец этому союзу?" 
  
 bookmark_299_tywin_lannister:0 "Лорд Тайвин" 
 bookmark_299_tywin_lannister_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_299_tywin_lannister_desc:0 "Лорд Тайвин Ланнистер, отсутствующий из-за продолжающейся войны и в настоящее время находящийся в проклятом замке Харренхолл, поручил своему сыну Тириону Ланнистеру служить Десницей Короля вместо него. У него есть план, как положить конец этому мятежу столь же быстро, как он разгорелся. Робб Старк, Молодой Волк, доказал, что он успешный командир. Станет ли Король Севера большей проблемой для его семьи, чем думал Тайвин, или Ланнистеры вновь докажут могущество своего имени?" 
 bookmark_299_cersei_lannister:0 "Леди Серсея" 
 bookmark_299_jaime_lannister:0 "Сир Джейме" 
  
 bookmark_299_balon_greyjoy:0 "Лорд Бейлон" 
 bookmark_299_balon_greyjoy_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_299_balon_greyjoy_desc:0 "Устав жить под гнетом Железного Трона, лорд Железных Островов Бейлон Грейджой воспользовался хаосом Войны Пяти Королей, чтобы вновь провозгласить независимость своих земель. Суждено ли ему заплатить железную цену за независимость, или же его мятеж, как и прежде, будет утоплен в крови?" 
 bookmark_299_asha_greyjoy:0 "Аша 'Дочь Кракена'" 
