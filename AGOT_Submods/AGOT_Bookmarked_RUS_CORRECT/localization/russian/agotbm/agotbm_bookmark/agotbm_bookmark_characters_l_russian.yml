 bookmark_299_stannis_baratheon:0 "Король Станнис" 
 bookmark_299_stannis_baratheon_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_299_stannis_baratheon_desc:0 "Король Станнис Баратеон, настаивающий на своих правах законного наследника Железного Трона, намерен забрать у бастарда Джоффри Баратеона то, что принадлежит ему по праву. В сопровождении Красной Жрицы Мелисандры, которая наполняет его разум пророчествами и видениями, Станнис верит, что он и есть Принц, что был обещан. Окажутся ли его тактические навыки лучше, чем у незаконного узурпатора, или же он, обманутый пророчеством, встретит горький конец в борьбе за трон?" 
  
