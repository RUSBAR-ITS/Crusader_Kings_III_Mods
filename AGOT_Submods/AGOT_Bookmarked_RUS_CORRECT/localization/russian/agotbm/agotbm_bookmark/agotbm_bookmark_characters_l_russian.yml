 bookmark_129_rhaenyra_targaryen:0 "Королева Рейнира I" 
 bookmark_129_rhaenyra_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_129_rhaenyra_targaryen_desc:0 "Рейнира была объявлена наследницей своего отца, короля Визериса I Таргариена. Это решение было подтверждено королевской волей. Когда Визерис скончался в 129 году от З.Э., сир Отто Хайтауэр, Десница короля, и сир Кристон Коль, Лорд-командующий Королевской Гвардии, пренебрегли волей короля и вместо этого короновали её единокровного брата Эйгона II. «Зелёные» в Королевской Гавани позаботились о том, чтобы весть о смерти Визериса не достигла Рейниры, пока не состоялась коронация Эйгона II.\n\nКогда весть наконец достигла Рейниры, у неё начались преждевременные роды, и она родила мёртвую дочь Висенью. Рейнира возложила вину за эту трагедию на тех, кто украл её корону, и провела собственную, поспешную коронацию. Принц Деймон Таргариен, её супруг и дядя, водрузил на голову Рейниры корону её отца. Когда весть о её коронации достигла Королевской Гавани, ей предложили условия: Рейнира и её потомки могут остаться правителями Драконьего Камня, если она отречётся от своих притязаний на Железный Трон. Но она отказалась. Отвоюет ли Рейнира Таргариен то, что принадлежит ей по праву?" 
 bookmark_129_daemon_targaryen:0 "Король Деймон" 
 bookmark_129_jacaerys_velaryon:0 "Принц Джекейрис" 
  
 bookmark_129_aegon_targaryen_2:0 "Король Эйгон II" 
 bookmark_129_aegon_targaryen_2_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_129_aegon_targaryen_2_desc: "Когда король Визерис I Таргариен скончался в 129 году от З.Э., принцесса Рейнира Таргариен всё ещё была законной наследницей Железного Трона. Поскольку она была беременна на Драконьем Камне, «зелёные» в Королевской Гавани скрыли весть о смерти Визериса, оставив тело короля в его покоях на семь дней, пока шли приготовления к коронации Эйгона. Малый совет единогласно согласился короновать Эйгона, за исключением лорда Лимана Бизбери.\n\nИзначально Эйгон отказался участвовать в планах матери по своей коронации, настаивая, что Рейнира — наследница, однако сир Кристон Коль, Лорд-командующий Королевской Гвардии, убедил его, что, если Рейнира займёт трон, она казнит Эйгона и его братьев. Юстас утверждает, что лишь это заставило Эйгона принять корону. Удержит ли Эйгон Таргариен Железный Трон или потеряет всё?" 
 bookmark_129_helaena_targaryen:0 "Королева Хелейна" 
 bookmark_129_aemond_targaryen:0 "Принц Эймонд 'Одноглазый'" 
  
  #8195 
 bookmark_195_daemon_blackfyre:0 "Король Деймон I" 
 bookmark_195_daemon_blackfyre_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_195_daemon_blackfyre_desc:0 "Деймон I Блэкфайр, урождённый Деймон Уотерс, бастард короля Эйгона IV Недостойного и его кузины принцессы Дейны. Деймон основал дом Блэкфайров, названный так в честь одноимённого меча из валирийской стали дома Таргариенов, подаренного ему Эйгоном IV. Он восстал против своего законорождённого брата Дейрона II Таргариена в борьбе за Железный Трон, начав первое из восстаний Блэкфайров. Одержит ли он победу или будет повержен?" 
  
 bookmark_195_daeron_targaryen:0 "Король Дейрон II" 
 bookmark_195_daeron_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_195_daeron_targaryen_desc: "Дейрон II Таргариен, также известный как Дейрон Добрый, — двенадцатый король-Таргариен на Железном Троне. Дейрон мирно присоединил Дорн к Семи Королевствам, объединив все земли Вестероса к югу от Стены. Теперь его единокровный брат-бастард Деймон Блэкфайр оспаривает его право на трон, что ведёт к гражданской войне — Первому Восстанию Блэкфайра. Сумеет ли он отстоять свои права?" 
 bookmark_195_baelor_targaryen:0 "Принц Бейлор 'Сломи-Копьё'" 
 bookmark_195_maekar_targaryen:0 "Принц Мейкар" 
  
 bookmark_195_harys_bracken:0 "Лорд Харис" 
 bookmark_195_harys_bracken_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_195_harys_bracken_desc: "Лорд Харис Бракен, чей племянник Эйгор «Жгучий Клинок» втянул его в войну за престол, может на века возвысить свой дом — если, конечно, не встретит преждевременный конец. Добьётся ли он успеха или падет жертвой междоусобицы?" 
 bookmark_195_aegor_targaryen: "Эйгор 'Жгучий Клинок'" 
  
