 bookmark_298_robb_stark:0 "Король Робб" 
 bookmark_298_robb_stark_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_298_robb_stark_desc:0 "Недавно провозглашенный Король Севера Робб Старк, известный как «Молодой Волк», узнал о казни своего отца Эддарда по приказу тирана Джоффри Баратеона. Теперь у вас в плену находится «Цареубийца» — Джейме Ланнистер. Придёт ли зима к Ланнистерам, или же ваши усилия будут пресечены врагами?" 
  
 bookmark_298_joffrey_baratheon:0 "Король Джоффри I" 
 bookmark_298_joffrey_baratheon_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_298_joffrey_baratheon_desc:0 "После смерти Роберта Джоффри созвал совет и приказал подготовить свою коронацию как Владыки Семи Королевств. Когда Эддард предъявил завещание Роберта, в котором тот назначил его регентом и упомянул «наследника», не называя имени Джоффри, королева-мать Серсея разорвала документ и велела Старку принести присягу её сыну. В ответ Эддард заявил, что Джоффри не имеет прав на трон, а его дядя, лорд Станнис Баратеон, является истинным наследником.\n\nПосле ареста Эддарда и вынужденного признания им своей «измены», а также провозглашения Джоффри законным наследником Железного Трона, «милость» Джоффри обернулась публичной казнью Эддарда Старка Сиром Илином Пейном на ступенях Великой Септы Бейлора — прямо на глазах у его дочери Сансы Старк. Останется ли Джоффри безнаказанным или падёт от рук более достойных?" 

 bookmark_298_myrcella_baratheon:0 "Принцесса Мирцелла" 
 bookmark_298_tommen_baratheon:0 "Принц Томмен" 
  
 bookmark_298_walder_frey:0 "Лорд Уолдер" 
 bookmark_298_walder_frey_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_298_walder_frey_desc:0 "Король Джоффри Баратеон казнил Неда Старка, а 'Покойный Лорд' Уолдер Фрей обладает преимуществом, занимая ключевую позицию в войне между юным королем Джоффри Баратеоном и Королем Севера Роббом Старком. Фрею нет дела до Старков, но он не сомневается, что сумеет обратить эту ситуацию себе на пользу. Какая из сторон согласится на его условия, и сумеет ли он укрепить свои позиции?" 
  
 bookmark_298_tywin_lannister:0 "Лорд Тайвин" 
 bookmark_298_tywin_lannister_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_298_tywin_lannister_desc:0 "Внук лорда Тайвина Ланнистера, король на Железном Троне Джоффри Баратеон вверг королевство в хаос своей дерзкой казнью Хранителя Севера Эддарда Старка, усомнившегося в его правах на престол. Столкнувшись с войной от новоявленного Короля Севера Робба Старка, Тайвину придется действовать быстро, чтобы сохранить могущество своего дома. Сумеет ли он покорить Север и подавить мятеж – или же тирания внука погубит саму династию, которую Тайвин столь яростно защищал?" 
 bookmark_298_cersei_lannister:0 "Леди Серсея" 
 bookmark_298_jaime_lannister:0 "Сир Джейме" 
  
 bookmark_298_renly_baratheon:0 "Верховный лорд Ренли" 
 bookmark_298_renly_baratheon_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_298_renly_baratheon_desc:0 "Верховный лорд Штормовых Земель Ренли Баратеон, узнав о войне между жестоким королём Джоффри и королём Севера Роббом Старком, а также о притязаниях своего брата Станниса на Железный Трон, стоит пред выбором: поддержать ли законного наследника или же самому заявить право на трон, опираясь на могущественных союзников. Сумеет ли он использовать свою силу во благо династии, или же амбиции погубят его?" 
  
 bookmark_298_balon_greyjoy:0 "Лорд Бейлон" 
 bookmark_298_balon_greyjoy_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_298_balon_greyjoy_desc:0 "Устав жить под гнетом Железного Трона, лорд Железных Островов Бейлон Грейджой воспользовался хаосом Войны Пяти Королей, чтобы вновь провозгласить независимость своих земель. Суждено ли ему заплатить железную цену за независимость, или же его мятеж, как и прежде, будет утоплен в крови?" 
 bookmark_298_asha_greyjoy:0 "Аша 'Дочь Кракена'" 
 bookmark_298_theon_greyjoy:0 "Теон" 
  
 bookmark_298_stannis_baratheon:0 "Король Станнис" 
 bookmark_298_stannis_baratheon_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$" 
 bookmark_298_stannis_baratheon_desc:0 "Король Станнис Баратеон, принявший веру во Владыку Света, узнал о сомнительном происхождении юного короля Джоффри Баратеона. Железный Трон по праву принадлежит ему, и Станнис готов бороться за него. Но для победы в грядущей войне ему нужны сильные союзники. Молодой Волк Робб Старк объявил себя Королём Севера, но Станнис не согласен править лишь половиной королевства. Поддержит ли его брат Ренли, или же он сам хочет захватить трон? Сможет ли Станнис найти достаточно сторонников, чтобы разгромить всех претендентов раз и навсегда?" 
  
