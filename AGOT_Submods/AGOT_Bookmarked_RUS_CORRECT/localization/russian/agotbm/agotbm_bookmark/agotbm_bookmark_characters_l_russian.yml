 bookmark_99_aenar_targaryen:0 "Король Эйнар" 
 bookmark_99_aenar_targaryen_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_99_aenar_targaryen_desc:0 "За двенадцать лет до Рока Валирии дочь Эйнара, Дейнис Сновидица, предрекла гибель Валирии. После этого Эйнар продал свои владения в Валирии и Землях Долгого Лета и переселился с семьей и драконами на Драконий Камень — самую западную заставу Валирийской Республики. Таргариены были далеко не самыми могущественными из драконьих владык, и их враги в Валирии сочли их бегство проявлением трусости. Однако, поскольку Эйнар увез семью из Валирии, Таргариены стали самыми могущественными драконьими владыками после Рока." 
 bookmark_99_gaemon_targaryen:0 "Принц Геймон" 
 bookmark_99_daenys_targaryen:0 "Принцесса Дейнис" 
  
 bookmark_99_garland_gardener:0 "Король Гарланд VI" 
 bookmark_99_garland_gardener_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_99_garland_gardener_desc:0 "Пока Гарланд не достиг совершеннолетия, Верховный стюард Простора из дома Тиреллов правил как регент. Ныне Гарланд VI правит одним из сильнейших королевств Вестероса. Умный, но циничный король; тайны честолюбивых планов Гарланда известны лишь ему самому, и лишь время покажет, сколь высоко вознесется дом Гарденеров." 
 bookmark_99_elissa_florent:0 "Королева Элисса" 
 bookmark_99_mern_gardener:0 "Принц Мерн" 
  
 bookmark_99_tommen_lannister:0 "Король Томмен II" 
 bookmark_99_tommen_lannister_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_99_tommen_lannister_desc:0 "Томмен II, известный как «Львиный Король», из дома Ланнистеров восседает на троне Утёса. Услышав о возможном крахе Валирии в огненном Роке, он готовит экспедицию в земли бывшей Республики, чтобы разграбить богатства и магические артефакты, которые, как он уверен, до сих пор там." 
 bookmark_99_ellyn_tarbeck:0 "Королева Эллин" 
 bookmark_99_tyrion_lannister:0 "Принц Тирион" 
  
 bookmark_99_aurion_varezys:0 "Император Аурион" 
 bookmark_99_aurion_varezys_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_99_aurion_varezys_desc:0 "Аурион Варезис — один из немногих уцелевших драконьих владык — оказался в Квохоре, собрал войско и провозгласил себя первым Императором Валирии. Воссев на своего дракона, он двинулся на юг во главе тридцатитысячной армии, чтобы заявить права на то, что осталось от Валирии, и воссоздать Фригольд. Что ждет его в руинах, покажет лишь время." 
  
