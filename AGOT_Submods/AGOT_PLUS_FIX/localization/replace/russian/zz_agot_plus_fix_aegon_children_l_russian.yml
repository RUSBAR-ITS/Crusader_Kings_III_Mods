 asoiaf_Targaryen_88_modifier_desc:0 "Канонические дети Эйгона IV: законные дети от жены из дома Таргариенов; Алисанна, Лили, Ива и Рози от Мегетт; Белленора, Нарха и Балерион от женщины браавосской культуры; Деймон Блэкфайр от Дейны или другой женщины дома Таргариенов вне брака. Эйгон должен быть биологическим отцом. Остальные цепочки бастардов не реализованы."
