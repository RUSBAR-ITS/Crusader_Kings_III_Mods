 gardener_peace_crown_description:0 "The peace crown of King Mern IX Gardener of the Reach, which he took with him to the Field of Fire. Made from silver and gold and surrounded by green thorns and gold, bronze, silver, and iron metal flowers, and encircled by metal green hands to symolize House Gardener, this crown was worn by the King of the Reach during times of Peace. \n \nHISTORY - Though it is today known as the Mern Gardener Peace crown due to the last king who wore it, it was actually forged centuries earlier during the reign of King Mern's ancestor King Meryn IV Gardener, who would go on to be the first to wear the crown following the loss of Garth Goldenhand's crown. \n \nThe crown would accompy King Mern to the battle that would end with his death, for he intended to wear it upon the defeat of the Targaryen invaders. Yet unlike its war counterpart, it managed to avoid being destroyed during the Field of Fire by the flames of the dragons Balerion, Meraxes, and Vhagar. After the battle it was retrieved by King Aegon I and added to the collection of Westerosi King artifacts he had collected."
 garlandgardener_crown_description:0 "A beautiful laurel wreath crown made of gold originally worn by Queen Maris Hightower, wife of King Garland II Gardener, who was known to history as Garland the Bridesgroom for his bringing Oldtown into the Kingdom of the Reach via marriage. Historically however it is most commonly known for its final owner, Princess Wynafryd Gardener, whom it is sometimes named for.\n \nHISTORY - Commissioned by the last king of Oldtown King Lymond Hightower, known historically as Lymond the Sea Lion, as a gift to his daughter upon her marriage to King Garland II Gardener, this crown would be worn by various wives of the various Gardener Kings over the centuries, so much so that it would eventually become known as the Queen’s Crown. \n \nThe final notable wearer of the crown would however be Princess Wynafryd Gardener, the beautiful youngest daughter of King Garse IV Gardener. According to legend, Wynafryd’s mother died at a young age and Garse gifted his daughter the crown which had previously been worn by her mother, and Wynafryd grew to love the crown so much she wore it every day. \n \nEventually however, Wynafryd reportedly fell in love with a lowborn traveling hedge knight and became quick with child. Though dark rumors remain to this day that it was far less than loving as is often romanticized by stories. Tragically however she died in childbirth to birth a bastard son, leading to the grieving King Garse to hang the hedge knight from a tree for stealing his favorite daughter’s maidenhead and had the crown his daughter had so loved buried with his daughter, in whose tomb in Highgarden the crown is rumored to remain."
 garthgoldhand_crown_description:0 "A crown said to have once been owned by Garth Goldenhand, the greatest of the Gardener Kings of the Reach. Made of gold, silver, and old green bronze, it had multicolored jewels and four golden hands. \n \nHISTORY - Created for the legendary Garth Goldenhand during the golden age of the Reach, this unique Gardener crown is notable for the fact it breaks from the Gardener crown tradition and lacks a war counterpart, being that it was forged during the Reach’s longest and biggest age of peace and prosperity before Aegon’s Conquest. \n \nThe crown tragically vanished at sea, along with its last wearer, King John III Gardener, when the king’s vessel shipwrecked off the Vale's coast whilst traveling amidst the Reach's then conflict with the Vale, leading John’s own son King Meryn IV to forge his own crown, a crown which centuries later would be worn by Mern IX Gardener, the final king of the Reach. \n \nSeparately but no less of note, the design of Garth Goldenhand’s crown, particularly the many multi-colored emeralds it possessed, was said to have reportedly inspired King Jaehaerys I Targaryen when forging the design of his own crown."
