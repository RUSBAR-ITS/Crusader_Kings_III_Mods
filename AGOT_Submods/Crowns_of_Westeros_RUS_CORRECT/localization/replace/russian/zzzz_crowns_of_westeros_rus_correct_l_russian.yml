 # Generated from docs/corrections.json; only reviewed changed keys.
 agot_commission_special_artifact_crown.1313.d:0 "Я [Select_CString(ROOT.Char.IsFemale, 'передумала', 'передумал')]. Я больше не хочу создавать новую корону."
 branstark_crown_description:0 "Древняя корона Старков, созданная для неизвестного Брандона Старка и названная в его честь. Этот Брандон правил Севером тысячи лет назад как король. Какой именно Брандон заказал её, время уже стёрло из памяти, но ясно, что корона вдохновлена столь же древней Короной Зимы, которую до Завоевания носили старые короли Севера. Она изготовлена из бронзы, покрыта резными руническими надписями и украшена девятью обсидиановыми шипами в форме мечей, чем немного отличается от традиционной Короны Зимы с железными мечами."
 crown_of_sharp_point_description:0 "Ажурная корона в форме устремлённых вверх рыб-мечей, каждая из которых покрыта сетчатым узором. Эта острая корона удачно отражает образ дома Бар-Эммона с Острого Мыса."
 daena_crown_description:0 "Золотой венец с чередующимися красными и пурпурными ромбовидными камнями, окружёнными меньшими чёрными самоцветами, и тонкими шипами по краю. Эта корона принадлежала королеве Дейне Таргариен, также известной как Дейна Непокорная, жене короля Бейлора I. \n \nИстория — Корону заказал и подарил ей её дядя Визерис, будущий король Визерис II, когда Дейна стала королевой. Сама Дейна носила её недолго: большую часть времени, когда она была королевой, Дейна провела взаперти в Девичьем склепе. Перед смертью Дейна подарила корону своей невестке Роанне Тирошийской как свадебный дар к браку Роанны с её сыном, Деймоном Блэкфайром. \n \nПосле восстания Блэкфайра корона оказалась у потомков Деймона Блэкфайра. После смерти Мейлиса её нашли и вернули дому Таргариенов."
 gardener_peace_crown_description:0 "Мирная корона короля Простора Мерна IX Гарденера, которую он взял с собой на Пламенное поле. Эта корона из серебра и золота окружена зелёными шипами, золотыми, бронзовыми, серебряными и железными цветами, а также металлическими зелёными руками, символизирующими дом Гарденеров; короли Простора носили её в мирное время. \n \nИстория — Хотя сегодня она известна как Мирная корона Мерна Гарденера по имени последнего короля, носившего её, на самом деле её выковали столетиями раньше, при предке Мерна, короле Мерине IV Гарденере. Именно Мерин первым надел её после утраты короны Гарта Златорукого. \n \nКорона сопровождала Мерна в битве, где он погиб: он собирался надеть её после победы над захватчиками-Таргариенами. Однако, в отличие от военной короны, ей удалось избежать уничтожения пламенем Балериона, Мераксеса и Вхагара на Пламенном поле. После битвы король Эйгон I вернул её и добавил к своей коллекции вестеросских королевских артефактов."
 gardener_war_crown_description:0 "Реплика военной короны, которую носил король Простора Мерн IX Гарденер в миг своей гибели на Пламенном поле. Эта корона из бронзы и железа окружена тёмными шипами, красно-золотыми металлическими цветами и колючими бронзовыми и железными листьями; короли Простора носили её в военное время. \n \nИстория — Хотя сегодня она известна как Военная корона Мерна Гарденера по имени последнего короля, носившего её, на самом деле её выковали столетиями раньше, при предке Мерна, короле Мерине IV Гарденере. Именно Мерин первым надел её после утраты короны Гарта Златорукого. \n \nМерн носил её в битве, завершившейся его смертью. Корона была расплавлена и уничтожена на Пламенном поле пламенем драконов Балериона, Мераксеса и Вхагара."
 garlandgardener_crown_description:0 "Золотая корона в виде лаврового венка, первоначально принадлежавшая королеве Марис Хайтауэр, жене короля Гарланда II Гарденера, вошедшего в историю как Гарланд II Жених за то, что браком присоединил Старомест к королевству Простора. И всё же чаще всего эту корону связывают с её последней владелицей, принцессой Винафрид Гарденер.\n \nИстория — Корону заказал последний король Староместа, Лаймонд Хайтауэр по прозвищу Морской Лев, и подарил её дочери после её брака с королём Гарландом II Гарденером. На протяжении веков её носили жёны королей Гарденеров, и со временем она стала известна как Корона королевы.\n \nПоследней известной владелицей короны стала принцесса Винафрид Гарденер, прекрасная младшая дочь короля Гарса IV Гарденера. По легенде, мать Винафрид умерла молодой, и Гарс подарил дочери корону, которую прежде носила её мать. Винафрид так полюбила её, что носила каждый день.\n \nПозднее, как рассказывают, Винафрид влюбилась в странствующего межевого рыцаря низкого происхождения — хотя мрачные слухи до сих пор утверждают, что всё было куда менее романтично, чем любят изображать песни. Она быстро забеременела и трагически умерла при родах, оставив внебрачного сына. Скорбящий король Гарс повесил межевого рыцаря за то, что тот отнял девственность его любимой дочери, а саму корону похоронил вместе с Винафрид. По слухам, она и ныне покоится в её могиле в Хайгардене."
 garthgoldhand_crown_description:0 "Говорят, эта корона некогда принадлежала Гарту Златорукому, величайшему из королей Простора. Изготовленная из золота, серебра и старой зелёной бронзы, она была украшена разноцветными камнями и четырьмя золотыми руками. \n \nИстория — Созданная для легендарного Гарта Златорукого в золотой век Простора, эта уникальная корона Гарденеров примечательна тем, что нарушала обычай парных корон и не имела военного аналога: её выковали в самый долгий и великий век мира и процветания Простора до завоевания Эйгона. \n \nКорона трагически исчезла в море вместе со своим последним носителем, королём Джоном III Гарденером, когда королевский корабль потерпел крушение у берегов Долины во время тогдашней войны Простора с Долиной. После этого сын Джона, король Мерин IV, выковал собственную корону — ту самую, что столетия спустя будет носить Мерн IX Гарденер, последний король Простора. \n \nОтдельно стоит отметить, что образ короны Гарта Златорукого, особенно множество украшавших её разноцветных изумрудов, как говорят, вдохновил короля Джейхейриса I Таргариена при создании его собственной короны."
 goldfyre_crown_name:0 "Корона Золотого Пламени"
 greenpyre_crown_name:0 "Корона Зелёного Костра"
 ntc_find_lost_crown_event.6.desc:0 "Как ни стыдно это признавать, я предпочитаю договориться о безопасном проходе через горы и не требовать утраченную корону. Вожак горного клана, явно наслаждаясь нашим унижением, мерзко ухмыляется и позволяет нам выторговать себе жизнь и свободный путь. \n\nПока мы идём дальше, я чувствую на себе неодобрительные взгляды своих людей. Они проклинают меня за то, что я [Select_CString(ROOT.Char.IsFemale, 'позволила', 'позволил')] легендарной древней короне великого короля Долины остаться в руках давних заклятых врагов нашего народа."
 ntc_find_lost_crown_event.7.a:0 "«[Select_CString(ROOT.Char.IsFemale, 'Рада', 'Рад')], что они всё же вняли разуму»"
 ntc_find_lost_crown_event.7.desc:0 "Когда мои люди поднимают оружие, [clansman_bandit.GetWomanMan] во главе врагов, кажется, теряет решимость и начинает настороженно коситься на нас. Понимая, что победа не достанется кланникам легко, [clansman_bandit.GetWomanMan] снимает с головы Утраченную корону Роланда Аррена и с гримасой протягивает её нам. \n\n«Похоже, сегодня ты [Select_CString(ROOT.Char.IsFemale, 'победила', 'победил')], андальский дьявол. Вот твоя проклятая корона». \n\nЯ улыбаюсь, чувствуя тяжесть короны в руках, и поднимаю её высоко, пока мои люди издают победный клич."
 ntc_find_lost_crown_event.8.desc:0 "Вокруг бушует хаос битвы, и я с ужасом понимаю: мои люди проигрывают! \n\nВнезапно бок пронзает резкая боль — в моём теле застряло лезвие топора. Кашляя кровью, я поднимаю взгляд и вижу, как [clansman_bandit.GetWomanMan] во главе кланников скалится леденящей кровь ухмылкой: «Сегодня ты умрёшь, андальский пёс!»\n\nЗрение темнеет, Неведомый уже готовится заключить меня в свои объятия, а я вижу, как последние мои люди отступают. Вожак кланников, с утраченной короной Роланда Аррена на голове, заносит топор для последнего удара."
