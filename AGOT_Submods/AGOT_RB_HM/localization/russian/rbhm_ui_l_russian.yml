l_russian:
 rbhm_main_upgrade_desc:0 "#T Улучшить главную постройку#!\nМгновенно улучшить главную постройку владения на один уровень. Цена — в десять раз выше базовой.\n\n#bold Улучшение:#!"
 rbhm_regular_build_desc:0 "#T Застроить владение#!\nМгновенно построить все доступные обычные здания из списка. Цена каждого — в десять раз выше базовой; недостающие ячейки — по 1000 @gold_icon! за каждую.\nИз взаимоисключающих вариантов выбран случайный совместимый набор. Выбор сохраняется для этого владения.\n\n#bold Будут построены:#!"
 rbhm_regular_upgrade_desc:0 "#T Улучшить обычные здания#!\nМгновенно улучшить перечисленные обычные здания на один уровень. Цена каждого — в десять раз выше базовой.\n\n#bold Будут улучшены:#!"
 rbhm_duchy_desc:0 "#T Герцогская постройка#!\nПостроить здание в герцогской ячейке или улучшить существующее на один уровень. Цена — в десять раз выше базовой. Если вариантов несколько, после нажатия откроется список выбора.\n\n#bold Доступные варианты:#!"
 rbhm_special_desc:0 "#T Особая постройка#!\nПостроить особое здание или улучшить существующее на один уровень. Цена — в десять раз выше базовой. Используется особая ячейка этого владения. Если вариантов несколько, после нажатия откроется список выбора.\n\n#bold Доступные варианты:#!"
 rbhm_great_desc:0 "#T Великая постройка#!\nПостроить великое здание или улучшить существующее на один уровень. Цена — десятикратная полная базовая цена проекта, включая все взносы. Владение получает здание и связанные с ним улучшения; события проекта и отдельные награды персонажам не выдаются.\n\n#bold Доступные варианты:#!"
 rbhm_total:0 "\n#bold Всего:#! [SCOPE.GetValue('rbhm_total_gold')|0] @gold_icon! · [SCOPE.GetValue('rbhm_total_prestige')|0] @prestige_icon! · [SCOPE.GetValue('rbhm_total_piety')|0] @piety_icon!\nНовых ячеек: [SCOPE.GetValue('rbhm_slot_count')|0] (включены в цену)."
 rbhm_conditions:0 "\nВсе требования зданий должны выполняться. Платит игрок. При нехватке ресурсов на весь список или во время текущего строительства действие недоступно."
 rbhm_choose:0 "Выберите постройку"
 rbhm_legacy_add_slot_tt:0 "#T Добавить строительную ячейку#!\nДобавить #P 1#! обычную строительную ячейку в этом владении.\n\nСтоимость: #bold 1000#! @gold_icon!\nДоступно в вашей державе, включая владения вассалов. Максимум обычных ячеек: 200."
