 setting_ACR_RE_tradition_cooldown_none_desc:0 "Культурные реформы можно проводить без обязательного перерыва."

 rule_ACR_RE_truce_duration:0 "ACR: Продолжительность перемирия"
 ACR_RE_truce_duration_desc:0 "Определяет продолжительность перемирий, выбранных правилом области действия перемирий."
 setting_ACR_RE_truce_duration_vanilla:0 "Стандартная (100%)"
 setting_ACR_RE_truce_duration_vanilla_desc:0 "Перемирия сохраняют стандартную продолжительность."
 setting_ACR_RE_truce_duration_75:0 "75% продолжительности"
 setting_ACR_RE_truce_duration_75_desc:0 "Подходящие перемирия длятся 75% от стандартной продолжительности."
 setting_ACR_RE_truce_duration_50:0 "50% продолжительности"
 setting_ACR_RE_truce_duration_50_desc:0 "Подходящие перемирия длятся 50% от стандартной продолжительности."
 setting_ACR_RE_truce_duration_25:0 "25% продолжительности"
 setting_ACR_RE_truce_duration_25_desc:0 "Подходящие перемирия длятся 25% от стандартной продолжительности."
 setting_ACR_RE_truce_duration_10:0 "10% продолжительности"
 setting_ACR_RE_truce_duration_10_desc:0 "Подходящие перемирия длятся 10% от стандартной продолжительности."
 setting_ACR_RE_truce_duration_5:0 "5% продолжительности"
 setting_ACR_RE_truce_duration_5_desc:0 "Подходящие перемирия длятся 5% от стандартной продолжительности."

 rule_ACR_RE_truce_scope:0 "ACR: Область действия перемирий"
 ACR_RE_truce_scope_desc:0 "Определяет, на какие войны распространяется правило продолжительности перемирия."
 setting_ACR_RE_truce_scope_all:0 "Все обычные перемирия"
 setting_ACR_RE_truce_scope_all_desc:0 "Выбранная продолжительность применяется ко всем обычным перемириям, возникающим после войн."
 setting_ACR_RE_truce_scope_player_primary:0 "Игрок — основная сторона войны"
 setting_ACR_RE_truce_scope_player_primary_desc:0 "Выбранная продолжительность применяется только к войнам, в которых игрок является основной атакующей или основной защищающейся стороной. Одного участия в качестве союзника недостаточно."

 rule_ACR_RE_council_task_speed:0 "ACR: Продолжительность заданий совета"
 ACR_RE_council_task_speed_desc:0 "Ограничивает продолжительность конечных заданий советников, служащих правителям-игрокам. Уже более короткие задания не удлиняются, а постоянные задания остаются постоянными."
 setting_ACR_RE_council_task_speed_vanilla:0 "Стандартное значение"
 setting_ACR_RE_council_task_speed_vanilla_desc:0 "Задания совета используют стандартную продолжительность."
