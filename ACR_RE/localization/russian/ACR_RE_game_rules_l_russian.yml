 rule_ACR_RE_culture_tradition_cost:0 "ACR: Стоимость культурных традиций"
 ACR_RE_culture_tradition_cost_desc:0 "Определяет стоимость принятия культурных традиций в престиже для культур, главой которых управляет игрок."
 setting_ACR_RE_tradition_cost_vanilla:0 "Стандартная (100%)"
 setting_ACR_RE_tradition_cost_vanilla_desc:0 "Культурные традиции сохраняют стандартную стоимость в престиже."
 setting_ACR_RE_tradition_cost_75:0 "75% стоимости"
 setting_ACR_RE_tradition_cost_75_desc:0 "Культурные традиции стоят 75% от стандартной стоимости в престиже."
 setting_ACR_RE_tradition_cost_50:0 "50% стоимости"
 setting_ACR_RE_tradition_cost_50_desc:0 "Культурные традиции стоят 50% от стандартной стоимости в престиже."
 setting_ACR_RE_tradition_cost_25:0 "25% стоимости"
 setting_ACR_RE_tradition_cost_25_desc:0 "Культурные традиции стоят 25% от стандартной стоимости в престиже."
 setting_ACR_RE_tradition_cost_10:0 "10% стоимости"
 setting_ACR_RE_tradition_cost_10_desc:0 "Культурные традиции стоят 10% от стандартной стоимости в престиже."
 setting_ACR_RE_tradition_cost_free:0 "Бесплатно"
 setting_ACR_RE_tradition_cost_free_desc:0 "Принятие культурных традиций не требует престижа."

 rule_ACR_RE_culture_tradition_cooldown:0 "ACR: Перерыв между культурными реформами"
 ACR_RE_culture_tradition_cooldown_desc:0 "Ограничивает время ожидания между культурными реформами для культур, главой которых управляет игрок."
 setting_ACR_RE_tradition_cooldown_vanilla:0 "Стандартное значение"
 setting_ACR_RE_tradition_cooldown_vanilla_desc:0 "Между культурными реформами действует стандартный перерыв."
 setting_ACR_RE_tradition_cooldown_25_years:0 "Не более 25 лет"
 setting_ACR_RE_tradition_cooldown_25_years_desc:0 "Перерыв между культурными реформами не может превышать 25 лет."
 setting_ACR_RE_tradition_cooldown_10_years:0 "Не более 10 лет"
