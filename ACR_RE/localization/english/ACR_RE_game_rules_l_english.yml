l_english:
 rule_ACR_RE_culture_tradition_slots:0 "ACR: Cultural Tradition Slots"
 ACR_RE_culture_tradition_slots_desc:0 "Determines how many additional cultural tradition slots are available to every culture."
 setting_ACR_RE_tradition_slots_vanilla:0 "Vanilla"
 setting_ACR_RE_tradition_slots_vanilla_desc:0 "Cultures use the vanilla number of tradition slots."
 setting_ACR_RE_tradition_slots_plus_5:0 "+5 Slots"
 setting_ACR_RE_tradition_slots_plus_5_desc:0 "Every culture receives 5 additional cultural tradition slots."
 setting_ACR_RE_tradition_slots_plus_10:0 "+10 Slots"
 setting_ACR_RE_tradition_slots_plus_10_desc:0 "Every culture receives 10 additional cultural tradition slots."
 setting_ACR_RE_tradition_slots_plus_15:0 "+15 Slots"
 setting_ACR_RE_tradition_slots_plus_15_desc:0 "Every culture receives 15 additional cultural tradition slots."
 setting_ACR_RE_tradition_slots_plus_45:0 "+45 Slots"
 setting_ACR_RE_tradition_slots_plus_45_desc:0 "Every culture receives 45 additional cultural tradition slots."
 setting_ACR_RE_tradition_slots_plus_95:0 "+95 Slots"
 setting_ACR_RE_tradition_slots_plus_95_desc:0 "Every culture receives 95 additional cultural tradition slots."

 rule_ACR_RE_culture_tradition_cost:0 "ACR: Cultural Tradition Cost"
 ACR_RE_culture_tradition_cost_desc:0 "Determines the Prestige cost of establishing cultural traditions for cultures whose cultural head is controlled by a player."
 setting_ACR_RE_tradition_cost_vanilla:0 "Vanilla (100%)"
 setting_ACR_RE_tradition_cost_vanilla_desc:0 "Cultural traditions retain their vanilla Prestige cost."
 setting_ACR_RE_tradition_cost_75:0 "75% Cost"
 setting_ACR_RE_tradition_cost_75_desc:0 "Cultural traditions cost 75% of their vanilla Prestige cost."
 setting_ACR_RE_tradition_cost_50:0 "50% Cost"
 setting_ACR_RE_tradition_cost_50_desc:0 "Cultural traditions cost 50% of their vanilla Prestige cost."
 setting_ACR_RE_tradition_cost_25:0 "25% Cost"
 setting_ACR_RE_tradition_cost_25_desc:0 "Cultural traditions cost 25% of their vanilla Prestige cost."
 setting_ACR_RE_tradition_cost_10:0 "10% Cost"
 setting_ACR_RE_tradition_cost_10_desc:0 "Cultural traditions cost 10% of their vanilla Prestige cost."
 setting_ACR_RE_tradition_cost_free:0 "Free"
 setting_ACR_RE_tradition_cost_free_desc:0 "Establishing cultural traditions costs no Prestige."

 rule_ACR_RE_culture_tradition_cooldown:0 "ACR: Cultural Reform Cooldown"
 ACR_RE_culture_tradition_cooldown_desc:0 "Limits the cooldown between cultural reforms for cultures whose cultural head is controlled by a player."
 setting_ACR_RE_tradition_cooldown_vanilla:0 "Vanilla"
 setting_ACR_RE_tradition_cooldown_vanilla_desc:0 "Cultural reforms use the vanilla cooldown."
 setting_ACR_RE_tradition_cooldown_25_years:0 "At Most 25 Years"
 setting_ACR_RE_tradition_cooldown_25_years_desc:0 "The cooldown between cultural reforms cannot exceed 25 years."
 setting_ACR_RE_tradition_cooldown_10_years:0 "At Most 10 Years"
 setting_ACR_RE_tradition_cooldown_10_years_desc:0 "The cooldown between cultural reforms cannot exceed 10 years."
 setting_ACR_RE_tradition_cooldown_5_years:0 "At Most 5 Years"
 setting_ACR_RE_tradition_cooldown_5_years_desc:0 "The cooldown between cultural reforms cannot exceed 5 years."
 setting_ACR_RE_tradition_cooldown_1_year:0 "At Most 1 Year"
 setting_ACR_RE_tradition_cooldown_1_year_desc:0 "The cooldown between cultural reforms cannot exceed 1 year."
 setting_ACR_RE_tradition_cooldown_none:0 "No Cooldown"
 setting_ACR_RE_tradition_cooldown_none_desc:0 "Cultural reforms have no cooldown."

 rule_ACR_RE_truce_duration:0 "ACR: Truce Duration"
 ACR_RE_truce_duration_desc:0 "Determines the duration of truces covered by the Truce Scope rule."
 setting_ACR_RE_truce_duration_vanilla:0 "Vanilla (100%)"
 setting_ACR_RE_truce_duration_vanilla_desc:0 "Truces retain their vanilla duration."
 setting_ACR_RE_truce_duration_75:0 "75% Duration"
 setting_ACR_RE_truce_duration_75_desc:0 "Applicable truces last 75% of their vanilla duration."
 setting_ACR_RE_truce_duration_50:0 "50% Duration"
 setting_ACR_RE_truce_duration_50_desc:0 "Applicable truces last 50% of their vanilla duration."
 setting_ACR_RE_truce_duration_25:0 "25% Duration"
 setting_ACR_RE_truce_duration_25_desc:0 "Applicable truces last 25% of their vanilla duration."
 setting_ACR_RE_truce_duration_10:0 "10% Duration"
 setting_ACR_RE_truce_duration_10_desc:0 "Applicable truces last 10% of their vanilla duration."
 setting_ACR_RE_truce_duration_5:0 "5% Duration"
 setting_ACR_RE_truce_duration_5_desc:0 "Applicable truces last 5% of their vanilla duration."

 rule_ACR_RE_truce_scope:0 "ACR: Truce Scope"
 ACR_RE_truce_scope_desc:0 "Determines which wars are affected by the Truce Duration rule."
 setting_ACR_RE_truce_scope_all:0 "All Standard Truces"
 setting_ACR_RE_truce_scope_all_desc:0 "The selected duration applies to all standard truces created after wars."
 setting_ACR_RE_truce_scope_player_primary:0 "Player as a Primary Belligerent"
 setting_ACR_RE_truce_scope_player_primary_desc:0 "The selected duration applies only to wars in which a player is the primary attacker or primary defender. Participation as an ally alone does not qualify."

 rule_ACR_RE_council_task_speed:0 "ACR: Council Task Duration"
 ACR_RE_council_task_speed_desc:0 "Limits the duration of finite council tasks performed for player-controlled rulers. Tasks that are already shorter are not lengthened, and continuous tasks remain continuous."
 setting_ACR_RE_council_task_speed_vanilla:0 "Vanilla"
 setting_ACR_RE_council_task_speed_vanilla_desc:0 "Council tasks use their vanilla duration."
 setting_ACR_RE_council_task_speed_1_year:0 "At Most 1 Year"
 setting_ACR_RE_council_task_speed_1_year_desc:0 "Finite council tasks for player-controlled rulers take no longer than 1 year."
 setting_ACR_RE_council_task_speed_6_months:0 "At Most 6 Months"
 setting_ACR_RE_council_task_speed_6_months_desc:0 "Finite council tasks for player-controlled rulers take no longer than 6 months."
 setting_ACR_RE_council_task_speed_3_months:0 "At Most 3 Months"
 setting_ACR_RE_council_task_speed_3_months_desc:0 "Finite council tasks for player-controlled rulers take no longer than 3 months."
 setting_ACR_RE_council_task_speed_1_month:0 "At Most 1 Month"
 setting_ACR_RE_council_task_speed_1_month_desc:0 "Finite council tasks for player-controlled rulers take no longer than 1 month."
