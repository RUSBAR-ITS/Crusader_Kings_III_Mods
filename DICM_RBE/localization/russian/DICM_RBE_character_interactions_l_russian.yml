l_russian:
 # Character interactions
 DICM_RBE_genetic_modification_interaction: "#color_yellow #bold (DICM RBE)#!#! Генная модификация"
 DICM_RBE_genetic_modification_interaction_desc: "Выбрать процедуру изменения генетических черт этого персонажа. Навыки персонажа не изменяются."
 DICM_RBE_genetic_modification_option: "Генная модификация"
 DICM_RBE_genetic_correction_option: "Генная коррекция"
 # Flag settings
 DICM_RBE_flag_settings_interaction: "#color_yellow #bold (DICM RBE)#!#! Настройка Флагов"
 DICM_RBE_flag_settings_interaction_desc: "Открыть настройки автоматизации Divine Intervention RUSBAR Extension."
 DICM_RBE_flag_settings_window_title: "Настройка флагов DICM RBE"
 DICM_RBE_flag_settings_global_heading: "Глобальные механики"
 DICM_RBE_flag_settings_character_heading: "Текущий персонаж"
 DICM_RBE_custom_character_generation_setting: "Расширенная генерация персонажей"
 DICM_RBE_custom_character_generation_setting_tt: "Использовать профили DICM RBE и заданные базовые навыки при создании советников, рыцарей, командиров и персонажей для придворных должностей. Если настройка выключена, используется оригинальная генерация Divine Intervention Cheat Menu."
 DICM_RBE_outstanding_people_setting: "Выдающиеся люди"
 DICM_RBE_outstanding_people_setting_tt: "Ежемесячно проверять только персонажей игроков. Полностью освоенный жизненный путь получает особое звание, перестаёт приносить опыт и лишается оставшихся нераспределённых очков этого пути."
 DICM_RBE_ceasar_child_inheritance_setting: "Генетическое наследование детей Цезаря"
 DICM_RBE_ceasar_child_inheritance_setting_tt: "Позволить подходящим детям двух родителей линии Цезаря наследовать модификатор ребёнка Цезаря."
 DICM_RBE_loyalty_curse_setting: "Проклятие верности"
 DICM_RBE_loyalty_curse_setting_tt: "Обрабатывать подходящих персонажей после ухода из двора или державы Цезаря. Дети Цезаря исключены."
 DICM_RBE_administrative_retraining_setting: "Административная переподготовка"
 DICM_RBE_administrative_retraining_setting_tt: "Обрабатывать подходящих персонажей, когда они становятся землевладельцами на любом уровне под властью Цезаря. Цезарь, Царица, их супруги и дети исключены."
 DICM_RBE_eternal_wet_nurse_setting: "Вечная кормилица"
 DICM_RBE_eternal_wet_nurse_setting_tt: "Если персонаж с модификатором «Царская Кормилица» достигает возраста 45 лет, на следующий день уменьшить её фактический возраст ровно на 29 лет: до 16 лет и одного дня."
 DICM_RBE_sodom_and_gomorrah_setting: "Содом и Гоморра"
 DICM_RBE_sodom_and_gomorrah_setting_tt: "При подготовке персонажа к придворной должности заменять Благонравие на Похоть, если Похоть не снижает пригодность. Взаимоисключается с «Химической стерилизацией»."
 DICM_RBE_chemical_sterilization_setting: "Химическая стерилизация"
 DICM_RBE_chemical_sterilization_setting_tt: "При подготовке персонажа к придворной должности заменять Похоть на Благонравие, если Благонравие не снижает пригодность. Взаимоисключается с «Содомом и Гоморрой»."
 DICM_RBE_pious_dynasty_setting: "Благочестивая династия"
 DICM_RBE_pious_dynasty_setting_tt: "Заменять Похоть на Благонравие при семейном переобучении или автоматической обработке совершеннолетнего персонажа линии Цезаря. Взаимоисключается с настройкой «Бастардов много не бывает»."
 DICM_RBE_never_too_many_bastards_setting: "Бастардов много не бывает"
 DICM_RBE_never_too_many_bastards_setting_tt: "Заменять Благонравие на Похоть при семейном переобучении или автоматической обработке совершеннолетнего персонажа линии Цезаря. Взаимоисключается с настройкой «Благочестивая династия»."
 DICM_RBE_instant_fascination_progress_setting: "Мгновенное развитие инновации"
 DICM_RBE_instant_fascination_progress_setting_tt: "Завершать выбранную культурную инновацию при ежемесячной проверке для текущего персонажа."
 # Charioteer color selector
 DICM_RBE_charioteer_color_window_title: "Цвет колесничего"
 DICM_RBE_charioteer_color_prompt: "Выберите цирковую партию колесничего:"
 DICM_RBE_charioteer_blue: "Синие"
 DICM_RBE_charioteer_green: "Зелёные"
 DICM_RBE_charioteer_white: "Белые"
 DICM_RBE_charioteer_red: "Красные"
 DICM_RBE_charioteer_spawn_confirm: "Создать колесничего"
