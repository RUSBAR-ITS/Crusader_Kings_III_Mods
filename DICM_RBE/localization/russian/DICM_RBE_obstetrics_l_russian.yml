l_russian:
 DICM_RBE_obstetrics_clinic_interaction: "#color_yellow #bold (DICM RBE)#!#! Клиника акушерства и гинекологии"
 DICM_RBE_obstetrics_clinic_interaction_desc: "Провести обследование выбранного персонажа, получить доступные сведения о беременности и, когда это безопасно, изменить сценарий родов."
 DICM_RBE_obstetrics_window_title: "Клиника акушерства и гинекологии DICM RBE"
 DICM_RBE_obstetrics_patient_heading: "Обследуемый персонаж:"
 DICM_RBE_obstetrics_diagnosis_heading: "Заключение клиники"
 DICM_RBE_obstetrics_male_joke: "Беременность не обнаружена. Пациент героически перенёс осмотр и получил строгую рекомендацию не пытаться исправить диагноз самостоятельно."
 DICM_RBE_obstetrics_not_pregnant: "Беременность не зафиксирована. Клиника рекомендует повторное обследование после появления более убедительных симптомов."
 DICM_RBE_obstetrics_pregnancy_confirmed: "Беременность подтверждена"
 DICM_RBE_obstetrics_elapsed_days_label: "Текущий срок:"
 DICM_RBE_obstetrics_of_280_days: "из 280 дней"
 DICM_RBE_obstetrics_remaining_days_label: "Ориентировочно до родов:"
 DICM_RBE_obstetrics_days_suffix: "дней"
 DICM_RBE_obstetrics_not_revealed: "Беременность находится на раннем сроке: стандартный сценарий родов ещё не определён."
 DICM_RBE_obstetrics_real_father_label: "Биологический отец:"
 DICM_RBE_obstetrics_assumed_father_label: "Предполагаемый отец:"
 DICM_RBE_obstetrics_no_assumed_father: "Предполагаемый отец: не назначен"
 DICM_RBE_obstetrics_bastard_status: "Статус происхождения: беременность отмечена как внебрачная"
 DICM_RBE_obstetrics_legitimate_status: "Статус происхождения: признаков внебрачной беременности не обнаружено"
 DICM_RBE_obstetrics_fetus_count_unavailable: "Количество детей: достоверно определить до родов невозможно"
 DICM_RBE_obstetrics_fetus_gender_unavailable: "Пол детей: достоверно определить до родов невозможно"
 DICM_RBE_obstetrics_scenario_heading: "Текущий сценарий родов"
 DICM_RBE_obstetrics_scenario_not_selected: "Ещё не выбран: сценарий определяется примерно на 60-й день беременности."
 DICM_RBE_obstetrics_scenario_smooth: "Роды пройдут без особых осложнений."
 DICM_RBE_obstetrics_scenario_sickly_child: "Ребёнок родится болезненным."
 DICM_RBE_obstetrics_scenario_ill_mother: "После родов мать заболеет."
 DICM_RBE_obstetrics_scenario_mother_dies: "Мать погибнет при родах, ребёнок выживет."
 DICM_RBE_obstetrics_scenario_deferred_critical: "Обнаружен отложенный критический сценарий: выкидыш, гибель ребёнка либо гибель матери и ребёнка. Движок не раскрывает его точный тип, но клиника может перехватить событие и заменить его выбранным сценарием."
 DICM_RBE_obstetrics_editing_explanation: "После определения сценария клиника может заменить как обычный исход, так и уже поставленное в очередь критическое событие. До 60-го дня беременности кнопки заблокированы: исход ещё не выбран игрой."
 DICM_RBE_obstetrics_choose_smooth: "Без осложнений"
 DICM_RBE_obstetrics_choose_smooth_tt: "Заменить текущий сценарий, включая отложенный критический исход, на обычные роды без особых осложнений."
 DICM_RBE_obstetrics_choose_sickly_child: "Болезненный ребёнок"
 DICM_RBE_obstetrics_choose_sickly_child_tt: "Заменить текущий редактируемый сценарий: ребёнок родится болезненным."
 DICM_RBE_obstetrics_choose_ill_mother: "Болезнь матери"
 DICM_RBE_obstetrics_choose_ill_mother_tt: "Заменить текущий редактируемый сценарий: после родов мать заболеет."
 DICM_RBE_obstetrics_choose_mother_dies: "Гибель матери"
 DICM_RBE_obstetrics_choose_mother_dies_tt: "Заменить текущий редактируемый сценарий: мать погибнет при родах, а ребёнок выживет. Это намеренно опасный выбор."
 DICM_RBE_obstetrics_close: "Закрыть клинику"
