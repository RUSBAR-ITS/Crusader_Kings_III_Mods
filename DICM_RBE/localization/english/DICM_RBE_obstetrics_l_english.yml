l_english:
 DICM_RBE_obstetrics_clinic_interaction: "#color_yellow #bold (DICM RBE)#!#! Obstetrics and Gynecology Clinic"
 DICM_RBE_obstetrics_clinic_interaction_desc: "Examine the selected character, view all pregnancy information exposed by the engine, and alter the birth scenario whenever doing so is safe."
 DICM_RBE_obstetrics_window_title: "DICM RBE Obstetrics and Gynecology Clinic"
 DICM_RBE_obstetrics_patient_heading: "Patient:"
 DICM_RBE_obstetrics_diagnosis_heading: "Clinical assessment"
 DICM_RBE_obstetrics_male_joke: "No pregnancy detected. The patient heroically survived the examination and was firmly advised not to attempt correcting the diagnosis on his own."
 DICM_RBE_obstetrics_not_pregnant: "No pregnancy has been detected. The clinic recommends another examination once more persuasive symptoms appear."
 DICM_RBE_obstetrics_pregnancy_confirmed: "Pregnancy confirmed"
 DICM_RBE_obstetrics_elapsed_days_label: "Current term:"
 DICM_RBE_obstetrics_of_280_days: "of 280 days"
 DICM_RBE_obstetrics_remaining_days_label: "Estimated time until delivery:"
 DICM_RBE_obstetrics_days_suffix: "days"
 DICM_RBE_obstetrics_not_revealed: "This is an early pregnancy: the standard birth scenario has not yet been selected."
 DICM_RBE_obstetrics_real_father_label: "Biological father:"
 DICM_RBE_obstetrics_assumed_father_label: "Assumed father:"
 DICM_RBE_obstetrics_no_assumed_father: "Assumed father: none"
 DICM_RBE_obstetrics_bastard_status: "Parentage status: the pregnancy is marked as extramarital"
 DICM_RBE_obstetrics_legitimate_status: "Parentage status: no extramarital pregnancy markers detected"
 DICM_RBE_obstetrics_fetus_count_unavailable: "Number of children: cannot be determined reliably before birth"
 DICM_RBE_obstetrics_fetus_gender_unavailable: "Sex of the children: cannot be determined reliably before birth"
 DICM_RBE_obstetrics_scenario_heading: "Current birth scenario"
 DICM_RBE_obstetrics_scenario_not_selected: "Not selected yet: the scenario is normally determined around pregnancy day 60."
 DICM_RBE_obstetrics_scenario_smooth: "The birth will proceed without special complications."
 DICM_RBE_obstetrics_scenario_sickly_child: "The child will be born sickly."
 DICM_RBE_obstetrics_scenario_ill_mother: "The mother will become ill after giving birth."
 DICM_RBE_obstetrics_scenario_mother_dies: "The mother will die in childbirth and the child will survive."
 DICM_RBE_obstetrics_scenario_deferred_critical: "A delayed critical scenario was detected: miscarriage, death of the child, or death of both mother and child. The engine does not expose its exact type, but the clinic can intercept the event and replace it with the selected scenario."
 DICM_RBE_obstetrics_editing_explanation: "Once the outcome has been determined, the clinic can replace either an ordinary scenario or an already queued critical event. The buttons remain disabled before pregnancy day 60 because the game has not selected an outcome yet."
 DICM_RBE_obstetrics_choose_smooth: "No complications"
 DICM_RBE_obstetrics_choose_smooth_tt: "Replace the current scenario, including a delayed critical outcome, with an ordinary birth without special complications."
 DICM_RBE_obstetrics_choose_sickly_child: "Sickly child"
 DICM_RBE_obstetrics_choose_sickly_child_tt: "Replace the current editable scenario so that the child is born sickly."
 DICM_RBE_obstetrics_choose_ill_mother: "Mother becomes ill"
 DICM_RBE_obstetrics_choose_ill_mother_tt: "Replace the current editable scenario so that the mother becomes ill after giving birth."
 DICM_RBE_obstetrics_choose_mother_dies: "Mother dies"
 DICM_RBE_obstetrics_choose_mother_dies_tt: "Replace the current editable scenario so that the mother dies in childbirth while the child survives. This is intentionally dangerous."
 DICM_RBE_obstetrics_close: "Close clinic"
