l_english:
 # Character interactions
 DICM_RBE_genetic_modification_interaction: "#color_yellow #bold (DICM RBE)#!#! Genetic Modification"
 DICM_RBE_genetic_modification_interaction_desc: "Choose a procedure for changing this character's genetic traits. The character's skills are not changed."
 DICM_RBE_genetic_modification_option: "Genetic Modification"
 DICM_RBE_genetic_correction_option: "Genetic Correction"
 # Flag settings
 DICM_RBE_flag_settings_interaction: "#color_yellow #bold (DICM RBE)#!#! Flag Settings"
 DICM_RBE_flag_settings_interaction_desc: "Open the Divine Intervention RUSBAR Extension automation settings."
