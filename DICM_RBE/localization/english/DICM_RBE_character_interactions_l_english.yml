 DICM_RBE_eternal_wet_nurse_setting: "Eternal Wet Nurse"
 DICM_RBE_eternal_wet_nurse_setting_tt: "When a character with the Wet Nurse of the True Sovereign modifier reaches age 45, reduce her chronological age by exactly 29 years on the following day: to age 16 years and one day."
 DICM_RBE_sodom_and_gomorrah_setting: "Sodom and Gomorrah"
 DICM_RBE_sodom_and_gomorrah_setting_tt: "Replace Chaste with Lustful when preparing a character for a court position, unless Lustful reduces aptitude. Mutually exclusive with Chemical Sterilization."
 DICM_RBE_chemical_sterilization_setting: "Chemical Sterilization"
 DICM_RBE_chemical_sterilization_setting_tt: "Replace Lustful with Chaste when preparing a character for a court position, unless Chaste reduces aptitude. Mutually exclusive with Sodom and Gomorrah."
 DICM_RBE_pious_dynasty_setting: "Pious Dynasty"
 DICM_RBE_pious_dynasty_setting_tt: "Replace Lustful with Chaste whenever Caesar-family retraining or automation processes a character. Mutually exclusive with There Are Never Too Many Bastards."
 DICM_RBE_never_too_many_bastards_setting: "There Are Never Too Many Bastards"
 DICM_RBE_never_too_many_bastards_setting_tt: "Replace Chaste with Lustful whenever Caesar-family retraining or automation processes a character. Mutually exclusive with Pious Dynasty."
 DICM_RBE_instant_fascination_progress_setting: "Instant Fascination Progress"
 DICM_RBE_instant_fascination_progress_setting_tt: "Complete the current cultural fascination during its monthly maintenance check for the current character."
